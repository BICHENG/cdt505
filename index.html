活动；S为开始，F为完成，d为工期。", "formula": "F=S+d。FS比较Fᵢ与Sⱼ；SS比较Sᵢ与Sⱼ；FF比较Fᵢ与Fⱼ；SF比较Sᵢ与Fⱼ。", "example": "安装开始2天后才可检查，对应SS+2，因为比较两个开始时间。", "pitfall": "关系规定不能早于的时间，不一定要求恰好同时发生。关系FF与Free Float自由时差的FF含义不同。", "topic": "5.2", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "terms": [], "tables": [], "formulae": []}, {"id": "rel-fs", "title": "Finish-to-Start（FS）· 完成-开始", "lesson": 14, "definition": "I完成后，J才能开始。正滞后要求在I完成后额外等待。", "formula": "Sⱼ≥Fᵢ+L=Sᵢ+dᵢ+L。", "example": "刷墙从0到2，FS+1后安装指路牌：安装最早从3开始。", "pitfall": "J的工期不改变这个开始下界，只影响J的完成时间。", "topic": "5.2", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "terms": [], "tables": [], "formulae": []}, {"id": "rel-ss", "title": "Start-to-Start（SS）· 开始-开始", "lesson": 15, "definition": "J不能早于I开始；有正滞后时，需要从I开始再等待L。", "formula": "Sⱼ≥Sᵢ+L。", "example": "安装从0开始，SS+2后开始检查：检查最早从2开始。", "pitfall": "SS+0允许同时开始，也允许后续更晚开始；仅有SS不能保证两项工作的完成顺序。", "topic": "5.2", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "terms": [], "tables": [], "formulae": []}, {"id": "rel-ff", "title": "Finish-to-Finish（FF）· 完成-完成", "lesson": 16, "definition": "J的完成不能早于I的完成加上L。为求J的开始时间，需要减去J的工期。", "formula": "Fⱼ≥Fᵢ+L；Sⱼ≥Fᵢ+L−dⱼ。", "example": "安装在6完成，检查需3天，FF+0允许检查最早从3到6。", "pitfall": "FF限制完成，FS限制开始；不能把同一个时间直接同时填作两种关系的开始时间。", "topic": "5.2", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "terms": [], "tables": [], "formulae": []}, {"id": "rel-sf", "title": "Start-to-Finish（SF）· 开始-完成", "lesson": 17, "definition": "I开始后，J才允许结束。常见于需要维持服务的交接安排。", "formula": "Fⱼ≥Sᵢ+L；Sⱼ≥Sᵢ+L−dⱼ。", "example": "新班在8开始，旧班需4小时，SF+0允许旧班从4到8；SF+1则最早从5到9。", "pitfall": "J可能在I之前开工。箭头表示谁为谁提供条件，不单由实际开工先后决定。", "topic": "5.2", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "terms": [], "tables": [], "formulae": []}, {"id": "rel-offset", "title": "Lead / Lag · 提前量与滞后量", "lesson": 18, "definition": "正L表示指定时间之间至少保留的滞后，负L表示允许提前的量。工期与L分别记录。", "formula": "FS−2：Sⱼ≥Fᵢ−2；FS+2：Sⱼ≥Fᵢ+2。", "example": "安装从0到6，检查需3天，FS−2允许检查从4到7，两个工期均不改变。", "pitfall": "同样的数字放在FS或SS后，分别从完成或开始计算，不能互换。提前安排需要有可以分批或重叠工作的实际条件。", "topic": "5.2", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "terms": [], "tables": [], "formulae": []}, {"id": "rel-combine", "title": "多个关系的合并", "lesson": 19, "definition": "将每个前置条件换成J的开始时间下界，然后取最大值。还要满足项目起点等其他下界。", "formula": "Sⱼ≥max(Fᵢ+L_FS，Sₖ+L_SS，Fₘ+L_FF−dⱼ，Sₙ+L_SF−dⱼ，0)。只代入实际存在的条件。", "example": "检查需2天；FF条件给出开始≥8−2=6，FS条件给出开始≥5+2=7，因此最早从7到9。", "pitfall": "先转换成同一种时间再比较；不能把完成下界与开始下界直接放在一起取max。", "topic": "5.2", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "terms": [], "tables": [], "formulae": []}, {"id": "r-scope-needs", "title": "Requirement 需求", "definition": "项目或成果为了满足相关方需要而必须具备的条件或能力。", "formula": "可验证表达：对象＋指标＋阈值＋验证条件。", "example": "两台终端同时使用、各测试50次，至少95%的取号请求在2秒内返回。", "pitfall": "功能回答能做什么；非功能要求回答在什么条件下达到怎样的表现。", "lesson": 21, "topic": "4.1", "source": "Lecture 3 · 需求与范围，PDF第8–19页", "terms": [["Requirement", "需求", "为了满足相关方的需要，项目或交付成果必须具备的条件或能力。需求既可以描述功能，也可以描述性能、准备工作和管理要求。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>需求类型<\/th><th>医院例子<\/th><\/tr><\/thead><tbody><tr><td>Business requirement 业务需求<\/td><td>缩短患者到院后寻找服务窗口的时间。<\/td><\/tr><tr><td>Stakeholder requirement 利益相关者需求<\/td><td>接待人员能够查看当前等候人数。<\/td><\/tr><tr><td>Functional requirement 功能需求<\/td><td>患者可以领取号码，并在屏幕查看叫号。<\/td><\/tr><tr><td>Non-functional requirement 非功能需求<\/td><td>在规定负载下，叫号信息在2秒内更新。<\/td><\/tr><tr><td>Transition requirement 过渡需求<\/td><td>开放前完成接待人员培训和旧资料迁移。<\/td><\/tr><tr><td>Project / Quality requirement 项目／质量需求<\/td><td>每周提交进度记录；设备通过约定的验收测试。<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-scope-boundary", "title": "Product Scope / Project Scope 产品范围／项目范围", "definition": "产品范围是功能特性；项目范围是实现这些特性需要完成的工作。", "formula": "范围说明：描述、交付物、验收标准、排除项、约束、假设。", "example": "多语言提示是产品特性；配置、测试和培训属于项目工作。", "pitfall": "约束是必须遵守的限制；假设是需要验证的规划前提。", "lesson": 22, "topic": "4.1", "source": "Lecture 3 · PDF第8–11、21–25页", "terms": [["Product Scope / Project Scope", "产品范围／项目范围", "产品范围描述成果的功能和特性；项目范围描述为了交付这些功能和特性而需要完成的工作。"], ["Project Scope Statement", "项目范围说明书", "对交付成果、验收标准、排除项、约束和假设作出明确说明，使参与者能据此判断某项要求是否属于当前项目。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>内容<\/th><th>产品范围<\/th><th>项目范围<\/th><\/tr><\/thead><tbody><tr><td>医院接待区<\/td><td>两台取号终端、叫号显示、多语言提示<\/td><td>采购终端、安装接线、配置提示、测试并培训<\/td><\/tr><tr><td>范围排除项<\/td><td>本次不提供网上预约<\/td><td>本次不开展网上预约系统的开发和部署<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-scope-baseline", "title": "Scope Baseline 范围基线", "definition": "经批准、供执行与控制使用的范围依据。", "formula": "范围基线＝范围说明书＋WBS＋WBS词典。", "example": "增加一个服务窗口，先评估并批准，再更新涉及的范围、进度和预算。", "pitfall": "基线允许受控变更；不能不断覆盖原计划而失去批准记录。", "lesson": 23, "topic": "4.1", "source": "Lecture 3 · PDF第21–26页", "terms": [["Scope Baseline", "范围基线", "经批准的项目范围说明书、WBS和WBS词典。它提供执行与检查时共同使用的范围依据。"], ["Scope Management", "范围管理", "规划范围管理、收集需求、定义范围、创建WBS、确认范围和控制范围，共同维护项目应完成的工作。确认范围是正式接受已完成成果，控制范围则贯穿执行过程。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>组成部分<\/th><th>说明什么<\/th><th>接待区例子<\/th><\/tr><\/thead><tbody><tr><td>范围说明书<\/td><td>要交付什么，满足哪些条件<\/td><td>开放一楼接待区，提供取号和叫号服务<\/td><\/tr><tr><td>WBS，工作分解结构<\/td><td>范围怎样分成可管理的部分<\/td><td>设备、指路牌、开放准备和项目管理<\/td><\/tr><tr><td>WBS Dictionary，WBS词典<\/td><td>各部分的详细内容与边界<\/td><td>指路牌的地点、数量、语言、负责人及验收要求<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-wbs-structure", "title": "WBS 工作分解结构", "definition": "按层级分解项目全部工作，支持估算、分派与控制。", "formula": "父项范围由其子项完整且无重复地覆盖。", "example": "接待区分为项目管理、可用设备、已安装指路牌、开放准备。", "pitfall": "WBS表示包含关系；网络图表示活动依赖。", "lesson": 24, "topic": "4.1", "source": "Lecture 3 · PDF第24、27–40页", "terms": [["Work Breakdown Structure (WBS)", "工作分解结构", "把项目全部工作分解为较小、可管理部分的层级结构。每个子项进一步说明父项包含的范围。这里按交付成果组织接待区项目。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>层级<\/th><th>编号与名称<\/th><th>包含内容<\/th><\/tr><\/thead><tbody><tr><td>项目<\/td><td>1 接待区开放准备<\/td><td>本次接待区项目全部范围<\/td><\/tr><tr><td>主要部分<\/td><td>1.1 项目管理；1.2 可用设备；1.3 已安装指路牌；1.4 开放准备<\/td><td>分别管理、交付设备、交付标牌、准备投入使用<\/td><\/tr><tr><td>工作包示例<\/td><td>1.3.1 指路牌图样；1.3.2 已制作并安装的指路牌<\/td><td>进一步明确图样和现场成果<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-wbs-coverage", "title": "100% Rule 范围覆盖规则", "definition": "子项完整覆盖父项，同一工作不重复计入。", "formula": "检查顺序：批准范围→遗漏→重复→父子归属→可分派程度。", "example": "人员培训属于批准范围，即使不采购实物也需要纳入。", "pitfall": "100%不是预算花完，也不意味着每个分支平均分配。", "lesson": 25, "topic": "4.1", "source": "Lecture 3 · PDF第27–40页", "terms": [["100% Rule", "100%规则", "每一层子项合计覆盖父项的全部范围，同一工作只计一次。100%指范围覆盖，不要求把所有工作换算成百分比或平均分配。"]], "tables": [], "formulae": []}, {"id": "r-wbs-package", "title": "Work Package / WBS Dictionary 工作包／词典", "definition": "工作包是最低层可管理工作单元；词典说明其具体边界与控制信息。", "formula": "至少明确：做什么、交付什么、谁负责、资源与估算、如何验收。", "example": "6块双语指路牌的制作安装包，排除已由设计包负责的图样设计。", "pitfall": "只写工作包名称，不能代替词典中的详细说明；分解深度也不是越深越好。", "lesson": 26, "topic": "4.1", "source": "Lecture 3 · PDF第25–26、29–30页", "terms": [["Work Package", "工作包", "WBS最低层能够分派、估算和控制的工作单元。一个工作包需要有清楚的成果和边界，例如交出六块按批准图样制作并安装好的指路牌。"], ["WBS Dictionary", "WBS词典", "对WBS中各工作包的详细说明。词典把树图里放不下的范围、责任、资源、估算和验收要求写清，使执行者和接受者按同一理解工作。下面是一份词典条目的例子。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>词典字段<\/th><th>1.3.2 指路牌制作与安装<\/th><\/tr><\/thead><tbody><tr><td>范围与成果<\/td><td>按已确认图样制作并安装6块双语指路牌<\/td><\/tr><tr><td>包含与排除<\/td><td>包含制作、固定和现场核对；图样设计由1.3.1负责<\/td><\/tr><tr><td>责任与资源<\/td><td>现场负责人协调；制作商和安装人员执行<\/td><\/tr><tr><td>估算与依赖<\/td><td>预计2天；须先取得确认图样和可安装的墙面<\/td><\/tr><tr><td>验收条件<\/td><td>6处位置、两种语言、箭头方向与图样一致，固定情况通过检查<\/td><\/tr><tr><td>记录<\/td><td>保存图样版本、检查表、照片与接受记录<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-wbs-activities", "title": "Work Package → Activity 工作包与活动", "definition": "为交付工作包成果，进一步确定需要执行的活动及其时间关系。", "formula": "工作包→具体活动→工期与紧前→网络图与排程。", "example": "指路牌工作包包含设计、制作安装等活动。", "pitfall": "WBS包含关系不能直接当作活动依赖；编号相邻也不表示必须先后执行。", "lesson": 27, "topic": "4.1", "source": "Lecture 3 · 工作包；Lecture 4 · 活动网络", "terms": [["Activity", "活动", "为完成项目成果而需要执行的具体工作。工作包可以包含一项或多项活动，活动应使用能看出做什么的名称。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>工作包<\/th><th>活动<\/th><th>工期与直接前置<\/th><\/tr><\/thead><tbody><tr><td>指路牌图样<\/td><td>确认指路牌 , "pitfall": "当前预测不能冒充实际完成；变更当前安排不自动修改批准基线。", "lesson": 35, "topic": "5.3", "source": "Lecture 5 · 甘特图与跟踪图", "terms": [], "tables": [], "formulae": []}, {"id": "r-gantt-track", "title": "Tracking Gantt 跟踪甘特图", "definition": "在状态日期上区分基线、实际事实与剩余工作的预测。", "formula": "已发生填实际；未完成填剩余安排和预计完成。", "example": "截至6尚未完成、预计9完成，不应写“实际完成9”。", "pitfall": "不能用更新基线的方式抹去偏差。", "lesson": 36, "topic": "5.3", "source": "Lecture 5 · PDF第44–51页", "terms": [["Tracking Gantt Chart / Status Date", "跟踪甘特图／状态日期", "跟踪图在同一时间轴上比较基线、实际进展和剩余工作的预测。状态日期是本次记录实际情况的截止时点。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>工作<\/th><th>基线完成<\/th><th>截至时点6的实际<\/th><th>当前预计完成<\/th><\/tr><\/thead><tbody><tr><td>设计指路牌<\/td><td>5<\/td><td>实际完成6<\/td><td>已完成，不再预测<\/td><\/tr><tr><td>安装电脑和取号设备<\/td><td>8<\/td><td>实际开始2，仍在执行<\/td><td>9<\/td><\/tr><tr><td>检查设备和指路牌<\/td><td>9<\/td><td>尚未开始<\/td><td>10<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-aoa-events", "title": "AOA / Event 活动箭线法／事件", "definition": "箭头表示工作与工期，节点表示不占时间的事件。", "formula": "终点事件要等所有进入该事件的活动完成。", "example": "A完成后可做C；D还需等B，不应让C和D共用相同开始事件。", "pitfall": "节点编号不代表时间，AOA不能按AON节点含义读取。", "lesson": 37, "topic": "5.4", "source": "Lecture 5 · PDF第64–66页", "terms": [["Activity-on-Arrow (AOA) / Event", "活动箭线法／事件", "AOA的箭头表示活动并标出工期；圆形节点表示事件，事件本身不占用工期。箭尾事件发生后，活动才能开始；指向同一事件的所有活动都完成后，这个事件才能发生。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>工期（天）<\/th><th>紧前活动<\/th><\/tr><\/thead><tbody><tr><td>A 确认服务窗口及编号<\/td><td>2<\/td><td>无<\/td><\/tr><tr><td>B 测量指路牌安装位置<\/td><td>3<\/td><td>无<\/td><\/tr><tr><td>C 配置取号设备<\/td><td>4<\/td><td>A<\/td><\/tr><tr><td>D 制作指路牌<\/td><td>2<\/td><td>A、B<\/td><\/tr><tr><td>E 联合检查<\/td><td>1<\/td><td>C、D<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-aoa-dummy", "title": "Dummy Activity 虚活动", "definition": "用零工期虚线传递必要的前置逻辑。", "formula": "工期0、工作量0；仍须核对方向与依赖。", "example": "虚线2→3使D同时等A和B，C仍只等A。", "pitfall": "零工期不表示可以删除，也不保证一定不在关键路径上。", "lesson": 38, "topic": "5.4", "source": "Lecture 5 · PDF第67–74页", "terms": [["Dummy Activity", "虚活动", "AOA中用于表达前置条件、工期和工作量均为0的活动，通常画成虚线。它使不同工作能够保留不同的前置条件。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>箭线<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>A：1→2；B：1→3<\/td><td>两项工作可从起点分别开始<\/td><\/tr><tr><td>虚活动：2→3<\/td><td>事件3除了等B，还要等A完成<\/td><\/tr><tr><td>C：2→4；D：3→4<\/td><td>C只等A，D等A与B<\/td><\/tr><tr><td>E：4→5<\/td><td>C与D均完成后进行联合检查<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-aoa-times", "title": "AOA事件正推与逆推", "definition": "在事件上计算E与L，活动工期写在箭线上。", "formula": "Eⱼ=max(Eᵢ+dᵢⱼ)；Lᵢ=min(Lⱼ−dᵢⱼ)。", "example": "事件3取max(3,2)=3；事件2逆推取min(2,4)=2。", "pitfall": "虚活动也参与计算；不能忽略零工期箭线的逻辑。", "lesson": 39, "topic": "5.4", "source": "Lecture 5 · PDF第70–74、77–78页", "terms": [["Earliest Event Time / Latest Event Time", "事件最早时点／事件最迟时点", "事件最早时间是指向它的所有活动最早全部完成的时间；事件最迟时间是在不推迟项目规定完成时间的条件下，允许它最晚发生的时间。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>事件<\/th><th>正推过程<\/th><th>E<\/th><th>L<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>项目起点<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>0+2<\/td><td>2<\/td><td>2<\/td><\/tr><tr><td>3<\/td><td>max(0+3, 2+0)<\/td><td>3<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>max(2+4, 3+2)<\/td><td>6<\/td><td>6<\/td><\/tr><tr><td>5<\/td><td>6+1<\/td><td>7<\/td><td>7<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": ["正推：Eⱼ＝max(Eᵢ＋dᵢⱼ) 逆推：Lᵢ＝min(Lⱼ−dᵢⱼ)"]}, {"id": "r-aoa-float", "title": "AOA活动TF与FF", "definition": "按箭尾、箭头事件时点及活动工期求活动余量。", "formula": "TF=Lⱼ−Eᵢ−d；FF=Eⱼ−Eᵢ−d。", "example": "Eᵢ=2，Eⱼ=7，Lⱼ=9，d=4时，TF=3，FF=1。", "pitfall": "事件余量L−E与活动总时差不是同一个量。", "lesson": 40, "topic": "5.4", "source": "Lecture 5 · PDF第77–78页", "terms": [["Activity Total Float in AOA", "AOA活动总时差", "对于活动i→j，最早开始为Eᵢ，最迟完成为Lⱼ，因此总时差TF=Lⱼ−Eᵢ−d。"]], "tables": [], "formulae": ["活动ES＝Eᵢ；EF＝Eᵢ＋d 活动LF＝Lⱼ；LS＝Lⱼ−d TF＝Lⱼ−Eᵢ−d；FF＝Eⱼ−Eᵢ−d"]}, {"id": "r-cost-types", "title": "Cost Classification 成本分类", "definition": "按归属、重复性、数量变化和执行速度分别分类。", "formula": "先定成本对象，再定直接／间接；不同维度 pic": "6.1", "source": "Lecture 5 · PDF第11–12页", "terms": [["Contingency Reserve", "应急储备", "为估算中的相关不确定性预留的费用。例如，安装方案可能需要额外配件，估算时为这类变化预留金额，并说明使用依据。"], ["Profit / Price", "利润／报价", "利润是报价中超过相应成本的部分；报价是供应商向客户提出的总金额。利润按成本加成10%和占最终售价10%使用不同基数，因此必须先说明计算口径。"]], "tables": [], "formulae": []}, {"id": "r-estimate-methods", "title": "Top-down / Bottom-up 估算方法", "definition": "按当前信息程度选择整体估算或工作包汇总。", "formula": "比率法＝数量×单位成本；分摊法＝总额×比例。", "example": "120平方米×2000元/平方米=240000元。", "pitfall": "历史标准、范围与价格口径需要可比；细表不等于可靠依据。", "lesson": 44, "topic": "6.1", "source": "Lecture 5 · PDF第14–17、25–30页", "terms": [["Top-down / Bottom-up Estimating", "自上而下／自下而上估算", "自上而下利用整体规模、历史项目和比例作早期估计；自下而上分别估算较细的工作包，再汇总为项目估算。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>方法<\/th><th>计算思路<\/th><th>例子与条件<\/th><\/tr><\/thead><tbody><tr><td>Ratio Method 比率法<\/td><td>数量×可比单位成本<\/td><td>120平方米×每平方米2000元=240000元；核对装修标准和包含范围<\/td><\/tr><tr><td>Apportion Method 比例分摊法<\/td><td>总估算×历史分项比例<\/td><td>总额200000元，标牌占5%，分配10000元；历史项目须可比<\/td><\/tr><tr><td>Bottom-up 自下而上<\/td><td>逐工作包估算后汇总<\/td><td>分别估计设备、标牌、测试和培训，核对重复与遗漏<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-learning-curve", "title": "Learning Curve 第X单元学习曲线", "definition": "Yₓ估计第X个重复单元的用时。", "formula": "Yₓ=aXᵇ，b=log(r)/log2；总工时=ΣYₓ。", "example": "a=40，r=.9时，Y₂=36，Y₄=32.4。", "pitfall": "翻倍保留r倍用时；第X单元不是前X单元累计平均。", "lesson": 45, "topic": "6.1", "source": "Lecture 5 · PDF第18–24页", "terms": [["Learning Curve", "学习曲线", "在重复、相似工作中，用学习率估计后续单元所需时间。学习率表示数量翻倍时，第2X单元用时相对于第X单元的比例。"]], "tables": [], "formulae": ["Yₓ＝aXᵇ；b＝log(r)/log(2) a为第一单元用时，r为学习率，Yₓ为第X单元用时"]}, {"id": "r-learning-reverse", "title": "学习曲线反推与累计", "definition": "已知后续单元用时，先反推首项，再逐项累计。", "formula": "a=Yₓ/Xᵇ；费用=累计工时×费率×负担乘数。", "example": "第4次40小时、90%学习率，首次49.3827，四次共175.6151。", "pitfall": "不要把第X次、累计平均、累计总量或日历工期混为一谈。", "lesson": 46, "topic": "6.1", "source": "Lecture 5 · PDF第18–24页", "terms": [], "tables": [], "formulae": ["a＝Yₓ/Xᵇ；总人工费＝ΣYᵢ×小时费率×满载乘数"]}, {"id": "r-function-points", "title": "Function Point 功能点", "definition": "以功能数量和复杂度权重衡量软件规模。", "formula": "FP=Σ数量×权重；人月=FP/生产率；成本=人月×费率。", "example": "45 FP、15 FP/人月，得到3人月。", "pitfall": "权重使用题目给定表；人月不能直接等同于日历月。", "lesson": 47, "topic": "6.1", "source": "Lecture 5 · PDF第28–30页", "terms": [["Function Point (FP)", "功能点", "按功能类型、数量与复杂度权重计算的软件规模指标。功能点本身不是天数，也不是代码行数。"]], "tables": ["<div class=\"table-scroll\"><table><caption>功能点权重表：每行先选复杂度，再用数量乘该格权重<\/caption><thead><tr><th>功能类型<\/th><th>医院软件中的例子<\/th><th>低<\/th><th>中<\/th><th>高<\/th><\/tr><\/thead><tbody><tr><td>Inputs 输入<\/td><td>工作人员录入患者登记信息<\/td><td>2<\/td><td>4<\/td><td>6<\/td><\/tr><tr><td>Outputs 输出<\/td><td>生成每日接待汇总报告<\/td><td>4<\/td><td>6<\/td><td>10<\/td><\/tr><tr><td>Interfaces 接口<\/td><td>与收费系统交换已确认资料<\/td><td>3<\/td><td>7<\/td><td>12<\/td><\/tr><tr><td>Queries 查询<\/td><td>按号码查询当前等候信息<\/td><td>5<\/td><td>10<\/td><td>15<\/td><\/tr><tr><td>Files 文件<\/td><td>保存和维护登记记录<\/td><td>2<\/td><td>4<\/td><td>8<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": ["功能点＝Σ(功能数量×对应权重) 工作量（人月）＝功能点÷生产率（功能点/人月）"]}, {"id": "r-budget-activity", "title": "Activity Budget / ABC 活动预算／作业成本法", "definition": "将成本联系到工作与资源消耗，再按规则汇总和分配。", "formula": "数量×费率→活动成本→项目合计；共享费用不重复。", "example": "协调费3000分配到三项工作后合计仍为3000。", "pitfall": "成本发生、付款与活动执行时间可能不同，应说明时间分布口径。", "lesson": 48, "topic": "6.2", "source": "Lecture 5 · PDF第31–36页", "terms": [["Activity-based Costing (ABC)", "作业成本法", "把成本与产生资源消耗的活动联系起来，并按活动成本动因分配相关费用。本专题先练习把人员、材料等成本落实到活动。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>资源依据<\/th><th>预算（元）<\/th><\/tr><\/thead><tbody><tr><td>确认设备和指路牌要求<\/td><td>协调与设计人员工时<\/td><td>2000<\/td><\/tr><tr><td>制作并安装指路牌<\/td><td>材料、制作与安装<\/td><td>3000<\/td><\/tr><tr><td>安装电脑和取号设备<\/td><td>设备及安装配置资源<\/td><td>6000<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-budget-time", "title": "Time-phased Budget 时间分布预算", "definition": "把各活动预算按时期分配并累计。", "formula": "行合计＝活动预算；列合计＝期间金额；累计＝此前各期之和。", "example": "每周3000、4000、4000，对应累计3000、7000、11000。", "pitfall": "总额相同不代表任意状态日期的计划金额相同。", "lesson": 49, "topic": "6.2", "source": "Lecture 5 · PDF第31–36页", "terms": [["Time-phased Budget / Cost Baseline", "时间分布预算／成本基线", "把批准的预算按预计发生时间分配，形成每期与累计计划金额。它既说明总额，也说明计划在何时消耗这些金额。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>第1周<\/th><th>第2周<\/th><th>第3周<\/th><th>合计<\/th><\/tr><\/thead><tbody><tr><td>确认要求<\/td><td>2000<\/td><td>0<\/td><td>0<\/td><td>2000<\/td><\/tr><tr><td>制作并安装指路牌<\/td><td>1000<\/td><td>2000<\/td><td>0<\/td><td>3000<\/td><\/tr><tr><td>安装并配置设备<\/td><td>0<\/td><td>2000<\/td><td>4000<\/td><td>6000<\/td><\/tr><tr><td>每周合计<\/td><td>3000<\/td><td>4000<\/td><td>4000<\/td><td>11000<\/td><\/tr><tr><td>累计计划<\/td><td>3000<\/td><td>7000<\/td><td>11000<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-budget-variance", "title": "费用比较与符号", "definition": "按题目明确的比较对象、时期和相减方向计算。", "formula": "本页：实际−计划；挣值CV：EV−AC。", "example": "计划7000、实际7600，费用差额+600。", "pitfall": "少花可能来自少完成工作，不能只比较支出就断言绩效。", "lesson": 50, "topic": "6.2", "source": "Lecture 5 · PDF第31–36页", "terms": [["Cost Comparison", "费用比较", "先对齐工作范围、统计日期和费用项目，再比较计划与实际。这里采用实际−计划，正数表示多花，负数表示少花。"]], "tables": [], "formulae": ["本页费用差额＝实际费用−计划费用"]}, {"id": "r-crash-slope", "title": "Crashing / Cost Slope 赶工／成本斜率", "definition": "以额外成本换取可行范围内的活动工期缩短。", "formula": "斜率=(赶工费−正常费)/(正常工期−最短工期)。", "example": "6天1500元压到3天2100元，斜率200元/天。", "pitfall": "先确认可压缩区间与成本模型，再检查当前关键路径。", "lesson": 51, "topic": "6.2", "source": "Lecture 5 · PDF第53–62页", "terms": [["Crashing / Cost Slope", "赶工／成本斜率", "赶工通过额外资源等办法缩短工期。成本斜率表示在给定线性区间内，每缩短一个时间单位增加的直接成本。"]], "tables": [], "formulae": ["成本斜率＝(赶工费用−正常费用)÷(正常工期−赶工工期)"]}, {"id": "r-crash-paths", "title": "逐轮赶工与多关键路径", "definition": "以当前网络重新识别关键路径，再选择有效压缩组合。", "formula": "每轮：找关键路径→比较可行增量成本→压缩→重算。", "example": "两条关键路径时，压共同活动或同时覆盖各条路径。", "pitfall": "最便宜的非关键活动不一定能缩短项目；每轮关键路径可能变化。", "lesson": 52, "topic": "6.2", "source": "Lecture 5 · PDF第53–62页", "terms": [], "tables": ["<div class=\"table-scroll\"><ta : "7.1", "source": "Lecture 6 · PDF第10–14页", "terms": [["Cause–Event–Effect", "原因、事件与后果", "原因说明风险来源或条件，事件说明可能发生什么，后果说明对项目范围、时间、成本、质量等目标的影响。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>部分<\/th><th>设备交付风险<\/th><\/tr><\/thead><tbody><tr><td>原因<\/td><td>关键零件只有一家供应商，备用库存不足<\/td><\/tr><tr><td>事件<\/td><td>供货中断导致取号设备未能按时到货<\/td><\/tr><tr><td>后果<\/td><td>安装和联合测试推迟，可能影响开放日期<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-risk-rbs", "title": "RBS 风险分解结构", "definition": "按来源分层整理风险，并与WBS工作包交叉检查遗漏。", "formula": "类别说明来源；风险记录写具体事件与影响。", "example": "设备安装包可同时检查供应、技术接口和人员安排风险。", "pitfall": "RBS不是活动顺序图，同一事件跨类别不能重复计损失。", "lesson": 56, "topic": "7.1", "source": "Lecture 6 · PDF第10–14页", "terms": [["Risk Breakdown Structure (RBS)", "风险分解结构", "按风险来源分层组织风险的结构，用于系统识别和检查遗漏。WBS分解项目工作，RBS分解风险来源，两者可以交叉检查。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>一级来源<\/th><th>二级来源<\/th><th>具体事件<\/th><\/tr><\/thead><tbody><tr><td>外部<\/td><td>供应与商业<\/td><td>供应商生产安排变化，设备可能晚到<\/td><\/tr><tr><td>外部<\/td><td>合同与法规<\/td><td>审批条件可能变化，导致补充工作<\/td><\/tr><tr><td>内部<\/td><td>技术与接口<\/td><td>终端与叫号系统接口可能不兼容<\/td><\/tr><tr><td>内部<\/td><td>执行与协调<\/td><td>测试人员安排冲突，可能错过验收窗口<\/td><\/tr><tr><td>内部或外部<\/td><td>财务<\/td><td>付款安排或价格变化可能影响采购<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-risk-matrix", "title": "Probability–Impact Matrix 概率影响矩阵", "definition": "按事先定义的可能性与影响等级定位、排序风险。", "formula": "先读坐标和尺度，再按该矩阵规则判等级。", "example": "P等级2、I等级3，乘积6为本练习高优先级。", "pitfall": "等级乘积不是失败概率，也不是期望货币损失。", "lesson": 57, "topic": "7.1", "source": "Lecture 6 · PDF第15–18页", "terms": [["Probability–Impact Matrix", "概率影响矩阵", "用发生可能性和后果严重程度交叉定位风险，辅助确定管理优先级。等级应有明确含义与判断依据。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>等级<\/th><th>本练习可能性定义<\/th><th>本练习工期影响定义<\/th><\/tr><\/thead><tbody><tr><td>1 低<\/td><td>估计概率低于20%<\/td><td>延期不超过1天<\/td><\/tr><tr><td>2 中<\/td><td>估计概率20%至50%<\/td><td>延期超过1天且不超过3天<\/td><\/tr><tr><td>3 高<\/td><td>估计概率超过50%<\/td><td>延期超过3天<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-risk-factor", "title": "RF Risk Factor 风险因子", "definition": "根据项目失败可能性及后果评分合成的指标。", "formula": "Pf=均值；Cf=均值；RF=Pf+Cf−PfCf。低<.30，中.30至.70，高>.70。", "example": "Pf=.5、Cf=.4，RF=.70为中风险。", "pitfall": "RF不等于PfCf，也不是实际失败概率。", "lesson": 58, "topic": "7.1", "source": "Lecture 6 · PDF第19–20页", "terms": [["Risk Factor (RF)", "风险因子", "由失败可能性评分Pf与失败后果评分Cf合成的项目风险评分。Pf和Cf在这里是评分结果，不应直接当作经过统计验证的失败概率。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>评分<\/th><th>组成<\/th><\/tr><\/thead><tbody><tr><td>Pf：Probability of Failure score<\/td><td>Pm Maturity成熟度、Pc Complexity复杂性、Pd Dependency依赖程度的平均<\/td><\/tr><tr><td>Cf：Consequence of Failure score<\/td><td>Cc Cost成本、Cs Schedule进度、Cr Reliability可靠性、Cp Performance性能后果评分的平均<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": ["Pf＝(Pm＋Pc＋Pd)/3 Cf＝(Cc＋Cs＋Cr＋Cp)/4 RF＝Pf＋Cf−Pf×Cf"]}, {"id": "r-risk-model-choice", "title": "风险模型选择", "definition": "等级排序、RF评分与货币期望值使用不同输入和解释。", "formula": "单项期望损失=P×损失金额；先确认P为概率。", "example": "20%×10000元=2000元期望损失，发生时仍损失10000。", "pitfall": "期望值不是单次上限，不要把等级3直接解释为30%。", "lesson": 59, "topic": "7.1", "source": "Lecture 6 · 风险评估综合应用", "terms": [["Expected Monetary Value (EMV)", "期望货币值", "当事件概率与金额后果有明确口径时，用各结果的概率乘对应金额并相加。下面只讨论一个损失事件，采用正数表示预期损失。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>模型<\/th><th>所需输入<\/th><th>结果含义<\/th><\/tr><\/thead><tbody><tr><td>概率影响矩阵<\/td><td>已定义的等级及排序规则<\/td><td>相对管理优先级<\/td><\/tr><tr><td>RF<\/td><td>规定的项目评分项<\/td><td>项目风险因子等级<\/td><\/tr><tr><td>期望损失<\/td><td>事件概率与损失金额<\/td><td>多次同类情境下的平均损失估计<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-risk-response", "title": "Risk Responses 风险应对", "definition": "明确措施改变风险来源、概率、后果或承担责任中的哪一项。Insurance保险按合同转移部分经济后果；Workaround临时应变措施是在问题发生后制定的处理办法，与事先约定的应急计划不同。", "formula": "避免、减轻、转移、接受、分担；实施后检查残余与次生风险。", "example": "赔偿分配费用责任，不能自动恢复延期。", "pitfall": "“接受”可以包含监测和应急准备，不等于无人管理。", "lesson": 60, "topic": "7.1", "source": "Lecture 6 · PDF第21–26页", "terms": [["Risk Response", "风险应对", "为改变风险的来源、发生可能性、后果或承担责任而采取的行动。先说明想改变什么，再选择措施。以下五种策略对同一个交期风险采取不同处理。"], ["Insurance", "保险", "通过合同把约定的经济后果转给保险方承担。赔付范围、免赔条件和未被补偿的工期影响需要分别检查；得到赔偿不等于恢复了开放日期。"], ["Workaround", "临时应变措施", "问题发生后，没有现成预定方案可直接使用时，团队临时制定的处理办法。例如设备确认晚到后，负责人临时安排人工登记。若团队早已规定何时改租备用设备，那属于事先准备的应急计划。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>策略<\/th><th>设备到货例子<\/th><th>仍需关注<\/th><\/tr><\/thead><tbody><tr><td>Avoid 避免<\/td><td>取消依赖该进口型号，采用已确认可用现货<\/td><td>替代方案是否满足要求<\/td><\/tr><tr><td>Minimize / Mitigate 减轻<\/td><td>提前检查生产节点，准备可替换设备<\/td><td>剩余概率和替换实施条件<\/td><\/tr><tr><td>Transfer 转移<\/td><td>约定延迟赔偿或保险责任<\/td><td>赔偿不能自动恢复开放日期<\/td><\/tr><tr><td>Accept 接受<\/td><td>确认影响可以承受，规定什么时候启动后备方案<\/td><td>准备谁来做什么<\/td><\/tr><tr><td>Share 分担<\/td><td>与合作方共同备货和承担约定成本<\/td><td>责任边界与协调机制<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-risk-reserve", "title": "Contingency 储备与应急", "definition": "预留金额或时间，并确定触发后实施的措施和权限。", "formula": "总额=基数×乘数；增量=基数×(乘数−1)。", "example": "20000×1.15=23000，储备3000。", "pitfall": "总额不能再次加到基数上；储备大小不能代替触发和责任。", "lesson": 61, "topic": "7.1", "source": "Lecture 6 · PDF第21–26页", "terms": [["Contingency Plan", "应急计划", "预先规定某个条件出现后采取的行动。例如，第5天仍无出厂证明时，由采购负责人确认备用设备，并报告能否维持第9天安装。"], ["Contingency Reserve", "应急储备", "为相关不确定性预留的费用或时间。例如，为备用设备租赁预留3000元，并明确采购负责人何时可以使用、需由谁批准。储备提供资源，应急计划说明如何行动。"]], "tables": [], "formulae": ["包含应急储备的总金额＝基本估算×乘数 储备增量＝基本估算×(乘数−1)"]}, {"id": "r-risk-pram", "title": "PRAM 项目风险分析与管理", "definition": "九阶段连接项目背景、分析、责任、应对和持续管理。", "formula": "Define、Focus、Identify、Structure、Ownership、Estimate、Evaluate、Plan、Manage。", "example": "先估计不同措施效果，再评价选择，最后监测实施。", "pitfall": "Estimate提供估计，Evaluate作评价；登记结束不等于管理结束。", "lesson": 62, "topic": "7.1", "source": "Lecture 6 · 风险控制与PRAM，PDF第27–35页", "terms": [["Project Risk Analysis and Management (PRAM)", "项目风险分析与管理", "贯穿项目的风险分析和管理过程，强调分析目的、责任、措施与后续管理之间的联系。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>阶段<\/th><th>在设备延迟风险中做什么<\/th><\/tr><\/thead><tbody><tr><td>Define 定义<\/td><td>明确项目目标、交付物和计划<\/td><\/tr><tr><td>Focus 聚焦<\/td><td>确定本次分析的范围、深度与方法<\/td><\/tr><tr><td>Identify 识别<\/td><td>找出关键零件短缺等来源和事件<\/td><\/tr><tr><td>Structure 组织<\/td><td>梳理风险之间及与工作之间的关系<\/td><\/tr><tr><td>Ownership 明确归属<\/td><td>指定采购负责人及相关责任<\/td><\/tr><tr><td>Estimate 估计<\/td><td>估计概率、影响与措施效果<\/td><\/tr><tr><td>Evaluate 评价<\/td><td>比较结果和优先级<\/td><\/tr><tr><td>Plan 规划<\/td><td>制定应对、触发条件和资源安排<\/td><\/tr><tr><td>Manage 管理<\/td><td>执行监测、复查实际效果并更新<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-risk-register", "title": "Risk Register 风险登记册", "definition": "将风险、依据、责任、响应、复查与实际结果保存在一起。", "formula": "记录原因事件后果、评估、负责人、触发、行动、复查和结果。", "example": "第5天无出厂证明，由采购负责人确认替代设备。", "pitfall": "字段齐全不代表策略有效，仍要核对措施与风险之间的关系。", "lesson": 63, "topic": "7.1", "source": "Lecture 6 · 风险控制与文档化", "terms": [["Risk Register", "风险登记册", "持续记录风险事件、评估依据、应对措施和实际结果的资料。每一行应能说明有什么风险、谁在跟进、接下来何时做什么。"], ["Risk Owner", "风险负责人", "负责跟踪某项风险、协调措施并更新信息的人。例如，采购负责人跟踪设备交期，安装负责人评估对现场工作的影响。"], ["Trigger", "触发条件", "用来判断何时启动某项行动的可观察条件。例如，“第5天仍未收到出厂证明”包含日期和证据，比“风险变大时”更容易判断。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>字段<\/th><th>本例内容<\/th><\/tr><\/thead><tbody><tr><td>风险描述<\/td><td>零件短缺可能导致设备晚到，影响安装和开放<\/td><\/tr><tr><td>评估依据<\/td><td>供应商生产节点与历史交付记录<\/td><\/tr><tr><td>负责人<\/td><td>采购负责人<\/td><\/tr><tr><td>措施与触发<\/td><td>第5天仍无出厂证明，启动替代确认<\/td><\/tr><tr><td>下一次复查<\/td><td>第5天；收到新交期时立即更新<\/td><\/tr><tr><td>实际结果<\/td><td>是否取得证明、措施是否启动、最终到货与影响<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-resource-load", "title": "Resource Loading 资源负载", "definition": "按时间段汇总各活动对同一资源的需求，并与容量比较。", "formula": "负载=同时执行活动需求之和；过载=max(0,负载−容量)。", "example": "B与C各需2人，同时做需4人，容量2则超出2人。", "pitfall": "逻辑可行不等于资源可行；总工时也不能代替逐日核对。", "lesson": 64, "topic": "8.1", "source": "Lecture 8 · PDF第4–10页", "terms": [["Resource Loading", "资源负载", "一个时间段内，计划执行的全部工作合计需要多少同类资源。例如，同一天两项安装各需2人，该天的安装人员负载就是4人。"], ["Resource Capacity", "资源容量", "同一时间段内实际能够提供的资源数量或工时。本例安装队每天只有2人，负载4人超过容量2人，意味着当天的原安排无法同时执行。比较时要使用相同资源种类和时间单位。"]], "tables": ["<div class=\"table-scroll\"><table><caption>活动资料 · 工期单位：天；可用人员2人<\/caption><thead><tr><th>工作<\/th><th>工期<\/th><th>每天需安装人员<\/th><th>紧前<\/th><\/tr><\/thead><tbody><tr><td>A 准备接口<\/td><td>2<\/td><td>1<\/td><td>无<\/td><\/tr><tr><td>B 安装取号设备<\/td><td>3<\/td><td>2<\/td><td>A<\/td><\/tr><tr><td>C 安装显示屏<\/td><td>2<\/td><td>2<\/td><td>A<\/td><\/tr><tr><td>D 联合测试<\/td><td>1<\/td><td>1<\/td><td>B、C<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><caption>排程前先说明哪些条件必须满足<\/caption><thead><tr><th>约束类型<\/th><th>医院中的限制<\/th><\/tr><\/thead><tbody><tr><td>Physical 物理约束<\/td><td>墙面需要达到安装条件后才能固定标牌<\/td><\/tr><tr><td>Time 时间约束<\/td><td>接待区必须在规定开放日期前可用<\/td><\/tr><tr><td>Resource 资源约束<\/td><td>同一时段只有两名合格安装人员<\/td><\/tr><tr><td>Mixed 混合约束<\/td><td>既有固定开放日期，又有人员和场地限制<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": ["某时段资源负载＝该时段全部执行活动的资源需求之和"]}, {"id": "r-resource-level", "title": "Smoothing / Leveling 平滑／平衡", "definition": "明确是在原期限内使用时差，还是按容量优先重新安排。", "formula": "每次移动后核对：依赖、容量、工作总量、完工时间。", "example": "两项各需整支队伍的工作只能串行，可能延长原逻辑工期。", "pitfall": "有时差不保证能消除冲突；无冲突不保证依赖正确。", "lesson": 65, "topic": "8.1", "source": "Lecture 8 · PDF第11–15页", "terms": [["Resource Leveling / Resource Smoothing", "资源平衡／资源平滑", "通过调整活动时段，减少资源过载或用量起伏。先确定题目允许改变什么：若完工日期固定，就在可用时差内移动工作；若资源容量固定且原日期不可行，就需要比较延期、增员或改变方法。Resource Smoothing常用于强调不改变完工期限的平滑安排；课程也将它作为Resource Leveling的别称，因此应以题目给定约束为判断依据。"]], "tables": [], "formulae": []}, {"id": "r-resource-priority", "title": "Scheduling Heuristics 排程启发规则", "definition": "在多项可执行活动竞争资源时，用明确规则排序。", "formula": "按最小总时差、最短工期等排序后，仍要检验完整排程。", "example": "TF0的测试优先于TF4的复查，但复查仍需安排在合法窗口。", "pitfall": "任何一种启发规则都不能自动证明全局最优。", "lesson": 66, "topic": "8.1", "source": "Lecture 8 · PDF第11–15页", "terms": [["Scheduling Heuristics", "排程启发规则", "用较容易执行的规则选择活动顺序，例如最小总时差、最短工期、最多后继、最大资源需求或较小活动编号。它们帮助构造方案，不保证全局最优。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>规则<\/th><th>何时优先<\/th><th>需要继续检查<\/th><\/tr><\/thead><tbody><tr><td>Minimum Slack 最小总时差<\/td><td>延迟余地最小的活动<\/td><td>其他活动是否还能在可用窗口完成<\/td><\/tr><tr><td>Shortest Duration 最短工期<\/td><td>工期较短、能让执行人员较早开始下一项工作的活动<\/td><td>是否推迟长工期关键工作<\/td><\/tr><tr><td>Most Successors 最多后继<\/td><td>完成后有较多后续工作可以开始的活动<\/td><td>后续是否确实有资源开工<\/td><\/tr><tr><td>Lowest ID / First Come 较小编号／先到<\/td><td>按预先约定的编号或就绪顺序<\/td><td>只有编号代表到达顺序时，两种规则才一致<\/td><\/tr><tr><td>Greatest Resource Demand 最大资源需求<\/td><td>需要较多资源的活动优先<\/td><td>仍需检查可用容量与对其他活动交期的影响<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-resource-splitting", "title": "Task Splitting 任务拆分", "definition": "允许中断的活动分段执行，保持工作量并核对恢复条件。", "formula": "分别计算实际执行时长与从开始到完成的历时。", "example": "1天执行＋2天停顿＋2天执行，工作量3天、跨度5天。", "pitfall": "拆分不自动创造容量；连续性要求和恢复成本不能忽略。", "lesson": 67, "topic": "8.1", "source": "Lecture 8 · PDF第16–19页", "terms": [["Task Splitting", "任务拆分", "在工作允许中断和恢复的条件下，把一项活动安排在多个不连续时段。总工作量仍应完成，并计入切换或恢复成本。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>安排<\/th><th>工作量<\/th><th>开始至最终完成的跨度<\/th><\/tr><\/thead><tbody><tr><td>第2天查1组，第5至6天查2组<\/td><td>3个工作日<\/td><td>从第2天开始至第6天结束<\/td><\/tr><tr><td>连续三天检查<\/td><td>3个工作日<\/td><td>需找到连续3天可用窗口<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-multi-queue", "title": "Multiproject Scheduling 多项目排程", "definition": "把共享资源放进同一日历，按明确目标比较排队方案。", "formula": "延期=max(0,完成−目标)；同时比较等待和整体完成。", "example": "A-B-C使药房晚1天，B-A-C可使三项均按目标完成。", "pitfall": "单项目独立计划不能消除共享资源冲突。", "lesson": 68, "topic": "8.1", "source": "Lecture 8 · PDF第20页", "terms": [["Multiproject Resource Scheduling", "多项目资源排程", "在多个项目共享容量的条件下，安排资源顺序和各项目开始进入执行的时间，并比较各项目延期及整体完成表现。"]], "tables": ["<div class=\"table-scroll\"><table><caption>所有时间以天计，测试连续执行，一次只服务一个项目<\/caption><thead><tr><th>项目<\/th><th>测试台占用<\/th><th>可开始<\/th><th>目标完成<\/th><\/tr><\/thead><tbody><tr><td>A 接待区<\/td><td>3<\/td><td>0<\/td><td>5<\/td><\/tr><tr><td>B 药房<\/td><td>2<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>C 门诊叫号<\/td><td>4<\/td><td>0<\/td><td>10<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-multi-wip", "title": "WIP 在制工作与切换", "definition": "同时启动可能增加等待；切换可能产生额外准备和恢复时间。", "formula": "总历时＝执行时间＋等待及切换时间。", "example": "4天工作：连续做完甲再做乙需1次切换，共4.5天；甲乙交替需3次切换，共5.5天。", "pitfall": "减少WIP不自动减少本来必须执行的工作量。", "lesson": 69, "topic": "8.1", "source": "Lecture 8 · PDF第20页", "terms": [["Work in Process (WIP)", "在制工作", "已经开始但尚未完成的工作或项目。多个项目同时启动却等待同一瓶颈，可能增加在制工作和协调负担。"]], "tables": [], "formulae": []}, {"id": "r-multi-decisions", "title": "多项目优先级与取舍", "definition": "综合交期、价值、容量和准备条件确定共享资源顺序。First In Line先到先服务、Greatest Resource Demand最大资源需求、Greatest Resource Utilization最大资源利用、Minimum Late Finish Time最小最迟完成时间是可比较的规则；Mathematical Programming数学规划明确变量、目标与约束后求解。", "formula": "规则→可执行性→指标比较→授权与共同日历。", "example": "最早期限项目未准备好时，不能让瓶颈无限空等。", "pitfall": "不同规则不保证同一目标最优，需说明选择与代价。", "lesson": 70, "topic": "8.1", "source": "Lecture 8 · 多项目资源评价", "terms": [], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>判断依据<\/th><th>需要的信息<\/th><\/tr><\/thead><tbody><tr><td>交期风险<\/td><td>目标日期、延误后果、剩余工作<\/td><\/tr><tr><td>业务优先级<\/td><td>开放需求、批准的项目优先级<\/td><\/tr><tr><td>资源效率<\/td><td>占用时长、准备与切换成本<\/td><\/tr><tr><td>可执行性<\/td><td>资料是否齐全、前置是否完成、预约是否可用<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><thead><tr><th>资源分配规则<\/th><th>采用前需要判断什么<\/th><\/tr><\/thead><tbody><tr><td>First In Line 先到先服务<\/td><td>以事先约定的到达或就绪顺序排队<\/td><\/tr><tr><td>Greatest Resource Demand 最大资源需求<\/td><td>优先满足需求量较大的项目，继续检查对其他项目的影响<\/td><\/tr><tr><td>Greatest Resource Utilization 最大资源利用<\/td><td>比较安排能否减少资源闲置，同时核对交期<\/td><\/tr><tr><td>Minimum Late Finish Time 最小最迟完成时间<\/td><td>优先最迟完成时点较早的工作；这个时点由网络或约束推得，不一定等于项目对外截止日期<\/td><\/tr><tr><td>Mathematical Programming 数学规划<\/td><td>把选择或开始时间设为变量，写出容量、依赖等约束，再按选定目标求解<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-toc-bottleneck", "title": "TOC 约束理论", "definition": "通过识别、利用、配合、提升和再识别约束改善整体。", "formula": "Identify→Exploit→Subordinate→Elevate→Repeat。", "example": "8、6、3台/天串行流程受测试3台/天限制。", "pitfall": "局部利用率提高不必然增加整体产出，瓶颈也会转移。", "lesson": 71, "topic": "8.2", "source": "Lecture 9 · PDF第17–19页", "terms": [["Bottleneck", "瓶颈", "限制整个流程产出的环节。本例每台终端都要安装、配置和测试；即使前两步每天能处理更多，测试每天只能完成3台，最终交付仍受它限制。"], ["Theory of Constraints (TOC)", "约束理论", "围绕当前限制整体产出的约束组织改进：先识别约束，充分利用现有能力，让其他环节配合，再提升约束能力，并重新寻找下一处限制。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>步骤<\/th><th>在测试环节中的做法<\/th><\/tr><\/thead><tbody><tr><td>Identify 识别约束<\/td><td>找出每天只能测试3台的限制<\/td><\/tr><tr><td>Exploit 充分利用现有约束<\/td><td>提前准备资料，减少测试台空等和返工<\/td><\/tr><tr><td>Subordinate 其他环节配合<\/td><td>安装与配置按测试能力和缓冲安排节奏<\/td><\/tr><tr><td>Elevate 提升约束能力<\/td><td>需要时增加测试能力或改进测试方法<\/td><\/tr><tr><td>Repeat 重复<\/td><td>测试提高后，重新找限制整体的环节<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-chain-resource", "title": "Critical Chain 关键链", "definition": "考虑活动逻辑与资源约束后，决定完成的活动链。50% Probability Duration指有50%机会在该工期内完成的估计，与按链长50%设置缓冲是不同概念。", "formula": "先处理资源冲突，再识别关键链和安排缓冲。", "example": "同一安装队使3天与2天工作串行，项目从逻辑6天变为8天。", "pitfall": "资源顺序不是不可改变的技术依赖；关键链与关键路径不总相同。", "lesson": 72, "topic": "8.2", "source": "Lecture 9 · PDF第20–30页", "terms": [["Critical Chain Project Management (CCPM) / Critical Chain", "关键链项目管理／关键链", "关键链是同时考虑工作先后关系和资源约束后，决定项目完成时间的活动链。关键链项目管理还把为不确定性预留的时间集中为缓冲，并在执行中跟踪使用情况。"], ["50% Probability Duration", "50%完成概率的工期估计", "如果一项活动的估计工期为6天，且有50%的可能在6天内完成，这描述的是工期分布中的中间位置。它不等于把任何原估计机械除以2，也不表示项目有50%的缓冲。活动估计与后面按链长50%设置缓冲，是两个不同概念。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>比较对象<\/th><th>关键路径CPM<\/th><th>关键链CCPM<\/th><\/tr><\/thead><tbody><tr><td>识别依据<\/td><td>活动逻辑与工期；标准网络先算逻辑时间<\/td><td>活动逻辑、资源顺序及所采用的工期估计<\/td><\/tr><tr><td>余量与保护<\/td><td>根据网络计算总时差与自由时差<\/td><td>把安全时间集中成不同位置的缓冲<\/td><\/tr><tr><td>资源<\/td><td>需要另行核对资源可行性<\/td><td>识别关键链时已处理资源冲突<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-chain-buffers", "title": "Project / Feeder (Feeding) Buffer 项目／馈入缓冲", "definition": "项目缓冲保护最终交期，馈入缓冲保护关键链汇合点。", "formula": "50%规则例：主链45→PB22.5；汇入关键链的支路15→FB7.5。", "example": "主链含项目缓冲67.5天；馈入缓冲安排在支路汇入前。", "pitfall": "50%是选定估算规则，不能把所有项目都机械砍半；TF也不是缓冲。", "lesson": 73, "topic": "8.2", "source": "Lecture 9 · PDF第20–25页", "terms": [["Project Buffer (PB)", "项目缓冲", "安排在关键链末端与承诺交期之间的保护时间。关键链上的延迟会消耗这段时间，项目经理据此判断承诺日期是否受到威胁。"], ["Feeder Buffer / Feeding Buffer (FB)", "馈入缓冲", "安排在非关键支路完成后、汇入关键链之前的保护时间。它为支路延迟留出余地，保护关键链的汇合点。两种英文写法都指这里的支路缓冲。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>时间量<\/th><th>怎样得到<\/th><th>保护对象<\/th><\/tr><\/thead><tbody><tr><td>Total Float 总时差<\/td><td>根据活动依赖、工期和规定完成时间计算<\/td><td>不推迟项目结束的活动延迟余地<\/td><\/tr><tr><td>Project Buffer 项目缓冲<\/td><td>按选定方法主动安排<\/td><td>最终交期<\/td><\/tr><tr><td>Feeder Buffer 馈入缓冲<\/td><td>在非关键支路接入关键链之前预留<\/td><td>关键链上的汇合点<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-chain-methods", "title": "Buffer Sizing 缓冲估计", "definition": "按明确的活动估计、安全余量定义和方法计算保护时间。Central Limit Theorem中心极限定理说明适当条件下随机用时之和趋近正态；并不规定缓冲必须取一半，相关延迟需单独分析。", "formula": "50%链长法与B=√Σsᵢ²使用不同输入，题目系数另行处理。", "example": "安全余量3、4天按平方和开方得到5天。", "pitfall": "不反复对已调整工期减半；安全余量不是自动等于PERT标准差。", "lesson": 74, "topic": "8.2", "source": "Lecture 9 · PDF第20–30、35页", "terms": [["Buffer Sizing / Buffer Management", "缓冲大小估计／缓冲管理", "前者确定预留保护时间，后者在执行中观察缓冲消耗与工作完成情况，及时处理对交期的威胁。"], ["Central Limit Theorem", "中心极限定理", "在适当的独立性与分布条件下，多项随机用时的总和可以趋近正态分布。把保护时间集中安排时，可以考虑并非每项活动都会同时用尽自己的预留时间；但共同原因造成的相关延迟仍要另外分析。这个原理本身不规定缓冲一定取链长的一半。"]], "tables": [], "formulae": ["本例平方和开方规则：B＝√Σsᵢ²；sᵢ为题目给定的活动安全余量"]}, {"id": "r-chain-drum", "title": "Drum / CCB 多项目瓶颈缓冲", "definition": "瓶颈前缓冲保护输入准备，容量约束缓冲分隔项目资源占用。", "formula": "先消除资源重叠，再决定前置保护、项目间隔和末端保护。", "example": "A测试前设准备保护，A与B测试之间设CCB。", "pitfall": "项目末端缓冲不能消除共享资源冲突；需检验估计依据和实施条件。", "lesson": 75, "topic": "8.2", "source": "Lecture 9 · PDF第31–35页", "terms": [["Drum Resource", "瓶颈资源", "限制多个项目整体执行节奏的共享资源。例如，医院各项目都必须使用且容量不足的测试台。协调者据此安排项目何时进入测试。"], ["Drum Buffer", "瓶颈前缓冲", "在项目使用瓶颈资源之前留出的准备保护时间。例如，测试预约在时点8，前面留1天缓冲，就要求上游工作在时点7准备好，以减少测试台等待输入的风险。"], ["Capacity Constraint Buffer (CCB)", "容量约束缓冲", "在不同项目使用同一瓶颈资源之间留出的间隔，减少前一项目超时对后一项目的影响。若甲在7结束、间隔1天，乙最早从8开始。课程中也出现CCP这一缩写，识别时按它所在的位置与作用判断。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>安排<\/th><th>目的<\/th><\/tr><\/thead><tbody><tr><td>项目A测试前的Drum Buffer<\/td><td>降低A上游延迟导致测试台空等的风险<\/td><\/tr><tr><td>A与B测试占用之间的CCB<\/td><td>减少A占用超时向B传递的冲突<\/td><\/tr><tr><td>项目B末端的Project Buffer<\/td><td>保护B自身承诺交期<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-project-start", "title": "Project / Operations 项目与运营", "definition": "项目为特定结果开展，有起止；运营持续维持既有业务。", "formula": "判断依据：结果、边界、结束条件及工作目的。", "example": "建设并交付新门诊楼是项目；每日接待患者是运营。", "pitfall": "项目可持续数年，也可包含重复工作；不能只按时长和重复程度分类。", "lesson": 76, "topic": "1.1", "source": "Lecture 1 · PDF第5–6、10–13、22页", "terms": [["Project", "项目", "为了创造独特的产品、服务或结果而开展的临时性工作。“临时性”表示有开始和结束；一项医院建设工程持续数年，仍然可以是项目。“独特”表示本次交付有特定的地点、要求或使用条件，并不要求每项技术都从未有人用过。"], ["Operations", "运营", "为了维持业务而持续开展的工作。例如医院开放后，每天按已有流程为患者登记、叫号和维护设备。项目团队把新设施交给运营人员时，要说明谁负责后续工作。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>工作<\/th><th>怎样判断<\/th><\/tr><\/thead><tbody><tr><td>安装并验收医院的新取号系统<\/td><td>有明确交付结果和结束条件，属于项目<\/td><\/tr><tr><td>每天用取号系统接待患者<\/td><td>持续提供既有服务，属于运营<\/td><\/tr><tr><td>更换取号系统并迁移全部资料<\/td><td>形成新的系统状态，有专项交付和结束条件，可以作为项目<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-project-value", "title": "Deliverable / Business Value 交付成果与业务价值", "definition": "交付成果是验收对象，价值是使用成果后获得的益处。", "formula": "动因→目标→成果→使用与收益；每一步分别寻找证据。", "example": "终端验收完成不自动证明患者等待时间缩短。", "pitfall": "有形资产、公共利益和能力改善都可产生价值；价值不只等于收入。", "lesson": 77, "topic": "1.1", "source": "Lecture 1 · PDF第7、13–15、49–50页", "terms": [["Deliverable", "交付成果", "项目团队交出的、可以检查和接受的产品、服务、能力或文件。例如，两台安装完毕并通过测试的取号终端，是接待区项目的交付成果。"], ["Business Value", "业务价值", "组织或使用者利用成果后得到的益处。例如，患者完成登记所需的等待时间缩短，接待人员能够处理更多服务请求。价值既可以是财务收益，也可以是便利、安全或公共服务改善。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>内容<\/th><th>医院接待区的例子<\/th><\/tr><\/thead><tbody><tr><td>Driver 启动动因<\/td><td>门诊服务量增加，原有人工登记方式难以满足需要<\/td><\/tr><tr><td>Objective 目标<\/td><td>在约定开放日期前具备取号和叫号服务能力<\/td><\/tr><tr><td>Deliverable 交付成果<\/td><td>已安装并通过测试的终端、指路牌、培训与交接资料<\/td><\/tr><tr><td>Benefit / Value 收益与价值<\/td><td>患者更容易找到窗口，接待人员减少重复解释，院方提高服务能力<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-project-lifecycle", "title": "Life Cycle / Process Groups 生命周期与过程组", "definition": "生命周期按阶段描述交付进展；过程组按作用描述管理工作。", "formula": "四阶段：构思、规划、执行、终止；五过程组：启动、规划、执行、监控、收尾。", "example": "施工阶段同时包含执行、近期规划和偏差监控。", "pitfall": "监控不应等到全部工作结束；滚动规划仍需保留整体目标和约束。", "lesson": 78, "topic": "1.1", "source": "Lecture 1 · PDF第16、18–21、26–27页", "terms": [["Project Life Cycle", "项目生命周期", "项目从开始到结束经历的阶段。这里按Conceptualization（构思）、Planning（规划）、Execution（执行）、Termination（终止或结束）说明整体过程。每个阶段都应有相应成果和继续推进的决定。"], ["Process Groups", "过程组", "按管理工作的作用分类，包括Initiating（启动）、Planning（规划）、Executing（执行）、Monitoring and Controlling（监控）、Closing（收尾）。过程组可以在不同阶段重复出现，监控也与执行同时进行。"], ["Rolling Wave Planning", "滚动式规划", "把近期工作安排得较详细，较远的工作先保留必要概括；取得新信息后，再细化下一段安排。例如下周设备安装已能排到每天，两个月后的人员培训先确定规模和日期范围。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>阶段<\/th><th>医院建设中的工作<\/th><th>阶段结果<\/th><\/tr><\/thead><tbody><tr><td>Conceptualization 构思<\/td><td>明确为什么建设、服务谁，调查关键要求<\/td><td>形成初步目标和可行方案<\/td><\/tr><tr><td>Planning 规划<\/td><td>细化范围、设计、预算、进度和人员安排<\/td><td>形成可执行并获批准的计划<\/td><\/tr><tr><td>Execution 执行<\/td><td>施工、安装、培训，并检查实际情况<\/td><td>逐步完成和验证成果<\/td><\/tr><tr><td>Termination 终止／结束<\/td><td>办理接受和移交，结清事项并重新分配资源<\/td><td>项目结束，医院继续运营<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><thead><tr><th>安装阶段中的行动<\/th><th>过程组<\/th><\/tr><\/thead><tbody><tr><td>确认本阶段负责人和授权<\/td><td>启动<\/td><\/tr><tr><td>安排下周人员和测试时间<\/td><td>规划<\/td><\/tr><tr><td>人员按安排安装设备<\/td><td>执行<\/td><\/tr><tr><td>比较实际工期与原计划，处理偏差<\/td><td>监控<\/td><\/tr><tr><td>接受本阶段成果并完成交接<\/td><td>收尾<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-project-success", "title": "Project Success 项目成功", "definition": "交付评价包含Budget预算、Time时间、Performance绩效、Client Acceptance客户接受。不同观察时期还分别看Project Efficiency项目效率、Impact on the Customer对客户的影响、Business Success业务成功、Preparing for the Future为未来作准备。", "formula": "改变范围、时间或成本时，检查其他约束和质量影响。", "example": "按时交付但未满足双语要求，不能判定完全成功。", "pitfall": "短期效率与长期价值在不同时间观察，不用一个指标替代全部结果。", "lesson": 79, "topic": "1.2", "source": "Lecture 1 · PDF第8、37–40页", "terms": [["Quadruple Constraint of Project Success", "项目成功的四重约束", "交付时需要同时检查Budget（预算）、Time（时间）、Performance（绩效）和Client Acceptance（客户接受）。在医院接待区，分别要看支出是否符合预算、能否按期开门、设施是否满足功能与性能要求，以及院方是否正式接受成果。"], ["Four Dimensions of Project Success", "项目成功的四个维度", "Project Efficiency（项目效率）关注交付时的时间、费用等表现；Impact on the Customer（对客户的影响）关注使用与满意；Business Success（业务成功）关注组织获得的收益；Preparing for the Future（为未来作准备）关注能力、技术和后续机会。观察时间不同，各维度的重要程度也会变化，不能在开放当天就把长期效果判定完毕。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>观察时间<\/th><th>可观察的结果<\/th><\/tr><\/thead><tbody><tr><td>交付时<\/td><td>是否按预算和日期完成，功能与性能是否合格，院方是否接受<\/td><\/tr><tr><td>投入使用后<\/td><td>患者和工作人员是否愿意使用，是否改善服务，是否产生预期收益<\/td><\/tr><tr><td>更长时期<\/td><td>团队是否形成可复用的能力，是否支持后续建设与组织目标<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-project-manager", "title": "Project Manager / Talent Triangle 项目经理与能力", "definition": "项目经理把技术计划、人员承诺与组织目标联系起来。", "formula": "Ways of Working；Power Skills；Business Acumen。", "example": "先确认工程师何时真正可用，再据此调整排程。", "pitfall": "正确的计算不等于人员已承诺执行；如实报告是管理责任的一部分。", "lesson": 80, "topic": "1.2", "source": "Lecture 1 · PDF第24–28、46–47页；Lecture 2 · 第4–8页", "terms": [["Project Manager", "项目经理", "负责组织团队、协调目标与资源，并推动项目交付的人。面对人员重复预约，他需要找出谁有权分配人员，协调可用时间，再把承诺落实到进度计划。"], ["Socio-technical Approach", "社会技术方法", "同时考虑技术分析和人员协作。正确计算出了开始时间，还需要确认人员愿意且能够执行；沟通取得支持后，也要检查新安排是否满足依赖、容量和交期。"], ["PMI Talent Triangle", "PMI人才三角", "Ways of Working（工作方式）涉及选择和使用方法；Power Skills（人际与领导能力）涉及沟通、协作与领导；Business Acumen（商业敏锐度）涉及理解组织目标和价值。三类能力共同支持项目决策。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>工作<\/th><th>医院中的做法<\/th><\/tr><\/thead><tbody><tr><td>技术方面<\/td><td>重算设备安装延后对最终检查的影响，比较可用资源<\/td><\/tr><tr><td>人员与组织方面<\/td><td>同工程部确认人员安排和决策权，商定冲突升级方式<\/td><\/tr><tr><td>落实结果<\/td><td>把确认后的人员、日期与责任更新到计划，通知受影响的负责人<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-project-knowledge", "title": "Knowledge Areas 十个知识领域", "definition": "按管理对象整理知识，并通过整合管理协调决定。", "formula": "整合、范围、进度、成本、质量、资源、沟通、风险、采购、利益相关者。", "example": "增加窗口同时影响范围、采购、时间、费用和人员。", "pitfall": "知识领域不是互不联系的十份清单，也不是按顺序只执行一次的十个阶段。", "lesson": 81, "topic": "1.2", "source": "Lecture 1 · PDF第30–36、41–44页", "terms": [["Knowledge Area", "知识领域", "按管理对象组织相关概念与过程。例如，范围管理处理要做哪些工作，进度管理处理工作何时完成。下表把新增窗口涉及的问题逐项列出。"], ["Integration Management", "整合管理", "协调各领域的决定，使团队使用相互一致的范围、预算、进度和资源安排。新增窗口获批后，项目经理要把有关影响一起处理，而不能只更新采购数量。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>英文术语<\/th><th>中文含义与当前问题<\/th><\/tr><\/thead><tbody><tr><td>Integration<\/td><td>整合：如何把新增窗口的各项决定汇总并批准<\/td><\/tr><tr><td>Scope<\/td><td>范围：新增窗口包括哪些成果和工作<\/td><\/tr><tr><td>Time / Schedule<\/td><td>时间／进度：何时完成，是否影响开放<\/td><\/tr><tr><td>Cost<\/td><td>成本：要增加多少预算<\/td><\/tr><tr><td>Quality<\/td><td>质量：设备和服务需达到什么标准<\/td><\/tr><tr><td>Human Resource / Resource<\/td><td>人力资源／资源：谁来做，需要哪些资源<\/td><\/tr><tr><td>Communications<\/td><td>沟通：哪些人需要什么信息<\/td><\/tr><tr><td>Risk<\/td><td>风险：哪些不确定情况会影响目标<\/td><\/tr><tr><td>Procurement<\/td><td>采购：向谁购买，需要哪些合同条件<\/td><\/tr><tr><td>Stakeholder<\/td><td>利益相关者：谁受影响，谁能影响决定<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-project-maturity", "title": "Project Management Maturity 管理成熟度", "definition": "组织稳定使用并持续改进项目管理实践的能力。", "formula": "Low Maturity：临时处理、缺少共同语言与支持；Moderate Maturity：明确实践、培训与组织支持；High Maturity：制度化并持续改进。", "example": "资源日历得到共同维护，比只购买排程软件更能说明改进。", "pitfall": "一次成功与可重复成功不同；制度和工具需要有实际使用证据。", "lesson": 82, "topic": "1.2", "source": "Lecture 1 · PDF第41–44页", "terms": [["Project Management Maturity", "项目管理成熟度", "组织把个人经验逐步发展为共同做法、组织支持和持续改进的程度。判断时需要观察多人、多项目能否重复使用有效方法。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>发展情况<\/th><th>可观察的证据<\/th><\/tr><\/thead><tbody><tr><td>Low Maturity 低成熟度<\/td><td>各部门术语和记录不同，问题主要靠个人临时处理<\/td><\/tr><tr><td>Moderate Maturity 中等成熟度<\/td><td>共同流程、角色、培训和模板得到使用，管理层提供支持<\/td><\/tr><tr><td>High Maturity 高成熟度<\/td><td>跨项目比较结果，调查偏差原因，将经验落实为新流程并检查效果<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-project-methods", "title": "Tailoring / Greenfield / Brownfield 方法适配与场地分类", "definition": "根据需求、技术、资源和风险选择方法，识别新建与改造的不同条件。", "formula": "先说明项目条件，再选择方法，最后写出执行所需的支持条件。", "example": "结构按阶段推进；预约界面分次试用；不停诊改造另设切换安排。", "pitfall": "框架有规则，方法也可适配；行业名称不能代替选择依据。", "lesson": 83, "topic": "1.2", "source": "Lecture 2 · PDF第9–18页", "terms": [["Methodology", "方法体系", "指导项目工作的一套实践、技术、步骤和规则。使用者据此安排怎样规划、执行、检查和交付。"], ["Framework", "框架", "组织工作的基本结构，为具体方法留下选择与调整的空间。实际使用中，同一套做法可能被称为方法或框架；判断是否适用，需要看它有哪些规则、解决什么问题。"], ["Tailoring", "适配", "根据当前项目的需求、技术、资源与风险选择和调整管理做法。例如，主体结构按批准图纸和阶段推进，预约界面分次试用，两者通过明确的接口和验收条件衔接。"], ["Greenfield / Brownfield", "新建项目／既有设施改造项目", "Greenfield从新场地或空白条件开始；Brownfield在已有设施上改造或扩建。例如不停诊改造旧接待区，还要安排隔离、临时通道、接口检查和服务切换。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>方法或框架<\/th><th>主要关注什么<\/th><\/tr><\/thead><tbody><tr><td>Waterfall 瀑布式<\/td><td>按阶段推进，前期要求较明确，阶段间有交接<\/td><\/tr><tr><td>Agile / Scrum 敏捷／Scrum<\/td><td>分次交付，频繁反馈；Scrum规定角色、事件和工件<\/td><\/tr><tr><td>Kanban 看板<\/td><td>显示工作流，限制在制工作，观察流动情况<\/td><\/tr><tr><td>Lean 精益<\/td><td>减少浪费，改善价值交付过程<\/td><\/tr><tr><td>Six Sigma 六西格玛<\/td><td>依据数据减少过程变异与缺陷<\/td><\/tr><tr><td>CCPM 关键链项目管理<\/td><td>安排资源约束下的工作，用缓冲管理不确定性<\/td><\/tr><tr><td>PRINCE2 受控环境下的项目管理<\/td><td>按明确责任、阶段和持续商业依据治理项目<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-strategy-tows", "title": "TOWS / Strategic Alignment 战略对齐", "definition": "交叉内部S/W与外部O/T，提出支持组织目标的行动。", "formula": "SO用优势抓机会；ST用优势应对威胁；WO借机会补弱点；WT减少弱点与威胁的影响。", "example": "缺少多语言经验＋社区合作机会→联合翻译与试用，属于WO。", "pitfall": "四栏因素清单不等于策略；每项策略应说明行动与依据。", "lesson": 84, "topic": "2.1", "source": "Lecture 2 · PDF第19–21页", "terms": [["Strategic Alignment", "战略对齐", "说明项目怎样支持组织目标。医院若要改善患者到院体验，就应解释新项目会改变哪段服务、怎样判断改善，而不能只说要购买新设备。"], ["TOWS Matrix", "TOWS矩阵", "将内部的Strengths（优势）、Weaknesses（弱点）与外部的Opportunities（机会）、Threats（威胁）交叉，提出具体行动。内部因素来自组织自身；外部因素来自组织所处的环境。下面四种组合使用同一组医院条件。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>组合<\/th><th>怎样形成行动<\/th><th>医院例子<\/th><\/tr><\/thead><tbody><tr><td>SO 优势＋机会<\/td><td>利用已有优势把握机会<\/td><td>技术团队与社区机构合作，试点多语言取号界面<\/td><\/tr><tr><td>ST 优势＋威胁<\/td><td>运用优势减轻外部威胁<\/td><td>技术团队改进叫号与分流，应对患者增长<\/td><\/tr><tr><td>WO 弱点＋机会<\/td><td>借外部机会补足内部弱点<\/td><td>邀请社区机构参与翻译与使用测试<\/td><\/tr><tr><td>WT 弱点＋威胁<\/td><td>减少弱点造成的暴露，并应对威胁<\/td><td>先改善薄弱的接待流程，分阶段开放新窗口<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-selection-screen", "title": "Screening / Checklist 筛选模型与清单", "definition": "先明确必须满足的条件，再按共同标准比较候选。", "formula": "好模型：现实性、能力、灵活性、易用性、成本效益、可比性。", "example": "超过硬性预算上限的方案不能仅凭高分自动入选。", "pitfall": "普通清单不表达权重；主观判断也应有公开的规则和依据。", "lesson": 85, "topic": "2.1", "source": "Lecture 7 · PDF第3–7页", "terms": [["Screening Model", "项目筛选模型", "用一套明确的标准评价候选项目，帮助决定哪些方案值得继续研究。标准包括必须满足的条件，也可以包括允许相互权衡的表现。"], ["Checklist", "清单模型", "把需要检查的条件逐项列出，记录各候选是否满足以及判断依据。例如，是否有资金来源、能否维持接待服务、是否具备接口条件。普通清单便于发现缺项，但通过项目的数量没有表达各条件的重要程度。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>比较方面<\/th><th>需要调查的内容<\/th><\/tr><\/thead><tbody><tr><td>Risk 风险<\/td><td>技术、财务、安全、质量和法律方面的不确定性<\/td><\/tr><tr><td>Commercial 商业因素<\/td><td>预期收益、回收时间、初始支出、未来业务与市场机会<\/td><\/tr><tr><td>Internal Operating 内部运营<\/td><td>培训、人员结构、工作环境、服务流程的变化<\/td><\/tr><tr><td>Strategic Fit等其他因素<\/td><td>与组织目标的关系、形象、专利或其他约束<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><thead><tr><th>好模型的要求<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>Realism 现实性<\/td><td>反映实际目标和约束<\/td><\/tr><tr><td>Capability 能力<\/td><td>能比较需要考虑的不同因素<\/td><\/tr><tr><td>Flexibility 灵活性<\/td><td>条件变化时可以调整<\/td><\/tr><tr><td>Ease of Use 易用性<\/td><td>参与者能够理解和使用<\/td><\/tr><tr><td>Cost Effectiveness 成本效益<\/td><td>分析投入与决策价值相称<\/td><\/tr><tr><td>Comparability 可比性<\/td><td>不同项目使用一致的标准与尺度<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-selection-score", "title": "Weighted Scoring / Sensitivity 加权评分与敏感性", "definition": "先统一标准、尺度与方向，再用权重汇总评分。", "formula": "S=Σwᵢsᵢ；归一化所有权重不会改变同一组候选排序。", "example": "5×5+3×3+2×3=40；提高实施准备权重后重看排序。", "pitfall": "权重是重要程度，评分是表现；总分不是货币收益或成功概率。", "lesson": 86, "topic": "2.1", "source": "Lecture 7 · PDF第8–10页", "terms": [["Weighted Scoring Model", "加权评分模型", "把每项标准的评分乘以重要性权重，再相加。权重表达标准的重要程度，评分表达某个项目在该标准上的表现。"], ["Sensitivity Analysis", "敏感性分析", "改变一个有争议或可能变化的输入，观察结论是否变化。例如提高“实施准备”的权重后，药房方案可能超过取号设备方案。报告排序时应说明使用的权重和变化后的结果。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>项目<\/th><th>患者体验（权重5）<\/th><th>实施准备（权重3）<\/th><th>成本适宜（权重2）<\/th><\/tr><\/thead><tbody><tr><td>更新取号设备<\/td><td>5<\/td><td>3<\/td><td>3<\/td><\/tr><tr><td>改造药房窗口<\/td><td>3<\/td><td>5<\/td><td>4<\/td><\/tr><tr><td>开发预约功能<\/td><td>4<\/td><td>2<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": ["总分 S＝Σ(wᵢ×sᵢ)；归一化权重＝原权重÷全部权重之和"]}, {"id": "r-selection-ahp", "title": "AHP / Local and Global Weight 层级权重", "definition": "局部权重属于父组，全局权重属于总目标。", "formula": "全局权重=沿层级路径的权重乘积；总分=Σ全局权重×评价。", "example": "0.6×0.75=0.45，而非0.75或1.35。", "pitfall": "同层权重检查总和；不要把局部权重当作全局权重。", "lesson": 87, "topic": "2.1", "source": "Lecture 7 · PDF第11–12页", "terms": [["Analytic Hierarchy Process (AHP)", "层次分析法", "将目标、标准和子标准组织成层级，分配权重，评价候选，再汇总得分。依次构建标准与子标准层级、分配权重、给候选的各维度评分、汇总权重与评分的乘积。这里按已有层级权重计算候选项目的综合表现。"], ["Local Weight / Global Weight", "局部权重／全局权重", "局部权重表示同一组内的相对重要性；全局权重表示对总目标的重要性，等于从根节点到该子项沿途权重的乘积。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>上层标准及权重<\/th><th>子标准<\/th><th>组内权重<\/th><th>相对于总目标的权重<\/th><\/tr><\/thead><tbody><tr><td>服务效果0.6<\/td><td>患者体验<\/td><td>0.75<\/td><td>0.6×0.75=0.45<\/td><\/tr><tr><td>服务效果0.6<\/td><td>工作效率<\/td><td>0.25<\/td><td>0.6×0.25=0.15<\/td><\/tr><tr><td>实施条件0.4<\/td><td>技术准备<\/td><td>0.5<\/td><td>0.4×0.5=0.20<\/td><\/tr><tr><td>实施条件0.4<\/td><td>费用<\/td><td>0.5<\/td><td>0.4×0.5=0.20<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": ["子标准全局权重＝上层权重×子标准局部权重 项目总分＝Σ(子标准全局权重×相应评分)"]}, {"id": "r-selection-profile", "title": "Profile Model / Dominance 风险收益比较", "definition": "先读轴和门槛，再比较是否存在风险不高而收益更高的候选。", "formula": "甲支配乙：风险甲≤风险乙，收益甲≥收益乙，至少一项严格更好。", "example": "(收益80,风险3)支配(70,3)，与(100,6)相互不支配。", "pitfall": "处在有效边界不等于已满足预算、资源或战略要求。", "lesson": 88, "topic": "2.1", "source": "Lecture 7 · PDF第13页", "terms": [["Profile Model", "风险收益图", "把候选项目画在风险和收益两个坐标轴上，比较哪些项目满足门槛，以及承担更多风险是否换来了更高收益。本例横轴为收益，向右增加；纵轴为风险，向上增加。"], ["Dominance", "支配关系", "若甲的风险不高于乙、收益不低于乙，而且至少一项更好，就说甲支配乙。在这些比较条件相同的前提下，乙没有比甲更有利的维度。"], ["Efficient Frontier", "有效边界", "当前候选中，未被其他项目支配的方案形成有效边界。边界上的项目仍可能在高收益与低风险之间各有取舍，需要结合院方的要求再选择。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>方案<\/th><th>收益（万元）<\/th><th>风险评分，越低越好<\/th><\/tr><\/thead><tbody><tr><td>更新取号设备<\/td><td>80<\/td><td>3<\/td><\/tr><tr><td>改造药房窗口<\/td><td>70<\/td><td>3<\/td><\/tr><tr><td>开发预约功能<\/td><td>100<\/td><td>6<\/td><\/tr><tr><td>完善院内指路牌<\/td><td>55<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-finance-payback", "title": "Payback / Discounted Payback 回收期", "definition": "累计现金流收回初始投资的时间；贴现回收期先折算现金流。", "formula": "年内插值需均匀流入条件；离散年末数据报告第几年末。", "example": "投入10、每年6：年末判断为第2年；均匀流入假设下约1.67年。", "pitfall": "普通回收期忽略时间价值和回收后的收益。", "lesson": 89, "topic": "2.2", "source": "Lecture 7 · PDF第14–18、21–22页", "terms": [["Cash Flow", "现金流", "在某个时点实际流入或流出的金额。站在医院的角度，购买设备是流出，记为负数；以后节省的净支出作为项目带来的净流入，记为正数。金额和发生时间需要一起记录。"], ["Payback Period", "投资回收期", "从初始投入到累计净现金流首次达到零所经过的时间。它回答资金要被占用多久，便于比较回收快慢。按上表的年末记录，本例在第2年末收回投入。"]], "tables": ["<div class=\"table-scroll\"><table><caption>现金流表：按发生时间排列各笔净流入与净流出<\/caption><thead><tr><th>时点<\/th><th>发生的事情<\/th><th>净现金流（万元）<\/th><th>累计现金流（万元）<\/th><\/tr><\/thead><tbody><tr><td>0，即现在<\/td><td>支付设备款<\/td><td>-10<\/td><td>-10<\/td><\/tr><tr><td>第1年末<\/td><td>获得第一年净节省<\/td><td>6<\/td><td>-4<\/td><\/tr><tr><td>第2年末<\/td><td>获得第二年净节省<\/td><td>6<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": ["每年等额且均匀流入：回收期＝初始投入÷年度净流入 各年金额不同、回收当年均匀流入：完整年数＋剩余未回收金额÷回收当年净流入"]}, {"id": "r-finance-npv", "title": "NPV / Discount Rate 净现值与贴现率", "definition": "把各期现金流折算到同一时点后求和。", "formula": "NPV=−I+ΣCFₜ/(1+k)ᵗ；初始现金流本身为负时直接加入。", "example": "投入10、两年各6、k=10%，NPV约0.4132万元。", "pitfall": "统一现金流符号、周期与贴现率；不重复加入通胀。", "lesson": 90, "topic": "2.2", "source": "Lecture 7 · PDF第19–23页", "terms": [["Present Value (PV)", "现值", "未来一笔金额按给定回报要求折算到今天的价值。把不同时间的金额换到同一时点，才能与今天的投入比较。这里PV表示现值；进度与成本控制中的Planned Value也缩写为PV，含义需按上下文区分。"], ["Discount Rate", "贴现率", "折算未来现金流使用的比率。本例采用每年10%，小数形式为0.10。期限以年计，贴现率也采用年率；第2年末的金额要连续折算两年。"], ["Net Present Value (NPV)", "净现值", "把所有现金流的现值相加，包括最初的支出。它表示按所用贴现率衡量后，项目相对投入增加或减少了多少价值。"], ["Discounted Payback Period", "贴现投资回收期", "将未来净流入先折为现值，再逐期累计，判断何时收回投入。本例第1年末累计为−4.5455万元，第2年末为0.4132万元，按年末记录也在第2年末回收。两种回收期相同，并不表示两种累计金额相同。"]], "tables": ["<div class=\"table-scroll\"><table><caption>同一份现金流按10%年贴现率折算；计算时保留中间精度<\/caption><thead><tr><th>时点<\/th><th>净现金流（万元）<\/th><th>折算过程<\/th><th>现值（万元）<\/th><\/tr><\/thead><tbody><tr><td>现在<\/td><td>-10<\/td><td>已经是现在的金额<\/td><td>-10<\/td><\/tr><tr><td>第1年末<\/td><td>6<\/td><td>6÷1.10<\/td><td>5.4545<\/td><\/tr><tr><td>第2年末<\/td><td>6<\/td><td>6÷1.10²<\/td><td>4.9587<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": ["第t年末现金流的现值＝Fₜ÷(1+k)ᵗ Fₜ为该年净现金流，k为每期贴现率，t为距现在的期数", "NPV＝−初始投入＋Σ[Fₜ÷(1+k)ᵗ]"]}, {"id": "r-finance-irr", "title": "IRR 内部收益率", "definition": "使NPV为0的贴现率，需与要求回报率比较。", "formula": "−I+ΣCFₜ/(1+IRR)ᵗ=0。", "example": "投入10、两年各6，IRR约13.0662%。", "pitfall": "常规现金流下根通常唯一；多次符号变化时不能默认唯一。", "lesson": 91, "topic": "2.2", "source": "Lecture 7 · PDF第24–25页", "terms": [["Internal Rate of Return (IRR)", "内部收益率", "使一组现金流的净现值等于零的贴现率。IRR由投入、后续流入及其时点决定；要求回报率则是院方用来比较的标准。"]], "tables": ["<div class=\"table-scroll\"><table><caption>通过NPV的正负变化寻找IRR<\/caption><thead><tr><th>试算贴现率<\/th><th>NPV（万元）<\/th><th>判断<\/th><\/tr><\/thead><tbody><tr><td>10%<\/td><td>约0.4132<\/td><td>正，尚高于要求回报<\/td><\/tr><tr><td>15%<\/td><td>约−0.2457<\/td><td>负，尚不足以达到这一回报<\/td><\/tr><tr><td>约13.0662%<\/td><td>约0<\/td><td>达到本组现金流的IRR<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": ["0＝−10＋6÷(1+IRR)＋6÷(1+IRR)²"]}, {"id": "r-selection-portfolio", "title": "Program / Portfolio 项目集与项目组合", "definition": "项目集协调关联收益；组合按战略与整体约束选择和复审项目。", "formula": "高潜力高可行Pearls；高潜力低可行Oysters；低潜力高可行Bread and Butter；低低White Elephants。", "example": "预算10，乙丙各5且价值可相加时，可能优于单项最高分甲。", "pitfall": "组合需检查收益重复、项目依赖、人员和预算；立项后仍应复审。", "lesson": 92, "topic": "2.2", "source": "Lecture 1 · PDF第22页；Lecture 7 · 第26–32页", "terms": [["Program / Portfolio", "项目集／项目组合", "项目集协调相互关联的项目，以获得分别管理难以取得的共同收益。项目组合围绕组织战略选择、支持和调整项目及项目集，其中的项目不必具有直接技术依赖。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>商业潜力<\/th><th>技术可行性<\/th><th>项目组合中的名称与含义<\/th><\/tr><\/thead><tbody><tr><td>高<\/td><td>高<\/td><td>Pearls，珍珠：有吸引力且较可行<\/td><\/tr><tr><td>高<\/td><td>低<\/td><td>Oysters，牡蛎：潜力大，仍需突破技术不确定性<\/td><\/tr><tr><td>低<\/td><td>高<\/td><td>Bread and Butter，日常收益项目：技术较成熟，收益较温和<\/td><\/tr><tr><td>低<\/td><td>低<\/td><td>White Elephants，白象：缺少足够价值且实施困难，需复查是否继续<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-stakeholder-identify", "title": "Stakeholder / Register 利益相关者与登记册", "definition": "识别影响项目或受到影响的人，记录其需求、担忧和影响方式。", "formula": "角色＋利益与需求＋影响＋参与安排；随阶段更新。", "example": "附近居民即使不是合同方，也可能因施工噪声需要沟通。", "pitfall": "只列联系人不等于完成分析；反对者也是利益相关者。", "lesson": 93, "topic": "3.1", "source": "Lecture 2 · PDF第23–28、32–40页", "terms": [["Stakeholder", "利益相关者", "可能影响项目、受到项目影响，或认为自己受到影响的个人、群体或组织。患者和居民即使没有与项目签合同，也可能因服务或施工变化受到影响。"], ["Stakeholder Register", "利益相关者登记册", "逐项记录利益相关者身份、角色、需求、担忧和影响方式的资料。它帮助项目经理确定需要向谁了解要求、邀请谁参与决定，以及谁需要收到信息。下表先记录角色、需求与影响，随后再分析参与方式。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>角色<\/th><th>关心什么<\/th><th>怎样影响项目<\/th><\/tr><\/thead><tbody><tr><td>院方负责人<\/td><td>服务目标、预算和开放时间<\/td><td>批准范围、资金和重大变更<\/td><\/tr><tr><td>接待人员<\/td><td>操作是否方便，培训是否充分<\/td><td>提供使用要求，参与测试和交接<\/td><\/tr><tr><td>患者与家属<\/td><td>找路方便，服务不中断<\/td><td>提供使用反馈，反映通行问题<\/td><\/tr><tr><td>供应商<\/td><td>接口、交期与付款条件<\/td><td>交付设备，提出技术与交货信息<\/td><\/tr><tr><td>附近居民<\/td><td>噪声、交通与施工时间<\/td><td>提出意见，影响外部接受程度<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-stakeholder-power", "title": "Power–Interest Grid 权力—利益矩阵", "definition": "按权力和关注程度选择沟通与参与强度。", "formula": "高高密切管理；高权低利保持满意；低权高利保持知情；低低关注变化。", "example": "审批方高权低关注，在关键节点提供完整信息。", "pitfall": "横纵轴先读清；低权力不等于需求可以忽略。", "lesson": 94, "topic": "3.1", "source": "Lecture 2 · PDF第29–31页", "terms": [["Power–Interest Grid", "权力—利益矩阵", "Power（权力）表示影响决定或资源的能力；Interest（利益或关注程度）表示对项目结果的关切程度。把两项判断组合成四格图，就能比较不同角色需要怎样的沟通与参与。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>权力<\/th><th>利益或关注<\/th><th>管理方式<\/th><th>具体行动<\/th><\/tr><\/thead><tbody><tr><td>高<\/td><td>高<\/td><td>Manage Closely 密切管理<\/td><td>邀请院方负责人参与关键决定，及时报告影响开放的变化<\/td><\/tr><tr><td>高<\/td><td>低<\/td><td>Keep Satisfied 保持满意<\/td><td>在审批节点提供足够材料，及时报告影响其要求的变化<\/td><\/tr><tr><td>低<\/td><td>高<\/td><td>Keep Informed 保持知情<\/td><td>向接待人员说明使用变化和培训安排，并收集反馈<\/td><\/tr><tr><td>低<\/td><td>低<\/td><td>Monitor 关注变化<\/td><td>保留适当信息渠道，定期检查其处境是否变化<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-stakeholder-cooperation", "title": "Cooperation–Threat 合作—威胁矩阵", "definition": "分别衡量合作支持和潜在不利影响，再确定策略。", "formula": "横向威胁左低右高，纵向合作上低下高。低低Marginal边缘型／Monitor；高合作低威胁Supportive支持型／Involve；低合作高威胁Non-Supportive不支持型／Defend；高高Mixed Blessing利弊并存型／Collaborate。", "example": "关键供应商可同时具有高合作、高威胁潜力。", "pitfall": "不能把权力直接等同威胁，也不能把高威胁解释为必然敌对。", "lesson": 95, "topic": "3.1", "source": "Lecture 2 · PDF第30–31页", "terms": [["Potential for Cooperation / Potential for Threat", "合作潜力／威胁潜力", "合作潜力表示共同工作能给项目带来的支持；威胁潜力表示对方可能妨碍项目目标的程度。它们与权力、关注程度衡量的内容不同。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>合作潜力<\/th><th>威胁潜力<\/th><th>策略<\/th><th>怎样理解<\/th><\/tr><\/thead><tbody><tr><td>低<\/td><td>低<\/td><td>Marginal 边缘型；Monitor 监测<\/td><td>保持观察，发现角色或条件变化<\/td><\/tr><tr><td>高<\/td><td>低<\/td><td>Supportive 支持型；Involve 参与<\/td><td>邀请提供经验、资源与反馈<\/td><\/tr><tr><td>低<\/td><td>高<\/td><td>Non-Supportive 不支持型；Defend 防御<\/td><td>减少依赖，明确边界和替代安排<\/td><\/tr><tr><td>高<\/td><td>高<\/td><td>Mixed Blessing 利弊并存型；Collaborate 协作<\/td><td>建立共同工作机制，同时明确责任与风险分担<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-stakeholder-communication", "title": "Engagement / Communication 参与与沟通", "definition": "登记身份与需求，比较当前和期望参与，再安排具体行动。", "formula": "对象＋内容＋频率或触发点＋负责人＋渠道＋反馈。", "example": "抵制来自步骤增加，就安排真实流程试用并处理反馈。", "pitfall": "不要求所有人都Leading；发出报告也不等于完成沟通。", "lesson": 96, "topic": "3.1", "source": "Lecture 2 · PDF第32–36页", "terms": [["Stakeholder Engagement", "利益相关者参与", "利益相关者了解、支持或参与项目工作的情况。项目经理比较当前状态与所需状态，找出需要采取的行动。例如，接待主管需要先试用并讨论流程，才能判断是否支持新安排。"], ["Communication Plan", "沟通计划", "明确谁向谁提供什么信息、何时提供、通过什么渠道，以及如何收到反馈或决定。它把参与分析转成可执行的联系安排。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>参与状态<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>Unaware 不知情<\/td><td>尚不了解项目及其影响<\/td><\/tr><tr><td>Resistant 抵制<\/td><td>了解后持反对或阻碍态度<\/td><\/tr><tr><td>Neutral 中立<\/td><td>了解但尚未明确支持或反对<\/td><\/tr><tr><td>Supportive 支持<\/td><td>愿意配合项目<\/td><\/tr><tr><td>Leading 主动推动<\/td><td>积极推动成果与相关改变<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><thead><tr><th>对象<\/th><th>当前→期望<\/th><th>行动<\/th><th>负责人、时间与渠道<\/th><\/tr><\/thead><tbody><tr><td>接待主管<\/td><td>抵制→支持<\/td><td>演示真实登记流程，记录新增步骤并一起评审<\/td><td>项目经理，周三现场试用，下周复查意见<\/td><\/tr><tr><td>院方负责人<\/td><td>支持→主动推动关键决定<\/td><td>说明待决定事项、选项和影响<\/td><td>项目经理，每周简报，紧急事项单独报告<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-organization-forms", "title": "Organization Structures 组织结构", "definition": "结构决定项目与专业部门怎样分配人员、授权和汇报。", "formula": "职能型重专业；项目型重项目整合；矩阵共享资源并需协调双重管理。", "example": "弱矩阵偏职能，强矩阵偏项目经理，平衡矩阵共享。", "pitfall": "结构选择取决于战略、规模、整合需求和资源，不存在无条件最优结构。", "lesson": 97, "topic": "3.2", "source": "Lecture 2 · PDF第42–55、60页", "terms": [["Functional / Projectized / Matrix Organization", "职能型／项目型／矩阵型组织", "职能型按专业部门管理人员；项目型围绕项目设置较专职的团队；矩阵型让项目负责人和职能负责人共同参与管理，以共享专业资源。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>结构<\/th><th>主要优点<\/th><th>需要处理的问题<\/th><\/tr><\/thead><tbody><tr><td>职能型<\/td><td>专业积累和职业路径稳定，人员按部门管理<\/td><td>跨部门响应较慢，项目目标可能让位于部门任务<\/td><\/tr><tr><td>项目型<\/td><td>项目经理权力较集中，沟通和决定较直接<\/td><td>可能重复配置资源，结束后需安置人员<\/td><\/tr><tr><td>矩阵型<\/td><td>共享稀缺专业人员，同时关注项目交付<\/td><td>双重汇报、资源优先级和权责冲突<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-organization-pmo", "title": "PMO 项目管理办公室", "definition": "按组织需要提供支持、标准、资源或直接管理。", "formula": "Supportive低控制；Controlling中控制；Directive高控制。", "example": "状态汇总功能不自动带来调配人员的权限。", "pitfall": "两套类型描述角度不同，不能仅按名称推断实际授权。", "lesson": 98, "topic": "3.2", "source": "Lecture 2 · PDF第56–59页", "terms": [["Project Management Office (PMO)", "项目管理办公室", "为项目提供集中支持、标准、资源或直接管理的组织单位。授权程度和作用应由组织需要决定。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>类型<\/th><th>控制程度与作用<\/th><\/tr><\/thead><tbody><tr><td>Supportive 支持型<\/td><td>控制较低，提供模板、培训与咨询<\/td><\/tr><tr><td>Controlling 控制型<\/td><td>控制中等，要求采用规定流程和标准并检查遵守情况<\/td><\/tr><tr><td>Directive 指令型<\/td><td>控制较高，直接管理项目与项目经理<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><thead><tr><th>另一组功能描述<\/th><th>侧重的工作<\/th><\/tr><\/thead><tbody><tr><td>Weather Station 气象站<\/td><td>收集并报告各项目状态<\/td><\/tr><tr><td>Control Tower 控制塔<\/td><td>建立标准并改善项目执行<\/td><\/tr><tr><td>Resource Pool 资源池<\/td><td>提供受过训练的项目管理人员<\/td><\/tr><tr><td>Command and Control 指挥控制<\/td><td>拥有直接指挥和管理权限<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-organization-culture", "title": "Organizational Culture 组织文化", "definition": "从共同价值与实际行为理解组织如何工作。", "formula": "观察互动、资料、空间、故事及真正执行的奖励规则。", "example": "鼓励报告的口号与处罚报告者的行为冲突时，应调查实际激励。", "pitfall": "不能仅凭宣传语判定文化；改进措施需影响具体行为。", "lesson": 99, "topic": "3.2", "source": "Lecture 2 · PDF第62–70页", "terms": [["Organizational Culture", "组织文化", "成员共同形成的信念、价值、规范和行为方式。可以通过日常互动、组织资料、工作空间、故事，以及实际奖励和处罚来观察。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>观察角度<\/th><th>可以调查的问题<\/th><\/tr><\/thead><tbody><tr><td>Member Identity 成员认同；Team Emphasis 团队导向<\/td><td>人员更认同专业部门还是整体项目，是否鼓励合作<\/td><\/tr><tr><td>People Focus 人员关注；Unit Integration 部门整合<\/td><td>决定是否考虑人员影响，部门是否共享信息<\/td><\/tr><tr><td>Control 控制；Risk Tolerance 风险容忍<\/td><td>规则怎样执行，是否允许合理试验<\/td><\/tr><tr><td>Reward Criteria 奖励标准；Conflict Tolerance 冲突容忍<\/td><td>奖励实际结果还是表面服从，能否提出不同意见<\/td><\/tr><tr><td>Means–Ends Orientation 手段与结果；Open-system Focus 开放性<\/td><td>是否只看结果，是否关注外部环境和反馈<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}, {"id": "r-organization-conflict", "title": "Conflict Management 冲突处理", "definition": "先调查事实与原因，再按重要性、时间、关系和权限选择方式。", "formula": "回避、迁就、竞争、妥协、合作。", "example": "有时间时共同分析切换条件；紧急事项先按明确权限处理。", "pitfall": "合作不等于机械折半，妥协也不保证根因已经消除。", "lesson": 100, "topic": "3.2", "source": "Lecture 2 · PDF第71–72页", "terms": [["Conflict Management", "冲突管理", "针对目标、资源、信息或关系上的分歧，选择合适的处理办法。问题重要程度、时间、关系和决定权限都会影响选择。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>方式<\/th><th>什么时候可能合适<\/th><th>需要注意什么<\/th><\/tr><\/thead><tbody><tr><td>Avoiding 回避<\/td><td>问题暂不重要，或需要先补充事实再谈<\/td><td>不能用拖延处理紧急的重要问题<\/td><\/tr><tr><td>Accommodating 迁就<\/td><td>对方诉求重要，而自己让步代价较小<\/td><td>反复单方面让步可能留下未解决问题<\/td><\/tr><tr><td>Competing 竞争／强制<\/td><td>时间紧迫且有明确权限，需要执行必要决定<\/td><td>可能影响关系，也不应超越授权<\/td><\/tr><tr><td>Compromising 妥协<\/td><td>双方各让一部分以尽快达成可接受安排<\/td><td>不一定解决根本原因<\/td><\/tr><tr><td>Collaborating 合作<\/td><td>问题重要，有时间共同调查需求并寻找更好方案<\/td><td>需要信息与参与，不能假定总能立即达成<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": []}], "themes": [{"id": "1", "title": "项目管理基础", "topics": [{"id": "1.1", "title": "项目、成果与生命周期", "units": ["K02", "K03", "K04"], "objective": "能区分临时项目与持续运营，说明交付物如何产生价值。能区别生命周期阶段与五大过程组，解释滚动规划。", "status": "ready", "sourceTopics": ["1.1", "1.2"]}, {"id": "1.2", "title": "项目成功与管理方式", "units": ["K05", "K06", "K07", "K08", "K09"], "objective": "能综合范围、时间、成本、质量与客户接受评价成功。能解释社会技术双重管理、成熟度、标准与方法适配。", "status": "ready", "sourceTopics": ["1.3", "1.4"]}]}, {"id": "2", "title": "战略与项目选择", "topics": [{"id": "2.1", "title": "从战略目标到项目筛选", "units": ["K10", "K46", "K47", "K48", "K49"], "objective": "能从内部外部条件提出有依据的策略。能使用清单、加权
