<script>const TEACHING={"title": "Project Scheduling · 项目进度计划", "revision": "assessment-4", "lessons": [{"id": "start", "title": "Project Scheduling · 项目进度计划", "goal": "知道这一专题对应什么内容、解决什么问题、从哪里开始。", "source": "Lecture 4 · Project Schedule and Cost Management (I)", "body": "<p class=\"opening\">项目经理安排工作时，需要知道每项工作做多久，以及哪些工作必须先做。<b>Project Scheduling（项目进度计划）<\/b>把这些信息联系起来，帮助我们安排开始和完成时间，找出影响项目完工的关键工作。<\/p>\n<div class=\"source-scope\"><b>在课程中的位置<\/b><p>本专题主要对应 <b>Lecture 4: Project Schedule and Cost Management (I)<\/b>（项目进度与成本管理Ⅰ），第8–63页；综合练习对应第65–67页。<\/p><p>课程先通过 <b>Scope（范围）<\/b>确定要做哪些工作，再通过 <b>Schedule（进度）<\/b>安排顺序和时间，随后讨论 <b>Resources / Cost（资源与成本）<\/b>及 <b>Control（项目监控）<\/b>。<\/p><\/div>\n<p>我们用医院接待区准备开放的过程举例：从列出工作，到画出先后关系，再计算完成时间。下表列出这条学习路线中的术语与内容。<\/p><p><button class=\"primary\" data-begin>从活动和工期开始<\/button><\/p><h2>内容导航<\/h2><div data-slot=\"learning-map\"><\/div>\n<details class=\"source-details\"><summary>课件对应<\/summary><div class=\"table-scroll\"><table><thead><tr><th>内容<\/th><th>PDF页码<\/th><\/tr><\/thead><tbody><tr><td>活动、先后关系与网络图<\/td><td>Lecture 4，第8–27页<\/td><\/tr><tr><td>三点工期估计<\/td><td>Lecture 4，第28–36页<\/td><\/tr><tr><td>正推、逆推、时差与关键路径<\/td><td>Lecture 4，第37–54页<\/td><\/tr><tr><td>完工概率与目标期限<\/td><td>Lecture 4，第55–63页<\/td><\/tr><tr><td>综合练习<\/td><td>Lecture 4，第65–67页<\/td><\/tr><tr><td>Work Breakdown Structure（WBS），工作分解结构：将项目拆成可管理的工作部分<\/td><td>Lecture 3: Project Scope Management，第23–26页<\/td><\/tr><tr><td>Gantt Chart，甘特图：用横条表示工作起止时间<\/td><td>Lecture 5: Project Schedule and Cost Management (II)，第43–45页<\/td><\/tr><\/tbody><\/table><\/div><\/details>\n<p>按目录顺序阅读，可以把同一个例子的表格、网络图和计算联系起来。复习时，也可以直接进入某个主题，或在“速查”中搜索术语。<\/p>", "questions": [], "task": "intro", "refs": ["overview", "activity", "relations"], "requires": [], "introduces": ["schedule"], "topic": "5.1", "sourceTopic": "5.1", "order": 0, "terms": [], "material": {"context": "项目经理安排工作时，需要知道每项工作做多久，以及哪些工作必须先做。 Project Scheduling（项目进度计划） 把这些信息联系起来，帮助我们安排开始和完成时间，找出影响项目完工的关键工作。", "terms": [], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>内容<\/th><th>PDF页码<\/th><\/tr><\/thead><tbody><tr><td>活动、先后关系与网络图<\/td><td>Lecture 4，第8–27页<\/td><\/tr><tr><td>三点工期估计<\/td><td>Lecture 4，第28–36页<\/td><\/tr><tr><td>正推、逆推、时差与关键路径<\/td><td>Lecture 4，第37–54页<\/td><\/tr><tr><td>完工概率与目标期限<\/td><td>Lecture 4，第55–63页<\/td><\/tr><tr><td>综合练习<\/td><td>Lecture 4，第65–67页<\/td><\/tr><tr><td>Work Breakdown Structure（WBS），工作分解结构：将项目拆成可管理的工作部分<\/td><td>Lecture 3: Project Scope Management，第23–26页<\/td><\/tr><tr><td>Gantt Chart，甘特图：用横条表示工作起止时间<\/td><td>Lecture 5: Project Schedule and Cost Management (II)，第43–45页<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "concepts", "title": "Activity / Duration · 活动和工期", "goal": "认出例子里的每项工作，区分“做什么”和“做多久”。", "source": "Lecture 4 · 第8、12、29–30页", "body": "<section class=\"concept\" data-term=\"activity\"><h2><span lang=\"en\">Activity<\/span><span>活动<\/span><\/h2><p>项目中一项需要执行的具体工作。例如，给一家医院的服务台安装电脑和取号设备，就是一项活动。活动名称应当顾名思义，让人知道具体要做什么。<\/p><\/section><section class=\"concept\" data-term=\"duration\"><h2><span lang=\"en\">Duration<\/span><span>工期（历时）<\/span><\/h2><p>完成一项活动所需的时间。例如，设计师完成指路牌图样需要3天，这项活动的工期就是3天。<\/p><\/section><h2>例子：医院接待区准备开放<\/h2><p>为了理解Project Scheduling怎样安排工作，我们先引入一个示例背景。想象你负责一家医院接待区开放前的准备：装修已经完成，接下来需要安装电脑和取号设备，还要设置指路牌。设计师和两组工人将完成以下工作。<\/p><div data-slot=\"case-introduction\"><\/div>\n<h2>活动和工期的差别<\/h2><p>“设计指路牌”说明设计师要做什么，“3天”说明设计师需要多久。确定开始时间以后，才能据此算出完成时间。<\/p><div class=\"worked-example\"><p>例如，设计师周二上午开始设计，用3天完成，到周五上午交出图样。<\/p><p>活动：设计指路牌。工期：3天。开始时间：周二上午。完成时间：周五上午。<\/p><\/div>", "questions": [{"id": "v4-activity", "prompt": "负责人在活动表里写“指路牌，2天”。准备交给工人执行时，怎样修改这条记录，才能明确工作内容？", "options": ["改为“指路牌工作，2天”", "改为“制作并安装指路牌，2天”", "保留“指路牌”，再填写开始和完成日期"], "correct": 1, "feedback": ["“工作”仍没有说明是设计、制作还是安装。", "活动名称说明要做的动作和对象，工期再说明需要多久。", "日期说明何时做，仍无法说明工人需要完成哪项工作。"], "ref": "activity", "contextLesson": "concepts", "fingerprint": "172ebc32006579cc", "legacyFingerprint": "172ebc32006579cc"}, {"id": "v4-duration", "prompt": "设计师原计划周二上午开始，用3天完成指路牌设计。现在改到周四上午开始，工作内容和所需时间不变，按连续时间计算。记录应怎样调整？", "options": ["工期仍为3天，周日早上完成", "工期改为5天，周日早上完成", "工期仍为3天，周五早上完成"], "correct": 0, "feedback": ["周四至周日经过3天。开始和完成日期改变，工期仍是3天。", "推迟开始改变日期，未增加设计本身所需的3天。", "开始推迟2天，保持3天工期时，完成也要推迟2天。"], "ref": "activity", "contextLesson": "concepts", "fingerprint": "e1bf8d06c8713bfc", "legacyFingerprint": "e1bf8d06c8713bfc"}], "task": null, "refs": ["activity", "model"], "requires": ["schedule"], "introduces": ["activity", "duration", "case"], "topic": "5.1", "applications": [{"id": "application-concepts", "kind": "活动记录改写", "prompt": "准备医院服务台时，需要先确定电脑和取号设备的型号，再安装已经到场的设备。计划中目前只有一行“服务台设备：5天”。请把它改写为两项能让执行人员明确工作内容的活动，并指出还缺少哪些时间信息。", "answer": "可拆为“确认电脑和取号设备的型号”和“安装电脑和取号设备”。还需要分别估计两项工期；原来的5天不能直接当作每项工期，也无法单凭总数确定各自的开始与完成时间。"}], "sourceTopic": "5.1", "order": 1, "terms": [["Activity", "活动", "项目中一项需要执行的具体工作。例如，给一家医院的服务台安装电脑和取号设备，就是一项活动。活动名称应当顾名思义，让人知道具体要做什么。"], ["Duration", "工期（历时）", "完成一项活动所需的时间。例如，设计师完成指路牌图样需要3天，这项活动的工期就是3天。"]], "material": {"context": "为了理解Project Scheduling怎样安排工作，我们先引入一个示例背景。想象你负责一家医院接待区开放前的准备：装修已经完成，接下来需要安装电脑和取号设备，还要设置指路牌。设计师和两组工人将完成以下工作。", "terms": [["Activity", "活动", "项目中一项需要执行的具体工作。例如，给一家医院的服务台安装电脑和取号设备，就是一项活动。活动名称应当顾名思义，让人知道具体要做什么。"], ["Duration", "工期（历时）", "完成一项活动所需的时间。例如，设计师完成指路牌图样需要3天，这项活动的工期就是3天。"]], "tables": []}}, {"id": "dependencies", "title": "Predecessor / Successor · 前置与后续活动", "goal": "能说出“谁必须先做完，谁才能开始”，并区分直接前置和更早的工作。", "source": "Lecture 4 · 第13–17页；完成-开始（FS）关系见Lecture 5第39页", "body": "<section class=\"concept\" data-term=\"predecessor\"><h2><span lang=\"en\">Predecessor / Successor<\/span><span>前置活动 / 后续活动<\/span><\/h2><p>两项工作有先后要求时，我们把前面的工作称为前置活动，后面的工作称为后续活动。例如，设计师完成指路牌图样后，工人才能制作并安装指路牌。设计工作是制作安装工作的前置，制作安装工作是设计工作的后续。<\/p><\/section><div class=\"worked-example\"><p>沿用医院接待区的例子，B是“设计指路牌”，D是“制作并安装指路牌”。工人需要知道指路牌的文字、箭头和位置，因此需要设计师先提供图样。<\/p><div class=\"small-demo\">B 设计指路牌 <span>→<\/span> D 制作并安装指路牌<\/div><p>箭头表示先后要求：设计完成后，工人才能开始制作。<\/p><\/div><section class=\"concept\" data-term=\"immediate\"><h2><span lang=\"en\">Immediate Predecessor<\/span><span>紧前活动（直接前置活动）<\/span><\/h2><p>紧前活动是直接影响下一项工作能否开始的前置活动。相应地，直接依赖当前活动的后续工作称为Immediate Successor（紧后活动）。<\/p><\/section><p>假设一个流程包含A、B、D三项活动，顺序为A→B→D：负责人先确认设备和指路牌的要求，设计师再设计指路牌，工人最后制作并安装指路牌。<\/p><p>对D（制作并安装指路牌）而言，B（设计指路牌）是紧前活动，因为工人需要设计师在B中完成的图样。A（确认设备和指路牌的要求）也是更早的前置，它通过B间接影响D。<\/p><section class=\"concept\" data-term=\"fs\"><h2><span lang=\"en\">Finish-to-Start (FS)<\/span><span>前一项工作完成后，后一项才能开始<\/span><\/h2><p>这种先后要求称为Finish-to-Start，课程中写作“完成-开始”。例如，设计师完成指路牌图样后，工人才能开始制作。本例中，前一项完成后无需再等待额外的天数，这称为零滞后。<\/p><\/section><section class=\"concept\" data-term=\"parallel\"><h2><span lang=\"en\">Serial / Concurrent Activities<\/span><span>串行活动 / 并行活动<\/span><\/h2><p>串行活动需要按先后顺序进行，如设计指路牌以后再制作并安装。并行活动可以分别进行，如负责人确认要求后，一组人安装电脑和取号设备，设计师同时设计指路牌。两项工作各有人员负责，彼此无需等待。<\/p><\/section><p>并行工作可以在不同时间完成。设计师需要3天，设备安装人员需要6天，这不影响两项工作可以并行的判断。<\/p>", "questions": [{"id": "v4-immediate", "prompt": "医院增加了一项“复核现场安装位置（F）”。负责人确认要求（A）后，设计师设计指路牌（B）；工人制作并安装指路牌（D）需要设计图样，也需要F的复核结果。D的紧前活动应记录哪些？", "options": ["B和F", "A、B和F", "A和F"], "correct": 0, "feedback": ["D直接需要B的图样和F的复核结果，A通过B间接影响D。", "A已经通过B提供前置条件，无需把所有更早的活动都列为紧前。", "只列A会漏掉设计师完成B这个直接条件。"], "ref": "relations", "contextLesson": "dependencies", "fingerprint": "99a0a6d5c0af1a8a", "legacyFingerprint": "99a0a6d5c0af1a8a"}, {"id": "v4-parallel", "prompt": "设计师在第2天开始、第5天完成指路牌设计；另一组人在第3天开始、第9天完成设备安装。两项工作互不依赖。怎样描述这个安排？", "options": ["允许并行，实际安排有一段时间重叠", "尚未形成并行，因为完成时间不同", "属于串行，因为开始时间不同"], "correct": 0, "feedback": ["并行不要求同时开始或同时完成，两项工作可以各自推进。", "完成时间不同不会使已经重叠进行的工作变成串行。", "开始日期不同也可能重叠进行。这里第3至5天两项工作同时进行。"], "ref": "relations", "contextLesson": "dependencies", "fingerprint": "ec76040a29cc513b", "legacyFingerprint": "ec76040a29cc513b"}], "task": null, "refs": ["relations"], "requires": ["activity", "duration", "case"], "introduces": ["predecessor", "immediate", "fs", "parallel"], "topic": "5.1", "applications": [{"id": "application-dependencies", "kind": "条件判断", "prompt": "医院的指路牌设计与电脑安装分别由两组人负责，都在要求确认后进行。设备安装负责人说：“设计师今天也在忙，所以我们应等他完成后再开工。”仅根据这些条件，这个等待要求是否成立？还需要什么信息才能增加这条依赖？", "answer": "当前条件没有说明设备安装要使用设计成果，所以不能据此新增等待关系。若要增加依赖，需要说明安装具体依赖哪项设计结果，例如线路位置必须根据同一张最终布置图确定。仅仅同时忙碌不足以证明依赖。"}], "sourceTopic": "5.1", "order": 2, "terms": [["Predecessor / Successor", "前置活动 / 后续活动", "两项工作有先后要求时，我们把前面的工作称为前置活动，后面的工作称为后续活动。例如，设计师完成指路牌图样后，工人才能制作并安装指路牌。设计工作是制作安装工作的前置，制作安装工作是设计工作的后续。"], ["Immediate Predecessor", "紧前活动（直接前置活动）", "紧前活动是直接影响下一项工作能否开始的前置活动。相应地，直接依赖当前活动的后续工作称为Immediate Successor（紧后活动）。"], ["Finish-to-Start (FS)", "前一项工作完成后，后一项才能开始", "这种先后要求称为Finish-to-Start，课程中写作“完成-开始”。例如，设计师完成指路牌图样后，工人才能开始制作。本例中，前一项完成后无需再等待额外的天数，这称为零滞后。"], ["Serial / Concurrent Activities", "串行活动 / 并行活动", "串行活动需要按先后顺序进行，如设计指路牌以后再制作并安装。并行活动可以分别进行，如负责人确认要求后，一组人安装电脑和取号设备，设计师同时设计指路牌。两项工作各有人员负责，彼此无需等待。"]], "material": {"context": "假设一个流程包含A、B、D三项活动，顺序为A→B→D：负责人先确认设备和指路牌的要求，设计师再设计指路牌，工人最后制作并安装指路牌。", "terms": [["Predecessor / Successor", "前置活动 / 后续活动", "两项工作有先后要求时，我们把前面的工作称为前置活动，后面的工作称为后续活动。例如，设计师完成指路牌图样后，工人才能制作并安装指路牌。设计工作是制作安装工作的前置，制作安装工作是设计工作的后续。"], ["Immediate Predecessor", "紧前活动（直接前置活动）", "紧前活动是直接影响下一项工作能否开始的前置活动。相应地，直接依赖当前活动的后续工作称为Immediate Successor（紧后活动）。"], ["Finish-to-Start (FS)", "前一项工作完成后，后一项才能开始", "这种先后要求称为Finish-to-Start，课程中写作“完成-开始”。例如，设计师完成指路牌图样后，工人才能开始制作。本例中，前一项完成后无需再等待额外的天数，这称为零滞后。"], ["Serial / Concurrent Activities", "串行活动 / 并行活动", "串行活动需要按先后顺序进行，如设计指路牌以后再制作并安装。并行活动可以分别进行，如负责人确认要求后，一组人安装电脑和取号设备，设计师同时设计指路牌。两项工作各有人员负责，彼此无需等待。"]], "tables": []}}, {"id": "read", "title": "Activity Information · 活动信息表", "goal": "知道这张表记录什么，能把一行读成一条完整的工作安排条件。", "source": "Lecture 4 · 第12–13、24–27、34–36页", "body": "<section class=\"concept\" data-term=\"table\"><h2><span lang=\"en\">Activity Information<\/span><span>活动信息表<\/span><\/h2><p>我们可以用一张表记录每项活动的名称、工期和前置关系。每行对应一项活动；阅读同一行，就能知道要做什么、需要多久，以及开始前要等哪些工作完成。<\/p><\/section><p>侧重记录活动工期的表格也称为Activity Duration Table（活动工期表）。这里先为每项工作填写一个工期；后面的PERT部分会介绍乐观、最可能、悲观三种时间估计。<\/p>\n<h2>活动信息表的四列<\/h2><dl class=\"column-definitions\"><dt>Activity ID · 活动编号<\/dt><dd>每项活动的代号，如A、B。编号用于图表和计算。<\/dd><dt>Description · 活动说明<\/dt><dd>这项工作具体做什么。名称应说明具体要做什么。<\/dd><dt>Duration · 工期<\/dt><dd>完成工作所需的时间，单位在表头注明。<\/dd><dt>Immediate Predecessor · 紧前活动<\/dt><dd>开始这项工作前必须先完成的直接前置。多个编号表示这些工作都要完成；“无”表示没有紧前活动。<\/dd><\/dl><div data-slot=\"case-table\"><\/div>\n<h2>例：D（制作并安装指路牌）的工作条件<\/h2><div class=\"worked-example\"><p>这行记录的是：工人制作并安装指路牌，需要2天，开始前要等B（设计指路牌）完成。<\/p><p>负责人把D排在表格的第几行，都不会改变上述条件。判断顺序时，要读紧前活动这一列。<\/p><\/div>\n<h2>例：E（检查设备和指路牌是否符合要求）的工作条件<\/h2><p>负责人和工人检查两类成果，需要1天。开始前，C（安装电脑和取号设备）与D（制作并安装指路牌）都要完成，所以紧前活动写作C、D。<\/p><div data-slot=\"row-reader\"><\/div>", "questions": [{"id": "v4-revise-table", "prompt": "现将设备安装后的通电测试单列为F。新顺序是：C（安装电脑和取号设备）→F（测试设备是否正常通电）；E（检查设备和指路牌是否符合要求）要等F和D（制作并安装指路牌）都完成。E这一行的紧前活动应如何修改？", "options": ["改为D、F", "改为C、D、F", "保留C、D"], "correct": 0, "feedback": ["F取代C成为E的直接前置；C通过F间接影响E。", "这能保留等待条件，但把C这个间接前置也列成了紧前，记录不准确。", "保留C、D会允许检查人员在通电测试F结束前开始E。"], "ref": "read", "contextLesson": "read", "fingerprint": "1cd11e8d9e5d8821", "legacyFingerprint": "1cd11e8d9e5d8821"}, {"id": "v4-row-order", "prompt": "原表中，B（设计指路牌）和C（安装电脑和取号设备）的紧前活动都是A（确认设备和指路牌的要求）。有人因为C排在B下一行，就新增B→C。这个改动会增加什么限制？", "options": ["最终检查可以不再等待指路牌安装", "设备安装必须等指路牌设计完成", "指路牌设计必须等设备安装完成"], "correct": 1, "feedback": ["新增B→C没有删除最终检查的其他前置条件。", "新增B→C会把原本可并行的两项工作改成串行，设备安装多了一个等待条件。", "箭头是B指向C，表示C依赖B，方向不能反过来解释。"], "ref": "read", "contextLesson": "read", "fingerprint": "727f216fd563b92b", "legacyFingerprint": "727f216fd563b92b"}], "task": null, "refs": ["read", "relations"], "requires": ["activity", "duration", "case", "immediate", "fs"], "introduces": ["table"], "topic": "5.1", "applications": [{"id": "application-read", "kind": "从描述整理活动表", "prompt": "一组人员确认指路牌文字，需要1天；设计师拿到文字后画图，需要2天；工人拿到图样后制作并安装，需要3天。请用A、B、C编号，分别写出工作名称、工期和紧前活动。", "answer": "A｜确认指路牌文字｜1天｜无；B｜设计指路牌｜2天｜A；C｜制作并安装指路牌｜3天｜B。C的紧前活动写B，A已经通过B间接影响C。"}], "sourceTopic": "5.1", "order": 3, "terms": [["Activity Information", "活动信息表", "我们可以用一张表记录每项活动的名称、工期和前置关系。每行对应一项活动；阅读同一行，就能知道要做什么、需要多久，以及开始前要等哪些工作完成。"]], "material": {"context": "侧重记录活动工期的表格也称为Activity Duration Table（活动工期表）。这里先为每项工作填写一个工期；后面的PERT部分会介绍乐观、最可能、悲观三种时间估计。", "terms": [["Activity Information", "活动信息表", "我们可以用一张表记录每项活动的名称、工期和前置关系。每行对应一项活动；阅读同一行，就能知道要做什么、需要多久，以及开始前要等哪些工作完成。"]], "tables": []}}, {"id": "network", "title": "Activity-on-Node · 活动节点网络图", "goal": "把活动表中的每个等待条件变成箭头，并能解释每条箭头的理由。", "source": "Lecture 4 · 第13–27、37–39页", "body": "<section class=\"concept\" data-term=\"aon\"><h2><span lang=\"en\">Project Network Diagram (PND)<\/span><span>项目网络图<\/span><\/h2><p>我们用网络图表示活动之间的先后关系。Activity-on-Node（AON，活动节点法）是一种画法：方框代表活动，箭头从前置活动指向后续活动。图中的方框称为Node（节点）。<\/p><\/section><h2>根据一条前置关系画箭头<\/h2><p>活动表中，B（设计指路牌）的紧前活动是A（确认设备和指路牌的要求）。设计师要先拿到已确认的要求，才开始设计，因此画A→B。<\/p><div class=\"small-demo\">A 确认设备和指路牌的要求 <span>→<\/span> B 设计指路牌<\/div><p>箭头的方向表示先后关系。工期另记在活动信息里，箭头长短不表示工期。<\/p>\n<h2>一项工作有两个紧前活动时<\/h2><p>E（检查设备和指路牌是否符合要求）需要等C（安装电脑和取号设备）与D（制作并安装指路牌）都完成。画图时，从C和D各画一条箭头指向E。<\/p><div class=\"merge-demo\"><span>C 安装电脑和取号设备 →<\/span><b>E 检查设备和指路牌是否符合要求<\/b><span>D 制作并安装指路牌 →<\/span><\/div><section class=\"concept\" data-term=\"network-shapes\"><h2><span lang=\"en\">Burst Activity / Merge Activity / Path<\/span><span>发散活动 / 汇聚活动 / 路径<\/span><\/h2><p>一项活动有两个或更多直接后续，称为发散活动；有两个或更多紧前，称为汇聚活动。沿箭头依次经过的活动序列，称为路径。<\/p><\/section><p>本例中，负责人完成A以后，设计师可以做B，设备安装人员可以做C，因此A是发散活动。完成C与D以后才能开始E，因此E是汇聚活动。A→B→D→E是一条完整路径，经过确认要求、设计、制作安装和检查。<\/p><p>另一种画法Activity-on-Arrow（AOA，活动箭线法）用箭头表示活动、节点表示事件；这里使用AON。<\/p><div data-slot=\"case-table\"><\/div>", "questions": [{"id": "v4-redundant", "prompt": "一段流程已经画成A（确认要求）→B（设计指路牌）→D（制作并安装指路牌），均为完成后才能开始的关系。再加一条A→D，会怎样改变先后条件？", "options": ["会形成循环，D无法开始", "D需要新增一次等待，项目必然延长", "未增加新的先后条件，A→D可以省略"], "correct": 2, "feedback": ["三条箭头都从更早的工作指向更后的工作，没有返回前面的活动。", "完成B本来就要求A已完成，因此这条线没有增加新的等待条件。", "A先于D已经由A→B→D表达。画图时通常保留直接前置关系即可。"], "ref": "aon", "contextLesson": "network", "fingerprint": "088b31831caf7a32", "legacyFingerprint": "088b31831caf7a32"}, {"id": "v4-wrong-edge", "prompt": "按活动表，安装电脑和取号设备（C）与制作并安装指路牌（D）可以并行，最终检查（E）要等两项都完成。有人画了C→D→E。怎样修正这部分图？", "options": ["删除D→E，保留C→D并补C→E", "删除C→D，保留D→E并补C→E", "保留C→D→E，再补C→E"], "correct": 1, "feedback": ["这样既强加C→D，又让E不再等待D完成。", "C与D之间没有依赖，应分别指向E，表达两项都要完成。", "补C→E仍保留了多余的C→D，制作指路牌依然被迫等待设备安装。"], "ref": "aon", "contextLesson": "network", "fingerprint": "12956c719a516493", "legacyFingerprint": "12956c719a516493"}], "task": "network", "refs": ["aon", "read"], "requires": ["table", "immediate", "parallel"], "introduces": ["aon", "network-shapes"], "topic": "5.1", "applications": [{"id": "application-network", "kind": "关系图改错", "prompt": "新流程中，确认要求（A）后，可以分别设计指路牌（B）与安装设备（C）；制作并安装指路牌（D）要等B；最终检查（E）要等C和D。有人画成A→B→C→D→E。请写出应删除和补画的连线。", "answer": "删除B→C和C→D；补画A→C、B→D和C→E。保留A→B与D→E。这样既保留最终检查需要两项安装完成的条件，也允许设计与设备安装并行。"}], "sourceTopic": "5.1", "order": 4, "terms": [["Project Network Diagram (PND)", "项目网络图", "我们用网络图表示活动之间的先后关系。Activity-on-Node（AON，活动节点法）是一种画法：方框代表活动，箭头从前置活动指向后续活动。图中的方框称为Node（节点）。"], ["Burst Activity / Merge Activity / Path", "发散活动 / 汇聚活动 / 路径", "一项活动有两个或更多直接后续，称为发散活动；有两个或更多紧前，称为汇聚活动。沿箭头依次经过的活动序列，称为路径。"]], "material": {"context": "活动表中，B（设计指路牌）的紧前活动是A（确认设备和指路牌的要求）。设计师要先拿到已确认的要求，才开始设计，因此画A→B。", "terms": [["Project Network Diagram (PND)", "项目网络图", "我们用网络图表示活动之间的先后关系。Activity-on-Node（AON，活动节点法）是一种画法：方框代表活动，箭头从前置活动指向后续活动。图中的方框称为Node（节点）。"], ["Burst Activity / Merge Activity / Path", "发散活动 / 汇聚活动 / 路径", "一项活动有两个或更多直接后续，称为发散活动；有两个或更多紧前，称为汇聚活动。沿箭头依次经过的活动序列，称为路径。"]], "tables": []}}, {"id": "forward", "title": "Forward Pass · 正推", "goal": "会把每项活动的开始条件换算成最早开始与完成时点。", "source": "Lecture 4 · 第21、42–45、54页", "body": "<section class=\"concept\" data-term=\"early\"><h2><span lang=\"en\">Early Start (ES) / Early Finish (EF)<\/span><span>最早开始时间 / 最早完成时间<\/span><\/h2><p>完成所有前置工作后，人员最早可以开始下一项工作的时间，记为ES。加上这项工作的工期，就得到最早完成时间EF。从前向后逐项计算的过程，称为Forward Pass（正推）。<\/p><\/section><h2>工期与开始、完成时间<\/h2><p>假设设计师周二上午开始工作，用3天完成，到周五上午交出图样。3天是工期，周二上午和周五上午分别是开始时间与完成时间。<\/p><p>计算项目进度时，我们把项目开始的那一刻记为0，以后用经过的天数表示时间。从0开始做2天，就在2完成；在2开始一项工期3天的工作，就在5完成。<\/p><div class=\"time-example\"><span>开始：0<\/span><span>工作2天<\/span><span>完成：2<\/span><span>下一项工作3天<\/span><span>完成：5<\/span><\/div>\n<h2>正推的计算方法<\/h2><p>每项活动的完成时间等于开始时间加上工期。工期用字母d表示。<\/p><div class=\"formula\">EF = ES + d<\/div><p>有多项紧前工作时，工作人员要等最后一项完成才能开始。max表示取最大值，因此：<\/p><div class=\"formula\">ES = max(所有紧前活动的 EF)<\/div><p>没有紧前活动的工作可以从0开始。所有末端工作都完成后，项目才算完成，所以总工期T等于各末端活动EF的最大值。<\/p>\n<h2>医院接待区的正推计算<\/h2><p>下面按活动顺序展示计算过程。活动名称、工期与前置关系可以随时在旁边查看。<\/p><div data-slot=\"walk-forward\"><\/div>\n<h2>在活动框中填写结果<\/h2><p>九宫格的上排填写ES、活动编号ID、EF。DUR表示工期；其余时间栏会在逆推和时差计算时使用。<\/p><div class=\"mini-grid\"><span>ES 最早开始<\/span><span>ID 活动编号<\/span><span>EF 最早完成<\/span><span>总时差<\/span><span class=\"wide\">活动名称<\/span><span>最迟开始<\/span><span>DUR 工期<\/span><span>最迟完成<\/span><\/div>", "questions": [{"id": "v4-forward-merge", "prompt": "一次设备检查需要2天。它的两项紧前工作最早分别在时点5和9完成。检查的ES与EF应是多少？", "options": ["ES=9，EF=10", "ES=5，EF=7", "ES=9，EF=11"], "correct": 2, "feedback": ["从9开始做2天，会在11完成；这里用经过的时间计数，不把起点算作已工作1天。", "时点5还有一项紧前工作未完成，要等到9。", "ES=max(5,9)=9；EF=9+2=11。"], "ref": "forward", "contextLesson": "forward", "fingerprint": "621b3c74bff0f370", "legacyFingerprint": "621b3c74bff0f370"}, {"id": "v4-terminal-time", "prompt": "一个项目有三项末端工作，最早完成时间分别为7、10、8天；它们之后没有其他工作。项目最早何时完成？", "options": ["第8天", "第25天", "第10天"], "correct": 2, "feedback": ["第8天仍有一项工作未完成，项目需等到第10天。", "完成时间不是三段接续的工期，相加会重复计算并行经过的时间。", "最后结束的一项在第10天完成，因此项目T=max(7,10,8)=10。"], "ref": "forward", "contextLesson": "forward", "fingerprint": "56f6b76eff585ec5", "legacyFingerprint": "56f6b76eff585ec5"}], "task": "forward", "refs": ["forward", "grid"], "requires": ["aon", "duration", "fs"], "introduces": ["early", "max", "time-origin"], "topic": "5.1", "applications": [{"id": "application-forward", "kind": "查找计算错误", "prompt": "两项安装工作分别在时点7和8完成；后续检查需要2天。有人写“检查ES=min(7,8)=7，EF=7+2=9”。请找出最先出错的步骤，并给出修正结果。", "answer": "最先出错的是取了较早的完成时间。检查要等两项安装都完成，应取ES=max(7,8)=8；随后EF=8+2=10。先修正开始条件，再修正由它计算的完成时间。"}], "sourceTopic": "5.1", "order": 5, "terms": [["Early Start (ES) / Early Finish (EF)", "最早开始时间 / 最早完成时间", "完成所有前置工作后，人员最早可以开始下一项工作的时间，记为ES。加上这项工作的工期，就得到最早完成时间EF。从前向后逐项计算的过程，称为Forward Pass（正推）。"]], "material": {"context": "假设设计师周二上午开始工作，用3天完成，到周五上午交出图样。3天是工期，周二上午和周五上午分别是开始时间与完成时间。", "terms": [["Early Start (ES) / Early Finish (EF)", "最早开始时间 / 最早完成时间", "完成所有前置工作后，人员最早可以开始下一项工作的时间，记为ES。加上这项工作的工期，就得到最早完成时间EF。从前向后逐项计算的过程，称为Forward Pass（正推）。"]], "tables": []}}, {"id": "backward", "title": "Backward Pass · 逆推", "goal": "给定9天完工目标，能倒推每项工作最迟何时必须开始。", "source": "Lecture 4 · 第21、46–48、54页", "body": "<section class=\"concept\" data-term=\"late\"><h2><span lang=\"en\">Late Start (LS) / Late Finish (LF)<\/span><span>最迟开始时间 / 最迟完成时间<\/span><\/h2><p>为了按计划完成项目，一项工作最晚可以开始的时间称为LS，最晚可以完成的时间称为LF。从项目结束时间倒着计算这两个时间，称为Backward Pass（逆推）。<\/p><\/section><p>医院接待区的正推结果是9天。现在按9天完成来安排工作，计算每项工作最晚应从什么时候开始。<\/p>\n<h2>从最后一项工作开始计算<\/h2><p>E（检查设备和指路牌是否符合要求）需要1天，最晚在9完成，因此最晚从8开始：LF=9，LS=9−1=8。<\/p><p>D（制作并安装指路牌）必须在检查前完成，所以LF=8。工人完成D需要2天，因此LS=8−2=6。<\/p><div class=\"formula\">LS = LF − d<\/div>\n<h2>有多个后续活动时<\/h2><p>A（确认设备和指路牌的要求）完成后，设计师开始B，设备安装人员开始C。如果B最晚从3开始、C最晚从2开始，负责人就必须在2之前完成A，才能让两组人都按时开工。<\/p><p>min表示取最小值。某项活动有多个直接后续时，最迟完成时间取这些后续活动LS的最小值。<\/p><div class=\"formula\">LF = min(所有直接后续活动的 LS)<\/div><p>末端活动统一以项目完工时间T作为LF。<\/p><h2>医院接待区的逆推计算<\/h2><div data-slot=\"walk-backward\"><\/div>", "questions": [{"id": "v4-backward-branch", "prompt": "“确认设备规格”需要3天。它的两项紧后工作最迟分别在时点7、9开始。确认规格的LF与LS应是多少？", "options": ["LF=9，LS=6", "LF=7，LS=7", "LF=7，LS=4"], "correct": 2, "feedback": ["在9完成会耽误必须在7开始的后续工作。", "7是最迟完成时间，还要减去3天工期才得到最迟开始。", "LF=min(7,9)=7；LS=7−3=4。"], "ref": "backward", "contextLesson": "backward", "fingerprint": "a323d70ae3b2c12b", "legacyFingerprint": "a323d70ae3b2c12b"}, {"id": "v4-terminal-backward", "prompt": "正推得到项目总工期12天。其中一项末端工作需要2天，最早在6开始、8完成。统一按12天完工逆推，这项工作的LS与LF是什么？", "options": ["LS=10，LF=12", "LS=6，LF=8", "LS=12，LF=14"], "correct": 0, "feedback": ["LF=12，LS=12−2=10。末端工作可以晚于自己的最早完成时间结束。", "这是最早时间。逆推时，末端工作都以共同项目完成时间12为LF。", "12是最迟完成时间，不能把它作为这项工作的开始时间。"], "ref": "backward", "contextLesson": "backward", "fingerprint": "12064e9d549df505", "legacyFingerprint": "12064e9d549df505"}], "task": "backward", "refs": ["backward", "grid"], "requires": ["early", "max", "time-origin"], "introduces": ["late", "min"], "topic": "5.1", "applications": [{"id": "application-backward", "kind": "比较两份逆推结果", "prompt": "一项确认工作需要2天，后续设计最迟在5开始，后续安装最迟在4开始。甲写LF=5、LS=3；乙写LF=4、LS=2。哪份结果可让两项后续都按时开始？用具体时间说明另一份的问题。", "answer": "乙正确。确认工作在4完成，两项后续都能按时开始。甲安排到5才完成，会让必须在4开始的安装至少晚1天。逆推取最严格的后续开始限制。"}], "sourceTopic": "5.1", "order": 6, "terms": [["Late Start (LS) / Late Finish (LF)", "最迟开始时间 / 最迟完成时间", "为了按计划完成项目，一项工作最晚可以开始的时间称为LS，最晚可以完成的时间称为LF。从项目结束时间倒着计算这两个时间，称为Backward Pass（逆推）。"]], "material": {"context": "医院接待区的正推结果是9天。现在按9天完成来安排工作，计算每项工作最晚应从什么时候开始。", "terms": [["Late Start (LS) / Late Finish (LF)", "最迟开始时间 / 最迟完成时间", "为了按计划完成项目，一项工作最晚可以开始的时间称为LS，最晚可以完成的时间称为LF。从项目结束时间倒着计算这两个时间，称为Backward Pass（逆推）。"]], "tables": []}}, {"id": "float", "title": "Slack / Float · 总时差与自由时差", "goal": "分别回答“会不会推迟项目”和“会不会推迟后续最早开始”。", "source": "Lecture 4 · 第22、49–52页", "body": "<section class=\"concept\" data-term=\"slack\"><h2><span lang=\"en\">Slack / Float<\/span><span>时差（浮时）<\/span><\/h2><p>安排项目时，有些工作可以适当延后。允许延后的时间有多少，取决于我们是否允许影响后续工作，以及是否允许影响项目完工。<\/p><\/section><section class=\"concept\" data-term=\"total\"><h2><span lang=\"en\">Total Slack (TS) / Total Float (TF)<\/span><span>总时差<\/span><\/h2><p>在不推迟项目完工的情况下，一项活动允许延迟的时间。用最迟开始减去最早开始计算：TF=LS−ES；也可以用最迟完成减去最早完成：TF=LF−EF。九宫格中的SL记录这个总时差。<\/p><\/section><section class=\"concept\" data-term=\"free\"><h2><span lang=\"en\">Free Slack (FS) / Free Float (FF)<\/span><span>自由时差<\/span><\/h2><p>在不推迟任何直接后续活动最早开始的情况下，一项活动允许延迟的时间。这里使用FF；课程也使用Free Slack的缩写FS。它与Finish-to-Start的FS含义不同。<\/p><\/section><h2>例：B（设计指路牌）可以晚多少？<\/h2><p>设计师最早在2开始、5完成；为了让项目在9完成，他最迟可以在3开始、6完成。因此总时差TF=3−2=1天。<\/p><p>D（制作并安装指路牌）的工人原本最早在5开始，正好接着设计完成的时间。设计师只要推迟交图，工人就得晚开工，因此B的自由时差FF=5−5=0天。<\/p><div class=\"formula\">TF = LS − ES = LF − EF<br>FF = min(直接后续活动的 ES) − 本活动 EF<\/div><p>末端活动没有下一项工作时，用项目完成时间T代替后续ES，FF=T−EF。<\/p>\n<h2>比较设计师晚开工后的安排<\/h2><div data-slot=\"delay\"><\/div><p>即使设计师只晚1天，没有超过总时差TF，制作安装的工人也会晚1天开工，因为这1天已经超过自由时差FF。此时设备安装人员仍然需要工作到8，最终检查仍从8开始，项目完成时间保持为9。<\/p><p>如果设计师晚2天，工人要到9才能装好指路牌。最终检查随之改到9开始，项目完成时间变为10。<\/p>\n<h2>例：D（制作并安装指路牌）的自由时差<\/h2><p>工人最早在7完成D，检查人员最早在8开始E，中间相隔1天，所以D的FF=1。工人晚1天完成，检查仍可按原来的时间开始。<\/p><p>B与D的总时差都为1天。这两项工作处在同一条路径上，共用这1天余量；如果设计师已经用掉1天，制作安装的工人就不能再额外延迟1天。<\/p>", "questions": [{"id": "v4-float-interior", "prompt": "某项设备安装的TF=3天、FF=1天。它比最早计划晚2天开始，工期不变，其他工作都在条件满足后尽早进行。哪种影响符合这两个时差？", "options": ["至少一项紧后工作晚1天开始，项目不延期", "至少一项紧后工作晚2天开始，项目不延期", "紧后工作均不变，项目晚1天完成"], "correct": 0, "feedback": ["先用掉FF允许的1天，超出的1天会推迟至少一项紧后工作；2天仍未超过TF=3天。", "前1天延迟在自由时差内，不会推迟后续；超过FF的部分才产生影响。", "超过FF后，紧后工作会受影响；是否推迟项目应与TF比较。"], "ref": "float", "contextLesson": "float", "fingerprint": "a1092a696cee9e75", "legacyFingerprint": "a1092a696cee9e75"}, {"id": "v4-float-shared", "prompt": "B（设计指路牌）与D（制作并安装指路牌）在同一路径上，共享1天余量。设计师晚1天交图，工人收到图样后立即开工，且制作安装的工期仍为2天。项目会怎样？", "options": ["保持原完工时间，工人的晚开工是同一次延迟的传递", "延期1天，因为设计已经用完余量", "延期2天，因为两项活动都晚1天"], "correct": 0, "feedback": ["工人立即接续工作，没有新增等待。只消耗1天共享余量，项目仍在第9天完成。", "用完余量正好到允许的边界，尚未额外超过它。", "同一次延迟沿路径传递，不能把每个活动的日期推迟重复相加。"], "ref": "float", "contextLesson": "float", "fingerprint": "bc8f94fbf6646836", "legacyFingerprint": "bc8f94fbf6646836"}], "task": "float", "refs": ["float", "grid"], "requires": ["early", "late", "min"], "introduces": ["slack", "total", "free"], "topic": "5.1", "applications": [{"id": "application-float", "kind": "比较三种延迟", "prompt": "某项安装的TF=3天、FF=1天，其余工作在条件满足后尽早进行。分别考虑它晚0.5天、2天、4天开始，工期不变。每种情况下，受影响最大的一项紧后活动会晚多少天开始？项目会晚多少天完成？", "answer": "晚0.5天：仍在FF内，紧后活动不推迟，项目不延期。晚2天：超出FF的1天会推迟至少一项紧后活动，项目不延期。晚4天：紧后活动最大推迟3天，项目推迟1天。两类影响分别比较FF和TF。"}], "sourceTopic": "5.1", "order": 7, "terms": [["Slack / Float", "时差（浮时）", "安排项目时，有些工作可以适当延后。允许延后的时间有多少，取决于我们是否允许影响后续工作，以及是否允许影响项目完工。"], ["Total Slack (TS) / Total Float (TF)", "总时差", "在不推迟项目完工的情况下，一项活动允许延迟的时间。用最迟开始减去最早开始计算：TF=LS−ES；也可以用最迟完成减去最早完成：TF=LF−EF。九宫格中的SL记录这个总时差。"], ["Free Slack (FS) / Free Float (FF)", "自由时差", "在不推迟任何直接后续活动最早开始的情况下，一项活动允许延迟的时间。这里使用FF；课程也使用Free Slack的缩写FS。它与Finish-to-Start的FS含义不同。"]], "material": {"context": "设计师最早在2开始、5完成；为了让项目在9完成，他最迟可以在3开始、6完成。因此总时差TF=3−2=1天。", "terms": [["Slack / Float", "时差（浮时）", "安排项目时，有些工作可以适当延后。允许延后的时间有多少，取决于我们是否允许影响后续工作，以及是否允许影响项目完工。"], ["Total Slack (TS) / Total Float (TF)", "总时差", "在不推迟项目完工的情况下，一项活动允许延迟的时间。用最迟开始减去最早开始计算：TF=LS−ES；也可以用最迟完成减去最早完成：TF=LF−EF。九宫格中的SL记录这个总时差。"], ["Free Slack (FS) / Free Float (FF)", "自由时差", "在不推迟任何直接后续活动最早开始的情况下，一项活动允许延迟的时间。这里使用FF；课程也使用Free Slack的缩写FS。它与Finish-to-Start的FS含义不同。"]], "tables": []}}, {"id": "critical", "title": "Critical Path · 关键路径", "goal": "比较完整路径总工期，解释哪条路径决定完工，以及为什么可能有多条。", "source": "Lecture 4 · 第22、40–41、53–54页", "body": "<section class=\"concept\" data-term=\"critical\"><h2><span lang=\"en\">Critical Path (CP) / Critical Path Method (CPM)<\/span><span>关键路径 / 关键路径法<\/span><\/h2><p>在所有从起点到终点的完整路径中，总工期最长的路径称为关键路径。项目要等这条路径上的工作完成，才能结束。关键路径法通过活动关系及正推、逆推计算，找出这些关键工作。<\/p><\/section><h2>比较医院接待区的两条路径<\/h2><div class=\"comparison\"><div><b>A → B → D → E<\/b><p>确认设备和指路牌的要求 → 设计指路牌 → 制作并安装指路牌 → 检查设备和指路牌是否符合要求<\/p><p>2＋3＋2＋1＝8天<\/p><\/div><div><b>A → C → E<\/b><p>确认设备和指路牌的要求 → 安装电脑和取号设备 → 检查设备和指路牌是否符合要求<\/p><p>2＋6＋1＝9天<\/p><\/div><\/div><p>A-C-E需要9天，是本例的关键路径。比较的是路径总工期，不是活动数量。<\/p>\n<h2>关键活动与总时差<\/h2><p>在这张网络中，A、C、E的总时差TF为0。任何一项单独延迟，项目都会延迟。B（设计指路牌）的TF为1，所以它不是关键活动；即使它的FF为0，也不能据此判定它关键。<\/p>\n<h2>多条关键路径<\/h2><p>如果把C（安装电脑和取号设备）的工期从6天改成5天，两条路径都需要8天，就会有两条关键路径。此时只缩短其中一条，项目还需要等待另一条完成。<\/p>", "questions": [{"id": "v4-critical-float", "prompt": "“设计指路牌”的ES=2、EF=5、LS=3、LF=6、FF=0。根据这些值，怎样判断它是否关键？", "options": ["TF=1，因此不关键", "EF−ES=3，因此关键", "FF=0，因此关键"], "correct": 0, "feedback": ["TF=LS−ES=3−2=1，说明它有1天不影响项目完工的余量。", "EF−ES表示工期，不是总时差，无法据此判断关键。", "FF=0说明后续最早开始没有余量，判断关键要计算TF。"], "ref": "critical", "contextLesson": "critical", "fingerprint": "dc242b37f886c1fb", "legacyFingerprint": "dc242b37f886c1fb"}, {"id": "v4-path-switch", "prompt": "原先两条完整路径为：经设计与制作安装的A-B-D-E=8天，经设备安装的A-C-E=9天。现将C（安装电脑和取号设备）从6天缩短到4天，其余工期不变。新总工期是多少，哪条路径关键？", "options": ["9天，原关键路径决定的工期不能改变", "7天，A-C-E仍关键", "8天，A-B-D-E成为关键路径"], "correct": 2, "feedback": ["活动工期改变后，需要重新比较所有完整路径。", "A-C-E确实缩短为7天，项目还要等8天的另一条路径完成。", "A-C-E由9变为7天，A-B-D-E仍为8天，因此关键路径发生改变。"], "ref": "critical", "contextLesson": "critical", "fingerprint": "c680f1d8bffdca74", "legacyFingerprint": "c680f1d8bffdca74"}, {"id": "v4-two-paths", "prompt": "把设备安装缩短到5天后，A-B-D-E与A-C-E都为8天。若仅将B（设计指路牌）再缩短1天，项目工期会是多少？", "options": ["8天，因为A-C-E仍需要8天", "7天，因为关键活动缩短了1天", "7.5天，取两条路径的平均工期"], "correct": 0, "feedback": ["缩短A-B-D-E后，A-C-E仍限制完工时间，因此项目保持8天。", "B只位于其中一条关键路径，另一条仍需要8天。", "项目必须等所有工作结束，取最长路径，不取平均。"], "ref": "critical", "contextLesson": "critical", "fingerprint": "809b90916f683f5e", "legacyFingerprint": "809b90916f683f5e"}], "task": null, "refs": ["critical", "float"], "requires": ["network-shapes", "early", "late", "total", "free"], "introduces": ["critical"], "topic": "5.1", "applications": [{"id": "application-critical", "kind": "比较工期压缩方案", "prompt": "接待区两条路径分别为A-B-D-E=8天、A-C-E=9天。你可以把B（设计指路牌）缩短2天，或者把C（安装电脑和取号设备）缩短2天。其他工期不变，哪个方案能提前完工？能提前多少？", "answer": "缩短B后，两条路径变为6天和9天，项目仍为9天。缩短C后，两条路径变为8天和7天，项目改为8天，只提前1天。活动缩短的时间不一定全部转化为项目提前的时间。"}], "sourceTopic": "5.1", "order": 8, "terms": [["Critical Path (CP) / Critical Path Method (CPM)", "关键路径 / 关键路径法", "在所有从起点到终点的完整路径中，总工期最长的路径称为关键路径。项目要等这条路径上的工作完成，才能结束。关键路径法通过活动关系及正推、逆推计算，找出这些关键工作。"]], "material": {"context": "A-C-E需要9天，是本例的关键路径。比较的是路径总工期，不是活动数量。", "terms": [["Critical Path (CP) / Critical Path Method (CPM)", "关键路径 / 关键路径法", "在所有从起点到终点的完整路径中，总工期最长的路径称为关键路径。项目要等这条路径上的工作完成，才能结束。关键路径法通过活动关系及正推、逆推计算，找出这些关键工作。"]], "tables": []}}, {"id": "pert", "title": "PERT · 三点工期估计", "goal": "能把顺利、通常、不顺利三种时间估计转成可计算的结果。", "source": "Lecture 4 · 第28–36页", "body": "<section class=\"concept\" data-term=\"pert\"><h2><span lang=\"en\">Program Evaluation and Review Technique (PERT)<\/span><span>计划评审技术<\/span><\/h2><p>预计一项工作需要多久时，我们可以分别考虑顺利、通常和不顺利的情况。PERT利用这些时间估计计算期望工期和波动程度。<\/p><\/section><p>前面的计算把C（安装电脑和取号设备）按6天安排，称为Deterministic Estimation（确定性估计）。现在考虑设备接通和调试可能遇到不同情况，用三个数估计这项工作。<\/p>\n<h2>三种时间估计<\/h2><dl class=\"column-definitions\"><dt>Optimistic Time a · 乐观工期<\/dt><dd>安装和调试都顺利时，预计需要4天。<\/dd><dt>Most Likely Time m · 最可能工期<\/dt><dd>通常情况下，最可能需要6天。<\/dd><dt>Pessimistic Time b · 悲观工期<\/dt><dd>遇到较多问题时，预计需要10天。<\/dd><\/dl><p>这三个数使用相同单位，并满足a≤m≤b。<\/p><section class=\"concept\" data-term=\"uncertainty\"><h2><span lang=\"en\">Expected Time / Standard Deviation / Variance<\/span><span>期望工期 / 标准差 / 方差<\/span><\/h2><p>期望工期是按权重计算的平均时间，记为TE或tₑ。标准差描述工期的波动程度，记为SD或σ，单位与工期相同。方差是标准差的平方，记为σ²，工期以天计时，其单位为天²。<\/p><\/section><h2>例：估计安装电脑和取号设备所需的时间<\/h2><div class=\"worked-example\"><p>期望工期：tₑ=(4+4×6+10)/6=6.333…天。公式给最可能工期4份权重，乐观和悲观工期各1份，总权重为6。<\/p><p>标准差：σ=(10−4)/6=1天。<\/p><p>方差：σ²=1²=1天²。这个例子的标准差与方差数值相同，含义和单位不同；标准差为2天时，方差就是4天²。<\/p><\/div><div class=\"formula\">tₑ = (a + 4m + b) / 6<br>σ = (b − a) / 6<br>σ² = ((b − a) / 6)²<\/div>\n<p>PERT常用Beta Distribution（贝塔分布）描述工期：顺利时节省的时间与不顺利时增加的时间可以不对称。上面的公式用于估计平均时间及波动。<\/p><p>计算时保留中间精度，最后再按要求取小数。题目若要求先把期望工期取整后建图，就对所有活动使用同一取整规则。<\/p><h2>练习<\/h2><p>另一项安装工作的乐观工期a=2天、最可能工期m=4天、悲观工期b=8天。分别计算期望工期、标准差和方差。<\/p><div data-slot=\"pert-practice\"><\/div>", "questions": [{"id": "v4-pert-asymmetric", "prompt": "一项安装工作的a=2天、m=4天、b=12天。哪组期望工期与标准差符合PERT公式？", "options": ["期望4天，标准差约2.78天", "期望5天，标准差约1.67天", "期望6天，标准差约1.67天"], "correct": 1, "feedback": ["4天是最可能值，不是期望；约2.78是方差，不是标准差。", "期望=(2+4×4+12)/6=5；标准差=(12−2)/6≈1.67。", "6天来自三数简单平均；PERT给最可能值m四倍权重。"], "ref": "pert", "contextLesson": "pert", "fingerprint": "64bf2dd264d17287", "legacyFingerprint": "64bf2dd264d17287"}, {"id": "v4-pert-compare", "prompt": "两种安排的三点估计分别为甲(2,5,8)天、乙(4,5,6)天。比较两者的期望工期和不确定性，哪个判断正确？", "options": ["甲的期望更长，因为悲观工期更长", "两者期望都是5天，甲的波动更大", "两者期望都是5天，波动也相同"], "correct": 1, "feedback": ["甲的乐观工期也更短，按PERT加权后两者期望都为5天。", "甲标准差=(8−2)/6=1天；乙=(6−4)/6≈0.33天。平均时间相同，波动可以不同。", "期望相同不意味着波动相同，还需比较悲观与乐观工期之差。"], "ref": "pert", "contextLesson": "pert", "fingerprint": "bcf7e527fb4033f8", "legacyFingerprint": "bcf7e527fb4033f8"}], "task": "pert", "refs": ["pert", "probability"], "requires": ["duration", "critical"], "introduces": ["pert", "uncertainty"], "topic": "5.1", "applications": [{"id": "application-pert", "kind": "相同平均时间的两种估计", "prompt": "甲的三点估计为(4,7,10)天，乙为(1,7,13)天。计算两者的期望、标准差和方差，再说明为什么只报告期望工期会漏掉重要信息。", "answer": "两者期望都是7天。甲标准差1天、方差1天²；乙标准差2天、方差4天²。乙的可能工期范围更宽，波动更大。仅写“平均7天”无法说明这种差别。"}], "sourceTopic": "5.1", "order": 9, "terms": [["Program Evaluation and Review Technique (PERT)", "计划评审技术", "预计一项工作需要多久时，我们可以分别考虑顺利、通常和不顺利的情况。PERT利用这些时间估计计算期望工期和波动程度。"], ["Expected Time / Standard Deviation / Variance", "期望工期 / 标准差 / 方差", "期望工期是按权重计算的平均时间，记为TE或tₑ。标准差描述工期的波动程度，记为SD或σ，单位与工期相同。方差是标准差的平方，记为σ²，工期以天计时，其单位为天²。"]], "material": {"context": "前面的计算把C（安装电脑和取号设备）按6天安排，称为Deterministic Estimation（确定性估计）。现在考虑设备接通和调试可能遇到不同情况，用三个数估计这项工作。", "terms": [["Program Evaluation and Review Technique (PERT)", "计划评审技术", "预计一项工作需要多久时，我们可以分别考虑顺利、通常和不顺利的情况。PERT利用这些时间估计计算期望工期和波动程度。"], ["Expected Time / Standard Deviation / Variance", "期望工期 / 标准差 / 方差", "期望工期是按权重计算的平均时间，记为TE或tₑ。标准差描述工期的波动程度，记为SD或σ，单位与工期相同。方差是标准差的平方，记为σ²，工期以天计时，其单位为天²。"]], "tables": []}}, {"id": "probability", "title": "Probability of Completion · 完工概率", "goal": "能说清“在某个期限前完成有多大把握”，并说明估计依赖哪些条件。", "source": "Lecture 4 · 第55–63页", "body": "<section class=\"concept\" data-term=\"probability\"><h2><span lang=\"en\">Probability of Completion / Due Date<\/span><span>完工概率 / 目标期限<\/span><\/h2><p>项目经理提出“希望10天内完成”时，10天是目标期限，记为D。完工概率表示在这个期限前完成的可能性，取值从0到1，也可以写成百分比。<\/p><\/section><h2>例：10天内完成接待区的准备工作<\/h2><p>继续计算A-C-E：确认设备和指路牌的要求、安装电脑和取号设备、检查设备和指路牌是否符合要求。A按2天、E按1天计算；C采用上一节得到的期望6.333…天和方差1。<\/p>\n<h2>路径的期望与标准差<\/h2><div class=\"worked-example\"><p><b>期望μ<\/b>：把路径上各活动的期望工期相加，μ=2+6.333…+1=9.333…天。μ读作“缪”。<\/p><p><b>方差V<\/b>：假设各活动工期相互独立，就可以把方差相加。A与E采用固定工期，方差为0，因此V=0+1+0=1天²。<\/p><p><b>标准差σ<\/b>：对方差开平方，σ=√1=1天。σ读作“西格玛”；√表示平方根，例如√4=2。<\/p><\/div><p>独立的含义是：一项工作耗时长短，不影响另一项工作的工期分布。计算这条路径的波动时，先加方差，再求标准差。<\/p><section class=\"concept\" data-term=\"normal\"><h2><span lang=\"en\">Normal Approximation / Standard Normal Distribution<\/span><span>正态近似 / 标准正态分布<\/span><\/h2><p>正态分布呈钟形，数值在平均值附近较集中，两侧较少。这里用正态分布近似计算这条路径的完成时间。标准正态分布将平均值记为0、标准差记为1，便于使用统一的概率表。<\/p><\/section><h2>用Z值表示期限与平均时间的距离<\/h2><p><b>Z-score（Z值）<\/b>表示目标期限与期望时间相差几个标准差。正值表示期限在平均时间之后，负值表示期限在平均时间之前。<\/p><div class=\"formula\">Z = (D − μ) / σ<\/div><p>本例D=10，μ=9.333…，σ=1，得到Z≈0.667：目标期限比平均完成时间多约0.667个标准差。<\/p>\n<h2>查出这个期限对应的概率<\/h2><p><b>Cumulative Probability（累计概率）<\/b>表示在某个界限以内的全部概率。<b>Φ(Z)<\/b>表示标准正态分布在Z及其左侧的累计概率。<b>P(T≤D)<\/b>表示完成时间T不超过期限D的概率。<\/p><div class=\"formula\">P(T ≤ D) ≈ Φ(Z)<\/div><p>Z≈0.667时，概率约为74.75%。若使用两位小数的表，可以按Z=0.67查行0.6、列0.07，得到0.7486，即74.86%；两个结果的差异来自舍入。Φ(0)=0.5，表示期限等于期望时间时，正态近似给出50%的概率。<\/p><div data-slot=\"probability-experiment\"><\/div>\n<h2>按95%的目标概率安排期限<\/h2><p><b>Quantile zₚ（分位数）<\/b>是概率表中与累计概率p对应的Z值。单侧95%对应约1.645，课堂常取1.65。<\/p><div class=\"formula\">D = μ + zₚσ<\/div><p>代入本例，D≈9.333+1.645×1=10.98天。如果按整天安排，可以取11天。<\/p>\n<h2>计算中采用的条件<\/h2><p>这里采用各活动工期独立、A-C-E持续决定完工时间、完成时间近似服从正态分布三个条件。如果其他路径也可能变成最长路径，就要一并分析；如果活动工期相关，方差计算还要包含相关项。若σ=0，工期已确定，直接比较完成时间与期限即可。<\/p>", "questions": [{"id": "v4-path-variance", "prompt": "一条路径有两项工期相互独立的活动，期望分别为4、6天，标准差分别为1、2天。路径的期望与标准差是什么？", "options": ["期望10天，标准差3天", "期望5天，标准差√5天", "期望10天，标准差√5天"], "correct": 2, "feedback": ["标准差不能直接相加。先加方差1²+2²=5，再开平方。", "串行路径的工期相加，因此期望是10天，不取平均。", "期望为4+6=10；路径标准差为√(1²+2²)=√5。"], "ref": "probability", "contextLesson": "probability", "fingerprint": "95fd56316217bbd8", "legacyFingerprint": "95fd56316217bbd8"}, {"id": "v4-deadline-tail", "prompt": "一条路径的期望为10天、标准差为2天，按正态近似计算。期限为8天，已知Φ(1)=0.8413。按时完成的概率约是多少？", "options": ["84.13%", "15.87%", "50%"], "correct": 1, "feedback": ["期限比期望早，应使用Z=−1的左尾，而不是Z=1。", "Z=(8−10)/2=−1。利用对称性，Φ(−1)=1−0.8413=0.1587。", "期限等于期望时才是50%；这里期限早了1个标准差。"], "ref": "probability", "contextLesson": "probability", "fingerprint": "84f443007b734dd3", "legacyFingerprint": "84f443007b734dd3"}, {"id": "v4-deadline-95", "prompt": "路径期望为10天、标准差为2天。希望达到约95%的按时完成概率，取单侧z=1.645，应把期限安排在什么时候？", "options": ["约11.645天", "约13.29天", "约6.71天"], "correct": 1, "feedback": ["1.645表示标准差的倍数，仍需乘标准差2天。", "D=μ+zσ=10+1.645×2=13.29天。", "减去1.645σ得到的是较早的期限，对应约5%的按时率。"], "ref": "probability", "contextLesson": "probability", "fingerprint": "023a8445db87f09e", "legacyFingerprint": "023a8445db87f09e"}], "task": null, "refs": ["probability", "pert"], "requires": ["critical", "pert", "uncertainty"], "introduces": ["probability", "normal", "z", "phi"], "topic": "5.1", "applications": [{"id": "application-probability", "kind": "概率结果改错", "prompt": "路径期望为10天、标准差为2天，期限为8天。有人算出Z=(10−8)/2=1，再查Φ(1)=84.13%，据此报告按时概率84.13%。指出错误，并写出正确解释。", "answer": "Z的分子应为期限减期望，即(8−10)/2=−1。按时完成对应左侧累计概率Φ(−1)=15.87%。8天比平均完成时间早，正态近似下按时概率应低于50%，这也可用于检查方向。"}], "sourceTopic": "5.1", "order": 10, "terms": [["Probability of Completion / Due Date", "完工概率 / 目标期限", "项目经理提出“希望10天内完成”时，10天是目标期限，记为D。完工概率表示在这个期限前完成的可能性，取值从0到1，也可以写成百分比。"], ["Normal Approximation / Standard Normal Distribution", "正态近似 / 标准正态分布", "正态分布呈钟形，数值在平均值附近较集中，两侧较少。这里用正态分布近似计算这条路径的完成时间。标准正态分布将平均值记为0、标准差记为1，便于使用统一的概率表。"]], "material": {"context": "继续计算A-C-E：确认设备和指路牌的要求、安装电脑和取号设备、检查设备和指路牌是否符合要求。A按2天、E按1天计算；C采用上一节得到的期望6.333…天和方差1。", "terms": [["Probability of Completion / Due Date", "完工概率 / 目标期限", "项目经理提出“希望10天内完成”时，10天是目标期限，记为D。完工概率表示在这个期限前完成的可能性，取值从0到1，也可以写成百分比。"], ["Normal Approximation / Standard Normal Distribution", "正态近似 / 标准正态分布", "正态分布呈钟形，数值在平均值附近较集中，两侧较少。这里用正态分布近似计算这条路径的完成时间。标准正态分布将平均值记为0、标准差记为1，便于使用统一的概率表。"]], "tables": []}}, {"id": "practice", "title": "Practice · 综合练习", "goal": "用新数据完成读表、建图、计算和结果解释。", "source": "综合应用：Lecture 4 · 第65–67页", "body": "<p>下面换一组医院准备工作的工期和前置关系。先根据活动表画图，再计算时间、时差和关键路径。画图和计算时，鼠标移到“活动表与背景”即可查看本题条件。<\/p><p>所有工期以天计，开始时间从0算起；前一项工作完成后，后一项才能开始。不同工作组可以并行开展各自的工作。<\/p><div data-slot=\"independent\"><\/div>", "questions": [], "task": "independent", "refs": ["read", "aon", "forward", "backward", "float", "critical"], "requires": ["table", "aon", "early", "late", "total", "free", "critical"], "introduces": [], "topic": "5.1", "sourceTopic": "5.1", "order": 11, "terms": [], "material": {"context": "下面换一组医院准备工作的工期和前置关系。先根据活动表画图，再计算时间、时差和关键路径。画图和计算时，鼠标移到“活动表与背景”即可查看本题条件。", "terms": [], "tables": []}}, {"id": "finish", "title": "Review · 案例结果汇总", "goal": "把活动表、计算结果和甘特图整理成一致的进度计划。", "source": "Lecture 4 · 第37–63页；Lecture 5 · 第43–45页", "body": "<p>医院接待区的活动表、网络图和时间计算可以整理成一份进度计划，供负责设计、安装和检查的人员共同使用。<\/p><div data-slot=\"mastery\"><\/div><section class=\"concept\" data-term=\"gantt\"><h2><span lang=\"en\">Gantt Chart / Milestone<\/span><span>甘特图 / 里程碑<\/span><\/h2><p>甘特图用横轴表示时间，每条横条表示一项活动从开始到完成的区间。里程碑是重要事件，例如“接待区检查通过”，工期为0。检查工作需要1天，检查通过则是这项工作完成后的一个时点。<\/p><\/section><h2>同一份计划的表格与图形<\/h2><p>活动表记录工作与前置条件，网络图表示先后关系，甘特图表示开始和完成时间。下面把医院接待区的同一份计划分别整理出来，比较这些信息如何对应。<\/p><div data-slot=\"handoff\"><\/div><p>固定工期方案中，安装电脑和取号设备需要6天；PERT方案使用期望6.333…天。选择一种方案后，活动表、网络图和甘特图都要使用同一组工期。<\/p><div data-slot=\"expressions\"><\/div>", "questions": [], "task": "finish", "refs": ["checks", "model", "critical", "probability"], "requires": ["table", "early", "late", "critical", "pert", "probability"], "introduces": ["gantt"], "topic": "5.1", "sourceTopic": "5.1", "order": 12, "terms": [["Gantt Chart / Milestone", "甘特图 / 里程碑", "甘特图用横轴表示时间，每条横条表示一项活动从开始到完成的区间。里程碑是重要事件，例如“接待区检查通过”，工期为0。检查工作需要1天，检查通过则是这项工作完成后的一个时点。"]], "material": {"context": "医院接待区的活动表、网络图和时间计算可以整理成一份进度计划，供负责设计、安装和检查的人员共同使用。", "terms": [["Gantt Chart / Milestone", "甘特图 / 里程碑", "甘特图用横轴表示时间，每条横条表示一项活动从开始到完成的区间。里程碑是重要事件，例如“接待区检查通过”，工期为0。检查工作需要1天，检查通过则是这项工作完成后的一个时点。"]], "tables": []}}, {"id": "rel-start", "topic": "5.2", "title": "依赖关系 · 哪个时间受到限制", "goal": "依赖关系 · 哪个时间受到限制", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "body": "<p class=\"opening\">医院接待区准备开放时，工人有些工作必须接着做，有些可以重叠进行。例如，指路牌的图样需要先完成，才能制作；设备检查则可以从已经装好的部分开始，不必等全部设备装完。<\/p><p><b>Dependency Relationship（依赖关系）<\/b>说明一项工作的哪个时间，会受到另一项工作哪个时间的限制。明确这两个时间，才能判断一份安排是否可行。<\/p><section class=\"concept\"><h2><span lang=\"en\">Start / Finish / Duration<\/span><span>开始、完成与工期<\/span><\/h2><p>一项工作有开始时间S、完成时间F和工期d，三者满足F=S+d。下文用I表示提供限制条件的活动，J表示受到这项限制的活动。每个例子都同时写出工作名称。<\/p><\/section>\n<div class=\"worked-example\"><h3>例：检查可以从已经装好的设备开始<\/h3><p>安装人员需要6天装好全部电脑和取号设备。检查人员是另一组人，安装开始2天后，第一批设备已经可以检查。因此检查的开始时间，应比安装的开始时间至少晚2天。<\/p><p>这里需要比较两项工作的<strong>开始<\/strong>时间。若误写成“全部安装完成后才检查”，检查人员就要额外等待。<\/p><\/div>\n<h2>四种关系分别比较什么<\/h2><div class=\"table-scroll\"><table><thead><tr><th>英文术语<\/th><th>比较的时间<\/th><th>含义<\/th><\/tr><\/thead><tbody>\n<tr><td>Finish-to-Start（FS）<br>完成-开始<\/td><td>I完成 → J开始<\/td><td>J开始前，I要先完成。<\/td><\/tr><tr><td>Start-to-Start（SS）<br>开始-开始<\/td><td>I开始 → J开始<\/td><td>J开始不能早于I开始。<\/td><\/tr><tr><td>Finish-to-Finish（FF）<br>完成-完成<\/td><td>I完成 → J完成<\/td><td>J完成不能早于I完成。<\/td><\/tr><tr><td>Start-to-Finish（SF）<br>开始-完成<\/td><td>I开始 → J完成<\/td><td>J结束前，I要先开始。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>先确定比较哪两个时间，再添加需要等待或允许重叠的时间。后续依次介绍四种关系、提前量与滞后量、多个条件的合并，最后练习识别关系并计算最早时间。<\/p><p>依赖中的<strong>FF是Finish-to-Finish<\/strong>。上一专题的Free Float也缩写为FF；在公式中写明全称，就可以区分“关系类型”和“自由时差”。<\/p>", "questions": [], "task": null, "refs": ["rel-overview"], "requires": [], "introduces": [], "sourceTopic": "5.2", "order": 13, "priorLesson": null, "terms": [["Start / Finish / Duration", "开始、完成与工期", "一项工作有开始时间S、完成时间F和工期d，三者满足F=S+d。下文用I表示提供限制条件的活动，J表示受到这项限制的活动。每个例子都同时写出工作名称。"]], "material": {"context": "医院接待区准备开放时，工人有些工作必须接着做，有些可以重叠进行。例如，指路牌的图样需要先完成，才能制作；设备检查则可以从已经装好的部分开始，不必等全部设备装完。", "terms": [["Start / Finish / Duration", "开始、完成与工期", "一项工作有开始时间S、完成时间F和工期d，三者满足F=S+d。下文用I表示提供限制条件的活动，J表示受到这项限制的活动。每个例子都同时写出工作名称。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>英文术语<\/th><th>比较的时间<\/th><th>含义<\/th><\/tr><\/thead><tbody>\n<tr><td>Finish-to-Start（FS）<br/>完成-开始<\/td><td>I完成 → J开始<\/td><td>J开始前，I要先完成。<\/td><\/tr><tr><td>Start-to-Start（SS）<br/>开始-开始<\/td><td>I开始 → J开始<\/td><td>J开始不能早于I开始。<\/td><\/tr><tr><td>Finish-to-Finish（FF）<br/>完成-完成<\/td><td>I完成 → J完成<\/td><td>J完成不能早于I完成。<\/td><\/tr><tr><td>Start-to-Finish（SF）<br/>开始-完成<\/td><td>I开始 → J完成<\/td><td>J结束前，I要先开始。<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "rel-fs", "topic": "5.2", "title": "FS · 前一项完成后，后一项才能开始", "goal": "FS · 前一项完成后，后一项才能开始", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "body": "<section class=\"concept\"><h2><span lang=\"en\">Finish-to-Start (FS)<\/span><span>完成-开始关系<\/span><\/h2><p>I完成后，J才能开始。这里比较I的完成时间Fᵢ和J的开始时间Sⱼ。<\/p><\/section>\n<h2>例：刷墙以后安装指路牌<\/h2><p>医院准备在接待区墙面安装指路牌。工人先刷墙，需要2天；刷完后再留1天干燥时间，另一组工人才安装墙面指路牌，需要1天。干燥期间没有安装工作。<\/p><section class=\"concept\"><h2><span lang=\"en\">Lag<\/span><span>滞后量：两个指定时间之间至少相隔多久<\/span><\/h2><p>用L表示额外规定的等待时间，单位与工期一致。FS+1表示J的开始至少在I完成1天以后。<\/p><\/section>\n<div class=\"formula\">Sⱼ ≥ Fᵢ + L = Sᵢ + dᵢ + L<\/div><p>“≥”表示大于或等于。满足关系不等于必须立刻开始；在没有其他限制时，最早时间取等号。<\/p><div class=\"worked-example\"><p>刷墙从0开始，2完成。干燥1天后，安装最早从3开始，4完成。安排在4开始也满足FS+1，只是晚于最早可行时间。<\/p><\/div><div data-slot=\"relationship-lab\"><\/div>", "questions": [{"id": "rel-fs-limit", "prompt": "刷墙在时点5完成，要求FS+2后才安装指路牌。安装计划在时点8开始。怎样评价这份安排？", "options": ["满足FS+2，但比最早可行时间晚1天", "违反FS+2，必须在7开始", "满足FS+2，8就是最早可行时间"], "correct": 0, "feedback": ["最早开始=5+2=7；8≥7，关系满足。", "FS+2要求不能早于7，没有要求只能在7开始。", "8满足条件，但7也满足，所以8并非最早。"], "ref": "rel-fs", "contextLesson": "rel-fs", "fingerprint": "e9880b4441cb0d35", "legacyFingerprint": "e9880b4441cb0d35"}, {"id": "rel-fs-duration", "prompt": "刷墙在2完成，干燥1天后安装。若指路牌安装工期从1天增为3天，其最早开始与完成时间如何变化？", "options": ["开始改为3，完成仍为4", "开始改为5，完成改为8", "开始仍为3，完成改为6"], "correct": 2, "feedback": ["工期为3天，从3开始就要到6完成。", "后续工期增加不等于开始前需要多等待2天。", "FS限制开始时间。安装工期增加会改变完成时间，不改变前置条件给出的最早开始。"], "ref": "rel-fs", "contextLesson": "rel-fs", "fingerprint": "8eb87b0625d19d49", "legacyFingerprint": "8eb87b0625d19d49"}], "task": null, "refs": ["rel-fs", "rel-offset"], "requires": [], "introduces": [], "relationshipLab": "fs", "applications": [{"id": "application-rel-fs", "kind": "排程改错", "prompt": "刷墙在时点4完成，规定再等2天才能安装。有人把2天加到安装工期上，写成“4开始，5天后完成”。这样是否满足原条件？请分开写出等待与施工。", "answer": "不满足。2天限制安装开始，所以应在6或以后开始；安装本身的工期单独记录。把等待并入工期会允许工人在墙面尚未满足条件时开工。"}], "sourceTopic": "5.2", "order": 14, "priorLesson": "rel-start", "terms": [["Finish-to-Start (FS)", "完成-开始关系", "I完成后，J才能开始。这里比较I的完成时间Fᵢ和J的开始时间Sⱼ。"], ["Lag", "滞后量：两个指定时间之间至少相隔多久", "用L表示额外规定的等待时间，单位与工期一致。FS+1表示J的开始至少在I完成1天以后。"]], "material": {"context": "医院准备在接待区墙面安装指路牌。工人先刷墙，需要2天；刷完后再留1天干燥时间，另一组工人才安装墙面指路牌，需要1天。干燥期间没有安装工作。", "terms": [["Finish-to-Start (FS)", "完成-开始关系", "I完成后，J才能开始。这里比较I的完成时间Fᵢ和J的开始时间Sⱼ。"], ["Lag", "滞后量：两个指定时间之间至少相隔多久", "用L表示额外规定的等待时间，单位与工期一致。FS+1表示J的开始至少在I完成1天以后。"]], "tables": []}}, {"id": "rel-ss", "topic": "5.2", "title": "SS · 从开始时间计算后续何时能开始", "goal": "SS · 从开始时间计算后续何时能开始", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "body": "<section class=\"concept\"><h2><span lang=\"en\">Start-to-Start (SS)<\/span><span>开始-开始关系<\/span><\/h2><p>J的开始受到I的开始限制。SS+L表示I开始后至少经过L，J才能开始。<\/p><\/section>\n<h2>例：分批安装，分批检查<\/h2><p>安装人员需要6天装好全部电脑和取号设备。检查人员可以检查已经装好的部分；安装开始2天后，第一批设备准备好，检查工作需要3天。两组人分别工作。<\/p><div class=\"formula\">Sⱼ ≥ Sᵢ + L<\/div><div class=\"worked-example\"><p>安装从0开始，检查最早从2开始。检查需要3天，所以最早在5完成；全部安装在6完成。仅凭SS+2，并没有规定检查必须等全部安装完成才能结束。<\/p><p>如果检查包含最后安装的设备，还需要对检查的完成时间加一个条件。下一节会用FF表达这个要求。<\/p><\/div><div data-slot=\"relationship-lab\"><\/div>", "questions": [{"id": "rel-ss-finish", "prompt": "安装从3开始、9完成，检查与安装之间为SS+2。检查需要2天，没有其他条件。检查最早的开始与完成时间是什么？", "options": ["开始11，完成13", "开始5，完成9", "开始5，完成7"], "correct": 2, "feedback": ["11是把SS误读为FS：先等安装在9完成，再加2。", "SS不要求两项同时完成；检查工期为2天，不能自行延长到4天。", "SS从安装开始时间3算起：3+2=5，再加检查工期2，得到7。"], "ref": "rel-ss", "contextLesson": "rel-ss", "fingerprint": "74ceae82602f3451", "legacyFingerprint": "74ceae82602f3451"}, {"id": "rel-ss-zero", "prompt": "两项活动的关系为SS+0，I在2开始。J安排在4开始，且没有其他限制。这个安排是否违反SS？", "options": ["违反，因为SS+0要求同时开始", "不违反，J可以晚于I开始", "违反，因为J必须早于I完成"], "correct": 1, "feedback": ["SS+0规定J不能早于I开始，并未强制相等。", "Sⱼ≥Sᵢ；4≥2，所以满足关系。", "SS比较两个开始时间，没有给出完成时间限制。"], "ref": "rel-ss", "contextLesson": "rel-ss", "fingerprint": "b17316b07c47b451", "legacyFingerprint": "b17316b07c47b451"}], "task": null, "refs": ["rel-ss"], "requires": [], "introduces": [], "relationshipLab": "ss", "applications": [{"id": "application-rel-ss", "kind": "识别缺少的条件", "prompt": "安装电脑需要6天；检查人员从安装开始2天后进入现场，检查需要3天，最后一台电脑也必须检查。只写SS+2能否保证检查覆盖最后安装的设备？请说明。", "answer": "不能。若安装从0开始，SS+2允许检查从2做到5，而最后一台电脑到6才装完。还需规定检查不能早于安装完成，即增加完成时间的限制。"}], "sourceTopic": "5.2", "order": 15, "priorLesson": "rel-fs", "terms": [["Start-to-Start (SS)", "开始-开始关系", "J的开始受到I的开始限制。SS+L表示I开始后至少经过L，J才能开始。"]], "material": {"context": "安装人员需要6天装好全部电脑和取号设备。检查人员可以检查已经装好的部分；安装开始2天后，第一批设备准备好，检查工作需要3天。两组人分别工作。", "terms": [["Start-to-Start (SS)", "开始-开始关系", "J的开始受到I的开始限制。SS+L表示I开始后至少经过L，J才能开始。"]], "tables": []}}, {"id": "rel-ff", "topic": "5.2", "title": "FF · 检查不能早于全部安装完成", "goal": "FF · 检查不能早于全部安装完成", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "body": "<section class=\"concept\"><h2><span lang=\"en\">Finish-to-Finish (FF)<\/span><span>完成-完成关系<\/span><\/h2><p>J的完成时间受到I的完成时间限制。J可以提前开始；关键在于它何时允许结束。<\/p><\/section>\n<h2>例：最后装好的设备也需要检查<\/h2><p>安装人员从0开始，用6天装好全部设备。检查人员需要3天完成检查，可以一边安装一边检查，但全部检查不能在设备全部装好之前结束。这个条件写作安装→检查，FF+0。<\/p><div class=\"formula\">Fⱼ ≥ Fᵢ + L<br>Sⱼ ≥ Fᵢ + L − dⱼ<\/div><p>先找检查最早允许完成的时间，再减去检查工期，就得到最早开始。这里dⱼ是检查的工期。<\/p><div class=\"worked-example\"><p>检查最早在6完成，需工作3天，因此最早在3开始。若检查缩短为1天，按同一完成限制，最早从5开始、6完成。<\/p><p>“检查不能比安装更早结束”没有要求两项活动必须同时开始；也没有要求检查要等安装结束后才开始。<\/p><\/div><div data-slot=\"relationship-lab\"><\/div>", "questions": [{"id": "rel-ff-start", "prompt": "设备安装在9完成，检查需3天，关系为FF+1。没有其他限制，检查最早何时开始？", "options": ["7", "10", "6"], "correct": 0, "feedback": ["检查最早完成=9+1=10；最早开始=10−3=7。", "10是最早完成时间，把它当开始就把FF误算成FS。", "6来自9−3，漏掉了1天滞后。"], "ref": "rel-ff", "contextLesson": "rel-ff", "fingerprint": "f303a7fa6942ba5b", "legacyFingerprint": "f303a7fa6942ba5b"}, {"id": "rel-ff-check", "prompt": "安装在6完成，检查需3天，关系为FF+0。检查计划从2做到5。哪种修改刚好满足关系？", "options": ["维持原安排，因为两项工作已经重叠", "只将检查开始时间改为3，工期仍为3天", "只将安装开始时间改早，安装完成仍为6"], "correct": 1, "feedback": ["是否重叠不是判据。检查在5结束，早于安装在6完成。", "检查从3做到6，完成时间与安装完成相接，满足Fⱼ≥Fᵢ。", "FF比较完成时间；安装仍在6完成，原检查在5结束的问题没有改变。"], "ref": "rel-ff", "contextLesson": "rel-ff", "fingerprint": "9307c3064f1fd090", "legacyFingerprint": "9307c3064f1fd090"}], "task": null, "refs": ["rel-ff"], "requires": [], "introduces": [], "relationshipLab": "ff", "applications": [{"id": "application-rel-ff", "kind": "解释排程差异", "prompt": "同一项检查需要3天，设备安装在6完成。分别采用FS+0和FF+0，检查的最早开始与完成是什么？用工作含义说明为什么相差3天。", "answer": "FS+0：检查从6开始、9完成，全部检查必须等安装结束。FF+0：检查可从3开始、6完成，允许边安装边检查，但不能先于安装结束。差异来自允许重叠的方式。"}], "sourceTopic": "5.2", "order": 16, "priorLesson": "rel-ss", "terms": [["Finish-to-Finish (FF)", "完成-完成关系", "J的完成时间受到I的完成时间限制。J可以提前开始；关键在于它何时允许结束。"]], "material": {"context": "安装人员从0开始，用6天装好全部设备。检查人员需要3天完成检查，可以一边安装一边检查，但全部检查不能在设备全部装好之前结束。这个条件写作安装→检查，FF+0。", "terms": [["Finish-to-Finish (FF)", "完成-完成关系", "J的完成时间受到I的完成时间限制。J可以提前开始；关键在于它何时允许结束。"]], "tables": []}}, {"id": "rel-sf", "topic": "5.2", "title": "SF · 新服务开始后，旧服务才能结束", "goal": "SF · 新服务开始后，旧服务才能结束", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "body": "<section class=\"concept\"><h2><span lang=\"en\">Start-to-Finish (SF)<\/span><span>开始-完成关系<\/span><\/h2><p>I开始后，J才允许结束。这里比较I的开始时间与J的完成时间，不按两项工作实际开工的先后来命名。<\/p><\/section>\n<h2>例：医院新旧服务台交接<\/h2><p>医院准备把接待工作转到新服务台。新服务台的首班人员安排在时点8开始值班；旧服务台的末班人员需要值班4小时，并且必须接到新服务台开始接待之后才能下班。各时点从本次排班的0开始计，单位为小时。<\/p><p>令I为“在新服务台值班”，J为“在旧服务台值班”。交接要求是：J的结束不能早于I的开始，写作I→J，SF+0。<\/p><div class=\"formula\">Fⱼ ≥ Sᵢ + L<br>Sⱼ ≥ Sᵢ + L − dⱼ<\/div><div class=\"worked-example\"><p>新服务台在8开始，旧服务台最早在8结束。旧班需要4小时，因此可安排从4到8。<\/p><p>这里J实际比I先开工，箭头仍从I指向J，因为新班开始是旧班能否结束的条件。若需要重叠交接1小时，就写SF+1，旧班最早在9结束。<\/p><\/div><div data-slot=\"relationship-lab\"><\/div>", "questions": [{"id": "rel-sf-direction", "prompt": "新服务台在10开始接待，旧服务台需再维持1小时才能关闭。令I为新服务台值班、J为旧服务台值班，应记录什么关系？", "options": ["I→J，FS+1", "I→J，SF+1", "J→I，FS+1"], "correct": 1, "feedback": ["FS+1会要求旧班在新班结束后才开始，限制了错误的一对时间。", "限制的是旧班完成Fⱼ不得早于新班开始Sᵢ+1，所以是SF+1。", "旧班结束后新班再开始会留下间隔，与交接期间保持服务的要求不同。"], "ref": "rel-sf", "contextLesson": "rel-sf", "fingerprint": "96d52191dac594ce", "legacyFingerprint": "96d52191dac594ce"}, {"id": "rel-sf-calculate", "prompt": "新班在10开始，旧班持续4小时，关系为新班→旧班，SF+1。旧班最早的开始与结束时间是什么？", "options": ["6到10", "11到15", "7到11"], "correct": 2, "feedback": ["6到10只满足SF+0，少了1小时交接重叠。", "11是旧班允许结束的时间，不是必须开始的时间。", "旧班最早结束=10+1=11，最早开始=11−4=7。"], "ref": "rel-sf", "contextLesson": "rel-sf", "fingerprint": "a468ab29250ecc00", "legacyFingerprint": "a468ab29250ecc00"}], "task": null, "refs": ["rel-sf"], "requires": [], "introduces": [], "relationshipLab": "sf", "applications": [{"id": "application-rel-sf", "kind": "箭头方向辨析", "prompt": "“旧服务台比新服务台更早开工，所以必须把箭头画成旧→新。”这句话遗漏了什么？请指出SF需要比较的两个时间。", "answer": "遗漏了依赖实际限制的是哪两个时间。旧班能否结束取决于新班是否开始，因此比较新班的开始与旧班的完成，箭头从新班指向旧班。不能仅按实际开工先后决定方向。"}], "sourceTopic": "5.2", "order": 17, "priorLesson": "rel-ff", "terms": [["Start-to-Finish (SF)", "开始-完成关系", "I开始后，J才允许结束。这里比较I的开始时间与J的完成时间，不按两项工作实际开工的先后来命名。"]], "material": {"context": "医院准备把接待工作转到新服务台。新服务台的首班人员安排在时点8开始值班；旧服务台的末班人员需要值班4小时，并且必须接到新服务台开始接待之后才能下班。各时点从本次排班的0开始计，单位为小时。", "terms": [["Start-to-Finish (SF)", "开始-完成关系", "I开始后，J才允许结束。这里比较I的开始时间与J的完成时间，不按两项工作实际开工的先后来命名。"]], "tables": []}}, {"id": "rel-offset", "topic": "5.2", "title": "Lead / Lag · 提前量与滞后量", "goal": "Lead / Lag · 提前量与滞后量", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "body": "<section class=\"concept\"><h2><span lang=\"en\">Lead / Lag<\/span><span>提前量与滞后量<\/span><\/h2><p>Lag表示指定时间之间必须保留的等待。Lead表示允许相对该限制提前进行的时间。在统一公式中，用有符号的L记录：正数表示滞后，负数表示提前。<\/p><\/section>\n<h2>例：全部安装结束前开始检查<\/h2><p>安装电脑和取号设备需要6天，检查需要3天。检查人员可以先检查已安装的设备，允许在全部安装完成前2天开始检查。用安装→检查，FS−2表示这个条件。<\/p><div class=\"formula\">Sⱼ ≥ Fᵢ − 2<\/div><div class=\"worked-example\"><p>安装从0到6，检查最早从4到7。安装工期仍为6天，检查工期仍为3天；改变的是两项工作允许重叠的时间。<\/p><\/div>\n<h2>把正负号放回完整句子<\/h2><ul><li>FS+2：I完成2天后，J才能开始。<\/li><li>FS−2：J最早可以在I完成前2天开始。<\/li><li>SS+2：I开始2天后，J才能开始。<\/li><\/ul><p>提前量需要具体工作条件支持。本例允许分批检查已经装好的设备，才可以提前开始检查。确认关系时，要写清是哪两个时间之间相差多久。<\/p><div data-slot=\"relationship-lab\"><\/div>", "questions": [{"id": "rel-lead-sign", "prompt": "安装在8完成，允许检查提前2天开始；检查需3天。哪个记录正确？", "options": ["FS+2，检查10到13", "FS−2，检查6到9", "SS−2，检查6到9"], "correct": 1, "feedback": ["+2表示完成后再等2天，与提前2天的意思相反。", "6=8−2，完成时间为6+3=9，工期未改变。", "题目以安装完成时间8为参照，应使用FS；SS要以安装开始时间为参照。"], "ref": "rel-offset", "contextLesson": "rel-offset", "fingerprint": "47b2c05d7b11cc58", "legacyFingerprint": "47b2c05d7b11cc58"}, {"id": "rel-lead-duration", "prompt": "安装与检查原来分别需6天、3天。改为FS−2后，下列哪种说法正确？", "options": ["安装工期缩短为4天", "两项工期不变，允许重叠2天", "检查工期缩短为1天"], "correct": 1, "feedback": ["提前量调整依赖中的时间限制，没有缩短安装本身。", "工期保持6天和3天；检查可在安装结束前2天开始。", "检查仍需3天，不能从检查工期中扣掉提前量。"], "ref": "rel-offset", "contextLesson": "rel-offset", "fingerprint": "8c6abbcb5b24007a", "legacyFingerprint": "8c6abbcb5b24007a"}], "task": null, "refs": ["rel-offset"], "requires": [], "introduces": [], "relationshipLab": "lead", "applications": [{"id": "application-rel-offset", "kind": "同一数字，不同关系", "prompt": "安装从0开始，需6天。检查需3天。分别使用FS−2与SS+2，算出检查的最早开始与完成时间，并说明两者为什么不能互换。", "answer": "FS−2：从安装完成6往前2天，检查4到7。SS+2：从安装开始0往后2天，检查2到5。两者参照的时间不同，虽然都出现数字2，限制含义不同。"}], "sourceTopic": "5.2", "order": 18, "priorLesson": "rel-sf", "terms": [["Lead / Lag", "提前量与滞后量", "Lag表示指定时间之间必须保留的等待。Lead表示允许相对该限制提前进行的时间。在统一公式中，用有符号的L记录：正数表示滞后，负数表示提前。"]], "material": {"context": "安装电脑和取号设备需要6天，检查需要3天。检查人员可以先检查已安装的设备，允许在全部安装完成前2天开始检查。用安装→检查，FS−2表示这个条件。", "terms": [["Lead / Lag", "提前量与滞后量", "Lag表示指定时间之间必须保留的等待。Lead表示允许相对该限制提前进行的时间。在统一公式中，用有符号的L记录：正数表示滞后，负数表示提前。"]], "tables": []}}, {"id": "rel-combine", "topic": "5.2", "title": "多个前置条件 · 选择最严格的开始限制", "goal": "多个前置条件 · 选择最严格的开始限制", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "body": "<p class=\"opening\">一项工作可能同时受到几个条件限制。先把每个条件都换成“最早能在什么时候开始”，再取其中最大的值。<\/p><h2>例：接待区设备检查<\/h2><p>安装电脑和取号设备（I）从0到6；刷墙（K）从1到3；检查设备（J）需要3天。检查人员要同时满足：<\/p><ol><li>安装开始2天后才能进入检查：I→J，SS+2。<\/li><li>全部检查不能早于安装完成：I→J，FF+0。<\/li><li>刷墙完成1天后才能进入接待区：K→J，FS+1。<\/li><\/ol><div class=\"worked-example\"><p>SS+2给出Sⱼ≥0+2=2。FF+0给出Sⱼ≥6−3=3。FS+1给出Sⱼ≥3+1=4。<\/p><p>同时满足三项，Sⱼ≥max(2,3,4)=4。因此检查最早从4到7。取最小值2只满足其中一部分条件。<\/p><\/div><div class=\"formula\">最早开始 = max(各项开始时间下界，项目允许的最早时间)<\/div><p>本专题把项目允许的最早时间设为0。某条公式若算出负数，还要和0比较，不能据此安排在项目起点之前。<\/p><div data-slot=\"relationship-combined\"><\/div>", "questions": [{"id": "rel-combine", "prompt": "检查需2天，两个前置条件分别给出：安装在8完成，FF+0；现场准备在5完成，FS+2。检查最早的开始与完成是什么？", "options": ["7到9", "6到8", "8到10"], "correct": 0, "feedback": ["先换成两个开始下界6和7，再取max=7，完成为9。", "FF给出开始不早于8−2=6，但FS还要求不早于5+2=7。", "8满足条件，但7已同时满足，因此8不是最早。"], "ref": "rel-combine", "contextLesson": "rel-combine", "fingerprint": "d215f0af05516735", "legacyFingerprint": "d215f0af05516735"}, {"id": "rel-zero-floor", "prompt": "安装在2完成，检查需5天，仅有FF+0；两项活动均不能在项目时点0之前开始。检查最早何时开始与完成？", "options": ["−3到2", "2到7", "0到5"], "correct": 2, "feedback": ["FF给出−3这个下界，还需要满足项目起点0，取较大的0。", "2到7满足条件，但0到5也满足，所以不是最早。", "开始≥max(2−5,0)=0，完成=0+5=5，也满足完成不得早于2。"], "ref": "rel-combine", "contextLesson": "rel-combine", "fingerprint": "aa19389b0e574883", "legacyFingerprint": "aa19389b0e574883"}], "task": null, "refs": ["rel-combine"], "requires": [], "introduces": [], "applications": [{"id": "application-rel-combine", "kind": "找出真正限制开工的条件", "prompt": "某项检查的三项开始下界为2、3、4天。若只把第一项限制放宽到1天，最早开工会提前吗？若把第三项从4放宽到2天，又会怎样？", "answer": "只把2改为1，max(1,3,4)仍为4，开工不变。把4改为2后，max(2,3,2)=3，才会提前1天。改善较宽松的条件，未必改变最终开始时间。"}], "sourceTopic": "5.2", "order": 19, "priorLesson": "rel-offset", "terms": [], "material": {"context": "一项工作可能同时受到几个条件限制。先把每个条件都换成“最早能在什么时候开始”，再取其中最大的值。", "terms": [], "tables": []}}, {"id": "rel-practice", "topic": "5.2", "title": "综合练习 · 从工作要求写出时间约束", "goal": "综合练习 · 从工作要求写出时间约束", "source": "Lecture 5 · PDF第38–42页（页内标注39–43）", "body": "<p>下面每道题都会给出工作背景、时间和一句具体要求。根据要求选择关系类型，填写有符号的滞后量，再计算受到限制的活动最早何时开始、何时完成。题号固定时，题目条件保持一致。<\/p><div data-slot=\"relationship-practice\"><\/div><h2>自编两个活动的关系<\/h2><p>也可以调整两个活动的工期、关系类型和滞后量，移动后续活动的开始时间，观察同一安排是否仍然满足条件。<\/p><div data-slot=\"relationship-lab\"><\/div>", "questions": [], "task": "relationships-practice", "refs": ["rel-overview", "rel-fs", "rel-ss", "rel-ff", "rel-sf", "rel-offset", "rel-combine"], "requires": [], "introduces": [], "relationshipLab": "diy", "sourceTopic": "5.2", "order": 20, "priorLesson": "rel-combine", "terms": [], "material": {"context": "下面每道题都会给出工作背景、时间和一句具体要求。根据要求选择关系类型，填写有符号的滞后量，再计算受到限制的活动最早何时开始、何时完成。题号固定时，题目条件保持一致。", "terms": [], "tables": []}}, {"id": "scope-needs", "topic": "4.1", "title": "医院接待区的需求", "goal": "医院接待区的需求", "source": "Lecture 3 · 需求与范围，PDF第8–19页", "body": "<p>医院准备开放一个接待区。患者需要找到正确的窗口，接待人员需要办理登记，负责人需要知道开放前怎样检查这些设施。项目经理先与这些人明确要求，随后才能确定要交付什么、需要做哪些工作。<\/p><section class=\"concept\"><h2><span lang=\"en\">Requirement<\/span><span>需求<\/span><\/h2><p>为了满足相关方的需要，项目或交付成果必须具备的条件或能力。需求既可以描述功能，也可以描述性能、准备工作和管理要求。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>需求类型<\/th><th>医院例子<\/th><\/tr><\/thead><tbody><tr><td>Business requirement 业务需求<\/td><td>缩短患者到院后寻找服务窗口的时间。<\/td><\/tr><tr><td>Stakeholder requirement 利益相关者需求<\/td><td>接待人员能够查看当前等候人数。<\/td><\/tr><tr><td>Functional requirement 功能需求<\/td><td>患者可以领取号码，并在屏幕查看叫号。<\/td><\/tr><tr><td>Non-functional requirement 非功能需求<\/td><td>在规定负载下，叫号信息在2秒内更新。<\/td><\/tr><tr><td>Transition requirement 过渡需求<\/td><td>开放前完成接待人员培训和旧资料迁移。<\/td><\/tr><tr><td>Project / Quality requirement 项目／质量需求<\/td><td>每周提交进度记录；设备通过约定的验收测试。<\/td><\/tr><\/tbody><\/table><\/div><p>“方便使用”表达了诉求，还不足以指导验收。项目经理需要进一步问清使用者、使用场景和合格标准。记录时写明对象、指标、阈值和验证条件；提出需求的人也应能确认这句话准确表达了他的需要。<\/p><div class=\"worked-example\"><h3>把一句愿望写成可验证的需求<\/h3><p>原句：取号系统要快。改写：两台终端同时使用，按约定步骤各测试50次；至少95%的取号请求在2秒内返回号码。这里明确了测试负载、观察指标和合格阈值。<\/p><\/div>", "questions": [{"id": "scope-needs-q1", "prompt": "医院要求“两台终端同时使用、各测试50次，至少95%的取号请求在2秒内返回”。这句话主要补充了什么？", "options": ["取号这一功能是否存在", "取号功能应达到的性能与验证条件", "设备采购的执行顺序"], "correct": 1, "feedback": ["功能是否存在与功能执行得多快是不同问题。", "负载、比例和响应时间使性能要求可以检验。", "这句话没有说明采购活动之间的依赖。"], "ref": "r-scope-needs", "contextLesson": "scope-needs", "fingerprint": "b3a2b6329895e05d", "legacyFingerprint": "eb701e04324d8e45"}, {"id": "scope-needs-q2", "prompt": "负责人写下“开放前培训全部接待人员”。为什么不能只保留设备功能需求？", "options": ["设备通过测试就足以证明人员会操作", "培训属于过渡准备，也关系到交付成果能否投入使用", "培训总应放在项目结束之后"], "correct": 1, "feedback": ["设备能运行不能证明人员已具备操作能力。", "投入使用需要人员具备操作能力，过渡需求应单独记录。", "培训时点应满足投入使用要求，不能自动推迟到项目结束后。"], "ref": "r-scope-needs", "contextLesson": "scope-needs", "fingerprint": "3f8aa6176ca21670", "legacyFingerprint": "3f8aa6176ca21670"}], "refs": ["r-scope-needs"], "applications": [{"id": "a-scope-needs", "kind": "需求改写", "prompt": "院方提出“患者容易找到窗口”。请写出可以开展检查的要求，同时说明需要向谁确认检查标准。", "answer": "可写成：在接待区入口与每个分岔处设置窗口方向和编号，验收时按约定路线逐点检查；若要测量寻路效果，还需规定参与者、起终点、时限和通过比例。与院方、患者代表和接待人员确认这些标准，避免自行把偏好当成要求。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.1", "order": 0, "priorLesson": null, "terms": [["Requirement", "需求", "为了满足相关方的需要，项目或交付成果必须具备的条件或能力。需求既可以描述功能，也可以描述性能、准备工作和管理要求。"]], "material": {"context": "医院准备开放一个接待区。患者需要找到正确的窗口，接待人员需要办理登记，负责人需要知道开放前怎样检查这些设施。项目经理先与这些人明确要求，随后才能确定要交付什么、需要做哪些工作。", "terms": [["Requirement", "需求", "为了满足相关方的需要，项目或交付成果必须具备的条件或能力。需求既可以描述功能，也可以描述性能、准备工作和管理要求。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>需求类型<\/th><th>医院例子<\/th><\/tr><\/thead><tbody><tr><td>Business requirement 业务需求<\/td><td>缩短患者到院后寻找服务窗口的时间。<\/td><\/tr><tr><td>Stakeholder requirement 利益相关者需求<\/td><td>接待人员能够查看当前等候人数。<\/td><\/tr><tr><td>Functional requirement 功能需求<\/td><td>患者可以领取号码，并在屏幕查看叫号。<\/td><\/tr><tr><td>Non-functional requirement 非功能需求<\/td><td>在规定负载下，叫号信息在2秒内更新。<\/td><\/tr><tr><td>Transition requirement 过渡需求<\/td><td>开放前完成接待人员培训和旧资料迁移。<\/td><\/tr><tr><td>Project / Quality requirement 项目／质量需求<\/td><td>每周提交进度记录；设备通过约定的验收测试。<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "scope-boundary", "topic": "4.1", "title": "产品范围与项目范围", "goal": "产品范围与项目范围", "source": "Lecture 3 · PDF第8–11、21–25页", "body": "<p>接待区要提供取号和叫号服务。为了实现这两项功能，项目团队需要选型、采购、安装、配置和测试。描述功能与描述工作时，项目经理使用两种不同的“范围”。<\/p><section class=\"concept\"><h2><span lang=\"en\">Product Scope / Project Scope<\/span><span>产品范围／项目范围<\/span><\/h2><p>产品范围描述成果的功能和特性；项目范围描述为了交付这些功能和特性而需要完成的工作。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>内容<\/th><th>产品范围<\/th><th>项目范围<\/th><\/tr><\/thead><tbody><tr><td>医院接待区<\/td><td>两台取号终端、叫号显示、多语言提示<\/td><td>采购终端、安装接线、配置提示、测试并培训<\/td><\/tr><tr><td>范围排除项<\/td><td>本次不提供网上预约<\/td><td>本次不开展网上预约系统的开发和部署<\/td><\/tr><\/tbody><\/table><\/div><section class=\"concept\"><h2><span lang=\"en\">Project Scope Statement<\/span><span>项目范围说明书<\/span><\/h2><p>对交付成果、验收标准、排除项、约束和假设作出明确说明，使参与者能据此判断某项要求是否属于当前项目。<\/p><\/section><p>Constraint（约束）是必须遵守的限制，例如接待区必须在10月1日前可用。Assumption（假设）是规划时暂按真实处理、仍需确认的条件，例如供应商能在7天内到货。把假设写清，可以安排验证；把它写成已经得到保证的事实，会使计划遗漏风险。<\/p><div class=\"worked-example\"><h3>新增打印功能如何判断<\/h3><p>原范围只包括取号和叫号。有人提出增加病历打印，即使使用同一台设备，也需要检查是否增加了功能、配置、测试和信息处理要求。设备相同并不表示工作范围相同。<\/p><\/div><p>SMART用于检查目标是否Specific（具体）、Measurable（可衡量）、Achievable（可实现）、Relevant（相关）、Time-bound（有时限）。例如“在开放前，让全部接待人员按检查表独立完成取号和叫号操作”，仍需说明检查表内容、培训资源和通过标准。<\/p>", "questions": [{"id": "scope-boundary-q1", "prompt": "“提供中文和英文提示”与“配置并测试两种语言”分别描述什么？", "options": ["前者为假设，后者为约束", "前者为产品范围，后者为项目范围", "两者都是执行活动"], "correct": 1, "feedback": ["两句话均没有表达待验证前提或必须遵守的限制。", "前者描述成果特性，后者描述实现与验证该特性所需工作。", "“提供两种提示”在这里是成果要求，没有描述具体执行过程。"], "ref": "r-scope-boundary", "contextLesson": "scope-boundary", "fingerprint": "09f5c191fed2733e", "legacyFingerprint": "09f5c191fed2733e"}, {"id": "scope-boundary-q2", "prompt": "供应商尚未确认交期，计划暂按7天到货。最合适的记录是什么？", "options": ["写成已确定的交付里程碑，暂不跟进", "列为假设，并安排确认交期及延迟影响分析", "列为项目团队可以直接控制的约束"], "correct": 1, "feedback": ["暂用的时间不能替代供应商承诺。", "把规划前提与验证行动一起记录，后续才能及时更新安排。", "团队不能仅靠把它写成约束就使供应商按时交付。"], "ref": "r-scope-boundary", "contextLesson": "scope-boundary", "fingerprint": "f58ab787f2242d99", "legacyFingerprint": "f58ab787f2242d99"}], "refs": ["r-scope-boundary"], "applications": [{"id": "a-scope-boundary", "kind": "范围分析", "prompt": "本次只改造医院一楼接待区。有人提出在二楼增加相同设备，并称“设备型号没变，所以范围没变”。请解释，并写出要补查的信息。", "answer": "地点和数量都属于范围边界。增加二楼设备会涉及采购、安装、网络、培训和验收等工作。应核对原范围中的地点与数量、提出者、用途、成本、工期和资源影响，再进入变更评估。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.1", "order": 1, "priorLesson": "scope-needs", "terms": [["Product Scope / Project Scope", "产品范围／项目范围", "产品范围描述成果的功能和特性；项目范围描述为了交付这些功能和特性而需要完成的工作。"], ["Project Scope Statement", "项目范围说明书", "对交付成果、验收标准、排除项、约束和假设作出明确说明，使参与者能据此判断某项要求是否属于当前项目。"]], "material": {"context": "接待区要提供取号和叫号服务。为了实现这两项功能，项目团队需要选型、采购、安装、配置和测试。描述功能与描述工作时，项目经理使用两种不同的“范围”。", "terms": [["Product Scope / Project Scope", "产品范围／项目范围", "产品范围描述成果的功能和特性；项目范围描述为了交付这些功能和特性而需要完成的工作。"], ["Project Scope Statement", "项目范围说明书", "对交付成果、验收标准、排除项、约束和假设作出明确说明，使参与者能据此判断某项要求是否属于当前项目。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>内容<\/th><th>产品范围<\/th><th>项目范围<\/th><\/tr><\/thead><tbody><tr><td>医院接待区<\/td><td>两台取号终端、叫号显示、多语言提示<\/td><td>采购终端、安装接线、配置提示、测试并培训<\/td><\/tr><tr><td>范围排除项<\/td><td>本次不提供网上预约<\/td><td>本次不开展网上预约系统的开发和部署<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "scope-baseline", "topic": "4.1", "title": "经批准的范围基线", "goal": "经批准的范围基线", "source": "Lecture 3 · PDF第21–26页", "body": "<p>院方确认了接待区的功能与边界后，设计、采购和安装人员需要使用同一版要求。否则，设计师可能只准备中文标牌，采购人员却订购了按双语布局制作的设备。<\/p><section class=\"concept\"><h2><span lang=\"en\">Scope Baseline<\/span><span>范围基线<\/span><\/h2><p>经批准的项目范围说明书、WBS和WBS词典。它提供执行与检查时共同使用的范围依据。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>组成部分<\/th><th>说明什么<\/th><th>接待区例子<\/th><\/tr><\/thead><tbody><tr><td>范围说明书<\/td><td>要交付什么，满足哪些条件<\/td><td>开放一楼接待区，提供取号和叫号服务<\/td><\/tr><tr><td>WBS，工作分解结构<\/td><td>范围怎样分成可管理的部分<\/td><td>设备、指路牌、开放准备和项目管理<\/td><\/tr><tr><td>WBS Dictionary，WBS词典<\/td><td>各部分的详细内容与边界<\/td><td>指路牌的地点、数量、语言、负责人及验收要求<\/td><\/tr><\/tbody><\/table><\/div><p>前面已经整理了WBS及其词典；把它们与范围说明书一起批准后，就形成团队共同使用的范围基线。批准后仍可以提出变更，但团队应先评估、批准并更新有关文件，再按新版本执行。保存批准记录，才能解释要求为什么变化。<\/p><section class=\"concept\"><h2><span lang=\"en\">Scope Management<\/span><span>范围管理<\/span><\/h2><p>规划范围管理、收集需求、定义范围、创建WBS、确认范围和控制范围，共同维护项目应完成的工作。确认范围是正式接受已完成成果，控制范围则贯穿执行过程。<\/p><\/section>", "questions": [{"id": "scope-baseline-q1", "prompt": "院方使用者邮件要求增加一个窗口，尚未评估新增工作。哪项行动适合在安装前完成？", "options": ["按原预算采购，等测试时再确认范围", "登记请求，评估范围、工期、费用与资源，并取得授权决定", "先更新基线为新增窗口版，再请院方评估"], "correct": 1, "feedback": ["新增要求可能超出原预算和工期，应先评估。", "评估与授权决定提供是否执行的依据。", "基线更新应以批准决定为依据，不能先当作已批准。"], "ref": "r-scope-baseline", "contextLesson": "scope-baseline", "fingerprint": "4b83e2b70ae382c5", "legacyFingerprint": "7ab123f699696dac"}, {"id": "scope-baseline-q2", "prompt": "一张WBS树图已覆盖全部工作，但未注明验收边界和工作包细节。还缺少哪些内容才形成完整范围基线？", "options": ["范围说明书与WBS词典", "采购报价与每周进展报告", "人员日历与当前甘特图"], "correct": 0, "feedback": ["范围基线由范围说明书、WBS及WBS词典组成。", "报价与进展记录有用途，但不是完整范围基线的另两个组成。", "这些是进度和资源资料，不能替代范围边界与工作包说明。"], "ref": "r-scope-baseline", "contextLesson": "scope-baseline", "fingerprint": "ebe9b6ab44ab2d50", "legacyFingerprint": "4eeceb18dd90577b"}], "refs": ["r-scope-baseline"], "applications": [], "lab": null, "drill": {"id": "scope-baseline-d", "prompt": "院方已经批准双语指路牌，但采购清单仍只有中文版本。选出需要一起核对的内容。", "fields": [{"key": "checks", "label": "核对内容", "type": "multi", "options": ["需求与验收标准", "相关工作包词典与采购资料", "影响工期和成本的变更记录", "只查看采购总金额是否变化"], "answer": [0, 1, 2]}], "explanation": "语言要求、工作细节和变更影响都需要核对。即使总金额不变，也可能买错成果。", "guided": false, "fingerprint": "0a3f3b0c76297ec0"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.1", "order": 5, "priorLesson": "wbs-package", "terms": [["Scope Baseline", "范围基线", "经批准的项目范围说明书、WBS和WBS词典。它提供执行与检查时共同使用的范围依据。"], ["Scope Management", "范围管理", "规划范围管理、收集需求、定义范围、创建WBS、确认范围和控制范围，共同维护项目应完成的工作。确认范围是正式接受已完成成果，控制范围则贯穿执行过程。"]], "material": {"context": "院方确认了接待区的功能与边界后，设计、采购和安装人员需要使用同一版要求。否则，设计师可能只准备中文标牌，采购人员却订购了按双语布局制作的设备。", "terms": [["Scope Baseline", "范围基线", "经批准的项目范围说明书、WBS和WBS词典。它提供执行与检查时共同使用的范围依据。"], ["Scope Management", "范围管理", "规划范围管理、收集需求、定义范围、创建WBS、确认范围和控制范围，共同维护项目应完成的工作。确认范围是正式接受已完成成果，控制范围则贯穿执行过程。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>组成部分<\/th><th>说明什么<\/th><th>接待区例子<\/th><\/tr><\/thead><tbody><tr><td>范围说明书<\/td><td>要交付什么，满足哪些条件<\/td><td>开放一楼接待区，提供取号和叫号服务<\/td><\/tr><tr><td>WBS，工作分解结构<\/td><td>范围怎样分成可管理的部分<\/td><td>设备、指路牌、开放准备和项目管理<\/td><\/tr><tr><td>WBS Dictionary，WBS词典<\/td><td>各部分的详细内容与边界<\/td><td>指路牌的地点、数量、语言、负责人及验收要求<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "wbs-structure", "topic": "4.1", "title": "工作分解结构（WBS）", "goal": "工作分解结构（WBS）", "source": "Lecture 3 · PDF第24、27–40页", "body": "<p>医院接待区要投入使用，需要设备、指路牌、人员准备和项目管理等工作。项目经理需要把全部范围整理成层级结构，便于分工、估算和检查是否有遗漏。<\/p><section class=\"concept\"><h2><span lang=\"en\">Work Breakdown Structure (WBS)<\/span><span>工作分解结构<\/span><\/h2><p>把项目全部工作分解为较小、可管理部分的层级结构。每个子项进一步说明父项包含的范围。这里按交付成果组织接待区项目。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>层级<\/th><th>编号与名称<\/th><th>包含内容<\/th><\/tr><\/thead><tbody><tr><td>项目<\/td><td>1 接待区开放准备<\/td><td>本次接待区项目全部范围<\/td><\/tr><tr><td>主要部分<\/td><td>1.1 项目管理；1.2 可用设备；1.3 已安装指路牌；1.4 开放准备<\/td><td>分别管理、交付设备、交付标牌、准备投入使用<\/td><\/tr><tr><td>工作包示例<\/td><td>1.3.1 指路牌图样；1.3.2 已制作并安装的指路牌<\/td><td>进一步明确图样和现场成果<\/td><\/tr><\/tbody><\/table><\/div><p>WBS中的上下位置表示包含关系。指路牌图样与安装成果是同一分支的不同工作包，先后顺序需要在活动表和网络图中另行说明。也可以按阶段、地点或其他清楚的方式分解，但同一层的分类不能造成重复归属。<\/p><div class=\"worked-example\"><h3>为什么不能只列采购和安装<\/h3><p>如果交付要求包括人员培训、验收记录和项目收尾，WBS也需要覆盖这些工作。只列现场施工，会使预算、责任和验收准备都不完整。<\/p><\/div>", "questions": [{"id": "wbs-structure-q1", "prompt": "“设备采购”同时列在“可用设备”和“采购工作”两条分支，每处都包含整笔设备费。首先要修正什么？", "options": ["把两个分支都继续分解，直到最底层工作名称不同", "明确工作唯一归属与引用关系，消除重复计入", "把其中一处改成不同编号，保留两笔预算"], "correct": 1, "feedback": ["改名和细分未必消除同一范围被计两次的问题。", "WBS需要完整且不重复，交叉引用应与重复承担范围区分。", "不同编号不能把同一笔工作和费用变成两份。"], "ref": "r-wbs-structure", "contextLesson": "wbs-structure", "fingerprint": "d73e1f145d852b70", "legacyFingerprint": "e06ad96d8d7340d4"}, {"id": "wbs-structure-q2", "prompt": "WBS中“指路牌”列在“设备”之后，是否意味着设备完成后才能做指路牌？", "options": ["不能据此判断，先后关系需要活动依赖资料", "是，纵向位置代表时间", "否，两项工作必定并行"], "correct": 0, "feedback": ["只有依赖资料才能说明两项工作是否需要相互等待。", "WBS的层级和排列主要表示范围。", "WBS也不能自动证明两项工作可并行。"], "ref": "r-wbs-structure", "contextLesson": "wbs-structure", "fingerprint": "146f4a8d7882f605", "legacyFingerprint": "146f4a8d7882f605"}], "refs": ["r-wbs-structure"], "applications": [{"id": "a-wbs-structure", "kind": "结构比较", "prompt": "方案甲按“设备、指路牌、开放准备”分解；方案乙按“设计、采购、安装、验收”分解。是否只有甲能成为WBS？说明如何判断。", "answer": "两种分解方式均可能成立。应核对是否覆盖全部范围、同层分类是否清楚、是否重复、是否能落实责任和验收。采用阶段分解时仍需明确每阶段的具体成果，不能只剩几个无法估算和管理的标签。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.2", "order": 2, "priorLesson": "scope-boundary", "terms": [["Work Breakdown Structure (WBS)", "工作分解结构", "把项目全部工作分解为较小、可管理部分的层级结构。每个子项进一步说明父项包含的范围。这里按交付成果组织接待区项目。"]], "material": {"context": "医院接待区要投入使用，需要设备、指路牌、人员准备和项目管理等工作。项目经理需要把全部范围整理成层级结构，便于分工、估算和检查是否有遗漏。", "terms": [["Work Breakdown Structure (WBS)", "工作分解结构", "把项目全部工作分解为较小、可管理部分的层级结构。每个子项进一步说明父项包含的范围。这里按交付成果组织接待区项目。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>层级<\/th><th>编号与名称<\/th><th>包含内容<\/th><\/tr><\/thead><tbody><tr><td>项目<\/td><td>1 接待区开放准备<\/td><td>本次接待区项目全部范围<\/td><\/tr><tr><td>主要部分<\/td><td>1.1 项目管理；1.2 可用设备；1.3 已安装指路牌；1.4 开放准备<\/td><td>分别管理、交付设备、交付标牌、准备投入使用<\/td><\/tr><tr><td>工作包示例<\/td><td>1.3.1 指路牌图样；1.3.2 已制作并安装的指路牌<\/td><td>进一步明确图样和现场成果<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "wbs-coverage", "topic": "4.1", "title": "检查WBS中的遗漏与重复", "goal": "检查WBS中的遗漏与重复", "source": "Lecture 3 · PDF第27–40页", "body": "<p>院方已经批准接待区需要完成的工作。项目经理把这些工作分成设备、指路牌、开放准备和项目管理几部分后，还要检查：是否漏了某项工作，是否把同一项工作算了两遍。这就是100%规则要解决的问题。<\/p><section class=\"concept\"><h2><span lang=\"en\">100% Rule<\/span><span>100%规则<\/span><\/h2><p>每一层子项合计覆盖父项的全部范围，同一工作只计一次。100%指范围覆盖，不要求把所有工作换算成百分比或平均分配。<\/p><\/section><p>接待区的批准范围包括项目计划与协调、设备安装、设备测试、指路牌设计、指路牌安装、人员培训和正式交接。下面给出一份待检查的WBS。把它与批准范围逐项对照，找出遗漏、重复和归属不清的工作，再调整分支。<\/p><p>编辑结构时，先检查有没有遗漏或重复，再检查父子关系是否合理。例如设备测试应与设备交付边界一致；如果单独设综合测试工作包，需要在其他分支中明确排除相同测试。<\/p>", "questions": [{"id": "wbs-coverage-q1", "prompt": "批准范围含设备、指路牌和人员培训，当前WBS只包含前两项。最直接违反哪项要求？", "options": ["工作包必须处在相同层级", "每个分支必须占相同预算", "子项应覆盖父项全部范围"], "correct": 2, "feedback": ["不同分支可以有不同分解深度。", "100%规则不要求平均分配预算。", "人员培训属于批准范围，遗漏它就没有完整覆盖。"], "ref": "r-wbs-coverage", "contextLesson": "wbs-coverage", "fingerprint": "1814ab71630b55cf", "legacyFingerprint": "e813f1b3c33d02ab"}, {"id": "wbs-coverage-q2", "prompt": "设备组与标牌组都需要参加同一次联合测试，各自WBS目前都列出测试的全部范围和费用。怎样调整更清楚？", "options": ["保留两份完整测试，验收时合成一份记录", "单列联合测试并明确各方执行职责，其他分支排除同一范围", "两边各保留一半测试名称，省去边界说明"], "correct": 1, "feedback": ["最终只验收一次并不能修复预算和范围的重复。", "工作只计一次，参与者可以有多方，范围归属与责任分配各自说明。", "没有边界，仍无法判断哪部分由谁完成、是否重叠。"], "ref": "r-wbs-coverage", "contextLesson": "wbs-coverage", "fingerprint": "94eedf8e42adc67f", "legacyFingerprint": "7d4a451be723b9bb"}], "refs": ["r-wbs-coverage"], "applications": [], "lab": "wbs", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.2", "order": 3, "priorLesson": "wbs-structure", "terms": [["100% Rule", "100%规则", "每一层子项合计覆盖父项的全部范围，同一工作只计一次。100%指范围覆盖，不要求把所有工作换算成百分比或平均分配。"]], "material": {"context": "院方已经批准接待区需要完成的工作。项目经理把这些工作分成设备、指路牌、开放准备和项目管理几部分后，还要检查：是否漏了某项工作，是否把同一项工作算了两遍。这就是100%规则要解决的问题。", "terms": [["100% Rule", "100%规则", "每一层子项合计覆盖父项的全部范围，同一工作只计一次。100%指范围覆盖，不要求把所有工作换算成百分比或平均分配。"]], "tables": []}}, {"id": "wbs-package", "topic": "4.1", "title": "工作包与WBS词典", "goal": "工作包与WBS词典", "source": "Lecture 3 · PDF第25–26、29–30页", "body": "<p>“指路牌”这个节点还不能让采购人员直接执行。采购人员需要知道安装位置、数量、语言、尺寸，以及谁确认最后的成果。WBS词典补充这些细节。<\/p><section class=\"concept\"><h2><span lang=\"en\">Work Package<\/span><span>工作包<\/span><\/h2><p>WBS最低层能够分派、估算和控制的工作单元。一个工作包需要有清楚的成果和边界，例如交出六块按批准图样制作并安装好的指路牌。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">WBS Dictionary<\/span><span>WBS词典<\/span><\/h2><p>对WBS中各工作包的详细说明。词典把树图里放不下的范围、责任、资源、估算和验收要求写清，使执行者和接受者按同一理解工作。下面是一份词典条目的例子。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>词典字段<\/th><th>1.3.2 指路牌制作与安装<\/th><\/tr><\/thead><tbody><tr><td>范围与成果<\/td><td>按已确认图样制作并安装6块双语指路牌<\/td><\/tr><tr><td>包含与排除<\/td><td>包含制作、固定和现场核对；图样设计由1.3.1负责<\/td><\/tr><tr><td>责任与资源<\/td><td>现场负责人协调；制作商和安装人员执行<\/td><\/tr><tr><td>估算与依赖<\/td><td>预计2天；须先取得确认图样和可安装的墙面<\/td><\/tr><tr><td>验收条件<\/td><td>6处位置、两种语言、箭头方向与图样一致，固定情况通过检查<\/td><\/tr><tr><td>记录<\/td><td>保存图样版本、检查表、照片与接受记录<\/td><\/tr><\/tbody><\/table><\/div><p>分解到能明确估算、分派和验收的程度即可。继续拆成“拿起工具”“走到墙边”不会提高项目控制能力，反而增加维护负担。只有一个子项、内容与父项相同的空层，也不提供新的信息。<\/p>", "questions": [{"id": "wbs-package-q1", "prompt": "工作包写“制作并安装6块双语指路牌，2天，预算6000元”，但未写位置、接受人及合格标准。下一步最有帮助的是？", "options": ["补充更细的逐小时动作清单", "补充安装地点、责任和验收条件，并确认图样版本", "将预算分配到两天后即可发包"], "correct": 1, "feedback": ["细化动作不能替代成果边界和接受标准。", "执行与验收需要共同知道交什么、交给谁、按哪版要求检查。", "时间分布预算不说明成果是否符合要求。"], "ref": "r-wbs-package", "contextLesson": "wbs-package", "fingerprint": "8c2d277fecc8ad6a", "legacyFingerprint": "37f541e331002e96"}, {"id": "wbs-package-q2", "prompt": "安装工作包已能估算、分派和验收，但采购与现场安装的负责人、开始条件不同。是否进一步拆活动，应依据什么？", "options": ["WBS其他分支用了几层，本分支必须同深度", "拆开是否有助安排人员、依赖与进度控制", "按每项工具操作再分一层，保证没有任何重复动作"], "correct": 1, "feedback": ["不同分支复杂程度不同，无须保持相同深度。", "需要分别排程的执行步骤可以拆成活动，管理需要决定细度。", "过细的动作记录增加维护量，并不一定改善项目控制。"], "ref": "r-wbs-package", "contextLesson": "wbs-package", "fingerprint": "c87f957b06c49cc3", "legacyFingerprint": "e67c730ba043256e"}], "refs": ["r-wbs-package"], "applications": [{"id": "a-wbs-package", "kind": "编写工作包词典", "prompt": "为“可用的取号设备”写一份简短词典。已知采购2台设备，需要安装、配置、测试，并培训接待人员；培训单独设包。", "answer": "写明2台设备及位置，包含采购、安装、配置和设备测试，排除人员培训；指定设备负责人，写明电源与网络条件、预算和工期依据；验收覆盖取号、叫号、性能及资料交付。培训虽不在该包内，仍须出现在项目其他分支。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.2", "order": 4, "priorLesson": "wbs-coverage", "terms": [["Work Package", "工作包", "WBS最低层能够分派、估算和控制的工作单元。一个工作包需要有清楚的成果和边界，例如交出六块按批准图样制作并安装好的指路牌。"], ["WBS Dictionary", "WBS词典", "对WBS中各工作包的详细说明。词典把树图里放不下的范围、责任、资源、估算和验收要求写清，使执行者和接受者按同一理解工作。下面是一份词典条目的例子。"]], "material": {"context": "“指路牌”这个节点还不能让采购人员直接执行。采购人员需要知道安装位置、数量、语言、尺寸，以及谁确认最后的成果。WBS词典补充这些细节。", "terms": [["Work Package", "工作包", "WBS最低层能够分派、估算和控制的工作单元。一个工作包需要有清楚的成果和边界，例如交出六块按批准图样制作并安装好的指路牌。"], ["WBS Dictionary", "WBS词典", "对WBS中各工作包的详细说明。词典把树图里放不下的范围、责任、资源、估算和验收要求写清，使执行者和接受者按同一理解工作。下面是一份词典条目的例子。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>词典字段<\/th><th>1.3.2 指路牌制作与安装<\/th><\/tr><\/thead><tbody><tr><td>范围与成果<\/td><td>按已确认图样制作并安装6块双语指路牌<\/td><\/tr><tr><td>包含与排除<\/td><td>包含制作、固定和现场核对；图样设计由1.3.1负责<\/td><\/tr><tr><td>责任与资源<\/td><td>现场负责人协调；制作商和安装人员执行<\/td><\/tr><tr><td>估算与依赖<\/td><td>预计2天；须先取得确认图样和可安装的墙面<\/td><\/tr><tr><td>验收条件<\/td><td>6处位置、两种语言、箭头方向与图样一致，固定情况通过检查<\/td><\/tr><tr><td>记录<\/td><td>保存图样版本、检查表、照片与接受记录<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "wbs-activities", "topic": "4.1", "title": "从工作包整理活动表", "goal": "从工作包整理活动表", "source": "Lecture 3 · 工作包；Lecture 4 · 活动网络", "body": "<p>现在已有“指路牌图样”和“已安装指路牌”两个工作包。安排进度时，项目经理进一步确定人员需要执行的具体工作，估计工期，再整理依赖关系。<\/p><section class=\"concept\"><h2><span lang=\"en\">Activity<\/span><span>活动<\/span><\/h2><p>为完成项目成果而需要执行的具体工作。工作包可以包含一项或多项活动，活动应使用能看出做什么的名称。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>工作包<\/th><th>活动<\/th><th>工期与直接前置<\/th><\/tr><\/thead><tbody><tr><td>指路牌图样<\/td><td>确认指路牌要求；设计指路牌<\/td><td>先确认要求，再设计<\/td><\/tr><tr><td>已安装指路牌<\/td><td>制作并安装指路牌<\/td><td>取得已确认图样后进行<\/td><\/tr><tr><td>已接受的接待区<\/td><td>检查设备和指路牌是否符合要求<\/td><td>设备与指路牌均准备好后进行<\/td><\/tr><\/tbody><\/table><\/div><p>活动信息表记录活动编号、名称、工期和紧前活动。Immediate Predecessor（紧前活动）是某项工作可以开始前必须直接完成的活动。例如，制作指路牌要先取得设计图样，因此“设计指路牌”是它的紧前活动。编号用于在表与图之间对应同一项工作。<\/p><div class=\"worked-example\"><h3>一个工作包如何拆成多项活动<\/h3><p>“可用取号设备”可以包含采购、安装、配置和测试。如果这些工作由不同人员负责、等待条件不同，就有必要分别安排进度；是否拆开取决于管理与排程需要。<\/p><\/div>", "questions": [{"id": "wbs-activities-q1", "prompt": "“可用取号设备”工作包包括采购、安装和测试，各由不同人员执行且有等待条件。活动表怎样整理更合适？", "options": ["分成三个工作包后，才允许记录三项活动", "按工作包保留一行，所有等待只写在备注中", "按需要分成采购、安装、测试，写出各自工期和紧前关系"], "correct": 2, "feedback": ["活动拆分和WBS分解服务的目的不同，不要求一对一。", "合并可能掩盖交接等待与人员安排，不能只因是一个包就只写一行。", "工作包可以由多项可排程活动实现。"], "ref": "r-wbs-activities", "contextLesson": "wbs-activities", "fingerprint": "0ac3b049cb2c7d8f", "legacyFingerprint": "6bab436b607a916b"}, {"id": "wbs-activities-q2", "prompt": "“指路牌图样”和“设计指路牌”在这里分别强调什么？", "options": ["前者是风险，后者是验收", "两者都在说明时间先后", "前者强调成果，后者强调完成成果的活动"], "correct": 2, "feedback": ["它们分别是成果与工作动作。", "两个名称本身没有给出依赖。", "区分成果与活动有助于连接范围和进度。"], "ref": "r-wbs-activities", "contextLesson": "wbs-activities", "fingerprint": "2f97e95f382fcee9", "legacyFingerprint": "2f97e95f382fcee9"}], "refs": ["r-wbs-activities"], "applications": [{"id": "a-wbs-activities", "kind": "编写活动信息表", "prompt": "为设备采购、设备安装、指路牌设计、制作并安装指路牌、整体检查编表。已知设备安装等采购；指路牌安装等设计；整体检查等两项安装。工期自行设定并注明单位。", "answer": "可设A采购3天无紧前，B设备安装2天紧前A，C设计2天无紧前，D制作并安装指路牌2天紧前C，E整体检查1天紧前B和D。核对没有人为加入B→C等额外关系。自定工期应在整份表中保持一致。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.2", "order": 6, "priorLesson": "scope-baseline", "terms": [["Activity", "活动", "为完成项目成果而需要执行的具体工作。工作包可以包含一项或多项活动，活动应使用能看出做什么的名称。"]], "material": {"context": "现在已有“指路牌图样”和“已安装指路牌”两个工作包。安排进度时，项目经理进一步确定人员需要执行的具体工作，估计工期，再整理依赖关系。", "terms": [["Activity", "活动", "为完成项目成果而需要执行的具体工作。工作包可以包含一项或多项活动，活动应使用能看出做什么的名称。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>工作包<\/th><th>活动<\/th><th>工期与直接前置<\/th><\/tr><\/thead><tbody><tr><td>指路牌图样<\/td><td>确认指路牌要求；设计指路牌<\/td><td>先确认要求，再设计<\/td><\/tr><tr><td>已安装指路牌<\/td><td>制作并安装指路牌<\/td><td>取得已确认图样后进行<\/td><\/tr><tr><td>已接受的接待区<\/td><td>检查设备和指路牌是否符合要求<\/td><td>设备与指路牌均准备好后进行<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "responsibility-structure", "topic": "4.2", "title": "组织分工与责任矩阵", "goal": "组织分工与责任矩阵", "source": "Lecture 3 · PDF第41–47页", "body": "<p>接待区项目由院方项目经理协调，设备组完成终端安装，标牌组完成指路牌，院方代表接受交付。WBS说明工作范围，还需要一份资料说明各组织与人员的职责。<\/p><section class=\"concept\"><h2><span lang=\"en\">Organization Breakdown Structure (OBS)<\/span><span>组织分解结构<\/span><\/h2><p>按组织或负责单位形成的层级结构，用于说明谁承担哪些工作和相关预算责任。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Responsibility Assignment Matrix (RAM)<\/span><span>责任分配矩阵<\/span><\/h2><p>将工作项与人员或组织交叉排列，标明各方负责、支持、审批或知会等关系。填写前先定义符号含义。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>工作项<\/th><th>设备组<\/th><th>标牌组<\/th><th>院方代表<\/th><\/tr><\/thead><tbody><tr><td>设备安装<\/td><td>执行<\/td><td>—<\/td><td>接受<\/td><\/tr><tr><td>指路牌安装<\/td><td>—<\/td><td>执行<\/td><td>接受<\/td><\/tr><tr><td>联合检查<\/td><td>支持<\/td><td>支持<\/td><td>主持<\/td><\/tr><\/tbody><\/table><\/div><p>RACI是一种常见RAM图例：Responsible（执行）、Accountable（最终负责）、Consulted（征询意见）、Informed（知会）。采用其他符号也可以，关键是图例清楚、职责无遗漏。本专题的练习采用RACI，并约定每项工作只有一个A，执行工作可以由多名R共同完成。<\/p>", "questions": [{"id": "responsibility-q1", "prompt": "矩阵把同一人在某工作中标为C。尚未提供图例，能否判断他负责批准？", "options": ["能，出现在表里就有批准权", "能，C总是批准", "不能，应先查看这张表的图例"], "correct": 2, "feedback": ["参与并不自动意味着拥有批准权。", "符号含义必须由图例确定。", "RACI中的C是征询意见，其他符号系统又可能不同。"], "ref": "r-responsibility-structure", "contextLesson": "responsibility-structure", "fingerprint": "92cddffded596b0a", "legacyFingerprint": "92cddffded596b0a"}, {"id": "responsibility-q2", "prompt": "责任矩阵采用每行一个A（最终负责）的规则。院方代表与设备负责人同时被写成A，应怎样澄清？", "options": ["把两人均改为C，由执行人员自行决定接受", "把两人均改为R，不再指定最终负责人", "按具体授权选定该项最终负责人，把执行、征询和接受职责另行标明"], "correct": 2, "feedback": ["征询意见不等于最终负责，执行者也未必有权接受。", "R说明执行，不能替代最终负责的决定权。", "A、R、C及正式接受可能由不同角色承担，应区分责任。"], "ref": "r-responsibility-structure", "contextLesson": "responsibility-structure", "fingerprint": "c153a520cad6ce72", "legacyFingerprint": "d0d3ceaea1849c3e"}], "refs": ["r-responsibility-structure"], "applications": [], "lab": "ram", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.3", "order": 28, "priorLesson": null, "terms": [["Organization Breakdown Structure (OBS)", "组织分解结构", "按组织或负责单位形成的层级结构，用于说明谁承担哪些工作和相关预算责任。"], ["Responsibility Assignment Matrix (RAM)", "责任分配矩阵", "将工作项与人员或组织交叉排列，标明各方负责、支持、审批或知会等关系。填写前先定义符号含义。"]], "material": {"context": "接待区项目由院方项目经理协调，设备组完成终端安装，标牌组完成指路牌，院方代表接受交付。WBS说明工作范围，还需要一份资料说明各组织与人员的职责。", "terms": [["Organization Breakdown Structure (OBS)", "组织分解结构", "按组织或负责单位形成的层级结构，用于说明谁承担哪些工作和相关预算责任。"], ["Responsibility Assignment Matrix (RAM)", "责任分配矩阵", "将工作项与人员或组织交叉排列，标明各方负责、支持、审批或知会等关系。填写前先定义符号含义。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>工作项<\/th><th>设备组<\/th><th>标牌组<\/th><th>院方代表<\/th><\/tr><\/thead><tbody><tr><td>设备安装<\/td><td>执行<\/td><td>—<\/td><td>接受<\/td><\/tr><tr><td>指路牌安装<\/td><td>—<\/td><td>执行<\/td><td>接受<\/td><\/tr><tr><td>联合检查<\/td><td>支持<\/td><td>支持<\/td><td>主持<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "responsibility-cost", "topic": "4.2", "title": "工作、负责部门与成本账户", "goal": "工作、负责部门与成本账户", "source": "Lecture 3 · PDF第41–47页", "body": "<p>设备组既参与取号终端，又参与叫号屏安装。如果只把费用记成“设备组支出”，负责人就难以判断哪部分工作超出预算。工作范围与负责组织需要同时记录。<\/p><section class=\"concept\"><h2><span lang=\"en\">Cost Account / Control Account<\/span><span>成本账户／控制账户<\/span><\/h2><p>将特定工作范围与负责组织的成本管理联系起来。控制账户还用于综合管理范围、预算、进度和绩效，下面先练习明确成本归属。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>WBS工作<\/th><th>OBS责任单位<\/th><th>预算（元）<\/th><th>实际（元）<\/th><\/tr><\/thead><tbody><tr><td>取号终端<\/td><td>设备组<\/td><td>12000<\/td><td>12600<\/td><\/tr><tr><td>叫号屏<\/td><td>设备组<\/td><td>8000<\/td><td>7400<\/td><\/tr><tr><td>指路牌<\/td><td>标牌组<\/td><td>6000<\/td><td>6500<\/td><\/tr><\/tbody><\/table><\/div><p>设备组预算和实际均为20,000元，但取号终端超出600元、叫号屏少花600元。组织汇总与工作明细同时保留，才不会用总额相抵掩盖具体偏差。这里的费用差额按“实际−预算”计算，正数表示多花；它不是后续挣值管理的成本偏差公式。<\/p>", "questions": [{"id": "responsibility-cost-q1", "prompt": "设备组两项工作合计未超预算，是否说明每个工作包都没有偏差？", "options": ["只需检查人数是否变化", "否，可能有一项超支而另一项少花", "是，汇总相等即可"], "correct": 1, "feedback": ["人数不是判断每项费用偏差的充分条件。", "需要查看每个工作包的预算与实际。", "汇总会抵消方向相反的差额。"], "ref": "r-responsibility-cost", "contextLesson": "responsibility-cost", "fingerprint": "326f2a0bfcfd562c", "legacyFingerprint": "326f2a0bfcfd562c"}, {"id": "responsibility-cost-q2", "prompt": "共享安装费6000元，终端包和叫号屏包约定按60%与40%分摊，怎样记录？", "options": ["终端3600元，叫号屏2400元，合计6000元", "每包各6000元，分别完整体现责任", "每包各3000元，共享费用都应平均分配"], "correct": 0, "feedback": ["按约定依据分摊，合计仍等于原费用。", "分别全额计入会把6000元重复算成12000元。", "平均分配与已约定的60/40依据不同。"], "ref": "r-responsibility-cost", "contextLesson": "responsibility-cost", "fingerprint": "bc66f86ed187fe59", "legacyFingerprint": "bc66f86ed187fe59"}], "refs": ["r-responsibility-cost"], "applications": [], "lab": null, "drill": {"id": "responsibility-cost-d", "prompt": "根据本页表格填写差额，单位为元，差额采用实际−预算。", "fields": [{"key": "terminal", "label": "取号终端差额", "type": "number", "answer": 600, "tolerance": 0.01}, {"key": "screen", "label": "叫号屏差额", "type": "number", "answer": -600, "tolerance": 0.01}, {"key": "all", "label": "项目总差额", "type": "number", "answer": 500, "tolerance": 0.01}], "ex
