ble><thead><tr><th>发展情况<\/th><th>可观察的证据<\/th><\/tr><\/thead><tbody><tr><td>Low Maturity 低成熟度<\/td><td>各部门术语和记录不同，问题主要靠个人临时处理<\/td><\/tr><tr><td>Moderate Maturity 中等成熟度<\/td><td>共同流程、角色、培训和模板得到使用，管理层提供支持<\/td><\/tr><tr><td>High Maturity 高成熟度<\/td><td>跨项目比较结果，调查偏差原因，将经验落实为新流程并检查效果<\/td><\/tr><\/tbody><\/table><\/div><p>成熟度不由购买了多少软件、写了多少制度决定。例如新增风险登记表后，应继续检查负责人是否真的按日期复查，历史问题是否减少。改进要有实际使用和效果的证据。<\/p>", "questions": [{"id": "project-maturity-q1", "prompt": "医院想判断统一资源日历是否改善管理，哪项证据最合适？", "options": ["管理层批准购买日历软件", "跨项目冲突被及时发现并按共同规则处理", "每个部门都收到一份空白模板"], "correct": 1, "feedback": ["批准采购只是准备条件。", "实际采用及效果比配置工具更能证明改进。", "收到模板不等于使用。"], "ref": "r-project-maturity", "contextLesson": "project-maturity", "fingerprint": "595cc9a3e5efdc9a", "legacyFingerprint": null}, {"id": "project-maturity-q2", "prompt": "项目靠资深人员临时协调而按期交付，哪些补充证据更能支持组织成熟度较高？", "options": ["同一名资深人员愿意在下个项目继续加班", "方法可被其他团队重复使用，角色、培训和复盘已有组织支持", "本次最终没有超支"], "correct": 1, "feedback": ["个人继续补救不等于能力已组织化。", "成熟度关注组织可重复能力。", "成本结果也是单个项目表现，不能单独证明成熟度。"], "ref": "r-project-maturity", "contextLesson": "project-maturity", "fingerprint": "08b5435dcc95e6c6", "legacyFingerprint": null}], "refs": ["r-project-maturity"], "applications": [{"id": "a-project-maturity", "kind": "改进方案", "prompt": "团队频繁遗漏设备交接资料。提出一项制度改进，并说明一个月后怎样判断它是否有效。", "answer": "在工作包和验收表中明确资料清单、负责人及接受人，交接前逐项检查。一个月后抽查各次交接的完整率、补交次数和接受记录，调查仍有遗漏的原因，再调整流程。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "1.2", "order": 82, "priorLesson": "project-knowledge", "terms": [["Project Management Maturity", "项目管理成熟度", "组织把个人经验逐步发展为共同做法、组织支持和持续改进的程度。判断时需要观察多人、多项目能否重复使用有效方法。"]], "material": {"context": "医院上一项改造按期完成，主要依靠一名经验丰富的工程师临时协调。下一项工程换了负责人，团队却找不到预算依据和交接记录。一次成功说明这次结果不错，不能单独证明组织已经能稳定地管理项目。", "terms": [["Project Management Maturity", "项目管理成熟度", "组织把个人经验逐步发展为共同做法、组织支持和持续改进的程度。判断时需要观察多人、多项目能否重复使用有效方法。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>发展情况<\/th><th>可观察的证据<\/th><\/tr><\/thead><tbody><tr><td>Low Maturity 低成熟度<\/td><td>各部门术语和记录不同，问题主要靠个人临时处理<\/td><\/tr><tr><td>Moderate Maturity 中等成熟度<\/td><td>共同流程、角色、培训和模板得到使用，管理层提供支持<\/td><\/tr><tr><td>High Maturity 高成熟度<\/td><td>跨项目比较结果，调查偏差原因，将经验落实为新流程并检查效果<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "project-methods", "topic": "1.2", "title": "按项目条件选择管理方法", "goal": "按项目条件选择管理方法", "source": "Lecture 2 · PDF第9–18页", "body": "<p>新医院建设中，主体结构需要按已确认图纸和审批顺序施工；预约界面则可以让工作人员试用，再根据反馈修改。同一项建设计划中的不同工作，可以采用不同的规划和反馈方式。<\/p><section class=\"concept\"><h2><span lang=\"en\">Methodology<\/span><span>方法体系<\/span><\/h2><p>指导项目工作的一套实践、技术、步骤和规则。使用者据此安排怎样规划、执行、检查和交付。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Framework<\/span><span>框架<\/span><\/h2><p>组织工作的基本结构，为具体方法留下选择与调整的空间。实际使用中，同一套做法可能被称为方法或框架；判断是否适用，需要看它有哪些规则、解决什么问题。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Tailoring<\/span><span>适配<\/span><\/h2><p>根据当前项目的需求、技术、资源与风险选择和调整管理做法。例如，主体结构按批准图纸和阶段推进，预约界面分次试用，两者通过明确的接口和验收条件衔接。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Greenfield / Brownfield<\/span><span>新建项目／既有设施改造项目<\/span><\/h2><p>Greenfield从新场地或空白条件开始；Brownfield在已有设施上改造或扩建。例如不停诊改造旧接待区，还要安排隔离、临时通道、接口检查和服务切换。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>方法或框架<\/th><th>主要关注什么<\/th><\/tr><\/thead><tbody><tr><td>Waterfall 瀑布式<\/td><td>按阶段推进，前期要求较明确，阶段间有交接<\/td><\/tr><tr><td>Agile / Scrum 敏捷／Scrum<\/td><td>分次交付，频繁反馈；Scrum规定角色、事件和工件<\/td><\/tr><tr><td>Kanban 看板<\/td><td>显示工作流，限制在制工作，观察流动情况<\/td><\/tr><tr><td>Lean 精益<\/td><td>减少浪费，改善价值交付过程<\/td><\/tr><tr><td>Six Sigma 六西格玛<\/td><td>依据数据减少过程变异与缺陷<\/td><\/tr><tr><td>CCPM 关键链项目管理<\/td><td>安排资源约束下的工作，用缓冲管理不确定性<\/td><\/tr><tr><td>PRINCE2 受控环境下的项目管理<\/td><td>按明确责任、阶段和持续商业依据治理项目<\/td><\/tr><\/tbody><\/table><\/div><p>项目还可以按交付产品分类，例如土建、软件、采购、行政改进、活动或研发。分类帮助识别管理条件，并不意味着某种方法只准用于一种行业。界面需求持续变化且可以分次试用时，迭代较有帮助；必须保持连续服务的改造，还需要明确的切换与审批安排。<\/p>", "questions": [{"id": "project-methods-q1", "prompt": "旧医院不停诊改造取号区，最需要补充哪组条件？", "options": ["持续服务安排、现有接口、施工隔离和切换条件", "仅记录新设备数量", "按新场地项目处理，原有设施不影响计划"], "correct": 0, "feedback": ["这些条件直接来自既有设施改造的特点。", "设备数量不能覆盖旧设施与持续服务的限制。", "忽略原设施会遗漏接口与运营影响。"], "ref": "r-project-methods", "contextLesson": "project-methods", "fingerprint": "0fc2f2bf0730991c", "legacyFingerprint": null}, {"id": "project-methods-q2", "prompt": "主体结构已批准，预约界面每周收到新反馈。哪种安排最符合两类工作条件？", "options": ["所有工作在第一次规划后固定，反馈留到交付结束再看", "结构按批准阶段推进，界面分次试用并明确接口与验收", "所有工作每周重新决定范围，结构审批不设固定节点"], "correct": 1, "feedback": ["变化中的界面需求可能需要更早反馈。", "把方法与需求稳定性和技术条件相对应。", "结构仍受技术和审批条件约束。"], "ref": "r-project-methods", "contextLesson": "project-methods", "fingerprint": "79214d577a1679a5", "legacyFingerprint": null}], "refs": ["r-project-methods"], "applications": [{"id": "a-project-methods", "kind": "方法选择论证", "prompt": "医院预约界面每周获得患者和接待人员反馈，但与收费系统的接口必须一次切换。提出管理安排，写明两个选择依据和一个必须控制的条件。", "answer": "界面可分次试用，需求又在变化，适合迭代；收费接口需要统一切换，提前规定接口测试、批准时间和回退办法。团队需获得持续反馈，迭代不能绕过接口切换的控制条件。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "1.2", "order": 83, "priorLesson": "project-maturity", "terms": [["Methodology", "方法体系", "指导项目工作的一套实践、技术、步骤和规则。使用者据此安排怎样规划、执行、检查和交付。"], ["Framework", "框架", "组织工作的基本结构，为具体方法留下选择与调整的空间。实际使用中，同一套做法可能被称为方法或框架；判断是否适用，需要看它有哪些规则、解决什么问题。"], ["Tailoring", "适配", "根据当前项目的需求、技术、资源与风险选择和调整管理做法。例如，主体结构按批准图纸和阶段推进，预约界面分次试用，两者通过明确的接口和验收条件衔接。"], ["Greenfield / Brownfield", "新建项目／既有设施改造项目", "Greenfield从新场地或空白条件开始；Brownfield在已有设施上改造或扩建。例如不停诊改造旧接待区，还要安排隔离、临时通道、接口检查和服务切换。"]], "material": {"context": "新医院建设中，主体结构需要按已确认图纸和审批顺序施工；预约界面则可以让工作人员试用，再根据反馈修改。同一项建设计划中的不同工作，可以采用不同的规划和反馈方式。", "terms": [["Methodology", "方法体系", "指导项目工作的一套实践、技术、步骤和规则。使用者据此安排怎样规划、执行、检查和交付。"], ["Framework", "框架", "组织工作的基本结构，为具体方法留下选择与调整的空间。实际使用中，同一套做法可能被称为方法或框架；判断是否适用，需要看它有哪些规则、解决什么问题。"], ["Tailoring", "适配", "根据当前项目的需求、技术、资源与风险选择和调整管理做法。例如，主体结构按批准图纸和阶段推进，预约界面分次试用，两者通过明确的接口和验收条件衔接。"], ["Greenfield / Brownfield", "新建项目／既有设施改造项目", "Greenfield从新场地或空白条件开始；Brownfield在已有设施上改造或扩建。例如不停诊改造旧接待区，还要安排隔离、临时通道、接口检查和服务切换。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>方法或框架<\/th><th>主要关注什么<\/th><\/tr><\/thead><tbody><tr><td>Waterfall 瀑布式<\/td><td>按阶段推进，前期要求较明确，阶段间有交接<\/td><\/tr><tr><td>Agile / Scrum 敏捷／Scrum<\/td><td>分次交付，频繁反馈；Scrum规定角色、事件和工件<\/td><\/tr><tr><td>Kanban 看板<\/td><td>显示工作流，限制在制工作，观察流动情况<\/td><\/tr><tr><td>Lean 精益<\/td><td>减少浪费，改善价值交付过程<\/td><\/tr><tr><td>Six Sigma 六西格玛<\/td><td>依据数据减少过程变异与缺陷<\/td><\/tr><tr><td>CCPM 关键链项目管理<\/td><td>安排资源约束下的工作，用缓冲管理不确定性<\/td><\/tr><tr><td>PRINCE2 受控环境下的项目管理<\/td><td>按明确责任、阶段和持续商业依据治理项目<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "strategy-tows", "topic": "2.1", "title": "用TOWS把医院目标转成项目方案", "goal": "用TOWS把医院目标转成项目方案", "source": "Lecture 2 · PDF第19–21页", "body": "<p>医院希望改善患者到院后的接待服务。院内已有熟悉设备接口的技术团队，缺少多语言服务经验；外部有社区翻译机构愿意合作，同时患者数量增长可能使旧流程不堪负荷。院方需要利用这些条件提出具体项目。<\/p><section class=\"concept\"><h2><span lang=\"en\">Strategic Alignment<\/span><span>战略对齐<\/span><\/h2><p>说明项目怎样支持组织目标。医院若要改善患者到院体验，就应解释新项目会改变哪段服务、怎样判断改善，而不能只说要购买新设备。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">TOWS Matrix<\/span><span>TOWS矩阵<\/span><\/h2><p>将内部的Strengths（优势）、Weaknesses（弱点）与外部的Opportunities（机会）、Threats（威胁）交叉，提出具体行动。内部因素来自组织自身；外部因素来自组织所处的环境。下面四种组合使用同一组医院条件。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>组合<\/th><th>怎样形成行动<\/th><th>医院例子<\/th><\/tr><\/thead><tbody><tr><td>SO 优势＋机会<\/td><td>利用已有优势把握机会<\/td><td>技术团队与社区机构合作，试点多语言取号界面<\/td><\/tr><tr><td>ST 优势＋威胁<\/td><td>运用优势减轻外部威胁<\/td><td>技术团队改进叫号与分流，应对患者增长<\/td><\/tr><tr><td>WO 弱点＋机会<\/td><td>借外部机会补足内部弱点<\/td><td>邀请社区机构参与翻译与使用测试<\/td><\/tr><tr><td>WT 弱点＋威胁<\/td><td>减少弱点造成的暴露，并应对威胁<\/td><td>先改善薄弱的接待流程，分阶段开放新窗口<\/td><\/tr><\/tbody><\/table><\/div><p>分类要根据因素所在的位置。院内缺少翻译能力是内部弱点；外部出现合作机构是机会。把四类因素列完以后，还要说明谁采取什么行动，以及行动为什么支持医院目标。战略管理包括制定、实施与评价；项目开始后也需复查原有依据是否仍成立。<\/p>", "questions": [{"id": "strategy-tows-q1", "prompt": "医院缺少多语言经验，社区机构愿意提供翻译和试用人员。邀请他们参与系统试点属于哪类策略？", "options": ["SO，使用现有内部优势", "WO，借外部机会补足内部弱点", "ST，使用优势应对威胁"], "correct": 1, "feedback": ["题目强调的是医院缺少能力，而非已有优势。", "内部弱点与外部机会形成WO策略。", "合作机会没有被描述为外部威胁。"], "ref": "r-strategy-tows", "contextLesson": "strategy-tows", "fingerprint": "7d711332f94e188a", "legacyFingerprint": null}, {"id": "strategy-tows-q2", "prompt": "医院技术团队已有接口能力；患者增加可能导致接待拥堵。利用技术团队改进分流系统，属于哪类组合？", "options": ["ST：优势与威胁", "WO：弱点与机会", "SO：优势与机会"], "correct": 0, "feedback": ["内部技术优势用于应对外部接待压力，属于ST。", "题目没有把技术能力描述为内部弱点。", "本例患者增长被描述为容量威胁，不是合作机会。"], "ref": "r-strategy-tows", "contextLesson": "strategy-tows", "fingerprint": "caf5519c9c6a5920", "legacyFingerprint": null}], "refs": ["r-strategy-tows"], "applications": [{"id": "a-strategy-tows", "kind": "策略设计", "prompt": "医院技术能力强，但患者对取号设备不熟悉。社区组织愿意提供志愿者，门诊量又将增加。各写一个SO与WO方案，并标明使用了哪两个条件。", "answer": "SO：技术团队与社区志愿者共同试点更易用的界面，使用技术优势和合作机会。WO：借志愿者支持补足患者使用指导，使用推广与熟悉度不足这一弱点及合作机会。还应说明交付结果和检验效果的方法。"}], "lab": "tows", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "2.1", "order": 84, "priorLesson": null, "terms": [["Strategic Alignment", "战略对齐", "说明项目怎样支持组织目标。医院若要改善患者到院体验，就应解释新项目会改变哪段服务、怎样判断改善，而不能只说要购买新设备。"], ["TOWS Matrix", "TOWS矩阵", "将内部的Strengths（优势）、Weaknesses（弱点）与外部的Opportunities（机会）、Threats（威胁）交叉，提出具体行动。内部因素来自组织自身；外部因素来自组织所处的环境。下面四种组合使用同一组医院条件。"]], "material": {"context": "医院希望改善患者到院后的接待服务。院内已有熟悉设备接口的技术团队，缺少多语言服务经验；外部有社区翻译机构愿意合作，同时患者数量增长可能使旧流程不堪负荷。院方需要利用这些条件提出具体项目。", "terms": [["Strategic Alignment", "战略对齐", "说明项目怎样支持组织目标。医院若要改善患者到院体验，就应解释新项目会改变哪段服务、怎样判断改善，而不能只说要购买新设备。"], ["TOWS Matrix", "TOWS矩阵", "将内部的Strengths（优势）、Weaknesses（弱点）与外部的Opportunities（机会）、Threats（威胁）交叉，提出具体行动。内部因素来自组织自身；外部因素来自组织所处的环境。下面四种组合使用同一组医院条件。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>组合<\/th><th>怎样形成行动<\/th><th>医院例子<\/th><\/tr><\/thead><tbody><tr><td>SO 优势＋机会<\/td><td>利用已有优势把握机会<\/td><td>技术团队与社区机构合作，试点多语言取号界面<\/td><\/tr><tr><td>ST 优势＋威胁<\/td><td>运用优势减轻外部威胁<\/td><td>技术团队改进叫号与分流，应对患者增长<\/td><\/tr><tr><td>WO 弱点＋机会<\/td><td>借外部机会补足内部弱点<\/td><td>邀请社区机构参与翻译与使用测试<\/td><\/tr><tr><td>WT 弱点＋威胁<\/td><td>减少弱点造成的暴露，并应对威胁<\/td><td>先改善薄弱的接待流程，分阶段开放新窗口<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "selection-screen", "topic": "2.1", "title": "项目筛选先确定门槛和比较标准", "goal": "项目筛选先确定门槛和比较标准", "source": "Lecture 7 · PDF第3–7页", "body": "<p>医院只能在今年启动一部分改进项目，候选方案包括更新取号设备、开发预约功能和改造药房窗口。院方先明确资金、必须满足的要求和战略目标，再比较各方案。否则，评分很高的项目也可能根本不具备实施条件。<\/p><section class=\"concept\"><h2><span lang=\"en\">Screening Model<\/span><span>项目筛选模型<\/span><\/h2><p>用一套明确的标准评价候选项目，帮助决定哪些方案值得继续研究。标准包括必须满足的条件，也可以包括允许相互权衡的表现。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Checklist<\/span><span>清单模型<\/span><\/h2><p>把需要检查的条件逐项列出，记录各候选是否满足以及判断依据。例如，是否有资金来源、能否维持接待服务、是否具备接口条件。普通清单便于发现缺项，但通过项目的数量没有表达各条件的重要程度。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>比较方面<\/th><th>需要调查的内容<\/th><\/tr><\/thead><tbody><tr><td>Risk 风险<\/td><td>技术、财务、安全、质量和法律方面的不确定性<\/td><\/tr><tr><td>Commercial 商业因素<\/td><td>预期收益、回收时间、初始支出、未来业务与市场机会<\/td><\/tr><tr><td>Internal Operating 内部运营<\/td><td>培训、人员结构、工作环境、服务流程的变化<\/td><\/tr><tr><td>Strategic Fit等其他因素<\/td><td>与组织目标的关系、形象、专利或其他约束<\/td><\/tr><\/tbody><\/table><\/div><p>先区分必须满足的门槛和允许权衡的评分标准。例如“预算不得超过80万元”可以是筛选门槛；通过门槛后，再比较患者体验和实施难度。未经授权，不能用其他高分补偿一个必须满足而未满足的条件。<\/p><div class=\"table-scroll\"><table><thead><tr><th>好模型的要求<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>Realism 现实性<\/td><td>反映实际目标和约束<\/td><\/tr><tr><td>Capability 能力<\/td><td>能比较需要考虑的不同因素<\/td><\/tr><tr><td>Flexibility 灵活性<\/td><td>条件变化时可以调整<\/td><\/tr><tr><td>Ease of Use 易用性<\/td><td>参与者能够理解和使用<\/td><\/tr><tr><td>Cost Effectiveness 成本效益<\/td><td>分析投入与决策价值相称<\/td><\/tr><tr><td>Comparability 可比性<\/td><td>不同项目使用一致的标准与尺度<\/td><\/tr><\/tbody><\/table><\/div>", "questions": [{"id": "selection-screen-q1", "prompt": "预算上限80万元是必须满足的门槛。甲评分最高、需90万元；乙评分略低、需75万元。按当前规则怎样处理？", "options": ["甲尚不满足门槛，乙可继续比较；调整上限需另作决定", "把甲的成本评分扣一分即可视为已满足预算", "甲评分最高，所以补偿10万元超支"], "correct": 0, "feedback": ["先按门槛确定可行候选，再比较偏好。", "扣分没有减少真实支出。", "高分不能自动修改硬性资金约束。"], "ref": "r-selection-screen", "contextLesson": "selection-screen", "fingerprint": "f9c65fca2289b341", "legacyFingerprint": null}, {"id": "selection-screen-q2", "prompt": "两个方案都通过8项清单条件，但“服务连续性”比其他条件更重要。怎样进一步处理？", "options": ["先明确它是必须满足的门槛，还是需要更大权重的比较项", "继续只数通过项数量，项目成本作为唯一平局处理办法", "每个条件都记1分，较重要条件也只在文字中注明"], "correct": 0, "feedback": ["必须满足与允许权衡需要区别，并落实到规则。", "计数没有表达该条件的重要性。", "只写文字而计算仍等权，结论可能与意图不一致。"], "ref": "r-selection-screen", "contextLesson": "selection-screen", "fingerprint": "434b6bf5aad17188", "legacyFingerprint": null}], "refs": ["r-selection-screen"], "applications": [{"id": "a-selection-screen", "kind": "建立筛选表", "prompt": "医院今年最多投入80万元，要求不中断既有接待服务，同时希望改善患者体验。写出两个门槛和两个适合比较的评分标准。", "answer": "门槛可用投入不超过80万元、具有可接受的持续服务方案；评分标准可用患者体验改善程度与实施准备程度。需说明如何检查和评分，避免门槛与评分混在一起。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "2.1", "order": 85, "priorLesson": "strategy-tows", "terms": [["Screening Model", "项目筛选模型", "用一套明确的标准评价候选项目，帮助决定哪些方案值得继续研究。标准包括必须满足的条件，也可以包括允许相互权衡的表现。"], ["Checklist", "清单模型", "把需要检查的条件逐项列出，记录各候选是否满足以及判断依据。例如，是否有资金来源、能否维持接待服务、是否具备接口条件。普通清单便于发现缺项，但通过项目的数量没有表达各条件的重要程度。"]], "material": {"context": "医院只能在今年启动一部分改进项目，候选方案包括更新取号设备、开发预约功能和改造药房窗口。院方先明确资金、必须满足的要求和战略目标，再比较各方案。否则，评分很高的项目也可能根本不具备实施条件。", "terms": [["Screening Model", "项目筛选模型", "用一套明确的标准评价候选项目，帮助决定哪些方案值得继续研究。标准包括必须满足的条件，也可以包括允许相互权衡的表现。"], ["Checklist", "清单模型", "把需要检查的条件逐项列出，记录各候选是否满足以及判断依据。例如，是否有资金来源、能否维持接待服务、是否具备接口条件。普通清单便于发现缺项，但通过项目的数量没有表达各条件的重要程度。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>比较方面<\/th><th>需要调查的内容<\/th><\/tr><\/thead><tbody><tr><td>Risk 风险<\/td><td>技术、财务、安全、质量和法律方面的不确定性<\/td><\/tr><tr><td>Commercial 商业因素<\/td><td>预期收益、回收时间、初始支出、未来业务与市场机会<\/td><\/tr><tr><td>Internal Operating 内部运营<\/td><td>培训、人员结构、工作环境、服务流程的变化<\/td><\/tr><tr><td>Strategic Fit等其他因素<\/td><td>与组织目标的关系、形象、专利或其他约束<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><thead><tr><th>好模型的要求<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>Realism 现实性<\/td><td>反映实际目标和约束<\/td><\/tr><tr><td>Capability 能力<\/td><td>能比较需要考虑的不同因素<\/td><\/tr><tr><td>Flexibility 灵活性<\/td><td>条件变化时可以调整<\/td><\/tr><tr><td>Ease of Use 易用性<\/td><td>参与者能够理解和使用<\/td><\/tr><tr><td>Cost Effectiveness 成本效益<\/td><td>分析投入与决策价值相称<\/td><\/tr><tr><td>Comparability 可比性<\/td><td>不同项目使用一致的标准与尺度<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "selection-score", "topic": "2.1", "title": "计算加权评分并检查排序是否稳定", "goal": "计算加权评分并检查排序是否稳定", "source": "Lecture 7 · PDF第8–10页", "body": "<p>三项医院改进方案都满足基本门槛，院方决定按患者体验、实施准备和成本适宜程度比较。每项用1至5分评价，分数越高越好；“成本适宜”分数越高表示越符合资金条件，不表示花费越多越好。<\/p><section class=\"concept\"><h2><span lang=\"en\">Weighted Scoring Model<\/span><span>加权评分模型<\/span><\/h2><p>把每项标准的评分乘以重要性权重，再相加。权重表达标准的重要程度，评分表达某个项目在该标准上的表现。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>项目<\/th><th>患者体验（权重5）<\/th><th>实施准备（权重3）<\/th><th>成本适宜（权重2）<\/th><\/tr><\/thead><tbody><tr><td>更新取号设备<\/td><td>5<\/td><td>3<\/td><td>3<\/td><\/tr><tr><td>改造药房窗口<\/td><td>3<\/td><td>5<\/td><td>4<\/td><\/tr><tr><td>开发预约功能<\/td><td>4<\/td><td>2<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div><div class=\"formula\">总分 S＝Σ(wᵢ×sᵢ)；归一化权重＝原权重÷全部权重之和<\/div><div class=\"worked-example\"><h3>更新取号设备的分数<\/h3><p>5×5＋3×3＋2×3＝40。其余两项分别为38和36。若把权重统一除以10，三个分数变成4.0、3.8和3.6，排序不变。<\/p><\/div><section class=\"concept\"><h2><span lang=\"en\">Sensitivity Analysis<\/span><span>敏感性分析<\/span><\/h2><p>改变一个有争议或可能变化的输入，观察结论是否变化。例如提高“实施准备”的权重后，药房方案可能超过取号设备方案。报告排序时应说明使用的权重和变化后的结果。<\/p><\/section><p>加权总分用于按同一套规则比较候选。40分不等于收益40万元，也不能解释为成功概率40%。先统一量表、方向和评分依据，再计算。<\/p>", "questions": [{"id": "selection-score-q1", "prompt": "权重5、3、2改成0.5、0.3、0.2，三个候选评分不变。结果是什么？", "options": ["总分不变，排序不变", "只按分数最高的那项标准排序", "总分缩为原来的十分之一，排序不变"], "correct": 2, "feedback": ["权重数值改变，总分也改变。", "归一化仍包含全部标准。", "所有总分统一乘0.1。"], "ref": "r-selection-score", "contextLesson": "selection-score", "fingerprint": "9fc8880e672c9749", "legacyFingerprint": null}, {"id": "selection-score-q2", "prompt": "三位评价者按1至5分比较成本适宜程度，其中一人把费用越高打成越高分，另外两人相反。合并评分前应怎样做？", "options": ["将三人的分数取平均，以消除相反方向的影响", "统一评分方向，按共同依据重新评价后再汇总", "增加成本标准的权重，使成本因素得到充分体现"], "correct": 1, "feedback": ["平均只处理数值，没有修复同分异义。", "同一分数必须表达同一方向的表现，才能加权比较。", "加大权重会放大有矛盾的输入。"], "ref": "r-selection-score", "contextLesson": "selection-score", "fingerprint": "0becf661b13325bc", "legacyFingerprint": null}], "refs": ["r-selection-score"], "applications": [{"id": "a-selection-score", "kind": "解释排序变化", "prompt": "原权重为5、3、2时，取号设备方案40分，药房方案38分。把实施准备权重从3改为6，其余不变。计算两个新分数，并说明为什么顺序改变。", "answer": "取号设备5×5+6×3+2×3=49；药房5×3+6×5+2×4=53。药房在实施准备上的评分更高，提高这一标准的重要性后，药房超过取号设备。应说明新权重是否符合院方优先目标。"}], "lab": "scoring", "drill": {"id": "selection-score-d", "prompt": "某方案在患者体验、实施准备、成本适宜上的评分为4、2、5；权重为5、3、2。", "fields": [{"key": "score", "label": "原权重总分", "type": "number", "answer": 36, "tolerance": 0.01}, {"key": "normalized", "label": "权重归一化后的总分", "type": "number", "answer": 3.6, "tolerance": 0.01}], "explanation": "5×4+3×2+2×5=36；全部权重除以10后总分为3.6。", "guided": false, "fingerprint": "a8e8658e9a47f743"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "2.1", "order": 86, "priorLesson": "selection-screen", "terms": [["Weighted Scoring Model", "加权评分模型", "把每项标准的评分乘以重要性权重，再相加。权重表达标准的重要程度，评分表达某个项目在该标准上的表现。"], ["Sensitivity Analysis", "敏感性分析", "改变一个有争议或可能变化的输入，观察结论是否变化。例如提高“实施准备”的权重后，药房方案可能超过取号设备方案。报告排序时应说明使用的权重和变化后的结果。"]], "material": {"context": "三项医院改进方案都满足基本门槛，院方决定按患者体验、实施准备和成本适宜程度比较。每项用1至5分评价，分数越高越好；“成本适宜”分数越高表示越符合资金条件，不表示花费越多越好。", "terms": [["Weighted Scoring Model", "加权评分模型", "把每项标准的评分乘以重要性权重，再相加。权重表达标准的重要程度，评分表达某个项目在该标准上的表现。"], ["Sensitivity Analysis", "敏感性分析", "改变一个有争议或可能变化的输入，观察结论是否变化。例如提高“实施准备”的权重后，药房方案可能超过取号设备方案。报告排序时应说明使用的权重和变化后的结果。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>项目<\/th><th>患者体验（权重5）<\/th><th>实施准备（权重3）<\/th><th>成本适宜（权重2）<\/th><\/tr><\/thead><tbody><tr><td>更新取号设备<\/td><td>5<\/td><td>3<\/td><td>3<\/td><\/tr><tr><td>改造药房窗口<\/td><td>3<\/td><td>5<\/td><td>4<\/td><\/tr><tr><td>开发预约功能<\/td><td>4<\/td><td>2<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "selection-ahp", "topic": "2.1", "title": "AHP层级权重怎样逐层相乘", "goal": "AHP层级权重怎样逐层相乘", "source": "Lecture 7 · PDF第11–12页", "body": "<p>院方把项目选择标准分为“服务效果”和“实施条件”。服务效果又包含患者体验与工作人员效率；实施条件包含技术准备与费用。每个子标准的重要性，既取决于它在组内的比例，也取决于整组的重要性。<\/p><section class=\"concept\"><h2><span lang=\"en\">Analytic Hierarchy Process (AHP)<\/span><span>层次分析法<\/span><\/h2><p>将目标、标准和子标准组织成层级，分配权重，评价候选，再汇总得分。依次构建标准与子标准层级、分配权重、给候选的各维度评分、汇总权重与评分的乘积。这里按已有层级权重计算候选项目的综合表现。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>上层标准及权重<\/th><th>子标准<\/th><th>组内权重<\/th><th>相对于总目标的权重<\/th><\/tr><\/thead><tbody><tr><td>服务效果0.6<\/td><td>患者体验<\/td><td>0.75<\/td><td>0.6×0.75=0.45<\/td><\/tr><tr><td>服务效果0.6<\/td><td>工作效率<\/td><td>0.25<\/td><td>0.6×0.25=0.15<\/td><\/tr><tr><td>实施条件0.4<\/td><td>技术准备<\/td><td>0.5<\/td><td>0.4×0.5=0.20<\/td><\/tr><tr><td>实施条件0.4<\/td><td>费用<\/td><td>0.5<\/td><td>0.4×0.5=0.20<\/td><\/tr><\/tbody><\/table><\/div><section class=\"concept\"><h2><span lang=\"en\">Local Weight / Global Weight<\/span><span>局部权重／全局权重<\/span><\/h2><p>局部权重表示同一组内的相对重要性；全局权重表示对总目标的重要性，等于从根节点到该子项沿途权重的乘积。<\/p><\/section><div class=\"formula\">子标准全局权重＝上层权重×子标准局部权重<br>项目总分＝Σ(子标准全局权重×相应评分)<\/div><div class=\"worked-example\"><h3>只看到75%还不够<\/h3><p>患者体验在服务效果组内占75%，整个服务效果组占总目标60%，所以患者体验占总目标45%。若候选评分依次为4、3、5、2，总分为0.45×4+0.15×3+0.20×5+0.20×2=3.65。<\/p><\/div>", "questions": [{"id": "selection-ahp-q1", "prompt": "服务效果权重0.6，患者体验在该组内权重0.75。患者体验的全局权重是多少？", "options": ["0.45", "0.75", "1.35"], "correct": 0, "feedback": ["沿层级相乘：0.6×0.75=0.45。", "0.75只表达组内比例。", "层级比例不能直接相加。"], "ref": "r-selection-ahp", "contextLesson": "selection-ahp", "fingerprint": "e993a075d9d6f550", "legacyFingerprint": null}, {"id": "selection-ahp-q2", "prompt": "服务效果占总权重0.6，其下两项相对重要性记录为7和6。若这两项完整覆盖该组，怎样得到全局权重？", "options": ["先按7:6归一化，再分别乘0.6", "分别用0.7和0.6乘0.6，直接作为全局权重", "把7和6各除以全部四项候选评分之和"], "correct": 0, "feedback": ["组内比例应合计1：局部为7/13与6/13，全局再乘父组0.6。", "局部0.7+0.6=1.3，超过该组全部份额。", "标准权重与候选表现评分用途不同，不能用候选评分确定组内分母。"], "ref": "r-selection-ahp", "contextLesson": "selection-ahp", "fingerprint": "1c2d28b11d5e3025", "legacyFingerprint": null}], "refs": ["r-selection-ahp"], "applications": [{"id": "a-selection-ahp", "kind": "画层级并计算", "prompt": "画出目标“选择医院改进项目”，下分服务效果0.6和实施条件0.4。服务效果下患者体验0.75、工作效率0.25；实施条件下技术准备0.5、费用0.5。标出四个全局权重。", "answer": "图中父子关系应清楚；四个全局权重依次0.45、0.15、0.20、0.20，合计1。层级连接表示组成关系，不能画成项目执行顺序。"}], "lab": "ahp", "drill": {"id": "selection-ahp-d", "prompt": "医院把服务效果权重设为0.7，实施条件0.3。服务效果内患者体验占0.6；实施条件内技术准备占0.4。求两个子项相对于总目标的权重。", "fields": [{"key": "patient", "label": "患者体验全局权重", "type": "number", "answer": 0.42, "tolerance": 0.01, "hint": "患者体验只占服务效果这一组的60%，而整组占总目标的70%。沿两层相乘。"}, {"key": "technical", "label": "技术准备全局权重", "type": "number", "answer": 0.12, "tolerance": 0.01, "hint": "技术准备属于实施条件组，父组权重为0.3，组内权重为0.4。"}, {"key": "other", "label": "另外两个子项的全局权重合计", "type": "number", "answer": 0.46, "tolerance": 0.01, "hint": "四个全局权重合计为1，用1减去前面两个子项的全局权重。"}], "explanation": "患者体验0.7×0.6=0.42；技术准备0.3×0.4=0.12。其余两项为0.7×0.4=0.28及0.3×0.6=0.18，合计0.46；全部全局权重合计1。", "guided": true, "fingerprint": "b72c51a6a14ab494"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "2.1", "order": 87, "priorLesson": "selection-score", "terms": [["Analytic Hierarchy Process (AHP)", "层次分析法", "将目标、标准和子标准组织成层级，分配权重，评价候选，再汇总得分。依次构建标准与子标准层级、分配权重、给候选的各维度评分、汇总权重与评分的乘积。这里按已有层级权重计算候选项目的综合表现。"], ["Local Weight / Global Weight", "局部权重／全局权重", "局部权重表示同一组内的相对重要性；全局权重表示对总目标的重要性，等于从根节点到该子项沿途权重的乘积。"]], "material": {"context": "院方把项目选择标准分为“服务效果”和“实施条件”。服务效果又包含患者体验与工作人员效率；实施条件包含技术准备与费用。每个子标准的重要性，既取决于它在组内的比例，也取决于整组的重要性。", "terms": [["Analytic Hierarchy Process (AHP)", "层次分析法", "将目标、标准和子标准组织成层级，分配权重，评价候选，再汇总得分。依次构建标准与子标准层级、分配权重、给候选的各维度评分、汇总权重与评分的乘积。这里按已有层级权重计算候选项目的综合表现。"], ["Local Weight / Global Weight", "局部权重／全局权重", "局部权重表示同一组内的相对重要性；全局权重表示对总目标的重要性，等于从根节点到该子项沿途权重的乘积。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>上层标准及权重<\/th><th>子标准<\/th><th>组内权重<\/th><th>相对于总目标的权重<\/th><\/tr><\/thead><tbody><tr><td>服务效果0.6<\/td><td>患者体验<\/td><td>0.75<\/td><td>0.6×0.75=0.45<\/td><\/tr><tr><td>服务效果0.6<\/td><td>工作效率<\/td><td>0.25<\/td><td>0.6×0.25=0.15<\/td><\/tr><tr><td>实施条件0.4<\/td><td>技术准备<\/td><td>0.5<\/td><td>0.4×0.5=0.20<\/td><\/tr><tr><td>实施条件0.4<\/td><td>费用<\/td><td>0.5<\/td><td>0.4×0.5=0.20<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "selection-profile", "topic": "2.1", "title": "在风险收益图中排除较差方案", "goal": "在风险收益图中排除较差方案", "source": "Lecture 7 · PDF第13页", "body": "<p>医院比较几项改进方案时，既希望收益高，也希望风险低。若两个项目风险相同，其中一个收益更高，就有理由先保留收益更高的方案。若收益更高的同时风险也更高，则还需要说明愿意承担多少风险。<\/p><section class=\"concept\"><h2><span lang=\"en\">Profile Model<\/span><span>风险收益图<\/span><\/h2><p>把候选项目画在风险和收益两个坐标轴上，比较哪些项目满足门槛，以及承担更多风险是否换来了更高收益。本例横轴为收益，向右增加；纵轴为风险，向上增加。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Dominance<\/span><span>支配关系<\/span><\/h2><p>若甲的风险不高于乙、收益不低于乙，而且至少一项更好，就说甲支配乙。在这些比较条件相同的前提下，乙没有比甲更有利的维度。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Efficient Frontier<\/span><span>有效边界<\/span><\/h2><p>当前候选中，未被其他项目支配的方案形成有效边界。边界上的项目仍可能在高收益与低风险之间各有取舍，需要结合院方的要求再选择。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>方案<\/th><th>收益（万元）<\/th><th>风险评分，越低越好<\/th><\/tr><\/thead><tbody><tr><td>更新取号设备<\/td><td>80<\/td><td>3<\/td><\/tr><tr><td>改造药房窗口<\/td><td>70<\/td><td>3<\/td><\/tr><tr><td>开发预约功能<\/td><td>100<\/td><td>6<\/td><\/tr><tr><td>完善院内指路牌<\/td><td>55<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div><p>横轴是收益，越向右越高；纵轴是风险，越向上越高。取号设备与药房风险相同，收益80高于70，所以前者支配后者。预约功能收益更高但风险也更高，与取号设备之间需要权衡。<\/p><div class=\"worked-example\"><h3>先检查门槛<\/h3><p>院方若要求收益至少60万元、风险评分不超过4，取号设备与药房满足门槛；再检查支配关系，保留取号设备。改变门槛后，应重新判断可行候选。<\/p><\/div>", "questions": [{"id": "selection-profile-q1", "prompt": "甲收益80、风险3；乙收益70、风险3。收益越高越好、风险越低越好。哪个关系成立？", "options": ["甲支配乙", "乙支配甲", "两者相互不支配"], "correct": 0, "feedback": ["风险相同而甲收益更高。", "乙收益较低，没有任何维度更好。", "一项更好、另一项相同，已经足以构成支配。"], "ref": "r-selection-profile", "contextLesson": "selection-profile", "fingerprint": "d167fbbcc1478151", "legacyFingerprint": null}, {"id": "selection-profile-q2", "prompt": "取号设备方案收益80万元、风险3；预约功能方案收益100万元、风险6。院方要求收益至少60、风险不超过4。应怎样判断？", "options": ["取号设备可行；预约功能未过门槛，两者之间仍不存在支配关系", "取号设备支配预约功能，因为它的风险更低", "预约功能支配取号设备，因为它的收益更高"], "correct": 0, "feedback": ["可行性按门槛判断；支配要求至少一项更好且另一项不差，不能混为一谈。", "取号设备风险低，但收益也低，不构成支配。", "预约功能收益高，但风险更高，而且未满足风险上限。"], "ref": "r-selection-profile", "contextLesson": "selection-profile", "fingerprint": "5990acfb9bc3c041", "legacyFingerprint": null}], "refs": ["r-selection-profile"], "applications": [{"id": "a-selection-profile", "kind": "方案取舍", "prompt": "医院把最高风险评分从4放宽到6，收益门槛仍为60。现在取号设备与预约功能都可考虑。说明为什么仍不能单凭图决定最终项目。", "answer": "图中二者不相互支配。还要比较资金、资源、收益估计依据、风险承担能力与战略目标。放宽门槛只是增加可行候选，不是自动选择风险最高者。"}], "lab": "profile", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "2.1", "order": 88, "priorLesson": "selection-ahp", "terms": [["Profile Model", "风险收益图", "把候选项目画在风险和收益两个坐标轴上，比较哪些项目满足门槛，以及承担更多风险是否换来了更高收益。本例横轴为收益，向右增加；纵轴为风险，向上增加。"], ["Dominance", "支配关系", "若甲的风险不高于乙、收益不低于乙，而且至少一项更好，就说甲支配乙。在这些比较条件相同的前提下，乙没有比甲更有利的维度。"], ["Efficient Frontier", "有效边界", "当前候选中，未被其他项目支配的方案形成有效边界。边界上的项目仍可能在高收益与低风险之间各有取舍，需要结合院方的要求再选择。"]], "material": {"context": "医院比较几项改进方案时，既希望收益高，也希望风险低。若两个项目风险相同，其中一个收益更高，就有理由先保留收益更高的方案。若收益更高的同时风险也更高，则还需要说明愿意承担多少风险。", "terms": [["Profile Model", "风险收益图", "把候选项目画在风险和收益两个坐标轴上，比较哪些项目满足门槛，以及承担更多风险是否换来了更高收益。本例横轴为收益，向右增加；纵轴为风险，向上增加。"], ["Dominance", "支配关系", "若甲的风险不高于乙、收益不低于乙，而且至少一项更好，就说甲支配乙。在这些比较条件相同的前提下，乙没有比甲更有利的维度。"], ["Efficient Frontier", "有效边界", "当前候选中，未被其他项目支配的方案形成有效边界。边界上的项目仍可能在高收益与低风险之间各有取舍，需要结合院方的要求再选择。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>方案<\/th><th>收益（万元）<\/th><th>风险评分，越低越好<\/th><\/tr><\/thead><tbody><tr><td>更新取号设备<\/td><td>80<\/td><td>3<\/td><\/tr><tr><td>改造药房窗口<\/td><td>70<\/td><td>3<\/td><\/tr><tr><td>开发预约功能<\/td><td>100<\/td><td>6<\/td><\/tr><tr><td>完善院内指路牌<\/td><td>55<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "finance-payback", "topic": "2.2", "title": "累计现金流与投资回收期", "goal": "累计现金流与投资回收期", "source": "Lecture 7 · PDF第14–18、21–22页", "body": "<p>医院考虑购买一套登记设备，希望减少人工登记费用。现在需要支付10万元，以后每年预计净节省6万元；这里的净节省已经扣除了当年的运行费用。院方首先想知道：需要等多久，累计节省才能抵消购买设备的支出？<\/p><section class=\"concept\"><h2><span lang=\"en\">Cash Flow<\/span><span>现金流<\/span><\/h2><p>在某个时点实际流入或流出的金额。站在医院的角度，购买设备是流出，记为负数；以后节省的净支出作为项目带来的净流入，记为正数。金额和发生时间需要一起记录。<\/p><\/section><div class=\"table-scroll\"><table><caption>现金流表：按发生时间排列各笔净流入与净流出<\/caption><thead><tr><th>时点<\/th><th>发生的事情<\/th><th>净现金流（万元）<\/th><th>累计现金流（万元）<\/th><\/tr><\/thead><tbody><tr><td>0，即现在<\/td><td>支付设备款<\/td><td>-10<\/td><td>-10<\/td><\/tr><tr><td>第1年末<\/td><td>获得第一年净节省<\/td><td>6<\/td><td>-4<\/td><\/tr><tr><td>第2年末<\/td><td>获得第二年净节省<\/td><td>6<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div><p>累计一列从现在的−10开始，每经过一年，就加上当年的净现金流。第1年末为−10+6=−4，说明还差4万元没有收回；第2年末为−4+6=2，说明已经收回投入，并多出2万元。<\/p><section class=\"concept\"><h2><span lang=\"en\">Payback Period<\/span><span>投资回收期<\/span><\/h2><p>从初始投入到累计净现金流首次达到零所经过的时间。它回答资金要被占用多久，便于比较回收快慢。按上表的年末记录，本例在第2年末收回投入。<\/p><\/section><div class=\"worked-example\"><h3>什么时候可以写成1.67年<\/h3><p>如果进一步规定每年的6万元均匀流入，第一年后还差4万元，第二年需要4÷6年收回这部分。因此回收期=1+4÷6≈1.67年。若现金只在年末收到，就仍应写第2年末。<\/p><\/div><div class=\"formula\">每年等额且均匀流入：回收期＝初始投入÷年度净流入<br>各年金额不同、回收当年均匀流入：完整年数＋剩余未回收金额÷回收当年净流入<\/div><p>普通回收期不区分同样金额发生在今年还是几年后，也不计入回收以后还能获得多少收益。下一节先说明如何把未来金额换算到今天，再比较净现值与贴现回收期。<\/p>", "questions": [{"id": "finance-payback-q1", "prompt": "投入10万元，第1和第2年年末各流入6万元。题目只允许按年末现金流判断，应报告什么？", "options": ["第1.67年内精确回收", "第1年末回收", "第2年末回收"], "correct": 2, "feedback": ["1.67年需要额外的年内均匀流入假设。", "第一年只收回6万元。", "第1年末累计−4，第2年末累计+2，按离散时点在第2年末回收。"], "ref": "r-finance-payback", "contextLesson": "finance-payback", "fingerprint": "bf4af68c17d7ff56", "legacyFingerprint": null}, {"id": "finance-payback-q2", "prompt": "甲乙都投入10万元，前两年末各收回5万元；第3年甲无流入，乙流入8万元。仅用普通回收期排序，能得出什么？", "options": ["乙回收更早，因为三年合计流入更多", "两者都在第2年末回收，无法据此比较第3年价值", "两者全部现金流的投资价值相同"], "correct": 1, "feedback": ["第三年收益发生在回收之后，不改变已发生的回收时间。", "回收时点相同，只说明资金收回快慢相同，回收后的现金流未进入该指标。", "同回收期不等于全部收益相同，需使用其他评价指标。"], "ref": "r-finance-payback", "contextLesson": "finance-payback", "fingerprint": "08ea74c8f4ab3a10", "legacyFingerprint": null}], "refs": ["r-finance-payback"], "applications": [{"id": "a-finance-payback", "kind": "回收更快就一定更好吗", "prompt": "医院要求3年内收回投入。甲在第2年末收回，以后不再有净流入；乙在第3年末收回，第4年还预计净流入20万元。仅按普通回收期，能确定什么，还不能确定什么？", "answer": "两项都满足3年内回收的门槛，甲收回资金更快。这个指标未计入乙第4年的净流入，因此不能仅凭甲回收更快就断定甲的整体价值更高。还需比较完整现金流、发生时间、估计依据和资金约束。"}], "lab": "payback", "drill": {"id": "finance-payback-d", "prompt": "另一套设备现在投入12万元，前三年末净流入依次为4、5、6万元。先按年末记录累计，再考虑第3年均匀流入。", "fields": [{"key": "year1", "label": "第1年末累计现金流（万元）", "type": "number", "answer": -8, "tolerance": 0.01, "hint": "从初始现金流−12开始，加上第1年的4。负数表示还有投入没有收回。"}, {"key": "year2", "label": "第2年末累计现金流（万元）", "type": "number", "answer": -3, "tolerance": 0.01, "hint": "把第2年流入的5加到第1年末累计金额上，初始投入只计一次。"}, {"key": "year3", "label": "第3年末累计现金流（万元）", "type": "number", "answer": 3, "tolerance": 0.01, "hint": "把第3年流入的6加到第2年末累计金额上。"}, {"key": "end", "label": "只按年末记录，回收发生在第几年末", "type": "number", "answer": 3, "tolerance": 0.01, "hint": "按年末记录，找累计金额第一次不小于零的年份。"}, {"key": "uniform", "label": "第3年均匀流入时的回收期（年）", "type": "number", "answer": 2.5, "tolerance": 0.01, "hint": "先保留已过去的两年，再用尚未收回的金额除以第3年的6万元。"}], "explanation": "各年累计为−12+4=−8、−8+5=−3、−3+6=3。年末记录在第3年回收；均匀流入时，前2年还差3万元，再用3÷6年，因此共2.5年。", "guided": true, "fingerprint": "387dd9573b33f95f"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "2.2", "order": 89, "priorLesson": null, "terms": [["Cash Flow", "现金流", "在某个时点实际流入或流出的金额。站在医院的角度，购买设备是流出，记为负数；以后节省的净支出作为项目带来的净流入，记为正数。金额和发生时间需要一起记录。"], ["Payback Period", "投资回收期", "从初始投入到累计净现金流首次达到零所经过的时间。它回答资金要被占用多久，便于比较回收快慢。按上表的年末记录，本例在第2年末收回投入。"]], "material": {"context": "医院考虑购买一套登记设备，希望减少人工登记费用。现在需要支付10万元，以后每年预计净节省6万元；这里的净节省已经扣除了当年的运行费用。院方首先想知道：需要等多久，累计节省才能抵消购买设备的支出？", "terms": [["Cash Flow", "现金流", "在某个时点实际流入或流出的金额。站在医院的角度，购买设备是流出，记为负数；以后节省的净支出作为项目带来的净流入，记为正数。金额和发生时间需要一起记录。"], ["Payback Period", "投资回收期", "从初始投入到累计净现金流首次达到零所经过的时间。它回答资金要被占用多久，便于比较回收快慢。按上表的年末记录，本例在第2年末收回投入。"]], "tables": ["<div class=\"table-scroll\"><table><caption>现金流表：按发生时间排列各笔净流入与净流出<\/caption><thead><tr><th>时点<\/th><th>发生的事情<\/th><th>净现金流（万元）<\/th><th>累计现金流（万元）<\/th><\/tr><\/thead><tbody><tr><td>0，即现在<\/td><td>支付设备款<\/td><td>-10<\/td><td>-10<\/td><\/tr><tr><td>第1年末<\/td><td>获得第一年净节省<\/td><td>6<\/td><td>-4<\/td><\/tr><tr><td>第2年末<\/td><td>获得第二年净节省<\/td><td>6<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "finance-npv", "topic": "2.2", "title": "现值与净现值：把未来金额折算到今天", "goal": "现值与净现值：把未来金额折算到今天", "source": "Lecture 7 · PDF第19–23页", "body": "<p>仍看这套登记设备：现在投入10万元，第1年末和第2年末各净流入6万元。直接相加得到2万元结余，但院方也需要比较资金的其他用途。假设要求年回报率为10%，今天的1万元到一年后应达到1.1万元；反过来，一年后的1.1万元相当于今天的1万元。<\/p><section class=\"concept\"><h2><span lang=\"en\">Present Value (PV)<\/span><span>现值<\/span><\/h2><p>未来一笔金额按给定回报要求折算到今天的价值。把不同时间的金额换到同一时点，才能与今天的投入比较。这里PV表示现值；进度与成本控制中的Planned Value也缩写为PV，含义需按上下文区分。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Discount Rate<\/span><span>贴现率<\/span><\/h2><p>折算未来现金流使用的比率。本例采用每年10%，小数形式为0.10。期限以年计，贴现率也采用年率；第2年末的金额要连续折算两年。<\/p><\/section><div class=\"formula\">第t年末现金流的现值＝Fₜ÷(1+k)ᵗ<br>Fₜ为该年净现金流，k为每期贴现率，t为距现在的期数<\/div><div class=\"table-scroll\"><table><caption>同一份现金流按10%年贴现率折算；计算时保留中间精度<\/caption><thead><tr><th>时点<\/th><th>净现金流（万元）<\/th><th>折算过程<\/th><th>现值（万元）<\/th><\/tr><\/thead><tbody><tr><td>现在<\/td><td>-10<\/td><td>已经是现在的金额<\/td><td>-10<\/td><\/tr><tr><td>第1年末<\/td><td>6<\/td><td>6÷1.10<\/td><td>5.4545<\/td><\/tr><tr><td>第2年末<\/td><td>6<\/td><td>6÷1.10²<\/td><td>4.9587<\/td><\/tr><\/tbody><\/table><\/div><section class=\"concept\"><h2><span lang=\"en\">Net Present Value (NPV)<\/span><span>净现值<\/span><\/h2><p>把所有现金流的现值相加，包括最初的支出。它表示按所用贴现率衡量后，项目相对投入增加或减少了多少价值。<\/p><\/section><div class=\"formula\">NPV＝−初始投入＋Σ[Fₜ÷(1+k)ᵗ]<\/div><div class=\"worked-example\"><h3>把两年的现值与投入比较<\/h3><p>NPV=−10+6÷1.10+6÷1.10²≈0.4132万元，即4132.23元。NPV>0表示超过10%的要求回报；NPV=0表示恰好达到；NPV<0表示未达到。正负判断依赖所采用的现金流和贴现率。<\/p><\/div><section class=\"concept\"><h2><span lang=\"en\">Discounted Payback Period<\/span><span>贴现投资回收期<\/span><\/h2><p>将未来净流入先折为现值，再逐期累计，判断何时收回投入。本例第1年末累计为−4.5455万元，第2年末为0.4132万元，按年末记录也在第2年末回收。两种回收期相同，并不表示两种累计金额相同。<\/p><\/section><p>若题目把要求回报率r和通胀率p分别给出，并指定k=r+p，就先按该口径求k。例如r=8%、p=2%时，使用10%。如果给出的贴现率已经包含通胀，不能再加一次。普通回收期、贴现回收期和NPV应使用同一套现金流及一致的计价口径。<\/p>", "questions": [{"id": "finance-npv-q1", "prompt": "初始现金流已写成I₀=−10万元，后续流入现值合计10.4132万元。NPV应怎样计算？", "options": ["−(−10)+10.4132", "10−10.4132", "−10+10.4132"], "correct": 2, "feedback": ["负现金流再取负会把支出错误地变成流入。", "这改变了流入和流出的方向。", "NPV约0.4132万元。"], "ref": "r-finance-npv", "contextLesson": "finance-npv", "fingerprint": "70a46490727288d7", "legacyFingerprint": null}, {"id": "finance-npv-q2", "prompt": "只把贴现率从10%提高到15%，初始支出和后续正现金流不变。NPV怎样变化？", "options": ["不变，因为总现金流没变", "提高，因为要求回报更高", "降低，因为未来正现金流折算后更少"], "correct": 2, "feedback": ["NPV同时受金额和时点折算影响。", "要求更高会减少未来收益的当前价值。", "分母增大，未来流入现值减少，NPV降低。"], "ref": "r-finance-npv", "contextLesson": "finance-npv", "fingerprint": "eda91702b5d959b5", "legacyFingerprint": null}], "refs": ["r-finance-npv"], "applications": [{"id": "a-finance-npv", "kind": "计算并解释", "prompt": "投入10万元，一年后净流入11万元。分别按10%和20%贴现，计算NPV并解释符号。", "answer": "10%时−10+11/1.1=0，刚好达到该要求；20%时−10+11/1.2≈−0.8333万元，按20%的要求净价值为负。现金流相同，评价标准变化会改变结论。"}], "lab": "npv", "drill": {"id": "finance-npv-d", "prompt": "现在投入10万元，第1年末净流入4万元，第2年末净流入8万元，年贴现率10%。所有金额以万元填写，可保留三位小数。", "fields": [{"key": "pv1", "label": "第1年净流入现值", "type": "number", "answer": 3.6363636363636362, "tolerance": 0.002, "hint": "第1年只贴现一期。贴现率10%写作0.10，用流入除以1.10。"}, {"key": "pv2", "label": "第2年净流入现值", "type": "number", "answer": 6.6115702479338845, "tolerance": 0.002, "hint": "第2年要贴现两期，分母为1.10²，不能只贴现一次。"}, {"key": "npv", "label": "净现值NPV", "type": "number", "answer": 0.24793388429752067, "tolerance": 0.003, "hint": "把两笔现值相加，再减去现在投入的10万元。现在的投入不再贴现。"}, {"key": "decision", "label": "按10%的要求回报判断", "type": "select", "options": ["低于要求回报", "恰好达到要求回报", "超过要求回报"], "answer": 2, "hint": "NPV为正、零、负，分别表示超过、恰好达到、未达到所用贴现率对应的要求回报。"}], "explanation": "第一年4÷1.1≈3.636；第二年8÷1.1²≈6.612；NPV≈−10+3.636+6.612=0.248万元，为正，超过10%的要求回报。", "guided": true, "fingerprint": "428f0927d91ef7d3"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "2.2", "order": 90, "priorLesson": "finance-payback", "terms": [["Present Value (PV)", "现值", "未来一笔金额按给定回报要求折算到今天的价值。把不同时间的金额换到同一时点，才能与今天的投入比较。这里PV表示现值；进度与成本控制中的Planned Value也缩写为PV，含义需按上下文区分。"], ["Discount Rate", "贴现率", "折算未来现金流使用的比率。本例采用每年10%，小数形式为0.10。期限以年计，贴现率也采用年率；第2年末的金额要连续折算两年。"], ["Net Present Value (NPV)", "净现值", "把所有现金流的现值相加，包括最初的支出。它表示按所用贴现率衡量后，项目相对投入增加或减少了多少价值。"], ["Discounted Payback Period", "贴现投资回收期", "将未来净流入先折为现值，再逐期累计，判断何时收回投入。本例第1年末累计为−4.5455万元，第2年末为0.4132万元，按年末记录也在第2年末回收。两种回收期相同，并不表示两种累计金额相同。"]], "material": {"context": "仍看这套登记设备：现在投入10万元，第1年末和第2年末各净流入6万元。直接相加得到2万元结余，但院方也需要比较资金的其他用途。假设要求年回报率为10%，今天的1万元到一年后应达到1.1万元；反过来，一年后的1.1万元相当于今天的1万元。", "terms": [["Present Value (PV)", "现值", "未来一笔金额按给定回报要求折算到今天的价值。把不同时间的金额换到同一时点，才能与今天的投入比较。这里PV表示现值；进度与成本控制中的Planned Value也缩写为PV，含义需按上下文区分。"], ["Discount Rate", "贴现率", "折算未来现金流使用的比率。本例采用每年10%，小数形式为0.10。期限以年计，贴现率也采用年率；第2年末的金额要连续折算两年。"], ["Net Present Value (NPV)", "净现值", "把所有现金流的现值相加，包括最初的支出。它表示按所用贴现率衡量后，项目相对投入增加或减少了多少价值。"], ["Discounted Payback Period", "贴现投资回收期", "将未来净流入先折为现值，再逐期累计，判断何时收回投入。本例第1年末累计为−4.5455万元，第2年末为0.4132万元，按年末记录也在第2年末回收。两种回收期相同，并不表示两种累计金额相同。"]], "tables": ["<div class=\"table-scroll\"><table><caption>同一份现金流按10%年贴现率折算；计算时保留中间精度<\/caption><thead><tr><th>时点<\/th><th>净现金流（万元）<\/th><th>折算过程<\/th><th>现值（万元）<\/th><\/tr><\/thead><tbody><tr><td>现在<\/td><td>-10<\/td><td>已经是现在的金额<\/td><td>-10<\/td><\/tr><tr><td>第1年末<\/td><td>6<\/td><td>6÷1.10<\/td><td>5.4545<\/td><\/tr><tr><td>第2年末<\/td><td>6<\/td><td>6÷1.10²<\/td><td>4.9587<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "finance-irr", "topic": "2.2", "title": "内部收益率与要求回报率", "goal": "内部收益率与要求回报率", "source": "Lecture 7 · PDF第24–25页", "body": "<p>登记设备仍需现在投入10万元，两年末各净流入6万元。刚才按10%贴现，NPV约为0.4132万元。提高贴现率，未来两笔节省折算后的现值会下降。院方可以继续试算，找出让NPV恰好等于零的比率。<\/p><section class=\"concept\"><h2><span lang=\"en\">Internal Rate of Return (IRR)<\/span><span>内部收益率<\/span><\/h2><p>使一组现金流的净现值等于零的贴现率。IRR由投入、后续流入及其时点决定；要求回报率则是院方用来比较的标准。<\/p><\/section><div class=\"formula\">0＝−10＋6÷(1+IRR)＋6÷(1+IRR)²<\/div><div class=\"table-scroll\"><table><caption>通过NPV的正负变化寻找IRR<\/caption><thead><tr><th>试算贴现率<\/th><th>NPV（万元）<\/th><th>判断<\/th><\/tr><\/thead><tbody><tr><td>10%<\/td><td>约0.4132<\/td><td>正，尚高于要求回报<\/td><\/tr><tr><td>15%<\/td><td>约−0.2457<\/td><td>负，尚不足以达到这一回报<\/td><\/tr><tr><td>约13.0662%<\/td><td>约0<\/td><td>达到本组现金流的IRR<\/td><\/tr><\/tbody><\/table><\/div><p>IRR介于10%和15%之间，继续试算得到约13.0662%。若院方要求10%，本例IRR高于要求，可以继续考虑；若要求15%，本例低于要求。单独把院方要求从10%改成15%，会改变判断和该比率下的NPV，不会改变现金流本身的IRR。<\/p><div class=\"worked-example\"><h3>怎样区分金额与比率<\/h3><p>NPV约4132.23元回答的是：按10%要求回报衡量，还增加多少价值。IRR约13.0662%回答的是：哪一个贴现率会把NPV降到零。两者不能直接用数值大小互相比高低。<\/p><\/div><p>本例先有一次投入，之后均为非负净流入，便于用上述方式试算。项目若在后期还有大额支出，应重新检查完整现金流；现金流多次改变正负号时，可能出现多个IRR，不能只凭一个比率排序。比较互斥项目时，也要检查NPV、规模、期间和资金约束。<\/p>", "questions": [{"id": "finance-irr-q1", "prompt": "一组常规现金流在10%时NPV为正，在15%时为负。IRR在哪个范围？", "options": ["高于15%", "低于10%", "介于10%和15%之间"], "correct": 2, "feedback": ["15%时已经低于0。", "常规正流入下NPV随利率提高而下降，零点尚未到达10%以下。", "连续函数在两者之间经过0。"], "ref": "r-finance-irr", "contextLesson": "finance-irr", "fingerprint": "dce240ce1bebfdbd", "legacyFingerprint": null}, {"id": "finance-irr-q2", "prompt": "甲IRR较高，乙按共同贴现率计算的NPV较高，两者只能选一个。比较方案时哪项做法有依据？", "options": ["只按IRR由高到低决定，不再看投入规模", "只按普通回收期决定，不再看回收后的收益", "核对现金流与约束是否可比，再判断净价值和组织目标"], "correct": 2, "feedback": ["比例回报不能单独说明增加的净价值。", "回收期遗漏回收后的现金流，不能替代完整比较。", "互斥选择需要可比较的价值及约束。"], "ref": "r-finance-irr", "contextLesson": "finance-irr", "fingerprint": "12950359e2966daa", "legacyFingerprint": null}], "refs": ["r-finance-irr"], "applications": [{"id": "a-finance-irr", "kind": "财务结论", "prompt": "投入5000元，未来三年净流入2500、2000、2000元。按15%贴现后流入现值约5003元。能得到什么结论？还不能得到什么结论？", "answer": "15%下NPV略大于0，这组常规现金流达到15%的要求，IRR略高于15%。还不能因此认定应立即实施，仍需比较战略、资源、风险及其他候选；不能把15%说成精确IRR。"}], "lab": "irr", "drill": {"id": "finance-irr-d", "prompt": "现在投入10万元，只有第1年末流入12万元，以后没有其他现金流。", "fields": [{"key": "irr", "label": "IRR（填写百分数，如15表示15%）", "type": "number", "answer": 20, "tolerance": 0.01, "hint": "令NPV为零：10=12÷(1+IRR)。先求小数比率，再乘100填写百分数。"}, {"key": "npv", "label": "要求回报率25%时的NPV（万元）", "type": "number", "answer": -0.4, "tolerance": 0.01, "hint": "用要求回报率25%折算12万元，再减现在投入的10万元。"}, {"key": "decision", "label": "院方要求25%，这笔投资是否达到要求", "type": "select", "options": ["达到，因为收到的钱多于最初投入", "未达到，因为IRR低于要求回报率", "无法比较，必须把IRR改成25%"], "answer": 1, "hint": "比较由现金流求出的IRR与院方要求的25%；后者不会改变现金流的IRR。"}], "explanation": "10=12÷(1+IRR)，所以IRR=20%。在25%下NPV=−10+12÷1.25=−0.4万元。现金流仍相同，IRR仍为20%，低于院方要求。", "guided": true, "fingerprint": "d7c0d0dbbb58a0c7"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "2.2", "order": 91, "priorLesson": "finance-npv", "terms": [["Internal Rate of Return (IRR)", "内部收益率", "使一组现金流的净现值等于零的贴现率。IRR由投入、后续流入及其时点决定；要求回报率则是院方用来比较的标准。"]], "material": {"context": "登记设备仍需现在投入10万元，两年末各净流入6万元。刚才按10%贴现，NPV约为0.4132万元。提高贴现率，未来两笔节省折算后的现值会下降。院方可以继续试算，找出让NPV恰好等于零的比率。", "terms": [["Internal Rate of Return (IRR)", "内部收益率", "使一组现金流的净现值等于零的贴现率。IRR由投入、后续流入及其时点决定；要求回报率则是院方用来比较的标准。"]], "tables": ["<div class=\"table-scroll\"><table><caption>通过NPV的正负变化寻找IRR<\/caption><thead><tr><th>试算贴现率<\/th><th>NPV（万元）<\/th><th>判断<\/th><\/tr><\/thead><tbody><tr><td>10%<\/td><td>约0.4132<\/td><td>正，尚高于要求回报<\/td><\/tr><tr><td>15%<\/td><td>约−0.2457<\/td><td>负，尚不足以达到这一回报<\/td><\/tr><tr><td>约13.0662%<\/td><td>约0<\/td><td>达到本组现金流的IRR<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "selection-portfolio", "topic": "2.2", "title": "项目集与项目组合的选择", "goal": "项目集与项目组合的选择", "source": "Lecture 1 · PDF第22页；Lecture 7 · 第26–32页", "body": "<p>医院同时筹备接待区、药房和门诊叫号系统。三项工作可能共用设备接口与开放安排，需要协调关联收益。院方还要在这些项目和其他投资之间分配资金与人员，这又是更广的选择问题。<\/p><section class=\"concept\"><h2><span lang=\"en\">Program / Portfolio<\/span><span>项目集／项目组合<\/span><\/h2><p>项目集协调相互关联的项目，以获得分别管理难以取得的共同收益。项目组合围绕组织战略选择、支持和调整项目及项目集，其中的项目不必具有直接技术依赖。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>商业潜力<\/th><th>技术可行性<\/th><th>项目组合中的名称与含义<\/th><\/tr><\/thead><tbody><tr><td>高<\/td><td>高<\/td><td>Pearls，珍珠：有吸引力且较可行<\/td><\/tr><tr><td>高<\/td><td>低<\/td><td>Oysters，牡蛎：潜力大，仍需突破技术不确定性<\/td><\/tr><tr><td>低<\/td><td>高<\/td><td>Bread and Butter，日常收益项目：技术较成熟，收益较温和<\/td><\/tr><tr><td>低<\/td><td>低<\/td><td>White Elephants，白象：缺少足够价值且实施困难，需复查是否继续<\/td><\/tr><\/tbody><\/table><\/div><p>组合选择先明确战略和比较方法，再预筛、分析单项、筛选、选择组合与调整；实施后继续评价、重新排序，必要时停止不再合适的项目。资源稀缺、保守的技术选择、单项目与组合目标不同步，都可能妨碍这个过程。<\/p><div class=\"worked-example\"><h3>最高分项目不一定形成最佳组合<\/h3><p>预算只有10万元，项目甲需要8万元，乙和丙各需5万元。即使甲单项评分最高，乙加丙也可能带来更大整体价值。还要检查两项是否重复计算收益、共用人员是否足够，以及是否存在必须一起实施的依赖。<\/p><\/div>", "questions": [{"id": "selection-portfolio-q1", "prompt": "甲8万元、价值分9；乙5万元、价值分7；丙5万元、价值分6。预算10万元，价值可相加且无其他约束。哪组价值最高？", "options": ["选甲和乙", "只选甲", "选乙和丙"], "correct": 2, "feedback": ["费用13超过预算。", "甲价值9，乙丙合计13。", "费用5+5=10，价值7+6=13。"], "ref": "r-selection-portfolio", "contextLesson": "selection-portfolio", "fingerprint": "65369722aa67963b", "legacyFingerprint": null}, {"id": "selection-portfolio-q2", "prompt": "一个技术可行性低、商业潜力高的方案，属于哪一类？", "options": ["Oysters", "Pearls", "Bread and Butter"], "correct": 0, "feedback": ["牡蛎表示潜力较高而技术不确定性仍大。", "珍珠要求高可行性与高潜力。", "日常收益项目是高可行性、较低潜力。"], "ref": "r-selection-portfolio", "contextLesson": "selection-portfolio", "fingerprint": "4cfe97a6b2577683", "legacyFingerprint": null}], "refs": ["r-selection-portfolio"], "applications": [{"id": "a-selection-portfolio", "kind": "组合复审", "prompt": "某方案去年被列为Pearl，今年关键技术人员离开且需求下降。应怎样复审？", "answer": "重新调查技术可行性与商业潜力，比较补充人员和缩减范围后的方案，再与其他候选及资源约束比较。原象限不能作为永久资格，可继续、调整、暂缓或终止，并明确决定依据。"}], "lab": "portfolio", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "2.2", "order": 92, "priorLesson": "finance-irr", "terms": [["Program / Portfolio", "项目集／项目组合", "项目集协调相互关联的项目，以获得分别管理难以取得的共同收益。项目组合围绕组织战略选择、支持和调整项目及项目集，其中的项目不必具有直接技术依赖。"]], "material": {"context": "医院同时筹备接待区、药房和门诊叫号系统。三项工作可能共用设备接口与开放安排，需要协调关联收益。院方还要在这些项目和其他投资之间分配资金与人员，这又是更广的选择问题。", "terms": [["Program / Portfolio", "项目集／项目组合", "项目集协调相互关联的项目，以获得分别管理难以取得的共同收益。项目组合围绕组织战略选择、支持和调整项目及项目集，其中的项目不必具有直接技术依赖。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>商业潜力<\/th><th>技术可行性<\/th><th>项目组合中的名称与含义<\/th><\/tr><\/thead><tbody><tr><td>高<\/td><td>高<\/td><td>Pearls，珍珠：有吸引力且较可行<\/td><\/tr><tr><td>高<\/td><td>低<\/td><td>Oysters，牡蛎：潜力大，仍需突破技术不确定性<\/td><\/tr><tr><td>低<\/td><td>高<\/td><td>Bread and Butter，日常收益项目：技术较成熟，收益较温和<\/td><\/tr><tr><td>低<\/td><td>低<\/td><td>White Elephants，白象：缺少足够价值且实施困难，需复查是否继续<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "stakeholder-identify", "topic": "3.1", "title": "识别谁会影响项目、谁会受到影响", "goal": "识别谁会影响项目、谁会受到影响", "source": "Lecture 2 · PDF第23–28、32–40页", "body": "<p>医院准备改造接待区。院方批准资金，采购人员选择设备，接待人员将使用新系统，患者要经过施工区域，附近居民可能受到噪声影响。项目经理需要了解这些人的要求和担忧，才能安排可接受的方案。<\/p><section class=\"concept\"><h2><span lang=\"en\">Stakeholder<\/span><span>利益相关者<\/span><\/h2><p>可能影响项目、受到项目影响，或认为自己受到影响的个人、群体或组织。患者和居民即使没有与项目签合同，也可能因服务或施工变化受到影响。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Stakeholder Register<\/span><span>利益相关者登记册<\/span><\/h2><p>逐项记录利益相关者身份、角色、需求、担忧和影响方式的资料。它帮助项目经理确定需要向谁了解要求、邀请谁参与决定，以及谁需要收到信息。下表先记录角色、需求与影响，随后再分析参与方式。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>角色<\/th><th>关心什么<\/th><th>怎样影响项目<\/th><\/tr><\/thead><tbody><tr><td>院方负责人<\/td><td>服务目标、预算和开放时间<\/td><td>批准范围、资金和重大变更<\/td><\/tr><tr><td>接待人员<\/td><td>操作是否方便，培训是否充分<\/td><td>提供使用要求，参与测试和交接<\/td><\/tr><tr><td>患者与家属<\/td><td>找路方便，服务不中断<\/td><td>提供使用反馈，反映通行问题<\/td><\/tr><tr><td>供应商<\/td><td>接口、交期与付款条件<\/td><td>交付设备，提出技术与交货信息<\/td><\/tr><tr><td>附近居民<\/td><td>噪声、交通与施工时间<\/td><td>提出意见，影响外部接受程度<\/td><\/tr><\/tbody><\/table><\/div><p>内部利益相关者可以包括高层、职能经理、财务和团队；外部可以包括客户、供应商、社区和竞争者。是否支持项目、是否签订合同，都不是唯一纳入标准。识别以后，还要调查具体利益和影响，不能只留下姓名与电话。<\/p><p>管理时先了解环境与主要目标，再检查团队的能力，明确冲突或问题，提出方案并通过反馈调整。例如患者反映临时通道难找，项目经理应核实路线、与运营人员确认改法，再请使用者试走。<\/p>", "questions": [{"id": "stakeholder-identify-q1", "prompt": "居民不参与采购合同，但担心夜间施工噪声。应如何处理？", "options": ["记录具体担忧、影响途径和沟通责任", "没有合同，不进入登记册", "只记录支持施工的居民"], "correct": 0, "feedback": ["居民受到影响，意见可能改变施工安排。", "合同不是判断受影响的唯一依据。", "反对者同样需要识别和分析。"], "ref": "r-stakeholder-identify", "contextLesson": "stakeholder-identify", "fingerprint": "6c9c1ab6c75056e6", "legacyFingerprint": null}, {"id": "stakeholder-identify-q2", "prompt": "院方负责人的姓名与联系方式已记录，项目经理要安排他参与新增窗口的决定。还应优先补充哪组资料？", "options": ["全部设备参数和每名安装人员的排班", "报告发送次数和上次会议的持续时间", "他的批准权限、关注目标与作决定所需信息"], "correct": 2, "feedback": ["这些资料可能作为附件，但尚不能明确这位利益相关者的决定权和需求。", "发送和会议统计不能替代对角色、目标和权限的调查。", "权限决定他能决定什么，关注目标与信息需求决定如何支持决定。"], "ref": "r-stakeholder-identify", "contextLesson": "stakeholder-identify", "fingerprint": "43d70635882071a4", "legacyFingerprint": null}], "refs": ["r-stakeholder-identify"], "applications": [{"id": "a-stakeholder-identify", "kind": "编写登记册", "prompt": "为医院接待区选择两个内部、两个外部利益相关者，各写一项需求和一个具体影响途径。", "answer": "内部可选院方负责人、接待人员；外部可选供应商、患者或居民。需求应与角色对应，例如接待人员需要培训并参与测试；供应商需要确认接口并影响到货时间。内部外部按所采用的组织边界说明。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "3.1", "order": 93, "priorLesson": null, "terms": [["Stakeholder", "利益相关者", "可能影响项目、受到项目影响，或认为自己受到影响的个人、群体或组织。患者和居民即使没有与项目签合同，也可能因服务或施工变化受到影响。"], ["Stakeholder Register", "利益相关者登记册", "逐项记录利益相关者身份、角色、需求、担忧和影响方式的资料。它帮助项目经理确定需要向谁了解要求、邀请谁参与决定，以及谁需要收到信息。下表先记录角色、需求与影响，随后再分析参与方式。"]], "material": {"context": "医院准备改造接待区。院方批准资金，采购人员选择设备，接待人员将使用新系统，患者要经过施工区域，附近居民可能受到噪声影响。项目经理需要了解这些人的要求和担忧，才能安排可接受的方案。", "terms": [["Stakeholder", "利益相关者", "可能影响项目、受到项目影响，或认为自己受到影响的个人、群体或组织。患者和居民即使没有与项目签合同，也可能因服务或施工变化受到影响。"], ["Stakeholder Register", "利益相关者登记册", "逐项记录利益相关者身份、角色、需求、担忧和影响方式的资料。它帮助项目经理确定需要向谁了解要求、邀请谁参与决定，以及谁需要收到信息。下表先记录角色、需求与影响，随后再分析参与方式。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>角色<\/th><th>关心什么<\/th><th>怎样影响项目<\/th><\/tr><\/thead><tbody><tr><td>院方负责人<\/td><td>服务目标、预算和开放时间<\/td><td>批准范围、资金和重大变更<\/td><\/tr><tr><td>接待人员<\/td><td>操作是否方便，培训是否充分<\/td><td>提供使用要求，参与测试和交接<\/td><\/tr><tr><td>患者与家属<\/td><td>找路方便，服务不中断<\/td><td>提供使用反馈，反映通行问题<\/td><\/tr><tr><td>供应商<\/td><td>接口、交期与付款条件<\/td><td>交付设备，提出技术与交货信息<\/td><\/tr><tr><td>附近居民<\/td><td>噪声、交通与施工时间<\/td><td>提出意见，影响外部接受程度<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "stakeholder-power", "topic": "3.1", "title": "权力与利益矩阵怎样安排沟通", "goal": "权力与利益矩阵怎样安排沟通", "source": "Lecture 2 · PDF第29–31页", "body": "<p>院方负责人能批准预算，也持续关注开放时间。另一个审批单位能决定关键条件，但平时只关注几个审批节点。两者都有较高权力，需要的日常沟通程度可以不同。<\/p><section class=\"concept\"><h2><span lang=\"en\">Power–Interest Grid<\/span><span>权力—利益矩阵<\/span><\/h2><p>Power（权力）表示影响决定或资源的能力；Interest（利益或关注程度）表示对项目结果的关切程度。把两项判断组合成四格图，就能比较不同角色需要怎样的沟通与参与。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>权力<\/th><th>利益或关注<\/th><th>管理方式<\/th><th>具体行动<\/th><\/tr><\/thead><tbody><tr><td>高<\/td><td>高<\/td><td>Manage Closely 密切管理<\/td><td>邀请院方负责人参与关键决定，及时报告影响开放的变化<\/td><\/tr><tr><td>高<\/td><td>低<\/td><td>Keep Satisfied 保持满意<\/td><td>在审批节点提供足够材料，及时报告影响其要求的变化<\/td><\/tr><tr><td>低<\/td><td>高<\/td><td>Keep Informed 保持知情<\/td><td>向接待人员说明使用变化和培训安排，并收集反馈<\/td><\/tr><tr><td>低<\/td><td>低<\/td><td>Monitor 关注变化<\/td><td>保留适当信息渠道，定期检查其处境是否变化<\/td><\/tr><\/tbody><\/table><\/div><p>下方横轴是利益或关注程度，纵轴是权力。位置表示当前判断，不是永久身份。低权力不等于需求不重要；例如无障碍通行需求仍需按项目要求处理。矩阵帮助安排沟通，不能用来取消必须满足的要求。<\/p>", "questions": [{"id": "stakeholder-power-q1", "prompt": "审批人员权力高、日常关注低。医院希望减少无关信息，同时避免漏掉许可条件。哪种安排更合适？", "options": ["只在最终验收时一次提供全部资料", "按审批节点确认要求，并报告会改变这些要求的事项", "每天提供全部现场记录，与院方负责人使用相同频率"], "correct": 1, "feedback": ["等到最终验收可能错过提前满足许可条件的时间。", "Keep Satisfied要求及时满足其关键需求，频率与内容应对应审批工作。", "高权力不意味着每天需要全部细节，关注内容也有差别。"], "ref": "r-stakeholder-power", "contextLesson": "stakeholder-power", "fingerprint": "e848f97d07d6db84", "legacyFingerprint": null}, {"id": "stakeholder-power-q2", "prompt": "接待人员日常使用设备，关注高但决定权低。按权力—利益矩阵，主要沟通策略是哪项？", "options": ["Keep Satisfied 保持满意", "Keep Informed 保持知情", "Monitor 关注变化"], "correct": 1, "feedback": ["保持满意对应高权力、低关注。", "低权力、高关注应保持知情，并收集使用反馈。", "低低才主要采用关注变化。"], "ref": "r-stakeholder-power", "contextLesson": "stakeholder-power", "fingerprint": "3678b97ed829c5d7", "legacyFingerprint": null}], "refs": ["r-stakeholder-power"], "applications": [{"id": "a-stakeholder-power", "kind": "矩阵定位", "prompt": "院方负责人高权力高关注；接待人员低权力高关注；审批人员高权力低关注。画出三人的位置，并各写一项沟通行动。", "answer": "以利益为横轴、权力为纵轴：院方右上、接待人员右下、审批人员左上。行动分别对应关键决定、操作反馈与培训、审批材料与条件确认。若使用不同轴，位置须相应调整并标清。"}], "lab": "powergrid", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "3.1", "order": 94, "priorLesson": "stakeholder-identify", "terms": [["Power–Interest Grid", "权力—利益矩阵", "Power（权力）表示影响决定或资源的能力；Interest（利益或关注程度）表示对项目结果的关切程度。把两项判断组合成四格图，就能比较不同角色需要怎样的沟通与参与。"]], "material": {"context": "院方负责人能批准预算，也持续关注开放时间。另一个审批单位能决定关键条件，但平时只关注几个审批节点。两者都有较高权力，需要的日常沟通程度可以不同。", "terms": [["Power–Interest Grid", "权力—利益矩阵", "Power（权力）表示影响决定或资源的能力；Interest（利益或关注程度）表示对项目结果的关切程度。把两项判断组合成四格图，就能比较不同角色需要怎样的沟通与参与。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>权力<\/th><th>利益或关注<\/th><th>管理方式<\/th><th>具体行动<\/th><\/tr><\/thead><tbody><tr><td>高<\/td><td>高<\/td><td>Manage Closely 密切管理<\/td><td>邀请院方负责人参与关键决定，及时报告影响开放的变化<\/td><\/tr><tr><td>高<\/td><td>低<\/td><td>Keep Satisfied 保持满意<\/td><td>在审批节点提供足够材料，及时报告影响其要求的变化<\/td><\/tr><tr><td>低<\/td><td>高<\/td><td>Keep Informed 保持知情<\/td><td>向接待人员说明使用变化和培训安排，并收集反馈<\/td><\/tr><tr><td>低<\/td><td>低<\/td><td>Monitor 关注变化<\/td><td>保留适当信息渠道，定期检查其处境是否变化<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "stakeholder-cooperation", "topic": "3.1", "title": "合作潜力与威胁潜力矩阵", "goal": "合作潜力与威胁潜力矩阵", "source": "Lecture 2 · PDF第30–31页", "body": "<p>一家设备供应商拥有医院需要的接口技术，合作能帮助系统按期接通；医院也高度依赖它，若它停止支持，开放安排会受到严重影响。这家供应商既有合作潜力，也可能造成较大威胁。<\/p><section class=\"concept\"><h2><span lang=\"en\">Potential for Cooperation / Potential for Threat<\/span><span>合作潜力／威胁潜力<\/span><\/h2><p>合作潜力表示共同工作能给项目带来的支持；威胁潜力表示对方可能妨碍项目目标的程度。它们与权力、关注程度衡量的内容不同。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>合作潜力<\/th><th>威胁潜力<\/th><th>策略<\/th><th>怎样理解<\/th><\/tr><\/thead><tbody><tr><td>低<\/td><td>低<\/td><td>Marginal 边缘型；Monitor 监测<\/td><td>保持观察，发现角色或条件变化<\/td><\/tr><tr><td>高<\/td><td>低<\/td><td>Supportive 支持型；Involve 参与<\/td><td>邀请提供经验、资源与反馈<\/td><\/tr><tr><td>低<\/td><td>高<\/td><td>Non-Supportive 不支持型；Defend 防御<\/td><td>减少依赖，明确边界和替代安排<\/td><\/tr><tr><td>高<\/td><td>高<\/td><td>Mixed Blessing 利弊并存型；Collaborate 协作<\/td><td>建立共同工作机制，同时明确责任与风险分担<\/td><\/tr><\/tbody><\/table><\/div><p>横向由左至右表示威胁潜力低、高；纵向由上至下表示合作潜力低、高。供应商位于右下，属于Mixed Blessing（利弊并存型），适合协作，例如共同确认接口、设定测试节点并约定支持责任。“威胁高”不等于对方一定怀有恶意，也不意味着应立即切断合作。<\/p>", "questions": [{"id": "stakeholder-cooperation-q1", "prompt": "关键供应商既能提供不可替代的接口支持，也可能因停止服务阻碍开放。哪种策略最符合这两个条件？", "options": ["Involve：只邀请它提供意见，不处理依赖与责任", "Collaborate：共同确认接口和测试节点，同时约定支持责任", "Defend：只减少往来，不利用它的接口能力"], "correct": 1, "feedback": ["参与能够获得支持，但未充分处理本例的高威胁潜力。", "高合作、高威胁对应Mixed Blessing，协作同时利用能力并管理依赖。", "单纯防御忽略了高合作潜力，可能使接口更难完成。"], "ref": "r-stakeholder-cooperation", "contextLesson": "stakeholder-cooperation", "fingerprint": "6976eeaee94e76fb", "legacyFingerprint": null}, {"id": "stakeholder-cooperation-q2", "prompt": "供应商现阶段支持项目，医院又高度依赖其接口。关于“支持”和“威胁潜力”，哪项判断最准确？", "options": ["支持态度能够与较高威胁潜力同时存在", "支持态度足以证明威胁潜力低", "只要接口依赖高，就应把合作潜力记低"], "correct": 0, "feedback": ["威胁潜力看可能的不利影响；即使合作意愿好，停止支持的影响仍可能很大。", "当前态度不能消除依赖造成的潜在影响。", "依赖可能同时体现较高合作价值，两个维度需要分别评价。"], "ref": "r-stakeholder-cooperation", "contextLesson": "stakeholder-cooperation", "fingerprint": "ec42cead2a247510", "legacyFingerprint": null}], "refs": ["r-stakeholder-cooperation"], "applications": [{"id": "a-stakeholder-cooperation", "kind": "两张矩阵比较", "prompt": "同一家供应商在权力—利益矩阵中需要密切管理，在合作—威胁矩阵中需要协作，这两个结论矛盾吗？", "answer": "不矛盾。前者说明其决定能力与关注程度，需要较密切参与；后者说明合作价值与潜在影响，需要共同工作及责任安排。两张表可共同支持具体行动，但轴的含义不能互换。"}], "lab": "cooperationgrid", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "3.1", "order": 95, "priorLesson": "stakeholder-power", "terms": [["Potential for Cooperation / Potential for Threat", "合作潜力／威胁潜力", "合作潜力表示共同工作能给项目带来的支持；威胁潜力表示对方可能妨碍项目目标的程度。它们与权力、关注程度衡量的内容不同。"]], "material": {"context": "一家设备供应商拥有医院需要的接口技术，合作能帮助系统按期接通；医院也高度依赖它，若它停止支持，开放安排会受到严重影响。这家供应商既有合作潜力，也可能造成较大威胁。", "terms": [["Potential for Cooperation / Potential for Threat", "合作潜力／威胁潜力", "合作潜力表示共同工作能给项目带来的支持；威胁潜力表示对方可能妨碍项目目标的程度。它们与权力、关注程度衡量的内容不同。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>合作潜力<\/th><th>威胁潜力<\/th><th>策略<\/th><th>怎样理解<\/th><\/tr><\/thead><tbody><tr><td>低<\/td><td>低<\/td><td>Marginal 边缘型；Monitor 监测<\/td><td>保持观察，发现角色或条件变化<\/td><\/tr><tr><td>高<\/td><td>低<\/td><td>Supportive 支持型；Involve 参与<\/td><td>邀请提供经验、资源与反馈<\/td><\/tr><tr><td>低<\/td><td>高<\/td><td>Non-Supportive 不支持型；Defend 防御<\/td><td>减少依赖，明确边界和替代安排<\/td><\/tr><tr><td>高<\/td><td>高<\/td><td>Mixed Blessing 利弊并存型；Collaborate 协作<\/td><td>建立共同工作机制，同时明确责任与风险分担<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "stakeholder-communication", "topic": "3.1", "title": "把参与分析写成沟通安排", "goal": "把参与分析写成沟通安排", "source": "Lecture 2 · PDF第32–36页", "body": "<p>接待主管担心新系统增加登记步骤，因此不支持上线。每天给他转发进度表，未必能解决这个担忧。项目经理可以请他带着实际登记流程试用，记录多出的步骤，再一起调整方案。<\/p><section class=\"concept\"><h2><span lang=\"en\">Stakeholder Engagement<\/span><span>利益相关者参与<\/span><\/h2><p>利益相关者了解、支持或参与项目工作的情况。项目经理比较当前状态与所需状态，找出需要采取的行动。例如，接待主管需要先试用并讨论流程，才能判断是否支持新安排。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Communication Plan<\/span><span>沟通计划<\/span><\/h2><p>明确谁向谁提供什么信息、何时提供、通过什么渠道，以及如何收到反馈或决定。它把参与分析转成可执行的联系安排。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>参与状态<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>Unaware 不知情<\/td><td>尚不了解项目及其影响<\/td><\/tr><tr><td>Resistant 抵制<\/td><td>了解后持反对或阻碍态度<\/td><\/tr><tr><td>Neutral 中立<\/td><td>了解但尚未明确支持或反对<\/td><\/tr><tr><td>Supportive 支持<\/td><td>愿意配合项目<\/td><\/tr><tr><td>Leading 主动推动<\/td><td>积极推动成果与相关改变<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-scroll\"><table><thead><tr><th>对象<\/th><th>当前→期望<\/th><th>行动<\/th><th>负责人、时间与渠道<\/th><\/tr><\/thead><tbody><tr><td>接待主管<\/td><td>抵制→支持<\/td><td>演示真实登记流程，记录新增步骤并一起评审<\/td><td>项目经理，周三现场试用，下周复查意见<\/td><\/tr><tr><td>院方负责人<\/td><td>支持→主动推动关键决定<\/td><td>说明待决定事项、选项和影响<\/td><td>项目经理，每周简报，紧急事项单独报告<\/td><\/tr><\/tbody><\/table><\/div><p>期望状态应符合角色需要，不必让所有人都成为主动推动者。发送信息后还要确认对方是否理解、是否需要作决定，以及问题是否得到回应。随着阶段和影响变化，登记册、参与分析和沟通安排一起更新。<\/p>", "questions": [{"id": "stakeholder-communication-q1", "prompt": "接待主管因登记步骤增加而抵制新系统。以下哪项更可能帮助改变这项具体担忧？", "options": ["安排他试走登记流程，共同修改多余步骤并复查", "请院方负责人重申项目的重要性，暂不讨论操作细节", "增加进度简报，让他更熟悉上线日期"], "correct": 0, "feedback": ["让行动针对抵制原因，并取得可观察的流程变化。", "权威支持可能推动决定，但尚未解决他提出的使用问题。", "日期信息没有解释或减少操作负担。"], "ref": "r-stakeholder-communication", "contextLesson": "stakeholder-communication", "fingerprint": "8de3ceaf1176aa2b", "legacyFingerprint": null}, {"id": "stakeholder-communication-q2", "prompt": "院方必须周五决定是否增设终端。哪条沟通安排最可执行？", "options": ["采购员周五晚上发送设备报价，项目经理下周再汇总", "每周向所有人发送完整进度表，不单列待决定事项", "项目经理周三发送选项与成本工期影响，周四讨论，请授权人周五前记录决定"], "correct": 2, "feedback": ["这个时点无法支持周五前作决定。", "一般报告可能遗漏具体决策与时限。", "对象、内容、时间、责任和反馈都与周五决定对应。"], "ref": "r-stakeholder-communication", "contextLesson": "stakeholder-communication", "fingerprint": "4139ce5819fc517f", "legacyFingerprint": null}], "refs": ["r-stakeholder-communication"], "applications": [{"id": "a-stakeholder-communication", "kind": "编写沟通计划", "prompt": "院方需在周五前决定是否增加终端。写一条能执行的沟通安排，包括需要收到的内容和反馈。", "answer": "项目经理在周三向院方负责人发送当前需求、两个选项、成本工期与资源影响，周四讨论；请授权人周五前记录批准或不批准及条件，项目经理再通知采购与安装负责人。"}], "lab": null, "drill": {"id": "stakeholder-communication-d", "prompt": "某接待主管了解新系统，但担心流程变慢而反对。他参加试用、提出修改并愿意配合培训后，再评价当前状态。", "fields": [{"key": "before", "label": "试用前的参与状态", "type": "select", "options": ["Unaware 不知情", "Resistant 抵制", "Neutral 中立", "Supportive 支持"], "answer": 1}, {"key": "after", "label": "上述行动后的状态", "type": "select", "options": ["Unaware 不知情", "Resistant 抵制", "Neutral 中立", "Supportive 支持"], "answer": 3}], "explanation": "已了解却反对属于抵制；愿意配合并提出建设性反馈支持“支持”的判断。不能只因收到通知就把状态改为支持。", "guided": false, "fingerprint": "77d1bede84ce651a"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "3.1", "order": 96, "priorLesson": "stakeholder-cooperation", "terms": [["Stakeholder Engagement", "利益相关者参与", "利益相关者了解、支持或参与项目工作的情况。项目经理比较当前状态与所需状态，找出需要采取的行动。例如，接待主管需要先试用并讨论流程，才能判断是否支持新安排。"], ["Communication Plan", "沟通计划", "明确谁向谁提供什么信息、何时提供、通过什么渠道，以及如何收到反馈或决定。它把参与分析转成可执行的联系安排。"]], "material": {"context": "接待主管担心新系统增加登记步骤，因此不支持上线。每天给他转发进度表，未必能解决这个担忧。项目经理可以请他带着实际登记流程试用，记录多出的步骤，再一起调整方案。", "terms": [["Stakeholder Engagement", "利益相关者参与", "利益相关者了解、支持或参与项目工作的情况。项目经理比较当前状态与所需状态，找出需要采取的行动。例如，接待主管需要先试用并讨论流程，才能判断是否支持新安排。"], ["Communication Plan", "沟通计划", "明确谁向谁提供什么信息、何时提供、通过什么渠道，以及如何收到反馈或决定。它把参与分析转成可执行的联系安排。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>参与状态<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>Unaware 不知情<\/td><td>尚不了解项目及其影响<\/td><\/tr><tr><td>Resistant 抵制<\/td><td>了解后持反对或阻碍态度<\/td><\/tr><tr><td>Neutral 中立<\/td><td>了解但尚未明确支持或反对<\/td><\/tr><tr><td>Supportive 支持<\/td><td>愿意配合项目<\/td><\/tr><tr><td>Leading 主动推动<\/td><td>积极推动成果与相关改变<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><thead><tr><th>对象<\/th><th>当前→期望<\/th><th>行动<\/th><th>负责人、时间与渠道<\/th><\/tr><\/thead><tbody><tr><td>接待主管<\/td><td>抵制→支持<\/td><td>演示真实登记流程，记录新增步骤并一起评审<\/td><td>项目经理，周三现场试用，下周复查意见<\/td><\/tr><tr><td>院方负责人<\/td><td>支持→主动推动关键决定<\/td><td>说明待决定事项、选项和影响<\/td><td>项目经理，每周简报，紧急事项单独报告<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "organization-forms", "topic": "3.2", "title": "组织结构怎样影响人员和决定权", "goal": "组织结构怎样影响人员和决定权", "source": "Lecture 2 · PDF第42–55、60页", "body": "<p>设备安装需要工程部与信息技术部合作。若所有决定都由各部门经理分别处理，项目经理可能需要多次协调；若为医院建设成立专职团队，决定可以集中，代价是人员较难与其他项目共享。组织结构影响这些安排。<\/p><section class=\"concept\"><h2><span lang=\"en\">Functional / Projectized / Matrix Organization<\/span><span>职能型／项目型／矩阵型组织<\/span><\/h2><p>职能型按专业部门管理人员；项目型围绕项目设置较专职的团队；矩阵型让项目负责人和职能负责人共同参与管理，以共享专业资源。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>结构<\/th><th>主要优点<\/th><th>需要处理的问题<\/th><\/tr><\/thead><tbody><tr><td>职能型<\/td><td>专业积累和职业路径稳定，人员按部门管理<\/td><td>跨部门响应较慢，项目目标可能让位于部门任务<\/td><\/tr><tr><td>项目型<\/td><td>项目经理权力较集中，沟通和决定较直接<\/td><td>可能重复配置资源，结束后需安置人员<\/td><\/tr><tr><td>矩阵型<\/td><td>共享稀缺专业人员，同时关注项目交付<\/td><td>双重汇报、资源优先级和权责冲突<\/td><\/tr><\/tbody><\/table><\/div><p>Weak Matrix（弱矩阵）中职能经理权力较大；Balanced Matrix（平衡矩阵）中双方共享权力；Strong Matrix（强矩阵）中项目经理权力较大。无论采用哪种，都需要明确谁决定任务、人员时间和专业标准。<\/p><div class=\"worked-example\"><h3>共享同一位接口工程师<\/h3><p>接待区与药房都需要接口工程师。矩阵安排可以保留专业部门支持，同时让两位项目经理提出需求；有权分配资源的人再确定优先级和预约时段。给工程师画两条汇报线，并不会自动解决冲突。<\/p><\/div>", "questions": [{"id": "organization-forms-q1", "prompt": "多个项目共用稀缺工程师，同时保留专业部门培训。矩阵结构最需要明确哪组安排？", "options": ["专业与项目双重管理下的资源权限、优先级和冲突处理", "只给每个项目经理同等调度权，不规定冲突时由谁决定", "只明确工程师的专业职称，不规定项目任务决定权"], "correct": 0, "feedback": ["共享资源需要清楚的权责与协调。", "同等调度权仍可能产生无法同时满足的要求。", "专业归属不能替代任务安排。"], "ref": "r-organization-forms", "contextLesson": "organization-forms", "fingerprint": "3446ea8ec725b80f", "legacyFingerprint": null}, {"id": "organization-forms-q2", "prompt": "工程师由职能经理安排工作时段，项目经理主要汇总需求与协调，不能直接调配人员。这更接近哪种结构？", "options": ["强矩阵", "弱矩阵", "平衡矩阵"], "correct": 1, "feedback": ["强矩阵中项目经理对项目资源的权限更大。", "权力主要留在职能经理，符合弱矩阵。", "平衡矩阵会更明确地共享项目与职能权力。"], "ref": "r-organization-forms", "contextLesson": "organization-forms", "fingerprint": "8e8459fee3f95df8", "legacyFingerprint": null}], "refs": ["r-organization-forms"], "applications": [{"id": "a-organization-forms", "kind": "选择并画组织关系", "prompt": "医院有三个跨部门项目，接口工程师很少且需保持专业培训。提出一种组织安排，画出工程师与项目经理、职能经理的关系，并写明资源冲突由谁决定。", "answer": "可论证矩阵型：工程师保留职能归属，同时承担项目任务。图中标出专业管理与项目任务关系，再明确资源分配权限、优先级及升级渠道。其他安排也可成立，但必须说明人员可用性和专业支持怎样保证。"}], "lab": "organization", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "3.2", "order": 97, "priorLesson": null, "terms": [["Functional / Projectized / Matrix Organization", "职能型／项目型／矩阵型组织", "职能型按专业部门管理人员；项目型围绕项目设置较专职的团队；矩阵型让项目负责人和职能负责人共同参与管理，以共享专业资源。"]], "material": {"context": "设备安装需要工程部与信息技术部合作。若所有决定都由各部门经理分别处理，项目经理可能需要多次协调；若为医院建设成立专职团队，决定可以集中，代价是人员较难与其他项目共享。组织结构影响这些安排。", "terms": [["Functional / Projectized / Matrix Organization", "职能型／项目型／矩阵型组织", "职能型按专业部门管理人员；项目型围绕项目设置较专职的团队；矩阵型让项目负责人和职能负责人共同参与管理，以共享专业资源。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>结构<\/th><th>主要优点<\/th><th>需要处理的问题<\/th><\/tr><\/thead><tbody><tr><td>职能型<\/td><td>专业积累和职业路径稳定，人员按部门管理<\/td><td>跨部门响应较慢，项目目标可能让位于部门任务<\/td><\/tr><tr><td>项目型<\/td><td>项目经理权力较集中，沟通和决定较直接<\/td><td>可能重复配置资源，结束后需安置人员<\/td><\/tr><tr><td>矩阵型<\/td><td>共享稀缺专业人员，同时关注项目交付<\/td><td>双重汇报、资源优先级和权责冲突<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "organization-pmo", "topic": "3.2", "title": "PMO提供支持还是直接管理", "goal": "PMO提供支持还是直接管理", "source": "Lecture 2 · PDF第56–59页", "body": "<p>医院的多个项目使用不同的预算表，资源预约也经常冲突。院方可以设一个专门单位，提供统一做法、检查是否遵守规则，或直接负责部分项目。具体职责需要写清，不能只靠部门名称判断。<\/p><section class=\"concept\"><h2><span lang=\"en\">Project Management Office (PMO)<\/span><span>项目管理办公室<\/span><\/h2><p>为项目提供集中支持、标准、资源或直接管理的组织单位。授权程度和作用应由组织需要决定。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>类型<\/th><th>控制程度与作用<\/th><\/tr><\/thead><tbody><tr><td>Supportive 支持型<\/td><td>控制较低，提供模板、培训与咨询<\/td><\/tr><tr><td>Controlling 控制型<\/td><td>控制中等，要求采用规定流程和标准并检查遵守情况<\/td><\/tr><tr><td>Directive 指令型<\/td><td>控制较高，直接管理项目与项目经理<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-scroll\"><table><thead><tr><th>另一组功能描述<\/th><th>侧重的工作<\/th><\/tr><\/thead><tbody><tr><td>Weather Station 气象站<\/td><td>收集并报告各项目状态<\/td><\/tr><tr><td>Control Tower 控制塔<\/td><td>建立标准并改善项目执行<\/td><\/tr><tr><td>Resource Pool 资源池<\/td><td>提供受过训练的项目管理人员<\/td><\/tr><tr><td>Command and Control 指挥控制<\/td><td>拥有直接指挥和管理权限<\/td><\/tr><\/tbody><\/table><\/div><p>两组名称描述角度不同，不能逐行机械对应。若PMO只提供模板，就不能据此假定它有权调动工程师；若院方希望它统一资源安排，应把授权、冲突处理和责任一起明确。<\/p>", "questions": [{"id": "organization-pmo-q1", "prompt": "PMO提供模板和咨询，项目是否采用由团队决定。这主要属于什么类型？", "options": ["Supportive 支持型", "Directive 指令型", "Controlling 控制型"], "correct": 0, "feedback": ["重点是支持，控制程度较低。", "指令型直接管理项目。", "控制型通常要求遵守规定。"], "ref": "r-organization-pmo", "contextLesson": "organization-pmo", "fingerprint": "dfa967f8a89783c2", "legacyFingerprint": null}, {"id": "organization-pmo-q2", "prompt": "PMO的职责是汇总状态和提供咨询，资源调配权仍在院方。两个项目争用工程师时，哪项行动符合当前授权？", "options": ["要求双方采用同一模板，并据此记录冲突已解决", "根据报告中较紧急的项目直接改写工程师排班", "汇总冲突与备选安排，请院方决定优先级"], "correct": 2, "feedback": ["统一信息有助发现问题，未改变相互冲突的安排。", "信息汇总职责不自动包含调配权限。", "状态与方案支持决定，调配仍由获授权者作出。"], "ref": "r-organization-pmo", "contextLesson": "organization-pmo", "fingerprint": "84fac5893eb5fc03", "legacyFingerprint": null}], "refs": ["r-organization-pmo"], "applications": [{"id": "a-organization-pmo", "kind": "职责设计", "prompt": "医院主要问题是资源预约冲突，但团队建议只增加一套报告模板。说明模板可以解决什么，还需补什么安排。", "answer": "模板可以统一人员需求信息；还需共同资源日历、决定优先级的授权人、更新责任与冲突升级流程。PMO是否执行调配取决于明确授权，不能把收集信息误作已经解决冲突。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "3.2", "order": 98, "priorLesson": "organization-forms", "terms": [["Project Management Office (PMO)", "项目管理办公室", "为项目提供集中支持、标准、资源或直接管理的组织单位。授权程度和作用应由组织需要决定。"]], "material": {"context": "医院的多个项目使用不同的预算表，资源预约也经常冲突。院方可以设一个专门单位，提供统一做法、检查是否遵守规则，或直接负责部分项目。具体职责需要写清，不能只靠部门名称判断。", "terms": [["Project Management Office (PMO)", "项目管理办公室", "为项目提供集中支持、标准、资源或直接管理的组织单位。授权程度和作用应由组织需要决定。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>类型<\/th><th>控制程度与作用<\/th><\/tr><\/thead><tbody><tr><td>Supportive 支持型<\/td><td>控制较低，提供模板、培训与咨询<\/td><\/tr><tr><td>Controlling 控制型<\/td><td>控制中等，要求采用规定流程和标准并检查遵守情况<\/td><\/tr><tr><td>Directive 指令型<\/td><td>控制较高，直接管理项目与项目经理<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><thead><tr><th>另一组功能描述<\/th><th>侧重的工作<\/th><\/tr><\/thead><tbody><tr><td>Weather Station 气象站<\/td><td>收集并报告各项目状态<\/td><\/tr><tr><td>Control Tower 控制塔<\/td><td>建立标准并改善项目执行<\/td><\/tr><tr><td>Resource Pool 资源池<\/td><td>提供受过训练的项目管理人员<\/td><\/tr><tr><td>Command and Control 指挥控制<\/td><td>拥有直接指挥和管理权限<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "organization-culture", "topic": "3.2", "title": "从实际做法观察组织文化", "goal": "从实际做法观察组织文化", "source": "Lecture 2 · PDF第62–70页", "body": "<p>医院管理层说“发现问题要及时报告”，员工却看到提前报告延期的人受到批评，隐瞒问题的人反而获得表扬。团队实际遵循的奖励规则，可能比口号更能影响行为。<\/p><section class=\"concept\"><h2><span lang=\"en\">Organizational Culture<\/span><span>组织文化<\/span><\/h2><p>成员共同形成的信念、价值、规范和行为方式。可以通过日常互动、组织资料、工作空间、故事，以及实际奖励和处罚来观察。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>观察角度<\/th><th>可以调查的问题<\/th><\/tr><\/thead><tbody><tr><td>Member Identity 成员认同；Team Emphasis 团队导向<\/td><td>人员更认同专业部门还是整体项目，是否鼓励合作<\/td><\/tr><tr><td>People Focus 人员关注；Unit Integration 部门整合<\/td><td>决定是否考虑人员影响，部门是否共享信息<\/td><\/tr><tr><td>Control 控制；Risk Tolerance 风险容忍<\/td><td>规则怎样执行，是否允许合理试验<\/td><\/tr><tr><td>Reward Criteria 奖励标准；Conflict Tolerance 冲突容忍<\/td><td>奖励实际结果还是表面服从，能否提出不同意见<\/td><\/tr><tr><td>Means–Ends Orientation 手段与结果；Open-system Focus 开放性<\/td><td>是否只看结果，是否关注外部环境和反馈<\/td><\/tr><\/tbody><\/table><\/div><p>技术、环境、地理分布、规则、奖励、关键成员和重大事件都可能影响文化。项目经理需要用具体行为判断：延期是否及时报告、跨部门是否共享资料、错误是否用于改进。宣传材料只能提供一部分证据。<\/p>", "questions": [{"id": "organization-culture-q1", "prompt": "团队口头鼓励报告风险，却惩罚提前报告延期的人。成员后来隐瞒问题，最直接应调查什么？", "options": ["实际奖惩怎样影响成员的报告行为", "各项目使用的技术是否一致", "宣传资料如何定义团队价值"], "correct": 0, "feedback": ["题目中的具体行为与奖惩后果直接相关。", "技术差异可能影响工作，但这里已有更直接的行为证据。", "口头表述只是部分证据，已出现实际做法冲突。"], "ref": "r-organization-culture", "contextLesson": "organization-culture", "fingerprint": "8af34cc8e5428b3e", "legacyFingerprint": null}, {"id": "organization-culture-q2", "prompt": "医院想判断跨部门合作是否形成日常做法，哪项证据更直接？", "options": ["部门按共同接口表更新资料，并在联合测试前主动协调", "每个部门各自都按时完成本部门任务", "制度文件中写有“加强协作”"], "correct": 0, "feedback": ["实际共享与协调对应跨部门合作。", "各自按时仍可能在接口处留下缺口。", "制度表达意图，还需实施证据。"], "ref": "r-organization-culture", "contextLesson": "organization-culture", "fingerprint": "f0a54a4b6fcfa126", "legacyFingerprint": null}], "refs": ["r-organization-culture"], "applications": [{"id": "a-organization-culture", "kind": "文化与改进", "prompt": "每个部门只因本部门按时结束获奖，结果设备安装完成后无人愿意协助联合测试。提出一个与原因对应的改进。", "answer": "把共同交付和联合测试结果纳入相关部门评价，提前明确接口责任与所需人员，并跟踪协作结果。仅要求“加强合作”没有改变原奖励和责任安排。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "3.2", "order": 99, "priorLesson": "organization-pmo", "terms": [["Organizational Culture", "组织文化", "成员共同形成的信念、价值、规范和行为方式。可以通过日常互动、组织资料、工作空间、故事，以及实际奖励和处罚来观察。"]], "material": {"context": "医院管理层说“发现问题要及时报告”，员工却看到提前报告延期的人受到批评，隐瞒问题的人反而获得表扬。团队实际遵循的奖励规则，可能比口号更能影响行为。", "terms": [["Organizational Culture", "组织文化", "成员共同形成的信念、价值、规范和行为方式。可以通过日常互动、组织资料、工作空间、故事，以及实际奖励和处罚来观察。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>观察角度<\/th><th>可以调查的问题<\/th><\/tr><\/thead><tbody><tr><td>Member Identity 成员认同；Team Emphasis 团队导向<\/td><td>人员更认同专业部门还是整体项目，是否鼓励合作<\/td><\/tr><tr><td>People Focus 人员关注；Unit Integration 部门整合<\/td><td>决定是否考虑人员影响，部门是否共享信息<\/td><\/tr><tr><td>Control 控制；Risk Tolerance 风险容忍<\/td><td>规则怎样执行，是否允许合理试验<\/td><\/tr><tr><td>Reward Criteria 奖励标准；Conflict Tolerance 冲突容忍<\/td><td>奖励实际结果还是表面服从，能否提出不同意见<\/td><\/tr><tr><td>Means–Ends Orientation 手段与结果；Open-system Focus 开放性<\/td><td>是否只看结果，是否关注外部环境和反馈<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "organization-conflict", "topic": "3.2", "title": "根据问题与时间选择冲突处理方式", "goal": "根据问题与时间选择冲突处理方式", "source": "Lecture 2 · PDF第71–72页", "body": "<p>安装负责人希望周五切换系统，接待主管担心当天患者太多。双方并非必然有一方不配合：他们分别承担安装进度与持续服务的责任。项目经理先核实冲突的事实和条件，再决定怎样处理。<\/p><section class=\"concept\"><h2><span lang=\"en\">Conflict Management<\/span><span>冲突管理<\/span><\/h2><p>针对目标、资源、信息或关系上的分歧，选择合适的处理办法。问题重要程度、时间、关系和决定权限都会影响选择。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>方式<\/th><th>什么时候可能合适<\/th><th>需要注意什么<\/th><\/tr><\/thead><tbody><tr><td>Avoiding 回避<\/td><td>问题暂不重要，或需要先补充事实再谈<\/td><td>不能用拖延处理紧急的重要问题<\/td><\/tr><tr><td>Accommodating 迁就<\/td><td>对方诉求重要，而自己让步代价较小<\/td><td>反复单方面让步可能留下未解决问题<\/td><\/tr><tr><td>Competing 竞争／强制<\/td><td>时间紧迫且有明确权限，需要执行必要决定<\/td><td>可能影响关系，也不应超越授权<\/td><\/tr><tr><td>Compromising 妥协<\/td><td>双方各让一部分以尽快达成可接受安排<\/td><td>不一定解决根本原因<\/td><\/tr><tr><td>Collaborating 合作<\/td><td>问题重要，有时间共同调查需求并寻找更好方案<\/td><td>需要信息与参与，不能假定总能立即达成<\/td><\/tr><\/tbody><\/table><\/div><div class=\"worked-example\"><h3>处理切换日期分歧<\/h3><p>若还有一周时间，可以共同比较患者流量、安装准备和备用服务，选择低流量时段并安排回退。若现场已出现紧急危险，有权负责人应先按应急权限停止相关工作，再调查和沟通。不同时间条件需要不同做法。<\/p><\/div>", "questions": [{"id": "organization-conflict-q1", "prompt": "切换还有一周，双方目标都重要，已有资料可比较。哪种做法最适合先尝试？", "options": ["不调查就各缩短一半要求", "等到切换当天再讨论", "共同分析服务与安装条件，寻找双方可接受的安排"], "correct": 2, "feedback": ["机械折半未必满足技术或服务要求。", "拖到当天会减少可选方案。", "有时间与信息时，合作有助于同时处理双方目标。"], "ref": "r-organization-conflict", "contextLesson": "organization-conflict", "fingerprint": "a35ac592cfcb128a", "legacyFingerprint": null}, {"id": "organization-conflict-q2", "prompt": "经理让双方各放弃一部分要求，以尽快达成临时方案。主要属于什么方式？", "options": ["妥协", "迁就一方的全部要求", "合作找到完全满足原需求的方案"], "correct": 0, "feedback": ["双方各让一步符合妥协。", "迁就通常表现为一方让步满足另一方。", "题目是双方让步，不是已找到兼顾原需求的新办法。"], "ref": "r-organization-conflict", "contextLesson": "organization-conflict", "fingerprint": "e0a2a72fbd6d7b9c", "legacyFingerprint": null}], "refs": ["r-organization-conflict"], "applications": [{"id": "a-organization-conflict", "kind": "案例分析", "prompt": "接口工程师与接待主管对测试顺序有分歧，原因是双方不知道对方的完成期限。请分别说明事实调查、处理方式和后续记录。", "answer": "先核实双方期限、前置条件、所需人员和延误后果；信息补齐后共同安排可行顺序，必要时由有权者决定优先级。记录负责人、时间和变更通知，避免下周重新争论同一个事实。"}], "lab": null, "drill": {"id": "organization-conflict-d", "prompt": "分别识别两种处理过程。", "fields": [{"key": "compromise", "label": "双方各让出一部分要求以快速达成安排", "type": "select", "options": ["回避", "迁就", "竞争", "妥协", "合作"], "answer": 3}, {"key": "collaborate", "label": "双方调查实际需要，调整方案以同时满足重要目标", "type": "select", "options": ["回避", "迁就", "竞争", "妥协", "合作"], "answer": 4}], "explanation": "妥协侧重相互让步；合作侧重理解需要并共同解决问题。选择哪种仍要结合可用时间和问题性质。", "guided": false, "fingerprint": "c8506094baf60a23"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "3.2", "order": 100, "priorLesson": "organization-culture", "terms": [["Conflict Management", "冲突管理", "针对目标、资源、信息或关系上的分歧，选择合适的处理办法。问题重要程度、时间、关系和决定权限都会影响选择。"]], "material": {"context": "安装负责人希望周五切换系统，接待主管担心当天患者太多。双方并非必然有一方不配合：他们分别承担安装进度与持续服务的责任。项目经理先核实冲突的事实和条件，再决定怎样处理。", "terms": [["Conflict Management", "冲突管理", "针对目标、资源、信息或关系上的分歧，选择合适的处理办法。问题重要程度、时间、关系和决定权限都会影响选择。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>方式<\/th><th>什么时候可能合适<\/th><th>需要注意什么<\/th><\/tr><\/thead><tbody><tr><td>Avoiding 回避<\/td><td>问题暂不重要，或需要先补充事实再谈<\/td><td>不能用拖延处理紧急的重要问题<\/td><\/tr><tr><td>Accommodating 迁就<\/td><td>对方诉求重要，而自己让步代价较小<\/td><td>反复单方面让步可能留下未解决问题<\/td><\/tr><tr><td>Competing 竞争／强制<\/td><td>时间紧迫且有明确权限，需要执行必要决定<\/td><td>可能影响关系，也不应超越授权<\/td><\/tr><tr><td>Compromising 妥协<\/td><td>双方各让一部分以尽快达成可接受安排<\/td><td>不一定解决根本原因<\/td><\/tr><tr><td>Collaborating 合作<\/td><td>问题重要，有时间共同调查需求并寻找更好方案<\/td><td>需要信息与参与，不能假定总能立即达成<\/td><\/tr><\/tbody><\/table><\/div>"]}}], "refs": [{"id": "overview", "title": "Project Scheduling · 项目进度计划", "lesson": 0, "definition": "Project Scheduling（项目进度计划）是根据各项工作的工期与先后要求，安排开始和完成时间的过程。", "formula": "列出工作与前置关系 → 整理活动信息表 → 绘制网络图 → 计算时间 → 判断时差与关键路径。", "example": "医院接待区准备开放时，设计师设计指路牌，工人制作并安装指路牌，另一组人员安装电脑和取号设备。负责人需要安排这些工作，并确定何时可以完成最后的检查。", "pitfall": "先确定工作内容与前置关系，再计算时间。调整图中方框的位置，不会改变工作之间的依赖。", "topic": "5.1", "terms": [], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>内容<\/th><th>PDF页码<\/th><\/tr><\/thead><tbody><tr><td>活动、先后关系与网络图<\/td><td>Lecture 4，第8–27页<\/td><\/tr><tr><td>三点工期估计<\/td><td>Lecture 4，第28–36页<\/td><\/tr><tr><td>正推、逆推、时差与关键路径<\/td><td>Lecture 4，第37–54页<\/td><\/tr><tr><td>完工概率与目标期限<\/td><td>Lecture 4，第55–63页<\/td><\/tr><tr><td>综合练习<\/td><td>Lecture 4，第65–67页<\/td><\/tr><tr><td>Work Breakdown Structure（WBS），工作分解结构：将项目拆成可管理的工作部分<\/td><td>Lecture 3: Project Scope Management，第23–26页<\/td><\/tr><tr><td>Gantt Chart，甘特图：用横条表示工作起止时间<\/td><td>Lecture 5: Project Schedule and Cost Management (II)，第43–45页<\/td><\/tr><\/tbody><\/table><\/div>"], "formulae": [], "source": "Lecture 4 · Project Schedule and Cost Management (I)"}, {"id": "model", "title": "案例的工作安排和计时方式", "lesson": 0, "definition": "医院接待区装修已经完成。设计师负责指路牌图样，两组人员分别安装设备和指路牌，最后由负责人一起检查。每项工作都在紧前工作完成后开始；完成后没有额外的等待期。", "formula": "Finish-to-Start（FS）：前一项完成后，后一项才能开始。零滞后：没有额外规定的等待时间。工期单位为天，项目开始时记为0。", "example": "负责人用2天确认要求，在时点2完成。设计师随即开始设计，工作3天，在时点5完成。", "pitfall": "计算中按连续时间安排，所需人员可以按时到位。若多项工作共用同一组人员，还需要安排人员的使用顺序。", "topic": "5.1", "terms": [["Gantt Chart / Milestone", "甘特图 / 里程碑", "甘特图用横轴表示时间，每条横条表示一项活动从开始到完成的区间。里程碑是重要事件，例如“接待区检查通过”，工期为0。检查工作需要1天，检查通过则是这项工作完成后的一个时点。"]], "tables": [], "formulae": [], "source": "Lecture 4 · 第37–63页；Lecture 5 · 第43–45页"}, {"id": "activity", "title": "Activity / Duration · 活动与工期", "lesson": 1, "definition": "Activity（活动）是项目中一项需要执行的具体工作。Duration（工期）是完成这项工作所需的时间。", "formula": "完成时间 = 开始时间 + 工期。", "example": "设计师周二上午开始设计指路牌，周五上午完成。活动是“设计指路牌”，工期是3天，开始和完成时间分别为周二上午、周五上午。", "pitfall": "工期表示需要多久。工期为3天的工作从时点2开始，会在时点5完成。", "topic": "5.1", "terms": [["Activity", "活动", "项目中一项需要执行的具体工作。例如，给一家医院的服务台安装电脑和取号设备，就是一项活动。活动名称应当顾名思义，让人知道具体要做什么。"], ["Duration", "工期（历时）", "完成一项活动所需的时间。例如，设计师完成指路牌图样需要3天，这项活动的工期就是3天。"]], "tables": [], "formulae": [], "source": "Lecture 4 · 第8、12、29–30页"}, {"id": "relations", "title": "Predecessor / Successor · 前置与后续活动", "lesson": 2, "definition": "Predecessor（前置活动）是需要先完成的工作，Successor（后续活动）是在它之后进行的工作。Immediate Predecessor（紧前活动）是直接为当前工作提供开始条件的前置活动。 Immediate Successor（紧后活动）是直接依赖当前工作完成的后续活动。", "formula": "Finish-to-Start（FS）：后续活动的开始时间 ≥ 前置活动的完成时间。", "example": "假设负责人先确认设备和指路牌的要求（A），设计师再设计指路牌（B），工人最后制作并安装指路牌（D）。顺序为A→B→D；B是D的紧前活动，A通过B间接影响D。", "pitfall": "Concurrent Activities（并行活动）可以分别进行，例如设计师设计指路牌时，另一组人安装设备。可以同时开始的工作，也可以在不同时间完成。", "topic": "5.1", "terms": [["Activity Information", "活动信息表", "我们可以用一张表记录每项活动的名称、工期和前置关系。每行对应一项活动；阅读同一行，就能知道要做什么、需要多久，以及开始前要等哪些工作完成。"]], "tables": [], "formulae": [], "source": "Lecture 4 · 第12–13、24–27、34–36页"}, {"id": "read", "title": "Activity Information · 活动信息表", "lesson": 3, "definition": "Activity Information（活动信息表）按行记录工作。每行一项活动，列出Activity ID（编号）、Description（工作内容）、Duration（工期）和Immediate Predecessor（紧前活动）。侧重工期的表也称Activity Duration Table（活动工期表）。", "formula": "读同一行，就能知道做什么、需要多久、开始前要完成哪些工作。", "example": "D这一行写“制作并安装指路牌｜2天｜B”：工人需要2天，开始前要等B（设计指路牌）完成。", "pitfall": "表格的行序用于展示活动。实际的先后关系由紧前活动列决定；多个紧前活动表示它们都要完成。", "topic": "5.1", "terms": [], "tables": [], "formulae": [], "source": "综合应用：Lecture 4 · 第65–67页"}, {"id": "aon", "title": "PND / AON · 项目网络图与活动节点法", "lesson": 4, "definition": "Project Network Diagram（PND，项目网络图）表示活动之间的先后关系。Activity-on-Node（AON，活动节点法）用方框表示活动，用箭头表示依赖。沿箭头经过的活动序列称为Path（路径）。", "formula": "箭头从紧前活动指向后续活动。Merge Activity（汇聚活动）有多个紧前活动；Burst Activity（发散活动）有多个直接后续活动。", "example": "E（检查设备和指路牌是否符合要求）开始前，C（安装电脑和取号设备）和D（制作并安装指路牌）都要完成，因此分别画C→E和D→E。E是汇聚活动。", "pitfall": "箭头的方向表示工作顺序，长度不表示工期。另一种Activity-on-Arrow（AOA，活动箭线法）用箭头表示活动，用节点表示事件。", "topic": "5.1", "terms": [], "tables": [], "formulae": [], "source": "综合应用：Lecture 4 · 第65–67页"}, {"id": "forward", "title": "正推 Forward Pass：ES / EF", "lesson": 5, "definition": "Forward Pass（正推）按活动顺序从前往后计算。Early Start（ES，最早开始）是全部紧前工作完成后可以开始的最早时间；Early Finish（EF，最早完成）等于ES加上工期d。", "formula": "起点ES=0；ES=max(紧前活动的EF)；EF=ES+d；项目总工期T=max(末端活动的EF)。max表示取最大值。", "example": "C（安装电脑和取号设备）在8完成，D（制作并安装指路牌）在7完成。E（检查设备和指路牌是否符合要求）要等两项都完成，所以ES=max(8,7)=8。检查需要1天，因此EF=9。", "pitfall": "两项工作可以并行时，取较晚的完成时间。把8与7相加，会重复计算已经同时经过的时间。", "topic": "5.1", "terms": [], "tables": [], "formulae": [], "source": "综合应用：Lecture 4 · 第65–67页"}, {"id": "backward", "title": "逆推 Backward Pass：LS / LF", "lesson": 6, "definition": "Backward Pass（逆推）从项目完成时间向前计算。Late Finish（LF，最迟完成）是一项工作不推迟项目完工时最晚可以完成的时间；Late Start（LS，最迟开始）等于LF减去工期d。", "formula": "末端活动LF=T；LF=min(紧后活动的LS)；LS=LF−d。min表示取最小值，T为项目完成时间。", "example": "B（设计指路牌）最迟从3开始，C（安装电脑和取号设备）最迟从2开始。两项都需要先完成A（确认设备和指路牌的要求），所以A的LF=min(3,2)=2，LS=2−2=0。", "pitfall": "有多个紧后活动时，要满足每一项的开始要求，因此取最小值。多个末端活动使用同一个项目完成时间T。", "topic": "5.1", "terms": [], "tables": [], "formulae": [], "source": "综合应用：Lecture 4 · 第65–67页"}, {"id": "float", "title": "Total Float / Free Float · 总时差与自由时差", "lesson": 7, "definition": "Total Float（TF，总时差）是活动不推迟项目完工时允许延迟的时间。Free Float（FF，自由时差）是活动不推迟任何紧后活动最早开始时允许延迟的时间。", "formula": "TF=LS−ES=LF−EF；FF=min(紧后ES)−EF；终点FF=T−EF。", "example": "B（设计指路牌）的TF=1天、FF=0天。设计师晚1天开始，D（制作并安装指路牌）的工人也晚1天开工，因为这1天超过FF。延迟仍在TF之内，项目可以在第9天完成。", "pitfall": "关键活动的TF为0，单看FF=0无法判断。B（设计指路牌）与D（制作并安装指路牌）共享同一路径的1天余量。本例中0≤FF≤TF。", "topic": "5.1", "terms": [], "tables": [], "formulae": [], "source": "综合应用：Lecture 4 · 第65–67页"}, {"id": "grid", "title": "AON活动框中的字段与缩写", "lesson": 7, "definition": "上排为ES（最早开始）、ID（活动编号）、EF（最早完成）。中排为SL（总时差）和Description（活动名称，占两格）。下排为LS（最迟开始）、DUR（工期）、LF（最迟完成）。FF（自由时差）写在框外。", "formula": "SL / Total Slack（TS）/ Total Float（TF）：总时差。Free Slack（FS）/ Free Float（FF）：自由时差。DUR / d：工期。", "example": "B（设计指路牌）上排填2、B、5；中排填1及活动名称；下排填3、3、6；框外FF填0。", "pitfall": "FS有两个含义：依赖类型中的Finish-to-Start表示前项完成后后项才开始；时差计算中的Free Slack表示自由时差。本工具用FF标自由时差。", "topic": "5.1", "terms": [["Slack / Float", "时差（浮时）", "安排项目时，有些工作可以适当延后。允许延后的时间有多少，取决于我们是否允许影响后续工作，以及是否允许影响项目完工。"], ["Total Slack (TS) / Total Float (TF)", "总时差", "在不推迟项目完工的情况下，一项活动允许延迟的时间。用最迟开始减去最早开始计算：TF=LS−ES；也可以用最迟完成减去最早完成：TF=LF−EF。九宫格中的SL记录这个总时差。"], ["Free Slack (FS) / Free Float (FF)", "自由时差", "在不推迟任何直接后续活动最早开始的情况下，一项活动允许延迟的时间。这里使用FF；课程也使用Free Slack的缩写FS。它与Finish-to-Start的FS含义不同。"]], "tables": [], "formulae": ["TF = LS − ES = LF − EF FF = min(直接后续活动的 ES) − 本活动 EF"], "source": "Lecture 4 · 第22、49–52页"}, {"id": "critical", "title": "Critical Path / CPM · 关键路径与关键路径法", "lesson": 8, "definition": "Critical Path（关键路径）是从项目起点到终点、总工期最长的完整路径。Critical Path Method（CPM，关键路径法）通过网络关系与正推、逆推计算，识别决定项目完工时间的活动。", "formula": "路径工期=沿路径各活动工期之和；关键路径工期=项目工期T。本例按最早完成时间逆推，关键活动的TF=0。", "example": "从确认要求，经安装电脑和取号设备，再到检查的A-C-E路径需要2+6+1=9天。从确认要求，经设计和制作并安装指路牌，再到检查的A-B-D-E路径需要2+3+2+1=8天。A-C-E是关键路径。", "pitfall": "关键路径按总工期判断。若C（安装电脑和取号设备）改为5天，两条路径都需要8天，就有两条关键路径。", "topic": "5.1", "terms": [["Gantt Chart / Milestone", "甘特图 / 里程碑", "甘特图用横轴表示时间，每条横条表示一项活动从开始到完成的区间。里程碑是重要事件，例如“接待区检查通过”，工期为0。检查工作需要1天，检查通过则是这项工作完成后的一个时点。"]], "tables": [], "formulae": [], "source": "Lecture 4 · 第37–63页；Lecture 5 · 第43–45页"}, {"id": "pert", "title": "PERT · 三点工期估计", "lesson": 9, "definition": "Program Evaluation and Review Technique（PERT，计划评审技术）利用三种工期估计计算期望与波动。Optimistic Time a是乐观工期；Most Likely Time m是最可能工期；Pessimistic Time b是悲观工期，要求a≤m≤b。", "formula": "tₑ=(a+4m+b)/6；σ=(b−a)/6；σ²=((b−a)/6)²。", "example": "某项安装工作a=2天、m=4天、b=8天。期望工期tₑ=(2+4×4+8)/6≈4.33天；标准差σ=(8−2)/6=1天；方差σ²=1天²。", "pitfall": "Expected Time（期望工期）是加权平均时间。Standard Deviation（标准差）表示波动程度，单位为天；Variance（方差）是标准差的平方，单位为天²。计算中保留精度，最后按题目要求舍入。", "topic": "5.1", "terms": [["Probability of Completion / Due Date", "完工概率 / 目标期限", "项目经理提出“希望10天内完成”时，10天是目标期限，记为D。完工概率表示在这个期限前完成的可能性，取值从0到1，也可以写成百分比。"], ["Normal Approximation / Standard Normal Distribution", "正态近似 / 标准正态分布", "正态分布呈钟形，数值在平均值附近较集中，两侧较少。这里用正态分布近似计算这条路径的完成时间。标准正态分布将平均值记为0、标准差记为1，便于使用统一的概率表。"]], "tables": [], "formulae": ["Z = (D − μ) / σ", "P(T ≤ D) ≈ Φ(Z)", "D = μ + zₚσ"], "source": "Lecture 4 · 第55–63页"}, {"id": "probability", "title": "Probability of Completion · 完工概率与期限", "lesson": 10, "definition": "Due Date D是目标期限，μ是路径期望工期，V是路径方差，σ=√V是标准差。Z-score（Z值）表示期限距平均完成时间有几个标准差。Φ(Z)表示标准正态分布在Z及其左侧的累计概率。", "formula": "μ=Σtₑ；V=Σσᵢ²；σ=√V；Z=(D−μ)/σ；P≈Φ(Z)；D=μ+zₚσ。 Σ表示沿选定路径相加；√表示开平方。", "example": "A（确认设备和指路牌的要求）按2天、E（检查设备和指路牌是否符合要求）按1天计算；C（安装电脑和取号设备）的期望为6.333…天、方差为1天²。因此A-C-E的μ=9.333…天、σ=1天。期限D=10时，Z≈0.667，按时完成概率约74.75%。", "pitfall": "按工期相互独立、路径保持关键、完成时间近似正态分布计算。路径方差先相加，再开平方得到标准差。单侧95%的z约1.645；有相关工期或其他竞争路径时，需要相应调整分析。", "topic": "5.1", "terms": [["Gantt Chart / Milestone", "甘特图 / 里程碑", "甘特图用横轴表示时间，每条横条表示一项活动从开始到完成的区间。里程碑是重要事件，例如“接待区检查通过”，工期为0。检查工作需要1天，检查通过则是这项工作完成后的一个时点。"]], "tables": [], "formulae": [], "source": "Lecture 4 · 第37–63页；Lecture 5 · 第43–45页"}, {"id": "checks", "title": "图表与计算的核对方法", "lesson": 11, "definition": "先检查网络图是否与活动表的前置关系一致，再检查开始、完成、工期和时差之间是否满足计算关系。", "formula": "EF−ES=d；LF−LS=d；LS−ES=LF−EF=TF；0≤FF≤TF；关键路径工期=T。", "example": "B（设计指路牌）的ES=2、EF=5、LS=3、LF=6。因此工期=5−2=6−3=3天，总时差=3−2=6−5=1天。", "pitfall": "计算题写出max或min中的各个候选值，便于核对为什么采用这个时间。两张图工期相同，也需要分别核对前置关系。", "topic": "5.1", "terms": [["Gantt Chart / Milestone", "甘特图 / 里程碑", "甘特图用横轴表示时间，每条横条表示一项活动从开始到完成的区间。里程碑是重要事件，例如“接待区检查通过”，工期为0。检查工作需要1天，检查通过则是这项工作完成后的一个时点。"]], "tables": [], "formulae": [], "source": "Lecture 4 · 第37–63页；Lecture 5 · 第43–45页"}, {"id": "rel-overview", "title": "Dependency Relationship · 依赖关系", "lesson": 13, "definition": "依赖关系明确两个活动的哪两个时间需要比较。I为提供条件的活动，J为受到限制的
