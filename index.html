planation": "取号终端+600，叫号屏−600，指路牌+500；项目合计+500。", "guided": false, "fingerprint": "0e9012f99d22e820"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.3", "order": 29, "priorLesson": "responsibility-structure", "terms": [["Cost Account / Control Account", "成本账户／控制账户", "将特定工作范围与负责组织的成本管理联系起来。控制账户还用于综合管理范围、预算、进度和绩效，下面先练习明确成本归属。"]], "material": {"context": "设备组既参与取号终端，又参与叫号屏安装。如果只把费用记成“设备组支出”，负责人就难以判断哪部分工作超出预算。工作范围与负责组织需要同时记录。", "terms": [["Cost Account / Control Account", "成本账户／控制账户", "将特定工作范围与负责组织的成本管理联系起来。控制账户还用于综合管理范围、预算、进度和绩效，下面先练习明确成本归属。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>WBS工作<\/th><th>OBS责任单位<\/th><th>预算（元）<\/th><th>实际（元）<\/th><\/tr><\/thead><tbody><tr><td>取号终端<\/td><td>设备组<\/td><td>12000<\/td><td>12600<\/td><\/tr><tr><td>叫号屏<\/td><td>设备组<\/td><td>8000<\/td><td>7400<\/td><\/tr><tr><td>指路牌<\/td><td>标牌组<\/td><td>6000<\/td><td>6500<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "responsibility-handoff", "topic": "4.2", "title": "工作交接与接口责任", "goal": "工作交接与接口责任", "source": "Lecture 3 · 责任矩阵与工作包", "body": "<p>设备组认为“安装结束”是把设备固定好，院方代表认为还应包括网络配置和操作测试。如果词典和责任表都没有说明接口，双方可能各自完成了理解中的任务，接待区却仍不能使用。<\/p><p>项目经理需要把交接对象、完成条件、证据和接收人一起写清。责任表说明谁参与，工作包词典说明交付什么，验收记录说明是否已经接受。三者应使用一致的工作名称与编号。<\/p><div class=\"table-scroll\"><table><thead><tr><th>交接事项<\/th><th>提供者<\/th><th>接收者<\/th><th>完成依据<\/th><\/tr><\/thead><tbody><tr><td>终端与网络可用<\/td><td>设备组<\/td><td>测试负责人<\/td><td>安装配置记录及连通测试<\/td><\/tr><tr><td>双语图样确认<\/td><td>院方代表<\/td><td>标牌组<\/td><td>已批准图样版本<\/td><\/tr><tr><td>接待区正式移交<\/td><td>项目经理<\/td><td>院方运营负责人<\/td><td>验收清单、培训记录与设备资料<\/td><\/tr><\/tbody><\/table><\/div><div class=\"worked-example\"><h3>处理职责空白<\/h3><p>网络配置在设备组报价中被排除，也未分派给院方IT。项目经理应先确认这项必要工作归谁，再评估工期与费用，更新工作包和责任表；不能仅在最终检查时要求某一方临时补做。<\/p><\/div>", "questions": [{"id": "responsibility-handoff-q1", "prompt": "合同排除了网络配置，院方IT的任务表也没有配置工作；设备必须联网才能验收。哪项处理能闭合这个缺口？", "options": ["在责任表给设备组和IT同时增加I，再保持原计划", "确认配置属于交付所需工作，明确承担方并补齐费用和进度安排", "请测试人员在验收时判断设备是否能够离线使用"], "correct": 1, "feedback": ["I表示知会，没有承担配置的执行角色。", "范围、责任和执行安排要同时落实，交接才可完成。", "原验收要求已需联网，不能靠最后改变判断来补责任缺口。"], "ref": "r-responsibility-handoff", "contextLesson": "responsibility-handoff", "fingerprint": "6a089ca2b6efc1d9", "legacyFingerprint": "94d60882f58a6503"}, {"id": "responsibility-handoff-q2", "prompt": "责任表写明设备组执行安装。哪份新增证据才能进一步支持“已验收”的判断？", "options": ["设备组下周的排班表", "按约定标准完成的检查结果与授权接受记录", "设备组的人员名单"], "correct": 1, "feedback": ["未来排班不能证明当前成果已被接受。", "验收要有成果符合要求与正式接受的证据。", "名单只说明谁可能工作。"], "ref": "r-responsibility-handoff", "contextLesson": "responsibility-handoff", "fingerprint": "840501b039811a5e", "legacyFingerprint": "949237fc30d28310"}], "refs": ["r-responsibility-handoff"], "applications": [{"id": "a-responsibility-handoff", "kind": "责任分析", "prompt": "标牌组完成安装，院方要求修改方向箭头。原图样确由院方确认，但现场路线后来变更。请列出需要核对的文件及接下来谁应做什么。", "answer": "核对批准图样、现场路线变更记录、工作包范围、验收标准和责任矩阵。项目经理确认属于不符合原要求还是新要求；相关负责人评估返工影响，由授权人决定变更；标牌组按批准版本修改，再由指定人员检查和接受。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.3", "order": 30, "priorLesson": "responsibility-cost", "terms": [], "material": {"context": "设备组认为“安装结束”是把设备固定好，院方代表认为还应包括网络配置和操作测试。如果词典和责任表都没有说明接口，双方可能各自完成了理解中的任务，接待区却仍不能使用。", "terms": [], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>交接事项<\/th><th>提供者<\/th><th>接收者<\/th><th>完成依据<\/th><\/tr><\/thead><tbody><tr><td>终端与网络可用<\/td><td>设备组<\/td><td>测试负责人<\/td><td>安装配置记录及连通测试<\/td><\/tr><tr><td>双语图样确认<\/td><td>院方代表<\/td><td>标牌组<\/td><td>已批准图样版本<\/td><\/tr><tr><td>接待区正式移交<\/td><td>项目经理<\/td><td>院方运营负责人<\/td><td>验收清单、培训记录与设备资料<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "acceptance-check", "topic": "4.2", "title": "质量检查与正式接受", "goal": "质量检查与正式接受", "source": "Lecture 3 · PDF第48–51页", "body": "<p>测试人员确认取号设备能够正常打印号码，随后院方代表根据约定标准决定是否接受设备。两件事紧密相关，但回答的问题不同。<\/p><section class=\"concept\"><h2><span lang=\"en\">Control Quality / Validate Scope<\/span><span>质量控制／范围确认<\/span><\/h2><p>质量控制检查成果是否符合规定要求；范围确认由有权接受的一方正式接受已完成的交付物。检查记录可以成为接受的依据。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>问题<\/th><th>质量控制<\/th><th>范围确认<\/th><\/tr><\/thead><tbody><tr><td>关注点<\/td><td>设备是否通过功能和性能检查<\/td><td>院方是否正式接受这批设备<\/td><\/tr><tr><td>典型证据<\/td><td>测试结果、缺陷与复测记录<\/td><td>签署的接受记录，或拒绝原因<\/td><\/tr><tr><td>出现问题后<\/td><td>修复并复测<\/td><td>按约定处理未接受事项或提出变更<\/td><\/tr><\/tbody><\/table><\/div><p>“用户满意”需要与约定的验收标准联系起来。如果设备未满足原来要求，应处理缺陷；如果设备满足原要求、用户又提出新功能，则需要评估变更。不能把每次新要求都当成原交付不合格。<\/p>", "questions": [{"id": "acceptance-check-q1", "prompt": "设备已通过内部测试，授权院方代表还未作接受决定。怎样记录最准确？", "options": ["范围确认通过，质量检查待完成", "质量检查与范围确认均通过", "质量检查通过，范围确认待完成"], "correct": 2, "feedback": ["这里通过的是测试，尚缺接受。", "测试通过不会自动产生客户接受。", "测试结果与正式接受是两个不同状态。"], "ref": "r-acceptance-check", "contextLesson": "acceptance-check", "fingerprint": "717fcdbc1a91aca8", "legacyFingerprint": "1c8435f073496719"}, {"id": "acceptance-check-q2", "prompt": "批准范围只含取号，设备符合该要求。使用者后来要求打印病历。这项请求首先属于什么？", "options": ["补写已经发生的接受记录", "修正原有取号功能的缺陷", "评估新增产品功能及相关工作的变更"], "correct": 2, "feedback": ["补记录不能决定新功能是否应做。", "新功能没有写入原要求，不能直接称原成果不符合。", "应按新增要求调查范围与其他影响。"], "ref": "r-acceptance-check", "contextLesson": "acceptance-check", "fingerprint": "4f6c71f02c11c081", "legacyFingerprint": "c79cb9564bc3dc2e"}], "refs": ["r-acceptance-check"], "applications": [], "lab": null, "drill": {"id": "acceptance-check-d", "prompt": "按本页定义选择对应管理动作。", "fields": [{"key": "test", "label": "测试叫号显示是否在2秒内更新", "type": "select", "options": ["质量控制", "范围确认", "新增范围批准"], "answer": 0}, {"key": "sign", "label": "院方授权代表签署交付接受记录", "type": "select", "options": ["质量控制", "范围确认", "新增范围批准"], "answer": 1}], "explanation": "测试提供符合性证据，授权签署完成正式接受。", "guided": false, "fingerprint": "f4ed59c7c24864df"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.4", "order": 31, "priorLesson": "responsibility-handoff", "terms": [["Control Quality / Validate Scope", "质量控制／范围确认", "质量控制检查成果是否符合规定要求；范围确认由有权接受的一方正式接受已完成的交付物。检查记录可以成为接受的依据。"]], "material": {"context": "测试人员确认取号设备能够正常打印号码，随后院方代表根据约定标准决定是否接受设备。两件事紧密相关，但回答的问题不同。", "terms": [["Control Quality / Validate Scope", "质量控制／范围确认", "质量控制检查成果是否符合规定要求；范围确认由有权接受的一方正式接受已完成的交付物。检查记录可以成为接受的依据。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>问题<\/th><th>质量控制<\/th><th>范围确认<\/th><\/tr><\/thead><tbody><tr><td>关注点<\/td><td>设备是否通过功能和性能检查<\/td><td>院方是否正式接受这批设备<\/td><\/tr><tr><td>典型证据<\/td><td>测试结果、缺陷与复测记录<\/td><td>签署的接受记录，或拒绝原因<\/td><\/tr><tr><td>出现问题后<\/td><td>修复并复测<\/td><td>按约定处理未接受事项或提出变更<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "change-control", "topic": "4.2", "title": "新增要求的变更处理", "goal": "新增要求的变更处理", "source": "Lecture 3 · PDF第50–51页", "body": "<p>接待区安装进行到一半，院方提出再增加一个服务窗口。新增设备只是影响的一部分，还可能涉及线路、空间、标牌、培训和验收。项目经理需要先看整体影响，再提交决定。<\/p><section class=\"concept\"><h2><span lang=\"en\">Control Scope / Scope Creep<\/span><span>范围控制／范围蔓延<\/span><\/h2><p>范围控制监测范围状态并管理基线变更。范围蔓延指未经相应控制、不断增加的范围；新增要求可以合理，但仍需明确影响与授权。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>步骤<\/th><th>增加窗口时处理什么<\/th><\/tr><\/thead><tbody><tr><td>记录请求<\/td><td>谁提出、用途、数量、期望完成时间<\/td><\/tr><tr><td>分析影响<\/td><td>范围、依赖、成本、人员、质量与风险<\/td><\/tr><tr><td>取得决定<\/td><td>按授权程序批准、拒绝或暂缓，并说明条件<\/td><\/tr><tr><td>更新并通知<\/td><td>更新相关基线、采购和责任资料，保留版本<\/td><\/tr><tr><td>执行与验证<\/td><td>按批准内容完成，并检查和接受<\/td><\/tr><\/tbody><\/table><\/div><div class=\"worked-example\"><h3>“免费增加”仍需要评估<\/h3><p>供应商愿意免费增加一台屏幕，但院方仍需安排电源、配置、检查和维护。零采购价不代表零工作，也不代表原计划没有影响。<\/p><\/div>", "questions": [{"id": "change-control-q1", "prompt": "供应商免费增加一台屏幕，项目经理能否因此省略变更评估？", "options": ["不能，仍需分析安装、配置、维护和验收等影响", "只能检查屏幕单价", "可以，直接成本为零就没有影响"], "correct": 0, "feedback": ["范围变化需要按完整影响评估，而非只看采购价。", "单价不能说明全部成本和时间影响。", "工作量和风险可能变化。"], "ref": "r-change-control", "contextLesson": "change-control", "fingerprint": "723003aa57e8729e", "legacyFingerprint": "723003aa57e8729e"}, {"id": "change-control-q2", "prompt": "有权者已口头同意增设窗口，但成本、安装时间与采购清单仍是旧版。下一步最需要补齐什么？", "options": ["记录批准及条件，核对影响并同步有关计划与执行资料", "只让安装队提前开工，保持旧清单便于比较", "只通知采购组，等其他人员发现变化再更新"], "correct": 0, "feedback": ["决定、条件与受影响资料要对应，团队才能按同一要求执行。", "旧执行资料可能造成买错或漏做。", "采购变化还可能影响安装、测试与资源。"], "ref": "r-change-control", "contextLesson": "change-control", "fingerprint": "ef59f2d844ae87cc", "legacyFingerprint": "5181bb8bb7a6d357"}], "refs": ["r-change-control"], "applications": [{"id": "a-change-control", "kind": "变更影响分析", "prompt": "新增一个窗口会增加1台终端和2块指路牌。设备组正在执行原计划。请写出至少四类需要调查的影响，并指出什么信息不足以直接批准。", "answer": "调查空间与功能边界、采购和安装依赖、预算与现金需求、人员容量、测试与培训、运营维护及交期风险。只有设备报价不足以批准，还需完整工作影响、完成时间、责任和授权决定。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.4", "order": 32, "priorLesson": "acceptance-check", "terms": [["Control Scope / Scope Creep", "范围控制／范围蔓延", "范围控制监测范围状态并管理基线变更。范围蔓延指未经相应控制、不断增加的范围；新增要求可以合理，但仍需明确影响与授权。"]], "material": {"context": "接待区安装进行到一半，院方提出再增加一个服务窗口。新增设备只是影响的一部分，还可能涉及线路、空间、标牌、培训和验收。项目经理需要先看整体影响，再提交决定。", "terms": [["Control Scope / Scope Creep", "范围控制／范围蔓延", "范围控制监测范围状态并管理基线变更。范围蔓延指未经相应控制、不断增加的范围；新增要求可以合理，但仍需明确影响与授权。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>步骤<\/th><th>增加窗口时处理什么<\/th><\/tr><\/thead><tbody><tr><td>记录请求<\/td><td>谁提出、用途、数量、期望完成时间<\/td><\/tr><tr><td>分析影响<\/td><td>范围、依赖、成本、人员、质量与风险<\/td><\/tr><tr><td>取得决定<\/td><td>按授权程序批准、拒绝或暂缓，并说明条件<\/td><\/tr><tr><td>更新并通知<\/td><td>更新相关基线、采购和责任资料，保留版本<\/td><\/tr><tr><td>执行与验证<\/td><td>按批准内容完成，并检查和接受<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "scope-review", "topic": "4.2", "title": "范围管理案例：修正、变更与交接", "goal": "范围管理案例：修正、变更与交接", "source": "主题4 · 综合应用", "body": "<p>医院接待区原定安装2台取号终端、6块双语指路牌，并完成培训和交接。执行中出现三件事：一块指路牌方向与批准图样相反；院方希望增加第三台终端；培训已经结束但没有保留参加与操作检查记录。<\/p><p>项目经理需要分别判断原要求是否满足、新要求是否经过变更，以及完成证据是否充分。把三件事统一写成“验收不通过”会掩盖不同处理办法。<\/p><div class=\"table-scroll\"><table><thead><tr><th>事件<\/th><th>判断所需依据<\/th><\/tr><\/thead><tbody><tr><td>方向箭头装反<\/td><td>批准图样、现场检查记录<\/td><\/tr><tr><td>新增第三台终端<\/td><td>原数量、请求用途、成本工期和资源影响<\/td><\/tr><tr><td>培训无记录<\/td><td>培训要求、参加人员、操作检查与接受标准<\/td><\/tr><\/tbody><\/table><\/div>", "questions": [{"id": "scope-review-q1", "prompt": "哪一项首先属于对原交付不符合的修正？", "options": ["增加第三台终端", "另加一种尚未要求的语言", "把装反的方向箭头改成批准图样的方向"], "correct": 2, "feedback": ["增加数量属于新要求。", "新增语言需要另行判断和批准。", "已批准图样与实际不符，需要修正并复查。"], "ref": "r-scope-review", "contextLesson": "scope-review", "fingerprint": "441be09e58740b18", "legacyFingerprint": "441be09e58740b18"}, {"id": "scope-review-q2", "prompt": "培训验收要求是“全部接待人员能独立操作”，现有讲师授课记录和一份满意度调查。还需要什么证据？", "options": ["每位接待人员按约定流程完成操作的检查结果", "讲师确认培训材料覆盖了全部功能", "学员平均满意度达到预期分数即可"], "correct": 0, "feedback": ["要求针对每位人员的实际能力，需要逐人操作证据。", "材料覆盖说明教过什么，不能证明学员会做。", "满意不等于独立操作能力，平均分还可能掩盖个别未通过者。"], "ref": "r-scope-review", "contextLesson": "scope-review", "fingerprint": "5e9c3c0738a84d26", "legacyFingerprint": "8c4d2ab93b5f6289"}], "refs": ["r-scope-review"], "applications": [{"id": "a-scope-review", "kind": "综合案例", "prompt": "为本页三件事分别写出：事件性质、要找的证据、责任人下一步行动、最终如何关闭。", "answer": "箭头：不符合原图样，标牌组修正，检查人员复查并记录。第三台终端：新增范围，项目经理组织影响评估，授权人决定，批准后更新资料与执行。培训：证据不足，培训负责人核对参加与操作检查，必要时补训和复测，再按标准接受。各事项关闭都要保留能证明要求已满足的记录。"}], "lab": null, "drill": {"id": "scope-review-d", "prompt": "从以下资料中选出完整范围基线的三个组成部分。", "fields": [{"key": "baseline", "label": "范围基线", "type": "multi", "options": ["已批准范围说明书", "WBS", "WBS词典", "供应商宣传册", "未经批准的新需求邮件"], "answer": [0, 1, 2]}], "explanation": "宣传册和请求邮件可以提供信息，但不自动成为批准的范围基线。", "guided": false, "fingerprint": "69d50510d78fe71a"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "4.4", "order": 33, "priorLesson": "change-control", "terms": [], "material": {"context": "医院接待区原定安装2台取号终端、6块双语指路牌，并完成培训和交接。执行中出现三件事：一块指路牌方向与批准图样相反；院方希望增加第三台终端；培训已经结束但没有保留参加与操作检查记录。", "terms": [], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>事件<\/th><th>判断所需依据<\/th><\/tr><\/thead><tbody><tr><td>方向箭头装反<\/td><td>批准图样、现场检查记录<\/td><\/tr><tr><td>新增第三台终端<\/td><td>原数量、请求用途、成本工期和资源影响<\/td><\/tr><tr><td>培训无记录<\/td><td>培训要求、参加人员、操作检查与接受标准<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "gantt-read", "topic": "5.3", "title": "甘特图与里程碑", "goal": "甘特图与里程碑", "source": "Lecture 5 · PDF第44–51页", "body": "<p>医院接待区准备开放时，负责人既要知道哪些工作互相等待，也要知道每天安排了什么。活动网络图突出依赖关系；把每项工作的开始和完成时间画在同一时间轴上，就得到甘特图。<\/p><section class=\"concept\"><h2><span lang=\"en\">Gantt Chart<\/span><span>甘特图<\/span><\/h2><p>用横条表示活动开始、持续和完成时间的图。横轴是时间，纵向列出活动，横条长度按工期比例绘制。<\/p><\/section><div class=\"table-scroll\"><table><caption>接待区最早计划 · 单位：天<\/caption><thead><tr><th>活动<\/th><th>开始<\/th><th>工期<\/th><th>完成<\/th><\/tr><\/thead><tbody><tr><td>A 确认设备和指路牌的要求<\/td><td>0<\/td><td>2<\/td><td>2<\/td><\/tr><tr><td>B 设计指路牌<\/td><td>2<\/td><td>3<\/td><td>5<\/td><\/tr><tr><td>C 安装电脑和取号设备<\/td><td>2<\/td><td>6<\/td><td>8<\/td><\/tr><tr><td>D 制作并安装指路牌<\/td><td>5<\/td><td>2<\/td><td>7<\/td><\/tr><tr><td>E 检查设备和指路牌是否符合要求<\/td><td>8<\/td><td>1<\/td><td>9<\/td><\/tr><\/tbody><\/table><\/div><div class=\"formula\">完成时间＝开始时间＋工期<\/div><p>时间从0起算。横条从2延伸到5，表示持续3天。B和C的横条重叠，说明计划同时执行；是否具备足够人员，需要另外核对资源。本例两项工作由不同人员执行。<\/p><section class=\"concept\"><h2><span lang=\"en\">Milestone<\/span><span>里程碑<\/span><\/h2><p>项目中的重要事件或状态，工期为0，常用菱形表示。例如“接待区检查通过”。检查工作本身需要1天，不能因为结果重要就把检查活动写成0天。<\/p><\/section>", "questions": [{"id": "gantt-read-q1", "prompt": "某安装工作从时点3开始，到时点7完成，其横条表示多长工期？", "options": ["5天", "4天", "3天"], "correct": 1, "feedback": ["这里从0计时，区间长度不额外加1。", "工期=7−3=4。", "3是开始时间。"], "ref": "r-gantt-read", "contextLesson": "gantt-read", "fingerprint": "fbe0a65055b0859b", "legacyFingerprint": "fbe0a65055b0859b"}, {"id": "gantt-read-q2", "prompt": "两项横条在同一天结束，能否据此确定它们存在FF依赖？", "options": ["能，并且必须是零滞后", "不能，相同完成时间也可能只是排程结果", "能，同一天结束一定存在FF关系"], "correct": 1, "feedback": ["既不能推断关系，也不能推断滞后量。", "依赖需要从活动条件或连线资料确认。", "时间相同不说明逻辑关系。"], "ref": "r-gantt-read", "contextLesson": "gantt-read", "fingerprint": "0a37d2786b376b65", "legacyFingerprint": "0a37d2786b376b65"}], "refs": ["r-gantt-read"], "applications": [], "lab": null, "drill": {"id": "gantt-read-d", "prompt": "培训从时点6开始，需要2天；“培训全部通过”紧接培训结束。填写横条和里程碑位置。", "fields": [{"key": "finish", "label": "培训完成时间", "type": "number", "answer": 8, "tolerance": 0.01}, {"key": "milestone", "label": "里程碑时间", "type": "number", "answer": 8, "tolerance": 0.01}, {"key": "duration", "label": "里程碑工期", "type": "number", "answer": 0, "tolerance": 0.01}], "explanation": "培训占用6至8的区间，里程碑标在8，不额外增加一天。", "guided": false, "fingerprint": "b4d4753256b5ce7e"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "5.3", "order": 34, "priorLesson": null, "terms": [["Gantt Chart", "甘特图", "用横条表示活动开始、持续和完成时间的图。横轴是时间，纵向列出活动，横条长度按工期比例绘制。"], ["Milestone", "里程碑", "项目中的重要事件或状态，工期为0，常用菱形表示。例如“接待区检查通过”。检查工作本身需要1天，不能因为结果重要就把检查活动写成0天。"]], "material": {"context": "医院接待区准备开放时，负责人既要知道哪些工作互相等待，也要知道每天安排了什么。活动网络图突出依赖关系；把每项工作的开始和完成时间画在同一时间轴上，就得到甘特图。", "terms": [["Gantt Chart", "甘特图", "用横条表示活动开始、持续和完成时间的图。横轴是时间，纵向列出活动，横条长度按工期比例绘制。"], ["Milestone", "里程碑", "项目中的重要事件或状态，工期为0，常用菱形表示。例如“接待区检查通过”。检查工作本身需要1天，不能因为结果重要就把检查活动写成0天。"]], "tables": ["<div class=\"table-scroll\"><table><caption>接待区最早计划 · 单位：天<\/caption><thead><tr><th>活动<\/th><th>开始<\/th><th>工期<\/th><th>完成<\/th><\/tr><\/thead><tbody><tr><td>A 确认设备和指路牌的要求<\/td><td>0<\/td><td>2<\/td><td>2<\/td><\/tr><tr><td>B 设计指路牌<\/td><td>2<\/td><td>3<\/td><td>5<\/td><\/tr><tr><td>C 安装电脑和取号设备<\/td><td>2<\/td><td>6<\/td><td>8<\/td><\/tr><tr><td>D 制作并安装指路牌<\/td><td>5<\/td><td>2<\/td><td>7<\/td><\/tr><tr><td>E 检查设备和指路牌是否符合要求<\/td><td>8<\/td><td>1<\/td><td>9<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "gantt-edit", "topic": "5.3", "title": "在甘特图中调整工作安排", "goal": "在甘特图中调整工作安排", "source": "Lecture 5 · 甘特图与跟踪图", "body": "<p>下面沿用医院接待区的五项工作：A确认要求后，B设计指路牌与C安装设备才能开始；D制作并安装指路牌要等B设计完成；E联合检查要等C设备安装和D指路牌安装都完成。更改开始时间和工期，可以观察横条、依赖和项目完成时间如何变化。<\/p><p>图中灰色细条保留原批准计划，绿色条表示当前安排。它们分别是Schedule Baseline（进度基线）和Current Schedule（当前进度计划）。调整当前安排不会覆盖原基线。<\/p><p>先试着把B“设计指路牌”推迟1天，再处理D的开始时间。B的变化会影响D，但E原本要等C到第8天完成，因此项目仍可能在第9天完成。把B推迟2天后，再比较结果。图表旁保留全部活动名称、工期和紧前关系。<\/p>", "questions": [{"id": "gantt-edit-q1", "prompt": "B（设计指路牌）从2改为3开始、工期3天；D（制作并安装指路牌）仍从5开始，且必须等B完成。当前安排差在哪里？", "options": ["D应至少改到6开始", "B应缩为2天，才允许保留任何安排", "D应改到3开始，与B同时开工"], "correct": 0, "feedback": ["B在6完成，FS零滞后要求D不早于6开始。", "没有依据直接改变工作所需工期。", "制作需要先取得完成的图样，不能仅靠同时开工解决。"], "ref": "r-gantt-edit", "contextLesson": "gantt-edit", "fingerprint": "8dd3dd191a3212a3", "legacyFingerprint": "a8015fb09622065f"}, {"id": "gantt-edit-q2", "prompt": "批准基线在9完成，目前预计10完成，尚无新的批准基线。记录应怎样处理？", "options": ["基线10、当前预测10，记录最新预测", "基线9、当前预测10，记录预计延期及原因", "基线9、实际完成10，即使时间10尚未到达"], "correct": 1, "feedback": ["预测变化不自动批准新基线。", "同时保留批准与预测，才能比较1天偏差。", "未来预测不能写成已经发生的实际完成。"], "ref": "r-gantt-edit", "contextLesson": "gantt-edit", "fingerprint": "b587fb08bfdad0a3", "legacyFingerprint": "359477d63df32261"}], "refs": ["r-gantt-edit"], "applications": [], "lab": "gantt", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "5.3", "order": 35, "priorLesson": "gantt-read", "terms": [], "material": {"context": "下面沿用医院接待区的五项工作：A确认要求后，B设计指路牌与C安装设备才能开始；D制作并安装指路牌要等B设计完成；E联合检查要等C设备安装和D指路牌安装都完成。更改开始时间和工期，可以观察横条、依赖和项目完成时间如何变化。", "terms": [], "tables": []}}, {"id": "gantt-track", "topic": "5.3", "title": "记录实际进展与预计完成时间", "goal": "记录实际进展与预计完成时间", "source": "Lecture 5 · PDF第44–51页", "body": "<p>医院接待区正在准备开放，负责人在时间6记录进展。原计划中的完成时间、已经发生的完成时间，以及现场预计的完成时间，需要分别保存，才能看出哪里发生了变化。<\/p><section class=\"concept\"><h2><span lang=\"en\">Tracking Gantt Chart / Status Date<\/span><span>跟踪甘特图／状态日期<\/span><\/h2><p>跟踪图在同一时间轴上比较基线、实际进展和剩余工作的预测。状态日期是本次记录实际情况的截止时点。<\/p><\/section><p>到时点6，设计指路牌已在时点6完成，比基线5晚1天。设备安装从2开始，尚未完成，现场预计要到9才能完成。填写时应区分真实发生的日期和未来预测。<\/p><div class=\"table-scroll\"><table><thead><tr><th>工作<\/th><th>基线完成<\/th><th>截至时点6的实际<\/th><th>当前预计完成<\/th><\/tr><\/thead><tbody><tr><td>设计指路牌<\/td><td>5<\/td><td>实际完成6<\/td><td>已完成，不再预测<\/td><\/tr><tr><td>安装电脑和取号设备<\/td><td>8<\/td><td>实际开始2，仍在执行<\/td><td>9<\/td><\/tr><tr><td>检查设备和指路牌<\/td><td>9<\/td><td>尚未开始<\/td><td>10<\/td><\/tr><\/tbody><\/table><\/div><p>负责人可以据此判断设计已延迟1天，而设备安装的9仍是预测。实际日期记录已经发生的事实，重新排程时应保留。还未发生的工作可重新安排，但要继续核对依赖、资源和交期。<\/p>", "questions": [{"id": "gantt-track-q1", "prompt": "状态日期为6，设备尚未完成，现场估计9完成。表中应该如何填写？", "options": ["实际完成6，剩余工期3", "实际完成9", "实际完成留空，预计完成9"], "correct": 2, "feedback": ["仍在执行时不能把状态日期当作完成日。", "9尚未到达，不能记为已经发生。", "实际与预测分开，才能正确跟踪。"], "ref": "r-gantt-track", "contextLesson": "gantt-track", "fingerprint": "4431d0a6172b973f", "legacyFingerprint": "4431d0a6172b973f"}, {"id": "gantt-track-q2", "prompt": "设计基线在5完成，实际在6完成。若把基线改为6，会损失什么？", "options": ["活动的名称", "当前实际日期", "与批准计划比较的依据"], "correct": 2, "feedback": ["名称本身不受影响。", "实际仍可记录为6。", "覆盖基线会掩盖1天延期。"], "ref": "r-gantt-track", "contextLesson": "gantt-track", "fingerprint": "16ffeca29a9055e4", "legacyFingerprint": "16ffeca29a9055e4"}], "refs": ["r-gantt-track"], "applications": [{"id": "a-gantt-track", "kind": "跟踪记录改错", "prompt": "状态日期为第4天。某表写“实际开始2、实际完成7、当前完成率40%”，基线完成为6。指出需要核实或更正的地方。", "answer": "尚在第4天且只完成40%，第7天只能是预计完成，实际完成应留空。核实实际开始2和完成比例的依据；保留基线6，与预计7比较可识别预期延期1天，再检查后续工作影响。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "5.3", "order": 36, "priorLesson": "gantt-edit", "terms": [["Tracking Gantt Chart / Status Date", "跟踪甘特图／状态日期", "跟踪图在同一时间轴上比较基线、实际进展和剩余工作的预测。状态日期是本次记录实际情况的截止时点。"]], "material": {"context": "医院接待区正在准备开放，负责人在时间6记录进展。原计划中的完成时间、已经发生的完成时间，以及现场预计的完成时间，需要分别保存，才能看出哪里发生了变化。", "terms": [["Tracking Gantt Chart / Status Date", "跟踪甘特图／状态日期", "跟踪图在同一时间轴上比较基线、实际进展和剩余工作的预测。状态日期是本次记录实际情况的截止时点。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>工作<\/th><th>基线完成<\/th><th>截至时点6的实际<\/th><th>当前预计完成<\/th><\/tr><\/thead><tbody><tr><td>设计指路牌<\/td><td>5<\/td><td>实际完成6<\/td><td>已完成，不再预测<\/td><\/tr><tr><td>安装电脑和取号设备<\/td><td>8<\/td><td>实际开始2，仍在执行<\/td><td>9<\/td><\/tr><tr><td>检查设备和指路牌<\/td><td>9<\/td><td>尚未开始<\/td><td>10<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "aoa-events", "topic": "5.4", "title": "活动箭线网络图（AOA）", "goal": "活动箭线网络图（AOA）", "source": "Lecture 5 · PDF第64–66页", "body": "<p>医院准备给服务窗口设置取号设备和指路牌。负责人先确认窗口办理的业务和窗口编号，现场人员测量指路牌安装位置。设备组根据窗口清单配置取号菜单；制作商还需要现场尺寸，才能制作指路牌。最后，负责人核对设备菜单与牌面是否对应同一组窗口。<\/p><p>Activity-on-Node（AON，活动节点法）把工作写在方框中。Activity-on-Arrow（AOA，活动箭线法）把工作写在箭头上，用圆圈表示工作开始或完成的事件。下表列出这些工作的工期和先后条件。<\/p><section class=\"concept\"><h2><span lang=\"en\">Activity-on-Arrow (AOA) / Event<\/span><span>活动箭线法／事件<\/span><\/h2><p>AOA的箭头表示活动并标出工期；圆形节点表示事件，事件本身不占用工期。箭尾事件发生后，活动才能开始；指向同一事件的所有活动都完成后，这个事件才能发生。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>工期（天）<\/th><th>紧前活动<\/th><\/tr><\/thead><tbody><tr><td>A 确认服务窗口及编号<\/td><td>2<\/td><td>无<\/td><\/tr><tr><td>B 测量指路牌安装位置<\/td><td>3<\/td><td>无<\/td><\/tr><tr><td>C 配置取号设备<\/td><td>4<\/td><td>A<\/td><\/tr><tr><td>D 制作指路牌<\/td><td>2<\/td><td>A、B<\/td><\/tr><tr><td>E 联合检查<\/td><td>1<\/td><td>C、D<\/td><\/tr><\/tbody><\/table><\/div><p>C只需要A完成；D需要A与B都完成。这组不同的前置条件，会用来解释虚活动为什么存在。不能把A与B的终点简单合并，否则C也会被迫等B。<\/p><div class=\"worked-example\"><h3>读一根箭头<\/h3><p>项目从事件1开始。A（确认服务窗口及编号）需要2天，负责人完成这项工作时到达事件2。圆圈里的1和2用来区分事件，不表示工作需要多少天。<\/p><\/div>", "questions": [{"id": "aoa-events-q1", "prompt": "AOA中标为“C，4天”的箭头从事件2指向事件4。4天表示什么？", "options": ["活动C需要4天", "事件编号之间的差", "事件4持续4天"], "correct": 0, "feedback": ["工期属于箭头表示的活动。", "编号只标识事件。", "事件不占工期。"], "ref": "r-aoa-events", "contextLesson": "aoa-events", "fingerprint": "89f4e1f0ba73632a", "legacyFingerprint": "89f4e1f0ba73632a"}, {"id": "aoa-events-q2", "prompt": "C只等A，D等A与B。若让A和B共用一个完成事件，再从该事件画C，会怎样？", "options": ["C被额外要求等待B", "D不再需要A", "依赖保持不变"], "correct": 0, "feedback": ["共享事件需要等全部入边完成，会给C增加约束。", "D仍会等两项，但C的逻辑已变。", "新增等待改变了原条件。"], "ref": "r-aoa-events", "contextLesson": "aoa-events", "fingerprint": "c3a4e57d0cf854ac", "legacyFingerprint": "c3a4e57d0cf854ac"}], "refs": ["r-aoa-events"], "applications": [{"id": "a-aoa-events", "kind": "表示法比较", "prompt": "同一份活动表能否画成AON和AOA？两图哪些内容必须相同，哪些可以不同？", "answer": "活动、工期和实际依赖必须保持一致；活动画在节点还是箭线上、事件编号和布局可以不同。AOA可能需要零工期虚活动表达逻辑，不能因此增加真实工作量或额外前置条件。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "5.4", "order": 37, "priorLesson": null, "terms": [["Activity-on-Arrow (AOA) / Event", "活动箭线法／事件", "AOA的箭头表示活动并标出工期；圆形节点表示事件，事件本身不占用工期。箭尾事件发生后，活动才能开始；指向同一事件的所有活动都完成后，这个事件才能发生。"]], "material": {"context": "医院准备给服务窗口设置取号设备和指路牌。负责人先确认窗口办理的业务和窗口编号，现场人员测量指路牌安装位置。设备组根据窗口清单配置取号菜单；制作商还需要现场尺寸，才能制作指路牌。最后，负责人核对设备菜单与牌面是否对应同一组窗口。", "terms": [["Activity-on-Arrow (AOA) / Event", "活动箭线法／事件", "AOA的箭头表示活动并标出工期；圆形节点表示事件，事件本身不占用工期。箭尾事件发生后，活动才能开始；指向同一事件的所有活动都完成后，这个事件才能发生。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>工期（天）<\/th><th>紧前活动<\/th><\/tr><\/thead><tbody><tr><td>A 确认服务窗口及编号<\/td><td>2<\/td><td>无<\/td><\/tr><tr><td>B 测量指路牌安装位置<\/td><td>3<\/td><td>无<\/td><\/tr><tr><td>C 配置取号设备<\/td><td>4<\/td><td>A<\/td><\/tr><tr><td>D 制作指路牌<\/td><td>2<\/td><td>A、B<\/td><\/tr><tr><td>E 联合检查<\/td><td>1<\/td><td>C、D<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "aoa-dummy", "topic": "5.4", "title": "用虚活动表达不同的前置条件", "goal": "用虚活动表达不同的前置条件", "source": "Lecture 5 · PDF第67–74页", "body": "<p>医院的设备组需要窗口业务和编号清单，才能配置取号菜单；制作商还需要测量后的安装位置与尺寸，才能制作指路牌。两项工作需要等待的条件不同，AOA图也需要保留这个区别。<\/p><section class=\"concept\"><h2><span lang=\"en\">Dummy Activity<\/span><span>虚活动<\/span><\/h2><p>AOA中用于表达前置条件、工期和工作量均为0的活动，通常画成虚线。它使不同工作能够保留不同的前置条件。<\/p><\/section><p>这组工作是：A确认服务窗口及编号2天；B测量指路牌安装位置3天；C配置取号设备4天，只等A完成；D制作指路牌2天，等A和B都完成；E联合检查1天，等C和D都完成。<\/p><div class=\"table-scroll\"><table><thead><tr><th>箭线<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>A：1→2；B：1→3<\/td><td>两项工作可从起点分别开始<\/td><\/tr><tr><td>虚活动：2→3<\/td><td>事件3除了等B，还要等A完成<\/td><\/tr><tr><td>C：2→4；D：3→4<\/td><td>C只等A，D等A与B<\/td><\/tr><tr><td>E：4→5<\/td><td>C与D均完成后进行联合检查<\/td><\/tr><\/tbody><\/table><\/div><p>虚线从2指向3，方向不能反。反向会让A的完成事件等待B，进而让C也等B，同时D不再正确等待A。一个图看起来整齐，不表示依赖正确。<\/p><p>下面可以编辑每条活动箭线的起止事件，添加或删除虚活动。检查以活动表表达的先后条件为依据；等价的事件编号和布局均可接受。图画对后，继续填写事件最早、最迟时间。<\/p>", "questions": [{"id": "aoa-dummy-q1", "prompt": "AOA中A为1→2，B为1→3，C为2→4，D为3→4；C只等A，D应等A和B。删除虚线2→3后，哪项依赖改变？", "options": ["D仍等待A，因为A与B从同一事件开始", "D不再等待A完成", "C开始额外等待B"], "correct": 1, "feedback": ["共同起点只说明可同时具备开始条件，不使终点条件相同。", "虚线原本把A完成条件传到事件3，删除后D只等B。", "删除这条虚线没有把B连接到C的开始事件。"], "ref": "r-aoa-dummy", "contextLesson": "aoa-dummy", "fingerprint": "166665e15d627c02", "legacyFingerprint": "a06cfd50647eeeb7"}, {"id": "aoa-dummy-q2", "prompt": "两张AOA图事件编号不同。哪一组检查足以支持它们表达同一份活动表？", "options": ["真实工作相同、工期相同、每项工作的全部前置条件相同", "活动总数相同、事件总数相同", "最终算出的总工期相同"], "correct": 0, "feedback": ["编号和位置可以不同，应比较实际工作与逻辑。", "相同数量仍可能连错方向或增加等待。", "逻辑不同也可能偶然得到同一总工期。"], "ref": "r-aoa-dummy", "contextLesson": "aoa-dummy", "fingerprint": "5d58eafa783ef31e", "legacyFingerprint": "ca4b614f2a9414f1"}], "refs": ["r-aoa-dummy"], "applications": [], "lab": "aoa", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "5.4", "order": 38, "priorLesson": "aoa-events", "terms": [["Dummy Activity", "虚活动", "AOA中用于表达前置条件、工期和工作量均为0的活动，通常画成虚线。它使不同工作能够保留不同的前置条件。"]], "material": {"context": "医院的设备组需要窗口业务和编号清单，才能配置取号菜单；制作商还需要测量后的安装位置与尺寸，才能制作指路牌。两项工作需要等待的条件不同，AOA图也需要保留这个区别。", "terms": [["Dummy Activity", "虚活动", "AOA中用于表达前置条件、工期和工作量均为0的活动，通常画成虚线。它使不同工作能够保留不同的前置条件。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>箭线<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>A：1→2；B：1→3<\/td><td>两项工作可从起点分别开始<\/td><\/tr><tr><td>虚活动：2→3<\/td><td>事件3除了等B，还要等A完成<\/td><\/tr><tr><td>C：2→4；D：3→4<\/td><td>C只等A，D等A与B<\/td><\/tr><tr><td>E：4→5<\/td><td>C与D均完成后进行联合检查<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "aoa-times", "topic": "5.4", "title": "计算事件的最早与最迟时间", "goal": "计算事件的最早与最迟时间", "source": "Lecture 5 · PDF第70–74、77–78页", "body": "<p>医院已经把确认窗口、测量安装位置、配置取号设备、制作指路牌和联合检查画成AOA图。接下来计算每个事件最早何时发生，以及为了按期完成，最晚何时必须发生。这里用E和L表示事件时间；AON中的ES、EF、LS、LF则表示活动的开始与完成时间。<\/p><section class=\"concept\"><h2><span lang=\"en\">Earliest Event Time / Latest Event Time<\/span><span>事件最早时点／事件最迟时点<\/span><\/h2><p>事件最早时间是指向它的所有活动最早全部完成的时间；事件最迟时间是在不推迟项目规定完成时间的条件下，允许它最晚发生的时间。<\/p><\/section><div class=\"formula\">正推：Eⱼ＝max(Eᵢ＋dᵢⱼ)<br>逆推：Lᵢ＝min(Lⱼ−dᵢⱼ)<\/div><div class=\"table-scroll\"><table><thead><tr><th>事件<\/th><th>正推过程<\/th><th>E<\/th><th>L<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>项目起点<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>0+2<\/td><td>2<\/td><td>2<\/td><\/tr><tr><td>3<\/td><td>max(0+3, 2+0)<\/td><td>3<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>max(2+4, 3+2)<\/td><td>6<\/td><td>6<\/td><\/tr><tr><td>5<\/td><td>6+1<\/td><td>7<\/td><td>7<\/td><\/tr><\/tbody><\/table><\/div><p>逆推从L₅=7开始，L₄=7−1=6，L₃=6−2=4，L₂=min(6−4,4−0)=2。L₁=min(2−2,4−3)=0。虚活动的工期虽然为0，仍要参与最大值和最小值的比较。<\/p>", "questions": [{"id": "aoa-times-q1", "prompt": "事件3的入边分别在3和2完成，事件3最早时点是多少？", "options": ["5", "3", "2"], "correct": 1, "feedback": ["并行进入同一事件不把时间相加。", "取全部入边完成时点的最大值。", "2时另一项条件尚未满足。"], "ref": "r-aoa-times", "contextLesson": "aoa-times", "fingerprint": "2141081bad81ca73", "legacyFingerprint": "2141081bad81ca73"}, {"id": "aoa-times-q2", "prompt": "事件2的两条后续箭线分别要求它最迟在时间2和时间4发生，应采用哪个？", "options": ["4，取较宽松的限制", "3，取平均", "2，保证两条后续都能按时进行"], "correct": 2, "feedback": ["4会违反更早的后续条件。", "平均值不保证全部约束。", "逆推取最小值。"], "ref": "r-aoa-times", "contextLesson": "aoa-times", "fingerprint": "4c440c9d8fe20828", "legacyFingerprint": "f5e7a2cb13949f81"}], "refs": ["r-aoa-times"], "applications": [], "lab": null, "drill": {"id": "aoa-times-d", "prompt": "某事件有两条入边：前端E分别为4和6，工期分别3和2。另一次逆推中，它的两条出边给出后端L分别为13和12，工期分别4和2。", "fields": [{"key": "early", "label": "由入边得到的最早时点", "type": "number", "answer": 8, "tolerance": 0.01}, {"key": "late", "label": "由出边得到的最迟时点", "type": "number", "answer": 9, "tolerance": 0.01}], "explanation": "正推max(4+3,6+2)=8；逆推min(13−4,12−2)=9。", "guided": false, "fingerprint": "0ebe6be0d152b216"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "5.4", "order": 39, "priorLesson": "aoa-dummy", "terms": [["Earliest Event Time / Latest Event Time", "事件最早时点／事件最迟时点", "事件最早时间是指向它的所有活动最早全部完成的时间；事件最迟时间是在不推迟项目规定完成时间的条件下，允许它最晚发生的时间。"]], "material": {"context": "医院已经把确认窗口、测量安装位置、配置取号设备、制作指路牌和联合检查画成AOA图。接下来计算每个事件最早何时发生，以及为了按期完成，最晚何时必须发生。这里用E和L表示事件时间；AON中的ES、EF、LS、LF则表示活动的开始与完成时间。", "terms": [["Earliest Event Time / Latest Event Time", "事件最早时点／事件最迟时点", "事件最早时间是指向它的所有活动最早全部完成的时间；事件最迟时间是在不推迟项目规定完成时间的条件下，允许它最晚发生的时间。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>事件<\/th><th>正推过程<\/th><th>E<\/th><th>L<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>项目起点<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>0+2<\/td><td>2<\/td><td>2<\/td><\/tr><tr><td>3<\/td><td>max(0+3, 2+0)<\/td><td>3<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>max(2+4, 3+2)<\/td><td>6<\/td><td>6<\/td><\/tr><tr><td>5<\/td><td>6+1<\/td><td>7<\/td><td>7<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "aoa-float", "topic": "5.4", "title": "计算AOA活动的总时差与自由时差", "goal": "计算AOA活动的总时差与自由时差", "source": "Lecture 5 · PDF第77–78页", "body": "<p>事件3的最早时点为3、最迟时点为4，说明该事件有1天余量。活动的总时差还需要结合箭尾事件、箭头事件和活动工期计算，不能只抄终点事件的余量。<\/p><section class=\"concept\"><h2><span lang=\"en\">Activity Total Float in AOA<\/span><span>AOA活动总时差<\/span><\/h2><p>对于活动i→j，最早开始为Eᵢ，最迟完成为Lⱼ，因此总时差TF=Lⱼ−Eᵢ−d。<\/p><\/section><div class=\"formula\">活动ES＝Eᵢ；EF＝Eᵢ＋d<br>活动LF＝Lⱼ；LS＝Lⱼ−d<br>TF＝Lⱼ−Eᵢ−d；FF＝Eⱼ−Eᵢ−d<\/div><div class=\"worked-example\"><h3>B测量指路牌安装位置<\/h3><p>B从事件1到3，工期3天。E₁=0，E₃=3，L₃=4，因此TF=4−0−3=1，FF=3−0−3=0。晚1天完成会推迟事件3的最早发生，但项目仍可以在7完成。<\/p><\/div><p>标准、无额外期限的网络中，关键活动TF=0。活动A、C、E构成7天关键路径。检查不同表示法的结果时，先核对依赖是否相同，再比较工期和时差。<\/p>", "questions": [{"id": "aoa-float-q1", "prompt": "活动i→j工期4，Eᵢ=2，Eⱼ=7，Lⱼ=9。它的TF是多少？", "options": ["3", "2", "7"], "correct": 0, "feedback": ["TF=9−2−4=3。", "2是终点事件Lⱼ−Eⱼ的余量，不是该活动TF。", "7是终点事件最早时点。"], "ref": "r-aoa-float", "contextLesson": "aoa-float", "fingerprint": "014bd4e8448c6375", "legacyFingerprint": "014bd4e8448c6375"}, {"id": "aoa-float-q2", "prompt": "某条零工期虚活动从事件2到3，E₂=4、E₃=4、L₃=4。如何判断它的总时差与作用？", "options": ["TF=4，因为终点事件时点为4", "TF=0，传递必要依赖，可能属于关键路径", "TF=0，因此删掉它也不会影响任何后续条件"], "correct": 1, "feedback": ["事件时点不等于活动允许延迟的时间。", "TF=4−4−0=0。零工期仍可以传递决定完工的逻辑。", "时差为0不表示箭线多余；删线可能使后续提前开始。"], "ref": "r-aoa-float", "contextLesson": "aoa-float", "fingerprint": "e1a9ec34e9af8dde", "legacyFingerprint": "2c6c25da8733176b"}], "refs": ["r-aoa-float"], "applications": [{"id": "a-aoa-float", "kind": "作图与计算核对", "prompt": "你用同一活动表画出AON和AOA，但完工时间分别是7和8。列出优先核对的内容。", "answer": "先核对各有具体工作内容的活动工期，再检查少画或多画的前置关系、虚活动方向与零工期、事件合并是否增加等待。逻辑和工期一致后，再查正推是否取最大、逆推是否取最小，以及是否使用相同的起点和完工目标。"}], "lab": null, "drill": {"id": "aoa-float-d", "prompt": "活动i→j：Eᵢ=2，Eⱼ=7，Lⱼ=9，工期4天。填写活动时间与时差。", "fields": [{"key": "es", "label": "ES", "type": "number", "answer": 2, "tolerance": 0.01}, {"key": "ef", "label": "EF", "type": "number", "answer": 6, "tolerance": 0.01}, {"key": "ls", "label": "LS", "type": "number", "answer": 5, "tolerance": 0.01}, {"key": "lf", "label": "LF", "type": "number", "answer": 9, "tolerance": 0.01}, {"key": "tf", "label": "TF", "type": "number", "answer": 3, "tolerance": 0.01}, {"key": "ff", "label": "FF", "type": "number", "answer": 1, "tolerance": 0.01}], "explanation": "ES取箭尾E，LF取箭头L；LS=9−4=5，EF=2+4=6，TF=3，FF=1。", "guided": false, "fingerprint": "b2b9e756de9fbd23"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "5.4", "order": 40, "priorLesson": "aoa-times", "terms": [["Activity Total Float in AOA", "AOA活动总时差", "对于活动i→j，最早开始为Eᵢ，最迟完成为Lⱼ，因此总时差TF=Lⱼ−Eᵢ−d。"]], "material": {"context": "事件3的最早时点为3、最迟时点为4，说明该事件有1天余量。活动的总时差还需要结合箭尾事件、箭头事件和活动工期计算，不能只抄终点事件的余量。", "terms": [["Activity Total Float in AOA", "AOA活动总时差", "对于活动i→j，最早开始为Eᵢ，最迟完成为Lⱼ，因此总时差TF=Lⱼ−Eᵢ−d。"]], "tables": []}}, {"id": "cost-types", "topic": "6.1", "title": "项目费用的分类", "goal": "项目费用的分类", "source": "Lecture 5 · PDF第5–8、11–12页", "body": "<p>医院接待区需要购买终端、支付安装工资，并承担项目协调和办公费用。估算前先确定成本对象，例如“接待区项目”或其中的“终端安装工作包”，再判断费用怎样归属。<\/p><section class=\"concept\"><h2><span lang=\"en\">Direct Cost / Indirect Cost<\/span><span>直接成本／间接成本<\/span><\/h2><p>直接成本可以明确归属于指定成本对象；间接成本用于支持多个工作或项目，需要按既定依据分配。分类取决于所选成本对象和核算规则。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>分类维度<\/th><th>含义<\/th><th>医院例子<\/th><\/tr><\/thead><tbody><tr><td>Direct / Indirect 直接／间接<\/td><td>是否可直接归入该成本对象<\/td><td>专用于本项目的终端采购；支持多个项目的办公室费用<\/td><\/tr><tr><td>Recurring / Nonrecurring 经常／非经常<\/td><td>是否在相同工作中反复发生<\/td><td>每周设备租金；一次性设计设置费<\/td><\/tr><tr><td>Fixed / Variable 固定／变动<\/td><td>在给定范围内是否随数量变化<\/td><td>固定进场费；按安装台数计费<\/td><\/tr><tr><td>Normal / Expedited 正常／加速<\/td><td>正常节奏或加速执行下的费用<\/td><td>普通运输费；加急运输附加费<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-scroll\"><table><caption>先核对费用来源，再按下列维度分类；同一费用只计一次<\/caption><thead><tr><th>费用来源<\/th><th>医院项目中的例子<\/th><\/tr><\/thead><tbody><tr><td>Labor 人工<\/td><td>配置人员和安装人员的工时费用<\/td><\/tr><tr><td>Materials 材料<\/td><td>线材、固定件等耗用材料<\/td><\/tr><tr><td>Subcontractors 分包<\/td><td>委托专业单位制作并安装标牌<\/td><\/tr><tr><td>Equipment and Facilities 设备与设施<\/td><td>取号终端采购、测试设备或场地租用<\/td><\/tr><tr><td>Travel 差旅<\/td><td>项目人员为现场检查发生的交通与住宿费用<\/td><\/tr><\/tbody><\/table><\/div><p>这些分类维度可以同时使用。一笔每台设备收取的安装费，可以是直接成本，也可以是变动成本。不能把“直接、固定、正常”误当成只能三选一的类别。<\/p><div class=\"worked-example\"><h3>共享费用的归属<\/h3><p>一名协调员同时服务两个项目，工资需要按工时或约定规则分配。若后来只为接待区项目全职工作，能否直接计入该项目，要按明确的核算政策判断。<\/p><\/div>", "questions": [{"id": "cost-types-q1", "prompt": "安装商每台收500元，本次费用可直接归入接待区项目。它可以同时属于哪两类？", "options": ["间接成本与变动成本", "直接成本与变动成本", "直接成本与固定成本"], "correct": 1, "feedback": ["题目明确这笔安装费可以直接归属接待区项目。", "归属和随数量变化是两个独立维度。", "每台单价固定，但总安装费随台数变化，不能因此称总成本固定。"], "ref": "r-cost-types", "contextLesson": "cost-types", "fingerprint": "203b30aa006de84f", "legacyFingerprint": "203b30aa006de84f"}, {"id": "cost-types-q2", "prompt": "医院办公室费用6000元，按两个项目实际协调工时30与70小时分配。接待区占30小时，应分配多少？", "options": ["6000元", "3000元", "1800元"], "correct": 2, "feedback": ["6000是两项目总额，不能全部记入接待区。", "平均分配没有使用题目规定的工时依据。", "6000×30/(30+70)=1800。"], "ref": "r-cost-types", "contextLesson": "cost-types", "fingerprint": "a4a8795cc6294c79", "legacyFingerprint": "c37b311bcac42fe4"}], "refs": ["r-cost-types"], "applications": [{"id": "a-cost-types", "kind": "成本分类说明", "prompt": "设备商收固定进场费1000元，另按每台500元安装。拟安装6台。说明两项费用的分类，并计算直接安装费用。", "answer": "在接待区项目这个成本对象下，两项均可直接归属。进场费在本次数量范围内固定，按台安装费随数量变化。合计1000+6×500=4000元。不能因为固定就把进场费归成间接成本。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.1", "order": 41, "priorLesson": null, "terms": [["Direct Cost / Indirect Cost", "直接成本／间接成本", "直接成本可以明确归属于指定成本对象；间接成本用于支持多个工作或项目，需要按既定依据分配。分类取决于所选成本对象和核算规则。"]], "material": {"context": "医院接待区需要购买终端、支付安装工资，并承担项目协调和办公费用。估算前先确定成本对象，例如“接待区项目”或其中的“终端安装工作包”，再判断费用怎样归属。", "terms": [["Direct Cost / Indirect Cost", "直接成本／间接成本", "直接成本可以明确归属于指定成本对象；间接成本用于支持多个工作或项目，需要按既定依据分配。分类取决于所选成本对象和核算规则。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>分类维度<\/th><th>含义<\/th><th>医院例子<\/th><\/tr><\/thead><tbody><tr><td>Direct / Indirect 直接／间接<\/td><td>是否可直接归入该成本对象<\/td><td>专用于本项目的终端采购；支持多个项目的办公室费用<\/td><\/tr><tr><td>Recurring / Nonrecurring 经常／非经常<\/td><td>是否在相同工作中反复发生<\/td><td>每周设备租金；一次性设计设置费<\/td><\/tr><tr><td>Fixed / Variable 固定／变动<\/td><td>在给定范围内是否随数量变化<\/td><td>固定进场费；按安装台数计费<\/td><\/tr><tr><td>Normal / Expedited 正常／加速<\/td><td>正常节奏或加速执行下的费用<\/td><td>普通运输费；加急运输附加费<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><caption>先核对费用来源，再按下列维度分类；同一费用只计一次<\/caption><thead><tr><th>费用来源<\/th><th>医院项目中的例子<\/th><\/tr><\/thead><tbody><tr><td>Labor 人工<\/td><td>配置人员和安装人员的工时费用<\/td><\/tr><tr><td>Materials 材料<\/td><td>线材、固定件等耗用材料<\/td><\/tr><tr><td>Subcontractors 分包<\/td><td>委托专业单位制作并安装标牌<\/td><\/tr><tr><td>Equipment and Facilities 设备与设施<\/td><td>取号终端采购、测试设备或场地租用<\/td><\/tr><tr><td>Travel 差旅<\/td><td>项目人员为现场检查发生的交通与住宿费用<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "cost-labor", "topic": "6.1", "title": "工资、附加费用与满载人工成本", "goal": "工资、附加费用与满载人工成本", "source": "Lecture 5 · PDF第7、9–10页", "body": "<p>安装人员每小时工资200元，预计工作40小时。预算还规定按直接工资加计60%的人工附加费用，用于规定的福利与支持费用。只算工资会低估这项工作需要的人工预算。<\/p><section class=\"concept\"><h2><span lang=\"en\">Fully Loaded / Fully Burdened Labor Cost<\/span><span>满载人工成本<\/span><\/h2><p>在直接人工工资上，加入规定的人工附加费用后的人工成本。使用费率前先确认它已经包括哪些费用。<\/p><\/section><div class=\"formula\">直接人工＝小时工资×工时<br>满载人工＝直接人工×(1＋附加率)<br>已给满载乘数时：满载人工＝直接人工×乘数<\/div><div class=\"worked-example\"><h3>附加率60%与总乘数1.60<\/h3><p>200×40=8000元。附加率60%对应乘数1.60，因此满载人工为12,800元。若题目已经给1.60，就直接乘1.60，不能再乘2.60。<\/p><\/div><p>多人多任务先分别计算，再合计。工作量40工时与日历工期5天不是同一个量；只有明确每天投入8工时等条件，才能换算为5天。满载人工已经包含的费用，也不能在项目间接费用中重复加入。<\/p>", "questions": [{"id": "cost-labor-q1", "prompt": "直接人工8000元，给定满载乘数1.60。计算结果是多少？", "options": ["4800元", "12800元", "20800元"], "correct": 1, "feedback": ["4800只是60%的附加部分。", "8000×1.60=12800。", "乘数已含基本工资，无须再加1。"], "ref": "r-cost-labor", "contextLesson": "cost-labor", "fingerprint": "9de332e842df04c5", "legacyFingerprint": "9de332e842df04c5"}, {"id": "cost-labor-q2", "prompt": "两位人员各投入20小时，费率分别200与300元，附加率均50%。满载人工是多少？", "options": ["7500元", "15000元", "30000元"], "correct": 1, "feedback": ["直接人工为10000，并非5000。", "(20×200+20×300)×1.5=15000。", "每人20小时，不应给每个人都算40小时。"], "ref": "r-cost-labor", "contextLesson": "cost-labor", "fingerprint": "f7778eb34d838bc4", "legacyFingerprint": "f7778eb34d838bc4"}], "refs": ["r-cost-labor"], "applications": [], "lab": null, "drill": {"id": "cost-labor-d", "prompt": "配置工程师费率250元/小时，工作32小时，人工附加率40%。另有3000元材料费，不使用人工附加率。", "fields": [{"key": "direct", "label": "直接人工（元）", "type": "number", "answer": 8000, "tolerance": 0.01}, {"key": "loaded", "label": "满载人工（元）", "type": "number", "answer": 11200, "tolerance": 0.01}, {"key": "combined", "label": "人工加材料（元）", "type": "number", "answer": 14200, "tolerance": 0.01}], "explanation": "直接人工8000，满载人工8000×1.4=11200，再加材料3000。", "guided": false, "fingerprint": "b53d7550a4ed9b27"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.1", "order": 42, "priorLesson": "cost-types", "terms": [["Fully Loaded / Fully Burdened Labor Cost", "满载人工成本", "在直接人工工资上，加入规定的人工附加费用后的人工成本。使用费率前先确认它已经包括哪些费用。"]], "material": {"context": "安装人员每小时工资200元，预计工作40小时。预算还规定按直接工资加计60%的人工附加费用，用于规定的福利与支持费用。只算工资会低估这项工作需要的人工预算。", "terms": [["Fully Loaded / Fully Burdened Labor Cost", "满载人工成本", "在直接人工工资上，加入规定的人工附加费用后的人工成本。使用费率前先确认它已经包括哪些费用。"]], "tables": []}}, {"id": "cost-quote", "topic": "6.1", "title": "成本、应急储备与报价", "goal": "成本、应急储备与报价", "source": "Lecture 5 · PDF第11–12页", "body": "<p>供应商为接待区安装报价时，需要计算直接与间接成本，考虑约定的应急金额，再加入利润。利润是报价中的收益部分，不能同时当作项目消耗的成本。<\/p><section class=\"concept\"><h2><span lang=\"en\">Contingency Reserve<\/span><span>应急储备<\/span><\/h2><p>为估算中的相关不确定性预留的费用。例如，安装方案可能需要额外配件，估算时为这类变化预留金额，并说明使用依据。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Profit / Price<\/span><span>利润／报价<\/span><\/h2><p>利润是报价中超过相应成本的部分；报价是供应商向客户提出的总金额。利润按成本加成10%和占最终售价10%使用不同基数，因此必须先说明计算口径。<\/p><\/section><div class=\"worked-example\"><h3>先写清百分比的基数<\/h3><p>人工12,800元，加材料6,000元与其他不重复间接费2,000元，共20,800元。按此加10%应急储备，成本合计22,880元。若利润按这22,880元的10%加成，利润2,288元，报价25,168元。若约定利润占最终售价10%，则报价应为22,880÷0.9，两种口径不能混用。<\/p><\/div><p>下面可以调整工资、工时、人工附加费用、材料、其他间接费、应急率和利润加成。这里的应急率作用于人工、材料和其他间接费合计；利润率按包含应急储备的成本加成。各项基数在结果中展开。<\/p>", "questions": [{"id": "cost-quote-q1", "prompt": "成本包含应急储备22000元，要求按成本加10%利润。报价是多少？", "options": ["22000元", "24200元", "24444.44元"], "correct": 1, "feedback": ["还没有加入利润。", "22000×1.1=24200。", "这是利润占售价10%的另一种口径。"], "ref": "r-cost-quote", "contextLesson": "cost-quote", "fingerprint": "42f13d5ab115223d", "legacyFingerprint": "8b346ff1b956bf4d"}, {"id": "cost-quote-q2", "prompt": "满载人工费用已含福利，预算又完整加入同一笔福利。应怎样修正？", "options": ["两处福利都保留，作为未单列的应急储备", "只删除重复福利，保留其他尚未计入的费用", "删除全部项目间接费，只保留满载人工"], "correct": 1, "feedback": ["应急储备需要单独依据，不能把重复费用当作储备。", "同一费用只计一次，其他合理支出仍按口径保留。", "满载人工未必包含所有项目间接支出，应删除重复部分而非整个类别。"], "ref": "r-cost-quote", "contextLesson": "cost-quote", "fingerprint": "21295855a8c12388", "legacyFingerprint": "682d3dee2d3c3046"}], "refs": ["r-cost-quote"], "applications": [], "lab": "cost", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.1", "order": 43, "priorLesson": "cost-labor", "terms": [["Contingency Reserve", "应急储备", "为估算中的相关不确定性预留的费用。例如，安装方案可能需要额外配件，估算时为这类变化预留金额，并说明使用依据。"], ["Profit / Price", "利润／报价", "利润是报价中超过相应成本的部分；报价是供应商向客户提出的总金额。利润按成本加成10%和占最终售价10%使用不同基数，因此必须先说明计算口径。"]], "material": {"context": "供应商为接待区安装报价时，需要计算直接与间接成本，考虑约定的应急金额，再加入利润。利润是报价中的收益部分，不能同时当作项目消耗的成本。", "terms": [["Contingency Reserve", "应急储备", "为估算中的相关不确定性预留的费用。例如，安装方案可能需要额外配件，估算时为这类变化预留金额，并说明使用依据。"], ["Profit / Price", "利润／报价", "利润是报价中超过相应成本的部分；报价是供应商向客户提出的总金额。利润按成本加成10%和占最终售价10%使用不同基数，因此必须先说明计算口径。"]], "tables": []}}, {"id": "estimate-methods", "topic": "6.1", "title": "按已有资料选择估算方法", "goal": "按已有资料选择估算方法", "source": "Lecture 5 · PDF第14–17、25–30页", "body": "<p>接待区刚提出设想时，团队只知道面积和大致用途；设计完成后，才能列出设备、材料和各项安装工作。信息逐渐明确，估算也应逐步细化。<\/p><section class=\"concept\"><h2><span lang=\"en\">Top-down / Bottom-up Estimating<\/span><span>自上而下／自下而上估算<\/span><\/h2><p>自上而下利用整体规模、历史项目和比例作早期估计；自下而上分别估算较细的工作包，再汇总为项目估算。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>方法<\/th><th>计算思路<\/th><th>例子与条件<\/th><\/tr><\/thead><tbody><tr><td>Ratio Method 比率法<\/td><td>数量×可比单位成本<\/td><td>120平方米×每平方米2000元=240000元；核对装修标准和包含范围<\/td><\/tr><tr><td>Apportion Method 比例分摊法<\/td><td>总估算×历史分项比例<\/td><td>总额200000元，标牌占5%，分配10000元；历史项目须可比<\/td><\/tr><tr><td>Bottom-up 自下而上<\/td><td>逐工作包估算后汇总<\/td><td>分别估计设备、标牌、测试和培训，核对重复与遗漏<\/td><\/tr><\/tbody><\/table><\/div><p>更细的表格不自动保证更准确。估算应保留数量、费率、历史依据、包含范围和假设。若医院要求特殊材料，用普通办公室的每平方米单价直接套算，得到的精确数字仍可能不适用。<\/p>", "questions": [{"id": "estimate-methods-q1", "prompt": "项目早期只有面积，设计细节尚未确定，采用面积×历史单价时最需要核对什么？", "options": ["历史项目总面积是否与本项目完全相等", "能否用统一增加10%代替对差异的调查", "历史项目的范围、标准和价格口径是否可比"], "correct": 2, "feedback": ["面积可以不同，关键是单位成本在相应范围内是否可比，规模效应也需考虑。", "固定加成不能代替对材料、标准和范围差异的核对。", "参数估算依赖可比数据。"], "ref": "r-estimate-methods", "contextLesson": "estimate-methods", "fingerprint": "7d752b0025d33493", "legacyFingerprint": "7d752b0025d33493"}, {"id": "estimate-methods-q2", "prompt": "总估算20万元，按设备50%、安装30%、测试20%分配后，又另外计入设备报价中已包含的2万元安装费。主要问题是什么？", "options": ["把三个分摊比例同时调低，就能证明新估算有依据", "部分安装范围重复，需要核对包含范围后汇总", "历史比例总和100%，因此总估算仍然准确"], "correct": 1, "feedback": ["缩小比例只能调整数值，不能解释范围与费用依据。", "百分比合计正确也可能重复计费，需核对每个金额包含什么。", "后来又加的同一项费用会使总额重复增加。"], "ref": "r-estimate-methods", "contextLesson": "estimate-methods", "fingerprint": "32bfbbefdaee03b1", "legacyFingerprint": "decdf90b424817bf"}], "refs": ["r-estimate-methods"], "applications": [], "lab": null, "drill": {"id": "estimate-methods-d", "prompt": "接待区150平方米，可比单价1800元/平方米。按总额的8%分配给标牌与导向系统。", "fields": [{"key": "total", "label": "整体估算（元）", "type": "number", "answer": 270000, "tolerance": 0.01}, {"key": "sign", "label": "标牌部分（元）", "type": "number", "answer": 21600, "tolerance": 0.01}], "explanation": "整体150×1800=270000；分项270000×0.08=21600。", "guided": false, "fingerprint": "92951d9a8fe6683b"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.2", "order": 44, "priorLesson": "cost-quote", "terms": [["Top-down / Bottom-up Estimating", "自上而下／自下而上估算", "自上而下利用整体规模、历史项目和比例作早期估计；自下而上分别估算较细的工作包，再汇总为项目估算。"]], "material": {"context": "接待区刚提出设想时，团队只知道面积和大致用途；设计完成后，才能列出设备、材料和各项安装工作。信息逐渐明确，估算也应逐步细化。", "terms": [["Top-down / Bottom-up Estimating", "自上而下／自下而上估算", "自上而下利用整体规模、历史项目和比例作早期估计；自下而上分别估算较细的工作包，再汇总为项目估算。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>方法<\/th><th>计算思路<\/th><th>例子与条件<\/th><\/tr><\/thead><tbody><tr><td>Ratio Method 比率法<\/td><td>数量×可比单位成本<\/td><td>120平方米×每平方米2000元=240000元；核对装修标准和包含范围<\/td><\/tr><tr><td>Apportion Method 比例分摊法<\/td><td>总估算×历史分项比例<\/td><td>总额200000元，标牌占5%，分配10000元；历史项目须可比<\/td><\/tr><tr><td>Bottom-up 自下而上<\/td><td>逐工作包估算后汇总<\/td><td>分别估计设备、标牌、测试和培训，核对重复与遗漏<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "learning-curve", "topic": "6.1", "title": "用学习曲线估计重复工作所需时间", "goal": "用学习曲线估计重复工作所需时间", "source": "Lecture 5 · PDF第18–24页", "body": "<p>工程师连续配置多台相似取号终端时，可能随着熟悉步骤而缩短单台配置时间。学习曲线用明确的数学模型描述这种估算关系。使用前先辨认模型给出的是某一单元用时，还是累计平均用时。这里采用第X单元用时模型。<\/p><section class=\"concept\"><h2><span lang=\"en\">Learning Curve<\/span><span>学习曲线<\/span><\/h2><p>在重复、相似工作中，用学习率估计后续单元所需时间。学习率表示数量翻倍时，第2X单元用时相对于第X单元的比例。<\/p><\/section><div class=\"formula\">Yₓ＝aXᵇ；b＝log(r)/log(2)<br>a为第一单元用时，r为学习率，Yₓ为第X单元用时<\/div><div class=\"worked-example\"><h3>90%学习率怎样读<\/h3><p>第一台需要40小时，第二台为40×0.9=36小时，第四台为36×0.9=32.4小时。90%表示翻倍后保留90%的用时，并非节省90%。第三台不能简单再乘一次0.9，应使用3ᵇ。<\/p><\/div><p>前N台总工时是Y₁至Yₙ逐项相加。用最后一台时间乘数量会低估前面较慢的单元。下面可调整第一台时间、学习率、台数和小时费用，比较逐台时间与累计工时。<\/p>", "questions": [{"id": "learning-curve-q1", "prompt": "第一台40小时，90%学习率，第四台需多少小时？", "options": ["4小时", "32.4小时", "36小时"], "correct": 1, "feedback": ["90%学习率不是节省90%。", "从1到2、2到4两次翻倍：40×0.9²=32.4。", "36是第二台用时。"], "ref": "r-learning-curve", "contextLesson": "learning-curve", "fingerprint": "b52f5f977aaf1a76", "legacyFingerprint": "b52f5f977aaf1a76"}, {"id": "learning-curve-q2", "prompt": "第X台用时模型中，前4台分别为40、36、约33.85、32.4小时。哪种计算得到前4台总工时？", "options": ["40+36+33.85+32.4", "(40+32.4)/2", "4×32.4"], "correct": 0, "feedback": ["按每台实际估计逐项相加，约142.25小时。", "首尾平均既不是四台总量，也没有包含中间两台。", "最后一台用时不是累计平均。"], "ref": "r-learning-curve", "contextLesson": "learning-curve", "fingerprint": "f175d42872302c0c", "legacyFingerprint": "361bd0c380f52d7c"}], "refs": ["r-learning-curve"], "applications": [], "lab": "learning", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.2", "order": 45, "priorLesson": "estimate-methods", "terms": [["Learning Curve", "学习曲线", "在重复、相似工作中，用学习率估计后续单元所需时间。学习率表示数量翻倍时，第2X单元用时相对于第X单元的比例。"]], "material": {"context": "工程师连续配置多台相似取号终端时，可能随着熟悉步骤而缩短单台配置时间。学习曲线用明确的数学模型描述这种估算关系。使用前先辨认模型给出的是某一单元用时，还是累计平均用时。这里采用第X单元用时模型。", "terms": [["Learning Curve", "学习曲线", "在重复、相似工作中，用学习率估计后续单元所需时间。学习率表示数量翻倍时，第2X单元用时相对于第X单元的比例。"]], "tables": []}}, {"id": "learning-reverse", "topic": "6.1", "title": "根据第四次用时估计前四次总工时", "goal": "根据第四次用时估计前四次总工时", "source": "Lecture 5 · PDF第18–24页", "body": "<p>工程师记录第四次配置用了40小时，学习率为90%。现在需要估计前四次合计工作量。第四次40小时不能直接当作首次用时，也不能当作平均值。<\/p><div class=\"formula\">a＝Yₓ/Xᵇ；总人工费＝ΣYᵢ×小时费率×满载乘数<\/div><div class=\"worked-example\"><h3>按第四次40小时反推<\/h3><p>第四次经历两次翻倍，因此a=40÷0.9²≈49.3827小时。第二次约44.4444小时，第三次约41.7880小时，第四次40小时；总计约175.6151小时。费用计算保留中间精度，最后再按要求取整。<\/p><\/div><p>如果两名工程师分别执行，不能自动把总工时除以2当作日历工期。学习可能与具体执行者相关，还要检查任务能否并行、人员是否具有同等熟练度，以及每天可投入的工时。<\/p>", "questions": [{"id": "learning-reverse-q1", "prompt": "第4次40小时，90%学习率，首次用时应怎样求？", "options": ["40÷0.9²", "40×0.9²", "40÷4"], "correct": 0, "feedback": ["a=40/4ᵇ=40/.81。", "后一次更快，反推首次应更长。", "第四次用时不是累计总量。"], "ref": "r-learning-reverse", "contextLesson": "learning-reverse", "fingerprint": "e126dc9bd31c47e5", "legacyFingerprint": "e126dc9bd31c47e5"}, {"id": "learning-reverse-q2", "prompt": "160工时拟交给两人完成，每人每天可投入8小时。要把160÷(2×8)=10天用于排程，还需哪组条件？", "options": ["工作可以分配并并行，人员能力及依赖允许这种安排", "只需两人名单已登记，不必看工作关系", "只需总预算能支付160小时，不必看每日可用时间"], "correct": 0, "feedback": ["工时到工期需要可分配性、实际能力与日历支持。", "同在名单不代表能同时做这些工作。", "预算充分不能消除时间和依赖限制。"], "ref": "r-learning-reverse", "contextLesson": "learning-reverse", "fingerprint": "92227127496bcccb", "legacyFingerprint": "975c4ff1dc63f11a"}], "refs": ["r-learning-reverse"], "applications": [{"id": "a-learning-reverse", "kind": "模型辨析", "prompt": "某表标题写“累计平均工时”，另一表写“第X台工时”。即使两表都出现aXᵇ，能否采用同一种汇总方式？", "answer": "不能。第X台模型需要逐项相加；累计平均模型若给出前N台平均值，应乘N求累计总量。先读清Y的定义，不能只看到公式相同就套用相同汇总方法。"}], "lab": null, "drill": {"id": "learning-reverse-d", "prompt": "80%学习率，第4台用时32小时。求第一台与第二台时间。", "fields": [{"key": "first", "label": "第一台（小时）", "type": "number", "answer": 50, "tolerance": 0.01}, {"key": "second", "label": "第二台（小时）", "type": "number", "answer": 40, "tolerance": 0.01}], "explanation": "第一台32÷0.8²=50；第二台50×0.8=40。", "guided": false, "fingerprint": "d3bf5fef5c369713"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.2", "order": 46, "priorLesson": "learning-curve", "terms": [], "material": {"context": "工程师记录第四次配置用了40小时，学习率为90%。现在需要估计前四次合计工作量。第四次40小时不能直接当作首次用时，也不能当作平均值。", "terms": [], "tables": []}}, {"id": "function-points", "topic": "6.1", "title": "用功能点估计软件工作量", "goal": "用功能点估计软件工作量", "source": "Lecture 5 · PDF第28–30页", "body": "<p>医院预约系统的代码尚未写出，团队已经能列出输入、输出、接口、查询和数据文件。功能点法使用这些功能的数量与复杂度来估计规模，再用生产率换算工作量。<\/p><section class=\"concept\"><h2><span lang=\"en\">Function Point (FP)<\/span><span>功能点<\/span><\/h2><p>按功能类型、数量与复杂度权重计算的软件规模指标。功能点本身不是天数，也不是代码行数。<\/p><\/section><div class=\"table-scroll\"><table><caption>功能点权重表：每行先选复杂度，再用数量乘该格权重<\/caption><thead><tr><th>功能类型<\/th><th>医院软件中的例子<\/th><th>低<\/th><th>中<\/th><th>高<\/th><\/tr><\/thead><tbody><tr><td>Inputs 输入<\/td><td>工作人员录入患者登记信息<\/td><td>2<\/td><td>4<\/td><td>6<\/td><\/tr><tr><td>Outputs 输出<\/td><td>生成每日接待汇总报告<\/td><td>4<\/td><td>6<\/td><td>10<\/td><\/tr><tr><td>Interfaces 接口<\/td><td>与收费系统交换已确认资料<\/td><td>3<\/td><td>7<\/td><td>12<\/td><\/tr><tr><td>Queries 查询<\/td><td>按号码查询当前等候信息<\/td><td>5<\/td><td>10<\/td><td>15<\/td><\/tr><tr><td>Files 文件<\/td><td>保存和维护登记记录<\/td><td>2<\/td><td>4<\/td><td>8<\/td><\/tr><\/tbody><\/table><\/div><div class=\"formula\">功能点＝Σ(功能数量×对应权重)<br>工作量（人月）＝功能点÷生产率（功能点/人月）<\/div><div class=\"worked-example\"><h3>预约系统的初步估算<\/h3><p>中复杂度输入2项、输出1项、接口1项、查询2项、文件1项，FP=2×4+1×6+1×7+2×10+1×4=45。生产率15 FP/人月，则工作量3人月；每人月成本30,000元，估算成本90,000元。<\/p><\/div><p>下面可调整功能数量、复杂度、生产率与人月费率。每一项都按当前权重表计算。工作量转成排程时，仍需另行考虑人数、依赖和协作成本。<\/p>", "questions": [{"id": "function-points-q1", "prompt": "45功能点、生产率15功能点/人月，工作量是多少？", "options": ["3人月", "3天", "675人月"], "correct": 0, "feedback": ["45÷15=3人月。", "人月是工作量单位，不直接是天数。", "单位为FP÷(FP/人月)，应相除。"], "ref": "r-function-points", "contextLesson": "function-points", "fingerprint": "09081b672877a624", "legacyFingerprint": "09081b672877a624"}, {"id": "function-points-q2", "prompt": "估计工作量3人月，安排3人。哪项资料最直接帮助判断能否1个月完成？", "options": ["只有45个功能点的总数", "三人的任务可并行程度、能力、可用时间和协作安排", "只有每人月成本"], "correct": 1, "feedback": ["功能点提供规模，尚未解释人员怎样并行。", "需要知道工作怎样分配和执行，才能从工作量得到工期。", "成本费率不说明活动依赖和并行条件。"], "ref": "r-function-points", "contextLesson": "function-points", "fingerprint": "d9c9dbe02ed111b5", "legacyFingerprint": "0dca64c0900b909e"}], "refs": ["r-function-points"], "applications": [], "lab": "functionpoints", "drill": {"id": "function-points-d", "prompt": "一套医院登记功能包含中复杂度输入3项、输出2项、查询1项，没有其他功能。权重分别为4、6、10。生产率17 FP/人月，每人月成本30000元。", "fields": [{"key": "fp", "label": "功能点FP", "type": "number", "answer": 34, "tolerance": 0.01, "hint": "分别计算输入3×4、输出2×6、查询1×10，再相加；数量要乘对应权重。"}, {"key": "effort", "label": "工作量（人月）", "type": "number", "answer": 2, "tolerance": 0.01, "hint": "生产率单位是FP/人月。用功能点除以生产率，单位才会成为人月。"}, {"key": "cost", "label": "人工成本（元）", "type": "number", "answer": 60000, "tolerance": 0.01, "hint": "用人月工作量乘每人月30000元，不需要再乘功能点。"}], "explanation": "FP=3×4+2×6+1×10=34；工作量34÷17=2人月；成本2×30000=60000元。这里没有按人数直接推算日历工期。", "guided": true, "fingerprint": "0b8ecc5be5296939"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.2", "order": 47, "priorLesson": "learning-reverse", "terms": [["Function Point (FP)", "功能点", "按功能类型、数量与复杂度权重计算的软件规模指标。功能点本身不是天数，也不是代码行数。"]], "material": {"context": "医院预约系统的代码尚未写出，团队已经能列出输入、输出、接口、查询和数据文件。功能点法使用这些功能的数量与复杂度来估计规模，再用生产率换算工作量。", "terms": [["Function Point (FP)", "功能点", "按功能类型、数量与复杂度权重计算的软件规模指标。功能点本身不是天数，也不是代码行数。"]], "tables": ["<div class=\"table-scroll\"><table><caption>功能点权重表：每行先选复杂度，再用数量乘该格权重<\/caption><thead><tr><th>功能类型<\/th><th>医院软件中的例子<\/th><th>低<\/th><th>中<\/th><th>高<\/th><\/tr><\/thead><tbody><tr><td>Inputs 输入<\/td><td>工作人员录入患者登记信息<\/td><td>2<\/td><td>4<\/td><td>6<\/td><\/tr><tr><td>Outputs 输出<\/td><td>生成每日接待汇总报告<\/td><td>4<\/td><td>6<\/td><td>10<\/td><\/tr><tr><td>Interfaces 接口<\/td><td>与收费系统交换已确认资料<\/td><td>3<\/td><td>7<\/td><td>12<\/td><\/tr><tr><td>Queries 查询<\/td><td>按号码查询当前等候信息<\/td><td>5<\/td><td>10<\/td><td>15<\/td><\/tr><tr><td>Files 文件<\/td><td>保存和维护登记记录<\/td><td>2<\/td><td>4<\/td><td>8<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "budget-activity", "topic": "6.2", "title": "把费用分配到具体工作", "goal": "把费用分配到具体工作", "source": "Lecture 5 · PDF第31–36页", "body": "<p>医院接待区总预算11,000元。只知道总额，负责人无法判断每项工作应花多少，也无法安排各周的资金。需要先把估算对应到具体活动和负责单位。<\/p><section class=\"concept\"><h2><span lang=\"en\">Activity-based Costing (ABC)<\/span><span>作业成本法<\/span><\/h2><p>把成本与产生资源消耗的活动联系起来，并按活动成本动因分配相关费用。本专题先练习把人员、材料等成本落实到活动。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>资源依据<\/th><th>预算（元）<\/th><\/tr><\/thead><tbody><tr><td>确认设备和指路牌要求<\/td><td>协调与设计人员工时<\/td><td>2000<\/td><\/tr><tr><td>制作并安装指路牌<\/td><td>材料、制作与安装<\/td><td>3000<\/td><\/tr><tr><td>安装电脑和取号设备<\/td><td>设备及安装配置资源<\/td><td>6000<\/td><\/tr><\/tbody><\/table><\/div><p>估算记录应写明数量和费率，按批准的费用范围汇总预算。跨活动费用按约定依据分配，不能把同一项协调费用完整计入每项活动。下一步再把每项预算分配到发生的时间段。<\/p>", "questions": [{"id": "budget-activity-q1", "prompt": "共享协调费3000元，三项工作按工时20、30、50分摊。应分别计入多少？", "options": ["600、900、1500元", "1000、1000、1000元", "每项3000元"], "correct": 0, "feedback": ["总工时100，按20%、30%、50%分配，合计仍为3000。", "平均分配保留总额，但与已确定的工时依据不同。", "每项计全额会把同一笔费用重复三次。"], "ref": "r-budget-activity", "contextLesson": "budget-activity", "fingerprint": "1e3d15e86a65aaa8", "legacyFingerprint": "c54dcafe4be0644e"}, {"id": "budget-activity-q2", "prompt": "设备在第1周付款，安装在第3周。现要编现金支出计划，设备款应放在哪周？", "options": ["按安装工期平均分到第2、3周", "第1周", "第3周"], "correct": 1, "feedback": ["这里已有明确付款日期，不按横条平均分配。", "现金支出计划按付款时间记录。", "安装发生时间不等于现金付款时间。"], "ref": "r-budget-activity", "contextLesson": "budget-activity", "fingerprint": "b114dc9964813a8c", "legacyFingerprint": "ac36447904cada79"}], "refs": ["r-budget-activity"], "applications": [{"id": "a-budget-activity", "kind": "预算依据", "prompt": "一项安装报价写“综合费用5000元”，没有说明范围。请列出为了纳入预算应进一步核对的内容。", "answer": "核对设备与材料是否包含、人工及费率、配置测试、运输进场、间接负担、税费口径、应急与利润、付款时间和排除项，尤其检查与其他报价是否重复。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.3", "order": 48, "priorLesson": null, "terms": [["Activity-based Costing (ABC)", "作业成本法", "把成本与产生资源消耗的活动联系起来，并按活动成本动因分配相关费用。本专题先练习把人员、材料等成本落实到活动。"]], "material": {"context": "医院接待区总预算11,000元。只知道总额，负责人无法判断每项工作应花多少，也无法安排各周的资金。需要先把估算对应到具体活动和负责单位。", "terms": [["Activity-based Costing (ABC)", "作业成本法", "把成本与产生资源消耗的活动联系起来，并按活动成本动因分配相关费用。本专题先练习把人员、材料等成本落实到活动。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>资源依据<\/th><th>预算（元）<\/th><\/tr><\/thead><tbody><tr><td>确认设备和指路牌要求<\/td><td>协调与设计人员工时<\/td><td>2000<\/td><\/tr><tr><td>制作并安装指路牌<\/td><td>材料、制作与安装<\/td><td>3000<\/td><\/tr><tr><td>安装电脑和取号设备<\/td><td>设备及安装配置资源<\/td><td>6000<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "budget-time", "topic": "6.2", "title": "各周预算与累计成本基线", "goal": "各周预算与累计成本基线", "source": "Lecture 5 · PDF第31–36页", "body": "<p>接待区已经批准三项预算：确认要求2000元、制作并安装指路牌3000元、安装设备6000元。项目经理接下来要安排这11000元分别在哪周发生，供资金安排和后续比较使用。<\/p><section class=\"concept\"><h2><span lang=\"en\">Time-phased Budget / Cost Baseline<\/span><span>时间分布预算／成本基线<\/span><\/h2><p>把批准的预算按预计发生时间分配，形成每期与累计计划金额。它既说明总额，也说明计划在何时消耗这些金额。<\/p><\/section><p>下表按三周分配这些费用。每行合计应等于该活动预算，每列合计是该周金额，累计值逐周相加。<\/p><div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>第1周<\/th><th>第2周<\/th><th>第3周<\/th><th>合计<\/th><\/tr><\/thead><tbody><tr><td>确认要求<\/td><td>2000<\/td><td>0<\/td><td>0<\/td><td>2000<\/td><\/tr><tr><td>制作并安装指路牌<\/td><td>1000<\/td><td>2000<\/td><td>0<\/td><td>3000<\/td><\/tr><tr><td>安装并配置设备<\/td><td>0<\/td><td>2000<\/td><td>4000<\/td><td>6000<\/td><\/tr><tr><td>每周合计<\/td><td>3000<\/td><td>4000<\/td><td>4000<\/td><td>11000<\/td><\/tr><tr><td>累计计划<\/td><td>3000<\/td><td>7000<\/td><td>11000<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><p>累计计划通常画成曲线，本例按周连接累计金额。在后续挣值管理中，状态日期前计划完成工作的预算价值称为PV（Planned Value，计划价值）。本页先练习保留每项预算总额，同时调整其时间分布。<\/p><p>若把设备费用中的1000元从第3周前移到第2周，总预算仍是11000元，第2周累计计划却从7000变为8000元。资金时点和比较基准都会变化。<\/p>", "questions": [{"id": "budget-time-q1", "prompt": "设备费用1000元由第3周改到第2周，总预算与第2周累计值分别怎样变化？", "options": ["两者都不变", "总预算不变，第2周累计增加1000", "总预算增加1000，累计不变"], "correct": 1, "feedback": ["在第2周观察时，前移金额已进入累计。", "时间分布改变累计值，不改变行总额。", "只是前移，没有新增费用。"], "ref": "r-budget-time", "contextLesson": "budget-time", "fingerprint": "53f26c87e7735d35", "legacyFingerprint": "53f26c87e7735d35"}, {"id": "budget-time-q2", "prompt": "累计预算在第1、2、3周分别为3000、7000、11000元。第2周和第3周各安排多少费用？", "options": ["4000、4000元", "3500、约3666.67元", "7000、11000元"], "correct": 0, "feedback": ["相邻累计相减：7000−3000=4000，11000−7000=4000。", "累计除周数得到平均值，不能还原每周安排。", "这两个数是截至当周的累计，不是当周金额。"], "ref": "r-budget-time", "contextLesson": "budget-time", "fingerprint": "748b54c4d6e7e91a", "legacyFingerprint": "4ed7d5bc757abf54"}], "refs": ["r-budget-time"], "applications": [], "lab": "budget", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.3", "order": 49, "priorLesson": "budget-activity", "terms": [["Time-phased Budget / Cost Baseline", "时间分布预算／成本基线", "把批准的预算按预计发生时间分配，形成每期与累计计划金额。它既说明总额，也说明计划在何时消耗这些金额。"]], "material": {"context": "接待区已经批准三项预算：确认要求2000元、制作并安装指路牌3000元、安装设备6000元。项目经理接下来要安排这11000元分别在哪周发生，供资金安排和后续比较使用。", "terms": [["Time-phased Budget / Cost Baseline", "时间分布预算／成本基线", "把批准的预算按预计发生时间分配，形成每期与累计计划金额。它既说明总额，也说明计划在何时消耗这些金额。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>第1周<\/th><th>第2周<\/th><th>第3周<\/th><th>合计<\/th><\/tr><\/thead><tbody><tr><td>确认要求<\/td><td>2000<\/td><td>0<\/td><td>0<\/td><td>2000<\/td><\/tr><tr><td>制作并安装指路牌<\/td><td>1000<\/td><td>2000<\/td><td>0<\/td><td>3000<\/td><\/tr><tr><td>安装并配置设备<\/td><td>0<\/td><td>2000<\/td><td>4000<\/td><td>6000<\/td><\/tr><tr><td>每周合计<\/td><td>3000<\/td><td>4000<\/td><td>4000<\/td><td>11000<\/td><\/tr><tr><td>累计计划<\/td><td>3000<\/td><td>7000<\/td><td>11000<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "budget-variance", "topic": "6.2", "title": "比较同期费用与累计费用", "goal": "比较同期费用与累计费用", "source": "Lecture 5 · PDF第31–36页", "body": "<p>截至第2周，接待区累计计划费用7000元，实际费用7600元。费用比计划多600元，但还不能仅凭这两个数断言工作进度如何；实际完成的工作量也需要调查。<\/p><section class=\"concept\"><h2><span lang=\"en\">Cost Comparison<\/span><span>费用比较<\/span><\/h2><p>先对齐工作范围、统计日期和费用项目，再比较计划与实际。这里采用实际−计划，正数表示多花，负数表示少花。<\/p><\/section><div class=\"formula\">本页费用差额＝实际费用−计划费用<\/div><p>挣值管理用Earned Value（EV，挣值）表示已完成工作的预算价值，用Actual Cost（AC，实际成本）表示实际花费。Cost Variance（CV，成本偏差）定义为EV−AC。它比较完成同一份工作的预算价值与实际费用，和这里“实际支出减计划支出”的对象不同。计算差额前，先确认比较的两项金额及相减顺序。<\/p>", "questions": [{"id": "budget-variance-q1", "prompt": "截至第2周计划7000、实际7600，按实际−计划计算差额是多少？", "options": ["无法计算任何费用差额", "+600", "−600"], "correct": 1, "feedback": ["可以比较费用，但尚不能据此完整判断绩效。", "7600−7000=600，表示多花。", "这是反向相减的结果。"], "ref": "r-budget-variance", "contextLesson": "budget-variance", "fingerprint": "1b4c0912b7746f2c", "legacyFingerprint": "1b4c0912b7746f2c"}, {"id": "budget-variance-q2", "prompt": "实际支出6000元，计划支出7000元。还需哪项信息才能判断是否有效节约？", "options": ["已完成工作的数量、质量及相应预算价值", "只有下周的预计付款总额", "只需确认6000确实小于7000"], "correct": 0, "feedback": ["少花可能是少做了工作，应比较完成结果。", "未来付款有助现金安排，但不能替代当前完成工作。", "大小关系已知，绩效含义尚需工作量证据。"], "ref": "r-budget-variance", "contextLesson": "budget-variance", "fingerprint": "4a1b355c55597377", "legacyFingerprint": "04ec8a3344f8e771"}], "refs": ["r-budget-variance"], "applications": [], "lab": null, "drill": {"id": "budget-variance-d", "prompt": "第1周计划3000、实际3200；第2周计划4000、实际4400。按实际−计划填写。", "fields": [{"key": "period", "label": "第2周单期差额", "type": "number", "answer": 400, "tolerance": 0.01}, {"key": "cumulative", "label": "截至第2周累计差额", "type": "number", "answer": 600, "tolerance": 0.01}], "explanation": "单期4400−4000=400；累计(3200+4400)−(3000+4000)=600。", "guided": false, "fingerprint": "087d5fcd0f51b2ab"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.3", "order": 50, "priorLesson": "budget-time", "terms": [["Cost Comparison", "费用比较", "先对齐工作范围、统计日期和费用项目，再比较计划与实际。这里采用实际−计划，正数表示多花，负数表示少花。"]], "material": {"context": "截至第2周，接待区累计计划费用7000元，实际费用7600元。费用比计划多600元，但还不能仅凭这两个数断言工作进度如何；实际完成的工作量也需要调查。", "terms": [["Cost Comparison", "费用比较", "先对齐工作范围、统计日期和费用项目，再比较计划与实际。这里采用实际−计划，正数表示多花，负数表示少花。"]], "tables": []}}, {"id": "crash-slope", "topic": "6.2", "title": "赶工的费用与可缩短时间", "goal": "赶工的费用与可缩短时间", "source": "Lecture 5 · PDF第53–62页", "body": "<p>医院希望接待区提前开放。项目经理可以增加人员或使用加急服务，缩短部分活动工期。每项活动能缩短的程度与增加的费用不同，需要先比较再选择。<\/p><section class=\"concept\"><h2><span lang=\"en\">Crashing / Cost Slope<\/span><span>赶工／成本斜率<\/span><\/h2><p>赶工通过额外资源等办法缩短工期。成本斜率表示在给定线性区间内，每缩短一个时间单位增加的直接成本。<\/p><\/section><div class=\"formula\">成本斜率＝(赶工费用−正常费用)÷(正常工期−赶工工期)<\/div><div class=\"worked-example\"><h3>设备安装的两种安排<\/h3><p>正常6天、1500元；最短3天、2100元。可缩短3天，费用增加600元，斜率为200元/天。若题目允许线性压缩，缩短2天增加400元。<\/p><\/div><p>最短工期不能继续压缩；正常工期与赶工工期相等时，没有可压缩区间，不能用0作分母。斜率便宜也不表示应该优先赶工，下一页还要检查它是否能缩短当前项目工期。<\/p>", "questions": [{"id": "crash-slope-q1", "prompt": "正常5天1000元，最短3天1600元，线性成本斜率是多少？", "options": ["300元/天", "200元/天", "600元/天"], "correct": 0, "feedback": ["(1600−1000)/(5−3)=300。", "压缩区间为2天。", "600是总增量，不是每天增量。"], "ref": "r-crash-slope", "contextLesson": "crash-slope", "fingerprint": "2a4ec8daf4d2c5e7", "legacyFingerprint": "2a4ec8daf4d2c5e7"}, {"id": "crash-slope-q2", "prompt": "某活动正常5天1000元，已知最短3天1600元。关于压到2天，哪个判断有依据？", "options": ["需要新的可行工期与费用方案，原数据只支持5至3天", "维持1600元，因为已达到赶工费用", "按300元/天继续外推，费用1900元"], "correct": 0, "feedback": ["压缩区间之外需要新的执行方案。", "赶工费用不意味着任何更短时间都能实现。", "原斜率不能证明2天可实现。"], "ref": "r-crash-slope", "contextLesson": "crash-slope", "fingerprint": "5c3af709ea443e37", "legacyFingerprint": "6d77fb81528ecaff"}], "refs": ["r-crash-slope"], "applications": [], "lab": null, "drill": {"id": "crash-slope-d", "prompt": "指路牌正常4天800元，最短2天1000元，允许线性压缩。", "fields": [{"key": "slope", "label": "斜率（元/天）", "type": "number", "answer": 100, "tolerance": 0.01}, {"key": "cost", "label": "压缩1天后的费用（元）", "type": "number", "answer": 900, "tolerance": 0.01}], "explanation": "可压缩2天，增量200元；每缩短1天增加100元。", "guided": false, "fingerprint": "ee210d85bd3153a1"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.4", "order": 51, "priorLesson": "budget-variance", "terms": [["Crashing / Cost Slope", "赶工／成本斜率", "赶工通过额外资源等办法缩短工期。成本斜率表示在给定线性区间内，每缩短一个时间单位增加的直接成本。"]], "material": {"context": "医院希望接待区提前开放。项目经理可以增加人员或使用加急服务，缩短部分活动工期。每项活动能缩短的程度与增加的费用不同，需要先比较再选择。", "terms": [["Crashing / Cost Slope", "赶工／成本斜率", "赶工通过额外资源等办法缩短工期。成本斜率表示在给定线性区间内，每缩短一个时间单位增加的直接成本。"]], "tables": []}}, {"id": "crash-paths", "topic": "6.2", "title": "多条关键路径下的赶工选择", "goal": "多条关键路径下的赶工选择", "source": "Lecture 5 · PDF第53–62页", "body": "<p>接待区先做A确认要求2天，之后并行做B指路牌准备4天和C设备安装6天，最后D联合检查1天。原项目工期为9天，关键路径A-C-D。<\/p><div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>紧前<\/th><th>正常→最短工期<\/th><th>正常→赶工费<\/th><th>斜率<\/th><\/tr><\/thead><tbody><tr><td>A 确认要求<\/td><td>无<\/td><td>2→1<\/td><td>600→900<\/td><td>300元/天<\/td><\/tr><tr><td>B 指路牌准备<\/td><td>A<\/td><td>4→2<\/td><td>800→1000<\/td><td>100元/天<\/td><\/tr><tr><td>C 设备安装<\/td><td>A<\/td><td>6→3<\/td><td>1500→2100<\/td><td>200元/天<\/td><\/tr><tr><td>D 联合检查<\/td><td>B、C<\/td><td>1→1<\/td><td>400→400<\/td><td>不可压缩<\/td><\/tr><\/tbody><\/table><\/div><p>B虽然最便宜，单独缩短它不会改变9天的项目工期。先把C缩短2天，项目降到7天，此时A-B-D与A-C-D均为关键路径。再把C单独缩短1天，项目仍是7天，因为B所在路径没有缩短。<\/p><div class=\"worked-example\"><h3>双关键路径下怎样再缩短一天<\/h3><p>可以把共同活动A缩短1天，增加300元；也可以同时把B和C各缩短1天，增加100+200=300元。两种方案都使两条关键路径各缩短1天，项目因此也能提前1天完成。<\/p><\/div><p>下面可逐项调整压缩天数，查看每轮路径长度、项目工期和费用。如果还给出了每日间接费，则需要一并比较直接成本增加与间接费用减少。<\/p>", "questions": [{"id": "crash-paths-q1", "prompt": "C已从6天压到4天，B仍4天；把C再压到3天，项目工期怎样变化？", "options": ["仍为7", "升为8", "7降为6"], "correct": 0, "feedback": ["必须处理全部当前关键路径。", "缩短C不会直接使工期增加。", "B路径仍需2+4+1=7。"], "ref": "r-crash-paths", "contextLesson": "crash-paths", "fingerprint": "bba8a4e3d84023af", "legacyFingerprint": "bba8a4e3d84023af"}, {"id": "crash-paths-q2", "prompt": "当前两条关键路径A-B-D与A-C-D，哪种方案能缩短项目1天？", "options": ["只压B1天", "只压C1天", "压共同活动A1天，且不违反最短工期"], "correct": 2, "feedback": ["C路径仍未缩短。", "B路径仍未缩短。", "A在两条路径上，压缩它同时缩短两条。"], "ref": "r-crash-paths", "contextLesson": "crash-paths", "fingerprint": "06746d8ddc1a8b48", "legacyFingerprint": "06746d8ddc1a8b48"}], "refs": ["r-crash-paths"], "applications": [], "lab": "crash", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.4", "order": 52, "priorLesson": "crash-slope", "terms": [], "material": {"context": "接待区先做A确认要求2天，之后并行做B指路牌准备4天和C设备安装6天，最后D联合检查1天。原项目工期为9天，关键路径A-C-D。", "terms": [], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>活动<\/th><th>紧前<\/th><th>正常→最短工期<\/th><th>正常→赶工费<\/th><th>斜率<\/th><\/tr><\/thead><tbody><tr><td>A 确认要求<\/td><td>无<\/td><td>2→1<\/td><td>600→900<\/td><td>300元/天<\/td><\/tr><tr><td>B 指路牌准备<\/td><td>A<\/td><td>4→2<\/td><td>800→1000<\/td><td>100元/天<\/td><\/tr><tr><td>C 设备安装<\/td><td>A<\/td><td>6→3<\/td><td>1500→2100<\/td><td>200元/天<\/td><\/tr><tr><td>D 联合检查<\/td><td>B、C<\/td><td>1→1<\/td><td>400→400<\/td><td>不可压缩<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "crash-overlap", "topic": "6.2", "title": "赶工与快速跟进的区别", "goal": "赶工与快速跟进的区别", "source": "Lecture 5 · PDF第53–62页", "body": "<p>设计师完成一部分指路牌图样时，制作人员已经可以开始制作这部分。如果不再等全部图样完成，设计与制作就能有一段时间同时进行。这种调整与增加安装工人是两种不同的缩短工期办法。<\/p><section class=\"concept\"><h2><span lang=\"en\">Fast-tracking<\/span><span>快速跟进<\/span><\/h2><p>让原本先后执行的工作部分重叠，以缩短项目历时。例如图样分区确认后，先制作已经确认的部分，不必等待所有图样全部完成。<\/p><\/section><p>Crashing主要增加资源以缩短活动工期；Fast-tracking改变工作重叠方式。后者可能增加接口协调和返工风险。是否可以重叠，取决于已有信息是否足以支持后续工作，以及变更会影响哪些已完成部分。<\/p><div class=\"table-scroll\"><table><thead><tr><th>方案<\/th><th>直接改变什么<\/th><th>要核对什么<\/th><\/tr><\/thead><tbody><tr><td>增加安装班组<\/td><td>安装活动的工期和成本<\/td><td>工作面、效率、协调及最短工期<\/td><\/tr><tr><td>图样分区批准后开始制作<\/td><td>设计与制作之间的依赖<\/td><td>已确认范围、接口、返工风险<\/td><\/tr><tr><td>单纯修改计划完成日期<\/td><td>没有改变可执行安排<\/td><td>不能因此获得真实的工期缩短<\/td><\/tr><\/tbody><\/table><\/div><p>若快速跟进引入SS或负滞后，需要把新的时间条件写进排程，并重新分析风险。若原先等待是技术上的必要条件，例如材料必须达到强度，就不能只为了提前日期而删除。<\/p>", "questions": [{"id": "crash-overlap-q1", "prompt": "增加安装班组和加班费用，安装工期从6天缩为4天；活动间先后关系不变。这属于什么？", "options": ["Fast-tracking 快速跟进", "Crashing 赶工", "Resource Smoothing 资源平滑"], "correct": 1, "feedback": ["快速跟进主要改变活动重叠方式。", "通过额外投入缩短活动工期。", "平滑是在时差内调动工作时间，通常不以额外投入缩短活动工期为定义。"], "ref": "r-crash-overlap", "contextLesson": "crash-overlap", "fingerprint": "15dbb748ab2c3f81", "legacyFingerprint": "3db013e189e98368"}, {"id": "crash-overlap-q2", "prompt": "设计尚未全部确认就开始制作，最需要新增检查什么？", "options": ["把原来未完成的设计统一记为已经接受，再安排制作", "已确认部分的边界、接口，以及后续修改会造成哪些返工", "只比较设计和制作的总工时是否减少"], "correct": 1, "feedback": ["开始制作不意味着未完成设计已获接受，二者状态需要分别记录。", "部分重叠需要明确可执行信息，并评估变更会影响哪些已制作内容。", "重叠可能缩短日历工期而不减少总工作量，还可能增加返工。"], "ref": "r-crash-overlap", "contextLesson": "crash-overlap", "fingerprint": "9e63bfd5f34e9f8d", "legacyFingerprint": "229c7a944541438c"}], "refs": ["r-crash-overlap"], "applications": [{"id": "a-crash-overlap", "kind": "方案比较", "prompt": "院方希望提前2天开放。供应商提出加班安装，设计师提出边设计边制作指路牌。请分别列出评估两种方案所需的信息。", "answer": "加班方案：当前关键路径、可缩短天数、成本斜率、人员和工作面约束、质量与疲劳风险。重叠方案：可先确认的设计范围、依赖变化、接口、返工概率和影响、协调责任。两种都应重算项目工期，再比较增量成本和风险。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "6.4", "order": 53, "priorLesson": "crash-paths", "terms": [["Fast-tracking", "快速跟进", "让原本先后执行的工作部分重叠，以缩短项目历时。例如图样分区确认后，先制作已经确认的部分，不必等待所有图样全部完成。"]], "material": {"context": "设计师完成一部分指路牌图样时，制作人员已经可以开始制作这部分。如果不再等全部图样完成，设计与制作就能有一段时间同时进行。这种调整与增加安装工人是两种不同的缩短工期办法。", "terms": [["Fast-tracking", "快速跟进", "让原本先后执行的工作部分重叠，以缩短项目历时。例如图样分区确认后，先制作已经确认的部分，不必等待所有图样全部完成。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>方案<\/th><th>直接改变什么<\/th><th>要核对什么<\/th><\/tr><\/thead><tbody><tr><td>增加安装班组<\/td><td>安装活动的工期和成本<\/td><td>工作面、效率、协调及最短工期<\/td><\/tr><tr><td>图样分区批准后开始制作<\/td><td>设计与制作之间的依赖<\/td><td>已确认范围、接口、返工风险<\/td><\/tr><tr><td>单纯修改计划完成日期<\/td><td>没有改变可执行安排<\/td><td>不能因此获得真实的工期缩短<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "risk-event", "topic": "7.1", "title": "可能发生的风险与已经发生的问题", "goal": "可能发生的风险与已经发生的问题", "source": "Lecture 6 · PDF第4–9页", "body": "<p>医院计划在下周安装取号设备。供应商提醒运输可能延迟，目前设备仍有机会按时到货。第二天，供应商正式确认至少晚3天交付。前后两种状态需要不同处理。<\/p><section class=\"concept\"><h2><span lang=\"en\">Risk<\/span><span>风险<\/span><\/h2><p>可能发生并影响项目目标的不确定事件或条件。设备可能晚到会威胁开放日期；设备可能提前到货也可能带来提前测试的机会。正面与负面的不确定性都需要分析。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Issue<\/span><span>问题<\/span><\/h2><p>已经发生、需要处理的情况。供应商确认晚交3天后，这3天延期已经是问题；是否还会进一步晚交，仍是不确定的风险。<\/p><\/section><div class=\"worked-example\"><h3>同一事件的状态变化<\/h3><p>运输可能延迟时，采购负责人评估可能性和影响，并准备替代方案。确认晚3天后，要处理已发生的延期，同时重新评估安装、验收和开放日期受到的影响；同时调查是否还可能继续延期。<\/p><\/div><p>风险管理包括识别、评估、应对和持续控制。项目早期很多条件尚未明确，不确定性通常较多；后期投入已经增加，改变方案的代价可能更大。关注点应随信息更新，而不是把最初的风险表一直原样保存。<\/p>", "questions": [{"id": "risk-event-q1", "prompt": "供应商已确认晚3天交付，但还不能确定是否晚更多。怎样记录最合适？", "options": ["把已确认3天延期作为问题处理，同时记录进一步延期的风险", "把所有交期相关记录关闭", "整件事继续只记为未发生风险"], "correct": 0, "feedback": ["事实与剩余不确定性可以同时存在。", "确认延期并不表示后续影响已经解决。", "已经确认的影响需要立即处理。"], "ref": "r-risk-event", "contextLesson": "risk-event", "fingerprint": "efebbadb3089705f", "legacyFingerprint": "efebbadb3089705f"}, {"id": "risk-event-q2", "prompt": "供应商可能提前一周交货，使接待区有机会提前开放。这属于什么？", "options": ["潜在机会，需要核对能否实现收益", "已实现的提前交付", "无需管理，因为没有负面后果"], "correct": 0, "feedback": ["正面不确定性也属于风险管理范围。", "“可能”不等于已经发生。", "要实现机会，可能还需协调人员、场地和依赖。"], "ref": "r-risk-event", "contextLesson": "risk-event", "fingerprint": "d6338db0283b2042", "legacyFingerprint": "d6338db0283b2042"}], "refs": ["r-risk-event"], "applications": [{"id": "a-risk-event", "kind": "状态判断", "prompt": "设备已经损坏，替换件可能5天到货，也可能8天到货。分别指出问题与风险，并说明各自下一步行动。", "answer": "损坏属于已发生问题，安排处理与责任；替换件到货时间仍不确定，评估5至8天对后续安装的影响，准备替代设备、到货跟踪和必要的排程调整。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "7.1", "order": 54, "priorLesson": null, "terms": [["Risk", "风险", "可能发生并影响项目目标的不确定事件或条件。设备可能晚到会威胁开放日期；设备可能提前到货也可能带来提前测试的机会。正面与负面的不确定性都需要分析。"], ["Issue", "问题", "已经发生、需要处理的情况。供应商确认晚交3天后，这3天延期已经是问题；是否还会进一步晚交，仍是不确定的风险。"]], "material": {"context": "医院计划在下周安装取号设备。供应商提醒运输可能延迟，目前设备仍有机会按时到货。第二天，供应商正式确认至少晚3天交付。前后两种状态需要不同处理。", "terms": [["Risk", "风险", "可能发生并影响项目目标的不确定事件或条件。设备可能晚到会威胁开放日期；设备可能提前到货也可能带来提前测试的机会。正面与负面的不确定性都需要分析。"], ["Issue", "问题", "已经发生、需要处理的情况。供应商确认晚交3天后，这3天延期已经是问题；是否还会进一步晚交，仍是不确定的风险。"]], "tables": []}}, {"id": "risk-description", "topic": "7.1", "title": "风险的原因、事件与后果", "goal": "风险的原因、事件与后果", "source": "Lecture 6 · PDF第10–14页", "body": "<p>风险表里如果只写“供应商”“质量不好”或“项目失败”，负责人很难据此采取行动。描述应让人知道什么条件可能导致什么事件，进而影响哪个目标。<\/p><section class=\"concept\"><h2><span lang=\"en\">Cause–Event–Effect<\/span><span>原因、事件与后果<\/span><\/h2><p>原因说明风险来源或条件，事件说明可能发生什么，后果说明对项目范围、时间、成本、质量等目标的影响。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>部分<\/th><th>设备交付风险<\/th><\/tr><\/thead><tbody><tr><td>原因<\/td><td>关键零件只有一家供应商，备用库存不足<\/td><\/tr><tr><td>事件<\/td><td>供货中断导致取号设备未能按时到货<\/td><\/tr><tr><td>后果<\/td><td>安装和联合测试推迟，可能影响开放日期<\/td><\/tr><\/tbody><\/table><\/div><p>识别时可访谈采购、安装和运营人员，查看历史记录、合同条件与活动接口，再通过头脑风暴和专家判断补充遗漏。不同参与者掌握的信息不同，仅凭一个人的清单容易漏掉跨单位问题。<\/p><div class=\"worked-example\"><h3>把“没有时间”改写清楚<\/h3><p>若指路牌图样未在周三确认，制作商无法按原班次开工，安装可能推迟2天。这样可以进一步指定图样确认负责人、监测日期和备用制作时段。<\/p><\/div>", "questions": [{"id": "risk-description-q1", "prompt": "“因图样确认延迟，制作商可能错过班次，导致安装晚2天。”其中事件是什么？", "options": ["安装晚2天这一后果", "图样确认延迟这一原因", "制作商错过计划班次"], "correct": 2, "feedback": ["这是对进度目标的影响。", "这是促成事件的条件。", "事件连接原因与项目影响。"], "ref": "r-risk-description", "contextLesson": "risk-description", "fingerprint": "e632e921b324e2e0", "legacyFingerprint": "e632e921b324e2e0"}, {"id": "risk-description-q2", "prompt": "采购组认为设备能按时到货，安装组认为现场能按时准备好。仍需检查哪项接口风险？", "options": ["交货尺寸、运输通道与安装条件是否匹配", "两组分别取得按期承诺后，就没有接口风险", "只比较两份清单中重复的名称并删除重复项"], "correct": 0, "feedback": ["各自按时不保证交接可用，接口风险来自双方条件是否匹配。", "局部目标同时满足仍可能无法完成交接。", "同名不必然是同一事件，不同名称也可能指向同一接口问题。"], "ref": "r-risk-description", "contextLesson": "risk-description", "fingerprint": "78522de4593d1e83", "legacyFingerprint": "8aeb32595e0fc044"}], "refs": ["r-risk-description"], "applications": [{"id": "a-risk-description", "kind": "风险改写", "prompt": "将“设备风险很高”改写成两个不同的具体风险，一个与交期有关，一个与安装接口有关。", "answer": "交期：关键零件供应不足可能导致终端延迟到货，从而推迟安装和测试。接口：现场电源接口与设备规格可能不一致，导致改线和复测，增加成本并延迟开放。两项应分别调查依据、指定负责人并设监测点。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "7.1", "order": 55, "priorLesson": "risk-event", "terms": [["Cause–Event–Effect", "原因、事件与后果", "原因说明风险来源或条件，事件说明可能发生什么，后果说明对项目范围、时间、成本、质量等目标的影响。"]], "material": {"context": "风险表里如果只写“供应商”“质量不好”或“项目失败”，负责人很难据此采取行动。描述应让人知道什么条件可能导致什么事件，进而影响哪个目标。", "terms": [["Cause–Event–Effect", "原因、事件与后果", "原因说明风险来源或条件，事件说明可能发生什么，后果说明对项目范围、时间、成本、质量等目标的影响。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>部分<\/th><th>设备交付风险<\/th><\/tr><\/thead><tbody><tr><td>原因<\/td><td>关键零件只有一家供应商，备用库存不足<\/td><\/tr><tr><td>事件<\/td><td>供货中断导致取号设备未能按时到货<\/td><\/tr><tr><td>后果<\/td><td>安装和联合测试推迟，可能影响开放日期<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "risk-rbs", "topic": "7.1", "title": "用风险分解结构检查遗漏", "goal": "用风险分解结构检查遗漏", "source": "Lecture 6 · PDF第10–14页", "body": "<p>采购人员最熟悉交期，安装人员最熟悉接口，财务人员最熟悉付款条件。项目经理把不同来源的风险分组整理，可以检查某个方面是否还没有调查。<\/p><section class=\"concept\"><h2><span lang=\"en\">Risk Breakdown Structure (RBS)<\/span><span>风险分解结构<\/span><\/h2><p>按风险来源分层组织风险的结构，用于系统识别和检查遗漏。WBS分解项目工作，RBS分解风险来源，两者可以交叉检查。<\/p><\/section><p>医院接待区项目可以先区分外部和内部来源，再细分供应、财务、技术、执行和合同等类别。分类是帮助检查的工具，具体事件仍需单独描述。<\/p><div class=\"table-scroll\"><table><thead><tr><th>一级来源<\/th><th>二级来源<\/th><th>具体事件<\/th><\/tr><\/thead><tbody><tr><td>外部<\/td><td>供应与商业<\/td><td>供应商生产安排变化，设备可能晚到<\/td><\/tr><tr><td>外部<\/td><td>合同与法规<\/td><td>审批条件可能变化，导致补充工作<\/td><\/tr><tr><td>内部<\/td><td>技术与接口<\/td><td>终端与叫号系统接口可能不兼容<\/td><\/tr><tr><td>内部<\/td><td>执行与协调<\/td><td>测试人员安排冲突，可能错过验收窗口<\/td><\/tr><tr><td>内部或外部<\/td><td>财务<\/td><td>付款安排或价格变化可能影响采购<\/td><\/tr><\/tbody><\/table><\/div><p>一个风险可能跨多个类别，记录主来源并标注关联即可，不应把同一损失在汇总时重复相加。项目经理还可以逐个WBS工作包检查：这里有哪些技术、供应、资源和交接风险？<\/p>", "questions": [{"id": "risk-rbs-q1", "prompt": "“设备安装”和“技术接口风险”分别适合放在哪种结构？", "options": ["前者WBS，后者RBS", "两者都只能放活动网络图", "前者RBS，后者WBS"], "correct": 0, "feedback": ["前者是工作范围，后者是风险来源。", "网络图表达活动依赖，不能替代这两种结构。", "两种结构的分解对象相反。"], "ref": "r-risk-rbs", "contextLesson": "risk-rbs", "fingerprint": "989eebe6798857cb", "legacyFingerprint": "989eebe6798857cb"}, {"id": "risk-rbs-q2", "prompt": "同一笔设备延期损失同时写在“供应风险”和“财务风险”类别下，汇总时应怎样处理？", "options": ["按两个类别计两次，表示关注程度较高", "识别为同一事件，保留关联并只计算一次相同损失", "从供应类别移除后，另造一个独立财务事件"], "correct": 1, "feedback": ["关注程度不改变真实损失金额。", "分类方便调查，不应造成同一后果重复累计。", "改变标签不能把同一事件变成两个独立事件。"], "ref": "r-risk-rbs", "contextLesson": "risk-rbs", "fingerprint": "11b9a8f1473c4eae", "legacyFingerprint": "f803fb663e62744b"}], "refs": ["r-risk-rbs"], "applications": [], "lab": null, "drill": {"id": "risk-rbs-d", "prompt": "为设备安装工作包识别不同来源的风险，选出可以进一步评估的具体事件。", "fields": [{"key": "events", "label": "风险事件", "type": "multi", "options": ["供货商产线停机可能导致到货推迟", "接线接口可能不兼容，造成改线和复测", "测试人员可能同时被另一项目占用", "设备安装工作包"], "answer": [0, 1, 2]}], "explanation": "前三项包含不确定事件和可能影响，最后一项是工作包名称。", "guided": false, "fingerprint": "a3b68c1aa2147b68"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "7.1", "order": 56, "priorLesson": "risk-description", "terms": [["Risk Breakdown Structure (RBS)", "风险分解结构", "按风险来源分层组织风险的结构，用于系统识别和检查遗漏。WBS分解项目工作，RBS分解风险来源，两者可以交叉检查。"]], "material": {"context": "采购人员最熟悉交期，安装人员最熟悉接口，财务人员最熟悉付款条件。项目经理把不同来源的风险分组整理，可以检查某个方面是否还没有调查。", "terms": [["Risk Breakdown Structure (RBS)", "风险分解结构", "按风险来源分层组织风险的结构，用于系统识别和检查遗漏。WBS分解项目工作，RBS分解风险来源，两者可以交叉检查。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>一级来源<\/th><th>二级来源<\/th><th>具体事件<\/th><\/tr><\/thead><tbody><tr><td>外部<\/td><td>供应与商业<\/td><td>供应商生产安排变化，设备可能晚到<\/td><\/tr><tr><td>外部<\/td><td>合同与法规<\/td><td>审批条件可能变化，导致补充工作<\/td><\/tr><tr><td>内部<\/td><td>技术与接口<\/td><td>终端与叫号系统接口可能不兼容<\/td><\/tr><tr><td>内部<\/td><td>执行与协调<\/td><td>测试人员安排冲突，可能错过验收窗口<\/td><\/tr><tr><td>内部或外部<\/td><td>财务<\/td><td>付款安排或价格变化可能影响采购<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "risk-matrix", "topic": "7.1", "title": "用概率与影响确定风险优先级", "goal": "用概率与影响确定风险优先级", "source": "Lecture 6 · PDF第15–18页", "body": "<p>医院项目同时面对设备延迟、指路牌返工和短时网络中断。需要先比较哪些风险更值得优先投入管理精力。概率影响矩阵把可能性与影响放在两个轴上。<\/p><section class=\"concept\"><h2><span lang=\"en\">Probability–Impact Matrix<\/span><span>概率影响矩阵<\/span><\/h2><p>用发生可能性和后果严重程度交叉定位风险，辅助确定管理优先级。等级应有明确含义与判断依据。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>等级<\/th><th>本练习可能性定义<\/th><th>本练习工期影响定义<\/th><\/tr><\/thead><tbody><tr><td>1 低<\/td><td>估计概率低于20%<\/td><td>延期不超过1天<\/td><\/tr><tr><td>2 中<\/td><td>估计概率20%至50%<\/td><td>延期超过1天且不超过3天<\/td><\/tr><tr><td>3 高<\/td><td>估计概率超过50%<\/td><td>延期超过3天<\/td><\/tr><\/tbody><\/table><\/div><p>横轴为影响，向右增加；纵轴为可能性，向上增加。本练习用等级乘积P×I排序：1—2为低，3—4为中，6—9为高。该数值是等级评分，不是事件真实概率或金额损失。其他情境使用不同矩阵时，应先读其等级规则。<\/p><div class=\"worked-example\"><h3>低可能性但影响严重<\/h3><p>设备关键接口出错的可能性低，一旦发生却会推迟开放多天。即使乘积分数不是最高，也应检查是否触及必须控制的交期或安全标准。<\/p><\/div>", "questions": [{"id": "risk-matrix-q1", "prompt": "某风险可能性等级2、影响等级3，P×I=6。6应怎样解释？", "options": ["按本练习规则属于高优先级的等级分数", "发生概率60%", "预计损失6元"], "correct": 0, "feedback": ["乘积用于相对排序，需结合本练习阈值。", "等级2没有被定义为60%。", "缺少金额与真实概率，不能求货币损失。"], "ref": "r-risk-matrix", "contextLesson": "risk-matrix", "fingerprint": "2f801a6d99e66985", "legacyFingerprint": "2f801a6d99e66985"}, {"id": "risk-matrix-q2", "prompt": "风险甲为可能性1、影响3；乙为可能性3、影响1。乘积分都为3。怎样选择措施？", "options": ["分别调查原因与后果，再比较降低可能性或减轻影响的办法", "因为同分，给两者相同频率、相同措施", "只处理乙，因为可能性高的风险一定更重要"], "correct": 0, "feedback": ["同分提示相同等级，不代表措施和损失性质相同。", "相同乘积可以来自不同问题。", "严重但低频的后果也可能触及必须控制的目标。"], "ref": "r-risk-matrix", "contextLesson": "risk-matrix", "fingerprint": "20ffe4c14e0e7e42", "legacyFingerprint": "259cfdc7deed3768"}], "refs": ["r-risk-matrix"], "applications": [], "lab": "riskmatrix", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "7.2", "order": 57, "priorLesson": "risk-rbs", "terms": [["Probability–Impact Matrix", "概率影响矩阵", "用发生可能性和后果严重程度交叉定位风险，辅助确定管理优先级。等级应有明确含义与判断依据。"]], "material": {"context": "医院项目同时面对设备延迟、指路牌返工和短时网络中断。需要先比较哪些风险更值得优先投入管理精力。概率影响矩阵把可能性与影响放在两个轴上。", "terms": [["Probability–Impact Matrix", "概率影响矩阵", "用发生可能性和后果严重程度交叉定位风险，辅助确定管理优先级。等级应有明确含义与判断依据。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>等级<\/th><th>本练习可能性定义<\/th><th>本练习工期影响定义<\/th><\/tr><\/thead><tbody><tr><td>1 低<\/td><td>估计概率低于20%<\/td><td>延期不超过1天<\/td><\/tr><tr><td>2 中<\/td><td>估计概率20%至50%<\/td><td>延期超过1天且不超过3天<\/td><\/tr><tr><td>3 高<\/td><td>估计概率超过50%<\/td><td>延期超过3天<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "risk-factor", "topic": "7.1", "title": "计算项目风险因子（RF）", "goal": "计算项目风险因子（RF）", "source": "Lecture 6 · PDF第19–20页", "body": "<p>除了用于比较各个风险事件的概率影响矩阵，还可以把项目整体的成熟度、复杂性、依赖程度及失败后果合并评分。下面的RF模型使用一组明确的评分公式，不能与P×I混用。<\/p><section class=\"concept\"><h2><span lang=\"en\">Risk Factor (RF)<\/span><span>风险因子<\/span><\/h2><p>由失败可能性评分Pf与失败后果评分Cf合成的项目风险评分。Pf和Cf在这里是评分结果，不应直接当作经过统计验证的失败概率。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>评分<\/th><th>组成<\/th><\/tr><\/thead><tbody><tr><td>Pf：Probability of Failure score<\/td><td>Pm Maturity成熟度、Pc Complexity复杂性、Pd Dependency依赖程度的平均<\/td><\/tr><tr><td>Cf：Consequence of Failure score<\/td><td>Cc Cost成本、Cs Schedule进度、Cr Reliability可靠性、Cp Performance性能后果评分的平均<\/td><\/tr><\/tbody><\/table><\/div><div class=\"formula\">Pf＝(Pm＋Pc＋Pd)/3<br>Cf＝(Cc＋Cs＋Cr＋Cp)/4<br>RF＝Pf＋Cf−Pf×Cf<\/div><p>风险等级：RF&lt;0.30为低；0.30≤RF≤0.70为中；RF&gt;0.70为高。评分应按题目给定尺度和证据填写；若题目明确扩展为5项可能性评分，就按5项平均，不能机械地仍除以3。<\/p><div class=\"worked-example\"><h3>恰好0.70怎样判断<\/h3><p>Pm=.1、Pc=.5、Pd=.9，Pf=.5。后果评分.7、.5、.3、.1，Cf=.4。RF=.5+.4−.5×.4=.70，属于中风险。<\/p><\/div>", "questions": [{"id": "risk-factor-q1", "prompt": "Pf=.5，Cf=.4，RF和等级是多少？", "options": [" .70，中", ".90，高", ".20，低"], "correct": 0, "feedback": ["RF=.5+.4−.2=.70，边界0.70归中。", ".90遗漏了减去重叠乘积项。", ".20是乘积，RF还包含Pf+Cf。"], "ref": "r-risk-factor", "contextLesson": "risk-factor", "fingerprint": "740a6fa48c812b43", "legacyFingerprint": "740a6fa48c812b43"}, {"id": "risk-factor-q2", "prompt": "两个项目的RF分别为0.70和0.71。按本页阈值，怎样解释差异？", "options": ["前者失败概率70%、后者71%，无需再解释评分项", "前者中风险、后者高风险；需结合评分依据比较，而非当作失败率相差1%", "两者都为高风险，因为0.70已经超过高风险门槛"], "correct": 1, "feedback": ["RF由评分合成，不能直接作为统计失败概率。", "高风险为RF>0.70；阈值分类与真实失败概率不同。", "本页把0.70计入中风险，高风险要求严格大于。"], "ref": "r-risk-factor", "contextLesson": "risk-factor", "fingerprint": "b67d8246571b9046", "legacyFingerprint": "ec373d9f75e7f871"}], "refs": ["r-risk-factor"], "applications": [], "lab": "rf", "drill": {"id": "risk-factor-d", "prompt": "三项失败可能性评分为0.2、0.4、0.6；四项后果评分为0.3、0.5、0.7、0.5。", "fields": [{"key": "pf", "label": "Pf", "type": "number", "answer": 0.4, "tolerance": 0.01, "hint": "把三项可能性评分相加再除以3，不把后果评分放进这个平均。"}, {"key": "cf", "label": "Cf", "type": "number", "answer": 0.5, "tolerance": 0.01, "hint": "把四项后果评分相加再除以4，注意与Pf的评分项数不同。"}, {"key": "rf", "label": "RF", "type": "number", "answer": 0.7, "tolerance": 0.01, "hint": "按Pf+Cf−Pf×Cf计算，最后一项是减去乘积。"}, {"key": "level", "label": "按RF<0.30低、0.30至0.70中、>0.70高分类", "type": "select", "options": ["低", "中", "高"], "answer": 1, "hint": "本例高风险要求严格大于0.70，边界0.70包含在中风险区间。"}], "explanation": "Pf=(0.2+0.4+0.6)÷3=0.4；Cf=(0.3+0.5+0.7+0.5)÷4=0.5；RF=0.4+0.5−0.4×0.5=0.70，边界属于中风险。", "guided": true, "fingerprint": "73b01448f06ff280"}, "task": "extension", "req
