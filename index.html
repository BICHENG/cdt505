uires": [], "introduces": [], "sourceTopic": "7.2", "order": 58, "priorLesson": "risk-matrix", "terms": [["Risk Factor (RF)", "风险因子", "由失败可能性评分Pf与失败后果评分Cf合成的项目风险评分。Pf和Cf在这里是评分结果，不应直接当作经过统计验证的失败概率。"]], "material": {"context": "除了用于比较各个风险事件的概率影响矩阵，还可以把项目整体的成熟度、复杂性、依赖程度及失败后果合并评分。下面的RF模型使用一组明确的评分公式，不能与P×I混用。", "terms": [["Risk Factor (RF)", "风险因子", "由失败可能性评分Pf与失败后果评分Cf合成的项目风险评分。Pf和Cf在这里是评分结果，不应直接当作经过统计验证的失败概率。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>评分<\/th><th>组成<\/th><\/tr><\/thead><tbody><tr><td>Pf：Probability of Failure score<\/td><td>Pm Maturity成熟度、Pc Complexity复杂性、Pd Dependency依赖程度的平均<\/td><\/tr><tr><td>Cf：Consequence of Failure score<\/td><td>Cc Cost成本、Cs Schedule进度、Cr Reliability可靠性、Cp Performance性能后果评分的平均<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "risk-model-choice", "topic": "7.1", "title": "风险评分与期望损失", "goal": "风险评分与期望损失", "source": "Lecture 6 · 风险评估综合应用", "body": "<p>项目经理手上可能同时有概率等级、真实概率估计、损失金额和RF评分。先说明要比较管理优先级、估计货币损失，还是评价项目整体风险，再选择算法。<\/p><section class=\"concept\"><h2><span lang=\"en\">Expected Monetary Value (EMV)<\/span><span>期望货币值<\/span><\/h2><p>当事件概率与金额后果有明确口径时，用各结果的概率乘对应金额并相加。下面只讨论一个损失事件，采用正数表示预期损失。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>模型<\/th><th>所需输入<\/th><th>结果含义<\/th><\/tr><\/thead><tbody><tr><td>概率影响矩阵<\/td><td>已定义的等级及排序规则<\/td><td>相对管理优先级<\/td><\/tr><tr><td>RF<\/td><td>规定的项目评分项<\/td><td>项目风险因子等级<\/td><\/tr><tr><td>期望损失<\/td><td>事件概率与损失金额<\/td><td>多次同类情境下的平均损失估计<\/td><\/tr><\/tbody><\/table><\/div><div class=\"worked-example\"><h3>真实概率与金额<\/h3><p>供应商延迟概率估计20%，发生时增量费用10,000元，则期望损失0.2×10000=2000元。实际结果可能没有损失，也可能发生10,000元损失；2000元不是“每次最多赔2000”。<\/p><\/div><p>多个风险可能相关或描述同一后果。汇总前需明确事件、后果和重复范围；不能把等级评分乘以金额冒充真实概率计算。<\/p>", "questions": [{"id": "risk-model-choice-q1", "prompt": "20%概率导致10000元增量费用，期望损失2000元意味着什么？", "options": ["一旦发生最多损失2000", "按给定概率的平均损失估计", "需要把RF设成.2"], "correct": 1, "feedback": ["事件发生时仍可能损失10000。", "期望值不是单次损失上限。", "RF与事件概率属于不同模型。"], "ref": "r-risk-model-choice", "contextLesson": "risk-model-choice", "fingerprint": "92d992786dcb8bc3", "legacyFingerprint": "92d992786dcb8bc3"}, {"id": "risk-model-choice-q2", "prompt": "只有“可能性等级3”和损失10000元，能否计算3000元期望损失？", "options": ["不能，等级到真实概率的含义尚未给出", "可以，等级3天然代表30%", "应计算30000元"], "correct": 0, "feedback": ["需要明确概率尺度或概率估计。", "等级并不天然对应百分比。", "等级3不是概率3。"], "ref": "r-risk-model-choice", "contextLesson": "risk-model-choice", "fingerprint": "2d11cc7ab556ae71", "legacyFingerprint": "2d11cc7ab556ae71"}], "refs": ["r-risk-model-choice"], "applications": [], "lab": null, "drill": {"id": "risk-model-choice-d", "prompt": "延迟概率25%，发生时增量费用8000元。采取措施需500元，可把概率降到10%，后果金额不变。按期望费用比较。", "fields": [{"key": "before", "label": "措施前期望损失（元）", "type": "number", "answer": 2000, "tolerance": 0.01}, {"key": "after", "label": "措施费加剩余期望损失（元）", "type": "number", "answer": 1300, "tolerance": 0.01}, {"key": "saving", "label": "期望费用减少（元）", "type": "number", "answer": 700, "tolerance": 0.01}], "explanation": "措施前.25×8000=2000；措施后500+.10×8000=1300；减少700。还需考虑交期等非货币影响。", "guided": false, "fingerprint": "5cb4ed2f09595633"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "7.2", "order": 59, "priorLesson": "risk-factor", "terms": [["Expected Monetary Value (EMV)", "期望货币值", "当事件概率与金额后果有明确口径时，用各结果的概率乘对应金额并相加。下面只讨论一个损失事件，采用正数表示预期损失。"]], "material": {"context": "项目经理手上可能同时有概率等级、真实概率估计、损失金额和RF评分。先说明要比较管理优先级、估计货币损失，还是评价项目整体风险，再选择算法。", "terms": [["Expected Monetary Value (EMV)", "期望货币值", "当事件概率与金额后果有明确口径时，用各结果的概率乘对应金额并相加。下面只讨论一个损失事件，采用正数表示预期损失。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>模型<\/th><th>所需输入<\/th><th>结果含义<\/th><\/tr><\/thead><tbody><tr><td>概率影响矩阵<\/td><td>已定义的等级及排序规则<\/td><td>相对管理优先级<\/td><\/tr><tr><td>RF<\/td><td>规定的项目评分项<\/td><td>项目风险因子等级<\/td><\/tr><tr><td>期望损失<\/td><td>事件概率与损失金额<\/td><td>多次同类情境下的平均损失估计<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "risk-response", "topic": "7.1", "title": "选择风险应对措施", "goal": "选择风险应对措施", "source": "Lecture 6 · PDF第21–26页", "body": "<p>设备到货可能延迟。项目经理可以改用已有现货、提前确认生产节点、安排合同赔偿，或在可接受影响内保留原方案并准备后备行动。选择策略时应说明它怎样改变风险。<\/p><section class=\"concept\"><h2><span lang=\"en\">Risk Response<\/span><span>风险应对<\/span><\/h2><p>为改变风险的来源、发生可能性、后果或承担责任而采取的行动。先说明想改变什么，再选择措施。以下五种策略对同一个交期风险采取不同处理。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>策略<\/th><th>设备到货例子<\/th><th>仍需关注<\/th><\/tr><\/thead><tbody><tr><td>Avoid 避免<\/td><td>取消依赖该进口型号，采用已确认可用现货<\/td><td>替代方案是否满足要求<\/td><\/tr><tr><td>Minimize / Mitigate 减轻<\/td><td>提前检查生产节点，准备可替换设备<\/td><td>剩余概率和替换实施条件<\/td><\/tr><tr><td>Transfer 转移<\/td><td>约定延迟赔偿或保险责任<\/td><td>赔偿不能自动恢复开放日期<\/td><\/tr><tr><td>Accept 接受<\/td><td>确认影响可以承受，规定什么时候启动后备方案<\/td><td>准备谁来做什么<\/td><\/tr><tr><td>Share 分担<\/td><td>与合作方共同备货和承担约定成本<\/td><td>责任边界与协调机制<\/td><\/tr><\/tbody><\/table><\/div><section class=\"concept\"><h2><span lang=\"en\">Insurance<\/span><span>保险<\/span><\/h2><p>通过合同把约定的经济后果转给保险方承担。赔付范围、免赔条件和未被补偿的工期影响需要分别检查；得到赔偿不等于恢复了开放日期。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Workaround<\/span><span>临时应变措施<\/span><\/h2><p>问题发生后，没有现成预定方案可直接使用时，团队临时制定的处理办法。例如设备确认晚到后，负责人临时安排人工登记。若团队早已规定何时改租备用设备，那属于事先准备的应急计划。<\/p><\/section><p>应对措施本身也可能引入新风险。更换供应商降低交期风险，却可能增加接口和质量不确定性。实施后保留的风险称Residual Risk（残余风险），由措施引出的风险称Secondary Risk（次生风险）。<\/p>", "questions": [{"id": "risk-response-q1", "prompt": "供应商承诺延期赔偿，但医院开放日期不能因此顺延。这项措施解决了哪一部分？", "options": ["设备一定按时到货，因为已有赔偿条款", "医院不再承担延期的任何后果", "部分经济责任，仍需安排时间影响和替代方案"], "correct": 2, "feedback": ["合同赔偿不等于事件不会发生。", "运营、声誉和工期等后果可能仍由医院承担。", "赔偿可以转移部分费用，不能自动补回时间。"], "ref": "r-risk-response", "contextLesson": "risk-response", "fingerprint": "ef58507163ea8604", "legacyFingerprint": "d5f734f9935db995"}, {"id": "risk-response-q2", "prompt": "团队改用新供应商后，原交期风险仍未完全消失，并新增接口不兼容的可能性。两项分别属于什么？", "options": ["两者都已转成确定发生的问题", "次生风险、残余风险", "残余风险、次生风险"], "correct": 2, "feedback": ["题目仍描述可能性，没有确认事件已经发生。", "这两个定义颠倒了。", "原风险实施措施后仍存在的部分是残余；措施引入的新风险是次生。"], "ref": "r-risk-response", "contextLesson": "risk-response", "fingerprint": "e6dc247282c85c26", "legacyFingerprint": "2c1e3f0e5b31a854"}], "refs": ["r-risk-response"], "applications": [{"id": "a-risk-response", "kind": "方案比较", "prompt": "设备有20%概率晚到，推迟开放代价较高。现货替代型号贵3000元；原型号可加500元进行生产跟踪；合同也有赔偿条款。比较三项措施各改变什么，还需要哪些信息。", "answer": "现货替代可能避免原型号的供货暴露，需核对可用性、规格和新增风险。跟踪主要帮助减轻或提前发现延迟，需估计效果。赔偿主要转移部分经济责任，不能保证交期。比较时还需残余概率、工期后果、实施成本、授权和应急能力。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "7.3", "order": 60, "priorLesson": "risk-model-choice", "terms": [["Risk Response", "风险应对", "为改变风险的来源、发生可能性、后果或承担责任而采取的行动。先说明想改变什么，再选择措施。以下五种策略对同一个交期风险采取不同处理。"], ["Insurance", "保险", "通过合同把约定的经济后果转给保险方承担。赔付范围、免赔条件和未被补偿的工期影响需要分别检查；得到赔偿不等于恢复了开放日期。"], ["Workaround", "临时应变措施", "问题发生后，没有现成预定方案可直接使用时，团队临时制定的处理办法。例如设备确认晚到后，负责人临时安排人工登记。若团队早已规定何时改租备用设备，那属于事先准备的应急计划。"]], "material": {"context": "设备到货可能延迟。项目经理可以改用已有现货、提前确认生产节点、安排合同赔偿，或在可接受影响内保留原方案并准备后备行动。选择策略时应说明它怎样改变风险。", "terms": [["Risk Response", "风险应对", "为改变风险的来源、发生可能性、后果或承担责任而采取的行动。先说明想改变什么，再选择措施。以下五种策略对同一个交期风险采取不同处理。"], ["Insurance", "保险", "通过合同把约定的经济后果转给保险方承担。赔付范围、免赔条件和未被补偿的工期影响需要分别检查；得到赔偿不等于恢复了开放日期。"], ["Workaround", "临时应变措施", "问题发生后，没有现成预定方案可直接使用时，团队临时制定的处理办法。例如设备确认晚到后，负责人临时安排人工登记。若团队早已规定何时改租备用设备，那属于事先准备的应急计划。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>策略<\/th><th>设备到货例子<\/th><th>仍需关注<\/th><\/tr><\/thead><tbody><tr><td>Avoid 避免<\/td><td>取消依赖该进口型号，采用已确认可用现货<\/td><td>替代方案是否满足要求<\/td><\/tr><tr><td>Minimize / Mitigate 减轻<\/td><td>提前检查生产节点，准备可替换设备<\/td><td>剩余概率和替换实施条件<\/td><\/tr><tr><td>Transfer 转移<\/td><td>约定延迟赔偿或保险责任<\/td><td>赔偿不能自动恢复开放日期<\/td><\/tr><tr><td>Accept 接受<\/td><td>确认影响可以承受，规定什么时候启动后备方案<\/td><td>准备谁来做什么<\/td><\/tr><tr><td>Share 分担<\/td><td>与合作方共同备货和承担约定成本<\/td><td>责任边界与协调机制<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "risk-reserve", "topic": "7.1", "title": "安排应急计划与储备", "goal": "安排应急计划与储备", "source": "Lecture 6 · PDF第21–26页", "body": "<p>取号设备可能晚到，项目经理准备必要时租用替代设备。除了预留租金，还需要规定什么时候决定租用、由谁联系供应商。这分别涉及应急计划与应急储备。<\/p><section class=\"concept\"><h2><span lang=\"en\">Contingency Plan<\/span><span>应急计划<\/span><\/h2><p>预先规定某个条件出现后采取的行动。例如，第5天仍无出厂证明时，由采购负责人确认备用设备，并报告能否维持第9天安装。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Contingency Reserve<\/span><span>应急储备<\/span><\/h2><p>为相关不确定性预留的费用或时间。例如，为备用设备租赁预留3000元，并明确采购负责人何时可以使用、需由谁批准。储备提供资源，应急计划说明如何行动。<\/p><\/section><p>设备安装基本估算20,000元，采用1.15的应急乘数，则包含应急储备的总金额为23,000元，新增储备为3,000元。23,000元已经包含基本估算，不能再加到20,000元上。<\/p><div class=\"formula\">包含应急储备的总金额＝基本估算×乘数<br>储备增量＝基本估算×(乘数−1)<\/div><p>储备应与风险、假设和批准规则联系起来。例如到约定确认日期仍未取得出厂证明时，由采购负责人启动替代租赁，按授权使用预算。采购负责人还需要知道何时启动、可以支出多少、由谁批准，才能执行应急计划。<\/p>", "questions": [{"id": "risk-reserve-q1", "prompt": "基本估算20000元，应急乘数1.15。储备增量是多少？", "options": ["3000元", "43000元", "23000元"], "correct": 0, "feedback": ["20000×.15=3000。", "43000是把总额又加了一遍。", "23000是含基本估算的总额。"], "ref": "r-risk-reserve", "contextLesson": "risk-reserve", "fingerprint": "488a94dda0922011", "legacyFingerprint": "488a94dda0922011"}, {"id": "risk-reserve-q2", "prompt": "风险表写“必要时使用储备”，还缺什么才能指导行动？", "options": ["具体触发条件、负责人与授权及行动内容", "只需换成更大的储备金额", "等事件发生后再决定由谁处理"], "correct": 0, "feedback": ["行动要能在触发时被明确执行。", "金额不能替代实施安排。", "预先准备可减少事件发生后的等待和混乱。"], "ref": "r-risk-reserve", "contextLesson": "risk-reserve", "fingerprint": "dd2fd1ef59e79932", "legacyFingerprint": "dd2fd1ef59e79932"}], "refs": ["r-risk-reserve"], "applications": [], "lab": null, "drill": {"id": "risk-reserve-d", "prompt": "基础费用35000元，应急乘数1.12。", "fields": [{"key": "total", "label": "包含应急储备的总金额（元）", "type": "number", "answer": 39200, "tolerance": 0.01}, {"key": "reserve", "label": "应急增量（元）", "type": "number", "answer": 4200, "tolerance": 0.01}], "explanation": "总额35000×1.12=39200；储备39200−35000=4200。", "guided": false, "fingerprint": "3e28f26793f35b02"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "7.3", "order": 61, "priorLesson": "risk-response", "terms": [["Contingency Plan", "应急计划", "预先规定某个条件出现后采取的行动。例如，第5天仍无出厂证明时，由采购负责人确认备用设备，并报告能否维持第9天安装。"], ["Contingency Reserve", "应急储备", "为相关不确定性预留的费用或时间。例如，为备用设备租赁预留3000元，并明确采购负责人何时可以使用、需由谁批准。储备提供资源，应急计划说明如何行动。"]], "material": {"context": "取号设备可能晚到，项目经理准备必要时租用替代设备。除了预留租金，还需要规定什么时候决定租用、由谁联系供应商。这分别涉及应急计划与应急储备。", "terms": [["Contingency Plan", "应急计划", "预先规定某个条件出现后采取的行动。例如，第5天仍无出厂证明时，由采购负责人确认备用设备，并报告能否维持第9天安装。"], ["Contingency Reserve", "应急储备", "为相关不确定性预留的费用或时间。例如，为备用设备租赁预留3000元，并明确采购负责人何时可以使用、需由谁批准。储备提供资源，应急计划说明如何行动。"]], "tables": []}}, {"id": "risk-pram", "topic": "7.1", "title": "PRAM风险管理过程", "goal": "PRAM风险管理过程", "source": "Lecture 6 · 风险控制与PRAM，PDF第27–35页", "body": "<p>风险管理需要持续更新：识别事件只是开始，还要明确谁负责、估计影响、比较措施、安排执行并检查结果。PRAM把这些工作组织成九个相互联系的阶段。<\/p><section class=\"concept\"><h2><span lang=\"en\">Project Risk Analysis and Management (PRAM)<\/span><span>项目风险分析与管理<\/span><\/h2><p>贯穿项目的风险分析和管理过程，强调分析目的、责任、措施与后续管理之间的联系。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>阶段<\/th><th>在设备延迟风险中做什么<\/th><\/tr><\/thead><tbody><tr><td>Define 定义<\/td><td>明确项目目标、交付物和计划<\/td><\/tr><tr><td>Focus 聚焦<\/td><td>确定本次分析的范围、深度与方法<\/td><\/tr><tr><td>Identify 识别<\/td><td>找出关键零件短缺等来源和事件<\/td><\/tr><tr><td>Structure 组织<\/td><td>梳理风险之间及与工作之间的关系<\/td><\/tr><tr><td>Ownership 明确归属<\/td><td>指定采购负责人及相关责任<\/td><\/tr><tr><td>Estimate 估计<\/td><td>估计概率、影响与措施效果<\/td><\/tr><tr><td>Evaluate 评价<\/td><td>比较结果和优先级<\/td><\/tr><tr><td>Plan 规划<\/td><td>制定应对、触发条件和资源安排<\/td><\/tr><tr><td>Manage 管理<\/td><td>执行监测、复查实际效果并更新<\/td><\/tr><\/tbody><\/table><\/div><p>Estimate是形成概率、后果等估计；Evaluate是在这些估计基础上比较并作判断。两者不能合并成一次没有依据的打分。Manage也不只是把风险表归档，而是持续对照实际证据。<\/p>", "questions": [{"id": "risk-pram-q1", "prompt": "采购负责人估计两种措施各需多少费用、能降低多少延迟概率，主要属于哪阶段？", "options": ["Estimate估计", "Manage持续管理", "Ownership明确归属"], "correct": 0, "feedback": ["正在形成措施效果和费用估计。", "跟踪已实施措施与实际结果才更接近Manage。", "指定负责人是Ownership。"], "ref": "r-risk-pram", "contextLesson": "risk-pram", "fingerprint": "b40dcdeced0878a5", "legacyFingerprint": "b40dcdeced0878a5"}, {"id": "risk-pram-q2", "prompt": "团队已有风险评分，却没有任何负责人。PRAM中哪个环节的缺失最直接？", "options": ["Define定义项目", "Structure组织关系", "Ownership明确归属"], "correct": 2, "feedback": ["项目定义也重要，但这里直接缺的是责任。", "分类和关系不能替代负责人。", "风险需要明确由谁跟踪和执行响应。"], "ref": "r-risk-pram", "contextLesson": "risk-pram", "fingerprint": "1a13a7eca9311d46", "legacyFingerprint": "1a13a7eca9311d46"}], "refs": ["r-risk-pram"], "applications": [{"id": "a-risk-pram", "kind": "过程应用", "prompt": "用PRAM九阶段简述“测试人员可能被另一项目同时占用”的处理过程。", "answer": "明确本项目测试窗口与目标；聚焦共享人员风险；识别同时预约；梳理项目和活动关系；指定资源协调者；估计冲突概率与延期；比较优先级和替代人员；计划预约、触发与备用安排；按实际日历持续复查并更新。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "7.3", "order": 62, "priorLesson": "risk-reserve", "terms": [["Project Risk Analysis and Management (PRAM)", "项目风险分析与管理", "贯穿项目的风险分析和管理过程，强调分析目的、责任、措施与后续管理之间的联系。"]], "material": {"context": "风险管理需要持续更新：识别事件只是开始，还要明确谁负责、估计影响、比较措施、安排执行并检查结果。PRAM把这些工作组织成九个相互联系的阶段。", "terms": [["Project Risk Analysis and Management (PRAM)", "项目风险分析与管理", "贯穿项目的风险分析和管理过程，强调分析目的、责任、措施与后续管理之间的联系。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>阶段<\/th><th>在设备延迟风险中做什么<\/th><\/tr><\/thead><tbody><tr><td>Define 定义<\/td><td>明确项目目标、交付物和计划<\/td><\/tr><tr><td>Focus 聚焦<\/td><td>确定本次分析的范围、深度与方法<\/td><\/tr><tr><td>Identify 识别<\/td><td>找出关键零件短缺等来源和事件<\/td><\/tr><tr><td>Structure 组织<\/td><td>梳理风险之间及与工作之间的关系<\/td><\/tr><tr><td>Ownership 明确归属<\/td><td>指定采购负责人及相关责任<\/td><\/tr><tr><td>Estimate 估计<\/td><td>估计概率、影响与措施效果<\/td><\/tr><tr><td>Evaluate 评价<\/td><td>比较结果和优先级<\/td><\/tr><tr><td>Plan 规划<\/td><td>制定应对、触发条件和资源安排<\/td><\/tr><tr><td>Manage 管理<\/td><td>执行监测、复查实际效果并更新<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "risk-register", "topic": "7.1", "title": "记录风险负责人、触发条件与复查", "goal": "记录风险负责人、触发条件与复查", "source": "Lecture 6 · 风险控制与文档化", "body": "<p>采购负责人约定检查出厂证明，却没有人记录日期。等到安装人员发现设备没来，替代供应商也来不及交货了。风险登记册把需要跟进的事项、负责人和行动时点记录在一起。<\/p><section class=\"concept\"><h2><span lang=\"en\">Risk Register<\/span><span>风险登记册<\/span><\/h2><p>持续记录风险事件、评估依据、应对措施和实际结果的资料。每一行应能说明有什么风险、谁在跟进、接下来何时做什么。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Risk Owner<\/span><span>风险负责人<\/span><\/h2><p>负责跟踪某项风险、协调措施并更新信息的人。例如，采购负责人跟踪设备交期，安装负责人评估对现场工作的影响。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Trigger<\/span><span>触发条件<\/span><\/h2><p>用来判断何时启动某项行动的可观察条件。例如，“第5天仍未收到出厂证明”包含日期和证据，比“风险变大时”更容易判断。<\/p><\/section><p>设备预计第8天到货，第9天安装。采购负责人约定第5天检查出厂证明；若尚未获得，就在当天确认替代设备，并报告对安装的影响。这比“持续关注供应商”更能指导行动。<\/p><div class=\"table-scroll\"><table><thead><tr><th>字段<\/th><th>本例内容<\/th><\/tr><\/thead><tbody><tr><td>风险描述<\/td><td>零件短缺可能导致设备晚到，影响安装和开放<\/td><\/tr><tr><td>评估依据<\/td><td>供应商生产节点与历史交付记录<\/td><\/tr><tr><td>负责人<\/td><td>采购负责人<\/td><\/tr><tr><td>措施与触发<\/td><td>第5天仍无出厂证明，启动替代确认<\/td><\/tr><tr><td>下一次复查<\/td><td>第5天；收到新交期时立即更新<\/td><\/tr><tr><td>实际结果<\/td><td>是否取得证明、措施是否启动、最终到货与影响<\/td><\/tr><\/tbody><\/table><\/div><p>下方工作区可编写自己的风险记录。可以先检查记录中是否缺少信息，再对照参考分析，检查措施是否针对原因、负责人能否在触发时采取行动。<\/p>", "questions": [{"id": "risk-register-q1", "prompt": "设备承诺第8天到货，若第5天无出厂证明就需启动替代采购。以下哪项最适合作为该行动的触发条件？", "options": ["供应商风险等级升高，但不规定检查日期或证据", "第5天结束仍未收到可核实的出厂证明", "第8天未到货后再检查是否需替代"], "correct": 1, "feedback": ["评分变化可能提示风险，但缺少本次行动的可观察边界。", "时间、观察证据和后续行动一致，可以执行。", "到第8天才行动可能失去替代供货的时间，晚于已约定触发点。"], "ref": "r-risk-register", "contextLesson": "risk-register", "fingerprint": "1aff56f64088d359", "legacyFingerprint": "16bc6127b604ccd8"}, {"id": "risk-register-q2", "prompt": "采取替代采购措施后设备按时到货，风险记录应怎样更新？", "options": ["把到货日期记入进度表后，不再保留措施与原因", "记录措施、实际到货和剩余风险，并决定后续是否继续跟踪", "保留原预计等级，等项目结束再看实际结果"], "correct": 1, "feedback": ["只记日期会丢失风险处理经验和剩余问题。", "实际结果与措施记录支持关闭、继续跟踪和以后复用。", "新信息应及时进入风险判断。"], "ref": "r-risk-register", "contextLesson": "risk-register", "fingerprint": "1e1912337e05e204", "legacyFingerprint": "37fd64f82098400a"}], "refs": ["r-risk-register"], "applications": [{"id": "a-risk-register", "kind": "接口风险案例", "prompt": "施工方把材料暂放在设备运输通道，供应商按原计划送货。两方各自看似按计划工作，却可能发生什么风险？如何更新管理安排？", "answer": "通道被占会使设备无法进入，造成等待、二次搬运或安全风险。应把通道交接作为接口条件，明确清理与确认责任、交接时间和可观察检查，协调材料堆放与运输计划，并记录异常时的替代安排。"}], "lab": "register", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "7.3", "order": 63, "priorLesson": "risk-pram", "terms": [["Risk Register", "风险登记册", "持续记录风险事件、评估依据、应对措施和实际结果的资料。每一行应能说明有什么风险、谁在跟进、接下来何时做什么。"], ["Risk Owner", "风险负责人", "负责跟踪某项风险、协调措施并更新信息的人。例如，采购负责人跟踪设备交期，安装负责人评估对现场工作的影响。"], ["Trigger", "触发条件", "用来判断何时启动某项行动的可观察条件。例如，“第5天仍未收到出厂证明”包含日期和证据，比“风险变大时”更容易判断。"]], "material": {"context": "采购负责人约定检查出厂证明，却没有人记录日期。等到安装人员发现设备没来，替代供应商也来不及交货了。风险登记册把需要跟进的事项、负责人和行动时点记录在一起。", "terms": [["Risk Register", "风险登记册", "持续记录风险事件、评估依据、应对措施和实际结果的资料。每一行应能说明有什么风险、谁在跟进、接下来何时做什么。"], ["Risk Owner", "风险负责人", "负责跟踪某项风险、协调措施并更新信息的人。例如，采购负责人跟踪设备交期，安装负责人评估对现场工作的影响。"], ["Trigger", "触发条件", "用来判断何时启动某项行动的可观察条件。例如，“第5天仍未收到出厂证明”包含日期和证据，比“风险变大时”更容易判断。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>字段<\/th><th>本例内容<\/th><\/tr><\/thead><tbody><tr><td>风险描述<\/td><td>零件短缺可能导致设备晚到，影响安装和开放<\/td><\/tr><tr><td>评估依据<\/td><td>供应商生产节点与历史交付记录<\/td><\/tr><tr><td>负责人<\/td><td>采购负责人<\/td><\/tr><tr><td>措施与触发<\/td><td>第5天仍无出厂证明，启动替代确认<\/td><\/tr><tr><td>下一次复查<\/td><td>第5天；收到新交期时立即更新<\/td><\/tr><tr><td>实际结果<\/td><td>是否取得证明、措施是否启动、最终到货与影响<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "resource-load", "topic": "8.1", "title": "比较每天所需人员与可用人数", "goal": "比较每天所需人员与可用人数", "source": "Lecture 8 · PDF第4–10页", "body": "<p>医院安排一组人员安装取号设备，另一项工作要安装显示屏。网络图显示两项都能在接口准备完成后开始，但如果它们都需要同一支安装队，就不能仅凭依赖关系认定可同时执行。<\/p><section class=\"concept\"><h2><span lang=\"en\">Resource Loading<\/span><span>资源负载<\/span><\/h2><p>一个时间段内，计划执行的全部工作合计需要多少同类资源。例如，同一天两项安装各需2人，该天的安装人员负载就是4人。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Resource Capacity<\/span><span>资源容量<\/span><\/h2><p>同一时间段内实际能够提供的资源数量或工时。本例安装队每天只有2人，负载4人超过容量2人，意味着当天的原安排无法同时执行。比较时要使用相同资源种类和时间单位。<\/p><\/section><div class=\"table-scroll\"><table><caption>活动资料 · 工期单位：天；可用人员2人<\/caption><thead><tr><th>工作<\/th><th>工期<\/th><th>每天需安装人员<\/th><th>紧前<\/th><\/tr><\/thead><tbody><tr><td>A 准备接口<\/td><td>2<\/td><td>1<\/td><td>无<\/td><\/tr><tr><td>B 安装取号设备<\/td><td>3<\/td><td>2<\/td><td>A<\/td><\/tr><tr><td>C 安装显示屏<\/td><td>2<\/td><td>2<\/td><td>A<\/td><\/tr><tr><td>D 联合测试<\/td><td>1<\/td><td>1<\/td><td>B、C<\/td><\/tr><\/tbody><\/table><\/div><p>按最早时间安排，A在0至2，B在2至5，C在2至4，D在5至6。在2至4期间，B和C每天共需4人，超过可用2人。网络图算出的6天还没有考虑人员不足；负责人需要重新安排，才能确定可执行的完成时间。<\/p><div class=\"formula\">某时段资源负载＝该时段全部执行活动的资源需求之和<\/div><div class=\"table-scroll\"><table><caption>排程前先说明哪些条件必须满足<\/caption><thead><tr><th>约束类型<\/th><th>医院中的限制<\/th><\/tr><\/thead><tbody><tr><td>Physical 物理约束<\/td><td>墙面需要达到安装条件后才能固定标牌<\/td><\/tr><tr><td>Time 时间约束<\/td><td>接待区必须在规定开放日期前可用<\/td><\/tr><tr><td>Resource 资源约束<\/td><td>同一时段只有两名合格安装人员<\/td><\/tr><tr><td>Mixed 混合约束<\/td><td>既有固定开放日期，又有人员和场地限制<\/td><\/tr><\/tbody><\/table><\/div>", "questions": [{"id": "resource-load-q1", "prompt": "B与C同日各需2人，安装队当天只有2人，过载多少？", "options": ["0人，因为两个活动都只写2人", "2人", "4人"], "correct": 1, "feedback": ["同一人员不能同时为两项工作全职服务。", "需求4−容量2=过载2。", "4是总需求，不是超出的数量。"], "ref": "r-resource-load", "contextLesson": "resource-load", "fingerprint": "70c22012d86e5ca8", "legacyFingerprint": "70c22012d86e5ca8"}, {"id": "resource-load-q2", "prompt": "两项任务合计40工时，全天只有一人可投入8小时，能否仅凭总量判断具体排程可行？", "options": ["能，把40工时平均分成每天8小时即可", "能，只要本周40小时总容量足够", "还需检查逐日分布、依赖和可中断性"], "correct": 2, "feedback": ["平均分配可能违反前置条件或连续工作要求，不能未经检查直接平摊。", "周总量足够，仍可能在同一天争用人员。", "日历分布和任务条件决定实际安排。"], "ref": "r-resource-load", "contextLesson": "resource-load", "fingerprint": "b8095b1a2877a2ed", "legacyFingerprint": "b8095b1a2877a2ed"}], "refs": ["r-resource-load"], "applications": [], "lab": null, "drill": {"id": "resource-load-d", "prompt": "测试人员每天可工作8小时。周一任务甲需6小时、乙需4小时；周二甲需2小时、乙需4小时。", "fields": [{"key": "mon", "label": "周一负载（小时）", "type": "number", "answer": 10, "tolerance": 0.01}, {"key": "over", "label": "周一过载（小时）", "type": "number", "answer": 2, "tolerance": 0.01}, {"key": "tue", "label": "周二负载（小时）", "type": "number", "answer": 6, "tolerance": 0.01}], "explanation": "按天分别相加：周一10、超出2；周二6，尚余2。不能用两天平均掩盖周一冲突。", "guided": false, "fingerprint": "1ff4e91287facc83"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.1", "order": 64, "priorLesson": null, "terms": [["Resource Loading", "资源负载", "一个时间段内，计划执行的全部工作合计需要多少同类资源。例如，同一天两项安装各需2人，该天的安装人员负载就是4人。"], ["Resource Capacity", "资源容量", "同一时间段内实际能够提供的资源数量或工时。本例安装队每天只有2人，负载4人超过容量2人，意味着当天的原安排无法同时执行。比较时要使用相同资源种类和时间单位。"]], "material": {"context": "医院安排一组人员安装取号设备，另一项工作要安装显示屏。网络图显示两项都能在接口准备完成后开始，但如果它们都需要同一支安装队，就不能仅凭依赖关系认定可同时执行。", "terms": [["Resource Loading", "资源负载", "一个时间段内，计划执行的全部工作合计需要多少同类资源。例如，同一天两项安装各需2人，该天的安装人员负载就是4人。"], ["Resource Capacity", "资源容量", "同一时间段内实际能够提供的资源数量或工时。本例安装队每天只有2人，负载4人超过容量2人，意味着当天的原安排无法同时执行。比较时要使用相同资源种类和时间单位。"]], "tables": ["<div class=\"table-scroll\"><table><caption>活动资料 · 工期单位：天；可用人员2人<\/caption><thead><tr><th>工作<\/th><th>工期<\/th><th>每天需安装人员<\/th><th>紧前<\/th><\/tr><\/thead><tbody><tr><td>A 准备接口<\/td><td>2<\/td><td>1<\/td><td>无<\/td><\/tr><tr><td>B 安装取号设备<\/td><td>3<\/td><td>2<\/td><td>A<\/td><\/tr><tr><td>C 安装显示屏<\/td><td>2<\/td><td>2<\/td><td>A<\/td><\/tr><tr><td>D 联合测试<\/td><td>1<\/td><td>1<\/td><td>B、C<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><caption>排程前先说明哪些条件必须满足<\/caption><thead><tr><th>约束类型<\/th><th>医院中的限制<\/th><\/tr><\/thead><tbody><tr><td>Physical 物理约束<\/td><td>墙面需要达到安装条件后才能固定标牌<\/td><\/tr><tr><td>Time 时间约束<\/td><td>接待区必须在规定开放日期前可用<\/td><\/tr><tr><td>Resource 资源约束<\/td><td>同一时段只有两名合格安装人员<\/td><\/tr><tr><td>Mixed 混合约束<\/td><td>既有固定开放日期，又有人员和场地限制<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "resource-level", "topic": "8.1", "title": "资源平滑与资源平衡", "goal": "资源平滑与资源平衡", "source": "Lecture 8 · PDF第11–15页", "body": "<p>接待区只有两名安装人员，安装取号设备和安装显示屏都需要这两人。两项工作在技术上可以并行，人员却无法同时完成两份工作。负责人需要比较能否在原期限内错开，还是必须延后项目完成时间。<\/p><section class=\"concept\"><h2><span lang=\"en\">Resource Leveling / Resource Smoothing<\/span><span>资源平衡／资源平滑<\/span><\/h2><p>通过调整活动时段，减少资源过载或用量起伏。先确定题目允许改变什么：若完工日期固定，就在可用时差内移动工作；若资源容量固定且原日期不可行，就需要比较延期、增员或改变方法。Resource Smoothing常用于强调不改变完工期限的平滑安排；课程也将它作为Resource Leveling的别称，因此应以题目给定约束为判断依据。<\/p><\/section><p>下面仍用接口准备、取号设备、显示屏和联合测试四项工作。可用2人，B和C各需2人，必须串行使用安装队。如果仍要求6天完成，两名人员无法按依赖顺序做完这些工作；把C移到B完成后，D在两项安装完成后开始，项目需8天。<\/p><p>C原有1天总时差，但只把它从2移到3，仍会与B重叠。存在时差不保证冲突一定能在原期限内解决。修改人员上限时可以比较另一种方案，但增加容量也需要真实的资源来源。<\/p><div class=\"worked-example\"><h3>重排的检查顺序<\/h3><p>先按活动表画网络，列出工期、资源、最早与最迟时间，找出超容量时段；移动活动后重新检查依赖、逐日负载和项目完成时间。<\/p><\/div>", "questions": [{"id": "resource-level-q1", "prompt": "保持2人容量且B、C都需要2人，B持续3天、C持续2天，接口准备完后这段至少需多久？", "options": ["5天", "4天", "3天"], "correct": 0, "feedback": ["同一安装队串行执行3+2=5天。", "总需5个安装队工作日。", "3天意味着完全并行，需要4人。"], "ref": "r-resource-level", "contextLesson": "resource-level", "fingerprint": "70f7634e81747b4e", "legacyFingerprint": "70f7634e81747b4e"}, {"id": "resource-level-q2", "prompt": "两项安装技术上并行，各需整支2人安装队。重排后项目从6天变成8天且无资源冲突。这个结果证明什么？", "options": ["8天安排满足当前容量，但仍需核对期限和全部依赖", "原来的6天网络计算错了，应删除它", "只要在活动总时差内移动，就一定能恢复6天"], "correct": 0, "feedback": ["逻辑最早6天与资源可行8天回答不同条件下的问题，最终安排还需满足交期。", "6天可能是未加资源约束的正确逻辑工期。", "本例两项必须串行，现有时差未必容得下全部工作。"], "ref": "r-resource-level", "contextLesson": "resource-level", "fingerprint": "bcb8c043dd917cba", "legacyFingerprint": "d2927a2a0c726833"}], "refs": ["r-resource-level"], "applications": [], "lab": "resources", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.1", "order": 65, "priorLesson": "resource-load", "terms": [["Resource Leveling / Resource Smoothing", "资源平衡／资源平滑", "通过调整活动时段，减少资源过载或用量起伏。先确定题目允许改变什么：若完工日期固定，就在可用时差内移动工作；若资源容量固定且原日期不可行，就需要比较延期、增员或改变方法。Resource Smoothing常用于强调不改变完工期限的平滑安排；课程也将它作为Resource Leveling的别称，因此应以题目给定约束为判断依据。"]], "material": {"context": "接待区只有两名安装人员，安装取号设备和安装显示屏都需要这两人。两项工作在技术上可以并行，人员却无法同时完成两份工作。负责人需要比较能否在原期限内错开，还是必须延后项目完成时间。", "terms": [["Resource Leveling / Resource Smoothing", "资源平衡／资源平滑", "通过调整活动时段，减少资源过载或用量起伏。先确定题目允许改变什么：若完工日期固定，就在可用时差内移动工作；若资源容量固定且原日期不可行，就需要比较延期、增员或改变方法。Resource Smoothing常用于强调不改变完工期限的平滑安排；课程也将它作为Resource Leveling的别称，因此应以题目给定约束为判断依据。"]], "tables": []}}, {"id": "resource-priority", "topic": "8.1", "title": "资源不足时怎样安排工作顺序", "goal": "资源不足时怎样安排工作顺序", "source": "Lecture 8 · PDF第11–15页", "body": "<p>两项工作都已经具备开始条件，但只能安排一项。项目经理可以用一致的优先规则形成方案，再检查它对整个项目的影响。<\/p><section class=\"concept\"><h2><span lang=\"en\">Scheduling Heuristics<\/span><span>排程启发规则<\/span><\/h2><p>用较容易执行的规则选择活动顺序，例如最小总时差、最短工期、最多后继、最大资源需求或较小活动编号。它们帮助构造方案，不保证全局最优。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>规则<\/th><th>何时优先<\/th><th>需要继续检查<\/th><\/tr><\/thead><tbody><tr><td>Minimum Slack 最小总时差<\/td><td>延迟余地最小的活动<\/td><td>其他活动是否还能在可用窗口完成<\/td><\/tr><tr><td>Shortest Duration 最短工期<\/td><td>工期较短、能让执行人员较早开始下一项工作的活动<\/td><td>是否推迟长工期关键工作<\/td><\/tr><tr><td>Most Successors 最多后继<\/td><td>完成后有较多后续工作可以开始的活动<\/td><td>后续是否确实有资源开工<\/td><\/tr><tr><td>Lowest ID / First Come 较小编号／先到<\/td><td>按预先约定的编号或就绪顺序<\/td><td>只有编号代表到达顺序时，两种规则才一致<\/td><\/tr><tr><td>Greatest Resource Demand 最大资源需求<\/td><td>需要较多资源的活动优先<\/td><td>仍需检查可用容量与对其他活动交期的影响<\/td><\/tr><\/tbody><\/table><\/div><div class=\"worked-example\"><h3>按最小总时差安排<\/h3><p>设备测试TF=0，标牌复查TF=4，只有一名检查员。如果两项均可开始，最小总时差规则优先设备测试；仍需检查标牌复查是否能在4天余量内完整安排。<\/p><\/div>", "questions": [{"id": "resource-priority-q1", "prompt": "甲TF=0、工期4天，乙TF=3、工期1天。最小总时差规则与最短工期规则分别选谁？", "options": ["都选甲", "前者乙，后者甲", "前者甲，后者乙"], "correct": 2, "feedback": ["不同规则的目标和排序依据不同。", "两种依据被反过来了。", "最小总时差看TF，最短工期看持续时间。"], "ref": "r-resource-priority", "contextLesson": "resource-priority", "fingerprint": "8ac889a305e2bec7", "legacyFingerprint": "a312eeb13b4b810b"}, {"id": "resource-priority-q2", "prompt": "按最小总时差排出一份满足依赖与资源容量的计划。要声称它比另一份可行计划更好，还需做什么？", "options": ["只确认使用的规则来自最小总时差，就能判为最优", "确认全部活动都有开始时间即可", "选定比较目标，并核对两份计划的工期、延期或其他对应指标"], "correct": 2, "feedback": ["启发规则帮助寻找方案，不提供一般的全局最优保证。", "填写开始时间不代表目标表现更好。", "可行说明满足约束，更好需要共同目标和结果比较；全局最优还需进一步证明。"], "ref": "r-resource-priority", "contextLesson": "resource-priority", "fingerprint": "c961f52a90cf62d4", "legacyFingerprint": "f3325967fdd73011"}], "refs": ["r-resource-priority"], "applications": [{"id": "a-resource-priority", "kind": "规则比较", "prompt": "甲工期4、TF0；乙工期1、TF3；丙工期2、TF1。三项均可开始且争用一人。分别列出最小总时差和最短工期顺序，说明还缺哪些信息才能评价哪个更好。", "answer": "最小总时差为甲、丙、乙；最短工期为乙、丙、甲。还需依赖、最迟时间、资源日历、后续活动和评价目标。仅有这三行不能证明哪种完整项目安排更优。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.1", "order": 66, "priorLesson": "resource-level", "terms": [["Scheduling Heuristics", "排程启发规则", "用较容易执行的规则选择活动顺序，例如最小总时差、最短工期、最多后继、最大资源需求或较小活动编号。它们帮助构造方案，不保证全局最优。"]], "material": {"context": "两项工作都已经具备开始条件，但只能安排一项。项目经理可以用一致的优先规则形成方案，再检查它对整个项目的影响。", "terms": [["Scheduling Heuristics", "排程启发规则", "用较容易执行的规则选择活动顺序，例如最小总时差、最短工期、最多后继、最大资源需求或较小活动编号。它们帮助构造方案，不保证全局最优。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>规则<\/th><th>何时优先<\/th><th>需要继续检查<\/th><\/tr><\/thead><tbody><tr><td>Minimum Slack 最小总时差<\/td><td>延迟余地最小的活动<\/td><td>其他活动是否还能在可用窗口完成<\/td><\/tr><tr><td>Shortest Duration 最短工期<\/td><td>工期较短、能让执行人员较早开始下一项工作的活动<\/td><td>是否推迟长工期关键工作<\/td><\/tr><tr><td>Most Successors 最多后继<\/td><td>完成后有较多后续工作可以开始的活动<\/td><td>后续是否确实有资源开工<\/td><\/tr><tr><td>Lowest ID / First Come 较小编号／先到<\/td><td>按预先约定的编号或就绪顺序<\/td><td>只有编号代表到达顺序时，两种规则才一致<\/td><\/tr><tr><td>Greatest Resource Demand 最大资源需求<\/td><td>需要较多资源的活动优先<\/td><td>仍需检查可用容量与对其他活动交期的影响<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "resource-splitting", "topic": "8.1", "title": "把可中断的工作安排在不同时间段", "goal": "把可中断的工作安排在不同时间段", "source": "Lecture 8 · PDF第16–19页", "body": "<p>检查员找不到连续三天复查指路牌，但第2天和第5至6天有空。如果三组指路牌可以分别检查，就能把这项工作分开安排；是否允许这样做，需要由具体工作条件决定。<\/p><section class=\"concept\"><h2><span lang=\"en\">Task Splitting<\/span><span>任务拆分<\/span><\/h2><p>在工作允许中断和恢复的条件下，把一项活动安排在多个不连续时段。总工作量仍应完成，并计入切换或恢复成本。<\/p><\/section><p>检查员只有第2天和第5至6天可以复查三组指路牌，每组需1天，三组相互独立。若工作允许中断，可以先查一组，之后再查两组。从首次开始到最终完成要经过更长时间，检查员实际仍需工作3天。<\/p><div class=\"table-scroll\"><table><thead><tr><th>安排<\/th><th>工作量<\/th><th>开始至最终完成的跨度<\/th><\/tr><\/thead><tbody><tr><td>第2天查1组，第5至6天查2组<\/td><td>3个工作日<\/td><td>从第2天开始至第6天结束<\/td><\/tr><tr><td>连续三天检查<\/td><td>3个工作日<\/td><td>需找到连续3天可用窗口<\/td><\/tr><\/tbody><\/table><\/div><p>混凝土连续浇筑、需要稳定运行的测试等工作可能不允许任意暂停。拆分前要查：前置是否已完成、每段容量、累计工作量、恢复成本、后继是否等待全部完成。资源工作区提供可中断的显示屏安装安排，用于比较中断与连续两种时间分布。<\/p>", "questions": [{"id": "resource-splitting-q1", "prompt": "一项3天工作拆成1天和2天，中间停2天，忽略恢复成本。工作量与开始至完成跨度分别怎样变化？", "options": ["工作量变5天，跨度仍3天", "工作量仍3天，跨度变5天", "两者都不变"], "correct": 1, "feedback": ["停顿不自动增加执行工作量。", "累计执行3天，加停顿2天，跨度5天。", "中断会延长从开始到完成的时间。"], "ref": "r-resource-splitting", "contextLesson": "resource-splitting", "fingerprint": "ab2ef5f41ca89a42", "legacyFingerprint": "ab2ef5f41ca89a42"}, {"id": "resource-splitting-q2", "prompt": "检查员有两个空档，各1天。要把原需连续2天的设备稳定性测试拆开，最先需确认什么？", "options": ["只要最后完成日期不变就可采用", "测试要求是否允许中断，中断后结果是否仍有效", "两个空档之和是否为2天即可"], "correct": 1, "feedback": ["最终日期相同也可能不满足连续测试要求。", "稳定性测试可能要求连续运行，先查技术条件。", "时间合计吻合不能证明可以中断。"], "ref": "r-resource-splitting", "contextLesson": "resource-splitting", "fingerprint": "3395b70628ddbfb4", "legacyFingerprint": "83b72ff3b08f7c9a"}], "refs": ["r-resource-splitting"], "applications": [], "lab": null, "drill": {"id": "resource-splitting-d", "prompt": "检查共需4个执行日，先做1天，停2天，再做3天；恢复时另需1天校准，同一人员执行。", "fields": [{"key": "work", "label": "含校准的执行工作量（天）", "type": "number", "answer": 5, "tolerance": 0.01}, {"key": "span", "label": "开始至最终完成跨度（天）", "type": "number", "answer": 7, "tolerance": 0.01}], "explanation": "实际执行1+1+3=5天，再加2天停顿，跨度7天。", "guided": false, "fingerprint": "9f8825087d340896"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.1", "order": 67, "priorLesson": "resource-priority", "terms": [["Task Splitting", "任务拆分", "在工作允许中断和恢复的条件下，把一项活动安排在多个不连续时段。总工作量仍应完成，并计入切换或恢复成本。"]], "material": {"context": "检查员找不到连续三天复查指路牌，但第2天和第5至6天有空。如果三组指路牌可以分别检查，就能把这项工作分开安排；是否允许这样做，需要由具体工作条件决定。", "terms": [["Task Splitting", "任务拆分", "在工作允许中断和恢复的条件下，把一项活动安排在多个不连续时段。总工作量仍应完成，并计入切换或恢复成本。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>安排<\/th><th>工作量<\/th><th>开始至最终完成的跨度<\/th><\/tr><\/thead><tbody><tr><td>第2天查1组，第5至6天查2组<\/td><td>3个工作日<\/td><td>从第2天开始至第6天结束<\/td><\/tr><tr><td>连续三天检查<\/td><td>3个工作日<\/td><td>需找到连续3天可用窗口<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "multi-queue", "topic": "8.1", "title": "多个项目共用测试台的安排", "goal": "多个项目共用测试台的安排", "source": "Lecture 8 · PDF第20页", "body": "<p>医院的接待区、药房和门诊叫号三个项目都需要同一个测试台。每个项目单独看都能马上开始，放在同一日历上却不能同时占用。资源协调者需要统一确定顺序。<\/p><section class=\"concept\"><h2><span lang=\"en\">Multiproject Resource Scheduling<\/span><span>多项目资源排程<\/span><\/h2><p>在多个项目共享容量的条件下，安排资源顺序和各项目开始进入执行的时间，并比较各项目延期及整体完成表现。<\/p><\/section><div class=\"table-scroll\"><table><caption>所有时间以天计，测试连续执行，一次只服务一个项目<\/caption><thead><tr><th>项目<\/th><th>测试台占用<\/th><th>可开始<\/th><th>目标完成<\/th><\/tr><\/thead><tbody><tr><td>A 接待区<\/td><td>3<\/td><td>0<\/td><td>5<\/td><\/tr><tr><td>B 药房<\/td><td>2<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>C 门诊叫号<\/td><td>4<\/td><td>0<\/td><td>10<\/td><\/tr><\/tbody><\/table><\/div><p>按A、B、C执行，完成时间为3、5、9，药房比目标晚1天。按B、A、C执行，完成时间为2、5、9，三项均满足目标。总工作量仍是9天，但各项目等待和延期不同。<\/p><p>下面可调整顺序、占用时长与目标日期，比较每项等待、完成和延期。评价时同时看总延期、最后一个项目的完成时间和所有项目的平均完成时间，避免只用测试台利用率判断一切。<\/p>", "questions": [{"id": "multi-queue-q1", "prompt": "按A3天、B2天、C4天执行，B目标4，B会延期多少？", "options": ["2天", "0天", "1天"], "correct": 2, "feedback": ["2是B自身执行时长。", "B从3开始，到5结束。", "完成5−目标4=延期1。"], "ref": "r-multi-queue", "contextLesson": "multi-queue", "fingerprint": "76127ef84f7b4ebf", "legacyFingerprint": "76127ef84f7b4ebf"}, {"id": "multi-queue-q2", "prompt": "两个顺序都让测试台连续忙9天，是否说明效果相同？", "options": ["不同，各项目等待和延期可能不同", "相同，最后完成时间一致就表示总延期一致", "相同，资源利用率一致即可"], "correct": 0, "feedback": ["即使整体完工相同，交付分布也可能不同。", "最后完成时间相同，早期项目的完成日期和各自目标仍可能不同。", "利用率遗漏了项目交期和等待。"], "ref": "r-multi-queue", "contextLesson": "multi-queue", "fingerprint": "05ce4f7eb1a697d7", "legacyFingerprint": "05ce4f7eb1a697d7"}], "refs": ["r-multi-queue"], "applications": [], "lab": "queue", "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.2", "order": 68, "priorLesson": "resource-splitting", "terms": [["Multiproject Resource Scheduling", "多项目资源排程", "在多个项目共享容量的条件下，安排资源顺序和各项目开始进入执行的时间，并比较各项目延期及整体完成表现。"]], "material": {"context": "医院的接待区、药房和门诊叫号三个项目都需要同一个测试台。每个项目单独看都能马上开始，放在同一日历上却不能同时占用。资源协调者需要统一确定顺序。", "terms": [["Multiproject Resource Scheduling", "多项目资源排程", "在多个项目共享容量的条件下，安排资源顺序和各项目开始进入执行的时间，并比较各项目延期及整体完成表现。"]], "tables": ["<div class=\"table-scroll\"><table><caption>所有时间以天计，测试连续执行，一次只服务一个项目<\/caption><thead><tr><th>项目<\/th><th>测试台占用<\/th><th>可开始<\/th><th>目标完成<\/th><\/tr><\/thead><tbody><tr><td>A 接待区<\/td><td>3<\/td><td>0<\/td><td>5<\/td><\/tr><tr><td>B 药房<\/td><td>2<\/td><td>0<\/td><td>4<\/td><\/tr><tr><td>C 门诊叫号<\/td><td>4<\/td><td>0<\/td><td>10<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "multi-wip", "topic": "8.1", "title": "同时开工、等待与切换时间", "goal": "同时开工、等待与切换时间", "source": "Lecture 8 · PDF第20页", "body": "<p>接待区、药房和门诊叫号三个项目都准备使用同一台测试台。如果三个项目同时开始测试阶段，其中两个仍要等待。项目数量增加，并没有增加测试台每一天能完成的工作。<\/p><section class=\"concept\"><h2><span lang=\"en\">Work in Process (WIP)<\/span><span>在制工作<\/span><\/h2><p>已经开始但尚未完成的工作或项目。多个项目同时启动却等待同一瓶颈，可能增加在制工作和协调负担。<\/p><\/section><p>接待区需要测试3天、药房2天、门诊叫号4天，三项都已准备好。若同时开始测试阶段，其中两个项目仍只能等待测试台。按预约顺序进入测试阶段，可以减少等待中的在制项目；三项测试合计仍需占用测试台9天。<\/p><div class=\"worked-example\"><h3>切换的额外代价<\/h3><p>甲、乙两项目各有两项独立测试，每项1天，允许在项目之间切换。按甲甲乙乙执行，工作4天、切换1次；按甲乙甲乙执行，工作仍为4天、切换3次。每次切换需半天时，两种安排分别用4.5天和5.5天，交替安排多用1天。<\/p><\/div><p>减少在制工作需要配合项目优先级和准备工作。不能机械地让所有上游人员等待；应确保测试台轮到某项目时，资料、设备与人员都已准备好。<\/p>", "questions": [{"id": "multi-wip-q1", "prompt": "两项目各需连续2天测试，共用一台测试台。两项都在时间0宣布开始，但只能先做甲再做乙，且无切换耗时。乙实际何时开始测试？", "options": ["时间0，因为已经宣布开始", "时间4，因为要等两个项目都完成", "时间2，因为先等甲完成"], "correct": 2, "feedback": ["开始项目或阶段不等于已经获得设备。", "4是两项全部完成时间。", "甲占用0至2，乙最早从2开始。"], "ref": "r-multi-wip", "contextLesson": "multi-wip", "fingerprint": "24bc32ac9497ed24", "legacyFingerprint": "4e805166e8b1e423"}, {"id": "multi-wip-q2", "prompt": "两项测试各需2天。连续做完甲再做乙时，只有1次切换；交替执行甲乙甲乙时有3次切换。每次切换0.5天，后者比前者多多久？", "options": ["1天", "0.5天", "1.5天"], "correct": 0, "feedback": ["(3−1)×0.5=1天；比较时两种方案都按同一切换规则。", "两种安排相差2次切换。", "1.5是后者全部切换时间，未减去前者0.5。"], "ref": "r-multi-wip", "contextLesson": "multi-wip", "fingerprint": "67155d781dde938d", "legacyFingerprint": "97aa69e7546ac97b"}], "refs": ["r-multi-wip"], "applications": [], "lab": null, "drill": {"id": "multi-wip-d", "prompt": "两项目各需3个测试日，排成A-B-A-B-A-B，每次跨项目切换需0.2天。", "fields": [{"key": "switch", "label": "切换次数", "type": "number", "answer": 5, "tolerance": 0.01}, {"key": "total", "label": "总历时（天）", "type": "number", "answer": 7, "tolerance": 0.01}], "explanation": "6个工作段之间有5次切换；6+5×0.2=7天。", "guided": false, "fingerprint": "d0ce84b3054f387b"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.2", "order": 69, "priorLesson": "multi-queue", "terms": [["Work in Process (WIP)", "在制工作", "已经开始但尚未完成的工作或项目。多个项目同时启动却等待同一瓶颈，可能增加在制工作和协调负担。"]], "material": {"context": "接待区、药房和门诊叫号三个项目都准备使用同一台测试台。如果三个项目同时开始测试阶段，其中两个仍要等待。项目数量增加，并没有增加测试台每一天能完成的工作。", "terms": [["Work in Process (WIP)", "在制工作", "已经开始但尚未完成的工作或项目。多个项目同时启动却等待同一瓶颈，可能增加在制工作和协调负担。"]], "tables": []}}, {"id": "multi-decisions", "topic": "8.1", "title": "比较多个项目的优先级", "goal": "比较多个项目的优先级", "source": "Lecture 8 · 多项目资源评价", "body": "<p>同一测试台可能面对硬性开放日期、不同战略价值和不同延误后果。最早到达、最早期限、最短测试时间、最大需求等规则会给出不同顺序。资源协调者需要说明采用什么目标，以及谁承担相应等待。<\/p><div class=\"table-scroll\"><table><thead><tr><th>判断依据<\/th><th>需要的信息<\/th><\/tr><\/thead><tbody><tr><td>交期风险<\/td><td>目标日期、延误后果、剩余工作<\/td><\/tr><tr><td>业务优先级<\/td><td>开放需求、批准的项目优先级<\/td><\/tr><tr><td>资源效率<\/td><td>占用时长、准备与切换成本<\/td><\/tr><tr><td>可执行性<\/td><td>资料是否齐全、前置是否完成、预约是否可用<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-scroll\"><table><thead><tr><th>资源分配规则<\/th><th>采用前需要判断什么<\/th><\/tr><\/thead><tbody><tr><td>First In Line 先到先服务<\/td><td>以事先约定的到达或就绪顺序排队<\/td><\/tr><tr><td>Greatest Resource Demand 最大资源需求<\/td><td>优先满足需求量较大的项目，继续检查对其他项目的影响<\/td><\/tr><tr><td>Greatest Resource Utilization 最大资源利用<\/td><td>比较安排能否减少资源闲置，同时核对交期<\/td><\/tr><tr><td>Minimum Late Finish Time 最小最迟完成时间<\/td><td>优先最迟完成时点较早的工作；这个时点由网络或约束推得，不一定等于项目对外截止日期<\/td><\/tr><tr><td>Mathematical Programming 数学规划<\/td><td>把选择或开始时间设为变量，写出容量、依赖等约束，再按选定目标求解<\/td><\/tr><\/tbody><\/table><\/div><p>如果药房项目尚未完成接口配置，即使目标日期最早，也不能直接占用测试台空等。可以先执行已准备好的项目，并明确药房准备完成后的新顺序。每次调整都需要更新共同日历，而非让各项目各自保留相冲突的预约。<\/p>", "questions": [{"id": "multi-decisions-q1", "prompt": "药房目标最早，但接口配置未完成；接待区已准备好。下一步应怎样评估？", "options": ["先让药房占住测试台等待", "比较可执行项目与交期影响，调整共享日历并跟进药房准备", "各项目继续保留同一时段"], "correct": 1, "feedback": ["占用却无法执行会浪费瓶颈能力。", "优先级还要与可执行条件一起考虑。", "冲突预约不能同时兑现。"], "ref": "r-multi-decisions", "contextLesson": "multi-decisions", "fingerprint": "548be67ab2151937", "legacyFingerprint": "548be67ab2151937"}, {"id": "multi-decisions-q2", "prompt": "项目经理选择最短工作优先，报告应补充什么？", "options": ["规则名称即可", "只说所有项目都同等重要", "对截止风险、等待和整体交付的影响及选择理由"], "correct": 2, "feedback": ["规则名称不说明实际取舍。", "抽象表态不能决定资源顺序。", "不同指标可能冲突，需要记录依据。"], "ref": "r-multi-decisions", "contextLesson": "multi-decisions", "fingerprint": "6d032b2e663326f1", "legacyFingerprint": "6d032b2e663326f1"}], "refs": ["r-multi-decisions"], "applications": [{"id": "a-multi-decisions", "kind": "资源协调案例", "prompt": "接待区测试需3天，目标5；药房需2天，目标4，但直到时点2才准备好；测试台从0可用。比较“先接待区”和“等药房先测”。", "answer": "先接待区0至3，药房3至5，药房延期1天；等药房则测试台0至2空闲，药房2至4，接待区4至7，接待区延期2天。仅按这两项总延期，前者1天少于后者2天；如某期限为硬约束，还要据此调整资源或方案。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.2", "order": 70, "priorLesson": "multi-wip", "terms": [], "material": {"context": "同一测试台可能面对硬性开放日期、不同战略价值和不同延误后果。最早到达、最早期限、最短测试时间、最大需求等规则会给出不同顺序。资源协调者需要说明采用什么目标，以及谁承担相应等待。", "terms": [], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>判断依据<\/th><th>需要的信息<\/th><\/tr><\/thead><tbody><tr><td>交期风险<\/td><td>目标日期、延误后果、剩余工作<\/td><\/tr><tr><td>业务优先级<\/td><td>开放需求、批准的项目优先级<\/td><\/tr><tr><td>资源效率<\/td><td>占用时长、准备与切换成本<\/td><\/tr><tr><td>可执行性<\/td><td>资料是否齐全、前置是否完成、预约是否可用<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><thead><tr><th>资源分配规则<\/th><th>采用前需要判断什么<\/th><\/tr><\/thead><tbody><tr><td>First In Line 先到先服务<\/td><td>以事先约定的到达或就绪顺序排队<\/td><\/tr><tr><td>Greatest Resource Demand 最大资源需求<\/td><td>优先满足需求量较大的项目，继续检查对其他项目的影响<\/td><\/tr><tr><td>Greatest Resource Utilization 最大资源利用<\/td><td>比较安排能否减少资源闲置，同时核对交期<\/td><\/tr><tr><td>Minimum Late Finish Time 最小最迟完成时间<\/td><td>优先最迟完成时点较早的工作；这个时点由网络或约束推得，不一定等于项目对外截止日期<\/td><\/tr><tr><td>Mathematical Programming 数学规划<\/td><td>把选择或开始时间设为变量，写出容量、依赖等约束，再按选定目标求解<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "toc-bottleneck", "topic": "8.2", "title": "找出限制整体产出的瓶颈", "goal": "找出限制整体产出的瓶颈", "source": "Lecture 9 · PDF第17–19页", "body": "<p>医院每天能安装8台终端、配置6台、测试3台。如果完成必须经过三步，且其他条件相同，继续增加安装速度不一定增加最终交付数量。测试环节限制了当前整体产出。<\/p><section class=\"concept\"><h2><span lang=\"en\">Bottleneck<\/span><span>瓶颈<\/span><\/h2><p>限制整个流程产出的环节。本例每台终端都要安装、配置和测试；即使前两步每天能处理更多，测试每天只能完成3台，最终交付仍受它限制。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Theory of Constraints (TOC)<\/span><span>约束理论<\/span><\/h2><p>围绕当前限制整体产出的约束组织改进：先识别约束，充分利用现有能力，让其他环节配合，再提升约束能力，并重新寻找下一处限制。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>步骤<\/th><th>在测试环节中的做法<\/th><\/tr><\/thead><tbody><tr><td>Identify 识别约束<\/td><td>找出每天只能测试3台的限制<\/td><\/tr><tr><td>Exploit 充分利用现有约束<\/td><td>提前准备资料，减少测试台空等和返工<\/td><\/tr><tr><td>Subordinate 其他环节配合<\/td><td>安装与配置按测试能力和缓冲安排节奏<\/td><\/tr><tr><td>Elevate 提升约束能力<\/td><td>需要时增加测试能力或改进测试方法<\/td><\/tr><tr><td>Repeat 重复<\/td><td>测试提高后，重新找限制整体的环节<\/td><\/tr><\/tbody><\/table><\/div><p>Exploit首先改善现有能力的有效使用；Elevate进一步提高能力。测试从3台/天提高到7台/天后，配置6台/天可能成为新约束，需要重新分析。<\/p>", "questions": [{"id": "toc-bottleneck-q1", "prompt": "安装8、配置6、测试3台/天；增加安装到12台/天，其他不变，稳定产出上限怎样变化？", "options": ["由3提高到6", "仍受测试3台/天限制", "由3提高到12"], "correct": 1, "feedback": ["配置6也高于测试3。", "串行流程整体受当前瓶颈限制。", "后续测试能力没有增加。"], "ref": "r-toc-bottleneck", "contextLesson": "toc-bottleneck", "fingerprint": "5c4c54dad55350d2", "legacyFingerprint": "5c4c54dad55350d2"}, {"id": "toc-bottleneck-q2", "prompt": "提前准备测试资料以减少测试台空等，属于哪一步？", "options": ["只属于增加上游在制品", "Exploit充分利用现有约束", "Elevate新增容量"], "correct": 1, "feedback": ["准备需要的输入并非无节制增加在制品。", "没有新增设备，而是更好使用现有瓶颈。", "这里没有直接新增名义容量。"], "ref": "r-toc-bottleneck", "contextLesson": "toc-bottleneck", "fingerprint": "4182f2dd4887d3a6", "legacyFingerprint": "4182f2dd4887d3a6"}], "refs": ["r-toc-bottleneck"], "applications": [], "lab": null, "drill": {"id": "toc-bottleneck-d", "prompt": "安装8、配置6、测试3台/天，均需经过这三步；测试能力提高到7台/天。忽略启动和在制品影响。", "fields": [{"key": "before", "label": "原稳定产出上限（台/天）", "type": "number", "answer": 3, "tolerance": 0.01}, {"key": "after", "label": "新稳定产出上限（台/天）", "type": "number", "answer": 6, "tolerance": 0.01}, {"key": "bottleneck", "label": "新的瓶颈", "type": "select", "options": ["安装", "配置", "测试"], "answer": 1}], "explanation": "原瓶颈测试3，新瓶颈配置6；安装8与测试7均高于6。", "guided": false, "fingerprint": "94fc4a9c870c5f49"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.3", "order": 71, "priorLesson": null, "terms": [["Bottleneck", "瓶颈", "限制整个流程产出的环节。本例每台终端都要安装、配置和测试；即使前两步每天能处理更多，测试每天只能完成3台，最终交付仍受它限制。"], ["Theory of Constraints (TOC)", "约束理论", "围绕当前限制整体产出的约束组织改进：先识别约束，充分利用现有能力，让其他环节配合，再提升约束能力，并重新寻找下一处限制。"]], "material": {"context": "医院每天能安装8台终端、配置6台、测试3台。如果完成必须经过三步，且其他条件相同，继续增加安装速度不一定增加最终交付数量。测试环节限制了当前整体产出。", "terms": [["Bottleneck", "瓶颈", "限制整个流程产出的环节。本例每台终端都要安装、配置和测试；即使前两步每天能处理更多，测试每天只能完成3台，最终交付仍受它限制。"], ["Theory of Constraints (TOC)", "约束理论", "围绕当前限制整体产出的约束组织改进：先识别约束，充分利用现有能力，让其他环节配合，再提升约束能力，并重新寻找下一处限制。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>步骤<\/th><th>在测试环节中的做法<\/th><\/tr><\/thead><tbody><tr><td>Identify 识别约束<\/td><td>找出每天只能测试3台的限制<\/td><\/tr><tr><td>Exploit 充分利用现有约束<\/td><td>提前准备资料，减少测试台空等和返工<\/td><\/tr><tr><td>Subordinate 其他环节配合<\/td><td>安装与配置按测试能力和缓冲安排节奏<\/td><\/tr><tr><td>Elevate 提升约束能力<\/td><td>需要时增加测试能力或改进测试方法<\/td><\/tr><tr><td>Repeat 重复<\/td><td>测试提高后，重新找限制整体的环节<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "chain-resource", "topic": "8.2", "title": "考虑资源约束后的关键链", "goal": "考虑资源约束后的关键链", "source": "Lecture 9 · PDF第20–30页", "body": "<p>接待区准备好接口后，取号设备安装和显示屏安装在逻辑上可以同时开始，但两项都需要同一支队伍。项目经理必须确定谁先用这支队伍，资源顺序会成为排程的一部分。<\/p><section class=\"concept\"><h2><span lang=\"en\">Critical Chain Project Management (CCPM) / Critical Chain<\/span><span>关键链项目管理／关键链<\/span><\/h2><p>关键链是同时考虑工作先后关系和资源约束后，决定项目完成时间的活动链。关键链项目管理还把为不确定性预留的时间集中为缓冲，并在执行中跟踪使用情况。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>比较对象<\/th><th>关键路径CPM<\/th><th>关键链CCPM<\/th><\/tr><\/thead><tbody><tr><td>识别依据<\/td><td>活动逻辑与工期；标准网络先算逻辑时间<\/td><td>活动逻辑、资源顺序及所采用的工期估计<\/td><\/tr><tr><td>余量与保护<\/td><td>根据网络计算总时差与自由时差<\/td><td>把安全时间集中成不同位置的缓冲<\/td><\/tr><tr><td>资源<\/td><td>需要另行核对资源可行性<\/td><td>识别关键链时已处理资源冲突<\/td><\/tr><\/tbody><\/table><\/div><section class=\"concept\"><h2><span lang=\"en\">50% Probability Duration<\/span><span>50%完成概率的工期估计<\/span><\/h2><p>如果一项活动的估计工期为6天，且有50%的可能在6天内完成，这描述的是工期分布中的中间位置。它不等于把任何原估计机械除以2，也不表示项目有50%的缓冲。活动估计与后面按链长50%设置缓冲，是两个不同概念。<\/p><\/section><p>资源顺序不是产品本身的技术依赖。若未来增加安装队，两项工作可能恢复并行，排程应重新计算。关键链与关键路径在资源充足时可能相同，在存在资源冲突时可能不同。<\/p><div class=\"worked-example\"><h3>共享安装队形成顺序<\/h3><p>接口准备2天，设备安装3天，显示屏安装2天，联合测试1天。只有一队时，两项安装串行，整条安排共8天。资源充足时逻辑最短工期为6天。<\/p><\/div>", "questions": [{"id": "chain-resource-q1", "prompt": "安装取号设备与安装显示屏因共用一队而串行，原技术条件允许并行。增加第二支合格队伍后，首先应重查什么？", "options": ["只修改人员数量，完成时间和关键链一定不变", "是否可取消这条资源顺序，并重新计算关键链与完成时间", "两项既已画成前后，就永远不能恢复并行"], "correct": 1, "feedback": ["改变容量可能改变可行排程及决定完成的活动链。", "资源变化可能消除原冲突，但仍需核对其他依赖与容量。", "资源顺序来自当时的资源条件，不是永久技术要求。"], "ref": "r-chain-resource", "contextLesson": "chain-resource", "fingerprint": "bd22ff8c5877611e", "legacyFingerprint": "fa5ab904f056057b"}, {"id": "chain-resource-q2", "prompt": "关键链方法说资源冲突在识别关键链时已处理，应怎样理解？", "options": ["资源平衡被纳入识别过程，仍需验证可执行性", "无需考虑资源容量", "所有活动都可以晚开始且不设保护"], "correct": 0, "feedback": ["没有省略容量约束，只是处理位置不同。", "关键链明确考虑资源。", "晚开始需要缓冲与资源安排配合。"], "ref": "r-chain-resource", "contextLesson": "chain-resource", "fingerprint": "c3977ab11488e030", "legacyFingerprint": "c3977ab11488e030"}], "refs": ["r-chain-resource"], "applications": [{"id": "a-chain-resource", "kind": "关键路径与关键链比较", "prompt": "两个逻辑并行活动各需4天，均需同一工程师全职执行。另一条独立路径需6天。忽略切换时间，说明只看逻辑关键路径会漏掉什么。", "answer": "逻辑最长路径为6天，但两个并行活动争用同一人，需排成合计8天的资源顺序。资源可行的完成时间至少8天，决定完成的链可能因此改变。还要检查这两项的前后接口。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.3", "order": 72, "priorLesson": "toc-bottleneck", "terms": [["Critical Chain Project Management (CCPM) / Critical Chain", "关键链项目管理／关键链", "关键链是同时考虑工作先后关系和资源约束后，决定项目完成时间的活动链。关键链项目管理还把为不确定性预留的时间集中为缓冲，并在执行中跟踪使用情况。"], ["50% Probability Duration", "50%完成概率的工期估计", "如果一项活动的估计工期为6天，且有50%的可能在6天内完成，这描述的是工期分布中的中间位置。它不等于把任何原估计机械除以2，也不表示项目有50%的缓冲。活动估计与后面按链长50%设置缓冲，是两个不同概念。"]], "material": {"context": "接待区准备好接口后，取号设备安装和显示屏安装在逻辑上可以同时开始，但两项都需要同一支队伍。项目经理必须确定谁先用这支队伍，资源顺序会成为排程的一部分。", "terms": [["Critical Chain Project Management (CCPM) / Critical Chain", "关键链项目管理／关键链", "关键链是同时考虑工作先后关系和资源约束后，决定项目完成时间的活动链。关键链项目管理还把为不确定性预留的时间集中为缓冲，并在执行中跟踪使用情况。"], ["50% Probability Duration", "50%完成概率的工期估计", "如果一项活动的估计工期为6天，且有50%的可能在6天内完成，这描述的是工期分布中的中间位置。它不等于把任何原估计机械除以2，也不表示项目有50%的缓冲。活动估计与后面按链长50%设置缓冲，是两个不同概念。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>比较对象<\/th><th>关键路径CPM<\/th><th>关键链CCPM<\/th><\/tr><\/thead><tbody><tr><td>识别依据<\/td><td>活动逻辑与工期；标准网络先算逻辑时间<\/td><td>活动逻辑、资源顺序及所采用的工期估计<\/td><\/tr><tr><td>余量与保护<\/td><td>根据网络计算总时差与自由时差<\/td><td>把安全时间集中成不同位置的缓冲<\/td><\/tr><tr><td>资源<\/td><td>需要另行核对资源可行性<\/td><td>识别关键链时已处理资源冲突<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "chain-buffers", "topic": "8.2", "title": "项目缓冲与馈入缓冲的位置", "goal": "项目缓冲与馈入缓冲的位置", "source": "Lecture 9 · PDF第20–25页", "body": "<p>医院的设备准备工作决定联合测试什么时候开始，指路牌准备是另一条必须接入的工作链。项目经理希望指路牌延迟时不要立即影响联合测试，也希望关键工作的小幅延迟不立即改变承诺日期，因此要在不同位置预留时间。<\/p><section class=\"concept\"><h2><span lang=\"en\">Project Buffer (PB)<\/span><span>项目缓冲<\/span><\/h2><p>安排在关键链末端与承诺交期之间的保护时间。关键链上的延迟会消耗这段时间，项目经理据此判断承诺日期是否受到威胁。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Feeder Buffer / Feeding Buffer (FB)<\/span><span>馈入缓冲<\/span><\/h2><p>安排在非关键支路完成后、汇入关键链之前的保护时间。它为支路延迟留出余地，保护关键链的汇合点。两种英文写法都指这里的支路缓冲。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>时间量<\/th><th>怎样得到<\/th><th>保护对象<\/th><\/tr><\/thead><tbody><tr><td>Total Float 总时差<\/td><td>根据活动依赖、工期和规定完成时间计算<\/td><td>不推迟项目结束的活动延迟余地<\/td><\/tr><tr><td>Project Buffer 项目缓冲<\/td><td>按选定方法主动安排<\/td><td>最终交期<\/td><\/tr><tr><td>Feeder Buffer 馈入缓冲<\/td><td>在非关键支路接入关键链之前预留<\/td><td>关键链上的汇合点<\/td><\/tr><\/tbody><\/table><\/div><p>若按已采用链长的50%设置缓冲，先明确链上各项活动目前采用的工期。例如关键链的三项工作分别为5、25、15天，合计45天，项目缓冲取22.5天，加上项目缓冲后的计划完成时间为67.5天。另一条接入关键链的支路包含10天和5天两项工作，合计15天，馈入缓冲7.5天，放在它汇入主链之前；不能把两种缓冲全部直接加到项目末端。<\/p><p>安排非关键支路时，可以从汇合点向前倒排。例如主链第三项工作在时点30开始，支路工作15天、馈入缓冲7.5天，则支路最迟在30−7.5−15=7.5开始。支路在22.5完成，22.5至30留作馈入缓冲。若倒排产生资源冲突，需要从后向前调整，并比较对整个网络的影响。下面可以修改两条链的工期、支路接入的位置和缓冲比例。时间图同时检查汇入关键链的支路能否在指定汇合点前准备好。如果所需时间放不下，必须调整排程，不能只把缓冲标在负时间上。<\/p>", "questions": [{"id": "chain-buffers-q1", "prompt": "主链45天，按主链长度50%设项目缓冲，加上项目缓冲后的计划完成时间是多少？", "options": ["45天", "67.5天", "90天"], "correct": 1, "feedback": ["还未加入项目缓冲。", "45+22.5=67.5。", "50%不是再加一条45天主链。"], "ref": "r-chain-buffers", "contextLesson": "chain-buffers", "fingerprint": "a25e61d4a0c25750", "legacyFingerprint": "498e7f4bbbaf705f"}, {"id": "chain-buffers-q2", "prompt": "汇入关键链的支路15天、缓冲7.5天，应该放在哪里？", "options": ["安排在支路完成后、关键链汇合点之前", "直接当作每项活动的TF", "一律在项目末端再加7.5天"], "correct": 0, "feedback": ["支路工作及其缓冲应在关键链需要它之前完成。", "缓冲是主动安排的保护，TF由网络计算。", "位置应保护汇合点，不应机械叠加到项目末端。"], "ref": "r-chain-buffers", "contextLesson": "chain-buffers", "fingerprint": "10bda0173bafcd79", "legacyFingerprint": "6a30d2769b93a367"}], "refs": ["r-chain-buffers"], "applications": [], "lab": "buffers", "drill": {"id": "chain-buffers-d", "prompt": "主链三项工作为4、12、8天；支路6天，汇入主链第3项工作前。按主链和支路长度的50%分别设置缓冲，项目从0开始。", "fields": [{"key": "pb", "label": "项目缓冲（天）", "type": "number", "answer": 12, "tolerance": 0.01, "hint": "主链长度是三项工作之和，项目缓冲取这个总长的50%。"}, {"key": "fb", "label": "馈入缓冲（天）", "type": "number", "answer": 3, "tolerance": 0.01, "hint": "馈入缓冲按支路自己的6天计算，不按主链长度计算。"}, {"key": "start", "label": "支路最迟开始时点", "type": "number", "answer": 7, "tolerance": 0.01, "hint": "第3项主链工作开始前已完成4+12天。由这个汇合时点减去馈入缓冲，再减去支路工期。"}, {"key": "target", "label": "加入项目缓冲后的计划完成时点", "type": "number", "answer": 36, "tolerance": 0.01, "hint": "最终完成时点为主链总长加项目缓冲。馈入缓冲已经安排在汇合前，不再加到末端。"}], "explanation": "主链24天，PB=12天，完成时点36。汇合点在4+12=16；FB=3天，支路应在16−3−6=7开始，并在13完成，13至16留作馈入缓冲。", "guided": true, "fingerprint": "debfd4d7ddd652c1"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.3", "order": 73, "priorLesson": "chain-resource", "terms": [["Project Buffer (PB)", "项目缓冲", "安排在关键链末端与承诺交期之间的保护时间。关键链上的延迟会消耗这段时间，项目经理据此判断承诺日期是否受到威胁。"], ["Feeder Buffer / Feeding Buffer (FB)", "馈入缓冲", "安排在非关键支路完成后、汇入关键链之前的保护时间。它为支路延迟留出余地，保护关键链的汇合点。两种英文写法都指这里的支路缓冲。"]], "material": {"context": "医院的设备准备工作决定联合测试什么时候开始，指路牌准备是另一条必须接入的工作链。项目经理希望指路牌延迟时不要立即影响联合测试，也希望关键工作的小幅延迟不立即改变承诺日期，因此要在不同位置预留时间。", "terms": [["Project Buffer (PB)", "项目缓冲", "安排在关键链末端与承诺交期之间的保护时间。关键链上的延迟会消耗这段时间，项目经理据此判断承诺日期是否受到威胁。"], ["Feeder Buffer / Feeding Buffer (FB)", "馈入缓冲", "安排在非关键支路完成后、汇入关键链之前的保护时间。它为支路延迟留出余地，保护关键链的汇合点。两种英文写法都指这里的支路缓冲。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>时间量<\/th><th>怎样得到<\/th><th>保护对象<\/th><\/tr><\/thead><tbody><tr><td>Total Float 总时差<\/td><td>根据活动依赖、工期和规定完成时间计算<\/td><td>不推迟项目结束的活动延迟余地<\/td><\/tr><tr><td>Project Buffer 项目缓冲<\/td><td>按选定方法主动安排<\/td><td>最终交期<\/td><\/tr><tr><td>Feeder Buffer 馈入缓冲<\/td><td>在非关键支路接入关键链之前预留<\/td><td>关键链上的汇合点<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "chain-methods", "topic": "8.2", "title": "估计缓冲大小并跟踪使用情况", "goal": "估计缓冲大小并跟踪使用情况", "source": "Lecture 9 · PDF第20–30、35页", "body": "<p>估计安装时间时，负责人可能已经为设备故障等情况多留了时间。采用关键链方法时，项目经理把这些分散预留的时间集中为缓冲。计算前先查清当前工期包含多少余量、是否已经扣减过，避免对同一份余量扣除两次。<\/p><section class=\"concept\"><h2><span lang=\"en\">Buffer Sizing / Buffer Management<\/span><span>缓冲大小估计／缓冲管理<\/span><\/h2><p>前者确定预留保护时间，后者在执行中观察缓冲消耗与工作完成情况，及时处理对交期的威胁。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Central Limit Theorem<\/span><span>中心极限定理<\/span><\/h2><p>在适当的独立性与分布条件下，多项随机用时的总和可以趋近正态分布。把保护时间集中安排时，可以考虑并非每项活动都会同时用尽自己的预留时间；但共同原因造成的相关延迟仍要另外分析。这个原理本身不规定缓冲一定取链长的一半。<\/p><\/section><p>50%规则是一种简便估计。平方和开方方法则按各活动安全余量的平方和开方估计缓冲，常与Newbold方法联系使用。使用时要按题目定义安全余量及可能给定的系数。若给两项安全余量3天、4天，且明确采用无额外系数的平方和开方规则，缓冲为√(3²+4²)=5天。<\/p><div class=\"formula\">本例平方和开方规则：B＝√Σsᵢ²；sᵢ为题目给定的活动安全余量<\/div><p>这条规则与PERT的路径标准差都出现平方和开方，但输入含义不同。安全余量不能自动当作统计标准差。执行时，比较剩余工作、造成等待的原因和缓冲消耗；仅看到消耗了一半，尚不能断言项目一定延期。<\/p>", "questions": [{"id": "chain-methods-q1", "prompt": "两项安全余量3与4天，明确采用无额外系数的平方和开方规则，缓冲是多少？", "options": ["3.5天", "5天", "7天"], "correct": 1, "feedback": ["3.5是算术平均，不符合给定规则。", "√(9+16)=5。", "7是直接相加，属于另一种算法。"], "ref": "r-chain-methods", "contextLesson": "chain-methods", "fingerprint": "edd47dba66a42018", "legacyFingerprint": "edd47dba66a42018"}, {"id": "chain-methods-q2", "prompt": "当前关键链工期45天，团队说明已改用50%完成概率的活动估计。有人建议再把45天除以2，然后加一半作为缓冲。应先核对什么？", "options": ["只核对项目原承诺是否超过45天", "原估计如何调整、45天的含义，以及本次缓冲采用的规则", "只检查再减半后所有活动工期仍为正数"], "correct": 1, "feedback": ["承诺日期不能说明活动估计已经包含或扣除了多少余量。", "50%完成概率不等于统一减半；重复扣除需要先追溯估计依据。", "正数也可能远低于可执行工期，不能证明估计合理。"], "ref": "r-chain-methods", "contextLesson": "chain-methods", "fingerprint": "9486e3d37930a184", "legacyFingerprint": "ca227bb213ba46b5"}], "refs": ["r-chain-methods"], "applications": [{"id": "a-chain-methods", "kind": "缓冲使用分析", "prompt": "项目缓冲已消耗一半，关键链工作完成了四分之三。负责人能否仅据此保证交期？还要检查什么？", "answer": "不能仅凭比例保证。需查看剩余工作估计、当前阻塞、资源是否可用、馈入支路进展及新增风险，并预测剩余缓冲是否足够。比较缓冲消耗与进展可提示关注，但不是独立的完工证明。"}], "lab": null, "drill": {"id": "chain-methods-d", "prompt": "三项安全余量分别2、3、6天，题目要求缓冲等于平方和开方，不加其他系数。", "fields": [{"key": "buffer", "label": "缓冲（天）", "type": "number", "answer": 7, "tolerance": 0.01}], "explanation": "√(2²+3²+6²)=√49=7。", "guided": false, "fingerprint": "905df60236175b7a"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.3", "order": 74, "priorLesson": "chain-buffers", "terms": [["Buffer Sizing / Buffer Management", "缓冲大小估计／缓冲管理", "前者确定预留保护时间，后者在执行中观察缓冲消耗与工作完成情况，及时处理对交期的威胁。"], ["Central Limit Theorem", "中心极限定理", "在适当的独立性与分布条件下，多项随机用时的总和可以趋近正态分布。把保护时间集中安排时，可以考虑并非每项活动都会同时用尽自己的预留时间；但共同原因造成的相关延迟仍要另外分析。这个原理本身不规定缓冲一定取链长的一半。"]], "material": {"context": "估计安装时间时，负责人可能已经为设备故障等情况多留了时间。采用关键链方法时，项目经理把这些分散预留的时间集中为缓冲。计算前先查清当前工期包含多少余量、是否已经扣减过，避免对同一份余量扣除两次。", "terms": [["Buffer Sizing / Buffer Management", "缓冲大小估计／缓冲管理", "前者确定预留保护时间，后者在执行中观察缓冲消耗与工作完成情况，及时处理对交期的威胁。"], ["Central Limit Theorem", "中心极限定理", "在适当的独立性与分布条件下，多项随机用时的总和可以趋近正态分布。把保护时间集中安排时，可以考虑并非每项活动都会同时用尽自己的预留时间；但共同原因造成的相关延迟仍要另外分析。这个原理本身不规定缓冲一定取链长的一半。"]], "tables": []}}, {"id": "chain-drum", "topic": "8.2", "title": "多项目共用瓶颈资源时的缓冲", "goal": "多项目共用瓶颈资源时的缓冲", "source": "Lecture 9 · PDF第31–35页", "body": "<p>多个医院项目共用测试台时，只给每个项目末端加缓冲，仍不能解决同时预约的问题。需要先形成共同日历，再安排瓶颈前的准备保护和项目之间的间隔。<\/p><section class=\"concept\"><h2><span lang=\"en\">Drum Resource<\/span><span>瓶颈资源<\/span><\/h2><p>限制多个项目整体执行节奏的共享资源。例如，医院各项目都必须使用且容量不足的测试台。协调者据此安排项目何时进入测试。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Drum Buffer<\/span><span>瓶颈前缓冲<\/span><\/h2><p>在项目使用瓶颈资源之前留出的准备保护时间。例如，测试预约在时点8，前面留1天缓冲，就要求上游工作在时点7准备好，以减少测试台等待输入的风险。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Capacity Constraint Buffer (CCB)<\/span><span>容量约束缓冲<\/span><\/h2><p>在不同项目使用同一瓶颈资源之间留出的间隔，减少前一项目超时对后一项目的影响。若甲在7结束、间隔1天，乙最早从8开始。课程中也出现CCP这一缩写，识别时按它所在的位置与作用判断。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>安排<\/th><th>目的<\/th><\/tr><\/thead><tbody><tr><td>项目A测试前的Drum Buffer<\/td><td>降低A上游延迟导致测试台空等的风险<\/td><\/tr><tr><td>A与B测试占用之间的CCB<\/td><td>减少A占用超时向B传递的冲突<\/td><\/tr><tr><td>项目B末端的Project Buffer<\/td><td>保护B自身承诺交期<\/td><\/tr><\/tbody><\/table><\/div><p>资源日历先确保占用不重叠，再检查缓冲位置与大小。不同方法和图表可能使用不同缩写，识别时先看它保护的是哪个位置。<\/p><p>评价关键链方法还要检查：里程碑如何跟踪，安全时间估计是否有依据，多项目资源日历是否完整，团队是否能及时报告问题，以及成效证据是否足以支持推广。单个案例缩短工期，不能证明所有项目都会得到相同比例的改善。<\/p>", "questions": [{"id": "chain-drum-q1", "prompt": "两个项目预约同一测试台同一时段，各自末端都有项目缓冲。是否已解决冲突？", "options": ["已解决，末端缓冲能让测试同时进行", "没有，需要统一资源顺序与日历", "只需加大两个末端缓冲"], "correct": 1, "feedback": ["缓冲不增加同一时段的资源容量。", "先消除预约重叠，再安排不同位置的保护。", "增加末端保护仍不能让同一资源同时执行两项工作。"], "ref": "r-chain-drum", "contextLesson": "chain-drum", "fingerprint": "882dbeaef73f8963", "legacyFingerprint": "882dbeaef73f8963"}, {"id": "chain-drum-q2", "prompt": "医院多个项目共用测试台，某项目因上游资料未准备好而错过预约。应优先检查哪种缓冲及准备安排？", "options": ["CCB，两个项目占用测试台之间的间隔", "Project Buffer，项目全部关键工作之后的时间", "Drum Buffer，进入瓶颈资源前的准备"], "correct": 2, "feedback": ["CCB主要隔开项目资源占用，不能替代本项目输入准备。", "末端保护交期，不能直接保证测试台预约前的资料就绪。", "问题发生在进入瓶颈之前，需要保护资料按时准备。"], "ref": "r-chain-drum", "contextLesson": "chain-drum", "fingerprint": "faa61ca21c18b599", "legacyFingerprint": "4b6fadc900dee84e"}], "refs": ["r-chain-drum"], "applications": [{"id": "a-chain-drum", "kind": "综合排程", "prompt": "测试台：项目A从4至7，项目B需2天；要求A与B之间保留1天CCB，B在占用前留1天Drum Buffer。A按计划结束时，B最早何时使用测试台？它的上游工作应何时准备好？", "answer": "B最早8开始、10结束；其瓶颈前缓冲为7至8，因此上游工作应在7准备好。CCB在测试台两项目占用之间，Drum Buffer保护B自己的准备，两者在时间上可以重叠但作用不同。还需检查上游资源和逻辑是否支持。"}], "lab": null, "drill": {"id": "chain-drum-d", "prompt": "同本页综合排程：A从4至7使用测试台，CCB为1天；B测试2天，B瓶颈前缓冲1天。", "fields": [{"key": "start", "label": "B开始测试", "type": "number", "answer": 8, "tolerance": 0.01}, {"key": "ready", "label": "B上游准备完成", "type": "number", "answer": 7, "tolerance": 0.01}, {"key": "finish", "label": "B测试完成", "type": "number", "answer": 10, "tolerance": 0.01}], "explanation": "A结束7，间隔1天，B从8开始；保护区7至8要求上游在7准备好。", "guided": false, "fingerprint": "0f821921b4bf46ee"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "8.3", "order": 75, "priorLesson": "chain-methods", "terms": [["Drum Resource", "瓶颈资源", "限制多个项目整体执行节奏的共享资源。例如，医院各项目都必须使用且容量不足的测试台。协调者据此安排项目何时进入测试。"], ["Drum Buffer", "瓶颈前缓冲", "在项目使用瓶颈资源之前留出的准备保护时间。例如，测试预约在时点8，前面留1天缓冲，就要求上游工作在时点7准备好，以减少测试台等待输入的风险。"], ["Capacity Constraint Buffer (CCB)", "容量约束缓冲", "在不同项目使用同一瓶颈资源之间留出的间隔，减少前一项目超时对后一项目的影响。若甲在7结束、间隔1天，乙最早从8开始。课程中也出现CCP这一缩写，识别时按它所在的位置与作用判断。"]], "material": {"context": "多个医院项目共用测试台时，只给每个项目末端加缓冲，仍不能解决同时预约的问题。需要先形成共同日历，再安排瓶颈前的准备保护和项目之间的间隔。", "terms": [["Drum Resource", "瓶颈资源", "限制多个项目整体执行节奏的共享资源。例如，医院各项目都必须使用且容量不足的测试台。协调者据此安排项目何时进入测试。"], ["Drum Buffer", "瓶颈前缓冲", "在项目使用瓶颈资源之前留出的准备保护时间。例如，测试预约在时点8，前面留1天缓冲，就要求上游工作在时点7准备好，以减少测试台等待输入的风险。"], ["Capacity Constraint Buffer (CCB)", "容量约束缓冲", "在不同项目使用同一瓶颈资源之间留出的间隔，减少前一项目超时对后一项目的影响。若甲在7结束、间隔1天，乙最早从8开始。课程中也出现CCP这一缩写，识别时按它所在的位置与作用判断。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>安排<\/th><th>目的<\/th><\/tr><\/thead><tbody><tr><td>项目A测试前的Drum Buffer<\/td><td>降低A上游延迟导致测试台空等的风险<\/td><\/tr><tr><td>A与B测试占用之间的CCB<\/td><td>减少A占用超时向B传递的冲突<\/td><\/tr><tr><td>项目B末端的Project Buffer<\/td><td>保护B自身承诺交期<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "project-start", "topic": "1.1", "title": "项目与日常运营", "goal": "项目与日常运营", "source": "Lecture 1 · PDF第5–6、10–13、22页", "body": "<p>想象你负责一家新医院的开放准备。院方需要建成接待区、安装取号设备，并让工作人员能够接待患者。开放以后，工作人员每天办理登记，设备人员定期维护系统。前后两部分工作相互衔接，管理方式也有所不同。<\/p><section class=\"concept\"><h2><span lang=\"en\">Project<\/span><span>项目<\/span><\/h2><p>为了创造独特的产品、服务或结果而开展的临时性工作。“临时性”表示有开始和结束；一项医院建设工程持续数年，仍然可以是项目。“独特”表示本次交付有特定的地点、要求或使用条件，并不要求每项技术都从未有人用过。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Operations<\/span><span>运营<\/span><\/h2><p>为了维持业务而持续开展的工作。例如医院开放后，每天按已有流程为患者登记、叫号和维护设备。项目团队把新设施交给运营人员时，要说明谁负责后续工作。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>工作<\/th><th>怎样判断<\/th><\/tr><\/thead><tbody><tr><td>安装并验收医院的新取号系统<\/td><td>有明确交付结果和结束条件，属于项目<\/td><\/tr><tr><td>每天用取号系统接待患者<\/td><td>持续提供既有服务，属于运营<\/td><\/tr><tr><td>更换取号系统并迁移全部资料<\/td><td>形成新的系统状态，有专项交付和结束条件，可以作为项目<\/td><\/tr><\/tbody><\/table><\/div><p>工作是否重复出现，不是唯一判断依据。建设团队每天都会开协调会，这些会议仍属于建设项目；医院每年更换一次设备，也要看本次是否有独立范围和交付目标。<\/p>", "questions": [{"id": "project-start-q1", "prompt": "一家医院用18个月建设新门诊楼，包含每天重复的施工工序。判断整体性质最需要看什么？", "options": ["是否有特定交付成果及结束条件", "是否使用了新的技术", "是否所有工序都只做一次"], "correct": 0, "feedback": ["项目的临时性和独特结果是关键。", "使用成熟技术也能产生特定项目成果。", "项目中可以重复施工工序。"], "ref": "r-project-start", "contextLesson": "project-start", "fingerprint": "ce42063f7425a202", "legacyFingerprint": null}, {"id": "project-start-q2", "prompt": "新取号系统已经验收。原安装人员随后按固定排班处理每日故障，这部分工作应怎样判断？", "options": ["按持续维护的目的安排为运营，并明确保修与交接责任", "人员没变，仍全部属于原安装项目", "每张故障单都必须建立一个独立项目"], "correct": 0, "feedback": ["日常故障处理持续维持服务；未完交付或合同保修另按具体边界管理。", "判断应看工作目标和边界，不能只看谁执行。", "常规服务单不一定具备独立项目的范围与治理需要。"], "ref": "r-project-start", "contextLesson": "project-start", "fingerprint": "a7f47a72bfad2001", "legacyFingerprint": null}], "refs": ["r-project-start"], "applications": [{"id": "a-project-start", "kind": "边界判断", "prompt": "医院每年都进行设备维护，今年另行安排更换全部叫号设备并迁移资料。说明哪些工作可以作为项目，哪些属于运营，并写出一个交接条件。", "answer": "例行维护属于运营；整套设备更换与资料迁移有明确范围、结果和结束条件，可作为项目。交接条件可以包括设备通过测试、资料核对完成、操作培训通过、维护人员接受文档与责任。不能只因为每年都做设备工作就归为同一类。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "1.1", "order": 76, "priorLesson": null, "terms": [["Project", "项目", "为了创造独特的产品、服务或结果而开展的临时性工作。“临时性”表示有开始和结束；一项医院建设工程持续数年，仍然可以是项目。“独特”表示本次交付有特定的地点、要求或使用条件，并不要求每项技术都从未有人用过。"], ["Operations", "运营", "为了维持业务而持续开展的工作。例如医院开放后，每天按已有流程为患者登记、叫号和维护设备。项目团队把新设施交给运营人员时，要说明谁负责后续工作。"]], "material": {"context": "想象你负责一家新医院的开放准备。院方需要建成接待区、安装取号设备，并让工作人员能够接待患者。开放以后，工作人员每天办理登记，设备人员定期维护系统。前后两部分工作相互衔接，管理方式也有所不同。", "terms": [["Project", "项目", "为了创造独特的产品、服务或结果而开展的临时性工作。“临时性”表示有开始和结束；一项医院建设工程持续数年，仍然可以是项目。“独特”表示本次交付有特定的地点、要求或使用条件，并不要求每项技术都从未有人用过。"], ["Operations", "运营", "为了维持业务而持续开展的工作。例如医院开放后，每天按已有流程为患者登记、叫号和维护设备。项目团队把新设施交给运营人员时，要说明谁负责后续工作。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>工作<\/th><th>怎样判断<\/th><\/tr><\/thead><tbody><tr><td>安装并验收医院的新取号系统<\/td><td>有明确交付结果和结束条件，属于项目<\/td><\/tr><tr><td>每天用取号系统接待患者<\/td><td>持续提供既有服务，属于运营<\/td><\/tr><tr><td>更换取号系统并迁移全部资料<\/td><td>形成新的系统状态，有专项交付和结束条件，可以作为项目<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "project-value", "topic": "1.1", "title": "交付成果怎样产生业务价值", "goal": "交付成果怎样产生业务价值", "source": "Lecture 1 · PDF第7、13–15、49–50页", "body": "<p>医院装好了取号设备，患者却仍然不知道去哪里领取号码。设备交付已经完成，院方希望减少排队和询问的目标还需要继续核实。项目经理需要分别描述为什么启动、要交付什么，以及使用以后能带来什么改善。<\/p><section class=\"concept\"><h2><span lang=\"en\">Deliverable<\/span><span>交付成果<\/span><\/h2><p>项目团队交出的、可以检查和接受的产品、服务、能力或文件。例如，两台安装完毕并通过测试的取号终端，是接待区项目的交付成果。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Business Value<\/span><span>业务价值<\/span><\/h2><p>组织或使用者利用成果后得到的益处。例如，患者完成登记所需的等待时间缩短，接待人员能够处理更多服务请求。价值既可以是财务收益，也可以是便利、安全或公共服务改善。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>内容<\/th><th>医院接待区的例子<\/th><\/tr><\/thead><tbody><tr><td>Driver 启动动因<\/td><td>门诊服务量增加，原有人工登记方式难以满足需要<\/td><\/tr><tr><td>Objective 目标<\/td><td>在约定开放日期前具备取号和叫号服务能力<\/td><\/tr><tr><td>Deliverable 交付成果<\/td><td>已安装并通过测试的终端、指路牌、培训与交接资料<\/td><\/tr><tr><td>Benefit / Value 收益与价值<\/td><td>患者更容易找到窗口，接待人员减少重复解释，院方提高服务能力<\/td><\/tr><\/tbody><\/table><\/div><p>启动动因还可能是客户要求、技术变化、法规要求或风险减少。评价价值时，要先规定指标、比较依据和观察时间。例如院方可以比较开放前后的平均登记等待时间，同时记录患者数量，避免把当天患者少造成的变化误认为系统效果。<\/p>", "questions": [{"id": "project-value-q1", "prompt": "设备按约定要求交付，开放一个月后使用率仍低。哪组后续调查最能解释价值是否实现？", "options": ["仅统计项目组加班小时", "继续只核对采购数量和安装完成日期", "调查患者使用障碍、等待时间与接待人员工作变化"], "correct": 2, "feedback": ["投入工时不等于患者与运营获得收益。", "这些可以支持交付完成，不能解释使用后的效果。", "采用情况与使用结果直接关系到预期价值。"], "ref": "r-project-value", "contextLesson": "project-value", "fingerprint": "8dcd13c1b38077e4", "legacyFingerprint": null}, {"id": "project-value-q2", "prompt": "院方比较新接待区是否减少患者等待，哪组数据最有说服力？", "options": ["系统使用人数，不记录每人等待时间", "设备安装台数与采购价格", "上线前后按同一规则记录的等待时间，并考虑患者数量与人员变化"], "correct": 2, "feedback": ["使用人数可说明采用情况，不能直接说明等待多久。", "这些说明投入，不能直接证明等待减少。", "同口径结果与相关条件帮助判断是否改善。"], "ref": "r-project-value", "contextLesson": "project-value", "fingerprint": "49ab75421a770e8d", "legacyFingerprint": null}], "refs": ["r-project-value"], "applications": [{"id": "a-project-value", "kind": "指标设计", "prompt": "为“新医院接待区投入使用”分别写一个交付指标和一个价值指标，说明谁在什么时候检查。", "answer": "交付指标：开放前由院方与测试人员按约定流程检查全部取号终端。价值指标：开放后由运营负责人按相同统计口径比较登记等待时间与患者反馈。指标须有明确合格标准；价值观察需考虑患者数量、人员配置等变化。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "1.1", "order": 77, "priorLesson": "project-start", "terms": [["Deliverable", "交付成果", "项目团队交出的、可以检查和接受的产品、服务、能力或文件。例如，两台安装完毕并通过测试的取号终端，是接待区项目的交付成果。"], ["Business Value", "业务价值", "组织或使用者利用成果后得到的益处。例如，患者完成登记所需的等待时间缩短，接待人员能够处理更多服务请求。价值既可以是财务收益，也可以是便利、安全或公共服务改善。"]], "material": {"context": "医院装好了取号设备，患者却仍然不知道去哪里领取号码。设备交付已经完成，院方希望减少排队和询问的目标还需要继续核实。项目经理需要分别描述为什么启动、要交付什么，以及使用以后能带来什么改善。", "terms": [["Deliverable", "交付成果", "项目团队交出的、可以检查和接受的产品、服务、能力或文件。例如，两台安装完毕并通过测试的取号终端，是接待区项目的交付成果。"], ["Business Value", "业务价值", "组织或使用者利用成果后得到的益处。例如，患者完成登记所需的等待时间缩短，接待人员能够处理更多服务请求。价值既可以是财务收益，也可以是便利、安全或公共服务改善。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>内容<\/th><th>医院接待区的例子<\/th><\/tr><\/thead><tbody><tr><td>Driver 启动动因<\/td><td>门诊服务量增加，原有人工登记方式难以满足需要<\/td><\/tr><tr><td>Objective 目标<\/td><td>在约定开放日期前具备取号和叫号服务能力<\/td><\/tr><tr><td>Deliverable 交付成果<\/td><td>已安装并通过测试的终端、指路牌、培训与交接资料<\/td><\/tr><tr><td>Benefit / Value 收益与价值<\/td><td>患者更容易找到窗口，接待人员减少重复解释，院方提高服务能力<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "project-lifecycle", "topic": "1.1", "title": "项目阶段与管理过程", "goal": "项目阶段与管理过程", "source": "Lecture 1 · PDF第16、18–21、26–27页", "body": "<p>医院建设团队先讨论是否建设，再规划设施，随后施工安装，最后办理交接。进入安装阶段后，项目经理仍会安排下一周的工作、处理新情况并检查偏差。因此，“项目到了哪个阶段”和“正在做哪类管理工作”是两个问题。<\/p><section class=\"concept\"><h2><span lang=\"en\">Project Life Cycle<\/span><span>项目生命周期<\/span><\/h2><p>项目从开始到结束经历的阶段。这里按Conceptualization（构思）、Planning（规划）、Execution（执行）、Termination（终止或结束）说明整体过程。每个阶段都应有相应成果和继续推进的决定。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>阶段<\/th><th>医院建设中的工作<\/th><th>阶段结果<\/th><\/tr><\/thead><tbody><tr><td>Conceptualization 构思<\/td><td>明确为什么建设、服务谁，调查关键要求<\/td><td>形成初步目标和可行方案<\/td><\/tr><tr><td>Planning 规划<\/td><td>细化范围、设计、预算、进度和人员安排<\/td><td>形成可执行并获批准的计划<\/td><\/tr><tr><td>Execution 执行<\/td><td>施工、安装、培训，并检查实际情况<\/td><td>逐步完成和验证成果<\/td><\/tr><tr><td>Termination 终止／结束<\/td><td>办理接受和移交，结清事项并重新分配资源<\/td><td>项目结束，医院继续运营<\/td><\/tr><\/tbody><\/table><\/div><section class=\"concept\"><h2><span lang=\"en\">Process Groups<\/span><span>过程组<\/span><\/h2><p>按管理工作的作用分类，包括Initiating（启动）、Planning（规划）、Executing（执行）、Monitoring and Controlling（监控）、Closing（收尾）。过程组可以在不同阶段重复出现，监控也与执行同时进行。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>安装阶段中的行动<\/th><th>过程组<\/th><\/tr><\/thead><tbody><tr><td>确认本阶段负责人和授权<\/td><td>启动<\/td><\/tr><tr><td>安排下周人员和测试时间<\/td><td>规划<\/td><\/tr><tr><td>人员按安排安装设备<\/td><td>执行<\/td><\/tr><tr><td>比较实际工期与原计划，处理偏差<\/td><td>监控<\/td><\/tr><tr><td>接受本阶段成果并完成交接<\/td><td>收尾<\/td><\/tr><\/tbody><\/table><\/div><section class=\"concept\"><h2><span lang=\"en\">Rolling Wave Planning<\/span><span>滚动式规划<\/span><\/h2><p>把近期工作安排得较详细，较远的工作先保留必要概括；取得新信息后，再细化下一段安排。例如下周设备安装已能排到每天，两个月后的人员培训先确定规模和日期范围。<\/p><\/section><p>人员与费用投入通常在执行阶段较高。随着设计和现场情况逐渐明确，不确定性通常减少；已经完成的工作越多，后期改动可能造成的损失也越大。因此，早期需要调查，执行中仍要持续监控。<\/p>", "questions": [{"id": "project-lifecycle-q1", "prompt": "设备安装已开始，项目经理每周调整剩余工作的安排。这说明什么？", "options": ["规划只能在首次施工前出现", "项目必须先退回构思阶段", "执行阶段内仍可以开展规划过程"], "correct": 2, "feedback": ["新信息出现后仍需规划和监控。", "更新近期安排不必把整个项目退回起点。", "阶段表示项目进展，过程组表示管理作用，两者不一一对应。"], "ref": "r-project-lifecycle", "contextLesson": "project-lifecycle", "fingerprint": "ed9dc9c51124612c", "legacyFingerprint": null}, {"id": "project-lifecycle-q2", "prompt": "施工资料逐渐明确，团队采用滚动式规划。哪种做法符合它的含义？", "options": ["仅编本周任务，不保留未来范围和目标日期", "近期任务细化，远期保留范围和里程碑，取得信息后再细化", "保持首次详细排程，直到全部施工结束才调整"], "correct": 1, "feedback": ["滚动规划仍需全局方向和约束。", "细化程度随信息成熟度变化，整体目标仍有安排。", "新信息需要进入计划，完全不调整违背逐步细化。"], "ref": "r-project-lifecycle", "contextLesson": "project-lifecycle", "fingerprint": "98606bb1a1d8cbde", "legacyFingerprint": null}], "refs": ["r-project-lifecycle"], "applications": [{"id": "a-project-lifecycle", "kind": "流程改错", "prompt": "某计划把“监控”安排在全部设备安装完之后。请说明可能错过什么，并修改安排。", "answer": "可能错过交货延迟、安装偏差和人员冲突的早期信号。安装过程中按固定日期记录实际，与基线比较，安排纠正和变更；安装结束再验收与交接。监控横跨执行过程，不只是最终检查。"}], "lab": null, "drill": {"id": "project-lifecycle-d", "prompt": "医院已经进入施工阶段。分别判断下面的管理行动。", "fields": [{"key": "plan", "label": "依据新交期安排下周人员", "type": "select", "options": ["启动", "规划", "执行", "监控", "收尾"], "answer": 1}, {"key": "control", "label": "比较已完成工程量与批准计划", "type": "select", "options": ["启动", "规划", "执行", "监控", "收尾"], "answer": 3}], "explanation": "当前阶段都是施工；安排未来工作属于规划，比较实际与基线属于监控。", "guided": false, "fingerprint": "f688cc47d082ab7e"}, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "1.1", "order": 78, "priorLesson": "project-value", "terms": [["Project Life Cycle", "项目生命周期", "项目从开始到结束经历的阶段。这里按Conceptualization（构思）、Planning（规划）、Execution（执行）、Termination（终止或结束）说明整体过程。每个阶段都应有相应成果和继续推进的决定。"], ["Process Groups", "过程组", "按管理工作的作用分类，包括Initiating（启动）、Planning（规划）、Executing（执行）、Monitoring and Controlling（监控）、Closing（收尾）。过程组可以在不同阶段重复出现，监控也与执行同时进行。"], ["Rolling Wave Planning", "滚动式规划", "把近期工作安排得较详细，较远的工作先保留必要概括；取得新信息后，再细化下一段安排。例如下周设备安装已能排到每天，两个月后的人员培训先确定规模和日期范围。"]], "material": {"context": "医院建设团队先讨论是否建设，再规划设施，随后施工安装，最后办理交接。进入安装阶段后，项目经理仍会安排下一周的工作、处理新情况并检查偏差。因此，“项目到了哪个阶段”和“正在做哪类管理工作”是两个问题。", "terms": [["Project Life Cycle", "项目生命周期", "项目从开始到结束经历的阶段。这里按Conceptualization（构思）、Planning（规划）、Execution（执行）、Termination（终止或结束）说明整体过程。每个阶段都应有相应成果和继续推进的决定。"], ["Process Groups", "过程组", "按管理工作的作用分类，包括Initiating（启动）、Planning（规划）、Executing（执行）、Monitoring and Controlling（监控）、Closing（收尾）。过程组可以在不同阶段重复出现，监控也与执行同时进行。"], ["Rolling Wave Planning", "滚动式规划", "把近期工作安排得较详细，较远的工作先保留必要概括；取得新信息后，再细化下一段安排。例如下周设备安装已能排到每天，两个月后的人员培训先确定规模和日期范围。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>阶段<\/th><th>医院建设中的工作<\/th><th>阶段结果<\/th><\/tr><\/thead><tbody><tr><td>Conceptualization 构思<\/td><td>明确为什么建设、服务谁，调查关键要求<\/td><td>形成初步目标和可行方案<\/td><\/tr><tr><td>Planning 规划<\/td><td>细化范围、设计、预算、进度和人员安排<\/td><td>形成可执行并获批准的计划<\/td><\/tr><tr><td>Execution 执行<\/td><td>施工、安装、培训，并检查实际情况<\/td><td>逐步完成和验证成果<\/td><\/tr><tr><td>Termination 终止／结束<\/td><td>办理接受和移交，结清事项并重新分配资源<\/td><td>项目结束，医院继续运营<\/td><\/tr><\/tbody><\/table><\/div>", "<div class=\"table-scroll\"><table><thead><tr><th>安装阶段中的行动<\/th><th>过程组<\/th><\/tr><\/thead><tbody><tr><td>确认本阶段负责人和授权<\/td><td>启动<\/td><\/tr><tr><td>安排下周人员和测试时间<\/td><td>规划<\/td><\/tr><tr><td>人员按安排安装设备<\/td><td>执行<\/td><\/tr><tr><td>比较实际工期与原计划，处理偏差<\/td><td>监控<\/td><\/tr><tr><td>接受本阶段成果并完成交接<\/td><td>收尾<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "project-success", "topic": "1.2", "title": "怎样判断项目是否成功", "goal": "怎样判断项目是否成功", "source": "Lecture 1 · PDF第8、37–40页", "body": "<p>接待区在规定日期前开放，费用也没有超出预算，院方却发现轮椅使用者无法顺利到达部分窗口。只看日期与费用，会遗漏使用要求和接受条件。<\/p><section class=\"concept\"><h2><span lang=\"en\">Quadruple Constraint of Project Success<\/span><span>项目成功的四重约束<\/span><\/h2><p>交付时需要同时检查Budget（预算）、Time（时间）、Performance（绩效）和Client Acceptance（客户接受）。在医院接待区，分别要看支出是否符合预算、能否按期开门、设施是否满足功能与性能要求，以及院方是否正式接受成果。<\/p><\/section><p>范围、时间和成本之间也有相互制约的关系，常称Triple Constraint（三重约束）。增加交付范围时，项目经理需要重算所需时间与成本，并检查质量是否仍能满足要求。<\/p><div class=\"worked-example\"><h3>新增一个服务窗口<\/h3><p>院方希望增加窗口。项目经理需要确认新增设备、安装与测试工作，再估计工期和费用；如果开放日期不变，就要讨论增加资源或调整其他工作。不能只把范围清单多写一行，仍默认原安排全部成立。<\/p><\/div><div class=\"table-scroll\"><table><thead><tr><th>观察时间<\/th><th>可观察的结果<\/th><\/tr><\/thead><tbody><tr><td>交付时<\/td><td>是否按预算和日期完成，功能与性能是否合格，院方是否接受<\/td><\/tr><tr><td>投入使用后<\/td><td>患者和工作人员是否愿意使用，是否改善服务，是否产生预期收益<\/td><\/tr><tr><td>更长时期<\/td><td>团队是否形成可复用的能力，是否支持后续建设与组织目标<\/td><\/tr><\/tbody><\/table><\/div><section class=\"concept\"><h2><span lang=\"en\">Four Dimensions of Project Success<\/span><span>项目成功的四个维度<\/span><\/h2><p>Project Efficiency（项目效率）关注交付时的时间、费用等表现；Impact on the Customer（对客户的影响）关注使用与满意；Business Success（业务成功）关注组织获得的收益；Preparing for the Future（为未来作准备）关注能力、技术和后续机会。观察时间不同，各维度的重要程度也会变化，不能在开放当天就把长期效果判定完毕。<\/p><\/section><p>对于信息系统，可以分别观察System Quality（系统质量）、Information Quality（信息质量）、Use（使用情况）、User Satisfaction（用户满意度）、Individual Impact（个人影响）和Organizational Impact（组织影响）。系统运行稳定、信息正确、有人使用，是相关但不同的证据。<\/p>", "questions": [{"id": "project-success-q1", "prompt": "医院项目按时、未超预算，但双语提示尚未完成，院方未接受。按预算、时间、绩效、客户接受四项判断，哪些已得到满足的证据？", "options": ["四项均已满足", "预算与时间", "预算、时间与客户接受"], "correct": 1, "feedback": ["缺失功能与接受问题不能被按期结果替代。", "题目只证明预算和时间达标，功能与接受还未满足。", "院方明确尚未接受。"], "ref": "r-project-success", "contextLesson": "project-success", "fingerprint": "23069c646de31a44", "legacyFingerprint": null}, {"id": "project-success-q2", "prompt": "院方要增加一台终端，开放日期保持不变。当前预算只含原设备，原计划也没有新增设备的测试时间。哪项分析最完整？", "options": ["比较设备、安装、测试及人员的增量，提出维持日期的可行方案", "确认测试人员当天有空，就视为新增范围不会影响其他工作", "只核对新增设备是否在采购预算以内，再维持原排程"], "correct": 0, "feedback": ["新增成果影响多个环节，应把范围、工期、费用与接受条件一起分析。", "人员有空不能证明设备交付、配置及全部依赖已经满足。", "采购款只是成本的一部分，原排程还缺安装与测试工作。"], "ref": "r-project-success", "contextLesson": "project-success", "fingerprint": "8d9932597e8e2339", "legacyFingerprint": null}], "refs": ["r-project-success"], "applications": [{"id": "a-project-success", "kind": "成功标准", "prompt": "为接待区设置四项交付成功标准，再补一项投入使用后的观察指标。说明这些指标各自需要什么证据。", "answer": "交付标准覆盖预算、日期、功能性能和院方接受，例如支出记录、完成记录、测试报告、签署的接受记录。使用后的指标可选登记等待时间或使用满意度，需规定观察期间、样本与比较方法。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "1.2", "order": 79, "priorLesson": null, "terms": [["Quadruple Constraint of Project Success", "项目成功的四重约束", "交付时需要同时检查Budget（预算）、Time（时间）、Performance（绩效）和Client Acceptance（客户接受）。在医院接待区，分别要看支出是否符合预算、能否按期开门、设施是否满足功能与性能要求，以及院方是否正式接受成果。"], ["Four Dimensions of Project Success", "项目成功的四个维度", "Project Efficiency（项目效率）关注交付时的时间、费用等表现；Impact on the Customer（对客户的影响）关注使用与满意；Business Success（业务成功）关注组织获得的收益；Preparing for the Future（为未来作准备）关注能力、技术和后续机会。观察时间不同，各维度的重要程度也会变化，不能在开放当天就把长期效果判定完毕。"]], "material": {"context": "接待区在规定日期前开放，费用也没有超出预算，院方却发现轮椅使用者无法顺利到达部分窗口。只看日期与费用，会遗漏使用要求和接受条件。", "terms": [["Quadruple Constraint of Project Success", "项目成功的四重约束", "交付时需要同时检查Budget（预算）、Time（时间）、Performance（绩效）和Client Acceptance（客户接受）。在医院接待区，分别要看支出是否符合预算、能否按期开门、设施是否满足功能与性能要求，以及院方是否正式接受成果。"], ["Four Dimensions of Project Success", "项目成功的四个维度", "Project Efficiency（项目效率）关注交付时的时间、费用等表现；Impact on the Customer（对客户的影响）关注使用与满意；Business Success（业务成功）关注组织获得的收益；Preparing for the Future（为未来作准备）关注能力、技术和后续机会。观察时间不同，各维度的重要程度也会变化，不能在开放当天就把长期效果判定完毕。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>观察时间<\/th><th>可观察的结果<\/th><\/tr><\/thead><tbody><tr><td>交付时<\/td><td>是否按预算和日期完成，功能与性能是否合格，院方是否接受<\/td><\/tr><tr><td>投入使用后<\/td><td>患者和工作人员是否愿意使用，是否改善服务，是否产生预期收益<\/td><\/tr><tr><td>更长时期<\/td><td>团队是否形成可复用的能力，是否支持后续建设与组织目标<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "project-manager", "topic": "1.2", "title": "项目经理如何把计划落实到人员", "goal": "项目经理如何把计划落实到人员", "source": "Lecture 1 · PDF第24–28、46–47页；Lecture 2 · 第4–8页", "body": "<p>进度表显示两名工程师下周可以安装设备，工程部经理却告诉项目经理，这两人已经被安排去处理另一个项目。计算没有出错，资源承诺没有得到确认。项目经理需要同时处理计划与人的协作。<\/p><section class=\"concept\"><h2><span lang=\"en\">Project Manager<\/span><span>项目经理<\/span><\/h2><p>负责组织团队、协调目标与资源，并推动项目交付的人。面对人员重复预约，他需要找出谁有权分配人员，协调可用时间，再把承诺落实到进度计划。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Socio-technical Approach<\/span><span>社会技术方法<\/span><\/h2><p>同时考虑技术分析和人员协作。正确计算出了开始时间，还需要确认人员愿意且能够执行；沟通取得支持后，也要检查新安排是否满足依赖、容量和交期。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>工作<\/th><th>医院中的做法<\/th><\/tr><\/thead><tbody><tr><td>技术方面<\/td><td>重算设备安装延后对最终检查的影响，比较可用资源<\/td><\/tr><tr><td>人员与组织方面<\/td><td>同工程部确认人员安排和决策权，商定冲突升级方式<\/td><\/tr><tr><td>落实结果<\/td><td>把确认后的人员、日期与责任更新到计划，通知受影响的负责人<\/td><\/tr><\/tbody><\/table><\/div><section class=\"concept\"><h2><span lang=\"en\">PMI Talent Triangle<\/span><span>PMI人才三角<\/span><\/h2><p>Ways of Working（工作方式）涉及选择和使用方法；Power Skills（人际与领导能力）涉及沟通、协作与领导；Business Acumen（商业敏锐度）涉及理解组织目标和价值。三类能力共同支持项目决策。<\/p><\/section><p>PMI是Project Management Institute（项目管理协会），IPMA是International Project Management Association（国际项目管理协会）。它们提供专业知识和能力标准。实际工作仍需要沟通、批判思考、应用分析、数据能力与伦理判断，例如如实报告延期，不能靠修改基线隐藏问题。<\/p>", "questions": [{"id": "project-manager-q1", "prompt": "工程师被两个项目同时预约，哪种处理最完整？", "options": ["确认资源决定权与优先级，协商实际可用时间，再重排受影响工作", "只把本项目甘特图日期改后", "只要求工程师自己解决冲突"], "correct": 0, "feedback": ["人员协商与计划计算需要相互配合。", "日期变化没有解决资源承诺冲突。", "工程师未必有权决定两个项目的优先级。"], "ref": "r-project-manager", "contextLesson": "project-manager", "fingerprint": "b3011646672be890", "legacyFingerprint": null}, {"id": "project-manager-q2", "prompt": "项目经理解释新增预约功能怎样支持医院长期服务目标，主要体现哪类人才三角能力？", "options": ["Power Skills，人际与领导能力", "Business Acumen，商业敏锐度", "Ways of Working，工作方式"], "correct": 1, "feedback": ["沟通需要人际能力，但题目核心是理解业务目标和价值。", "将项目决定与组织目标联系起来体现商业敏锐度。", "工作方式关注方法和工具。"], "ref": "r-project-manager", "contextLesson": "project-manager", "fingerprint": "78d8da8e90a643a7", "legacyFingerprint": null}], "refs": ["r-project-manager"], "applications": [{"id": "a-project-manager", "kind": "管理行动", "prompt": "同一名工程师被药房和接待区预约。写出一项技术分析和一项协调行动，并说明它们怎样共同形成新安排。", "answer": "分析两个项目的依赖、交期和延期后果；由有权分配资源的人确认优先级与可用时段。依据承诺重排工作，通知双方并保留共同日历。只争取口头支持或只改图都不足以完成安排。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "1.2", "order": 80, "priorLesson": "project-success", "terms": [["Project Manager", "项目经理", "负责组织团队、协调目标与资源，并推动项目交付的人。面对人员重复预约，他需要找出谁有权分配人员，协调可用时间，再把承诺落实到进度计划。"], ["Socio-technical Approach", "社会技术方法", "同时考虑技术分析和人员协作。正确计算出了开始时间，还需要确认人员愿意且能够执行；沟通取得支持后，也要检查新安排是否满足依赖、容量和交期。"], ["PMI Talent Triangle", "PMI人才三角", "Ways of Working（工作方式）涉及选择和使用方法；Power Skills（人际与领导能力）涉及沟通、协作与领导；Business Acumen（商业敏锐度）涉及理解组织目标和价值。三类能力共同支持项目决策。"]], "material": {"context": "进度表显示两名工程师下周可以安装设备，工程部经理却告诉项目经理，这两人已经被安排去处理另一个项目。计算没有出错，资源承诺没有得到确认。项目经理需要同时处理计划与人的协作。", "terms": [["Project Manager", "项目经理", "负责组织团队、协调目标与资源，并推动项目交付的人。面对人员重复预约，他需要找出谁有权分配人员，协调可用时间，再把承诺落实到进度计划。"], ["Socio-technical Approach", "社会技术方法", "同时考虑技术分析和人员协作。正确计算出了开始时间，还需要确认人员愿意且能够执行；沟通取得支持后，也要检查新安排是否满足依赖、容量和交期。"], ["PMI Talent Triangle", "PMI人才三角", "Ways of Working（工作方式）涉及选择和使用方法；Power Skills（人际与领导能力）涉及沟通、协作与领导；Business Acumen（商业敏锐度）涉及理解组织目标和价值。三类能力共同支持项目决策。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>工作<\/th><th>医院中的做法<\/th><\/tr><\/thead><tbody><tr><td>技术方面<\/td><td>重算设备安装延后对最终检查的影响，比较可用资源<\/td><\/tr><tr><td>人员与组织方面<\/td><td>同工程部确认人员安排和决策权，商定冲突升级方式<\/td><\/tr><tr><td>落实结果<\/td><td>把确认后的人员、日期与责任更新到计划，通知受影响的负责人<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "project-knowledge", "topic": "1.2", "title": "项目管理的十个知识领域", "goal": "项目管理的十个知识领域", "source": "Lecture 1 · PDF第30–36、41–44页", "body": "<p>院方要求在接待区增加一个窗口。项目经理要检查交付范围、设备采购、安装时间、费用、人员和使用者意见。同一个决定往往涉及多方面知识。知识领域按管理对象整理这些工作，便于检查是否遗漏。<\/p><section class=\"concept\"><h2><span lang=\"en\">Knowledge Area<\/span><span>知识领域<\/span><\/h2><p>按管理对象组织相关概念与过程。例如，范围管理处理要做哪些工作，进度管理处理工作何时完成。下表把新增窗口涉及的问题逐项列出。<\/p><\/section><section class=\"concept\"><h2><span lang=\"en\">Integration Management<\/span><span>整合管理<\/span><\/h2><p>协调各领域的决定，使团队使用相互一致的范围、预算、进度和资源安排。新增窗口获批后，项目经理要把有关影响一起处理，而不能只更新采购数量。<\/p><\/section><div class=\"table-scroll\"><table><thead><tr><th>英文术语<\/th><th>中文含义与当前问题<\/th><\/tr><\/thead><tbody><tr><td>Integration<\/td><td>整合：如何把新增窗口的各项决定汇总并批准<\/td><\/tr><tr><td>Scope<\/td><td>范围：新增窗口包括哪些成果和工作<\/td><\/tr><tr><td>Time / Schedule<\/td><td>时间／进度：何时完成，是否影响开放<\/td><\/tr><tr><td>Cost<\/td><td>成本：要增加多少预算<\/td><\/tr><tr><td>Quality<\/td><td>质量：设备和服务需达到什么标准<\/td><\/tr><tr><td>Human Resource / Resource<\/td><td>人力资源／资源：谁来做，需要哪些资源<\/td><\/tr><tr><td>Communications<\/td><td>沟通：哪些人需要什么信息<\/td><\/tr><tr><td>Risk<\/td><td>风险：哪些不确定情况会影响目标<\/td><\/tr><tr><td>Procurement<\/td><td>采购：向谁购买，需要哪些合同条件<\/td><\/tr><tr><td>Stakeholder<\/td><td>利益相关者：谁受影响，谁能影响决定<\/td><\/tr><\/tbody><\/table><\/div><p>时间管理与进度管理、人力资源管理与资源管理是不同版本中可见的名称。遇到这些名称时，先看所管理的对象。项目管理的发展也逐步从CPM／PERT等工期计算，扩展到资源、成本、WBS／OBS、挣值、风险、利益相关者，以及战略和项目组合。<\/p>", "questions": [{"id": "project-knowledge-q1", "prompt": "新增窗口已获范围批准，项目经理还核对设备、安装时间与预算。哪个领域最直接负责协调这些决定？", "options": ["单独的采购管理", "整合管理", "单独的沟通管理"], "correct": 1, "feedback": ["采购负责交易等内容，不能独自覆盖所有领域。", "整合使各领域的决定互相一致。", "沟通传递信息，仍需整合判断和变更协调。"], "ref": "r-project-knowledge", "contextLesson": "project-knowledge", "fingerprint": "eb33410ec5a1e018", "legacyFingerprint": null}, {"id": "project-knowledge-q2", "prompt": "项目经理已算出设备延期会使检查晚两天，现在要决定把哪些信息发给谁、何时发送。当前要制定的主要是哪项安排？", "options": ["利益相关者识别安排", "进度控制安排", "沟通管理安排"], "correct": 2, "feedback": ["识别说明哪些人相关；这里已经进入具体信息传递安排。", "延期计算提供信息；本问关注信息对象、内容与时间。", "沟通管理规定向谁提供什么、何时提供和如何反馈。"], "ref": "r-project-knowledge", "contextLesson": "project-knowledge", "fingerprint": "4a2fe9d97bb1abee", "legacyFingerprint": null}], "refs": ["r-project-knowledge"], "applications": [{"id": "a-project-knowledge", "kind": "影响分析", "prompt": "院方把开放日期提前一周。选择至少四个知识领域，分别提出一个必须查清的问题。", "answer": "进度：哪些活动决定完工，能否压缩；资源：人员与工作面是否可用；成本：加班和加急费用；质量：测试能否完整进行；风险：返工和供应延迟；沟通：谁需要批准和知悉。各问题应指向实际决定。"}], "lab": null, "drill": null, "task": "extension", "requires": [], "introduces": [], "sourceTopic": "1.2", "order": 81, "priorLesson": "project-manager", "terms": [["Knowledge Area", "知识领域", "按管理对象组织相关概念与过程。例如，范围管理处理要做哪些工作，进度管理处理工作何时完成。下表把新增窗口涉及的问题逐项列出。"], ["Integration Management", "整合管理", "协调各领域的决定，使团队使用相互一致的范围、预算、进度和资源安排。新增窗口获批后，项目经理要把有关影响一起处理，而不能只更新采购数量。"]], "material": {"context": "院方要求在接待区增加一个窗口。项目经理要检查交付范围、设备采购、安装时间、费用、人员和使用者意见。同一个决定往往涉及多方面知识。知识领域按管理对象整理这些工作，便于检查是否遗漏。", "terms": [["Knowledge Area", "知识领域", "按管理对象组织相关概念与过程。例如，范围管理处理要做哪些工作，进度管理处理工作何时完成。下表把新增窗口涉及的问题逐项列出。"], ["Integration Management", "整合管理", "协调各领域的决定，使团队使用相互一致的范围、预算、进度和资源安排。新增窗口获批后，项目经理要把有关影响一起处理，而不能只更新采购数量。"]], "tables": ["<div class=\"table-scroll\"><table><thead><tr><th>英文术语<\/th><th>中文含义与当前问题<\/th><\/tr><\/thead><tbody><tr><td>Integration<\/td><td>整合：如何把新增窗口的各项决定汇总并批准<\/td><\/tr><tr><td>Scope<\/td><td>范围：新增窗口包括哪些成果和工作<\/td><\/tr><tr><td>Time / Schedule<\/td><td>时间／进度：何时完成，是否影响开放<\/td><\/tr><tr><td>Cost<\/td><td>成本：要增加多少预算<\/td><\/tr><tr><td>Quality<\/td><td>质量：设备和服务需达到什么标准<\/td><\/tr><tr><td>Human Resource / Resource<\/td><td>人力资源／资源：谁来做，需要哪些资源<\/td><\/tr><tr><td>Communications<\/td><td>沟通：哪些人需要什么信息<\/td><\/tr><tr><td>Risk<\/td><td>风险：哪些不确定情况会影响目标<\/td><\/tr><tr><td>Procurement<\/td><td>采购：向谁购买，需要哪些合同条件<\/td><\/tr><tr><td>Stakeholder<\/td><td>利益相关者：谁受影响，谁能影响决定<\/td><\/tr><\/tbody><\/table><\/div>"]}}, {"id": "project-maturity", "topic": "1.2", "title": "组织怎样形成可重复的管理能力", "goal": "组织怎样形成可重复的管理能力", "source": "Lecture 1 · PDF第41–44页", "body": "<p>医院上一项改造按期完成，主要依靠一名经验丰富的工程师临时协调。下一项工程换了负责人，团队却找不到预算依据和交接记录。一次成功说明这次结果不错，不能单独证明组织已经能稳定地管理项目。<\/p><section class=\"concept\"><h2><span lang=\"en\">Project Management Maturity<\/span><span>项目管理成熟度<\/span><\/h2><p>组织把个人经验逐步发展为共同做法、组织支持和持续改进的程度。判断时需要观察多人、多项目能否重复使用有效方法。<\/p><\/section><div class=\"table-scroll\"><ta
