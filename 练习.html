>B 有 1 周；E 有 12 周。<\/td><\/tr><tr><td>Free Slack，FS 或 FF<br/>自由时差<\/td><td>活动可以延迟多少而不推迟任何紧后活动的最早开始。<\/td><td>B 最早第 10 周完成，E 最早第 10 周开始，二者之间没有余量，因此 B 的自由时差为 0。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>仅 B 设计问卷比原排程晚开始 1 周，工期保持 5 周。B 将从第 6 周做到第 11 周，E 的最早开始也从第 10 周改为第 11 周。D 原本就要等 C 到第 11 周，所以项目仍可在第 30 周完成。<\/p><\/div><p>这次延迟没有超过 B 的 1 周总时差，仍影响了 E 的最早开始，因为 B 没有自由时差。<strong>E 的负责人需要知道开始时间已改成第 11 周；项目的第 30 周完工目标仍能保持。<\/strong>这就是速记中“是否需要通知后面调整起始时间”的实际含义。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">B can be delayed by one week without delaying project completion. However, E’s earliest start moves from week 10 to week 11 because B has zero free slack.<\/p><\/div><div class=\"note\">Free Slack 要理解含义及对后续安排的影响，不要求单独计算。九宫格中的 SL 仍须填写。FS 也可表示 Finish-to-Start，应按上下文区分。<\/div><\/section><p class=\"bridge\">明确影响的是项目完工还是后续安排后，再看题目推迟了多久。只有一项活动推迟、其余条件不变时，先与这项活动的总时差比较：没有超过，项目仍能按原目标完成；超过多少，项目就晚多少。<\/p><section class=\"concept\"><h2>判断延误对项目的影响<\/h2><div class=\"formula\">项目延迟 = max（0，单项活动的延迟 − 该活动原有的总时差）<\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">变化条件<\/th><th scope=\"col\">重算或比较<\/th><th scope=\"col\">结论<\/th><\/tr><\/thead><tbody><tr><td>仅 E 制作汇报材料多用 10 周<\/td><td>E 原有 12 周总时差；原路径 A–B–E–H 为 18 周，增加后为 28 周。<\/td><td>项目仍为 30 周。<\/td><\/tr><tr><td>仅 E 多用 14 周<\/td><td>A–B–E–H 由 18 周增至 32 周，超过原关键路径的 30 周。<\/td><td>项目改为 32 周，晚 2 周完成。<\/td><\/tr><tr><td>仅 B 比原排程晚开始 2 周，工期不变<\/td><td>B 第 7 周开始、第 12 周结束；D 由第 11 周推到第 12 周开始。<\/td><td>项目改为 31 周，晚 1 周完成。<\/td><\/tr><\/tbody><\/table><\/div><p>若多项活动同时变化，要重新计算受影响的路径和排程。同一路径的余量可能共用，不能把各活动原有的总时差直接相加。<\/p><\/section>"},{"key":"L4/pert","title":"PERT 三点估计与标准差","html":"<p class=\"page-label\">L4 · 正算与反求未知量<\/p><h1>PERT 三点估计与标准差<\/h1><p class=\"intro\">单项活动工期不确定时，用乐观、最可能、悲观三个估计计算期望时间。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 三点估计<\/p><p><strong>会用 TE=(a+4m+b)/6 正算，也会反求 a、m 或 b；活动标准差 σ=(b−a)/6。<\/strong>老师用 a=3、m=4、b=8 举例，并提醒把题目反过来求未知数。<\/p><\/div><section class=\"concept\"><h2>三点估计<\/h2><p class=\"term\" lang=\"en\">Program Evaluation and Review Technique (PERT)<\/p><p class=\"definition\">a 是 Optimistic 乐观工期，m 是 Most likely 最可能工期，b 是 Pessimistic 悲观工期。TE 是 Expected time，期望工期。三者使用相同单位，并满足 a ≤ m ≤ b。<\/p><p>一项工作顺利时 3 天能完成，通常需要 4 天，遇到困难可能要 8 天。团队给出的不是一个确定工期，而是三个估计。<strong>PERT 计划评审技术<\/strong>按 a、m、b 估算 Expected Time 期望工期，给“最可能”的 m 四倍权重。<\/p><div class=\"formula\">TE = (a + 4m + b) / 6<\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>活动工期估计为 a=3、m=4、b=8 天。TE=(3+4×4+8)/6=4.5 天。最可能工期 m 的权重为 4，不是三个数简单平均。<\/p><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">已知与未知<\/th><th scope=\"col\">变形<\/th><\/tr><\/thead><tbody><tr><td>已知 TE、a、m，求 b<\/td><td>b = 6TE − a − 4m<\/td><\/tr><tr><td>已知 TE、a、b，求 m<\/td><td>m = (6TE − a − b) / 4<\/td><\/tr><tr><td>已知 TE、m、b，求 a<\/td><td>a = 6TE − 4m − b<\/td><\/tr><\/tbody><\/table><\/div><p>反求未知量的例子：给定 TE=4.5、a=3、m=4，可得 b=27−3−16=8 天。算完仍要检查三个估计的大小顺序。<\/p><div class=\"note\">σ=(b−a)/6 是单项活动工期的标准差；方差是 σ²。项目标准差不等于把各活动标准差直接相加。本次不练项目方差汇总或开方。<\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">PERT estimates expected activity time as TE = (a + 4m + b) / 6, where a, m and b are the optimistic, most likely and pessimistic durations.<\/p><\/div><\/section><p class=\"bridge\">三点估计得到 4.5 天，这是期望工期；最可能的 4 天只是三个输入值中的 m。估计平均要多久后，还要知道工期可能波动多大，下面用标准差描述这种不确定性。<\/p><section class=\"concept\"><h2>标准差与方差<\/h2><div class=\"formula\">活动标准差 σ = (b − a) / 6<br/>活动方差 σ² = [(b − a) / 6]²<\/div><p><strong>Standard Deviation 标准差<\/strong>描述估计工期的波动程度。乐观与悲观估计相差越大，按此公式算出的标准差也越大。对 a=3、m=4、b=8 天的活动，σ=(8−3)/6≈0.833 天；Variance 方差 σ² 约为 0.694 天²。标准差与工期使用相同单位，方差的单位是时间的平方。<\/p><p>下面 Z-score 公式中的 σₚ 是整个项目的标准差。它由题目给定，不能把任意一项活动的标准差直接代进去。<\/p><\/section>"},{"key":"L4/z","title":"Z-score 与完工期限","html":"<p class=\"page-label\">L4 · Z-score / Probability of Completion<\/p><h1>Z-score 与完工期限<\/h1><p class=\"intro\">预计 30 周完成的项目，要求 32 周交付，有多大把握？如果希望有约 95% 的把握，又应该给多少时间？这两种问法使用同一个关系式。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 正态近似计算<\/p><p><strong>给期限求 Z；给目标概率对应的 Z，反求期限。<\/strong>项目标准差及所需概率／Z 对应值会给出；免查正态表、免汇总活动方差后开方，不等于免做概率题。按计算准备，不另行指定它必定出现在哪个题号。<\/p><\/div><section class=\"concept\"><h2>多留两周，有多大把握按时完成？<\/h2><p class=\"term\">Z-score 标准分数 · Due Date 完工期限 · Expected Completion Time 期望完工时间<\/p><p>Delta 项目按预计工期算出 30 周完成，客户要求 32 周内交付，看起来多留了 2 周。实际工作可能快一些，也可能慢一些：如果工期波动很小，这 2 周比较充裕；如果波动很大，2 周就未必够。<\/p><p><strong>Project Standard Deviation 项目标准差<\/strong>描述整个项目完工时间围绕平均值的波动程度。本题给出 2.78 周，所以多留的 2 周还不到一个标准差。<\/p><p class=\"definition\">Z-score 标准分数表示期限比期望完工时间早或晚多少个标准差。先算“多留了多少时间”，再除以项目标准差，把时间差换算成标准差的个数。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">符号或术语<\/th><th scope=\"col\">含义<\/th><th scope=\"col\">本例<\/th><\/tr><\/thead><tbody><tr><td>Expected completion，μ<\/td><td>项目的期望完工时间；正态近似中的平均值<\/td><td>30 周<\/td><\/tr><tr><td>Due date，D<\/td><td>题目要求的完成期限<\/td><td>32 周<\/td><\/tr><tr><td>Project standard deviation，σₚ<\/td><td>整个项目完工时间的标准差，由题目给定<\/td><td>2.78 周<\/td><\/tr><tr><td>Z score，Z<\/td><td>期限距平均值有多少个标准差<\/td><td>待求；没有时间单位<\/td><\/tr><\/tbody><\/table><\/div><div class=\"formula\">Z = (Due date − Expected completion) / σₚ<br/>标准分数 =（完工期限 − 期望完工时间）÷ 项目标准差<br/>Z = (D − μ) / σₚ<\/div><p><strong>为什么除以 σₚ？<\/strong>同样多留 2 周，σₚ=1 周时相当于 2 个标准差；σₚ=4 周时只相当于 0.5 个标准差。除法让我们能比较期限相对于工期波动究竟宽裕多少。分子、分母都用“周”，相除后 Z 没有时间单位。<\/p><\/section><section class=\"concept\"><h2>例一：求 32 周内完成的概率<\/h2><p>已知期望工期 30 周、项目标准差 2.78 周，要求期限为 32 周。题目给出 Z=0.72 对应累计概率 0.7642。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">步骤<\/th><th scope=\"col\">代入与含义<\/th><\/tr><\/thead><tbody><tr><td>1. 求期限差<\/td><td>32−30=2 周。期限比期望工期晚 2 周。<\/td><\/tr><tr><td>2. 除以项目标准差<\/td><td>Z=2/2.78≈0.72。2 周相当于约 0.72 个标准差。<\/td><\/tr><tr><td>3. 使用给定对应值<\/td><td>Z=0.72 对应 0.7642，即 76.42%。<\/td><\/tr><tr><td>4. 写出结论<\/td><td>项目在第 32 周或之前完成的概率约为 76.42%。<\/td><\/tr><\/tbody><\/table><\/div><figure><div class=\"diagram\"><svg aria-label=\"正态分布示意：平均完工时间30周，期限32周，期限左侧面积约为76.42%\" class=\"normal\" role=\"img\" viewbox=\"0 0 700 295\" width=\"700\"><path d=\"M45,225 L45.00,224.66 L48.71,224.61 L52.42,224.55 L56.12,224.48 L59.83,224.40 L63.54,224.31 L67.25,224.20 L70.95,224.09 L74.66,223.96 L78.37,223.81 L82.08,223.64 L85.78,223.45 L89.49,223.24 L93.20,223.01 L96.91,222.75 L100.61,222.46 L104.32,222.13 L108.03,221.77 L111.74,221.37 L115.44,220.93 L119.15,220.44 L122.86,219.91 L126.57,219.32 L130.27,218.68 L133.98,217.97 L137.69,217.20 L141.40,216.36 L145.10,215.44 L148.81,214.45 L152.52,213.38 L156.23,212.22 L159.93,210.97 L163.64,209.62 L167.35,208.18 L171.06,206.63 L174.76,204.97 L178.47,203.21 L182.18,201.33 L185.89,199.33 L189.60,197.22 L193.30,194.98 L197.01,192.63 L200.72,190.15 L204.43,187.55 L208.13,184.82 L211.84,181.97 L215.55,179.01 L219.26,175.92 L222.96,172.73 L226.67,169.42 L230.38,166.01 L234.09,162.50 L237.79,158.90 L241.50,155.22 L245.21,151.47 L248.92,147.65 L252.62,143.77 L256.33,139.86 L260.04,135.91 L263.75,131.95 L267.45,127.98 L271.16,124.03 L274.87,120.10 L278.58,116.21 L282.28,112.37 L285.99,108.62 L289.70,104.94 L293.41,101.38 L297.11,97.93 L300.82,94.62 L304.53,91.46 L308.24,88.47 L311.95,85.66 L315.65,83.05 L319.36,80.64 L323.07,78.46 L326.78,76.50 L330.48,74.79 L334.19,73.33 L337.90,72.13 L341.61,71.19 L345.31,70.52 L349.02,70.12 L352.73,70.00 L356.44,70.16 L360.14,70.59 L363.85,71.29 L367.56,72.26 L371.27,73.50 L374.97,74.99 L378.68,76.73 L382.39,78.71 L386.10,80.93 L389.80,83.36 L393.51,86.00 L397.22,88.83 L400.93,91.84 L404.63,95.02 L408.34,98.35 L412.05,101.81 L415.76,105.39 L415.76,225 Z\" fill=\"#c6ddee\"><\/path><path d=\"M45.00,224.66 L49.39,224.60 L53.79,224.52 L58.18,224.43 L62.57,224.33 L66.96,224.21 L71.36,224.07 L75.75,223.91 L80.14,223.73 L84.54,223.52 L88.93,223.28 L93.32,223.00 L97.71,222.69 L102.11,222.33 L106.50,221.92 L110.89,221.47 L115.29,220.95 L119.68,220.37 L124.07,219.72 L128.46,219.00 L132.86,218.19 L137.25,217.29 L141.64,216.30 L146.04,215.20 L150.43,213.99 L154.82,212.67 L159.21,211.22 L163.61,209.63 L168.00,207.91 L172.39,206.04 L176.79,204.02 L181.18,201.85 L185.57,199.51 L189.96,197.00 L194.36,194.33 L198.75,191.48 L203.14,188.46 L207.54,185.27 L211.93,181.90 L216.32,178.37 L220.71,174.68 L225.11,170.83 L229.50,166.83 L233.89,162.69 L238.29,158.42 L242.68,154.04 L247.07,149.55 L251.46,144.99 L255.86,140.36 L260.25,135.68 L264.64,130.99 L269.04,126.29 L273.43,121.62 L277.82,117.00 L282.21,112.45 L286.61,108.00 L291.00,103.68 L295.39,99.52 L299.79,95.53 L304.18,91.76 L308.57,88.21 L312.96,84.93 L317.36,81.92 L321.75,79.21 L326.14,76.82 L330.54,74.77 L334.93,73.07 L339.32,71.73 L343.71,70.77 L348.11,70.19 L352.50,70.00 L356.89,70.19 L361.29,70.77 L365.68,71.73 L370.07,73.07 L374.46,74.77 L378.86,76.82 L383.25,79.21 L387.64,81.92 L392.04,84.93 L396.43,88.21 L400.82,91.76 L405.21,95.53 L409.61,99.52 L414.00,103.68 L418.39,108.00 L422.79,112.45 L427.18,117.00 L431.57,121.62 L435.96,126.29 L440.36,130.99 L444.75,135.68 L449.14,140.36 L453.54,144.99 L457.93,149.55 L462.32,154.04 L466.71,158.42 L471.11,162.69 L475.50,166.83 L479.89,170.83 L484.29,174.68 L488.68,178.37 L493.07,181.90 L497.46,185.27 L501.86,188.46 L506.25,191.48 L510.64,194.33 L515.04,197.00 L519.43,199.51 L523.82,201.85 L528.21,204.02 L532.61,206.04 L537.00,207.91 L541.39,209.63 L545.79,211.22 L550.18,212.67 L554.57,213.99 L558.96,215.20 L563.36,216.30 L567.75,217.29 L572.14,218.19 L576.54,219.00 L580.93,219.72 L585.32,220.37 L589.71,220.95 L594.11,221.47 L598.50,221.92 L602.89,222.33 L607.29,222.69 L611.68,223.00 L616.07,223.28 L620.46,223.52 L624.86,223.73 L629.25,223.91 L633.64,224.07 L638.04,224.21 L642.43,224.33 L646.82,224.43 L651.21,224.52 L655.61,224.60 L660.00,224.66\" fill=\"none\" stroke=\"#255e87\" stroke-width=\"2.4\"><\/path><path d=\"M45,225 H660\" stroke=\"#687f91\"><\/path><path d=\"M352.5,65 V225\" stroke=\"#7796aa\" stroke-dasharray=\"4 4\"><\/path><path d=\"M415.75714285714287,85 V225\" stroke=\"#1b567e\" stroke-width=\"2\"><\/path><text fill=\"#193e5c\" font-size=\"12\" text-anchor=\"start\" x=\"55\" y=\"65\">概率密度（示意）<\/text><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"270\" y=\"185\">截至 32 周完成<\/text><text fill=\"#193e5c\" font-size=\"19\" text-anchor=\"middle\" x=\"270\" y=\"208\">约 76.42%<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"end\" x=\"339.5\" y=\"248\">30 周<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"start\" x=\"420.75714285714287\" y=\"248\">32 周<\/text><text fill=\"#193e5c\" font-size=\"12\" text-anchor=\"end\" x=\"339.5\" y=\"269\">期望工期<\/text><text fill=\"#193e5c\" font-size=\"12\" text-anchor=\"start\" x=\"420.75714285714287\" y=\"269\">期限<\/text><text fill=\"#193e5c\" font-size=\"12\" text-anchor=\"middle\" x=\"635\" y=\"280\">时间 / 周<\/text><path d=\"M352.5,44 H415.75714285714287 M352.5,38 V50 M415.75714285714287,38 V50\" stroke=\"#255e87\"><\/path><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"384.12857142857143\" y=\"28\">2 周 = 0.72σₚ<\/text><\/svg><\/div><figcaption>曲线下、期限左侧的面积表示在该期限内完成的概率。Z＝0.72 本身不是 72%。<\/figcaption><\/figure><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Z = (32 − 30) / 2.78 ≈ 0.72. Using the given cumulative probability of 0.7642, the probability of completing the project on or before week 32 is approximately 76.42%.<\/p><\/div><p><strong>Z=0.72 是距离，76.42% 才是概率。<\/strong>在正态近似下，图中 32 周左边的面积表示“第 32 周或之前已经完成”的概率；右边余下约 23.58% 表示晚于期限。期限等于平均值时，Z=0，左右各占 50%；期限更晚时 Z 为正，按时完成概率也更高。<\/p><\/section><section class=\"concept\"><h2>希望有约 95% 的把握，应给多少时间？<\/h2><p>现在客户先给目标：希望按时完成的概率约为 95%。题目给出这个概率对应 Z=1.65，也就是需要在 30 周之外多留 1.65 个标准差。一个标准差为 2.78 周，用乘法换回时间，再加上原来的 30 周。<\/p><div class=\"formula\">Due date = Expected completion + Z × σₚ<br/>完工期限 = 期望完工时间 + Z × 项目标准差<br/>D = μ + Zσₚ<\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">步骤<\/th><th scope=\"col\">计算<\/th><\/tr><\/thead><tbody><tr><td>1. 求增加的时间<\/td><td>1.65×2.78=4.587 周。<\/td><\/tr><tr><td>2. 加回期望工期<\/td><td>30+4.587=34.587≈34.59 周。<\/td><\/tr><tr><td>3. 解释结果<\/td><td>期限约为第 34.59 周，比 30 周增加约 4.59 周，对应题给约 95% 的完成概率。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Using the given Z score of 1.65, the due date is 30 + (1.65 × 2.78) = 34.587 ≈ 34.59 weeks. This allows approximately 4.59 additional weeks and corresponds to the specified probability of about 95%.<\/p><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">题目已知什么<\/th><th scope=\"col\">要求什么<\/th><th scope=\"col\">使用什么<\/th><\/tr><\/thead><tbody><tr><td>期限 D、期望时间 μ、项目标准差 σₚ<\/td><td>Z；再用题给对应值读概率<\/td><td>Z=(D−μ)/σₚ<\/td><\/tr><tr><td>目标概率对应的 Z、μ、σₚ<\/td><td>期限 D<\/td><td>D=μ+Zσₚ<\/td><\/tr><tr><td>同上，但问 additional time 额外时间<\/td><td>比期望工期多留多少时间<\/td><td>Zσₚ，本例为 4.587 周<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\">题目会提供项目标准差与所需概率／Z 对应值；不要求自行查正态分布表，也不要求把活动方差汇总后开方。<strong>求期限时，Z 与 σₚ 相乘；问额外时间时，不再加回 30 周。<\/strong><\/div><\/section>"},{"key":"L5/gantt","title":"从甘特图读取进度","html":"<p class=\"page-label\">L5 · Gantt Chart 甘特图<\/p><h1>从甘特图读取进度<\/h1><p class=\"intro\">看见一张横条图后，要能读出各项工作的时间，再沿箭头还原工作顺序。下面用同一组数据完成甘特图、活动表与 AON 的对应。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · Q2，10 分；名词解释举例<\/p><p><strong>看横条读时间，看箭头还原简化 AON，再找关键路径与时差。<\/strong>Benefits of Gantt Charts 甘特图的五项优点，是老师举出的名词解释例子。<\/p><\/div><section class=\"concept\"><h2>甘特图怎样读<\/h2><p class=\"term\" lang=\"en\">Gantt chart<\/p><p class=\"definition\">每行是一项活动，横轴是时间。横条左端是开始时点，右端是完成时点，长度表示持续时间。依赖箭头连接受约束的时点。<\/p><p>下面安排六项系统上线工作。P 准备数据，Q 配置系统，R 测试预约，S 编写手册，T 修正预约问题，U 上线。横条给时间，箭头给依赖；两项工作刚好首尾相接，也可能只是排程碰巧如此。<\/p><figure><div class=\"diagram\"><svg aria-label=\"甘特图：P从0到2，Q从2到5，R从5到8，S从5到7，T从8到10，U从10到11；箭头表示FS依赖\" class=\"gantt\" role=\"img\" viewbox=\"0 0 730 400\" width=\"730\"><defs><marker id=\"gantt-arrow\" markerheight=\"6\" markerwidth=\"6\" orient=\"auto\" refx=\"5\" refy=\"3\"><path d=\"M0 0 L6 3 L0 6Z\" fill=\"#245a7e\"><\/path><\/marker><\/defs><path d=\"M175,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"175\" y=\"23\">0<\/text><path d=\"M221,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"221\" y=\"23\">1<\/text><path d=\"M267,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"267\" y=\"23\">2<\/text><path d=\"M313,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"313\" y=\"23\">3<\/text><path d=\"M359,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"359\" y=\"23\">4<\/text><path d=\"M405,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"405\" y=\"23\">5<\/text><path d=\"M451,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"451\" y=\"23\">6<\/text><path d=\"M497,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"497\" y=\"23\">7<\/text><path d=\"M543,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"543\" y=\"23\">8<\/text><path d=\"M589,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"589\" y=\"23\">9<\/text><path d=\"M635,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"635\" y=\"23\">10<\/text><path d=\"M681,35 V365\" stroke=\"#d4e0ea\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"681\" y=\"23\">11<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"start\" x=\"8\" y=\"70\">P 准备数据<\/text><rect fill=\"#326f9b\" height=\"24\" rx=\"2\" width=\"92\" x=\"175\" y=\"53\"><\/rect><text fill=\"white\" font-size=\"13\" text-anchor=\"middle\" x=\"221.0\" y=\"70\">0–2<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"start\" x=\"8\" y=\"122\">Q 配置系统<\/text><rect fill=\"#326f9b\" height=\"24\" rx=\"2\" width=\"138\" x=\"267\" y=\"105\"><\/rect><text fill=\"white\" font-size=\"13\" text-anchor=\"middle\" x=\"336.0\" y=\"122\">2–5<\/text><path d=\"M267,65 H276 V98 H267 V105\" fill=\"none\" marker-end=\"url(#gantt-arrow)\" stroke=\"#245a7e\" stroke-width=\"1.4\"><\/path><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"start\" x=\"8\" y=\"174\">R 测试预约<\/text><rect fill=\"#326f9b\" height=\"24\" rx=\"2\" width=\"138\" x=\"405\" y=\"157\"><\/rect><text fill=\"white\" font-size=\"13\" text-anchor=\"middle\" x=\"474.0\" y=\"174\">5–8<\/text><path d=\"M405,117 H414 V150 H405 V157\" fill=\"none\" marker-end=\"url(#gantt-arrow)\" stroke=\"#245a7e\" stroke-width=\"1.4\"><\/path><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"start\" x=\"8\" y=\"226\">S 编写手册<\/text><rect fill=\"#326f9b\" height=\"24\" rx=\"2\" width=\"92\" x=\"405\" y=\"209\"><\/rect><text fill=\"white\" font-size=\"13\" text-anchor=\"middle\" x=\"451.0\" y=\"226\">5–7<\/text><path d=\"M405,117 H414 V141 H393 V202 H405 V209\" fill=\"none\" marker-end=\"url(#gantt-arrow)\" stroke=\"#245a7e\" stroke-width=\"1.4\"><\/path><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"start\" x=\"8\" y=\"278\">T 修正预约问题<\/text><rect fill=\"#326f9b\" height=\"24\" rx=\"2\" width=\"92\" x=\"543\" y=\"261\"><\/rect><text fill=\"white\" font-size=\"13\" text-anchor=\"middle\" x=\"589.0\" y=\"278\">8–10<\/text><path d=\"M543,169 H552 V254 H543 V261\" fill=\"none\" marker-end=\"url(#gantt-arrow)\" stroke=\"#245a7e\" stroke-width=\"1.4\"><\/path><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"start\" x=\"8\" y=\"330\">U 上线<\/text><rect fill=\"#326f9b\" height=\"24\" rx=\"2\" width=\"46\" x=\"635\" y=\"313\"><\/rect><text fill=\"white\" font-size=\"13\" text-anchor=\"middle\" x=\"658.0\" y=\"330\">10–11<\/text><path d=\"M635,273 H644 V306 H635 V313\" fill=\"none\" marker-end=\"url(#gantt-arrow)\" stroke=\"#245a7e\" stroke-width=\"1.4\"><\/path><path d=\"M497,221 H511 V306 H635 V313\" fill=\"none\" marker-end=\"url(#gantt-arrow)\" stroke=\"#245a7e\" stroke-width=\"1.4\"><\/path><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"660\" y=\"390\">时点 / 天<\/text><\/svg><\/div><figcaption>横条表示计划工作时间；箭头均为 FS 关系，没有额外间隔。时间从 0 开始。<\/figcaption><\/figure><h3>把甘特图中的信息整理成活动表<\/h3><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">Activity 活动<\/th><th scope=\"col\">Start 开始 / 天<\/th><th scope=\"col\">Finish 完成 / 天<\/th><th scope=\"col\">Duration 工期 / 天<\/th><th scope=\"col\">Predecessor 紧前活动<\/th><\/tr><\/thead><tbody><tr><td>P 准备数据<\/td><td>0<\/td><td>2<\/td><td>2<\/td><td>无<\/td><\/tr><tr><td>Q 配置系统<\/td><td>2<\/td><td>5<\/td><td>3<\/td><td>P<\/td><\/tr><tr><td>R 测试预约<\/td><td>5<\/td><td>8<\/td><td>3<\/td><td>Q<\/td><\/tr><tr><td>S 编写手册<\/td><td>5<\/td><td>7<\/td><td>2<\/td><td>Q<\/td><\/tr><tr><td>T 修正预约问题<\/td><td>8<\/td><td>10<\/td><td>2<\/td><td>R<\/td><\/tr><tr><td>U 上线<\/td><td>10<\/td><td>11<\/td><td>1<\/td><td>T、S<\/td><\/tr><\/tbody><\/table><\/div><p>例如 R 的横条从 5 到 8，所以工期是 8−5=3 天。进入 R 的箭头来自 Q，因此画 Q→R。U 的横条虽然紧接 T，图中还有 S→U；这条依赖也必须保留。<\/p><h3>按箭头画简化 AON，再算两条路径<\/h3><div class=\"screen-only\"><figure><div class=\"diagram\"><svg aria-label=\"甘特图对应的AON：P到Q；Q到R和S；R到T；T和S到U\" class=\"network\" role=\"img\" viewbox=\"0 0 775 310\" width=\"775\"><defs><marker id=\"gn-arr\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#2c5d80\"><\/path><\/marker><\/defs><path d=\"M135,150 L160,150\" fill=\"none\" marker-end=\"url(#gn-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><path d=\"M285,150 L310,70\" fill=\"none\" marker-end=\"url(#gn-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><path d=\"M285,150 L310,250\" fill=\"none\" marker-end=\"url(#gn-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><path d=\"M435,70 L465,70\" fill=\"none\" marker-end=\"url(#gn-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><path d=\"M590,70 L625,150\" fill=\"none\" marker-end=\"url(#gn-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><path d=\"M435,250 L625,150\" fill=\"none\" marker-end=\"url(#gn-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><rect fill=\"#edf4fa\" height=\"70\" stroke=\"#527b98\" width=\"125\" x=\"10\" y=\"115\"><\/rect><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"72.5\" y=\"135\">P · 2 天<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"72.5\" y=\"163\">准备数据<\/text><rect fill=\"#edf4fa\" height=\"70\" stroke=\"#527b98\" width=\"125\" x=\"160\" y=\"115\"><\/rect><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"222.5\" y=\"135\">Q · 3 天<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"222.5\" y=\"163\">配置系统<\/text><rect fill=\"#edf4fa\" height=\"70\" stroke=\"#527b98\" width=\"125\" x=\"310\" y=\"35\"><\/rect><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"372.5\" y=\"55\">R · 3 天<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"372.5\" y=\"83\">测试预约<\/text><rect fill=\"#edf4fa\" height=\"70\" stroke=\"#527b98\" width=\"125\" x=\"310\" y=\"215\"><\/rect><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"372.5\" y=\"235\">S · 2 天<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"372.5\" y=\"263\">编写手册<\/text><rect fill=\"#edf4fa\" height=\"70\" stroke=\"#527b98\" width=\"125\" x=\"465\" y=\"35\"><\/rect><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"527.5\" y=\"55\">T · 2 天<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"527.5\" y=\"83\">修正预约问题<\/text><rect fill=\"#edf4fa\" height=\"70\" stroke=\"#527b98\" width=\"125\" x=\"625\" y=\"115\"><\/rect><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"687.5\" y=\"135\">U · 1 天<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"687.5\" y=\"163\">上线<\/text><\/svg><\/div><figcaption>保留同一组活动、工期和依赖箭头。节点在纸上的左右位置不表示具体日期。<\/figcaption><\/figure><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">路径<\/th><th scope=\"col\">工期相加<\/th><th scope=\"col\">含义<\/th><\/tr><\/thead><tbody><tr><td>P→Q→R→T→U<\/td><td>2+3+3+2+1=<strong>11 天<\/strong><\/td><td>最长，决定项目完工；关键路径。<\/td><\/tr><tr><td>P→Q→S→U<\/td><td>2+3+2+1=8 天<\/td><td>比最长路径短 3 天。S 可以使用这 3 天余量。<\/td><\/tr><\/tbody><\/table><\/div><p><strong>从甘特图转 AON：逐行读工期 → 沿箭头找紧前项 → 每项画一个节点 → 按表连线。<\/strong>R 与 S 可以并行。S 在第 7 天完成，U 要等 T 到第 10 天才开始，因此 S 有 3 天总时差。若仅 S 多用 4 天，它会到第 11 天才完成，U 随后用 1 天上线，总工期变成 12 天。<\/p><p>如果反过来根据 AON 画简单甘特图，就按依赖计算各活动最早开始，再按工期画出相应长度的横条。本例 P 为 0–2，Q 为 2–5；Q 完成后，R 与 S 都可以从第 5 天开始。<\/p><div class=\"note\">本例有完整的依赖关系和工期，才能判断关键路径。只有横条、没有依赖信息的图，不能单靠“看上去没有空隙”判定关键路径；只有计划条，也不能判断实际是否延期。<\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The project duration is 11 days. The critical path is P–Q–R–T–U. R and S can run in parallel after Q. U must wait for both T and S.<\/p><\/div><\/section><p class=\"bridge\">刚才从横条读出了日期，从箭头读出了依赖，还找到了同时开展的工作。这些用途说明甘特图为什么便于解释进度、安排资源和跟踪变化。下面五项就是名词解释所需的优点。<\/p><section class=\"concept\"><h2>甘特图的用途<\/h2><p class=\"term\" lang=\"en\">Benefits of Gantt charts<\/p><p class=\"definition\">项目经理用甘特图安排活动时间、查看重叠工作，并向团队说明进度。带有依赖、进度或基准信息的甘特图还能帮助跟踪变化。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Benefits of Gantt Charts 甘特图优点<\/th><th scope=\"col\">具体含义<\/th><\/tr><\/thead><tbody><tr><td>Easy to read and comprehend 容易阅读和理解<\/td><td>从时间轴和横条直接读取活动何时进行、持续多久。<\/td><\/tr><tr><td>Identify the project network with its schedule baseline 呈现网络关系与进度基准<\/td><td>依赖箭头表示工作顺序，基准排程表示原定时间安排。<\/td><\/tr><tr><td>Allow updating and project control 支持更新与项目控制<\/td><td>记录进展与变化后，可以与计划比较并调整。<\/td><\/tr><tr><td>Identify resource needs and assign resources 识别并分配资源<\/td><td>查看同一时段要做哪些活动，据此安排人员和设备。<\/td><\/tr><tr><td>Easy to create 容易制作<\/td><td>把活动与对应时间放在表中，即可绘出横条。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Gantt charts are easy to read and comprehend. They identify the project network together with its schedule baseline. They allow updating and project control. They help identify resource needs and assign resources to tasks. They are easy to create.<\/p><\/div><\/section>"},{"key":"L5/relationships","title":"FS、FF、SS、SF 与 not until","html":"<p class=\"page-label\">L5 · 关系判断与英文表达<\/p><h1>FS、FF、SS、SF 与 not until<\/h1><p class=\"intro\">四种关系限制的是前后两项活动的开始或完成时点。英文作答要把 start、finish 和间隔写准确。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 关系判断与英文表达<\/p><p><strong>用 cannot … until … 写出 FS、FF、SS、SF。<\/strong>同样是“原型开发、测试”，限制测试开始是 FS，限制测试结束是 FF；活动名称不决定关系。<\/p><\/div><section class=\"concept\"><h2>四种活动关系<\/h2><p class=\"term\" lang=\"en\">FS / FF / SS / SF<\/p><p class=\"definition\">把前置活动称为 A，后续活动称为 B。关系名称的第一个词指 A 的时点，第二个词指 B 的时点。Lag 是关系中额外要求的时间间隔。<\/p><p>同样做原型开发与测试，公司可以选择不同安排。若必须等完整原型做完才开始测试，限制的是测试的开始，属于 <strong>Finish-to-Start（FS）完成后才能开始<\/strong>。若允许边开发边测试，但原型没完成就不能结束测试，限制的是测试的结束，属于 <strong>Finish-to-Finish（FF）完成后才能结束<\/strong>。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">关系<\/th><th scope=\"col\">中文含义与时间条件<\/th><th scope=\"col\">英文表达<\/th><\/tr><\/thead><tbody><tr><td>Finish-to-Start（FS）<\/td><td>A 完成后，B 才可以开始。<br/>Start B ≥ Finish A + lag<\/td><td>B cannot start until A has finished.<\/td><\/tr><tr><td>Finish-to-Finish（FF）<\/td><td>A 完成后，B 才可以完成。<br/>Finish B ≥ Finish A + lag<\/td><td>B cannot finish until A has finished.<\/td><\/tr><tr><td>Start-to-Start（SS）<\/td><td>A 开始后，B 才可以开始。<br/>Start B ≥ Start A + lag<\/td><td>B cannot start until A has started.<\/td><\/tr><tr><td>Start-to-Finish（SF）<\/td><td>A 开始后，B 才可以完成。<br/>Finish B ≥ Start A + lag<\/td><td>B cannot finish until A has started.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>FS：原型开发完成后，测试才可以开始。FF+4 天：原型完成四天后，测试才可以完成。SS+5 天：P 开始五天后，Q 才可以开始。SF：新保安开始值班后，上一班保安才可以结束值班。<\/p><\/div><div class=\"note\">这些关系规定时间下限，不能自动写成“必须同时”开始或完成。其他限制可能让 B 更晚。<\/div><p>例如 <strong>Testing cannot start until prototype development has finished.<\/strong> 可以先读 until 后半句：“原型开发已经完成”；再读前半句：“测试才可以开始”。关系名也按这个顺序取词：开发的 Finish、测试的 Start，所以是 FS。英文句子通常先写受到限制的测试，关系名称却先写它所等待的前一项活动，这正是容易读反的地方。<\/p><h3>等待几天后，才允许开始或结束<\/h3><p>如果关系中还要求额外等一段时间，这段间隔叫 <strong>Lag 滞后时间<\/strong>。先按 FS、FF、SS 或 SF 找到被限制的时点，再加上这段间隔。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">关系与已知条件<\/th><th scope=\"col\">受限制的最早时点<\/th><th scope=\"col\">英文表达<\/th><\/tr><\/thead><tbody><tr><td>FS＋4 天：原型在第 10 天完成<\/td><td>测试不能早于第 14 天开始。<\/td><td>Testing cannot start until four days after prototype development is complete.<\/td><\/tr><tr><td>FF＋4 天：原型在第 10 天完成<\/td><td>测试不能早于第 14 天完成。<\/td><td>Testing cannot finish until four days after prototype development is complete.<\/td><\/tr><tr><td>SS＋5 天：原型开发在第 2 天开始<\/td><td>测试不能早于第 7 天开始。<\/td><td>Testing cannot start until five days after prototype development starts.<\/td><\/tr><tr><td>SF＋3 天：新系统在第 10 天开始运行<\/td><td>旧系统不能早于第 13 天结束运行。<\/td><td>The old system cannot finish operating until three days after the new system starts operating.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>例如，原型第 10 天完成，关系为 FS＋4 天，测试本身需要 2 天。测试最早第 14 天开始、第 16 天完成。4 天是等待时间，2 天才是测试工期；画甘特图时，测试横条仍然长 2 天。<\/p><\/div><p>FF＋4 天限制的是测试最早可以完成的时点。它没有单独确定测试哪天开始，开始时间还取决于测试工期及其他条件。<\/p><h3>Start-to-Finish：新工作开始后，旧工作才可以结束<\/h3><div class=\"example\"><span class=\"small-label\">例子<\/span><p>更换手机时，需要保持联络。新手机开始提供服务后，旧手机才可以停用。前置活动 A 是“新手机开始服务”，后续活动 B 的受限时点是“旧手机结束服务”，因此是 Start-to-Finish（SF）。<\/p><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The old phone cannot be taken out of service until the new phone starts operating.<\/p><\/div><p>SF 容易误读，是因为旧服务在现实中早已开始。关系中的“后续”指受到这个条件约束，不表示它一定较晚开始。<strong>先看被限制的是哪个时点，再写关系名称。<\/strong><\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Testing cannot finish until four days after the prototype has been completed. This is a finish-to-finish relationship with a four-day lag.<\/p><\/div><\/section>"},{"key":"L5/costs","title":"费用分类","html":"<p class=\"page-label\">L5 · Cost Classifications<\/p><h1>费用分类<\/h1><p class=\"intro\">项目专用材料既可能是直接成本，也可能随用量变化。一笔费用可以从不同角度分类，先看题目问的是哪一组区别。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 选择题概念<\/p><p><strong>Direct/Indirect、Recurring/Nonrecurring、Fixed/Variable、Normal/Expedited<\/strong>分别是直接／间接、经常性／一次性、固定／可变、正常／加速费用。学习曲线、比例估算法、功能点估算法不纳入本次复习。<\/p><\/div><section class=\"concept\"><h2>成本分类<\/h2><p class=\"term\" lang=\"en\">Cost classifications<\/p><p class=\"definition\">每一组成本名称回答一个不同问题，不必把一笔费用强行放进唯一类别。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">分类角度<\/th><th scope=\"col\">含义<\/th><th scope=\"col\">例子<\/th><\/tr><\/thead><tbody><tr><td>Direct / Indirect 直接 / 间接<\/td><td>能否明确归属于某项项目工作<\/td><td>项目专用材料是直接成本；共用行政开支是间接成本<\/td><\/tr><tr><td>Recurring / Nonrecurring 经常性 / 一次性<\/td><td>是否反复发生<\/td><td>持续人工和物流费用；一次性市场分析或启动培训<\/td><\/tr><tr><td>Fixed / Variable 固定 / 可变<\/td><td>是否随使用量变化<\/td><td>给定租期内的固定租金；随数量增加的材料费用<\/td><\/tr><tr><td>Normal / Expedited 正常 / 加速<\/td><td>是否因加快项目而增加费用<\/td><td>常规运输；为缩短等待而支付加急费<\/td><\/tr><\/tbody><\/table><\/div><p>Overhead 间接开支包括共用设施、税费、保险、设备折旧等。G&amp;A 是 General and Administrative，综合及行政管理费用。具体归类要结合费用怎样归属和题目条件。<\/p><div class=\"example\"><span class=\"small-label\">例子<\/span><p>题目说一批新员工在项目启动时接受一次培训，强调的是 Nonrecurring Cost 一次性费用；每个月持续发生的人工或物流费用，则属于 Recurring Cost 经常性费用。分类看题目给出的发生方式，不能仅凭“培训”两个字就判定所有培训都只发生一次。<\/p><\/div><p>同一笔费用也能同时属于几组类别。例如，项目每批都要采购的专用材料：能直接归到项目工作，是 Direct 直接成本；反复采购，是 Recurring 经常性成本；买得越多费用越高，是 Variable 可变成本。如果另外付加急运输费来提前到货，这部分又属于 Expedited 加速成本。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Direct costs can be attributed to specific project work; indirect costs support the work more broadly. Recurring costs occur repeatedly, while nonrecurring costs are one-time expenditures. Fixed costs remain constant over the stated period or activity range; variable costs change with usage or volume. Expedited costs arise from accelerating work compared with the normal plan.<\/p><\/div><\/section>"},{"key":"L5/loaded-rate","title":"综合人工费率：从时薪到总费用","html":"<p class=\"page-label\">L5 · Fully Loaded Rate<\/p><h1>综合人工费率：从时薪到总费用<\/h1><p class=\"intro\">程序员每小时工资 $37.50，为什么项目预算中要按 $61.875 计算？因为公司还需要承担附加成本。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 费率与费用计算<\/p><p><strong>附加 65%：基本工资 100% 加附加 65%，所以乘 1.65。<\/strong>Fully Loaded Rate 综合人工费率的单位是金额／小时；总费用还要乘工时。<\/p><\/div><section class=\"concept\"><h2>含附加成本的人工费率<\/h2><p class=\"term\" lang=\"en\">Fully loaded rate<\/p><p class=\"definition\">Fully loaded rate 是在基本人工费率上计入附加成本后的费率，单位通常为金额/小时。Total labor cost 总人工成本还要乘以工时。<\/p><p>公司支付程序员的基本时薪，还要承担相关间接开支。基本时薪 $37.50 不代表公司每小时只花 $37.50。题目说另加 65%，意思是每 $100 基本工资再加 $65。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">计算对象<\/th><th scope=\"col\">过程<\/th><th scope=\"col\">结果<\/th><\/tr><\/thead><tbody><tr><td>每小时附加成本<\/td><td>37.50×65%<\/td><td>$24.375／小时<\/td><\/tr><tr><td>综合人工费率<\/td><td>37.50+24.375，等价于 37.50×1.65<\/td><td>$61.875／小时<\/td><\/tr><tr><td>80 小时的总人工成本<\/td><td>61.875×80<\/td><td>$4,950<\/td><\/tr><\/tbody><\/table><\/div><div class=\"formula\">Fully Loaded Rate 综合人工费率 = Base Rate 基本费率 × (1 + Overhead Rate 附加比例)<br/>Total Labor Cost 总人工成本 = 综合人工费率 × Hours 工时<\/div><p><strong>乘 0.65 只算出了附加部分；乘 1.65 才包含原来的工资。<\/strong>题目问 rate，回答金额／小时；问 total cost，再乘工作小时数。中间值保留精度，最后按要求取舍。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The fully loaded labor rate is $61.875 per hour. For 80 hours, the total labor cost is $4,950.<\/p><\/div><\/section>"},{"key":"L5/budget","title":"预算的含义与读表","html":"<p class=\"page-label\">L5 · 保留概念与读表，编表计算待确认<\/p><h1>预算的含义与读表<\/h1><p class=\"intro\">预算把费用安排到活动和预计支出的时段。读表时分清单期支出、累计支出和总预算。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">范围处理 · 已按你的确认保留<\/p><p><strong>保留预算概念与读表，编表计算待确认。<\/strong>速记列有预算，老师在预算部分明确说“不考”；这里按已确认的处理保留，不修改原始 exam。<\/p><\/div><section class=\"concept\"><h2>预算与读表<\/h2><p class=\"term\" lang=\"en\">Project budget / Time-phased budget<\/p><p class=\"definition\">项目预算把资金安排到项目工作。Time-phased budget 按时间分配预算，便于看出各期需要多少资金。费用跟踪表比较计划与实际费用。<\/p><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">工作<\/th><th scope=\"col\">第 1 周计划 $<\/th><th scope=\"col\">第 2 周计划 $<\/th><th scope=\"col\">第 3 周计划 $<\/th><th scope=\"col\">合计 $<\/th><\/tr><\/thead><tbody><tr><td>需求确认<\/td><td>400<\/td><td>0<\/td><td>0<\/td><td>400<\/td><\/tr><tr><td>系统配置<\/td><td>0<\/td><td>800<\/td><td>200<\/td><td>1,000<\/td><\/tr><tr><td>测试与培训<\/td><td>0<\/td><td>0<\/td><td>600<\/td><td>600<\/td><\/tr><tr><td>各周合计<\/td><td>400<\/td><td>800<\/td><td>800<\/td><td>2,000<\/td><\/tr><\/tbody><\/table><\/div><p>此表表示第 1 周计划支出 $400，第 2 周 $800，第 3 周 $800；项目总预算 $2,000。累计到第 2 周的计划费用为 $1,200，不是第 2 周单周费用。<\/p><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">工作<\/th><th scope=\"col\">计划 $<\/th><th scope=\"col\">实际 $<\/th><th scope=\"col\">实际−计划 $<\/th><\/tr><\/thead><tbody><tr><td>需求确认<\/td><td>400<\/td><td>450<\/td><td>+50<\/td><\/tr><tr><td>系统配置<\/td><td>1,000<\/td><td>900<\/td><td>−100<\/td><\/tr><\/tbody><\/table><\/div><p>这里明确把差额定义为“实际−计划”。+50 表示比计划多支出 $50；−100 表示比计划少支出 $100。不要脱离列标题，只凭正负号判断好坏。<\/p><div class=\"note\">本套准备预算概念与读表。自行编制预算表的计算要求待确认。<\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A time-phased budget allocates planned costs to project activities and the periods in which the costs are expected to occur. Comparing planned and actual costs helps identify spending differences.<\/p><\/div><\/section>"},{"key":"L5/crashing","title":"赶工斜率与关键路径","html":"<p class=\"page-label\">L5 · Crashing / Cost Slope<\/p><h1>赶工斜率与关键路径<\/h1><p class=\"intro\">花更多钱让一项工作提前完成，项目就一定能提前吗？先看它是否决定项目完工，再比较缩短每一天或每一周的代价。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 斜率小计算与判断<\/p><p><strong>Crashing 赶工：增加资源或费用以缩短工期。<\/strong>先看关键路径，再算每缩短一单位时间增加的费用；不扩展为逐轮优化整张网络的大计算。<\/p><\/div><section class=\"concept\"><h2>赶工斜率<\/h2><p class=\"term\" lang=\"en\">Crash cost slope<\/p><p class=\"definition\">赶工斜率表示每缩短一个时间单位需要增加多少成本。Normal 是正常方案，Crash 是题给的最短可行方案。<\/p><div class=\"formula\">Cost slope = (Crash cost − Normal cost) / (Normal time − Crash time)<\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>正常工期 5 周、成本 $12,000；赶工工期 3 周、成本 $32,000。最多缩短 2 周，额外费用 $20,000，斜率=$10,000/周。<\/p><\/div><p>斜率假定题给区间内单位赶工成本按此估算。若正常工期与赶工工期相同，就没有可缩短的时间，不能把分母 0 算成零成本。<\/p><p>多花 $20,000 可以省 2 周，所以每省 1 周增加 $10,000。在这个可赶工区间内，省 1 周按斜率估算多花 $10,000；最多只能省 2 周，不能继续外推为省 3 周。<\/p><div class=\"example\"><span class=\"small-label\">例子<\/span><p>项目落后于计划，经理决定给关键路径上的活动增加资源，使它们更快完成。这个做法叫 Crashing 赶工。题目中的依据是“增加资源”和“缩短关键活动工期”。<\/p><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">容易混淆的做法<\/th><th scope=\"col\">判断依据<\/th><\/tr><\/thead><tbody><tr><td>Crashing 赶工<\/td><td>给活动增加资源或费用，使它更快完成。例如增加安装人员。<\/td><\/tr><tr><td>Fast-tracking 快速跟进（重叠开展工作）<\/td><td>改变工作安排，使一部分后续工作提前与前项同时进行。例如原型尚未全部完成，先开始能够开展的测试。<\/td><\/tr><\/tbody><\/table><\/div><p>选择题 10.24 说的是给关键活动增加资源，因此选 Crashing。若题目强调把先后的工作改成重叠进行，才是 Fast-tracking。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The crash cost slope is the additional cost per unit of time saved. It equals the difference between crash and normal costs divided by the difference between normal and crash durations.<\/p><\/div><\/section><p class=\"bridge\">斜率只说明缩短某项活动要增加多少钱。要判断整个项目是否会提前，还需要看它是否在决定完工时间的关键路径上。<\/p><section class=\"concept\"><h2>哪些赶工能缩短项目<\/h2><p class=\"term\" lang=\"en\">Crashing and the critical path<\/p><p class=\"definition\">缩短非关键活动，通常只增加该活动的余量，不能缩短由关键路径决定的项目工期。有多条关键路径时，需要让所有最长路径都变短。<\/p><div class=\"example\"><span class=\"small-label\">例子<\/span><p>两条路径分别为 16 天和 12 天。如果只缩短 12 天路径上的活动，项目仍需 16 天。若两条路径都是 16 天，只缩短其中一条，另一条仍使项目需要 16 天。<\/p><\/div><p>每次调整工期后都要重新核对路径。较短路径可能变成关键路径。是否值得支付赶工费用，还取决于项目提前完成的收益、处罚或其他目标。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Crashing reduces project duration only when it shortens the paths that determine completion. If multiple critical paths exist, all must be shortened, either through a shared activity or through activities on each path.<\/p><\/div><\/section>"},{"key":"L5/aoa","title":"AOA：把活动写在箭头上","html":"<p class=\"page-label\">L5 · Activity-on-Node / Activity-on-Arrow<\/p><h1>AOA：把活动写在箭头上<\/h1><p class=\"intro\">先用安装电脑、安装软件和测试这三项工作，对比 AON 与 AOA。分清圆圈与箭头后，再看虚线为什么能表达额外的等待条件。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 选择题概念<\/p><p><strong>AON：节点是活动；AOA：箭头是活动，节点是事件。<\/strong>Dummy Activity 虚拟活动用于 AOA，工期为 0，用来保留依赖关系。<\/p><\/div><section class=\"concept\"><h2>同样三项工作，换一种画法<\/h2><p class=\"term\">Activity-on-Node（AON）节点表示活动 · Activity-on-Arrow（AOA）箭头表示活动<\/p><p>医院要启用一台服务台电脑。先安装电脑，用 2 天；再安装软件，用 1 天；最后测试运行，用 1 天。无论用哪种图，这个顺序都不变。<\/p><div class=\"screen-only\"><figure><div class=\"diagram\"><svg aria-label=\"同三项工作用AON和AOA表示：安装电脑2天，安装软件1天，测试运行1天。AOA的圆圈2表示电脑安装完成的时点。\" class=\"aoa-chain\" role=\"img\" viewbox=\"0 0 740 340\" width=\"740\"><defs><marker id=\"chain-arr\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#2c5d80\"><\/path><\/marker><\/defs><text fill=\"#193e5c\" font-size=\"18\" text-anchor=\"start\" x=\"15\" y=\"25\">AON：工作写在方框里<\/text><rect fill=\"#edf4fa\" height=\"65\" stroke=\"#527b98\" width=\"180\" x=\"20\" y=\"48\"><\/rect><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"110\" y=\"73\">安装电脑<\/text><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"110\" y=\"100\">2 天<\/text><rect fill=\"#edf4fa\" height=\"65\" stroke=\"#527b98\" width=\"180\" x=\"280\" y=\"48\"><\/rect><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"370\" y=\"73\">安装软件<\/text><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"370\" y=\"100\">1 天<\/text><rect fill=\"#edf4fa\" height=\"65\" stroke=\"#527b98\" width=\"180\" x=\"540\" y=\"48\"><\/rect><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"630\" y=\"73\">测试运行<\/text><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"630\" y=\"100\">1 天<\/text><path d=\"M200 80 H278\" fill=\"none\" marker-end=\"url(#chain-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><path d=\"M460 80 H538\" fill=\"none\" marker-end=\"url(#chain-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#193e5c\" font-size=\"18\" text-anchor=\"start\" x=\"15\" y=\"173\">AOA：工作写在箭头上<\/text><path d=\"M54 230 H235\" marker-end=\"url(#chain-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"145\" y=\"205\">安装电脑 · 2 天<\/text><path d=\"M274 230 H455\" marker-end=\"url(#chain-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"365\" y=\"205\">安装软件 · 1 天<\/text><path d=\"M494 230 H675\" marker-end=\"url(#chain-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"585\" y=\"205\">测试运行 · 1 天<\/text><circle cx=\"35\" cy=\"230\" fill=\"#fff\" r=\"19\" stroke=\"#315f7d\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"35\" y=\"236\">1<\/text><circle cx=\"255\" cy=\"230\" fill=\"#fff\" r=\"19\" stroke=\"#315f7d\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"255\" y=\"236\">2<\/text><circle cx=\"475\" cy=\"230\" fill=\"#fff\" r=\"19\" stroke=\"#315f7d\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"475\" y=\"236\">3<\/text><circle cx=\"695\" cy=\"230\" fill=\"#fff\" r=\"19\" stroke=\"#315f7d\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"695\" y=\"236\">4<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"35\" y=\"280\">开始<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"35\" y=\"305\"><\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"255\" y=\"280\">电脑已安装<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"255\" y=\"305\">可以安装软件<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"475\" y=\"280\">软件已安装<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"475\" y=\"305\">可以测试<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"695\" y=\"280\">测试完成<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"695\" y=\"305\"><\/text><\/svg><\/div><figcaption>两张图表示相同的工作顺序。AOA 中，“安装电脑”花 2 天；圆圈 2 只标记电脑装好的那一刻。<\/figcaption><\/figure><\/div><p>上图把“安装电脑”放在方框里，箭头只表示它与后续工作的先后关系。下图把“安装电脑”移到箭头上，再用两个圆圈标记这项工作开始和完成的时点。<\/p><p class=\"definition\"><strong>Activity 活动<\/strong>是一项需要做的工作，会占用时间。<strong>Event 事件<\/strong>是图中标记的一个时点，例如“电脑已经装好，可以开始安装软件”。AOA 用箭头表示活动，用圆圈表示事件。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">读图对象<\/th><th scope=\"col\">在本例中怎么读<\/th><\/tr><\/thead><tbody><tr><td>箭头上的“安装电脑 · 2 天”<\/td><td>这是一项工作，需要 2 天。<\/td><\/tr><tr><td>圆圈 2<\/td><td>电脑已经安装完成的时点。2 是编号，不是第 2 天，也不是另一项工作。<\/td><\/tr><tr><td>从圆圈 2 出发的箭头<\/td><td>安装软件可以开始。它还需要 1 天，才到达下一个事件。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">In AON, nodes represent activities and arrows represent dependencies. In AOA, arrows represent activities and nodes represent events, such as the completion of one activity and the point at which the next activity may start.<\/p><\/div><\/section><p class=\"bridge\">刚才三项工作依次进行，普通箭头就能说明顺序。出现并行分支后，有的工作要等两项前置工作完成，有的只需等其中一项。下面这个例子说明怎样用虚线保留这种区别。<\/p><section class=\"concept\"><h2>D 要等两项工作，C 只等一项<\/h2><p>服务台启用前，还有下面四项工作。位置确定后就能安装指路牌；安装电脑则既要确定位置，也要检查好电脑。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">活动<\/th><th scope=\"col\">要做的工作<\/th><th scope=\"col\">直接等待谁<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>确定服务台位置<\/td><td>无<\/td><\/tr><tr><td>B<\/td><td>检查电脑<\/td><td>无<\/td><\/tr><tr><td>C<\/td><td>安装指路牌<\/td><td>只等 A<\/td><\/tr><tr><td>D<\/td><td>安装电脑<\/td><td>等 A、B 两项都完成<\/td><\/tr><\/tbody><\/table><\/div><p>A 完成后，C 已经可以开始，因此要保留 A 自己的完成事件。判断 D 能否开始时，除了看 B 是否完成，还要看 A 是否完成。图中从 A 的终点向 D 的起点画一条虚线，表示“D 还要等 A”。<\/p><div class=\"screen-only\"><figure><div class=\"diagram\"><svg aria-label=\"AOA示例：A为1到2，B为1到3，C为2到4，D为3到4，虚活动为2到3\" role=\"img\" viewbox=\"0 0 620 300\" width=\"620\"><defs><marker id=\"aoa-arr\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#2c5d80\"><\/path><\/marker><\/defs><path d=\"M70 147 L270 65\" fill=\"none\" marker-end=\"url(#aoa-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><path d=\"M70 153 L270 235\" fill=\"none\" marker-end=\"url(#aoa-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><path d=\"M310 65 L550 147\" fill=\"none\" marker-end=\"url(#aoa-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><path d=\"M310 235 L550 153\" fill=\"none\" marker-end=\"url(#aoa-arr)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><path d=\"M290 80 V220\" marker-end=\"url(#aoa-arr)\" stroke=\"#2c5d80\" stroke-dasharray=\"6 5\" stroke-width=\"2\"><\/path><circle cx=\"50\" cy=\"150\" fill=\"#edf4fa\" r=\"20\" stroke=\"#315f7d\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"50\" y=\"156\">1<\/text><circle cx=\"290\" cy=\"60\" fill=\"#edf4fa\" r=\"20\" stroke=\"#315f7d\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"290\" y=\"66\">2<\/text><circle cx=\"290\" cy=\"240\" fill=\"#edf4fa\" r=\"20\" stroke=\"#315f7d\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"290\" y=\"246\">3<\/text><circle cx=\"570\" cy=\"150\" fill=\"#edf4fa\" r=\"20\" stroke=\"#315f7d\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"570\" y=\"156\">4<\/text><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"150\" y=\"85\">A 确定服务台位置<\/text><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"150\" y=\"233\">B 检查电脑<\/text><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"438\" y=\"85\">C 安装指路牌<\/text><text fill=\"#193e5c\" font-size=\"15\" text-anchor=\"middle\" x=\"438\" y=\"233\">D 安装电脑<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"350\" y=\"145\">Dummy<\/text><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"350\" y=\"166\">工期 0<\/text><\/svg><\/div><figcaption>实线箭头代表活动，圆圈代表事件。虚线 2→3 让 D 同时等待 A、B，C 仍只等待 A。<\/figcaption><\/figure><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">沿哪条关系读<\/th><th scope=\"col\">实际含义<\/th><\/tr><\/thead><tbody><tr><td>A→事件 2→C<\/td><td>位置已确定，指路牌可以安装。C 不必等 B 检查电脑。<\/td><\/tr><tr><td>B 与虚线同时进入事件 3<\/td><td>D 必须等 B 完成，并通过虚线等到 A 完成。<\/td><\/tr><tr><td>虚线 2→3<\/td><td>没有额外的工作要做，只表达“D 还要等 A”。<\/td><\/tr><\/tbody><\/table><\/div><p class=\"definition\"><strong>Dummy Activity 虚拟活动<\/strong>是 AOA 中用于表达依赖关系的虚线箭头。它不安排实际工作，<strong>工期为 0，不消耗资源<\/strong>。<\/p><p>如果直接把 A、B 的终点合成一个圆圈，再让 C、D 都从那里出发，C 也会被迫等待 B。活动表没有这个要求，所以那样合并就多加了一项依赖。<strong>虚活动的作用，是让 D 等到 A，同时保留 C 只等 A 的安排。<\/strong><\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A dummy activity is a zero-duration, resource-free activity used in an AOA network to represent a logical dependency. In this example, it makes D depend on A as well as B, while C depends only on A.<\/p><\/div><p>选择题 10.25 使用了 Dummy variables 的写法，指的就是这里的虚活动，对应 AOA。<strong>Merge 汇合<\/strong>是多条箭头进入同一事件，要等所有前置条件满足；<strong>Burst 分叉<\/strong>是多条箭头从同一事件出发，表示随后可以分别开展多项工作。图中事件 3 接收 B 与虚线，是汇合；事件 2 向 C 与虚线分出两条箭头，是分叉。<\/p><\/section><details><summary>画图时还要核对的两条规则<\/summary><p>一条实线箭头只写一项活动；一个事件编号只对应一个事件。若两项并行活动原本有相同的起点、终点，应分别表示它们的完成事件，再在需要的位置用虚线连接，不能把两个活动名塞在同一条箭头上。<\/p><p>沿路径经过虚线时，仍沿它读取先后关系，只是加上 0 工期。虚线不能因为“不耗时”就随意删除。判断是否多余，要看删除后活动之间的依赖是否仍与活动表相同。<\/p><\/details>"},{"key":"L5/dummy-1015","title":"10.15：怎样确定虚活动","html":"<p class=\"page-label\">L5 · Dummy Activities 完整作图示例<\/p><h1>10.15：怎样确定虚活动<\/h1><p class=\"intro\">这道题要同时保留“等两项工作”和“只等其中一项”的条件。下面从活动表出发，分三步把关系接完整。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">10.15 · 作图理解<\/p><p><strong>D 要同时等 B、C，E 和 G 各只等一项。<\/strong>给 D 单独设置汇合事件，再用两条零工期虚线接入 B、C 的完成条件。下面可以按三步查看图是怎样画出来的。<\/p><\/div><section class=\"concept\"><h2>先读出三组不同的等待条件<\/h2><p class=\"term\">Immediate Predecessor 紧前活动 · Dummy Activity 虚拟活动<\/p><p>10.15 有八项活动，工期以天计。AOA 作图仍从这张表出发：每一项工作画成实线箭头，圆圈表示工作开始或完成的时点。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Activity 活动<\/th><th scope=\"col\">Duration 工期 / 天<\/th><th scope=\"col\">Immediate Predecessor 紧前活动<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>3<\/td><td>无<\/td><\/tr><tr><td>B<\/td><td>5<\/td><td>A<\/td><\/tr><tr><td>C<\/td><td>7<\/td><td>A<\/td><\/tr><tr><td>D<\/td><td>3<\/td><td>B、C<\/td><\/tr><tr><td>E<\/td><td>5<\/td><td>B<\/td><\/tr><tr><td>F<\/td><td>4<\/td><td>D<\/td><\/tr><tr><td>G<\/td><td>2<\/td><td>C<\/td><\/tr><tr><td>H<\/td><td>5<\/td><td>E、F、G<\/td><\/tr><\/tbody><\/table><\/div><p><strong>D 等 B 和 C；E 只等 B；G 只等 C。<\/strong>这三行决定了虚线放在哪里。若为了让 D 等两项工作而直接合并 B、C 的终点，E、G 就都会多等一项。下面先保留两个终点，再单独处理 D。<\/p><\/section><div class=\"walkthrough\" data-walkthrough=\"\"><div aria-label=\"10.15 作图步骤\" class=\"walk-controls\" role=\"group\"><button aria-controls=\"aoa-step-0\" aria-expanded=\"true\" data-step=\"0\" type=\"button\">1 · 先画 A、B、C<\/button><button aria-controls=\"aoa-step-1\" aria-expanded=\"true\" data-step=\"1\" type=\"button\">2 · 让 D 同时等待 B、C<\/button><button aria-controls=\"aoa-step-2\" aria-expanded=\"true\" data-step=\"2\" type=\"button\">3 · 接上 E、F、G、H<\/button><\/div><section class=\"walk-step\" id=\"aoa-step-0\"><h3>1 · 先画 A、B、C<\/h3><p>A 没有紧前活动，从开始事件 1 出发。A 完成后到达事件 2，B、C 都从这里开始。<strong>B 和 C 各自保留一个结束圆圈，分别编号 3、4。<\/strong>这样后面可以从 3 单独接 E，从 4 单独接 G。<\/p><div class=\"screen-only\"><figure><div class=\"diagram\"><svg aria-label=\"10.15 第1步：先画A，A完成后分出B和C，保留B和C各自的结束事件。\" class=\"aoa-small\" role=\"img\" viewbox=\"0 0 355 430\" width=\"355\"><defs><marker id=\"a1015-1\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#2c5d80\"><\/path><\/marker><marker id=\"a1015-1-d\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#a34e19\"><\/path><\/marker><\/defs><path d=\"M55 220 H150\" fill=\"none\" marker-end=\"url(#a1015-1)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"102\" y=\"204\">A · 3<\/text><path d=\"M184 206 L296 94\" fill=\"none\" marker-end=\"url(#a1015-1)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"225\" y=\"140\">B · 5<\/text><path d=\"M184 234 L296 346\" fill=\"none\" marker-end=\"url(#a1015-1)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"225\" y=\"320\">C · 7<\/text><circle cx=\"35\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"35\" y=\"226\">1<\/text><circle cx=\"170\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"170\" y=\"226\">2<\/text><circle cx=\"310\" cy=\"80\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"310\" y=\"86\">3<\/text><circle cx=\"310\" cy=\"360\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"310\" y=\"366\">4<\/text><\/svg><\/div><figcaption>事件 2：A 已完成；事件 3：B 已完成；事件 4：C 已完成。数字 1、2、3、4 是事件编号。<\/figcaption><\/figure><\/div><\/section><section class=\"walk-step\" id=\"aoa-step-1\"><h3>2 · 让 D 同时等待 B、C<\/h3><p>现在处理 D。它要同时等 B、C，因此另画一个圆圈 5，作为 D 的起点。再从 B 的终点 3 和 C 的终点 4，各画一条工期为 0 的虚线到 5。<\/p><div class=\"screen-only\"><figure><div class=\"diagram\"><svg aria-label=\"10.15 第2步：从B和C的结束事件分别画零工期虚线到事件5，D由事件5开始。\" class=\"aoa-medium\" role=\"img\" viewbox=\"0 0 655 430\" width=\"655\"><defs><marker id=\"a1015-2\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#2c5d80\"><\/path><\/marker><marker id=\"a1015-2-d\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#a34e19\"><\/path><\/marker><\/defs><path d=\"M55 220 H150\" fill=\"none\" marker-end=\"url(#a1015-2)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"102\" y=\"204\">A · 3<\/text><path d=\"M184 206 L296 94\" fill=\"none\" marker-end=\"url(#a1015-2)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"225\" y=\"140\">B · 5<\/text><path d=\"M184 234 L296 346\" fill=\"none\" marker-end=\"url(#a1015-2)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"225\" y=\"320\">C · 7<\/text><path d=\"M325 94 L445 206\" fill=\"none\" marker-end=\"url(#a1015-2-d)\" stroke=\"#a34e19\" stroke-dasharray=\"7 5\" stroke-width=\"2\"><\/path><text fill=\"#a34e19\" font-size=\"16\" text-anchor=\"middle\" x=\"407\" y=\"135\">d₁ · 0<\/text><path d=\"M325 346 L445 234\" fill=\"none\" marker-end=\"url(#a1015-2-d)\" stroke=\"#a34e19\" stroke-dasharray=\"7 5\" stroke-width=\"2\"><\/path><text fill=\"#a34e19\" font-size=\"16\" text-anchor=\"middle\" x=\"407\" y=\"325\">d₂ · 0<\/text><path d=\"M480 220 H585\" fill=\"none\" marker-end=\"url(#a1015-2)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"532\" y=\"204\">D · 3<\/text><circle cx=\"35\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"35\" y=\"226\">1<\/text><circle cx=\"170\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"170\" y=\"226\">2<\/text><circle cx=\"310\" cy=\"80\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"310\" y=\"86\">3<\/text><circle cx=\"310\" cy=\"360\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"310\" y=\"366\">4<\/text><circle cx=\"460\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"460\" y=\"226\">5<\/text><circle cx=\"605\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"605\" y=\"226\">6<\/text><\/svg><\/div><figcaption>d₁ 表示 D 要等 B；d₂ 表示 D 要等 C。两条虚线都不增加工期。<\/figcaption><\/figure><\/div><p><strong>d₁：D 要等 B；d₂：D 要等 C。<\/strong>事件 5 必须等两条虚线的前提都满足，D 才能开始。B、C 原来的终点没有合并，所以 E、G 仍能分别只等 B、C。<\/p><\/section><section class=\"walk-step\" id=\"aoa-step-2\"><h3>3 · 接上 E、F、G、H<\/h3><p>E 从 B 的终点 3 出发；G 从 C 的终点 4 出发；D 做完后再接 F。H 要等 E、F、G 全部完成，因此把这三项活动的终点都接到事件 7，再从 7 画 H。<\/p><div class=\"screen-only\"><figure><div class=\"diagram\"><svg aria-label=\"10.15 第3步：完整图：D等B和C；E只等B；G只等C；E、F、G完成后开始H。\" class=\"network\" role=\"img\" viewbox=\"0 0 930 430\" width=\"930\"><defs><marker id=\"a1015-3\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#2c5d80\"><\/path><\/marker><marker id=\"a1015-3-d\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#a34e19\"><\/path><\/marker><\/defs><path d=\"M55 220 H150\" fill=\"none\" marker-end=\"url(#a1015-3)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"102\" y=\"204\">A · 3<\/text><path d=\"M184 206 L296 94\" fill=\"none\" marker-end=\"url(#a1015-3)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"225\" y=\"140\">B · 5<\/text><path d=\"M184 234 L296 346\" fill=\"none\" marker-end=\"url(#a1015-3)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"225\" y=\"320\">C · 7<\/text><path d=\"M325 94 L445 206\" fill=\"none\" marker-end=\"url(#a1015-3-d)\" stroke=\"#a34e19\" stroke-dasharray=\"7 5\" stroke-width=\"2\"><\/path><text fill=\"#a34e19\" font-size=\"16\" text-anchor=\"middle\" x=\"407\" y=\"135\">d₁ · 0<\/text><path d=\"M325 346 L445 234\" fill=\"none\" marker-end=\"url(#a1015-3-d)\" stroke=\"#a34e19\" stroke-dasharray=\"7 5\" stroke-width=\"2\"><\/path><text fill=\"#a34e19\" font-size=\"16\" text-anchor=\"middle\" x=\"407\" y=\"325\">d₂ · 0<\/text><path d=\"M480 220 H585\" fill=\"none\" marker-end=\"url(#a1015-3)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"532\" y=\"204\">D · 3<\/text><path d=\"M330 80 H755 V200\" fill=\"none\" marker-end=\"url(#a1015-3)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"545\" y=\"65\">E · 5<\/text><path d=\"M625 220 H735\" fill=\"none\" marker-end=\"url(#a1015-3)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"680\" y=\"204\">F · 4<\/text><path d=\"M330 360 H755 V240\" fill=\"none\" marker-end=\"url(#a1015-3)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"545\" y=\"386\">G · 2<\/text><path d=\"M775 220 H870\" fill=\"none\" marker-end=\"url(#a1015-3)\" stroke=\"#2c5d80\" stroke-width=\"2\"><\/path><text fill=\"#2c5d80\" font-size=\"16\" text-anchor=\"middle\" x=\"825\" y=\"204\">H · 5<\/text><circle cx=\"35\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"35\" y=\"226\">1<\/text><circle cx=\"170\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"170\" y=\"226\">2<\/text><circle cx=\"310\" cy=\"80\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"310\" y=\"86\">3<\/text><circle cx=\"310\" cy=\"360\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"310\" y=\"366\">4<\/text><circle cx=\"460\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"460\" y=\"226\">5<\/text><circle cx=\"605\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"605\" y=\"226\">6<\/text><circle cx=\"755\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"755\" y=\"226\">7<\/text><circle cx=\"890\" cy=\"220\" fill=\"#fff\" r=\"20\" stroke=\"#315f7d\" stroke-width=\"1.8\"><\/circle><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"890\" y=\"226\">8<\/text><\/svg><\/div><figcaption>事件 5：B、C 均已完成；事件 7：E、F、G 均已完成。活动旁的数字是天数，圆圈内是事件编号。<\/figcaption><\/figure><\/div><p><strong>H 前不需要另加虚线。<\/strong>E、F、G 已经各有一条实线，可以直接汇合；三个前提都满足后，H 才开始。这个画法共用两条虚活动，分别为 D 补上 B、C 的完成条件。<\/p><\/section><\/div><p class=\"bridge\">图画完后，用活动表逐项检查“直接等待谁”。检查的是依赖关系，不只是图形是否整齐，或最终工期是否碰巧相同。<\/p><section class=\"concept\"><h2>用活动表核对完整图<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">活动<\/th><th scope=\"col\">从图中读出的直接前提<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>无<\/td><\/tr><tr><td>B、C<\/td><td>分别只等 A<\/td><\/tr><tr><td>D<\/td><td>通过 d₁、d₂ 同时等 B、C<\/td><\/tr><tr><td>E<\/td><td>只等 B<\/td><\/tr><tr><td>F<\/td><td>只等 D<\/td><\/tr><tr><td>G<\/td><td>只等 C<\/td><\/tr><tr><td>H<\/td><td>等 E、F、G<\/td><\/tr><\/tbody><\/table><\/div><p>若删掉 d₁，D 就不再等待 B；若删掉 d₂，D 就不再等待 C。因此本画法中的两条虚线都承担了必要的关系。<strong>虚活动条数随画法而变化，判断依据始终是活动表。<\/strong><\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">D must wait for both B and C, while E depends only on B and G depends only on C. Two dummy activities connect the separate completion events of B and C to a new merge event before D. E, F and G merge directly before H.<\/p><\/div><details><summary>原 10.15 配图为何需要修正？<\/summary><p>原配图把 B 的终点接到 C 的终点，再让 D、G 都从那里出发。这样 D 等 B、C 是对的，<strong>G 却也额外等待了 B<\/strong>，与表中“G 只等 C”不一致。<\/p><p>原工期下，B 第 8 天完成，C 第 10 天完成，这处多加的等待没有改变 G 的开始时间。若仅把 B 工期从 5 天改为 9 天，B 将到第 12 天才完成。按活动表，G 仍可在 C 完成后的第 10 天开始；错误画法却让 G 等到第 12 天。<\/p><\/details><\/section>"},{"key":"L6/risk-process","title":"风险管理的四个阶段","html":"<p class=\"page-label\">L6 · Risk Management<\/p><h1>风险管理的四个阶段<\/h1><p class=\"intro\">设备如果迟交，系统上线就可能受影响。管理风险，是在事情发生前识别这种可能，决定如何处理，并持续跟踪。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 选择题概念<\/p><p><strong>四阶段：识别 → 分析概率与后果 → 选择应对 → 控制与记录。<\/strong>Risk Identification 风险识别是第一步；根据题中实际动作辨认阶段。<\/p><\/div><section class=\"concept\"><h2>风险与管理的四阶段<\/h2><p class=\"term\" lang=\"en\">Risk / Risk management<\/p><p class=\"definition\">项目风险来自不确定性，可能影响项目目标。本章分析发生可能性和后果，并据此管理项目面临的风险。<\/p><p>设备还没有迟交，但供应商存在交货不及时的可能，这就是要提前管理的风险。团队需要先发现它，再估计可能性和后果，决定怎样应对，之后持续查看实际情况。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">阶段<\/th><th scope=\"col\">具体工作<\/th><\/tr><\/thead><tbody><tr><td>Risk identification 风险识别<\/td><td>找出可能影响目标的事件或条件<\/td><\/tr><tr><td>Analysis of probability and consequences 可能性和后果分析<\/td><td>估计多可能发生，发生后影响多大<\/td><\/tr><tr><td>Risk mitigation strategies 风险缓解策略<\/td><td>决定接受、降低、分担或转移等办法<\/td><\/tr><tr><td>Control and documentation 控制与记录<\/td><td>跟踪变化、执行措施并记录结果<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>团队先列出“设备可能迟交”，再分析会耽误多久，安排备用供货，并持续记录供货情况。四步分别对应四个阶段。<\/p><\/div><p><strong>题目说“召集团队头脑风暴、列出潜在问题”时，当前正在做 Risk Identification 风险识别。<\/strong>还没有比较发生概率或选择措施，不能跳到第二、第三阶段。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Risk management involves identifying risks, analyzing their probability and consequences, selecting mitigation strategies, and controlling and documenting them.<\/p><\/div><\/section>"},{"key":"L6/rbs","title":"风险来源与 RBS","html":"<p class=\"page-label\">L6 · Risk Breakdown Structure<\/p><h1>风险来源与 RBS<\/h1><p class=\"intro\">识别风险时，既要想到技术问题，也要想到资金、人员和合同等方面。RBS 按来源逐层分类，帮助团队检查有没有遗漏。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 风险分类<\/p><p><strong>Risk Breakdown Structure 风险分解结构<\/strong>按风险来源分层。能从较宽类别分到具体风险，并区分 RBS 与 WBS。<\/p><\/div><section class=\"concept\"><h2>风险分类与风险分解结构<\/h2><p class=\"term\" lang=\"en\">Risk Breakdown Structure (RBS)<\/p><p class=\"definition\">RBS 按风险来源逐层分类，帮助团队发现遗漏。高层表示较宽的来源类别，下层列出具体风险。<\/p><p>团队只靠随口列举，可能想到“程序会出错”，却漏掉资金、人员或合同方面的问题。RBS 先按来源划分类别，再往下找具体风险，帮助团队逐类检查。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">类别<\/th><th scope=\"col\">风险例子<\/th><\/tr><\/thead><tbody><tr><td>Financial 财务<\/td><td>资金不足，付款安排受影响<\/td><\/tr><tr><td>Technical 技术<\/td><td>接口不兼容，技术方案不能达到要求<\/td><\/tr><tr><td>Commercial 商业<\/td><td>需求不足，竞争影响预期收益<\/td><\/tr><tr><td>Execution 执行<\/td><td>人员缺勤、辞职、被调走；技能不足；培训效果差<\/td><\/tr><tr><td>Contractual or legal 合同或法律<\/td><td>条款争议，合规要求变化<\/td><\/tr><\/tbody><\/table><\/div><p>规格不清、变更增加、改进工作比预计更久，也可能形成风险。团队可以用 Brainstorming 头脑风暴、Expert opinion 专家意见、Past history 历史资料及 Multiple / Team-based Assessments 团队共同评估来识别风险。<\/p><h3>风险来源的层级<\/h3><div class=\"tree\">项目风险<br/>├─ Financial 财务<br/>│　└─ 资金可能无法按期到位<br/>├─ Technical 技术<br/>│　└─ 新旧系统接口可能不兼容<br/>├─ Commercial 商业<br/>│　└─ 竞争可能影响预期需求<br/>├─ Execution 执行<br/>│　└─ 关键人员可能缺勤<br/>└─ Contractual / legal 合同或法律<br/>　　└─ 合同责任可能产生争议<\/div><p>先确定较宽的风险来源，再把具体风险放到相应分支。RBS 分解风险；WBS 分解需要完成的工作。<\/p><div class=\"example\"><span class=\"small-label\">例子<\/span><p>“完成系统接口”是需要安排的工作，放在 WBS 中；“新旧系统接口可能不兼容”是不确定的问题，放在 RBS 的 Technical 技术分支。两者都可以画成层级结构，分解的对象不同。<\/p><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">An RBS is a source-oriented, hierarchical grouping of project risks. It organizes risks from broad categories to more specific risks and helps identify the project’s overall risk exposure.<\/p><\/div><\/section>"},{"key":"L6/impact-matrix","title":"风险影响矩阵","html":"<p class=\"page-label\">L6 · Risk Impact Matrix<\/p><h1>风险影响矩阵<\/h1><p class=\"intro\">列出风险以后，还要比较哪项更需要关注。有些问题经常出现但影响很小，有些很少发生却后果严重，因此要同时看可能性和后果。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 理解与使用矩阵<\/p><p><strong>Probability 发生可能性与 Consequence 后果分别定位。<\/strong>定性矩阵按图中分区判断，不能直接套用后面的 RF 数值阈值。<\/p><\/div><section class=\"concept\"><h2>风险影响矩阵<\/h2><p class=\"term\" lang=\"en\">Risk impact matrix<\/p><p class=\"definition\">纵轴 Likelihood 表示发生可能性，上方高、下方低；横轴 Consequences 表示后果，左方低、右方高。位置需要同时由两项条件确定。<\/p><p>供应商迟交和一次大规模系统故障，可能性与后果不一定相同。团队先分别给每项风险判断 Low 低、Medium 中或 High 高，再把它放进对应交叉格。下面用 A、B、C、D 代表四项已经评估的风险。<\/p><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">风险<\/th><th scope=\"col\">已知可能性<\/th><th scope=\"col\">已知后果<\/th><th scope=\"col\">怎样放入矩阵<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>Low 低<\/td><td>High 高<\/td><td>最下面一行，最右边一列。<\/td><\/tr><tr><td>B<\/td><td>Medium 中<\/td><td>High 高<\/td><td>中间一行，最右边一列。<\/td><\/tr><tr><td>C<\/td><td>Low 低<\/td><td>Medium 中<\/td><td>最下面一行，中间一列。<\/td><\/tr><tr><td>D<\/td><td>High 高<\/td><td>High 高<\/td><td>最上面一行，最右边一列。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">Likelihood 可能性 ↓ / Consequences 后果 →<\/th><th scope=\"col\">Low 低<\/th><th scope=\"col\">Medium 中<\/th><th scope=\"col\">High 高<\/th><\/tr><\/thead><tbody><tr><td>High 高<\/td><td>—<\/td><td>—<\/td><td>D<\/td><\/tr><tr><td>Medium 中<\/td><td>—<\/td><td>—<\/td><td>B<\/td><\/tr><tr><td>Low 低<\/td><td>—<\/td><td>C<\/td><td>A<\/td><\/tr><\/tbody><\/table><\/div><p>A：低可能性、高后果。B：中可能性、高后果。C：低可能性、中后果。D：高可能性、高后果。相同后果下，发生可能性越高越需要关注；相同可能性下，后果越严重越需要关注。<\/p><div class=\"note\">矩阵档位与下一专题的 RF 数值评分是两种表示方法。没有给出转换规则时，不能从格子颜色推算具体 RF。<\/div><p>构建时先画好两轴与档位，再逐项定位。D 两方面都高，需要优先关注。A 与 C 的可能性相同，A 的后果更严重；若 A 的发生可能性升到中档，就应移到 B 所在的格子。<strong>字母只是风险编号，位置才表示本次评估结果。<\/strong><\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A risk impact matrix positions risks by likelihood and consequences. It helps compare risks and direct attention to those with greater likelihood or more serious consequences.<\/p><\/div><\/section>"},{"key":"L6/risk-score","title":"Pf、Cf、RF 与风险等级","html":"<p class=\"page-label\">L6 · Probability / Consequences / Risk Factor<\/p><h1>Pf、Cf、RF 与风险等级<\/h1><p class=\"intro\">矩阵用高、中、低表示评估结果。计算题则给出两组指标分数，要求算出风险因子并判断等级。两种方法都属于“分析可能性与后果”，这里按题给评分表计算。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · Q3 风险计算，10 分<\/p><p><strong>分别求 P<sub>f<\/sub>、C<sub>f<\/sub>，再算 RF=P<sub>f<\/sub>+C<sub>f<\/sub>−P<sub>f<\/sub>C<sub>f<\/sub>。<\/strong>有几项指标就除以几；High Risk 高风险要求 RF&gt;0.70。<\/p><\/div><section class=\"concept\"><h2>风险评分公式<\/h2><p class=\"term\" lang=\"en\">Probability factor / Consequence factor / Risk factor<\/p><p class=\"definition\">Pf 是概率指标的平均分，Cf 是后果指标的平均分。RF 是本题规定的综合风险评分，没有货币单位。<\/p><p>这里把项目的多个风险指标汇总成一个分数。题目可能先给成熟度、复杂度、依赖程度等评分，再给成本、进度等后果评分。两组先各自求平均，不能把所有数混在一起平均。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">符号与英文<\/th><th scope=\"col\">中文含义<\/th><th scope=\"col\">怎么取得<\/th><\/tr><\/thead><tbody><tr><td>P<sub>f<\/sub> · Probability of Failure<\/td><td>失败概率评分<\/td><td>本题给出的概率指标求平均。<\/td><\/tr><tr><td>C<sub>f<\/sub> · Consequences of Failure<\/td><td>失败后果评分<\/td><td>本题给出的后果指标求平均。<\/td><\/tr><tr><td>RF · Risk Factor<\/td><td>风险因子<\/td><td>把两组平均值代入指定公式。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"formula\">Pf = 概率指标之和 / 概率指标个数<br/>Cf = 后果指标之和 / 后果指标个数<br/>RF = Pf + Cf − Pf × Cf<\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">RF<\/th><th scope=\"col\">等级<\/th><\/tr><\/thead><tbody><tr><td>RF &lt; 0.30<\/td><td>Low risk 低风险<\/td><\/tr><tr><td>0.30 ≤ RF ≤ 0.70<\/td><td>Medium risk 中风险<\/td><\/tr><tr><td>RF &gt; 0.70<\/td><td>High risk 高风险<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\">0.30 和 0.70 都属于中风险。RF 是评分结果，不能直接称为事件发生概率或金额。一般风险分析会同时考虑可能性和后果，但本题计算用上面的 RF 公式。<\/div><p><strong>为什么有时除以 3，有时除以 5？<\/strong>因为求的是“本题所列指标的平均值”。题目增加了指标，分母就要跟着改变。先数概率栏有几个有效数，再数后果栏有几个；空白占位不是一项评分。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">First calculate Pf and Cf as the averages of the given probability and consequence indicators. Then calculate RF = Pf + Cf − Pf × Cf. RF below 0.30 is low risk, RF from 0.30 to 0.70 inclusive is medium risk, and RF above 0.70 is high risk.<\/p><\/div><\/section>"},{"key":"L6/worked-risk","title":"两道完整风险计算例题","html":"<p class=\"page-label\">L6 · 计算、边界与英文结论<\/p><h1>两道完整风险计算例题<\/h1><p class=\"intro\">下面把评分公式用在两张具体表里。先数每组指标，分别求平均，再代入 RF 公式并判断等级。第二题会改变指标数量，不能照抄第一题的分母。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 两种指标数量的完整计算<\/p><p><strong>三项概率指标除以 3，五项就除以 5。<\/strong>例一 RF=0.70 属中风险；例二 RF=0.816 属高风险。写出计算过程与英文等级结论。<\/p><\/div><section class=\"concept\"><h2>例一：三项概率指标、四项后果指标<\/h2><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">Probability of failure 失败概率指标<\/th><th scope=\"col\">评分<\/th><th scope=\"col\">Consequences of failure 失败后果指标<\/th><th scope=\"col\">评分<\/th><\/tr><\/thead><tbody><tr><td>Maturity 成熟度<\/td><td>0.1<\/td><td>Cost 成本<\/td><td>0.7<\/td><\/tr><tr><td>Complexity 复杂度<\/td><td>0.5<\/td><td>Schedule 进度<\/td><td>0.5<\/td><\/tr><tr><td>Dependency 依赖程度<\/td><td>0.9<\/td><td>Reliability 可靠性<\/td><td>0.3<\/td><\/tr><tr><td>—<\/td><td>—<\/td><td>Performance 性能<\/td><td>0.1<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">步骤<\/th><th scope=\"col\">计算<\/th><\/tr><\/thead><tbody><tr><td>概率因子<\/td><td>P<sub>f<\/sub>=(0.1+0.5+0.9)/3=0.50<\/td><\/tr><tr><td>后果因子<\/td><td>C<sub>f<\/sub>=(0.7+0.5+0.3+0.1)/4=0.40<\/td><\/tr><tr><td>风险因子<\/td><td>RF=0.50+0.40−0.50×0.40=0.70<\/td><\/tr><tr><td>等级<\/td><td>0.70 位于中风险上边界，属于 Medium risk。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Pf = 0.50 and Cf = 0.40. RF = 0.50 + 0.40 − (0.50 × 0.40) = 0.70. The project is classified as medium risk because 0.70 is included in the medium-risk range.<\/p><\/div><\/section><section class=\"concept\"><h2>例二：概率指标增加到五项<\/h2><p>第二题除了成熟度、复杂度、依赖程度，还给了客户顾虑和程序员技能，所以概率组有五项。概率平均值要除以 5；后果组仍有四项，继续除以 4。各项分数也改了，按本题表格重新读取。<\/p><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">Probability of failure 失败概率指标<\/th><th scope=\"col\">评分<\/th><th scope=\"col\">Consequences of failure 失败后果指标<\/th><th scope=\"col\">评分<\/th><\/tr><\/thead><tbody><tr><td>Maturity 成熟度<\/td><td>0.7<\/td><td>Cost 成本<\/td><td>0.9<\/td><\/tr><tr><td>Complexity 复杂度<\/td><td>0.7<\/td><td>Schedule 进度<\/td><td>0.7<\/td><\/tr><tr><td>Dependency 依赖程度<\/td><td>0.5<\/td><td>Performance 性能<\/td><td>0.3<\/td><\/tr><tr><td>Client concerns 客户顾虑<\/td><td>0.5<\/td><td>Future business 后续业务<\/td><td>0.5<\/td><\/tr><tr><td>Programmer skill 程序员技能<\/td><td>0.3<\/td><td>—<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">步骤<\/th><th scope=\"col\">计算<\/th><\/tr><\/thead><tbody><tr><td>概率因子<\/td><td>P<sub>f<\/sub>=(0.7+0.7+0.5+0.5+0.3)/5=2.7/5=0.54<\/td><\/tr><tr><td>后果因子<\/td><td>C<sub>f<\/sub>=(0.9+0.7+0.3+0.5)/4=2.4/4=0.60<\/td><\/tr><tr><td>乘积<\/td><td>P<sub>f<\/sub>×C<sub>f<\/sub>=0.54×0.60=0.324<\/td><\/tr><tr><td>风险因子<\/td><td>RF=0.54+0.60−0.324=0.816<\/td><\/tr><tr><td>等级<\/td><td>0.816&gt;0.70，属于 High risk。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Pf = 0.54 and Cf = 0.60. Therefore, RF = 0.54 + 0.60 − (0.54 × 0.60) = 0.816. Since RF is greater than 0.70, the project is classified as high risk.<\/p><\/div><div class=\"note\">RF=0.816 是这套规则下的风险评分，不能直接解释为“项目失败概率是 81.6%”。先使用未舍入的数值判断等级，再按要求书写结果。<\/div><\/section>"},{"key":"L6/responses","title":"风险应对与情景判断","html":"<p class=\"page-label\">L6 · Risk Responses<\/p><h1>风险应对与情景判断<\/h1><p class=\"intro\">评估之后，团队要决定采取什么措施。知道风险等级还不足以判断应对类型，要继续看团队是选择承担、降低、共同分担，还是转移约定后果。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 老师提醒掌握的三道练习<\/p><p><strong>头脑风暴找风险 → Identification；接受不确定性继续计划 → Accept；与另一家公司共同承担 → Share。<\/strong>要看清理由，不能只记选项字母。<\/p><\/div><section class=\"concept\"><h2>风险应对<\/h2><p class=\"term\" lang=\"en\">Accept / Minimize / Share / Transfer<\/p><p class=\"definition\">根据风险和成本选择行动。接受风险可以是经过评估后的决定，并不自动等于疏忽。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">应对<\/th><th scope=\"col\">含义<\/th><th scope=\"col\">例子<\/th><\/tr><\/thead><tbody><tr><td>Accept 接受<\/td><td>评估后决定承担风险<\/td><td>对影响很小的风险不另花费用处理，并保留关注<\/td><\/tr><tr><td>Minimize 降低<\/td><td>降低发生可能性或后果<\/td><td>先试点、增加测试、培训备用人员<\/td><\/tr><tr><td>Share 分担<\/td><td>合作各方共同承担相关风险<\/td><td>联合投资或协议分担开发风险<\/td><\/tr><tr><td>Transfer 转移<\/td><td>把约定的财务或履约风险转给另一方<\/td><td>购买保险；用合同规定某方承担约定损失<\/td><\/tr><\/tbody><\/table><\/div><p>下面这些做法与风险应对相连：买保险，是把约定的财务后果转给另一方；指导与交叉培训，则帮助降低人员能力不足或缺勤造成的风险。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">相关术语<\/th><th scope=\"col\">在项目中怎样理解<\/th><\/tr><\/thead><tbody><tr><td>Insurance 保险<\/td><td>例如设备受损后由保险方按约定承担损失，属于 Transfer 转移。<\/td><\/tr><tr><td>Mentoring 指导 / Cross Training 交叉培训<\/td><td>指导新成员，或让同事学会彼此的岗位；某人缺勤时仍有人能接手，帮助 Minimize 降低风险。<\/td><\/tr><tr><td>Contingency Reserves 应急储备<\/td><td>事先为风险发生后的费用或时间需要留出余量，例如备用运输费用。<\/td><\/tr><tr><td>Workaround 临时应对<\/td><td>意外问题已经发生，团队临时采取办法继续工作，例如用备用电脑暂时替代故障设备。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>多家公司联合承担项目的财务风险属于 Share。客户通过固定总价合同将约定范围内的超支风险交给承包商，属于 Transfer；要写清风险从谁转给谁。<\/p><\/div><h3>三个情景怎样判断<\/h3><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">题目情景<\/th><th scope=\"col\">对应答案<\/th><th scope=\"col\">判断依据<\/th><\/tr><\/thead><tbody><tr><td>项目经理召集团队头脑风暴，列出未来项目可能出现的问题。<\/td><td>Risk identification 风险识别<\/td><td>当前工作是在找风险，尚未评估概率、后果或执行应对。<\/td><\/tr><tr><td>劳资协议尚未谈妥，经理预计会达成协议，决定继续编排资源计划。<\/td><td>Accept 接受<\/td><td>经理知道协议仍不确定，选择在这一风险下继续工作。<\/td><\/tr><tr><td>一家规模较小的企业面临新技术挑战且经验有限，于是与另一家公司合作开发，共同承担风险。<\/td><td>Share 分担<\/td><td>合作方共同投入并承担风险；没有把全部风险单独交给另一方。<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Accept 接受<\/strong>表示知道不确定性后决定承担，不等于没发现风险。<strong>Share 分担<\/strong>看共同承担；<strong>Transfer 转移<\/strong>看约定后果由另一方承担。题目仅说“找别人合作”，还要看合作是否真的涉及共同承担风险。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Risk acceptance is a deliberate decision to bear a risk. Minimization reduces its likelihood or consequences. Sharing distributes risk among collaborating parties. Transfer shifts specified risk consequences to another party, for example through insurance or contractual terms.<\/p><\/div><\/section>"}],"questions":[{"id":"base-q1","topic":"L1/project","type":"mc","stem":"团队把医院记录迁移到新系统，每天重复检查数据，验收后结束任务。整体工作属于什么？","en":"A team migrates hospital records to a new system. It repeats data checks daily and disbands after acceptance. How should the overall work be classified?","options":[{"en":"A project, because it creates a specific result within a temporary effort.","zh":"项目，因为它以临时性工作完成特定成果。","why":"整体目标是完成迁移，验收后结束。重复检查只是项目内部的步骤。"},{"en":"Operations, because some checks are repeated every day.","zh":"运营，因为每天重复进行检查。","why":"重复步骤不等于整体业务持续运营，题目明确有迁移成果和结束条件。"},{"en":"Operations, because the records remain in use after the team leaves.","zh":"运营，因为团队离开后记录仍继续使用。","why":"成果的使用寿命不决定创建成果的工作是否临时。"},{"en":"A project only if every daily check is different.","zh":"只有每天检查都不相同时，才是项目。","why":"项目可以包含重复活动；独特性描述的是项目目标或成果。"}],"answer":[0],"concept":"project"},{"id":"base-q2","topic":"L1/project","type":"mc","stem":"下列哪项工作作为持续服务开展时，属于日常运营？","en":"Which activity is an operation when performed as a continuing service?","options":[{"en":"Developing a new appointment system for a hospital.","zh":"为医院开发一套新预约系统。","why":"这项工作以交付独特系统为目标，有明确的项目结束条件。"},{"en":"Moving the reception desk to a new building.","zh":"把服务台搬到新楼。","why":"这是有特定目标和结束条件的搬迁任务。"},{"en":"Designing a new patient registration procedure.","zh":"设计一套新的患者登记流程。","why":"设计新流程是创造特定成果，区别于日常执行登记流程。"},{"en":"Processing patients’ appointment requests each day.","zh":"每天处理患者预约请求。","why":"工作随业务持续、反复提供同类服务，符合运营。"}],"answer":[3],"concept":"project"},{"id":"base-q3","topic":"L1/project","type":"mc","stem":"医院大楼计划使用 40 年。关于建楼项目，哪项说法正确？","en":"A hospital building will be used for 40 years. Which statement about its construction project is correct?","options":[{"en":"The construction is an operation because the building is permanent.","zh":"大楼长期存在，因此建设属于运营。","why":"需要判断建设工作的目标与结束条件。"},{"en":"A temporary project can produce only a short-lived result.","zh":"临时项目只能产生短期成果。","why":"临时性不限制成果的使用寿命。"},{"en":"The project can end while its result continues to be used.","zh":"项目可以结束，成果仍继续使用。","why":"临时性说的是项目工作有起止，成果可以长期存在。"},{"en":"The project must continue for the entire 40 years.","zh":"项目必须持续整整 40 年。","why":"把成果寿命当成了项目工期。"}],"answer":[2],"concept":"project"},{"id":"base-q4","topic":"L1/value","type":"mc","stem":"哪项准确解释 Intangible values 无形价值？","en":"Which statement correctly explains intangible values?","options":[{"en":"They are any benefits that the project has not yet delivered.","zh":"它们是项目尚未交付的所有收益。","why":"是否已经实现与是否无形是不同判断。"},{"en":"They are non-physical benefits, such as reputation, and may have economic effects.","zh":"它们是声誉等非实物收益，也可能产生经济影响。","why":"无形描述收益的形式，并不表示没有价值或经济影响。"},{"en":"They are benefits that have no economic value.","zh":"它们是没有经济价值的收益。","why":"声誉和品牌认知也可能影响组织的经济结果。"},{"en":"They are physical assets whose purchase price is unknown.","zh":"它们是尚未确定价格的实物资产。","why":"价格是否已知不决定有形与无形。"}],"answer":[1],"concept":"value"},{"id":"base-q5","topic":"L1/value","type":"mc","stem":"哪一组都属于本课列出的无形要素？","en":"Which pair belongs to the intangible elements listed in this course?","options":[{"en":"Brand recognition and public benefit.","zh":"品牌认知与公共利益。","why":"两项均列在 Intangible elements 中。"},{"en":"Market share and brand recognition.","zh":"市场份额与品牌认知。","why":"本课将 Market share 列为有形要素，Brand recognition 列为无形要素。"},{"en":"Tools and reputation.","zh":"工具与声誉。","why":"Tools 属于有形要素；Reputation 属于无形要素。"},{"en":"Monetary assets and goodwill.","zh":"货币资产与商誉。","why":"Monetary assets 属于有形要素；Goodwill 属于无形要素。"}],"answer":[0],"concept":"value"},{"id":"base-q6","topic":"L1/value","type":"mc","stem":"预约项目减少等待，并改善医院声誉。商业价值可以由谁获得？","en":"An appointment project reduces waiting time and improves the hospital’s reputation. Who can receive business value?","options":[{"en":"Only the organization, and only through additional sales revenue.","zh":"只有组织可以获得，而且只能是新增销售收入。","why":"价值不限于销售收入，也不限于单一组织。"},{"en":"Only the people who perform the project work.","zh":"只有执行项目工作的人。","why":"受益者还可以包括患者、客户、组织及其他干系人。"},{"en":"Only stakeholders who receive physical equipment.","zh":"只有收到实物设备的干系人。","why":"无形收益也属于商业价值。"},{"en":"Stakeholders, through benefits created by the project’s results.","zh":"干系人，通过项目成果产生的收益获得价值。","why":"商业价值是成果带来的收益，可以包括患者受益与组织声誉。"}],"answer":[3],"concept":"value"},{"id":"base-q7","topic":"L1/constraints","type":"mc","stem":"客户要求增加功能，同时保持截止日期。项目经理首先应该怎样处理？","en":"The client requests an extra function without changing the deadline. What should the project manager do first?","options":[{"en":"Accept it because the deadline is unchanged, so the plan is unchanged.","zh":"既然截止日期不变，就接受，因为计划没有改变。","why":"范围和工作量已经变化，计划仍需要评估。"},{"en":"Treat the request only as a quality issue.","zh":"只把这项请求当成质量问题。","why":"增加功能首先涉及范围，也可能影响其他约束。"},{"en":"Assess the effects on scope, time, cost and quality before agreeing to a revised plan.","zh":"先评估范围、时间、成本和质量影响，再确认调整方案。","why":"新增功能改变范围，需要评估相互影响，不能直接承诺或预设结果。"},{"en":"Assume that both time and cost must increase by the same percentage.","zh":"认为时间和成本必须按相同比例增加。","why":"约束相互影响，但没有相同比例变化的规则。"}],"answer":[2],"concept":"constraint"},{"id":"base-q8","topic":"L1/process-life","type":"mc","stem":"哪个过程组负责获得开始项目或阶段的授权？","en":"Which process group obtains authorization to start a project or phase?","options":[{"en":"Closing.","zh":"收尾。","why":"Closing 正式结束项目、阶段或合同。"},{"en":"Initiating.","zh":"启动。","why":"Initiating 定义新项目或阶段，并取得开始授权。"},{"en":"Planning.","zh":"规划。","why":"Planning 细化范围、目标与行动安排。"},{"en":"Executing.","zh":"执行。","why":"Executing 完成管理计划规定的工作。"}],"answer":[1],"concept":"groups"},{"id":"base-q9","topic":"L1/process-life","type":"mc","stem":"安装期间，经理比较实际进度与基准，并启动纠偏。这属于哪个过程组？","en":"During installation, a manager compares actual progress with the baseline and initiates corrective action. Which process group is this?","options":[{"en":"Monitoring and Controlling.","zh":"监控。","why":"核心行为是跟踪、比较和调整绩效。"},{"en":"Executing.","zh":"执行。","why":"实际开展安装属于执行；题目问的是比较与纠偏。"},{"en":"Initiating.","zh":"启动。","why":"没有发生项目或阶段开始授权。"},{"en":"Closing.","zh":"收尾。","why":"项目还在安装，没有办理正式结束。"}],"answer":[0],"concept":"groups"},{"id":"base-q10","topic":"L1/process-life","type":"mc","stem":"项目生命周期图中，相邻阶段的曲线交叠表示什么？","en":"What do overlapping curves in the project life-cycle diagram indicate?","options":[{"en":"All phases require the same amount of effort.","zh":"各阶段需要相同投入。","why":"曲线高度不同，执行阶段投入最高。"},{"en":"Closing must finish before execution starts
