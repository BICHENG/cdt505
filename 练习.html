.","zh":"收尾必须在执行开始之前完成。","why":"这与图中的项目发展方向相反。"},{"en":"Process groups and life-cycle phases are identical.","zh":"过程组与生命周期阶段相同。","why":"两者分类依据不同，曲线并没有表达这种等同。"},{"en":"Work associated with adjacent phases can overlap in time.","zh":"相邻阶段的工作在时间上可以重叠。","why":"图的横轴是时间，交叠表示部分工作同期开展。"}],"answer":[3],"concept":"life"},{"id":"base-q11","topic":"L1/process-life","type":"mc","stem":"哪项符合本课生命周期投入图？","en":"Which reading matches the course’s life-cycle effort graph?","options":[{"en":"Time is horizontal; effort is vertical; defining has the highest effort.","zh":"横轴时间，纵轴投入，定义阶段投入最高。","why":"坐标正确，最高投入阶段错误。"},{"en":"Time is horizontal; effort is vertical; lower effort means the phase is unnecessary.","zh":"横轴时间，纵轴投入；投入低的阶段可以省去。","why":"图表示投入程度，不表示阶段可以省略。"},{"en":"Time is horizontal; effort is vertical; execution has the highest effort.","zh":"横轴时间，纵轴投入，执行阶段投入最高。","why":"正确读出了坐标和最高投入阶段。"},{"en":"Cost is horizontal; time is vertical; closing has the highest effort.","zh":"横轴成本，纵轴时间，收尾投入最高。","why":"坐标和最高阶段都不符合该图。"}],"answer":[2],"concept":"life"},{"id":"base-q12","topic":"L1/methods","type":"mc","stem":"临床团队与开发人员对需求有分歧，哪项行动最符合项目经理职责？","en":"The clinical team and developer disagree on a requirement. Which action best reflects the project manager’s role?","options":[{"en":"Avoid customer contact until the final delivery.","zh":"等最终交付时才联系客户。","why":"项目经理是与客户直接联系的人，需要处理需求和期望。"},{"en":"Bring the relevant people together, clarify effects and coordinate a decision.","zh":"召集相关人员说明影响，协调决定。","why":"项目经理负责方向、协调与整合，并联系客户。"},{"en":"Personally complete all clinical and programming work.","zh":"亲自完成全部临床与编程工作。","why":"承担整体责任不等于代替所有专业人员。"},{"en":"Leave every cross-functional decision to individual team members.","zh":"把所有跨专业决定完全留给各成员独立处理。","why":"缺少对整体目标和相互影响的协调。"}],"answer":[1],"concept":"pm"},{"id":"base-q13","topic":"L1/methods","type":"mc","stem":"团队在第二次交付中增加取消预约功能，并根据患者反馈改进日期显示。哪项理解正确？","en":"A team adds cancellation in its second release and improves the date display after patient feedback. Which interpretation is correct?","options":[{"en":"Adding functionality is incremental; improving it through feedback is iterative.","zh":"增加功能是增量，依据反馈改进是迭代。","why":"这分别描述成果逐步增加和通过反馈反复完善。"},{"en":"Both actions are only final acceptance activities.","zh":"两项都只是最终验收活动。","why":"它们发生在开发和改进过程中，不是正式接受已完成成果。"},{"en":"Incremental means repeating work without adding useful results.","zh":"增量表示重复工作，不增加有用成果。","why":"增量恰恰是逐步增加可用部分。"},{"en":"Iterative means all requirements are permanently fixed before work starts.","zh":"迭代表示开始前永久锁定全部需求。","why":"迭代允许根据新信息和反馈调整。"}],"answer":[0],"concept":"agile"},{"id":"base-q14","topic":"L1/methods","type":"mc","stem":"哪种团队与迭代安排符合本课对敏捷的描述？","en":"Which team and iteration pattern matches the course description of Agile?","options":[{"en":"A team of twelve, with two-week iterations and no customer feedback.","zh":"12 人团队、每轮 2 周、不收集客户反馈。","why":"团队规模超出本课所给范围，也缺少客户合作。"},{"en":"A team of six, with eight-week iterations and a single final review.","zh":"6 人团队、每轮 8 周、只在最终回顾。","why":"周期不符合本课 1–4 周描述，也缺少逐轮回顾。"},{"en":"A team of six, with two-week meetings but no concrete progress in each cycle.","zh":"6 人团队、每两周开会，每轮没有具体进展。","why":"合适的数字不能替代每轮实际进展、回顾和调整。"},{"en":"A team of six, with two-week iterations and a review after each iteration.","zh":"6 人团队、每轮 2 周、每轮结束回顾。","why":"6 在 4–8 人范围，2 周在 1–4 周范围，且包含回顾。"}],"answer":[3],"concept":"agile"},{"id":"base-q15","topic":"L1/methods","type":"mc","stem":"滚动式推进中，获得新信息后应怎样安排后续工作？","en":"How should later work be planned in a rolling-wave approach as new information becomes available?","options":[{"en":"Keep every early assumption unchanged even when evidence contradicts it.","zh":"即使证据相反，也保持最初假设不变。","why":"这会阻止依据反馈调整。"},{"en":"Delay all customer feedback until every detail is fixed.","zh":"等所有细节确定后才收集客户反馈。","why":"客户合作本来就是逐步明确需求的重要方式。"},{"en":"Refine later details while reviewing progress and adjusting plans.","zh":"回顾进展、调整计划，并逐步细化后续工作。","why":"滚动式推进利用新信息细化工作，不表示没有计划。"},{"en":"Avoid planning because each iteration replaces project objectives.","zh":"不做计划，因为每次迭代都替换项目目标。","why":"迭代并不要求放弃项目目标和计划。"}],"answer":[2],"concept":"agile"},{"id":"base-q16","topic":"L1/methods","type":"mc","stem":"经理计算进度，又与护士协商安装时段。哪项解释完整？","en":"A manager calculates a schedule and negotiates installation hours with nurses. Which explanation is complete?","options":[{"en":"Both are sociocultural because a manager performs them.","zh":"两者都是社会文化方面，因为由经理执行。","why":"执行者身份不决定行动属于哪一方面。"},{"en":"Scheduling is technical; negotiation is sociocultural; both contribute to delivery.","zh":"进度计算属于技术方面，协商属于社会文化方面，两者共同影响交付。","why":"Socio-Technical 同时处理计划控制与人员合作。"},{"en":"Both are technical because they occur on a technical project.","zh":"两者都是技术方面，因为项目涉及技术。","why":"应按管理行动判断，不按项目行业判断。"},{"en":"Only scheduling is project management; negotiation is outside the role.","zh":"只有计算进度属于项目管理，协商不属于。","why":"社会文化方面也是项目管理的一部分。"}],"answer":[1],"concept":"sociotech"},{"id":"base-q17","topic":"L1/maturity","type":"mc","stem":"哪一组是 Triple bottom line 三重底线？","en":"Which set describes the triple bottom line?","options":[{"en":"Planet, people and profit.","zh":"环境、人与社会、利润。","why":"三重底线同时关注环境、社会和经济结果。"},{"en":"Scope, time and cost.","zh":"范围、时间、成本。","why":"这是三重约束。"},{"en":"Initiating, planning and closing.","zh":"启动、规划、收尾。","why":"这是部分过程组，不是三重底线。"},{"en":"Power, interest and cooperation.","zh":"权力、关注与合作。","why":"这些是干系人分析中的维度。"}],"answer":[0],"concept":"drivers"},{"id":"base-q18","topic":"L1/maturity","type":"mc","stem":"某研究机构使用统一方法，培训团队，并定期改进项目流程。应怎样判断其成熟度？","en":"A research organization uses shared methods, trains teams and regularly improves its project process. How should its maturity be assessed?","options":[{"en":"Classify it as low maturity because research has uncertainty.","zh":"只要研究有不确定性，就归为低成熟度。","why":"项目不确定性与组织管理成熟度不是同一概念。"},{"en":"Classify it solely by the number of people employed.","zh":"只按员工人数分类。","why":"人数本身不能说明方法、支持和改进情况。"},{"en":"Ignore training because maturity concerns only the project budget.","zh":"忽略培训，因为成熟度只看预算。","why":"培训、方法和持续改进都是相关表现。"},{"en":"Assess its established and improving practices, rather than assume research means low maturity.","zh":"依据已建立且持续改进的做法判断，不能因研究性质认定低成熟度。","why":"成熟度依据组织的管理实践，而非行业名称。"}],"answer":[3],"concept":"maturity"},{"id":"base-q19","topic":"L1/maturity","type":"mc","stem":"对项目管理实践进行 Benchmarking 对标，目的是什么？","en":"What is the purpose of benchmarking project management practices?","options":[{"en":"Replace all project objectives with the benchmark organization’s objectives.","zh":"用标杆组织的目标替换本项目目标。","why":"本项目仍须服务自身业务和干系人需要。"},{"en":"Measure only whether the organization uses the newest software.","zh":"只看是否使用最新软件。","why":"工具新旧不能代表管理方法是否稳定有效。"},{"en":"Compare practices, identify gaps and improve project delivery.","zh":"比较实践、发现差距、改进项目交付。","why":"对标支持持续改进，而非只给组织排名。"},{"en":"Copy another organization’s schedule without considering the project.","zh":"不考虑项目条件，直接复制别人的进度表。","why":"对标改进方法，不等于照搬不同项目的安排。"}],"answer":[2],"concept":"maturity"},{"id":"base-q20","topic":"L1/maturity","type":"mc","stem":"项目改用可回收包装。哪项结论有依据？","en":"A project changes to recyclable packaging. Which conclusion is justified?","options":[{"en":"Carbon neutrality means that no physical materials are used.","zh":"碳中和表示完全不使用实物材料。","why":"净碳排放与是否使用材料不是同一判断。"},{"en":"It is an environmental measure, but this alone does not establish carbon neutrality.","zh":"这是一项环保措施，仅凭此不能确认碳中和。","why":"碳中和要求净碳排放为零，一项措施不能证明整体结果。"},{"en":"The whole project must now have zero net carbon emissions.","zh":"整个项目必然已经实现净零碳排放。","why":"题目未提供整体排放和抵消情况。"},{"en":"Environmental decisions are unrelated to project management.","zh":"环保决策与项目管理无关。","why":"组织和项目的环境影响属于相关考虑。"}],"answer":[1],"concept":"environment"},{"id":"base-q21","topic":"L1/areas","type":"mc","stem":"拟议变更影响功能、人员、费用和交付。哪个领域主要协调这些整体影响？","en":"A proposed change affects features, staffing, cost and delivery. Which area primarily coordinates these effects as a whole?","options":[{"en":"Integration Management.","zh":"整合管理。","why":"Integration 统筹不同方面及变更，避免局部决定相互冲突。"},{"en":"Procurement Management.","zh":"采购管理。","why":"采购关注外部产品和服务的取得，范围较窄。"},{"en":"Communications Management.","zh":"沟通管理。","why":"沟通安排信息传递，不能代替整体协调变更。"},{"en":"Quality Management.","zh":"质量管理。","why":"质量关注满足质量要求，不独自承担所有计划的整合。"}],"answer":[0],"concept":"knowledge"},{"id":"base-q22","topic":"L2/sites","type":"mc","stem":"医院在已有楼宇中安装新服务设施，必须保留旧管线。属于哪类场地项目？","en":"A hospital installs a new service in an existing building and must retain its old utility lines. What site classification fits?","options":[{"en":"Greenfield, because the service itself is new.","zh":"Greenfield，因为服务本身是新的。","why":"场地分类看原有场地和设施，不看服务是否新。"},{"en":"Greenfield, because new work has not yet begun inside the old building.","zh":"Greenfield，因为旧楼里的新工作尚未开始。","why":"是否开始本次工作不改变已有设施的约束。"},{"en":"Brownfield only if contamination has already been proven.","zh":"只有已经证实污染，才是 Brownfield。","why":"既有场地扩建或改造就符合本例；污染可能存在，不是唯一条件。"},{"en":"Brownfield, because existing site conditions constrain the work.","zh":"Brownfield，因为既有场地条件约束工作。","why":"项目名称或功能是新的，不会消除既有设施的限制。"}],"answer":[3],"concept":"sites"},{"id":"base-q23","topic":"L2/sites","type":"mc","stem":"关于 Greenfield project，哪项正确？","en":"Which statement about a greenfield project is correct?","options":[{"en":"It must involve the renovation of an existing facility.","zh":"必须改造已有设施。","why":"这是 Brownfield 的场地特征。"},{"en":"It is defined by whether the product is new, regardless of the site.","zh":"只要产品全新，就按 Greenfield 分类，不考虑场地。","why":"场地分类依据既有开发和设施，不能单凭产品是否新。"},{"en":"It lacks constraints from prior site work but still faces other project constraints.","zh":"没有原有工程形成的场地约束，仍受其他项目条件约束。","why":"预算、法规、审批和技术限制仍可能存在。"},{"en":"It has no budget, legal or technical constraints.","zh":"不受预算、法规或技术约束。","why":"把“没有原有工程约束”扩大成没有任何约束。"}],"answer":[2],"concept":"sites"},{"id":"base-q24","topic":"L2/pmi-pmo","type":"mc","stem":"经理评估项目如何支持医院服务战略，最直接涉及人才三角的哪项技能？","en":"A manager evaluates how a project supports the hospital’s service strategy. Which Talent Triangle skill is most directly involved?","options":[{"en":"Formal authority.","zh":"正式职权。","why":"正式职权不是该三角列出的第三种技能名称。"},{"en":"Business Acumen.","zh":"商业敏锐度。","why":"它关注业务背景、战略与价值。"},{"en":"Ways of Working.","zh":"工作方式。","why":"这项主要关注选择和运用工作方法。"},{"en":"Power Skills.","zh":"人际与领导技能。","why":"这项主要关注沟通、领导与合作。"}],"answer":[1],"concept":"pmi"},{"id":"base-q26","topic":"L2/tows","type":"mc","stem":"医院缺少开发人员，外部资助可用于培训。利用资助补足这一能力属于哪种策略？","en":"The hospital lacks developers, while an external grant can fund training. Which strategy uses the grant to address that weakness?","options":[{"en":"SO: use an existing strength to exploit an opportunity.","zh":"SO：利用现有优势把握机会。","why":"题目强调的是开发能力不足，并非现有优势。"},{"en":"ST: use a strength to address a threat.","zh":"ST：利用优势应对威胁。","why":"资助是机会，开发能力不足是劣势，不符合 S 与 T。"},{"en":"WT: reduce a weakness and avoid a threat.","zh":"WT：减少劣势并避开威胁。","why":"外部条件在此是资助机会，而不是威胁。"},{"en":"WO: use an opportunity to reduce a weakness.","zh":"WO：利用机会弥补劣势。","why":"缺少开发人员是内部劣势，资助是外部机会。"}],"answer":[3],"concept":"tows"},{"id":"base-q27","topic":"L2/tows","type":"mc","stem":"医院有经验丰富的临床团队，同时面临其他服务商竞争。哪项构成具体的 ST 策略？","en":"Which answer is an actionable ST strategy when experienced clinicians face competition from another provider?","options":[{"en":"Write “be more competitive” without explaining an action.","zh":"只写“提高竞争力”，不说明行动。","why":"这是目标，没有说明怎样使用优势应对威胁。"},{"en":"Classify the competing provider as an internal weakness.","zh":"把竞争服务商列为内部劣势。","why":"竞争者属于外部环境，应作为 Threat 分析。"},{"en":"Use clinical experience to design appointment features that better address patients’ needs.","zh":"利用临床经验，设计更符合患者需要的预约功能。","why":"把内部优势与外部威胁联系起来，并提出具体行动。"},{"en":"List “experienced clinicians” in every box.","zh":"在四格中都写“临床团队经验丰富”。","why":"只重复条件，未形成行动，也未区分组合。"}],"answer":[2],"concept":"tows"},{"id":"base-q28","topic":"L2/stakeholders","type":"mc","stem":"附近居民团体反对施工噪声，应纳入干系人吗？","en":"A nearby residents’ group opposes construction noise. Should it be included as a stakeholder?","options":[{"en":"Yes, but only after it signs a procurement contract.","zh":"只有签采购合同后才纳入。","why":"合同关系不是识别干系人的必要条件。"},{"en":"Yes, because it is affected by the project and may influence it.","zh":"应纳入，因为它受到影响，也可能影响项目。","why":"干系人不限于支持项目或在项目中任职的人。"},{"en":"No, because stakeholders must support the project.","zh":"不纳入，因为干系人必须支持项目。","why":"反对者也可能有重要影响。"},{"en":"No, because only employees are stakeholders.","zh":"不纳入，因为只有员工属于干系人。","why":"外部群体同样可能符合定义。"}],"answer":[1],"concept":"stakeholder"},{"id":"base-q29","topic":"L2/stakeholders","type":"mc","stem":"资助人能批准预算，但只希望了解重大进展。哪项 Power/Interest 策略合适？","en":"A sponsor can approve the budget but wants only major updates. Which power/interest strategy fits?","options":[{"en":"Keep Satisfied.","zh":"保持满意。","why":"高权力、较低日常关注，提供重要信息并及时处理关键诉求。"},{"en":"Keep Informed.","zh":"及时告知。","why":"该格对应低权力、高关注，与预算审批权不符。"},{"en":"Monitor.","zh":"关注动态。","why":"该格对应低权力、低关注，不能忽略资助人的决策权。"},{"en":"Manage Closely in every minor operational decision.","zh":"让其参与每个细小操作决定。","why":"题目没有给出高关注，过密参与不符合这里的条件。"}],"answer":[0],"concept":"power"},{"id":"base-q30","topic":"L2/cooperation","type":"mc","stem":"供应商愿意合作，但停止交货会严重影响项目。应怎样分类并行动？","en":"A supplier is willing to cooperate but could seriously disrupt the project by stopping delivery. Which combination fits?","options":[{"en":"Supportive; Involve.","zh":"支持型；邀请参与。","why":"支持型是高合作、低威胁，漏掉了严重中断能力。"},{"en":"Marginal; Monitor.","zh":"边缘型；关注动态。","why":"边缘型两者都低，不符合条件。"},{"en":"Non-Supportive; Defend.","zh":"不支持型；防范威胁。","why":"该类合作潜力低，题目明确它愿意合作。"},{"en":"Mixed Blessing; Collaborate.","zh":"利弊并存型；深入合作。","why":"合作潜力和威胁潜力都高，需要共同计划和协调。"}],"answer":[3],"concept":"cooperation"},{"id":"base-q33","topic":"L2/structures","type":"mc","stem":"工程师在专业工作上向职能经理汇报，在项目任务上向项目经理汇报。体现什么结构？","en":"An engineer reports to a functional manager for professional work and to a project manager for project tasks. What structure is indicated?","options":[{"en":"Matrix.","zh":"矩阵型。","why":"同时存在职能与项目两方面的汇报关系。"},{"en":"Purely functional with no project reporting line.","zh":"只有职能汇报的纯职能型。","why":"忽略了题目中的项目汇报线。"},{"en":"A fully independent projectized team with no functional reporting.","zh":"没有职能汇报的独立项目型。","why":"题目保留了职能经理汇报关系。"},{"en":"A projectized structure, because any project reporting line makes it projectized.","zh":"项目型，因为只要存在项目汇报线就是项目型。","why":"矩阵也有项目汇报线，应同时考虑保留的职能管理。"}],"answer":[0],"concept":"structure"},{"id":"base-q34","topic":"L2/structures","type":"mc","stem":"资源冲突中，职能经理与项目经理共享决策权。最符合哪种矩阵？","en":"In a resource conflict, functional and project managers share decision authority. Which matrix description fits?","options":[{"en":"Weak matrix with all authority held by the functional manager.","zh":"职能经理掌握全部权力的弱矩阵。","why":"与共享权力的条件冲突。"},{"en":"Strong matrix with the project manager clearly dominant.","zh":"项目经理明显占主导的强矩阵。","why":"题目没有给出项目经理主导。"},{"en":"Projectized structure with no functional managers.","zh":"没有职能经理的项目型。","why":"题目明确存在职能经理。"},{"en":"Balanced matrix.","zh":"平衡矩阵。","why":"明确条件是双方共享权力。"}],"answer":[3],"concept":"structure"},{"id":"base-q35","topic":"L2/structures","type":"mc","stem":"哪项困难尤其与矩阵结构有关？","en":"Which difficulty is especially associated with a matrix structure?","options":[{"en":"Every project must duplicate all specialist resources.","zh":"每个项目都必须重复配置全部专家。","why":"共享专业资源正是矩阵的一项优势。"},{"en":"Employees never need to negotiate resource assignments.","zh":"员工从不需要协调资源分配。","why":"矩阵往往需要协商，这个说法也不是困难。"},{"en":"Conflicting priorities from project and functional managers.","zh":"项目经理与职能经理给出冲突的优先级。","why":"双重汇报和共享资源可能形成这种冲突。"},{"en":"An absolute absence of access to functional expertise.","zh":"完全无法获得职能专业支持。","why":"矩阵通常保留职能专业资源。"}],"answer":[2],"concept":"structure"},{"id":"base-q36","topic":"L2/pmi-pmo","type":"mc","stem":"PMO 提供模板与培训，但不强制项目采用其流程。属于哪种形式？","en":"A PMO provides templates and training but does not require projects to follow its process. What form is it?","options":[{"en":"Projectized.","zh":"项目型。","why":"这是组织结构名称，不是题目中的 PMO 控制形式。"},{"en":"Supportive.","zh":"支持型。","why":"咨询、资源与培训，控制程度低。"},{"en":"Controlling.","zh":"控制型。","why":"控制型要求遵守采用的标准或流程。"},{"en":"Directive.","zh":"指令型。","why":"指令型直接管理项目。"}],"answer":[1],"concept":"pmo"},{"id":"base-q37","topic":"L2/pmi-pmo","type":"mc","stem":"哪项行动体现 Directive PMO？","en":"Which action distinguishes a directive PMO?","options":[{"en":"Directly managing projects.","zh":"直接管理项目。","why":"这是指令型高控制程度的核心表现。"},{"en":"Only offering optional training materials.","zh":"只提供可选培训资料。","why":"更接近支持型。"},{"en":"Only requiring compliance with common standards.","zh":"只要求遵守共同标准。","why":"更接近控制型，尚未说明直接管理项目。"},{"en":"Monitoring project performance without directly managing execution.","zh":"跟踪项目表现，但不直接管理执行。","why":"仅跟踪表现没有体现指令型直接管理的权限。"}],"answer":[0],"concept":"pmo"},{"id":"base-q38","topic":"L2/culture","type":"mc","stem":"哪项证据最直接反映共享的组织文化规范？","en":"Which evidence most directly reveals a shared cultural norm?","options":[{"en":"","zh":"某位经理个人偏好先开会再处理邮件。","why":"这是个人习惯，题干没有说明成员共同遵循这一规范。"},{"en":"A policy calls for openness, but staff consistently avoid reporting problems.","zh":"制度提倡坦诚，但员工一直回避报告问题。","why":"纸面规定与实际行为不一致，不能据此认定坦诚已成为共享规范。"},{"en":"A consultant recommends a culture that has not been adopted.","zh":"顾问提出一种尚未被采用的文化建议。","why":"建议不等于组织已经共享的规范。"},{"en":"Staff routinely report mistakes early because the organization recognizes openness.","zh":"组织认可坦诚，员工普遍尽早报告错误。","why":"反复出现且受到共同认可的行为反映规范和价值观。"}],"answer":[3],"concept":"culture"},{"id":"base-q39","topic":"L2/culture","type":"mc","stem":"经理了解组织中表扬帮助他人的员工故事，采用的是哪种文化识别方法？","en":"A manager listens to stories about employees who are celebrated for helping others. Which cultural identification method is this?","options":[{"en":"Calculating the critical path.","zh":"计算关键路径。","why":"进度计算不是文化识别方法。"},{"en":"Counting risk indicators.","zh":"数风险指标。","why":"这是风险评分步骤。"},{"en":"Interpreting stories and folklore.","zh":"理解组织故事。","why":"故事中的被认可行为可以反映组织价值。"},{"en":"Studying only the physical office layout.","zh":"仅观察实体布局。","why":"这里的信息来源是故事，不是建筑或办公室布局。"}],"answer":[2],"concept":"culture-identify"},{"id":"base-q40","topic":"L2/culture","type":"mc","stem":"医院把奖金改为奖励团队成果，直接涉及哪项文化形成因素？","en":"A hospital changes its bonuses to reward team results. Which culture-development factor is directly involved?","options":[{"en":"Physical characteristics as an observation method.","zh":"作为观察方法的实体特征。","why":"混淆了文化形成因素与识别方法。"},{"en":"Reward systems.","zh":"奖励制度。","why":"奖励方式影响被鼓励和延续的行为。"},{"en":"Geographical location.","zh":"地理位置。","why":"题目没有改变地点或当地条件。"},{"en":"Technology.","zh":"技术。","why":"题目改变的是激励规则，不是技术工具。"}],"answer":[1],"concept":"culture-factors"},{"id":"base-q41","topic":"L2/culture","type":"mc","stem":"两队各放弃一半申请的培训时间，属于哪种冲突处理？","en":"Two teams each give up half of their requested training time. Which conflict approach does this illustrate?","options":[{"en":"Compromise.","zh":"妥协。","why":"双方各作让步，部分满足需要。"},{"en":"Collaboration.","zh":"合作。","why":"题目没有共同重设方案以满足双方主要需要，只有相互让步。"},{"en":"Accommodation.","zh":"迁就。","why":"迁就通常是一方让自己的需要让位于对方。"},{"en":"Avoidance.","zh":"回避。","why":"双方已经作出安排，没有搁置问题。"}],"answer":[0],"concept":"conflict"},{"id":"base-q42","topic":"L3/scope","type":"mc","stem":"哪项描述 Project scope，而非 Product scope？","en":"Which statement describes project scope rather than product scope?","options":[{"en":"The system allows patients to cancel appointments.","zh":"系统允许患者取消预约。","why":"描述产品功能。"},{"en":"The system displays available appointment times.","zh":"系统显示可预约时段。","why":"描述产品功能。"},{"en":"The system responds within two seconds under a specified load.","zh":"系统在指定负载下两秒内响应。","why":"描述产品性能属性。"},{"en":"Design, develop, test and train staff to deliver the appointment system.","zh":"为交付预约系统而设计、开发、测试并培训人员。","why":"描述为交付成果所需完成的工作。"}],"answer":[3],"concept":"scope"},{"id":"base-q43","topic":"L3/requirements","type":"mc","stem":"“上线前迁移旧预约记录”主要属于哪类需求？","en":"“Migrate old appointment records before launch” is primarily what requirement type?","options":[{"en":"Solution—functional.","zh":"解决方案中的功能需求。","why":"持续产品能力与一次性的切换准备不同。"},{"en":"Project requirements.","zh":"项目需求。","why":"项目需求约定执行条件；此题重点是新旧系统切换准备。"},{"en":"Transition and readiness.","zh":"过渡与就绪需求。","why":"它支持从旧状态切换到新服务并准备投入使用。"},{"en":"Business.","zh":"业务需求。","why":"业务需求解释组织为什么开展项目，例如减少等待。"}],"answer":[2],"concept":"requirements"},{"id":"base-q44","topic":"L3/statement","type":"mc","stem":"哪句话是 Constraint 约束，而非 Assumption 假设？","en":"Which sentence is a constraint rather than an assumption?","options":[{"en":"The manager expects no change to the existing booking rules.","zh":"经理预计现有预约规则不会变化。","why":"这是对未来条件的假定，不是规定的限制。"},{"en":"The approved budget must not exceed $100,000.","zh":"批准的预算不得超过 $100,000。","why":"明确的上限是必须遵守的限制。"},{"en":"The hospital is expected to provide test data as planned.","zh":"预计医院会按计划提供测试数据。","why":"这是计划时暂认为成立的条件。"},{"en":"The team assumes the supplier will remain available.","zh":"团队假设供应商会继续提供服务。","why":"“假设继续可用”属于假设。"}],"answer":[1],"concept":"scope-statement"},{"id":"base-q46","topic":"L3/wbs","type":"mc","stem":"哪个工具用分解法把项目范围组织成层级？","en":"Which tool uses decomposition to organize the project’s scope into a hierarchy?","options":[{"en":"AON network.","zh":"AON 网络图。","why":"AON 主要表示活动之间的依赖。"},{"en":"Gantt chart.","zh":"甘特图。","why":"甘特图把活动放在时间轴上。"},{"en":"Power/interest matrix.","zh":"权力与关注程度矩阵。","why":"它用于干系人分析。"},{"en":"WBS.","zh":"工作分解结构。","why":"Decomposition 将较大的成果或工作分为可管理部分。"}],"answer":[3],"concept":"wbs"},{"id":"base-q47","topic":"L3/wbs","type":"mc","stem":"一个工作包有一名责任人，三人执行。是否必然不正确？","en":"A work package has one accountable owner and three people performing the work. Is this necessarily incorrect?","options":[{"en":"Yes. A work package cannot have an owner.","zh":"是。工作包不能指定责任人。","why":"明确责任归属有助于管理工作包。"},{"en":"No, but only if it lasts fewer than two days.","zh":"不一定，但只有工期少于两天才可以。","why":"没有这样的统一工期规则。"},{"en":"No. Clear accountability does not require a single performer.","zh":"并非如此。明确责任人不要求只有一人执行。","why":"工作包可以由多人协作，仍有清楚的责任归属。"},{"en":"Yes. Every work package must be completed by exactly one person.","zh":"是。工作包必须恰由一人完成。","why":"这把责任归属误当作执行人数限制。"}],"answer":[2],"concept":"workpackage"},{"id":"base-q48","topic":"L3/wbs","type":"mc","stem":"父项包含安装、测试、移交。子项列了两次安装和一次移交，应怎样修正？","en":"A parent item includes installation, testing and handover. Its children list installation twice and handover once. What correction is needed?","options":[{"en":"Add dates without changing the children.","zh":"只加日期，不改子项。","why":"日期不能修复范围遗漏与重复。"},{"en":"Remove the duplicate installation and include testing.","zh":"删除重复安装，并补上测试。","why":"满足完整覆盖和不重复两项要求。"},{"en":"Keep it because there are three children for three tasks.","zh":"保留，因为三项任务对应三个子项。","why":"数量相同不等于内容完整且不重复。"},{"en":"Delete handover because closure need not appear in a WBS.","zh":"删去移交，因为 WBS 不需要收尾工作。","why":"必要的移交和收尾不能遗漏。"}],"answer":[1],"concept":"wbs"},{"id":"base-q49","topic":"L3/wbs","type":"mc","stem":"WBS 中同一父项下的两个子项，能据此判断什么？","en":"What can be inferred from two sibling items in a WBS?","options":[{"en":"They are parts of the parent’s work; their execution order needs separate logic.","zh":"它们组成父项工作，执行顺序仍需另行确定。","why":"WBS 表示组成层级，不自动表示时间依赖。"},{"en":"The left item must always finish before the right starts.","zh":"左项必须先完成，右项才能开始。","why":"图上位置不提供这种依赖。"},{"en":"Every leaf must be split into at least two more children.","zh":"每个叶节点都必须再拆成至少两个子项。","why":"可管理的工作包可以是最低层，不必无限分解。"},{"en":"They must belong to the same person.","zh":"它们必须由同一个人负责。","why":"WBS 组成关系不能单独确定责任人。"}],"answer":[0],"concept":"wbs"},{"id":"base-q50","topic":"L3/responsibility","type":"mc","stem":"OBS 主要回答什么问题？","en":"Which question is primarily answered by an OBS?","options":[{"en":"What is the earliest finish of each activity?","zh":"各活动的最早完成时间是什么？","why":"这是进度计算。"},{"en":"How likely is a risk event to occur?","zh":"风险事件发生的可能性多高？","why":"这是风险分析。"},{"en":"Which task must immediately precede another?","zh":"哪项活动直接先于另一项？","why":"这是网络依赖关系。"},{"en":"Which organizational units carry responsibility for the project work?","zh":"哪些组织单位承担项目工作的责任？","why":"OBS 表示组织责任层级。"}],"answer":[3],"concept":"obs"},{"id":"base-q51","topic":"L3/responsibility","type":"mc","stem":"RAM 某任务行中，工程师列为 ○，护士列为 ☆，经理列为 □。谁负责批准？","en":"In a RAM, a task row contains ○ under the engineer, ☆ under the nurse, and □ under the manager. Who approves?","options":[{"en":"The nurse.","zh":"护士。","why":"☆ 表示 Support 支持。"},{"en":"Nobody; the table only shows notification.","zh":"没有人；该表只显示通知。","why":"图例还有负责、支持和批准，通知符号为 ■。"},{"en":"The manager.","zh":"经理。","why":"本图例 □ 表示 Approval 批准。"},{"en":"The engineer.","zh":"工程师。","why":"○ 表示 Responsible 负责执行该项工作。"}],"answer":[2],"concept":"ram"},{"id":"base-q52","topic":"L3/statement","type":"mc","stem":"测试人员检查取消预约能否释放名额，医院随后正式接受该功能。怎样理解这两项工作？","en":"A tester checks whether cancellation releases a booking slot. The hospital then formally accepts the tested feature. Which interpretation is correct?","options":[{"en":"Scope validation means approving the wording of a definition only.","zh":"确认范围只表示批准一段定义的措辞。","why":"准确含义是正式接受已完成的可交付成果。"},{"en":"The first checks quality; the second validates scope through acceptance.","zh":"前者检查质量，后者通过正式接受确认范围。","why":"检查是否符合要求与正式接受已完成成果是不同动作。"},{"en":"Both only define future deliverables.","zh":"两者都只是在定义未来成果。","why":"题目中的功能已经完成并接受测试和验收。"},{"en":"The first is acceptance; the second is calculating cost.","zh":"前者是验收，后者是计算成本。","why":"医院接受成果不是成本计算。"}],"answer":[1],"concept":"acceptance"},{"id":"base-q53","topic":"L4/activities","type":"mc","stem":"流程为 A→B→D。D 的紧前活动是什么？","en":"The sequence is A → B → D. Which activity is the immediate predecessor of D?","options":[{"en":"B; A is an earlier predecessor linked through B.","zh":"B；A 是通过 B 相连的更早前置活动。","why":"紧前活动是直接依赖，A 的约束已经通过 B 传递。"},{"en":"A only, because it is the first activity.","zh":"只有 A，因为它是第一项活动。","why":"最早的活动不等于直接紧前活动。"},{"en":"A and B must both be listed as immediate predecessors.","zh":"A 与 B 都必须列为紧前活动。","why":"把间接依赖和直接依赖混在一起，重复列出 A。"},{"en":"D itself, because it finishes last.","zh":"D 自己，因为它最后完成。","why":"活动不能成为自己的前置，这会形成循环。"}],"answer":[0],"concept":"activity"},{"id":"base-q54","topic":"L4/aon","type":"mc","stem":"F 必须等 D 安装指路牌和 E 安装设备均完成；D 与 E 彼此不依赖。需要哪些箭头？","en":"F requires both installation D and equipment setup E to be finished. D and E do not depend on each other. Which edges are required?","options":[{"en":"D → E and E → F.","zh":"D→E，E→F。","why":"无依据地把 D、E 串联，增加了等待条件。"},{"en":"D → F only.","zh":"只有 D→F。","why":"漏掉了 E 必须完成的条件。"},{"en":"F → D and F → E.","zh":"F→D，F→E。","why":"把前后顺序画反。"},{"en":"D → F and E → F.","zh":"D→F，E→F。","why":"F 汇合两条分支，需要等待两项工作。"}],"answer":[3],"concept":"activity-table"},{"id":"base-q55","topic":"L4/times","type":"mc","stem":"时间从 0 开始，某活动最早第 5 天开始，工期 3 天。最早何时完成？","en":"An activity starts at time 5 and lasts 3 days. Using a time origin of 0, what is its earliest finish?","options":[{"en":"Time 3.","zh":"第 3 天。","why":"3 是持续时间，未加开始时点。"},{"en":"Time 2.","zh":"第 2 天。","why":"最早完成应加工期，不能用开始时点减工期。"},{"en":"Time 8.","zh":"第 8 天这个时点。","why":"EF=ES+Duration=5+3=8。这里按时间边界计算，不额外加减一天。"},{"en":"Time 7.","zh":"第 7 天。","why":"把日历日期的包含端点计数误用于从 0 开始的时点计算。"}],"answer":[2],"concept":"aon-times"},{"id":"base-q56","topic":"L4/times","type":"mc","stem":"D 最早在 11 完成，E 在 7 完成。F 等待两者，工期 3 天。F 的 ES、EF 是多少？","en":"D finishes at time 11 and E finishes at time 7. F waits for both and lasts 3 days. What are F’s ES and EF?","options":[{"en":"ES = 9, EF = 12.","zh":"ES=9，EF=12。","why":"取平均值也不能保证所有紧前活动完成。"},{"en":"ES = 11, EF = 14.","zh":"ES=11，EF=14。","why":"汇合取 max(11,7)=11，再加 3。"},{"en":"ES = 7, EF = 10.","zh":"ES=7，EF=10。","why":"取最小值会让 F 在 D 完成前开始。"},{"en":"ES = 18, EF = 21.","zh":"ES=18，EF=21。","why":"前项可能并行，不能把两个完成时点相加。"}],"answer":[1],"concept":"passes"},{"id":"base-q57","topic":"L4/times","type":"mc","stem":"A 的两个紧后活动最迟开始分别为 2 和 6，A 工期 2 天。A 的 LF、LS 是多少？","en":"A’s successors have latest starts of 2 and 6. A lasts 2 days. What are A’s LF and LS?","options":[{"en":"LF = 2, LS = 0.","zh":"LF=2，LS=0。","why":"逆推分支取 min(2,6)=2，再减 2。"},{"en":"LF = 6, LS = 4.","zh":"LF=6，LS=4。","why":"取最大值会使需要在 2 开始的后项受影响。"},{"en":"LF = 8, LS = 6.","zh":"LF=8，LS=6。","why":"后项最迟开始时点不能相加。"},{"en":"LF = 4, LS = 2.","zh":"LF=4，LS=2。","why":"平均时点不满足最早受限的后项。"}],"answer":[0],"concept":"passes"},{"id":"base-q58","topic":"L4/paths","type":"mc","stem":"两条完整路径分别为 16 天和 12 天。仅短路径上一项活动多用 5 天，其他条件不变。新项目工期是多少？","en":"Two complete paths take 16 and 12 days. If only an activity on the 12-day path takes five extra days, what is the new project duration?","options":[{"en":"21 days.","zh":"21 天。","why":"不能把全部延误直接加到原项目工期；短路径原有 4 天余量。"},{"en":"16 days.","zh":"16 天。","why":"短路径延长到 17 天，已超过原最长路径。"},{"en":"12 days.","zh":"12 天。","why":"这既忽略原关键路径，也忽略增加的工期。"},{"en":"17 days.","zh":"17 天。","why":"两条路径变成 16 和 17，取最长值 17。"}],"answer":[3],"concept":"path"},{"id":"base-q59","topic":"L4/paths","type":"mc","stem":"两项活动位于同一条较短路径上，各多用 3 天；该路径原来比关键路径短 4 天。应怎样判断？","en":"Two paths share A. Each path has four days of slack relative to another longer path. Two activities on the same short path each take three extra days. What must be checked?","options":[{"en":"Add eight days of slack, one allowance for each activity.","zh":"两项各有 4 天，因此合计 8 天余量。","why":"相同路径的浮动不能机械相加。"},{"en":"Only the activity nearest the finish affects the result.","zh":"只需看靠近终点的一项活动。","why":"沿路径串联的工期变化都可能影响总时长。"},{"en":"Recalculate the path: six extra days exceed its four-day allowance.","zh":"重算路径：共增加 6 天，超过原有 4 天余量。","why":"同一路径上的浮动可能共用，不能让每项独立使用完整余量。"},{"en":"No effect, because each delay is less than four days.","zh":"没有影响，因为每项延误都小于 4 天。","why":"分开比较遗漏了同一路径的累积影响。"}],"answer":[2],"concept":"path"},{"id":"base-q60","topic":"L4/slack","type":"mc","stem":"C 的总时差为 4 天，自由时差为 0。仅 C 延迟 2 天，其他条件不变。怎样判断？","en":"C has total slack of 4 days and free slack of 0. C is delayed by 2 days with other conditions unchanged. What follows?","options":[{"en":"C is critical because its free slack is zero.","zh":"C 是关键活动，因为自由时差为 0。","why":"关键性看本题基础 CPM 的总时差，不能用自由时差替代。"},{"en":"A successor’s earliest start changes, while project completion can remain unchanged.","zh":"紧后活动的最早开始改变，项目完工仍可保持。","why":"延误超过自由时差但未超过总时差，两个判断对象不同。"},{"en":"No successor schedule changes because the delay is within total slack.","zh":"因为未超过总时差，后续最早排程都不变。","why":"把总时差误当成自由时差。"},{"en":"The project must finish two days late.","zh":"项目必然晚 2 天完成。","why":"项目还有总时差可吸收这次单项延误。"}],"answer":[1],"concept":"slack"},{"id":"base-q61","topic":"L4/pert","type":"mc","stem":"a=3、m=4、b=8 天，PERT 期望工期是多少？","en":"An activity has a = 3, m = 4 and b = 8 days. What is its PERT expected duration?","options":[{"en":"4.5 days.","zh":"4.5 天。","why":"TE=(3+4×4+8)/6=27/6=4.5。"},{"en":"5 days.","zh":"5 天。","why":"这是简单平均 (3+4+8)/3，不是 PERT 加权公式。"},{"en":"4 days.","zh":"4 天。","why":"这是最可能工期 m，不一定等于期望工期。"},{"en":"8 days.","zh":"8 天。","why":"这是悲观工期 b。"}],"answer":[0],"concept":"pert"},{"id":"base-q62","topic":"L4/pert","type":"mc","stem":"TE=4.5 天、a=3、m=4，求悲观工期 b。","en":"TE is 4.5 days, a = 3 and m = 4. What is b?","options":[{"en":"20 days.","zh":"20 天。","why":"漏掉了 m 的权重 4，误算成 27−3−4。"},{"en":"4.5 days.","zh":"4.5 天。","why":"期望工期不是悲观工期。"},{"en":"5 days.","zh":"5 天。","why":"没有满足原公式 6TE=a+4m+b。"},{"en":"8 days.","zh":"8 天。","why":"b=6TE−a−4m=27−3−16=8。"}],"answer":[3],"concept":"pert"},{"id":"base-q63","topic":"L4/z","type":"mc","stem":"期望完工 30 天，项目标准差 2.78 天，期限 32 天。Z 约为多少？","en":"Expected completion is 30 days, σ = 2.78 days and the due date is 32 days. What is Z?","options":[{"en":"−0.72, with no time unit.","zh":"−0.72，无时间单位。","why":"期限比期望时间晚，应为正值。"},{"en":"34.78 days.","zh":"34.78 天。","why":"把数据直接相加没有对应此公式。"},{"en":"0.72, with no time unit.","zh":"0.72，无时间单位。","why":"Z=(32−30)/2.78≈0.72，天除以天后单位抵消。"},{"en":"5.56 days.","zh":"5.56 天。","why":"这是把差值乘标准差，且误给 Z 时间单位。"}],"answer":[2],"concept":"z"},{"id":"base-q64","topic":"L4/z","type":"mc","stem":"题给目标概率对应 Z=1.65，Expected=30 天，σ=2.78 天。期限应为多少？","en":"The question gives Z = 1.65 for the required probability, Expected = 30 days and σ = 2.78 days. Which due date follows?","options":[{"en":"About 25.41 days.","zh":"约 25.41 天。","why":"Z 为正，期限应晚于期望值，不能减去乘积。"},{"en":"About 34.59 days.","zh":"约 34.59 天。","why":"Due=30+1.65×2.78=34.587。"},{"en":"About 34.43 days.","zh":"约 34.43 天。","why":"这是 30+1.65+2.78，错把乘法改成加法。"},{"en":"About 30.59 days.","zh":"约 30.59 天。","why":"这是 30+1.65/2.78，求期限时应相乘。"}],"answer":[1],"concept":"z"},{"id":"base-q65","topic":"L5/relationships","type":"mc","stem":"原型完成四天后，测试才可以完成。是什么关系？","en":"Testing cannot finish until four days after the prototype is complete. What relationship is specified?","options":[{"en":"Finish-to-Finish with a four-day lag.","zh":"FF，滞后 4 天。","why":"受限制的是测试的完成时点，前置也是原型完成时点。"},{"en":"Finish-to-Start with a four-day lag.","zh":"FS，滞后 4 天。","why":"把测试“完成”误读成测试“开始”。"},{"en":"Start-to-Start with a four-day lag.","zh":"SS，滞后 4 天。","why":"题目没有用原型开始限制测试开始。"},{"en":"Start-to-Finish with a four-day lag.","zh":"SF，滞后 4 天。","why":"前置条件是原型完成，不是原型开始。"}],"answer":[0],"concept":"relations"},{"id":"base-q66","topic":"L5/relationships","type":"mc","stem":"上一班保安必须等新一班开始值班后，才可以结束。属于什么关系？","en":"The outgoing guard cannot finish a shift until the incoming guard starts. What relationship is this?","options":[{"en":"Finish-to-Start.","zh":"FS。","why":"FS 要求一项结束后另一项才开始，与交接保障的限制不同。"},{"en":"Finish-to-Finish.","zh":"FF。","why":"这里前置条件不是新一班结束。"},{"en":"Start-to-Start.","zh":"SS。","why":"这里受限制的是上一班结束，不是开始。"},{"en":"Start-to-Finish.","zh":"SF。","why":"新一班的开始限制上一班的结束。"}],"answer":[3],"concept":"relations"},{"id":"base-q67","topic":"L5/relationships","type":"mc","stem":"B 在 A 之后采用 FS 关系，无滞后。A 在 5 完成。哪项一定成立？","en":"B has an FS relationship after A, with no lag. A finishes at time 5. Which statement must hold?","options":[{"en":"B must finish at exactly time 5.","zh":"B 必须恰在 5 完成。","why":"FS 约束 B 的开始，不是完成。"},{"en":"A and B must start together.","zh":"A 与 B 必须同时开始。","why":"FS 与开始同时没有这种含义。"},{"en":"B cannot start before time 5; other conditions may make it start later.","zh":"B 不能早于 5 开始，其他条件可能让它更晚。","why":"关系规定开始下限，不强制恰在 5 开始。"},{"en":"B must start at exactly time 5 regardless of other constraints.","zh":"无论其他条件如何，B 必须恰在 5 开始。","why":"把允许的最早边界误写成强制相等。"}],"answer":[2],"concept":"relations"},{"id":"base-q68","topic":"L5/gantt","type":"mc","stem":"两条 Gantt 横条恰好首尾相接，但没有箭头或关系说明。能确定什么？","en":"Two Gantt bars are adjacent, but no dependency arrow or relationship is given. What can be concluded?","options":[{"en":"The first activity has already been completed in reality.","zh":"第一项实际上已经完成。","why":"计划横条没有给出实际完成信息。"},{"en":"Their displayed times are adjacent; a dependency is not established by timing alone.","zh":"显示的时间相邻；单凭时间不能确定依赖。","why":"依赖应来自箭头或明示条件。"},{"en":"They must have a finish-to-start dependency.","zh":"必定为 FS 依赖。","why":"时间巧合不证明逻辑约束。"},{"en":"The second activity must be on the critical path.","zh":"第二项必定在关键路径上。","why":"没有完整网络与浮动信息，不能判定。"}],"answer":[1],"concept":"gantt"},{"id":"base-q69","topic":"L5/gantt","type":"mc","stem":"在检查时点判断工作是否落后，需要哪些信息？","en":"Which information is needed to judge whether work is behind plan at a status date?","options":[{"en":"The planned schedule and actual progress at that date.","zh":"计划进度与该时点的实际进展。","why":"只有两者比较，才能判断偏差。"},{"en":"Only a vertical status-date line.","zh":"只有一条检查时点竖线。","why":"竖线定位时间，不表示实际完成程度。"},{"en":"","zh":"只有各项活动原定的完成日期。","why":"计划日期提供基准，还需要检查时点的实际完成情况。"},{"en":"","zh":"只有每项活动已经花掉的工时。","why":"投入工时不直接说明已完成多少工作，需要与计划进度对照。"}],"answer":[0],"concept":"gantt-benefits"},{"id":"base-q70","topic":"L5/aoa","type":"mc","stem":"关于 AON 与 AOA，哪项比较正确？","en":"Which comparison of AON and AOA is correct?","options":[{"en":"Both use nodes as activities and arrows only as dependencies.","zh":"两者都用节点表示活动，箭头只表示依赖。","why":"这只符合 AON，未说明 AOA 的活动在箭头上。"},{"en":"AON arrows are activities; AOA nodes are activities.","zh":"AON 箭头是活动；AOA 节点是活动。","why":"把两种图的对象对调了。"},{"en":"AOA nodes represent resources rather than events.","zh":"AOA 节点表示资源而非事件。","why":"AOA 节点表示开始或结束事件。"},{"en":"AON nodes are activities; AOA arrows are activities and nodes are events.","zh":"AON 节点是活动；AOA 箭头是活动、节点是事件。","why":"准确区分两种表示法的基本对象。"}],"answer":[3],"concept":"aon-aoa"},{"id":"base-q71","topic":"L5/aoa","type":"mc","stem":"AOA 的虚拟活动工期为零，为什么仍可能需要？","en":"Why can a zero-duration dummy activity still be necessary in AOA?","options":[{"en":"It adds resources to a critical activity.","zh":"它为关键活动增加资源。","why":"虚拟活动不消耗资源，也不表示资源补充。"},{"en":"It can always be deleted without changing any dependency.","zh":"任何虚拟活动都能删除，依赖不会改变。","why":"删除可能破坏原有逻辑。"},{"en":"It preserves a logical dependency that the event structure must express.","zh":"它保留事件结构必须表达的逻辑依赖。","why":"虚拟活动没有工作时间，仍能影响哪些活动必须等待。"},{"en":"It reserves one day for work that has not been estimated.","zh":"它为尚未估算的工作预留一天。","why":"虚拟活动工期明确为零，不是未估算工作。"}],"answer":[2],"concept":"dummy"},{"id":"base-q72","topic":"L5/costs","type":"mc","stem":"机器只为本项目租用，约定租期内费用固定。可以怎样分类？","en":"A machine is rented solely for this project at a fixed charge for the agreed period. Which classification can apply?","options":[{"en":"Variable solely because the machine is used every day.","zh":"每天使用，所以必定是可变成本。","why":"题目明确约定租期内费用固定。"},{"en":"Direct and fixed.","zh":"直接成本，同时是固定成本。","why":"前者按归属判断，后者按费用是否随使用量变化判断。"},{"en":"Direct, so it cannot also be fixed.","zh":"既然直接，就不能也是固定。","why":"两组分类角度不同，可以同时成立。"},{"en":"Indirect solely because it is a rental.","zh":"仅因是租金，就必定是间接成本。","why":"题目明确只归属于本项目，不能只看“租金”一词。"}],"answer":[1],"concept":"cost-categories"},{"id":"base-q73","topic":"L5/loaded-rate","type":"mc","stem":"基本时薪 $37.50，附加成本为基本工资的 65%，工作 80 小时。费率与总费用是多少？","en":"Base pay is $37.50/hour, overhead is 65% of base pay and the task uses 80 hours. What are the loaded rate and total cost?","options":[{"en":"$61.875/hour and $4,950.","zh":"$61.875/小时，合计 $4,950。","why":"37.50×1.65=61.875，再乘 80。"},{"en":"$24.375/hour and $1,950.","zh":"$24.375/小时，合计 $1,950。","why":"只算了附加部分，漏掉基本工资。"},{"en":"$37.50/hour and $3,000.","zh":"$37.50/小时，合计 $3,000。","why":"完全没有计入附加成本。"},{"en":"$4,950/hour and $61.875 total.","zh":"$4,950/小时，合计 $61.875。","why":"把费率和总额的位置及单位颠倒了。"}],"answer":[0],"concept":"loaded"},{"id":"base-q74","topic":"L5/budget","type":"mc","stem":"表中第 1–3 周计划支出为 $400、$800、$800。到第 2 周为止累计计划支出是多少？","en":"A table gives planned spending of $400, $800 and $800 in weeks 1–3. What is cumulative planned spending through week 2?","options":[{"en":"$800.","zh":"$800。","why":"这是第 2 周单周费用。"},{"en":"$2,000.","zh":"$2,000。","why":"这是三周总预算，不是截至第 2 周累计。"},{"en":"$400.","zh":"$400。","why":"只计算了第 1 周。"},{"en":"$1,200.","zh":"$1,200。","why":"累计到第 2 周=400+800。"}],"answer":[3],"concept":"budget"},{"id":"base-q75","topic":"L5/budget","type":"mc","stem":"表头定义差额为“实际−计划”，结果为 +$50。表示什么？","en":"The column is defined as actual minus planned. It shows +$50. What does this mean?","options":[{"en":"The project is 50 days late.","zh":"项目延误 50 天。","why":"这是费用差，单位是金额。"},{"en":"The total budget is exactly $50.","zh":"总预算就是 $50。","why":"差额不能当作总预算。"},{"en":"Actual spending is $50 above plan.","zh":"实际比计划多支出 $50。","why":"按已给差额定义，正值表示实际更高。"},{"en":"The project saved $50.","zh":"节省 $50。","why":"把差额方向反过来了。"}],"answer":[2],"concept":"budget"},{"id":"base-q76","topic":"L5/crashing","type":"mc","stem":"正常 5 周、$12,000；赶工 3 周、$32,000。赶工斜率是多少？","en":"Normal duration is 5 weeks at $12,000; crash duration is 3 weeks at $32,000. What is the cost slope?","options":[{"en":"$4,000 per week saved.","zh":"每周 $4,000。","why":"用费用差除正常工期，分母应为可缩短的时间差。"},{"en":"$10,000 per week saved.","zh":"每缩短一周增加 $10,000。","why":"费用差 20,000 除以时间差 2。"},{"en":"$20,000 per week saved.","zh":"每周 $20,000。","why":"20,000 是缩短两周的总增加费用。"},{"en":"$6,400 per week saved.","zh":"每周 $6,400。","why":"用赶工总费用除正常总工期，不是成本斜率。"}],"answer":[1],"concept":"crash"},{"id":"base-q77","topic":"L5/crashing","type":"mc","stem":"两条关键路径都是 16 天，没有共同可赶工活动。要使项目变成 15 天，需要怎样处理？","en":"Two current critical paths are both 16 days long and share no crashable activity. What is needed to reduce the project to 15 days?","options":[{"en":"Shorten both critical paths by at least one day.","zh":"两条关键路径都至少缩短一天。","why":"只缩短一条，另一条仍需 16 天。"},{"en":"Shorten only the cheaper path by one day.","zh":"只缩短较便宜的一条一天。","why":"另一条仍限制项目完工。"},{"en":"Shorten any noncritical activity by one day.","zh":"任意非关键活动缩短一天。","why":"这不能缩短当前最长路径。"},{"en":"Average the two path durations and reduce one of them.","zh":"取两条平均后，只缩短其中一条。","why":"项目工期取最长路径，不取平均。"}],"answer":[0],"concept":"crash-path"},{"id":"base-q78","topic":"L5/crashing","type":"mc","stem":"正常与赶工工期都为 4 天，比较缩短工期的方案时应如何处理？","en":"Normal and crash durations are both 4 days. How should the activity be treated in a time-saving comparison?","options":[{"en":"It has a zero cost slope and should be chosen first.","zh":"斜率为零，应优先选它。","why":"分母为零不能算成零成本斜率。"},{"en":"It can be shortened by four days.","zh":"可缩短四天。","why":"四天是活动工期，不是正常与赶工的差。"},{"en":"It is automatically on every critical path.","zh":"自动位于每条关键路径上。","why":"可压缩程度不决定网络位置。"},{"en":"It offers no duration reduction under the stated options.","zh":"题给方案没有可缩短的工期。","why":"时间差为零，不能通过该方案取得时间节省。"}],"answer":[3],"concept":"crash"},{"id":"base-q79","topic":"L6/risk-process","type":"mc","stem":"团队先列出可能发生的设备延期，尚未评估概率。属于哪个阶段？","en":"The team lists possible equipment delays before assessing their likelihood. Which risk-management stage is this?","options":[{"en":"Risk mitigation strategies.","zh":"风险缓解策略。","why":"尚未选择应对行动。"},{"en":"Control and documentation of implemented responses.","zh":"对已实施措施进行控制与记录。","why":"这里是初步识别，尚无已实施措施。"},{"en":"Risk identification.","zh":"风险识别。","why":"找出可能影响项目的事件是识别。"},{"en":"Analysis of probability and consequences.","zh":"可能性和后果分析。","why":"题目明确尚未分析概率或影响。"}],"answer":[2],"concept":"risk"},{"id":"base-q80","topic":"L6/rbs","type":"mc","stem":"哪项最准确说明 RBS？","en":"Which description best explains an RBS?","options":[{"en":"A table that assigns approval symbols to people.","zh":"向人员分配批准符号的表。","why":"这是 RAM 的分工用途。"},{"en":"A source-oriented hierarchy of project risks.","zh":"按来源组织的项目风险层级。","why":"RBS 将宽泛来源逐层分解成具体风险。"},{"en":"A time-scaled chart showing planned activity dates.","zh":"按时间刻度显示活动计划日期的图。","why":"这是甘特图的典型作用。"},{"en":"A hierarchy of all project work packages.","zh":"项目全部工作包的层级。","why":"这是 WBS 的对象。"}],"answer":[1],"concept":"rbs"},{"id":"base-q81","topic":"L6/impact-matrix","type":"mc","stem":"风险 A 为低可能性、高后果，D 为高可能性、高后果。矩阵支持什么判断？","en":"Risk A has low likelihood and high consequences; risk D has high likelihood and high consequences. What can be concluded from the matrix?","options":[{"en":"D is more likely than A with the same consequence level; an exact RF still needs scoring inputs.","zh":"D 的可能性更高、后果档位相同；具体 RF 仍需评分数据。","why":"矩阵给出定性位置，不能自行转换成精确分数。"},{"en":"A must have RF = 0.20 and D must have RF = 0.80.","zh":"A 必定 RF=0.20，D 必定 RF=0.80。","why":"题目没有提供这些数值或转换规则。"},{"en":"A has low consequences because its likelihood is low.","zh":"A 可能性低，所以后果也低。","why":"两条轴是不同条件。"},{"en":"D must be ignored because it is already classified.","zh":"D 已经分类，所以不用处理。","why":"分类用于决定关注和应对，不表示风险消失。"}],"answer":[0],"concept":"risk-matrix"},{"id":"base-q82","topic":"L6/responses","type":"mc","stem":"评估后，团队认为处理轻微风险的成本超过收益，决定承担它。属于什么？","en":"After evaluation, a team decides that the cost of treating a minor risk exceeds its expected benefit and retains the risk. What is this?","options":[{"en":"Transfer.","zh":"转移。","why":"题目没有将风险后果交由另一方承担。"},{"en":"Share.","zh":"分担。","why":"题目没有多方共同承担。"},{"en":"Minimize.","zh":"降低。","why":"题目未采取降低概率或后果的措施。"},{"en":"Accept.","zh":"接受。","why":"这是有意识的承担决定，不等于未识别或疏忽。"}],"answer":[3],"concept":"responses"},{"id":"base-q83","topic":"L6/responses","type":"mc","stem":"多家组织同意共同资助开发并承担相关风险，属于什么应对？","en":"Several organizations agree to jointly finance development and bear its associated risks. Which response is this?","options":[{"en":"Accept by one organization alone.","zh":"由一家组织独自接受。","why":"与多方共同承担不符。"},{"en":"Eliminate the uncertainty through classification.","zh":"通过分类消除不确定性。","why":"分类不会自动消除风险，题目行为是风险分担。"},{"en":"Share.","zh":"分担。","why":"风险由合作各方共同承担。"},{"en":"Transfer entirely to one insurer.","zh":"全部转移给一家保险公司。","why":"题目描述共同承担，没有全部转给单方。"}],"answer":[2],"concept":"responses"},{"id":"base-q84","topic":"L6/responses","type":"mc","stem":"客户就明确范围签订固定总价合同。该范围内约定的超支风险通常由谁承担？","en":"A client uses a fixed-price contract for a defined scope. Who generally bears the agreed cost-overrun risk within that scope?","options":[{"en":"","zh":"客户和承包商按各自实际投入的成本比例分担。","why":"固定总价没有自动按投入比例分摊超支的含义，要看约定责任。"},{"en":"The contractor, according to the contract’s allocation of risk.","zh":"承包方，按合同约定承担。","why":"这是从客户向承包方分配约定费用风险的例子。"},{"en":"The insurer automatically, even without insurance.","zh":"即使没买保险，也自动由保险公司承担。","why":"没有保险安排就没有该项转移依据。"},{"en":"Nobody, because a fixed price eliminates all uncertainty.","zh":"没有人，因为固定价格消除了全部不确定性。","why":"转移风险分担不等于风险消失。"}],"answer":[1],"concept":"responses"},{"id":"base-q85","topic":"L6/risk-score","type":"mc","stem":"有 5 个概率指标、4 个后果指标，应怎样求平均？","en":"There are five probability indicators and four consequence indicators. Which averaging rule is correct?","options":[{"en":"Divide the probability sum by 5 and the consequence sum by 4.","zh":"概率总和除以 5，后果总和除以 4。","why":"每组按自身指标数量求平均。"},{"en":"Always divide probability by 3 and consequences by 4.","zh":"概率一律除以 3，后果除以 4。","why":"基础例的 3 不是固定不变的规则。"},{"en":"Divide both sums by 9.","zh":"两组都除以 9。","why":"不能用两组总个数作各组分母。"},{"en":"Add all nine indicators and use one average for both Pf and Cf.","zh":"把九个指标混在一起，用同一平均值作为 Pf 和 Cf。","why":"概率和后果的作用不同，应分别计算。"}],"answer":[0],"concept":"rf"},{"id":"base-q86","topic":"L6/worked-risk","type":"mc","stem":"Pf=0.54、Cf=0.60，RF 是多少？","en":"If Pf = 0.54 and Cf = 0.60, what is RF?","options":[{"en":"0.324, medium risk.","zh":"0.324，中风险。","why":"只计算了乘积，漏掉相加后减乘积的完整公式。"},{"en":"1.14, high risk.","zh":"1.14，高风险。","why":"只相加，漏减乘积。"},{"en":"0.57, medium risk.","zh":"0.57，中风险。","why":"这是 Pf 与 Cf 的简单平均，不是 RF 公式。"},{"en":"0.816, high risk.","zh":"0.816，高风险。","why":"0.54+0.60−0.54×0.60=0.816，大于 0.70。"}],"answer":[3],"concept":"rf-example"},{"id":"base-q87","topic":"L6/risk-score","type":"mc","stem":"Pf=0.50、Cf=0.40，计算结果属于哪个等级？","en":"If Pf = 0.50 and Cf = 0.40, how should the result be classified?","options":[{"en":"RF = 0.20, low risk.","zh":"RF=0.20，低风险。","why":"误把 Pf×Cf 当作整体 RF。"},{"en":"RF = 0.90, high risk.","zh":"RF=0.90，高风险。","why":"漏减乘积 0.20。"},{"en":"RF = 0.70, medium risk.","zh":"RF=0.70，中风险。","why":"0.50+0.40−0.20=0.70；边界包含在中风险。"},{"en":"RF = 0.70, high risk.","zh":"RF=0.70，高风险。","why":"高风险要求严格大于 0.70。"}],"answer":[2],"concept":"rf"},{"id":"base-q88","topic":"L6/risk-score","type":"mc","stem":"RF=0.816，哪项结论准确？","en":"Which conclusion correctly states the meaning of RF = 0.816?","options":[{"en":"The project has an 81.6-day expected delay.","zh":"项目预计延误 81.6 天。","why":"RF 也不是工期。"},{"en":"The project is high risk under the specified scoring rule.","zh":"按题给评分规则，项目属于高风险。","why":"RF 是无量纲评分，0.816 大于高风险阈值。"},{"en":"The project will certainly fail with a measured probability of 81.6%.","zh":"已经测得项目失败概率为 81.6%。","why":"指标评分不能直接当作真实事件发生概率。"},{"en":"The expected loss is $0.816.","zh":"预期损失为 $0.816。","why":"RF 没有货币单位。"}],"answer":[1],"concept":"rf"},{"id":"base-q89","topic":"L1/maturity","type":"mc","stem":"本课提到的 1970 年代项目管理发展背景包括什么？","en":"Which development belongs to the course’s 1970s project-management background?","options":[{"en":"The wider use of WBS, OBS and responsibility assignment matrices.","zh":"WBS、OBS 与责任分配矩阵进一步推广。","why":"这些工具用于更系统地分解工作、组织责任和管理项目。"},{"en":"The founding of PMI in 1979.","zh":"PMI 于 1979 年成立。","why":"本课给出的 PMI 成立年份是 1969。"},{"en":"The disappearance of organizational and conflict issues.","zh":"组织结构和冲突问题不再需要处理。","why":"当时反而更重视支持项目的组织结构与冲突管理。"},{"en":"Replacing work decomposition with daily operational reporting.","zh":"用日常运营报告取代工作分解。","why":"这不是所讲发展关系，WBS 的用途仍是分解项目工作。"}],"answer":[0],"concept":"environment"},{"id":"base-q90","topic":"L4/pert","type":"mc","stem":"PERT 活动公式中的 (b−a)/6 表示什么？","en":"What does (b − a) / 6 represent in the PERT activity formula?","options":[{"en":"The activity duration’s variance.","zh":"该活动工期的方差。","why":"方差应为 [(b−a)/6]²。"},{"en":"The expected project completion time.","zh":"项目期望完工时间。","why":"这不是期望时间公式，也不能单凭一项活动确定整个项目工期。"},{"en":"The probability of completing the activity.","zh":"活动完成概率。","why":"标准差描述时间波动，不是概率。"},{"en":"The activity duration’s standard deviation.","zh":"该活动工期的标准差。","why":"方差是这个结果的平方；标准差与工期使用相同单位。"}],"answer":[3],"concept":"pert"},{"id":"match-groups-match","topic":"L1/process-life","type":"match","stem":"把管理工作放入过程组","context":"医院正在建设预约系统。每项描述问的是管理工作正在做什么。","choices":["Initiating","Planning","Executing","Monitoring and Controlling","Closing"],"rows":[{"text":"取得项目启动授权","answer":0,"why":"Initiating 负责获得开始项目或阶段的授权。"},{"text":"安排开发任务、工期和人员","answer":1,"why":"Planning 确定实现目标的行动安排。"},{"text":"组织人员完成已批准的安装工作","answer":2,"why":"Executing 完成计划规定的工作。"},{"text":"比较实际与计划进度，并启动纠偏","answer":3,"why":"Monitoring and Controlling 跟踪和调整绩效。"},{"text":"办理正式结项并释放人员","answer":4,"why":"Closing 正式结束项目。"}],"concept":"groups"},{"id":"match-areas-match","topic":"L1/areas","type":"match","stem":"十个领域，各自管什么","context":"按每项工作的主要管理对象选择领域。","choices":["Integration","Scope","Time","Cost","Quality","Human Resource","Communications","Risk","Procurement","Stakeholder"],"rows":[{"text":"综合评估增加功能对工期、费用与其他计划的影响","answer":0,"why":"Integration 协调不同方面，处理整体变更。"},{"text":"决定交付内容是否包括网上付款","answer":1,"why":"Scope 确定项目边界。"},{"text":"计算安装任务的最早完成时间","answer":2,"why":"Time 管理活动时间与进度。"},{"text":"核对本月实际费用与预算","answer":3,"why":"Cost 管理费用。"},{"text":"按标准检查预约结果是否正确","answer":4,"why":"Quality 检查质量要求是否得到满足。"},{"text":"安排岗位与团队培训","answer":5,"why":"Human Resource 管理人员和团队。"},{"text":"规定进度报告的接收人、频率与渠道","answer":6,"why":"Communications 管理信息传递。"},{"text":"识别设备迟交的可能性并制定应对","answer":7,"why":"Risk 管理不确定性。"},{"text":"与外部供应商办理设备采购","answer":8,"why":"Procurement 取得外部产品或服务。"},{"text":"分析患者代表的需求和参与程度","answer":9,"why":"Stakeholder 管理相关方的参与和需求。"}],"concept":"knowledge"},{"id":"match-drivers-match","topic":"L1/maturity","type":"match","stem":"判断项目管理的驱动因素","context":"每个情景突出一项原因。","choices":["Compression of product life cycle","Knowledge explosion","Triple bottom line","Increased customer focus","Small projects represent big problems"],"rows":[{"text":"旧款产品很快被新款替代，开发时间越来越短","answer":0,"why":"产品生命周期缩短，增加了缩短开发周期的压力。"},{"text":"系统需要临床、软件和数据安全人员共同完成","answer":1,"why":"知识与专业分工增加，需要跨专业协调。"},{"text":"项目同时考核排放、员工影响与收益","answer":2,"why":"分别对应 Planet、People、Profit。"},{"text":"团队每轮邀请用户试用并调整需求","answer":3,"why":"决策更加重视客户需求和反馈。"},{"text":"十几个小项目共用两名工程师，工期相互影响","answer":4,"why":"小项目累积占用资源，需要统一协调。"}],"concept":"drivers"},{"id":"match-conflicts-match","topic":"L2/culture","type":"match","stem":"从行为判断冲突处理方式","context":"双方争取同一间培训室。选择最符合描述的处理方式。","choices":["Avoidance","Accommodation","Competition","Compromise","Collaboration"],"rows":[{"text":"双方暂时不再讨论分配问题","answer":0,"why":"回避暂不处理冲突。"},{"text":"一方放弃自己的安排，完全接受另一方方案","answer":1,"why":"迁就是让对方需要优先。"},{"text":"一方依靠职权，坚持使用自己的方案","answer":2,"why":"竞争以争取自己的目标为主。"},{"text":"双方各减少一半使用时间","answer":3,"why":"妥协是双方让步。"},{"text":"双方重新设计培训方式，使两组都获得所需训练","answer":4,"why":"合作分析需要并寻找共同可接受的解决办法。"}],"concept":"conflict"},{"id":"match-requirements-match","topic":"L3/requirements","type":"match","stem":"需求分别说明什么","context":"按描述主要表达的需求类型分类。","choices":["Business","Stakeholder","Solution — Functional","Solution — Nonfunctional","Transition and readiness","Project","Quality"],"rows":[{"text":"组织希望通过项目减少预约等待","answer":0,"why":"业务需求解释组织开展项目的原因。"},{"text":"护士代表提出需要查看当日名单","answer":1,"why":"题目重点是特定干系人的需要。"},{"text":"系统必须允许患者取消预约","answer":2,"why":"功能需求说明系统能做什么。"},{"text":"系统在给定负载下须于 2 秒内响应","answer":3,"why":"非功能需求规定性能属性。"},{"text":"上线前须完成旧数据迁移","answer":4,"why":"过渡与就绪需求确保切换。"},{"text":"项目团队须每周提交进度报告","answer":5,"why":"项目需求约定项目执行条件。"},{"text":"交付成果须通过事先约定的质量测试标准","answer":6,"why":"质量需求规定可据以评价的标准。"}],"concept":"requirements"},{"id":"match-risk-stages","topic":"L6/risk-process","type":"match","stem":"从行动判断风险管理阶段","context":"每句话描述团队正在处理设备供货风险的哪一步。","choices":["Risk identification","Analysis of probability and consequences","Risk mitigation strategies","Control and documentation"],"rows":[{"text":"列出“设备可能晚到”这一风险","answer":0,"why":"识别是在找风险。"},{"text":"估计晚到的可能性及对上线的影响","answer":1,"why":"分析概率和后果。"},{"text":"决定准备备用供应商","answer":2,"why":"选择应对办法。"},{"text":"每周跟踪交货，并记录措施效果","answer":3,"w
