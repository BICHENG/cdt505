 const nodes=[...new Set(edges.flatMap(e=>[e.from,e.to]))],succ=Object.fromEntries(nodes.map(n=>[n,[]])),indeg=Object.fromEntries(nodes.map(n=>[n,0]));edges.forEach(e=>{succ[e.from].push(e.to);indeg[e.to]++;});const work={...indeg},queue=nodes.filter(n=>!work[n]),order=[];while(queue.length){const n=queue.shift();order.push(n);succ[n].forEach(x=>{if(!--work[x])queue.push(x);});}if(order.length!==nodes.length)throw Error('图中出现循环。事件不能在尚未完成前又成为自己的前提。');
 const reachable=(a,b)=>{if(a===b)return true;const stack=[a],seen=new Set();while(stack.length){const x=stack.pop();if(seen.has(x))continue;seen.add(x);for(const y of succ[x]||[]){if(y===b)return true;stack.push(y);}}return false;};
 const real=edges.filter(e=>!e.id.startsWith('d')),base=window.CPM.calculate(rows),ancestor=(a,b)=>{const stack=[...base.by[b].pred],seen=new Set();while(stack.length){const x=stack.pop();if(x===a)return true;if(seen.has(x))continue;seen.add(x);stack.push(...base.by[x].pred);}return false;},missing=[],extra=[];for(const a of real)for(const b of real)if(a.id!==b.id){const actual=reachable(a.to,b.from),want=ancestor(a.id,b.id);if(want&&!actual)missing.push(a.id+' → '+b.id);if(!want&&actual)extra.push(a.id+' → '+b.id);}
 const starts=nodes.filter(n=>indeg[n]===0),ends=nodes.filter(n=>!succ[n].length);return {ok:!missing.length&&!extra.length&&starts.length===1&&ends.length===1,missing,extra,starts,ends,edges,order,indeg,succ};
}
function diagram(input){const edges=input.filter(e=>Number.isInteger(+e.from)&&+e.from>0&&Number.isInteger(+e.to)&&+e.to>0&&+e.from!==+e.to).map(e=>({...e,from:+e.from,to:+e.to}));if(!edges.length)return '<p class="small">填写事件编号后，这里会同步显示箭头。</p>';const nodes=[...new Set(edges.flatMap(e=>[e.from,e.to]))].sort((a,b)=>a-b),rank=Object.fromEntries(nodes.map(x=>[x,0]));let cycle=false;for(let i=0;i<nodes.length;i++){let changed=false;for(const e of edges)if(rank[e.to]<=rank[e.from]){rank[e.to]=rank[e.from]+1;changed=true;}if(!changed)break;if(i===nodes.length-1)cycle=true;}if(cycle)return '<p class="feedback">图中有循环；请调整箭头方向后再继续。</p>';const groups={},pos={};nodes.forEach(x=>(groups[rank[x]]??=[]).push(x));nodes.forEach(x=>pos[x]={x:50+rank[x]*145,y:100+groups[rank[x]].indexOf(x)*170});const w=Math.max(...Object.values(pos).map(p=>p.x))+70,h=Math.max(...Object.values(pos).map(p=>p.y))+85;
 return '<div class="chart"><svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="AOA 活动箭头图；虚活动用虚线"><defs><marker id="aoa-head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#285675"/></marker></defs>'+edges.map((e,i)=>{const a=pos[e.from],b=pos[e.to],dummy=e.id.startsWith('d'),duration=rows.find(r=>r.id===e.id)?.d||0,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),x1=a.x+23*dx/len,y1=a.y+23*dy/len,x2=b.x-26*dx/len,y2=b.y-26*dy/len,offset=(i%2?1:-1)*13,long=rank[e.to]-rank[e.from]>1&&Math.abs(a.y-b.y)<30;let path='M'+x1+' '+y1+' L'+x2+' '+y2,tx=(x1+x2)/2,ty=(y1+y2)/2+offset;if(long){const top=Math.min(a.y,b.y)-62-(i%2)*12;path='M'+a.x+' '+(a.y-23)+' V'+top+' H'+b.x+' V'+(b.y-26);ty=top-8;}return '<path d="'+path+'" fill="none" stroke="#285675" stroke-width="2" '+(dummy?'stroke-dasharray="6 4"':'')+' marker-end="url(#aoa-head)"/><text x="'+tx+'" y="'+ty+'" text-anchor="middle" font-size="13" stroke="white" stroke-width="4" paint-order="stroke">'+e.id+' / '+duration+'</text>';}).join('')+nodes.map(n=>'<circle cx="'+pos[n].x+'" cy="'+pos[n].y+'" r="22" fill="white" stroke="#285675" stroke-width="2"/><text x="'+pos[n].x+'" y="'+(pos[n].y+5)+'" text-anchor="middle" font-size="16">'+n+'</text>').join('')+'</svg></div>';
}

 host.innerHTML='<p class="eyebrow">AOA · Dummy Activity 虚活动</p><h1>用虚活动保留正确的等待条件</h1><p class="lead">这题的关键是：D 要等 B 和 C，E 只等 B，G 只等 C。箭头代表活动，圆圈代表事件；一项活动要等到起点事件的所有来路都完成后才能开始。</p><div class="aoa-table">'+table(['活动','本题工作名称','工期 / 天','紧前活动'],rows.map(r=>[r.id,esc(r.desc),r.d,r.pred.join('、')||'—']))+'</div><div class="aoa-step-nav toolbar"></div><div class="aoa-work"></div>';

 if(s.step===0){const box=mk('div','question-card'),next=mk('button','primary','继续画 AOA');work.append(box,next);next.disabled=!s.done[0];renderQuestion({id:'aoa-dependencies',type:'multi',stem:'哪些依赖关系符合活动表？选出全部正确项。',options:[{zh:'D 联合安装要等待 B 准备设备和 C 准备场地。',why:'D 的紧前活动为 B、C。'},{zh:'E 设备检查要等待 B 和 C。',why:'E 只等 B；多加 C 会改变原条件。'},{zh:'G 场地检查只等待 C 准备场地。',why:'G 的紧前活动只有 C。'},{zh:'H 验收只需等待 F 安装后测试。',why:'H 需要 E、F、G 全部完成。'}],answer:[0,2]},box,status=>{s.done[0]=['correct','reviewed'].includes(status);if(!s.done[0]){s.done[1]=false;s.done[2]=false;}next.disabled=!s.done[0];save();});next.onclick=()=>{s.step=1;save();draw();};}
 else if(s.step===1){work.innerHTML='<h2>给每条箭头填写起点和终点</h2><p>A、B、C 的事件编号已经给出。继续安排 D–H，需要虚活动时点“增加虚活动”。事件编号可以不同；核对时看实际依赖是否一致。</p><div class="aoa-edit"></div><div class="toolbar"><button class="aoa-add">增加虚活动</button><button class="aoa-clear">清空箭头编号</button><button class="aoa-check primary">核对依赖</button><button class="aoa-reference">查看一种正确画法</button></div><div class="aoa-diagram"></div><div class="aoa-feedback" role="status"></div><button class="aoa-next primary" '+(!s.done[1]?'disabled':'')+'>继续检验工期变化</button>';

 $('.aoa-add',work).onclick=()=>{if(s.edges.length>=18){$('.aoa-feedback',work).textContent='这张图最多可添加 10 条虚活动。';return;}let i=1;while(s.edges.some(e=>e.id==='d'+i))i++;s.edges.push({id:'d'+i,from:'',to:''});s.done[1]=false;s.done[2]=false;save();draw();};$('.aoa-clear',work).onclick=()=>{s.edges=rows.map(r=>({id:r.id,from:'',to:''}));s.done[1]=false;s.done[2]=false;s.seen=false;save();draw();};
