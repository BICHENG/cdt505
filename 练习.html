</style></head><body><header class="practice-header"><div><a class="brand" href="#home">CDT505 · 考试练习</a><small id="save-status">作答保存在这台设备</small></div><nav><button id="practice-menu">专题目录</button><a href="L1.html">知识讲解</a><a href="CDT505_L1-L6_紧凑打印.pdf" download>下载全册 PDF</a><a href="#home">练习首页</a><a href="v1/">旧版 v1</a></nav></header><div class="practice-layout"><aside id="practice-nav" aria-label="练习目录"></aside><main id="practice-main"></main></div><footer class="practice-footer">CDT505 · Lecture 1–6 · 选择题与 Q1–Q4 专项练习</footer><aside id="activity-popover" class="activity-popover" hidden></aside><script>window.PRACTICE_DATA={"topics":[{"key":"L1/project","title":"项目与日常运营","html":"<p class=\"page-label\">L1 · Project / Operations<\/p><h1>项目与日常运营<\/h1><p class=\"intro\">设计一款新车与每天生产同款车，都需要人员和设备，却属于两类不同的工作。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 概念辨认<\/p><p><strong>Project 项目：temporary 临时性 + unique 独特性。<\/strong>用“设计一款新车”和“持续生产同款车”区分项目与日常运营。<\/p><\/div><details><summary>考试安排与范围补充<\/summary><p><strong>Lecture 1–6，2 小时，100 分；全部作答，英文作答，数值写单位。<\/strong>允许纸质资料与计算器。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">部分<\/th><th scope=\"col\">形式<\/th><th scope=\"col\">分值<\/th><\/tr><\/thead><tbody><tr><td>Part I<\/td><td>20 道单项选择题，每题 2 分<\/td><td>40<\/td><\/tr><tr><td>Part II · Q1<\/td><td>AON 九宫格网络图及相关问题<\/td><td>30<\/td><\/tr><tr><td>Part II · Q2<\/td><td>Gantt Chart 甘特图阅读<\/td><td>10<\/td><\/tr><tr><td>Part II · Q3<\/td><td>风险计算<\/td><td>10<\/td><\/tr><tr><td>Part II · Q4<\/td><td>三个名词解释，合计<\/td><td>10<\/td><\/tr><\/tbody><\/table><\/div><p>“必考范围”表示按速记要求准备；“老师明确举例”表示讲解中点名的名词或例题，不表示已确定它就是试卷原题。定义也可能出现在表格中，不能只找大标题。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">相对速记的补充或澄清<\/th><th scope=\"col\">本套资料的处理<\/th><\/tr><\/thead><tbody><tr><td>L1 的“概念”<\/td><td>展开项目与运营、价值、约束、过程组与生命周期、敏捷、社会技术方法、成熟度和知识领域。<\/td><\/tr><tr><td>名词解释举例<\/td><td>保留 Intangible Values、文化识别的四种方法、文化形成的七个因素、需求类型、RAM 与甘特图五项优点的完整英文表达。<\/td><\/tr><tr><td>FS 与 FF 的中文速记接近<\/td><td>分别写清“测试不能开始”和“测试不能结束”，并给出 cannot … until … 句子。<\/td><\/tr><tr><td>预算范围冲突<\/td><td>保留概念与读表，编表计算待确认。<\/td><\/tr><tr><td>免做某个动作<\/td><td>Free Slack 免单独计算，仍理解后续影响；WBS 免大题作图，仍掌握分解；概率题免查表及项目方差汇总，仍计算 Z 与期限。<\/td><\/tr><\/tbody><\/table><\/div><p>干系人沟通计划、需求改写、学习曲线、比例估算和功能点估算不扩入这套复习。AON 的 10–15 分钟是老师给出的用时建议。<\/p><\/details><section class=\"concept\"><h2>项目与日常运营<\/h2><p class=\"term\" lang=\"en\">Project / Operations<\/p><p class=\"definition\">Project 是为创造独特的产品、服务或成果而开展的临时性工作。Operations 是持续开展、反复提供产品或服务的日常工作。<\/p><p>汽车公司设计一款新车，团队交付设计和测试成果后，这项开发工作就结束了，所以它是 <strong>Project 项目<\/strong>。工厂随后每天按同一设计制造汽车，持续维持生产，这属于 <strong>Operations 日常运营<\/strong>。判断时看工作有没有独特成果和结束条件，不看它是否昂贵、复杂。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">判断依据<\/th><th scope=\"col\">Project 项目<\/th><th scope=\"col\">Operations 日常运营<\/th><\/tr><\/thead><tbody><tr><td>工作目标<\/td><td>完成一项独特的成果<\/td><td>持续维持业务或服务<\/td><\/tr><tr><td>结束条件<\/td><td>目标达成，或确定项目已不可行时结束<\/td><td>随业务持续，重复开展<\/td><\/tr><tr><td>同一个医院中的例子<\/td><td>建立预约系统；改建门诊大厅<\/td><td>每天处理预约；每天为患者登记<\/td><\/tr><\/tbody><\/table><\/div><p>Temporary 临时性说的是项目有起点和终点。医院大楼可以使用几十年，建楼项目仍然有结束时间。项目也可以包含重复工作，例如上线前反复测试系统。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Project 项目<\/th><th scope=\"col\">Operations 日常运营<\/th><\/tr><\/thead><tbody><tr><td>完成学期论文<\/td><td>每节课做课堂笔记<\/td><\/tr><tr><td>搭建会展售货亭<\/td><td>日常登记销售收据<\/td><\/tr><tr><td>开发供应链信息系统<\/td><td>日常响应供应链请求<\/td><\/tr><tr><td>创作新的钢琴曲<\/td><td>每天练习音阶<\/td><\/tr><tr><td>设计新款 iPhone<\/td><td>持续制造同款 iPhone<\/td><\/tr><tr><td>设计新款汽车<\/td><td>持续制造同款汽车<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A project is a temporary endeavor undertaken to create a unique product, service, or result. Operations are ongoing, repetitive activities that sustain an organization’s business.<\/p><\/div><\/section>"},{"key":"L1/value","title":"商业价值与无形价值","html":"<p class=\"page-label\">L1 · Business Value / Intangible Values<\/p><h1>商业价值与无形价值<\/h1><p class=\"intro\">项目可以交付设备，也可以改善组织声誉。设备和声誉都是价值的例子，形式不同。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 老师明确举例：名词解释<\/p><p><strong>Intangible Values 无形价值<\/strong>需要准备完整英文定义和例子。它出现在价值分类表中，不能只按章节标题找名词。<\/p><\/div><section class=\"concept\"><h2>商业价值与无形价值<\/h2><p class=\"term\" lang=\"en\">Business value / Intangible values<\/p><p class=\"definition\">Business value 是项目成果为干系人带来的收益，可以是有形价值、无形价值，或同时包含两者。Intangible values 指非实物形式的收益。<\/p><p>买到新设备后，医院拥有了工具；患者对服务更有信心后，医院获得了声誉。两者都可能是项目带来的收益。<strong>Business Value 商业价值<\/strong>指业务活动产生的可量化净收益；放到具体项目中，就是项目成果给干系人带来的收益。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Business value is the net quantifiable benefit derived from a business endeavor. In a project, it is the benefit that the project results provide to stakeholders. The benefit may be tangible, intangible, or both.<\/p><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Tangible elements 有形要素<\/th><th scope=\"col\">Intangible elements 无形要素<\/th><\/tr><\/thead><tbody><tr><td>Monetary assets 货币资产<br/>Stockholder equity 股东权益<br/>Utility 效用<\/td><td>Goodwill 商誉<br/>Brand recognition 品牌认知<br/>Public benefit 公共利益<\/td><\/tr><tr><td>Fixtures 固定装置<br/>Tools 工具<br/>Market share 市场份额<\/td><td>Trademarks 商标<br/>Strategic alignment 战略一致性<br/>Reputation 声誉<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>医院安装了新的取号设备，设备属于有形要素。患者因服务改善而更信任医院，医院获得的声誉属于无形价值。无形价值也可能带来经济收益。<\/p><\/div><div class=\"note\">分类题按表中的项目判断。Market share 列在有形要素中，Brand recognition 列在无形要素中；只问“能不能摸到”容易判错。<\/div><p>若题目只问 <strong>Intangible Values 无形价值<\/strong>，回答重点是“非实物形式的收益”，再写 Goodwill 商誉、Brand Recognition 品牌认知、Reputation 声誉或 Public Benefit 公共利益等例子。不要只写“看不见的东西”。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Intangible values are non-physical benefits that a project creates for its stakeholders, such as goodwill, brand recognition, reputation and public benefit.<\/p><\/div><\/section>"},{"key":"L1/constraints","title":"范围、时间、成本与质量","html":"<p class=\"page-label\">L1 · 概念辨认<\/p><h1>范围、时间、成本与质量<\/h1><p class=\"intro\">范围决定做什么，时间决定何时完成，成本决定资源和费用安排。改变其中一项，需要评估对其余方面的影响。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 概念与联系<\/p><p><strong>Scope 范围、Time 时间、Cost 成本<\/strong>是三重约束，Quality 质量位于图中央。范围联系工作分解，时间联系进度，成本联系预算与人工费用。<\/p><\/div><section class=\"concept\"><h2>三重约束<\/h2><p class=\"term\" lang=\"en\">Triple constraint<\/p><p class=\"definition\">Scope 范围、Time 时间和 Cost 成本是相互关联的约束，Quality 质量位于三角形中间。<\/p><figure><div class=\"diagram\"><svg aria-label=\"三重约束：范围、时间、成本相互制约，中心为质量\" role=\"img\" viewbox=\"0 0 540 270\" width=\"540\"><path d=\"M270 45 L90 220 L450 220 Z\" fill=\"#edf4fa\" stroke=\"#245b83\" stroke-width=\"2\"><\/path><text fill=\"#193e5c\" font-size=\"20\" text-anchor=\"middle\" x=\"270\" y=\"28\">Scope 范围<\/text><text fill=\"#193e5c\" font-size=\"20\" text-anchor=\"middle\" x=\"85\" y=\"250\">Time 时间<\/text><text fill=\"#193e5c\" font-size=\"20\" text-anchor=\"middle\" x=\"455\" y=\"250\">Cost 成本<\/text><text fill=\"#193e5c\" font-size=\"20\" text-anchor=\"middle\" x=\"270\" y=\"170\">Quality 质量<\/text><\/svg><\/div><\/figure><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">约束<\/th><th scope=\"col\">需要决定什么<\/th><th scope=\"col\">医院预约系统的例子<\/th><\/tr><\/thead><tbody><tr><td>Scope 范围<\/td><td>包括哪些成果和工作<\/td><td>是否包含网上付款功能<\/td><\/tr><tr><td>Time 时间<\/td><td>何时完成，怎样安排进度<\/td><td>在新门诊启用前完成上线<\/td><\/tr><tr><td>Cost 成本<\/td><td>预算和资源如何安排<\/td><td>开发人员、设备和服务的费用<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>医院临时增加网上付款功能，项目经理需要重新评估工作量、工期、费用和质量。可以调整计划、资源或交付范围，不能直接断言时间和成本一定同时增加。<\/p><\/div><div class=\"note\">WBS 用于分解范围；Schedule 安排时间；Budget 与 Labour 成本相关。不要把三重底线 Planet / People / Profit 与三重约束混淆。<\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The triple constraint consists of scope, time and cost. These constraints are interrelated, so a change in one requires the project manager to assess its effects on the others and on quality.<\/p><\/div><\/section>"},{"key":"L1/process-life","title":"五个过程组与项目生命周期","html":"<p class=\"page-label\">L1 · Process Groups / Project Life Cycle<\/p><h1>五个过程组与项目生命周期<\/h1><p class=\"intro\">同一个项目可以从两个角度看：经理正在做哪类管理工作，以及项目目前进展到哪个阶段。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 读图与概念辨认<\/p><p><strong>五个 Process Groups 过程组<\/strong>与<strong>四个 Life-cycle Phases 生命周期阶段<\/strong>分开辨认。读投入曲线时，说明执行阶段投入最高，以及阶段工作可以交叠。<\/p><\/div><section class=\"concept\"><h2>五个管理过程组<\/h2><p class=\"term\" lang=\"en\">Project management process groups<\/p><p class=\"definition\">过程组按管理工作的目的分类。一个项目阶段也可能包含启动、规划、执行、监控和收尾工作。<\/p><p>项目获批后，经理要安排计划，团队执行工作，经理还要持续检查进度。“检查”贯穿执行过程，因此五个过程组不应画成互不重叠的五段时间。<strong>Process Group 过程组按管理工作的目的归类。<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">过程组<\/th><th scope=\"col\">含义<\/th><th scope=\"col\">具体工作<\/th><\/tr><\/thead><tbody><tr><td>Initiating 启动<\/td><td>定义项目或阶段，并取得开始的授权<\/td><td>取得新预约系统项目的批准<\/td><\/tr><tr><td>Planning 规划<\/td><td>明确范围、细化目标和行动安排<\/td><td>制定进度和预算<\/td><\/tr><tr><td>Executing 执行<\/td><td>完成管理计划规定的工作<\/td><td>组织开发、安装和培训<\/td><\/tr><tr><td>Monitoring and Controlling 监控<\/td><td>跟踪、审查、调整进展和绩效<\/td><td>比较实际进度与计划，处理偏差<\/td><\/tr><tr><td>Closing 收尾<\/td><td>正式结束项目、阶段或合同<\/td><td>移交成果并办理结项<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\">“批准项目开始”对应 Initiating。“跟踪执行情况并调整”对应 Monitoring and Controlling。Defining 是下面生命周期图中的阶段名。<\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Initiating defines and authorizes a project or phase. Planning establishes the scope, refines objectives and determines the course of action. Executing performs the work defined in the project management plan. Monitoring and Controlling tracks and reviews performance and makes necessary adjustments. Closing formally completes a project, phase or contract.<\/p><\/div><\/section><p class=\"bridge\">上表按管理工作的目的分类。接下来把项目按时间展开，看它怎样从确定目标走到交付结束，这就得到生命周期。执行阶段仍需要规划、检查和调整，所以不能把五个过程组逐一当成五个时间阶段。<\/p><section class=\"concept\"><h2>项目生命周期<\/h2><p class=\"term\" lang=\"en\">Project life cycle<\/p><p class=\"definition\">本课的生命周期分为 Defining、Planning、Executing、Closing。横轴是 Time 时间，纵轴是 Level of effort 投入程度。<\/p><div class=\"screen-only\"><figure><img alt=\"项目生命周期图：横轴为时间，纵轴为投入程度；定义、规划、执行和收尾曲线相互交叠，执行阶段最高。\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABFoAAALcCAIAAABYZUM7AAAACXBIWXMAAA7EAAAOxAGVKw4bAAJ+oklEQVR4nOzdhVtb5/838Oef+a0tdd3WVbe6UqHu7t6t7u66rq5bXalQg9KWKBYgaPDgznH9PvchXUcJpQQoSeD9uj7XrvVwOLkDAe53bjn/738AAAAAAADN0v9zdwMAAAAAAADcA3EIAAAAAACaKcQhAAAAAABophCHAAAAAACgmUIcAgAAAACAZgpxCAAAAAAAminPjUOiKObl5eXm5KBQKBQKhUKhUChUtVXP0OG5cSg5OdlvzJhB/fujUCgUCoVCoVAoVLVVz9DhuXEoPi7ux65dW/7f/6FQKBQKhUKhUChUtVXP0IE4hEKhUCgUCoVCoby16hk6EIdQKBQKhUKhUCiUt1Y9QwfiEAqFQqFQKBQKhfLWqmfo8KY49MfatdevXkWhUCgUCoVCoVDNtk6fOvXzjz82xzjk/+SJuxsFAAAAAADulJOTM7B/f8QhAAAAAABodhCHAAAAAACgmUIcAgAAAACAZgpxCAAAAAAAminEIQAAAAAAaKYQhwAAAAAAoJlCHAIAAAAAgGYKcQgAAAAAAJopxCEAAAAAAGimEIcAAAAAAKCZQhwCAAAAAIBmCnEIAAAAAACaKcQhAAAAAABophCHAAAAAACgmUIcAgAAAACAZgpxCAAAAAAAminEIQAAAAAAaKYQhwAAAAAAoJlCHAIAAAAAgGYKcQgAAAAAAJopxCEAAAAAAGimEIcAAAAAAKCZQhwCAACAJkIVBYVhGrNUgXf3kwaAekEcAgAAAC+jEpKkBZKSIjknW0pPERNixegIITKskUtKSXL3FwMA6gVxCAAAAOpOVRRVllVBUHleyyc0pZSXKaUlWlApLJAL8uS8XDk7S862S5npUkaqlJYsJSd+tZLixcS46osEnrgYMcYiRIU3fuxBHAJoqhCHAACgCVJ5jvS/v1p5uc6fUtP5zay03FK5PmWYJMmWoMWSeKsjlojRkW5PI24vxCEAb4c4BAAATZBSVlpDF1aMjXb+FLd3rFHeWIhDAN4OcQgAAJogxCFU4xTiEIC3QxwCAIAmSCkpqqELiziEaqhCHALwdohDAADQBCEOoRqnEIcAvB3iEAAANEFytr2GLiziEKqhCnEIwNshDgEAQFOjiqIYVdMtaBCHUA1ViEMA3g5xCAAAmhopI63mLiziEKqhCnEIwNshDgEAQJOicpxg+cZtOsV4q/Mnur1jjWrwEqMjpaR4Eo/l/DylvEwVhNq/kJTiwto8BOIQgLdDHAIAgCZFSrV9u5eMOOSusoSTiCJao7QbuSbEiiSrJCeSb5l2m9fMdNmeod0HNjdHzsutvvLz5MKCr5VSWqyUlpDYozC0wjCqKH7vF5KAOATg/RCHAACg6VBoqjZd2GrjkNYjR9WmMtJIdPlc/2aYbC2uFOYrRYVaLCkrrYgljMqyqsCTZKLKcuO/HupMVZSal5/9F4dSbe5uLADUC+IQAAA0HV 755+aWNkcHR2VFxZzc/OXlFfpXff2DTk7Ot1hv2tk7PX068hUrSURERERERPQN6H+0F3d95vK160xERPSN65dffllYXAqPiBQQEJCSlIqPT3xYWlZWXnn/wUMXFzdxMXEJMfHqmrrnzzd+vywiIiIiIiKib1p/AGcYl/+92n/9ucvXPmQiIqL/hJqaW+ztHbg5uVRU1PT0DPX0DXX1DGSk5dTVNcLCwjc2Nj/4zlkiIiIiIiKi/5T+AM4wLv97uXXwucvXPmQiIqL/hLa2th93dnl6+SorqfDx8HKys4uKiFpZ2d69d39peeWDb2EiIiIiIiIi+q/pD+AM4/K/rdWXn7t87UMmIiL6T+inn37a399fW1ubn5+fmaZpdnZ2eXmF9qaIN2+OzZVERERERERE9N/UH8AZxuV/63MvPnf52odMRERERERERERERERE0x/AGcblf0sTm5+7fO1DJiIiIiIiIiIiIiIioukP4Azj8r+F0Y3PXb72IRMREREREREREREREdH0B3CGcfn/u7TQuXUlxEYAAAAASUVORK5CYII=\"/><figcaption>Defining 定义 · Planning 规划 · Executing 执行 · Closing 收尾<\/figcaption><\/figure><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">阶段<\/th><th scope=\"col\">典型工作<\/th><\/tr><\/thead><tbody><tr><td>Defining 定义<\/td><td>目标、规格、任务与责任<\/td><\/tr><tr><td>Planning 规划<\/td><td>进度、预算、资源、风险与人员安排<\/td><\/tr><tr><td>Executing 执行<\/td><td>完成工作、状态报告、变更、质量与预测<\/td><\/tr><tr><td>Closing 收尾<\/td><td>培训客户、移交文件、释放资源、评价与经验总结<\/td><\/tr><\/tbody><\/table><\/div><p>执行阶段的投入最高；相邻曲线交叠，说明阶段工作可以重叠。投入较少不表示定义或收尾不重要。<\/p><p>建造前要确定目标和安排人员，施工时投入大量人力，交付后还要培训使用者、移交文件和释放资源。曲线中部较高，表示执行期间投入较多；两端较低，表示投入较少。<strong>投入多少和阶段是否重要，是两个问题。<\/strong><\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The four life-cycle phases are Defining, Planning, Executing and Closing. Defining establishes goals, specifications, tasks and responsibilities. Planning develops schedules, budgets and resource plans. Executing performs the work. Closing transfers the results, releases resources and records lessons. The effort curve is highest during execution, and adjacent phases may overlap.<\/p><\/div><\/section>"},{"key":"L1/methods","title":"项目经理、敏捷与社会技术方法","html":"<p class=\"page-label\">L1 · Project Manager / Agile / Socio-technical Approach<\/p><h1>项目经理、敏捷与社会技术方法<\/h1><p class=\"intro\">开发人员能写程序，医院人员熟悉服务流程。谁来协调两边的工作、处理变化，并对整个项目负责？<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 老师讲解的概念<\/p><p><strong>Project Manager 项目经理负责整体绩效；Agile 敏捷采用增量与迭代；Socio-technical Approach 社会技术方法同时涉及技术与人。<\/strong>敏捷的课堂数值是 4–8 人、每轮 1–4 周。<\/p><\/div><section class=\"concept\"><h2>项目经理<\/h2><p class=\"term\" lang=\"en\">Project manager<\/p><p class=\"definition\">项目经理负责项目整体绩效与成功，组织资源、协调团队，并作为与客户直接联系的人。<\/p><div class=\"example\"><span class=\"small-label\">例子<\/span><p>医院人员希望调整预约规则，开发人员担心工期。项目经理安排双方说明需求和影响，协调决定及后续工作。项目经理承担整体责任，不需要亲自完成每项专业任务。<\/p><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The project manager directs, coordinates and integrates the work of the project team, organizes resources and acts as the direct link to the customer. The project manager is responsible for the project’s performance and success.<\/p><\/div><\/section><p class=\"bridge\">项目经理要把人员和工作组织起来。面对还会变化的需求，可以采用下面的敏捷方式，分轮交付，并根据反馈调整。<\/p><section class=\"concept\"><h2>敏捷项目管理<\/h2><p class=\"term\" lang=\"en\">Agile project management<\/p><p class=\"definition\">Agile 通过小步交付与反复改进应对不确定性。Incremental 增量指逐步增加功能；Iterative 迭代指通过反馈重复改进。<\/p><p>需求还会变化时，团队可以先做出一小部分能用的功能，让客户试用，再决定下一轮做什么。这样能尽早发现理解偏差，避免等到全部开发完成才知道客户不满意。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">做法<\/th><th scope=\"col\">含义<\/th><\/tr><\/thead><tbody><tr><td>与客户合作<\/td><td>把项目拆成较小的功能部分，持续确认需求<\/td><\/tr><tr><td>4–8 人的小团队<\/td><td>本课给出的团队规模<\/td><\/tr><tr><td>1–4 周的迭代<\/td><td>每轮完成可观察的进展，如明确需求、解决技术问题或展示功能<\/td><\/tr><tr><td>回顾与调整<\/td><td>每轮结束检查进展，再根据反馈开展下一轮<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>第一轮提供查询门诊时间，第二轮增加预约功能。患者试用后提出“看不清已约日期”，团队在后续迭代中改进日期显示。增加功能是增量，依据反馈改进是迭代。<\/p><\/div><p><strong>Rolling Wave 滚动式推进<\/strong>：近期工作安排得具体一些，较远的工作先保留大致安排，等获得更多信息后再细化。例如，团队先确定本轮怎样完成门诊查询，暂时只列出后续要做预约功能；患者试用查询功能后，团队再结合反馈，安排下一轮的具体工作。每轮完成、检查、调整，再向前推进。<\/p><p><strong>4–8 人<\/strong>描述团队规模；<strong>1–4 周<\/strong>描述一轮迭代的长度。一次迭代结束要有可以检查的实际进展，然后回顾并调整。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Agile project management uses an incremental and iterative approach, active customer collaboration and adaptation to changing requirements. In this course, teams have four to eight members and iterations typically last one to four weeks.<\/p><\/div><\/section><p class=\"bridge\">每轮回顾都需要团队说明问题、协商改动；算进度和协调人员往往同时发生。社会技术方法把这两方面放在一起，说明项目管理既要处理计划，也要处理人与人的合作。<\/p><section class=\"concept\"><h2>技术与社会文化两个方面<\/h2><p class=\"term\" lang=\"en\">Socio-technical approach<\/p><p class=\"definition\">项目管理同时包含 Technical dimension 技术方面和 Sociocultural dimension 社会文化方面。技术方面处理计划与控制，社会文化方面处理人与人的合作。<\/p><p>一张进度表算对了，人员仍可能因为优先级冲突而无法按计划工作。项目经理既要会算工期、安排资源，也要能协调人的工作。这里的 <strong>Technical 技术方面<\/strong>包含计划与控制，并不只指编程；<strong>Sociocultural 社会文化方面<\/strong>包含领导、合作、谈判等。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Technical 技术方面<\/th><th scope=\"col\">Sociocultural 社会文化方面<\/th><\/tr><\/thead><tbody><tr><td>Scope 范围、WBS 工作分解<\/td><td>Leadership 领导、Teamwork 团队合作<\/td><\/tr><tr><td>Schedules 进度、Resource allocation 资源分配<\/td><td>Problem solving 问题解决、Negotiation 谈判<\/td><\/tr><tr><td>Baseline budgets 基准预算、Status reports 状态报告<\/td><td>Politics 组织中的权力关系、Customer expectations 客户期望<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>项目经理计算安装设备需要几天，是技术方面；与护士长协商安装时段，避免影响患者，是社会文化方面。只做好其中一方面，仍可能无法顺利交付。<\/p><\/div><p>解释这个术语时，要同时写出两方面，再各给一个例子。只写“使用技术管理项目”，会漏掉 Socio 所指的人与组织。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The socio-technical approach combines the technical and sociocultural dimensions of project management. The technical dimension includes planning, scheduling and control. The sociocultural dimension includes leadership, teamwork, negotiation and managing customer expectations.<\/p><\/div><\/section>"},{"key":"L1/maturity","title":"项目管理需求与成熟度","html":"<p class=\"page-label\">L1 · 概念联系<\/p><h1>项目管理需求与成熟度<\/h1><p class=\"intro\">项目更新快、参与专业多、客户要求具体时，组织更需要协调工作。成熟度描述组织运用项目管理方法的稳定程度。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 老师提及的概念<\/p><p>认识项目管理需求的五个驱动因素，以及<strong>Project Management Maturity 项目管理成熟度<\/strong>的含义。比较组织的流程与支持程度，不能仅凭行业名称判断。<\/p><\/div><section class=\"concept\"><h2>项目管理需求增加的原因<\/h2><p class=\"term\" lang=\"en\">Drivers of project management<\/p><p class=\"definition\">产品更新更快、知识更复杂、客户要求更具体，都增加了组织协调项目的需要。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">因素<\/th><th scope=\"col\">怎样理解<\/th><\/tr><\/thead><tbody><tr><td>Compression of the product life cycle 产品生命周期缩短<\/td><td>新品更快被替代，需要更快完成开发<\/td><\/tr><tr><td>Knowledge explosion 知识增长<\/td><td>工作需要更多专业人员协作<\/td><\/tr><tr><td>Triple bottom line 三重底线<\/td><td>同时考虑 Planet 环境、People 人与社会、Profit 利润<\/td><\/tr><tr><td>Increased customer focus 更重视客户<\/td><td>围绕客户需求组织工作和反馈<\/td><\/tr><tr><td>Small projects represent big problems 小项目也会造成大问题<\/td><td>多个小项目累积占用人员和预算，也需要管理<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>医院更换耗材包装时，同时考察可回收性、医护使用便利和费用，分别涉及 Planet、People、Profit。<\/p><\/div><p>组织要考虑的目标也会变化。Environmental Sensitivity 环境意识要求关注生产、包装与运输的环境影响，例如改用可回收材料、较清洁的运输方式。这与上表中 Planet 环境的要求相连。Carbon Neutrality 碳中和指净碳排放为零，采用一项环保措施还不足以达到这个目标。<\/p><p>项目管理方法也在发展：1970 年代的课程历史部分涉及工作与组织分解、责任分配及冲突管理。后续章节中的 WBS、OBS、RAM，就是分别用来组织工作、确定承担单位与分配个人责任的工具。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Demand for project management is driven by shorter product life cycles, knowledge growth, the triple bottom line, increased customer focus and the cumulative demands of many small projects.<\/p><\/div><\/section><p class=\"bridge\">项目越多、要求越复杂，组织就越需要稳定的流程、培训和经验积累。成熟度关注的是组织能否持续运用并改进这些做法。<\/p><section class=\"concept\"><h2>项目管理成熟度<\/h2><p class=\"term\" lang=\"en\">Project management maturity<\/p><p class=\"definition\">成熟度反映组织能否稳定地运用、改进项目管理方法。Benchmarking 对标用于比较做法、发现差距并改进项目交付。<\/p><p>组织经常做同类项目，通常会逐渐积累模板、流程和经验。面对没有做过的前沿研究，团队可直接借用的经验可能较少。成熟度关注组织有没有稳定的方法、培训、管理支持和改进机制。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">程度<\/th><th scope=\"col\">组织表现<\/th><\/tr><\/thead><tbody><tr><td>Low 较低<\/td><td>做法临时、缺少共同语言和稳定流程，管理支持有限<\/td><\/tr><tr><td>Moderate 中等<\/td><td>有明确方法、培训和一定管理支持<\/td><\/tr><tr><td>High 较高<\/td><td>方法融入日常制度，组织持续评价和改进<\/td><\/tr><\/tbody><\/table><\/div><p>前沿研究可能缺少可直接套用的项目模板。判断成熟度仍要看组织的流程和支持情况，不能仅凭“科研”或“高科技”就认定成熟度低。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Project management maturity describes how consistently an organization applies and improves project management practices. Maturity models support benchmarking and process improvement.<\/p><\/div><\/section>"},{"key":"L1/areas","title":"十个知识领域","html":"<p class=\"page-label\">L1 · Ten Knowledge Areas<\/p><h1>十个知识领域<\/h1><p class=\"intro\">确定系统要做哪些功能、计算何时能完成、安排设备采购，分别涉及不同的管理对象。十个知识领域就是按这些对象分类。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 概念分类<\/p><p><strong>Ten Knowledge Areas 十个知识领域<\/strong>按“管理什么”分类。能把范围、时间、成本等具体工作对应到英文名称。<\/p><\/div><section class=\"concept\"><h2>十个知识领域<\/h2><p class=\"term\" lang=\"en\">PMBOK knowledge areas<\/p><p class=\"definition\">知识领域按管理对象分类；过程组按管理工作的目的分类。以下沿用本课的 Time 和 Human Resource 名称。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">领域<\/th><th scope=\"col\">管理什么<\/th><th scope=\"col\">任务例子<\/th><\/tr><\/thead><tbody><tr><td>Integration 整合<\/td><td>协调各方面工作与变更<\/td><td>评估功能变更对进度和成本的共同影响<\/td><\/tr><tr><td>Scope 范围<\/td><td>包含与不包含的工作<\/td><td>明确系统是否包括网上付款<\/td><\/tr><tr><td>Time 时间<\/td><td>活动顺序与进度<\/td><td>计算关键路径<\/td><\/tr><tr><td>Cost 成本<\/td><td>估算、预算与费用控制<\/td><td>比较实际费用与预算<\/td><\/tr><tr><td>Quality 质量<\/td><td>质量标准与满足程度<\/td><td>按标准检查预约功能<\/td><\/tr><tr><td>Human Resource 人力资源<\/td><td>人员与团队<\/td><td>分配岗位、安排培训<\/td><\/tr><tr><td>Communications 沟通<\/td><td>信息传递<\/td><td>决定周报给谁、何时发送<\/td><\/tr><tr><td>Risk 风险<\/td><td>不确定事件及应对<\/td><td>评估供应商延期风险<\/td><\/tr><tr><td>Procurement 采购<\/td><td>外部产品与服务的取得<\/td><td>向供应商采购设备<\/td><\/tr><tr><td>Stakeholder 干系人<\/td><td>相关人员的需求与参与<\/td><td>分析护士、患者及管理层的关注点<\/td><\/tr><\/tbody><\/table><\/div><p>例如“计算关键路径”管理的是时间，对应 <strong>Time Management 时间管理<\/strong>；“决定加入网上付款功能”改变工作范围，对应 <strong>Scope Management 范围管理<\/strong>。同一项变更也可能同时影响时间、费用和质量，需要 Integration Management 整合管理协调。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The ten knowledge areas are Integration, Scope, Time, Cost, Quality, Human Resource, Communications, Risk, Procurement and Stakeholder Management.<\/p><\/div><\/section>"},{"key":"L2/sites","title":"全新场地与既有场地","html":"<p class=\"page-label\">L2 · 选择题辨认<\/p><h1>全新场地与既有场地<\/h1><p class=\"intro\">Greenfield 和 Brownfield 按场地已有的条件区分。新功能也可以在既有楼宇内实施。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 概念辨认<\/p><p><strong>Greenfield 全新场地：空地新建；Brownfield 既有场地：扩建或改造。<\/strong>判断场地原有条件，不凭项目名称是否带“新”字。<\/p><\/div><section class=\"concept\"><h2>全新场地与既有场地<\/h2><p class=\"term\" lang=\"en\">Greenfield / Brownfield<\/p><p class=\"definition\">Greenfield project 在完全空置的场地开展新项目；Brownfield project 在已有设施或场地上扩建、改造。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">类型<\/th><th scope=\"col\">判断依据<\/th><th scope=\"col\">例子<\/th><\/tr><\/thead><tbody><tr><td>Greenfield 全新场地<\/td><td>没有原有工程形成的场地约束<\/td><td>在空地上新建医院<\/td><\/tr><tr><td>Brownfield 既有场地<\/td><td>需要考虑已有设施、场地状态及可能污染<\/td><td>改造旧医院，保留部分楼宇和管线<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\">Greenfield 仍受预算、法规、审批和技术条件约束。Brownfield 也不等于一定有污染；既有场地可能已经污染或存在污染风险。<\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A greenfield project develops a completely vacant site without constraints imposed by prior work on that site. A brownfield project expands or revamps an existing facility and must account for the site’s current condition.<\/p><\/div><\/section>"},{"key":"L2/tows","title":"TOWS：从条件到四类策略","html":"<p class=\"page-label\">L2 · TOWS Matrix<\/p><h1>TOWS：从条件到四类策略<\/h1><p class=\"intro\">选择升学或就业方向时，既要了解自己的能力，也要考虑外部机会和竞争。TOWS 将这两方面组合起来，帮助形成策略。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 理解、构建与使用矩阵<\/p><p><strong>分清内部 S/W 与外部 O/T，填出 SO、ST、WO、WT 四格，并解释每项行动用了哪两个条件。<\/strong>只背四个缩写不够。<\/p><\/div><section class=\"concept\"><h2>TOWS 矩阵<\/h2><p class=\"term\" lang=\"en\">TOWS matrix<\/p><p class=\"definition\">S（Strengths 优势）和 W（Weaknesses 劣势）描述分析对象自身的条件；O（Opportunities 机会）和 T（Threats 威胁）描述外部环境。TOWS 把两方面配对，用来制定策略。<\/p><p>假设你正在考虑继续升学。你擅长数据分析，英文写作较弱；外部有研究奖学金机会，申请者之间的竞争也很激烈。TOWS 帮助你把这些条件变成行动。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">条件<\/th><th scope=\"col\">分类理由<\/th><\/tr><\/thead><tbody><tr><td>擅长数据分析<\/td><td>Strength 优势 S：自己已有的能力，属于内部条件。<\/td><\/tr><tr><td>英文写作较弱<\/td><td>Weakness 劣势 W：自己的不足，属于内部条件。<\/td><\/tr><tr><td>有研究奖学金<\/td><td>Opportunity 机会 O：外部提供的有利条件。<\/td><\/tr><tr><td>申请竞争激烈<\/td><td>Threat 威胁 T：外部带来的不利条件。<\/td><\/tr><\/tbody><\/table><\/div><p>用内部的 S、W 作两行，外部的 O、T 作两列。每个格子都同时考虑一项内部条件和一项外部条件，写出相应行动。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">内部条件 ↓ / 外部条件 →<\/th><th scope=\"col\">O：研究奖学金机会<\/th><th scope=\"col\">T：申请竞争激烈<\/th><\/tr><\/thead><tbody><tr><td>S：擅长数据分析<\/td><td><strong>SO：用优势争取机会。<\/strong><br/>准备数据分析研究方案，申请相关奖学金。<\/td><td><strong>ST：用优势应对威胁。<\/strong><br/>展示已完成的分析项目，突出与其他申请者相比的能力。<\/td><\/tr><tr><td>W：英文写作较弱<\/td><td><strong>WO：弥补劣势，把握机会。<\/strong><br/>为争取奖学金，提前接受学术写作训练，改进申请材料。<\/td><td><strong>WT：减少不足带来的风险。<\/strong><br/>提前修改写作材料，并安排多个适合自己能力的申请选项，减少因写作不足和竞争激烈而全部落选的风险。<\/td><\/tr><\/tbody><\/table><\/div><p><strong>构建矩阵的顺序：识别四类条件 → 画两行两列 → 每格组合条件 → 写具体行动。<\/strong>读 SO 格时，应能指出它使用了“数据分析能力”和“奖学金机会”。“努力提升自己”没有说明用了哪些条件，不能充分解释策略。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">英文别称<\/th><th scope=\"col\">含义<\/th><\/tr><\/thead><tbody><tr><td>SO · Maxi–maxi<\/td><td>发挥优势，利用机会。<\/td><\/tr><tr><td>ST · Maxi–mini<\/td><td>发挥优势，减少威胁。<\/td><\/tr><tr><td>WO · Mini–maxi<\/td><td>弥补劣势，利用机会。<\/td><\/tr><tr><td>WT · Mini–mini<\/td><td>减少劣势与威胁。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A TOWS matrix matches internal strengths and weaknesses with external opportunities and threats. SO strategies use strengths to exploit opportunities; ST strategies use strengths to address threats; WO strategies use opportunities to reduce weaknesses; WT strategies reduce weaknesses and avoid threats.<\/p><\/div><\/section>"},{"key":"L2/stakeholders","title":"干系人与权力—关注程度矩阵","html":"<p class=\"page-label\">L2 · 识别、分类与矩阵判断<\/p><h1>干系人与权力—关注程度矩阵<\/h1><p class=\"intro\">客户关心项目，其他部门掌握资源，附近居民也可能反对项目。识别干系人时，这些人都不能因为“不在团队里”或“不支持项目”而被漏掉。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 识别与矩阵应用<\/p><p><strong>识别 Internal / External Stakeholders 内部／外部干系人<\/strong>，包括反对者；再按 Power 权力与 Interest 关注程度定位。保留矩阵判断，不展开沟通计划编制。<\/p><\/div><section class=\"concept\"><h2>干系人<\/h2><p class=\"term\" lang=\"en\">Stakeholder<\/p><p class=\"definition\">干系人是可能影响项目、受到项目影响，或认为自己会受到影响的个人、群体或组织。支持与反对项目的人都可能是干系人。<\/p><p>先以实施项目的组织为边界区分内部与外部。组织内的高层、职能经理和团队成员属于内部干系人；客户、供应商等属于外部干系人。这个分类说明组织归属，不直接表示影响力大小。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Internal 内部<\/th><th scope=\"col\">External 外部<\/th><\/tr><\/thead><tbody><tr><td>Top management 高层管理者<br/>Accountant 会计人员<br/>Functional managers 职能经理<br/>Project team members 项目团队<\/td><td>Clients 客户<br/>Competitors 竞争者<br/>Suppliers 供应商<br/>Environmental / political / consumer groups 环保、政治、消费者等相关群体<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A stakeholder is an individual, group or organization that may affect, be affected by, or perceive itself to be affected by a project. Stakeholders can be internal or external and may support or oppose the project.<\/p><\/div><\/section><p class=\"bridge\">列出干系人以后，还要判断他们怎样影响项目。客户与供应商都可能在组织外部，却不一定有相同的决策权和关注程度。Power/Interest 矩阵继续按这两个维度区分。<\/p><section class=\"concept\"><h2>权力与关注程度矩阵<\/h2><p class=\"term\" lang=\"en\">Power / Interest matrix<\/p><p class=\"definition\">Power 是影响项目决策或资源的能力；Interest 是对项目的关注程度。根据两者组合决定沟通方式。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Power ↓ / Interest →<\/th><th scope=\"col\">Low interest 低关注<\/th><th scope=\"col\">High interest 高关注<\/th><\/tr><\/thead><tbody><tr><td>High power 高权力<\/td><td>Keep Satisfied 保持满意：提供决策所需信息，及时处理重要诉求。<\/td><td>Manage Closely 密切管理：经常沟通并参与关键决策。<\/td><\/tr><tr><td>Low power 低权力<\/td><td>Monitor 关注动态：保留适量沟通。<\/td><td>Keep Informed 及时告知：说明进展并收集反馈。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">情景条件<\/th><th scope=\"col\">定位<\/th><th scope=\"col\">对应策略<\/th><\/tr><\/thead><tbody><tr><td>客户有权批准成果，而且密切关注项目进展<\/td><td>High power / High interest 高权力／高关注<\/td><td>Manage Closely 密切管理<\/td><\/tr><tr><td>其他部门的财务或技术负责人有权决定所需资源，但不常关注本项目<\/td><td>High power / Low interest 高权力／低关注<\/td><td>Keep Satisfied 保持满意<\/td><\/tr><tr><td>一线使用者很关心功能，却没有项目决策权<\/td><td>Low power / High interest 低权力／高关注<\/td><td>Keep Informed 及时告知<\/td><\/tr><tr><td>某相关方既很少关注，也只能产生很小影响<\/td><td>Low power / Low interest 低权力／低关注<\/td><td>Monitor 关注动态<\/td><\/tr><\/tbody><\/table><\/div><p>先分别判断两轴，再找交叉格。<strong>Interest 是“关注程度”，不是经济利益；Power 是影响决策或资源的能力。<\/strong>其他部门负责人即使不常参加项目会议，也可能通过资源审批影响项目，因此“很少关注”不能推出“权力低”。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The power/interest matrix groups stakeholders by their ability to influence the project and their level of interest. High-power, high-interest stakeholders should be managed closely; high-power, low-interest stakeholders kept satisfied; low-power, high-interest stakeholders kept informed; and low-power, low-interest stakeholders monitored.<\/p><\/div><\/section><div class=\"example\"><span class=\"small-label\">例子<\/span><p>若护士代表原本没有决策权，后来获授权批准关键功能，而关注程度仍高，她的位置会由“低权力／高关注”移到“高权力／高关注”，对应 Manage Closely。判断依据是权限发生了变化。<\/p><\/div>"},{"key":"L2/cooperation","title":"合作潜力—威胁潜力矩阵","html":"<p class=\"page-label\">L2 · Cooperation–Threat Matrix<\/p><h1>合作潜力—威胁潜力矩阵<\/h1><p class=\"intro\">关键供应商愿意协助开发，却也有能力因中断供货使项目停顿。只分“支持”和“反对”，还不足以看清它与项目的关系。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 理解与使用矩阵<\/p><p><strong>Cooperation–Threat Matrix 合作潜力—威胁潜力矩阵<\/strong>也属于“各个矩阵”的范围。两轴独立判断，再选 Monitor、Defend、Involve 或 Collaborate。<\/p><\/div><section class=\"concept\"><h2>合作潜力与威胁潜力矩阵<\/h2><p class=\"term\" lang=\"en\">Cooperation–Threat matrix<\/p><p class=\"definition\">Cooperation 指干系人可能提供的合作；Threat 指干系人可能对项目构成的威胁。同一干系人可能既愿意合作，又有能力使项目受损。<\/p><p>Power/Interest 权力—关注程度矩阵看的是“能产生多大影响、关注多少”。这里换两个问题：干系人可能提供多少合作，又有多大能力使项目受损。一个人愿意帮助项目，也可能掌握足以阻止项目的资源，因此两轴要分别判断。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Cooperation 合作潜力 ↓ / Threat 威胁潜力 →<\/th><th scope=\"col\">Low threat 低威胁<\/th><th scope=\"col\">High threat 高威胁<\/th><\/tr><\/thead><tbody><tr><td>Low cooperation 低合作<\/td><td>Marginal 边缘型<br/>Monitor 关注动态<\/td><td>Non-Supportive 不支持型<br/>Defend 防范威胁<\/td><\/tr><tr><td>High cooperation 高合作<\/td><td>Supportive 支持型<br/>Involve 邀请参与<\/td><td>Mixed Blessing 利弊并存型<br/>Collaborate 深入合作<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">情景中的条件<\/th><th scope=\"col\">矩阵位置<\/th><th scope=\"col\">相应做法<\/th><\/tr><\/thead><tbody><tr><td>某部门与系统关联很少，能提供的合作有限，也难以影响项目。<\/td><td>Low cooperation / Low threat<br/>Marginal 边缘型<\/td><td>Monitor 关注动态：留意它与项目的关系是否变化。<\/td><\/tr><tr><td>独家设备供应商不愿配合排期，一旦停供，安装就会中断。<\/td><td>Low cooperation / High threat<br/>Non-Supportive 不支持型<\/td><td>Defend 防范威胁：减少停供可能造成的损害，例如准备替代来源。<\/td><\/tr><tr><td>测试志愿者愿意认真试用并反馈问题，但不掌握审批或关键资源。<\/td><td>High cooperation / Low threat<br/>Supportive 支持型<\/td><td>Involve 邀请参与：让他们参加试用，发挥能够提供的帮助。<\/td><\/tr><tr><td>主管愿意协调部门资源，同时有权否决项目所需预算。<\/td><td>High cooperation / High threat<br/>Mixed Blessing 利弊并存型<\/td><td>Collaborate 深入合作：共同商定资源安排，减少分歧造成的阻碍。<\/td><\/tr><\/tbody><\/table><\/div><p><strong>愿意合作不等于没有威胁。<\/strong>最后一行的主管可以同时帮助项目或阻止项目，因此是高合作、高威胁。若后来不再愿意配合，而预算权力不变，就会移到低合作、高威胁一格。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The cooperation–threat matrix assesses stakeholders by their potential to cooperate with or threaten the project. The strategies are Monitor for marginal stakeholders, Defend against non-supportive stakeholders, Involve supportive stakeholders, and Collaborate with mixed-blessing stakeholders.<\/p><\/div><\/section>"},{"key":"L2/structures","title":"三类组织结构与强弱矩阵","html":"<p class=\"page-label\">L2 · Functional / Projectized / Matrix<\/p><h1>三类组织结构与强弱矩阵<\/h1><p class=\"intro\">职能型、项目型和矩阵型的区别在于汇报关系和权力安排。Strong、Balanced、Weak 则继续区分矩阵内双方的相对权力。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 判断与分析<\/p><p><strong>Functional 职能型、Projectized 项目型、Matrix 矩阵型<\/strong>看汇报与权力安排；<strong>Strong / Balanced / Weak 强／平衡／弱<\/strong>看项目经理相对于职能经理的权力。<\/p><\/div><section class=\"concept\"><h2>三类组织结构<\/h2><p class=\"term\" lang=\"en\">Functional / Projectized / Matrix<\/p><p class=\"definition\">组织结构决定项目中的汇报关系、权力和资源安排。<\/p><p>公司平时按财务、工程、市场等部门工作。开发一个新产品时，需要这些部门共同完成任务：继续由各部门分别安排，是职能型；把人员集中到专门项目团队，是项目型；保留部门归属，同时接受项目安排，是矩阵型。<\/p><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">结构<\/th><th scope=\"col\">权力和汇报<\/th><th scope=\"col\">优点<\/th><th scope=\"col\">常见困难<\/th><\/tr><\/thead><tbody><tr><td>Functional 职能型<\/td><td>人员按专业部门组织，职能经理权力较大<\/td><td>专业支持稳定，员工职业归属明确<\/td><td>跨部门协调慢，项目整体关注不足<\/td><\/tr><tr><td>Projectized 项目型<\/td><td>团队围绕项目组织，项目经理权力较大<\/td><td>沟通直接，对项目目标负责<\/td><td>不同项目可能重复配置资源，结束后人员需重新安排<\/td><\/tr><tr><td>Matrix 矩阵型<\/td><td>人员同时受职能与项目两方面管理<\/td><td>共享专业资源，兼顾专业与项目需要<\/td><td>双重汇报可能造成优先级和资源冲突<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">矩阵类型<\/th><th scope=\"col\">主要判断<\/th><\/tr><\/thead><tbody><tr><td>Weak 弱矩阵<\/td><td>职能经理权力较大，项目协调者权力有限<\/td><\/tr><tr><td>Balanced 平衡矩阵<\/td><td>项目经理与职能经理共享权力<\/td><\/tr><tr><td>Strong 强矩阵<\/td><td>项目经理相对更强，更能控制项目工作和资源<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>开发人员隶属 IT 部门，同时向项目经理汇报预约系统任务，说明存在矩阵安排。若题目明确项目经理掌握主要项目决策权，更符合强矩阵。只看到“有项目经理”还不足以判断。<\/p><\/div><h3>沿汇报关系辨认结构<\/h3><p>以下箭头指向接受汇报的人。矩阵型中的工程师同时向 IT 经理和项目经理汇报。<\/p><div class=\"mini-grid\"><figure><div class=\"diagram\"><svg aria-label=\"Functional 组织结构，箭头指向接受汇报者\" role=\"img\" viewbox=\"0 0 310 245\" width=\"310\"><defs><marker id=\"org-Functional\" markerheight=\"6\" markerwidth=\"6\" orient=\"auto\" refx=\"5\" refy=\"3\"><path d=\"M0 0 L6 3 L0 6Z\" fill=\"#386481\"><\/path><\/marker><\/defs><path d=\"M70,180 L70,135\" marker-end=\"url(#org-Functional)\" stroke=\"#386481\"><\/path><path d=\"M240,180 L240,135\" marker-end=\"url(#org-Functional)\" stroke=\"#386481\"><\/path><path d=\"M70,100 L155,55\" marker-end=\"url(#org-Functional)\" stroke=\"#386481\"><\/path><path d=\"M240,100 L155,55\" marker-end=\"url(#org-Functional)\" stroke=\"#386481\"><\/path><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"95\" y=\"20\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"155\" y=\"43\">管理层<\/text><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"10\" y=\"100\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"70\" y=\"123\">IT 经理<\/text><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"180\" y=\"100\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"240\" y=\"123\">护理经理<\/text><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"10\" y=\"180\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"70\" y=\"203\">工程师<\/text><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"180\" y=\"180\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"240\" y=\"203\">护士<\/text><\/svg><\/div><figcaption>职能型：按专业部门汇报。<\/figcaption><\/figure><figure><div class=\"diagram\"><svg aria-label=\"Projectized 组织结构，箭头指向接受汇报者\" role=\"img\" viewbox=\"0 0 310 245\" width=\"310\"><defs><marker id=\"org-Projectized\" markerheight=\"6\" markerwidth=\"6\" orient=\"auto\" refx=\"5\" refy=\"3\"><path d=\"M0 0 L6 3 L0 6Z\" fill=\"#386481\"><\/path><\/marker><\/defs><path d=\"M70,180 L155,135\" marker-end=\"url(#org-Projectized)\" stroke=\"#386481\"><\/path><path d=\"M240,180 L155,135\" marker-end=\"url(#org-Projectized)\" stroke=\"#386481\"><\/path><path d=\"M155,100 L155,55\" marker-end=\"url(#org-Projectized)\" stroke=\"#386481\"><\/path><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"95\" y=\"20\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"155\" y=\"43\">管理层<\/text><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"95\" y=\"100\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"155\" y=\"123\">项目经理<\/text><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"10\" y=\"180\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"70\" y=\"203\">工程师<\/text><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"180\" y=\"180\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"240\" y=\"203\">护士<\/text><\/svg><\/div><figcaption>项目型：人员围绕项目经理组织。<\/figcaption><\/figure><figure><div class=\"diagram\"><svg aria-label=\"Matrix 组织结构，箭头指向接受汇报者\" role=\"img\" viewbox=\"0 0 310 245\" width=\"310\"><defs><marker id=\"org-Matrix\" markerheight=\"6\" markerwidth=\"6\" orient=\"auto\" refx=\"5\" refy=\"3\"><path d=\"M0 0 L6 3 L0 6Z\" fill=\"#386481\"><\/path><\/marker><\/defs><path d=\"M155,180 L70,135\" marker-end=\"url(#org-Matrix)\" stroke=\"#386481\"><\/path><path d=\"M155,180 L240,135\" marker-end=\"url(#org-Matrix)\" stroke=\"#386481\"><\/path><path d=\"M70,100 L155,55\" marker-end=\"url(#org-Matrix)\" stroke=\"#386481\"><\/path><path d=\"M240,100 L155,55\" marker-end=\"url(#org-Matrix)\" stroke=\"#386481\"><\/path><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"95\" y=\"20\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"155\" y=\"43\">管理层<\/text><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"10\" y=\"100\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"70\" y=\"123\">IT 经理<\/text><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"180\" y=\"100\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"240\" y=\"123\">项目经理<\/text><rect fill=\"#eaf2f8\" height=\"35\" stroke=\"#86a5bc\" width=\"120\" x=\"95\" y=\"180\"><\/rect><text fill=\"#193e5c\" font-size=\"14\" text-anchor=\"middle\" x=\"155\" y=\"203\">工程师<\/text><\/svg><\/div><figcaption>矩阵型：同时存在职能和项目汇报关系。<\/figcaption><\/figure><\/div><p><strong>矩阵的“强弱”说的是项目经理的相对权力。<\/strong>同一名工程师既向 IT 经理汇报，又接受项目经理安排，已经体现双重汇报；接下来才看谁掌握主要项目决策和资源权力。项目经理主导更接近 Strong Matrix，双方共享是 Balanced Matrix，职能经理主导更接近 Weak Matrix。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Functional organizations group staff by department. Projectized organizations assign staff to dedicated project teams. Matrix organizations combine functional and project reporting. In a weak matrix, the functional manager has greater authority and the project coordinator has limited authority. In a balanced matrix, the two managers share authority. In a strong matrix, the project manager has greater authority over project work and resources.<\/p><\/div><\/section>"},{"key":"L2/pmi-pmo","title":"PMI、人才三角与 PMO","html":"<p class=\"page-label\">L2 · PMI / PMP / PMO<\/p><h1>PMI、人才三角与 PMO<\/h1><p class=\"intro\">有人考取 PMP 认证，公司内部又设有 PMO。前者是个人取得的专业认证，后者是帮助组织开展项目的单位。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">老师提及 · 补入概念复习<\/p><p>区分 PMI、PMP 与 PMO；认识人才三角。<strong>Supportive 支持型、Controlling 控制型、Directive 指令型 PMO<\/strong>的控制程度依次增加。<\/p><\/div><section class=\"concept\"><h2>专业组织与人才三角<\/h2><p class=\"term\" lang=\"en\">PMI / PMP / PMI Talent Triangle<\/p><p class=\"definition\">PMI 是 Project Management Institute，项目管理协会，成立于 1969 年。PMP 是 Project Management Professional，项目管理专业人士认证。PMBOK 是项目管理知识体系。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">人才三角<\/th><th scope=\"col\">含义<\/th><th scope=\"col\">例子<\/th><\/tr><\/thead><tbody><tr><td>Ways of Working 工作方式<\/td><td>选择和运用合适的项目管理方法<\/td><td>根据需求变化选择迭代方式<\/td><\/tr><tr><td>Power Skills 人际与领导技能<\/td><td>通过沟通、领导、协作影响团队<\/td><td>协调开发与医院人员的分歧<\/td><\/tr><tr><td>Business Acumen 商业敏锐度<\/td><td>理解业务目标、战略与价值<\/td><td>判断项目如何改善服务并支持组织目标<\/td><\/tr><\/tbody><\/table><\/div><p>Power Skills 在这里强调沟通与领导能力，不能仅凭 Power 一词理解为职位权力。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The PMI Talent Triangle includes Ways of Working, Power Skills and Business Acumen. These cover project methods, interpersonal and leadership skills, and understanding business context and value.<\/p><\/div><\/section><p class=\"bridge\">PMI 是专业组织，PMP 是个人取得的认证。公司内部若需要一个单位统一提供模板、要求项目遵守规范，或直接管理项目，则涉及下面的 PMO。<\/p><section class=\"concept\"><h2>项目管理办公室<\/h2><p class=\"term\" lang=\"en\">Project Management Office (PMO)<\/p><p class=\"definition\">PMO 是支持、规范或直接管理项目的组织单位。不同类型的控制程度不同。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">形式<\/th><th scope=\"col\">控制程度<\/th><th scope=\"col\">实际做法<\/th><\/tr><\/thead><tbody><tr><td>Supportive 支持型<\/td><td>低<\/td><td>提供模板、培训、建议和资源<\/td><\/tr><tr><td>Controlling 控制型<\/td><td>中<\/td><td>要求项目遵守统一流程与标准<\/td><\/tr><tr><td>Directive 指令型<\/td><td>高<\/td><td>直接管理项目<\/td><\/tr><\/tbody><\/table><\/div><p>例如，PMO 只提供进度模板与培训，是 Supportive 支持型；要求所有项目按统一流程报告，是 Controlling 控制型；直接安排经理并管理项目，是 Directive 指令型。比较的是它对项目的控制程度。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A PMO is an organizational unit that supports or governs project management. A supportive PMO provides advice and resources; a controlling PMO requires compliance with standards; a directive PMO directly manages projects.<\/p><\/div><\/section>"},{"key":"L2/culture","title":"组织文化与冲突处理","html":"<p class=\"page-label\">L2 · Organizational Culture / Conflict Resolution<\/p><h1>组织文化与冲突处理<\/h1><p class=\"intro\">同样遇到项目延期，有的组织鼓励尽早报告，有的组织让员工担心说出问题。成员共同认可的信念和行为会影响项目怎样开展。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">老师明确举例 · 名词解释<\/p><p><strong>Identifying Cultural Characteristics 识别文化特征的四种方法<\/strong>，以及<strong>Key Factors that Affect Culture Development 影响文化形成的七个因素<\/strong>，是两组不同的答题内容。文化含义与五种冲突处理方式一并辨认。<\/p><\/div><section class=\"concept\"><h2>组织文化<\/h2><p class=\"term\" lang=\"en\">Organizational culture<\/p><p class=\"definition\">组织文化是成员共享的规范、信念、价值观与假设。它影响成员如何理解工作、与人相处，以及哪些行为受到认可。<\/p><div class=\"example\"><span class=\"small-label\">例子<\/span><p>医院强调及时报告问题，并表扬主动报告的人，员工就更可能尽早说明项目风险。如果只奖励“看上去没有问题”，员工可能不愿报告偏差。<\/p><\/div><p>文化可以提供认同感，解释管理制度，明确行为标准，并帮助组织维持共同的工作秩序。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Organizational culture is a system of shared norms, beliefs, values and assumptions that creates shared meanings and guides behavior in an organization.<\/p><\/div><\/section><p class=\"bridge\">共享的信念很难直接看见，可以先观察组织环境、文字资料和日常行为，从这些线索识别文化。<\/p><section class=\"concept\"><h2>怎样识别文化特征<\/h2><p class=\"term\" lang=\"en\">Identifying cultural characteristics<\/p><p class=\"definition\">通过组织的环境、文字资料、日常交往和流传的故事，观察它重视什么。<\/p><p>要了解一家组织的文化，可以先观察：经理是否与员工坐在一起，员工怎样报告问题，内部故事经常表扬什么人。这些可见的线索帮助你判断组织实际重视什么。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">方法<\/th><th scope=\"col\">可以观察什么<\/th><\/tr><\/thead><tbody><tr><td>Study physical characteristics 观察实体环境<\/td><td>办公室布局、公共空间、身份标志<\/td><\/tr><tr><td>Read about the organization 阅读组织资料<\/td><td>规章、宣传资料、内部刊物<\/td><\/tr><tr><td>Observe interactions 观察人际交往<\/td><td>员工如何提问、汇报、讨论分歧<\/td><\/tr><tr><td>Interpret stories and folklore 理解组织故事<\/td><td>哪些人物和行为经常被赞赏或批评<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Cultural characteristics can be identified by studying an organization’s physical characteristics, reading about the organization, observing how people interact, and interpreting its stories and folklore. These reveal the values and behaviors that the organization recognizes.<\/p><\/div><\/section><p class=\"bridge\">识别方法回答“怎样看出文化是什么”；形成因素回答“哪些条件使大家形成这样的行为习惯”。例如，观察员工怎样合作属于识别，分析奖励制度如何鼓励合作属于解释成因。<\/p><section class=\"concept\"><h2>影响文化形成的因素<\/h2><p class=\"term\" lang=\"en\">Key factors that affect culture development<\/p><p class=\"definition\">组织使用的技术、所处环境、地点、奖惩、规章、关键人物和重大事件，都会影响文化形成。<\/p><p>另一道问题可能问：为什么这家组织形成了这样的文化？例如，经常奖励团队合作，会鼓励成员互相协助；一次严重事故可能促使组织更重视报告风险。这里要回答文化形成的原因，不能把上一表的观察方法照抄过来。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">因素<\/th><th scope=\"col\">怎样影响行为<\/th><\/tr><\/thead><tbody><tr><td>Technology 技术<\/td><td>改变工作方式、协作要求<\/td><\/tr><tr><td>Environment 环境<\/td><td>外部竞争和制度影响组织的选择<\/td><\/tr><tr><td>Geographical location 地理位置<\/td><td>当地习惯和社会条件影响交往<\/td><\/tr><tr><td>Reward systems 奖励制度<\/td><td>受到奖励的行为更容易延续<\/td><\/tr><tr><td>Rules and procedures 规则与流程<\/td><td>规定日常工作如何进行<\/td><\/tr><tr><td>Key organizational members 关键成员<\/td><td>领导者和重要成员示范被认可的行为<\/td><\/tr><tr><td>Critical incidents 重大事件<\/td><td>事故、成功或危机可能改变组织习惯<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Culture development is affected by technology, the environment, geographical location, reward systems, rules and procedures, key organizational members and critical incidents. For example, a reward system that recognizes teamwork encourages people to cooperate.<\/p><\/div><\/section><p class=\"bridge\">不同成员可能带着不同的工作习惯和优先级。出现分歧后，还要辨认他们实际怎样处理冲突，下面五种方式按行为区分。<\/p><section class=\"concept\"><h2>五种冲突处理方式<\/h2><p class=\"term\" lang=\"en\">Conflict resolution<\/p><p class=\"definition\">处理分歧时，可以回避、迁就、竞争、妥协或合作。判断题要看各方实际采取了什么行为。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">方式<\/th><th scope=\"col\">行为<\/th><th scope=\"col\">项目例子<\/th><\/tr><\/thead><tbody><tr><td>Avoidance 回避<\/td><td>暂不处理或退出争论<\/td><td>把这次分歧搁置<\/td><\/tr><tr><td>Accommodation 迁就<\/td><td>让对方的需要优先<\/td><td>一方放弃自己的时间安排，接受另一方方案<\/td><\/tr><tr><td>Competition 竞争<\/td><td>坚持自己的目标，争取胜出<\/td><td>一方利用权力决定采用自己的方案<\/td><\/tr><tr><td>Compromise 妥协<\/td><td>双方各作让步<\/td><td>双方分别让出部分资源<\/td><\/tr><tr><td>Collaboration 合作<\/td><td>共同分析需要，寻找同时满足主要诉求的办法<\/td><td>重新设计安装时段，使病人服务和施工需求都得到满足<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Compromise 妥协<\/strong>是双方各作让步；<strong>Collaboration 合作<\/strong>是共同找办法满足主要需要。双方把问题搁置、暂不处理，属于 Avoidance 回避。仅凭“没有继续争吵”，还不能判断他们已经解决问题、达成合作。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Avoidance postpones or withdraws from the conflict. Accommodation gives priority to the other party’s needs. Competition pursues one party’s own goals. Compromise involves mutual concessions. Collaboration seeks a solution that addresses the underlying needs of both sides.<\/p><\/div><\/section>"},{"key":"L3/scope","title":"先确定项目范围","html":"<p class=\"page-label\">L3 · 概念与区别<\/p><h1>先确定项目范围<\/h1><p class=\"intro\">范围明确之后，才能知道需要分解哪些工作、估算多少工期和费用，以及由谁承担责任。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 概念与区别<\/p><p><strong>先确定 Project Scope 项目范围<\/strong>，再分解工作、估算时间与费用。区分“成果有什么功能”与“团队要完成什么工作”。<\/p><\/div><section class=\"concept\"><h2>产品范围与项目范围<\/h2><p class=\"term\" lang=\"en\">Product scope / Project scope<\/p><p class=\"definition\">Product scope 是产品或服务的特征与功能；Project scope 是为交付这些成果而需要完成的工作。范围管理要保证完成全部必要工作，并控制不属于项目的工作。<\/p><p>假设医院要交付一套预约系统。“患者能查询时段、预约和取消”描述系统应有的功能；“分析需求、开发、测试、培训并上线”描述团队为交付它要做的工作。前者是 <strong>Product Scope 产品范围<\/strong>，后者是 <strong>Project Scope 项目范围<\/strong>。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">问题<\/th><th scope=\"col\">范围<\/th><th scope=\"col\">医院预约系统的例子<\/th><\/tr><\/thead><tbody><tr><td>产品能做什么？<\/td><td>Product scope 产品范围<\/td><td>显示门诊时段、预约、取消预约<\/td><\/tr><tr><td>团队要做什么才能交付？<\/td><td>Project scope 项目范围<\/td><td>分析需求、设计、开发、测试、培训、上线<\/td><\/tr><\/tbody><\/table><\/div><p>明确范围后，才能可靠地分解工作、安排人员、估算时间和费用。新增功能或工作需要评估并处理相应变更。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Product scope describes the features and functions of a product, service or result. Project scope describes the work required to deliver it. Project scope management ensures that the project includes all the work required, and only the work required, for successful completion.<\/p><\/div><\/section>"},{"key":"L3/requirements","title":"需求及其类型","html":"<p class=\"page-label\">L3 · Requirement / Types of Requirements<\/p><h1>需求及其类型<\/h1><p class=\"intro\">要确定范围，需要先知道为什么做这个项目、使用者需要什么、成果必须满足什么条件。“减少患者等待”和“系统允许取消预约”就属于不同层次的需求。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 老师明确举例：名词解释<\/p><p><strong>Types of Requirements 需求类型<\/strong>要能列出六类并说明含义；Solution Requirements 解决方案需求继续分为功能与非功能需求。不增加需求改写任务。<\/p><\/div><section class=\"concept\"><h2>需求的类型<\/h2><p class=\"term\" lang=\"en\">Types of requirements<\/p><p class=\"definition\">Requirement 是为满足业务需要或约定条件而必须具备的能力、条件或特性。需求类型按它说明的问题区分。<\/p><p>同一项目可以有不同层次的需求。医院为什么要做、护士需要什么、系统必须能做什么，问的是不同问题。先找题目描述的对象，再判断需求类型。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">类型<\/th><th scope=\"col\">回答什么<\/th><th scope=\"col\">例子<\/th><\/tr><\/thead><tbody><tr><td>Business requirements 业务需求<\/td><td>组织为什么做<\/td><td>减少患者预约等待<\/td><\/tr><tr><td>Stakeholder requirements 干系人需求<\/td><td>具体相关方需要什么<\/td><td>护士希望能查看当日预约名单<\/td><\/tr><tr><td>Solution requirements 解决方案需求<\/td><td>成果具备什么功能或属性<\/td><td>Functional：允许取消预约；Nonfunctional：指定负载下响应不超过 2 秒<\/td><\/tr><tr><td>Transition and readiness requirements 过渡与就绪需求<\/td><td>怎样顺利切换和投入使用<\/td><td>迁移旧数据；完成上线培训<\/td><\/tr><tr><td>Project requirements 项目需求<\/td><td>项目执行需满足什么条件<\/td><td>按规定时间交付进度报告<\/td><\/tr><tr><td>Quality requirements 质量需求<\/td><td>以什么质量标准判断是否符合<\/td><td>通过约定测试标准并记录检查结果<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\">非功能需求描述性能、可靠性等属性；质量需求规定评价是否合格的标准。情景可能涉及多种需求，做单选时应按题干明确强调的对象判断。<\/div><p>例如“患者可以取消预约”说的是系统提供的能力，属于 <strong>Functional Requirement 功能需求<\/strong>；“在指定负载下，两秒内响应”说的是运行表现，属于 <strong>Nonfunctional Requirement 非功能需求<\/strong>。两者都在 Solution Requirements 解决方案需求之下。名词解释若问 Types of Requirements，要回答六类，不能只回答功能／非功能两类。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Business requirements explain why the project is undertaken. Stakeholder requirements describe the needs of specific stakeholders. Solution requirements specify the product’s functional capabilities and nonfunctional attributes. Transition and readiness requirements support the move to the future state, such as data migration and training. Project requirements specify conditions that the project must meet. Quality requirements define criteria used to evaluate successful completion and compliance.<\/p><\/div><\/section>"},{"key":"L3/statement","title":"项目范围说明书","html":"<p class=\"page-label\">L3 · Project Scope Statement<\/p><h1>项目范围说明书<\/h1><p class=\"intro\">把需求整理清楚后，还要约定本次交付哪些成果、哪些不做、怎样验收。Project Scope Statement 项目范围说明书记录这些边界，对应速记中的“范围承诺书”。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 范围说明<\/p><p><strong>Project Scope Statement 项目范围说明书<\/strong>对应速记中的“范围承诺书”。六项内容要能区分，尤其是成果、验收标准、约束与假设。<\/p><\/div><section class=\"concept\"><h2>项目范围说明书<\/h2><p class=\"term\" lang=\"en\">Project scope statement<\/p><p class=\"definition\">范围说明书写清成果边界，以及接受成果所依据的条件。它使团队和干系人对交付内容形成共同理解。<\/p><p>团队如果只说“交付预约系统”，仍可能不知道是否要做网上付款、培训多少人、怎样才算验收通过。范围说明书把这些边界和条件写清楚，后续才有一致的工作依据。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">内容<\/th><th scope=\"col\">含义<\/th><th scope=\"col\">预约系统示例<\/th><\/tr><\/thead><tbody><tr><td>Product scope description 产品范围描述<\/td><td>成果有哪些特征与功能<\/td><td>支持查询、预约和取消<\/td><\/tr><tr><td>Acceptance criteria 验收标准<\/td><td>怎样判断可以接受<\/td><td>在约定测试中正确保存和取消预约<\/td><\/tr><tr><td>Deliverables 可交付成果<\/td><td>实际交付哪些结果<\/td><td>可用系统、用户手册、培训材料<\/td><\/tr><tr><td>Exclusions 排除事项<\/td><td>明确不包含什么<\/td><td>本期不包含网上付款<\/td><\/tr><tr><td>Constraints 约束<\/td><td>必须遵守的限制<\/td><td>在指定日期前上线，预算有上限<\/td><\/tr><tr><td>Assumptions 假设<\/td><td>计划时暂按成立处理的条件<\/td><td>医院按计划提供合格的测试数据<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Deliverable 可交付成果<\/strong>是交什么，例如可用系统；<strong>Acceptance Criteria 验收标准<\/strong>是按什么条件接受它，例如通过约定功能测试。<strong>Constraint 约束<\/strong>是必须遵守的限制；<strong>Assumption 假设<\/strong>是计划时暂按成立处理的条件。假设后来不成立，需要重新评估计划。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A project scope statement includes the product scope description, acceptance criteria, deliverables, exclusions, constraints and assumptions. The product scope describes features and functions. Deliverables are the results to be provided, and acceptance criteria specify the conditions for accepting them. Exclusions identify what is outside the scope. Constraints are limits that must be respected. Assumptions are conditions treated as true for planning.<\/p><\/div><\/section><p class=\"bridge\">有了明确的验收标准，才能在成果完成后判断是否可以交付。这里接着区分“检查合格”和“客户正式接受”。<\/p><section class=\"concept\"><h2>检查成果合格，与正式接受成果<\/h2><p class=\"term\">Control Quality 控制质量 · Validate Scope 确认范围<\/p><p>范围说明书写下了成果和验收标准。完成工作后，测试人员先检查系统是否符合要求，客户再根据约定正式接受成果。这两种行为关注的对象不同。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">行为<\/th><th scope=\"col\">对应概念<\/th><\/tr><\/thead><tbody><tr><td>测试预约是否被正确保存，记录检查结果<\/td><td>Control Quality 控制质量：检查成果是否符合质量要求。<\/td><\/tr><tr><td>客户按约定验收标准正式接受预约系统<\/td><td>Validate Scope 确认范围：正式接受已完成的可交付成果。<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">Control Quality checks whether deliverables meet their quality requirements. Validate Scope formalizes acceptance of the completed project deliverables.<\/p><\/div><\/section>"},{"key":"L3/wbs","title":"WBS、分解法与工作包","html":"<p class=\"page-label\">L3 · 选择题概念<\/p><h1>WBS、分解法与工作包<\/h1><p class=\"intro\">明确项目范围之后，团队要把需要完成的工作逐层分开，才能估算和分工。WBS 展示这种组成关系，最低层称为工作包。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 概念辨认<\/p><p><strong>Decomposition 分解法用于构建 WBS；Work Package 工作包是最低层。<\/strong>会辨认分解步骤、100% Rule 百分之百规则及命名、编号规则。免画完整 WBS 大题，概念仍须掌握。<\/p><\/div><section class=\"concept\"><h2>工作分解结构<\/h2><p class=\"term\" lang=\"en\">Work Breakdown Structure (WBS)<\/p><p class=\"definition\">WBS 是对项目全部工作范围的层级分解。Decomposition 分解法把较大的成果或工作逐步分成更小、便于管理的部分。<\/p><p>范围说明书已经确定要交付什么，接下来要把这些工作分成可以安排的部分。Decomposition 分解法就是逐层细分：上一级叫 Parent 父项，它下面拆出的各部分叫 Children 子项。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">分解步骤<\/th><th scope=\"col\">在预约系统项目中怎样做<\/th><\/tr><\/thead><tbody><tr><td>Identify and analyse deliverables and work<br/>识别成果与相关工作<\/td><td>列出系统、用户手册、培训等约定成果，以及完成它们所需的工作。<\/td><\/tr><tr><td>Structure and organize the WBS<br/>组织层级<\/td><td>把系统交付、上线准备、项目管理与收尾等工作分别归组。<\/td><\/tr><tr><td>Decompose upper levels<br/>继续细分<\/td><td>把系统交付进一步分成预约功能、取消功能等便于管理的部分。<\/td><\/tr><tr><td>Assign identification codes<br/>给各项编号<\/td><td>例如 1 是系统交付，1.1 是其中的预约功能。编号表示层级归属，不表示开始顺序。<\/td><\/tr><tr><td>Verify the degree of decomposition<br/>检查分得是否合适<\/td><td>检查是否能估算工期与费用、分配责任、判断完成情况；过大则继续分，重复或只有同义子项则调整。<\/td><\/tr><\/tbody><\/table><\/div><p>下面的 WBS 片段按这个思路组织。连线说明哪些工作组成上一级，工作先后顺序另用活动网络安排。<\/p><div class=\"tree\">预约系统项目<br/>├─ 系统交付<br/>│　├─ 预约功能<br/>│　└─ 取消功能<br/>├─ 上线准备<br/>│　├─ 数据迁移<br/>│　└─ 人员培训<br/>└─ 项目管理与收尾<\/div><p>这个层级片段说明“组成关系”。不能按方框左右位置推断哪个活动先做。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">规则<\/th><th scope=\"col\">如何检查<\/th><\/tr><\/thead><tbody><tr><td>100% Rule 百分之百规则<\/td><td>同一父项下的子项合起来覆盖父项的全部工作<\/td><\/tr><tr><td>No duplication 不重复<\/td><td>同一项工作不放进两个不同分支<\/td><\/tr><tr><td>没有遗漏<\/td><td>包括必要的规划、管理和收尾<\/td><\/tr><tr><td>分解有意义<\/td><td>避免一个父项下面只有一个同义子项<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>把整辆汽车想成父项，各部件合起来应当组成完整汽车。少了必要部件，不能算完成；同一个部件重复列在两处，也会造成重复计算。项目的 100% Rule 百分之百规则同样要求子项完整覆盖父项约定的工作，包括必要的管理与收尾。<\/p><\/div><p><strong>低层工作名称用动词写清动作<\/strong>，例如“开发预约功能”“测试取消功能”，英文可用 Develop、Test、Install 开头。完成后，还要对照 Project Charter 项目章程中获批的目标与要求，检查计划做的、采购的工作是否都已包括。<\/p><div class=\"note\">老师用 AON、WBS、Gantt Chart 三个名称提问的是：<strong>Decomposition 分解法用于构建哪一种图？答案是 WBS。<\/strong>这几个板书名称不能直接解释成老师要求背诵的三步流程。<\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A WBS is a hierarchical decomposition of the total scope of work to be carried out by the project team. Decomposition breaks larger deliverables and work into smaller, more manageable components. The children of each parent must represent 100% of that parent’s work without duplication.<\/p><\/div><\/section><p class=\"bridge\">分解不能无限继续。团队已经能估算、分配责任并检查完成情况时，就可以把这一层作为工作包。下面用同一个预约功能说明工作包与后续活动安排的关系。<\/p><section class=\"concept\"><h2>工作包<\/h2><p class=\"term\" lang=\"en\">Work package<\/p><p class=\"definition\">Work package 是 WBS 最低层级的工作，可据此估算成本和工期、分配责任并进行管理。<\/p><div class=\"example\"><span class=\"small-label\">例子<\/span><p>“完成预约功能”若已小到可以估算、安排负责人并检查完成情况，可以作为工作包。它可能需要开发和测试人员合作；指定负责人不等于只能由一个人完成。<\/p><\/div><p>分解可按阶段、成果、工作类型、地点、费用、组织责任、服务或结果组织，选择能清楚表示项目范围的方式。工作包没有统一的“必须几天内完成”要求。<\/p><p>例如，“完成预约功能”可以作为工作包；排进度时，再列出设计、开发、测试等 Activity 活动并确定先后关系。<strong>WBS 说明项目由哪些工作组成；AON 安排这些活动直接等待谁；甘特图显示它们何时进行。<\/strong><\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A work package is the lowest-level component of a WBS. It contains work that can be estimated, assigned, monitored and controlled. One person may be accountable for the package while several people perform its work.<\/p><\/div><\/section><div class=\"note\">WBS 按概念、工作包和分解规则准备；不要求绘制完整 WBS 大题。<\/div>"},{"key":"L3/responsibility","title":"OBS 与 RAM：确定责任归属","html":"<p class=\"page-label\">L3 · Organizational Breakdown Structure / Responsibility Assignment Matrix<\/p><h1>OBS 与 RAM：确定责任归属<\/h1><p class=\"intro\">WBS 已列出需要完成的工作包。接下来还要决定哪个部门承担，以及每名成员具体负责什么。OBS 和 RAM 分别说明这两层责任。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 老师明确举例：RAM 名词解释<\/p><p><strong>OBS 组织分解结构把工作对应到组织；RAM 责任分配矩阵把任务对应到人员及其责任。<\/strong>英文解释 RAM 时可配一个小表，说明行、列与符号。<\/p><\/div><section class=\"concept\"><h2>组织分解结构<\/h2><p class=\"term\" lang=\"en\">Organizational Breakdown Structure (OBS)<\/p><p class=\"definition\">OBS 按组织或部门层级表示承担项目工作的人和单位。将工作包与组织单位对应，可以确定责任归属。<\/p><p>同一项目可能由软件部、数据部和培训部共同完成。先用 WBS 找出工作包，再用 OBS 确定哪个组织单位承担它，随后用 RAM 写清具体人员的责任。<\/p><div class=\"tree\">项目承担单位<br/>├─ 软件部 Software Department<br/>├─ 数据部 Data Department<br/>└─ 培训部 Training Department<\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">WBS 中的 Work Package 工作包<\/th><th scope=\"col\">OBS 中的负责单位<\/th><\/tr><\/thead><tbody><tr><td>完成预约功能<\/td><td>软件部<\/td><\/tr><tr><td>迁移预约数据<\/td><td>数据部<\/td><\/tr><tr><td>完成使用培训<\/td><td>培训部<\/td><\/tr><\/tbody><\/table><\/div><p>OBS 展示组织归属，这张对应表说明工作如何分给部门。部门承担一个工作包后，还需要进一步明确负责人和支持人员。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">An OBS is a hierarchical representation of the organizational units responsible for project work. It helps connect work packages with the departments or teams that carry responsibility.<\/p><\/div><\/section><p class=\"bridge\">“软件部承担预约功能”还没有说清具体谁做、谁批准。RAM 继续把任务与人员对应起来，并区分负责、支持、通知和批准等角色。<\/p><section class=\"concept\"><h2>责任分配矩阵<\/h2><p class=\"term\" lang=\"en\">Responsibility Assignment Matrix (RAM)<\/p><p class=\"definition\">RAM 以任务为行、人员为列，表示每个人在任务中的责任。先读图例，再读交叉格。<\/p><p>RAM 也称 <strong>Linear Responsibility Chart 线性责任图<\/strong>。把 WBS 中需要分工的任务写成行，把参与人员写成列，再按图例标出每个人在该任务中的责任。下表中的符号各有含义，不能把所有参与者都当成负责人。<\/p><div class=\"note\">○ Responsible 负责　☆ Support 支持　■ Notification 通知　□ Approval 批准<\/div><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">任务<\/th><th scope=\"col\">项目经理<\/th><th scope=\"col\">开发工程师<\/th><th scope=\"col\">护士代表<\/th><\/tr><\/thead><tbody><tr><td>确认预约规则<\/td><td>□<\/td><td>☆<\/td><td>○<\/td><\/tr><tr><td>开发预约功能<\/td><td>■<\/td><td>○<\/td><td>☆<\/td><\/tr><tr><td>验收预约功能<\/td><td>□<\/td><td>☆<\/td><td>○<\/td><\/tr><\/tbody><\/table><\/div><p>“开发预约功能”这一行表示开发工程师负责，护士代表支持，项目经理接收通知。空格表示表中未分配该角色。常见的 RACI 使用另一套字母，本题按这里给出的符号读写。<\/p><p><strong>构建一个小 RAM：<\/strong>列出任务和人员，确定每项任务由谁负责，再填写支持、通知或批准角色，最后按行读一遍，检查是否存在无人负责的任务。问名词解释时，英文定义配这样的小表就能说明矩阵如何工作。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">A responsibility assignment matrix (RAM), also called a linear responsibility chart, links project tasks to team members and shows their roles. Tasks form the rows and people form the columns. The legend identifies responsibility, support, notification and approval.<\/p><\/div><\/section>"},{"key":"L4/activities","title":"从活动信息表读出工作顺序","html":"<p class=\"page-label\">L4 · AON 作图<\/p><h1>从活动信息表读出工作顺序<\/h1><p class=\"intro\">Delta 是一项市场调查项目。先读清楚要完成哪些工作、每项需要多久，以及直接等待谁。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · Q1 AON 作图<\/p><p><strong>读懂 Activity 活动、Duration 工期、Immediate Predecessor 紧前活动<\/strong>。完整示例保留八项活动，不能把复杂网络简化成一条链。<\/p><\/div><section class=\"concept\"><h2>活动、工期与紧前活动<\/h2><p class=\"term\">Activity · Duration · Immediate predecessor<\/p><p class=\"definition\">Activity 活动是项目中一项需要完成的具体工作。Duration 工期是完成这项工作需要的时间。Immediate predecessor 紧前活动是它直接依赖的前一项活动。<\/p><p>例如，“开展抽样调查”是一项活动，需要 13 周。调查开始前必须设计好问卷，并确定目标市场；这两项就是调查的紧前活动。<\/p><p>活动信息表把编号、工作名称、工期和紧前活动放在一起。下面的 Delta 项目要为客户完成市场调查，最后汇报结果。全部工期以周计，从时点 0 开始。<\/p><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">活动<\/th><th scope=\"col\">具体工作<\/th><th scope=\"col\">工期 / 周<\/th><th scope=\"col\">紧前活动<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>签订合同<br/><span lang=\"en\">Contract signing<\/span><\/td><td>5<\/td><td>无<\/td><\/tr><tr><td>B<\/td><td>设计问卷<br/><span lang=\"en\">Questionnaire design<\/span><\/td><td>5<\/td><td>A<\/td><\/tr><tr><td>C<\/td><td>确定目标市场<br/><span lang=\"en\">Target market identification<\/span><\/td><td>6<\/td><td>A<\/td><\/tr><tr><td>D<\/td><td>开展抽样调查<br/><span lang=\"en\">Survey sample<\/span><\/td><td>13<\/td><td>B、C<\/td><\/tr><tr><td>E<\/td><td>制作汇报材料<br/><span lang=\"en\">Develop presentation<\/span><\/td><td>6<\/td><td>B<\/td><\/tr><tr><td>F<\/td><td>分析调查结果<br/><span lang=\"en\">Analyze results<\/span><\/td><td>4<\/td><td>D<\/td><\/tr><tr><td>G<\/td><td>分析人口特征<br/><span lang=\"en\">Demographic analysis<\/span><\/td><td>9<\/td><td>C<\/td><\/tr><tr><td>H<\/td><td>向客户汇报<br/><span lang=\"en\">Presentation to client<\/span><\/td><td>2<\/td><td>E、F、G<\/td><\/tr><\/tbody><\/table><\/div><div class=\"example\"><span class=\"small-label\">例子<\/span><p>D 这一行的意思是：开展抽样调查需要 13 周，必须等 B 设计问卷、C 确定目标市场都完成后才可以开始。A 通过 B、C 间接约束 D，因此不重复列为 D 的紧前活动。<\/p><\/div><div class=\"note\">本例采用 Finish-to-Start（FS）关系，没有额外时间间隔。紧前活动完成后，后续活动才可以开始；有多个紧前活动时，需要全部完成。<\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">An activity is a specific piece of project work. Its duration is the time required to complete it. An immediate predecessor is an activity that must directly precede it according to the dependency relationship.<\/p><\/div><\/section>"},{"key":"L4/aon","title":"根据活动表画 AON 关系图","html":"<p class=\"page-label\">L4 · 节点、箭头、汇合与分叉<\/p><h1>根据活动表画 AON 关系图<\/h1><p class=\"intro\">先把依赖关系画对，再计算时间。下面完整保留八项活动及其工作名称。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · Q1 AON 作图<\/p><p><strong>先画对依赖关系，再填时间。<\/strong>逐项画出紧前箭头；特别检查 Merge 汇合和 Burst 分叉，不能漏掉某个等待条件。<\/p><\/div><section class=\"concept\"><h2>AON 用节点表示活动<\/h2><p class=\"term\">Activity-on-Node network<\/p><p class=\"definition\">AON 把每项活动画成一个节点，用箭头表示活动之间的依赖关系。图中位置可以调整，箭头表达的先后条件应与活动表一致。<\/p><div class=\"screen-only\"><figure><div class=\"diagram\"><svg aria-label=\"Delta 的八活动 AON 依赖关系\" class=\"network\" role=\"img\" viewbox=\"0 0 860 550\" width=\"860\"><defs><marker id=\"delta-arrow-False\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#305e80\"><\/path><\/marker><\/defs><path d=\"M154,246.0 H167.0 V76.0 H180\" fill=\"none\" marker-end=\"url(#delta-arrow-False)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M154,246.0 H167.0 V411.0 H180\" fill=\"none\" marker-end=\"url(#delta-arrow-False)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M324,76.0 L350,246.0\" fill=\"none\" marker-end=\"url(#delta-arrow-False)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M324,411.0 L350,246.0\" fill=\"none\" marker-end=\"url(#delta-arrow-False)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M324,76.0 L350,36.0\" fill=\"none\" marker-end=\"url(#delta-arrow-False)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M494,246.0 H507.0 V246.0 H520\" fill=\"none\" marker-end=\"url(#delta-arrow-False)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M324,411.0 H422.0 V441.0 H520\" fill=\"none\" marker-end=\"url(#delta-arrow-False)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M494,36.0 H690 V246.0 H700\" fill=\"none\" marker-end=\"url(#delta-arrow-False)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M664,246.0 H682.0 V246.0 H700\" fill=\"none\" marker-end=\"url(#delta-arrow-False)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M664,441.0 H690 V246.0 H700\" fill=\"none\" marker-end=\"url(#delta-arrow-False)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><rect fill=\"#eef5fa\" height=\"72\" stroke=\"#365e7d\" stroke-width=\"1.4\" width=\"144\" x=\"10\" y=\"210\"><\/rect><text fill=\"#193e5c\" font-size=\"18\" text-anchor=\"middle\" x=\"82.0\" y=\"230\">A<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"82.0\" y=\"253\">签订合同<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"82.0\" y=\"272\">5 周<\/text><rect fill=\"#eef5fa\" height=\"72\" stroke=\"#365e7d\" stroke-width=\"1.4\" width=\"144\" x=\"180\" y=\"40\"><\/rect><text fill=\"#193e5c\" font-size=\"18\" text-anchor=\"middle\" x=\"252.0\" y=\"60\">B<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"252.0\" y=\"83\">设计问卷<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"252.0\" y=\"102\">5 周<\/text><rect fill=\"#eef5fa\" height=\"72\" stroke=\"#365e7d\" stroke-width=\"1.4\" width=\"144\" x=\"180\" y=\"375\"><\/rect><text fill=\"#193e5c\" font-size=\"18\" text-anchor=\"middle\" x=\"252.0\" y=\"395\">C<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"252.0\" y=\"418\">确定目标市场<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"252.0\" y=\"437\">6 周<\/text><rect fill=\"#eef5fa\" height=\"72\" stroke=\"#365e7d\" stroke-width=\"1.4\" width=\"144\" x=\"350\" y=\"210\"><\/rect><text fill=\"#193e5c\" font-size=\"18\" text-anchor=\"middle\" x=\"422.0\" y=\"230\">D<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"422.0\" y=\"253\">开展抽样调查<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"422.0\" y=\"272\">13 周<\/text><rect fill=\"#eef5fa\" height=\"72\" stroke=\"#365e7d\" stroke-width=\"1.4\" width=\"144\" x=\"350\" y=\"0\"><\/rect><text fill=\"#193e5c\" font-size=\"18\" text-anchor=\"middle\" x=\"422.0\" y=\"20\">E<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"422.0\" y=\"43\">制作汇报材料<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"422.0\" y=\"62\">6 周<\/text><rect fill=\"#eef5fa\" height=\"72\" stroke=\"#365e7d\" stroke-width=\"1.4\" width=\"144\" x=\"520\" y=\"210\"><\/rect><text fill=\"#193e5c\" font-size=\"18\" text-anchor=\"middle\" x=\"592.0\" y=\"230\">F<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"592.0\" y=\"253\">分析调查结果<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"592.0\" y=\"272\">4 周<\/text><rect fill=\"#eef5fa\" height=\"72\" stroke=\"#365e7d\" stroke-width=\"1.4\" width=\"144\" x=\"520\" y=\"405\"><\/rect><text fill=\"#193e5c\" font-size=\"18\" text-anchor=\"middle\" x=\"592.0\" y=\"425\">G<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"592.0\" y=\"448\">分析人口特征<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"592.0\" y=\"467\">9 周<\/text><rect fill=\"#eef5fa\" height=\"72\" stroke=\"#365e7d\" stroke-width=\"1.4\" width=\"144\" x=\"700\" y=\"210\"><\/rect><text fill=\"#193e5c\" font-size=\"18\" text-anchor=\"middle\" x=\"772.0\" y=\"230\">H<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"772.0\" y=\"253\">向客户汇报<\/text><text fill=\"#193e5c\" font-size=\"13\" text-anchor=\"middle\" x=\"772.0\" y=\"272\">2 周<\/text><\/svg><\/div><figcaption>单位：周。节点表示活动，箭头表示紧前关系。例如 D 必须同时等待 B 和 C；E 只等待 B。<\/figcaption><\/figure><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">结构<\/th><th scope=\"col\">在本题中的含义<\/th><\/tr><\/thead><tbody><tr><td>Serial 串行<\/td><td>D 开展调查 → F 分析调查结果 → H 向客户汇报，按依赖依次进行。<\/td><\/tr><tr><td>Concurrent 并行<\/td><td>B 设计问卷与 C 确定目标市场都等待 A，二者互不依赖，可以并行。<\/td><\/tr><tr><td>Merge 汇合<\/td><td>D 同时等待 B、C；H 同时等待 E、F、G。<\/td><\/tr><tr><td>Burst 分叉<\/td><td>A 完成后，B、C 都可以继续；B 完成后，D、E 才分别具备该项前置条件。<\/td><\/tr><\/tbody><\/table><\/div><p>画图时先为八项活动各画一个节点，再逐行读取紧前活动。例如 D 的紧前项为 B、C，就画 B→D、C→D。H 的紧前项为 E、F、G，就分别画三条进入 H 的箭头。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">In an AON network, nodes represent activities and arrows represent dependencies. A merge activity has more than one predecessor, while a burst activity has more than one successor.<\/p><\/div><\/section>"},{"key":"L4/times","title":"九宫格、正推与逆推","html":"<p class=\"page-label\">L4 · 九宫格计算<\/p><h1>九宫格、正推与逆推<\/h1><p class=\"intro\">关系图确定了谁等待谁。现在给每项工作安排时间：最早何时开始与完成？如果保持项目完工目标，最迟又能安排到何时？<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 九宫格计算<\/p><p><strong>正推取紧前 EF 的最大值，逆推取紧后 LS 的最小值。<\/strong>认识九宫格各位置、计算 ES/EF/LS/LF，并填写 SL 总时差。<\/p><\/div><section class=\"concept\"><h2>九宫格里的时间<\/h2><p class=\"term\" lang=\"en\">ES / EF / LS / LF / Duration / Slack<\/p><p class=\"definition\">ES、EF、LS、LF 表示从项目起点量起的时点；Duration 工期和 Slack 时差表示时间长度。本例单位为周，时点 7 表示项目开始后第 7 周这个边界。<\/p><p>“开展调查需要 13 周”说明持续多久；“第 11 周开始、第 24 周完成”说明安排在哪两个时点。九宫格把工期与最早、最迟的开始完成时间放在同一节点里，便于看出这项工作能否推迟。<\/p><div aria-label=\"AON 九宫格布局\" class=\"nine-demo\"><span>ES<br/>最早开始<\/span><span>ID<br/>活动编号<\/span><span>EF<br/>最早完成<\/span><span>SL<br/>总时差<\/span><span class=\"wide\">Description 活动描述<\/span><span>LS<br/>最迟开始<\/span><span>DUR<br/>工期<\/span><span>LF<br/>最迟完成<\/span><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">符号<\/th><th scope=\"col\">含义<\/th><\/tr><\/thead><tbody><tr><td>ES — Earliest Start<\/td><td>按依赖条件最早可以开始的时点<\/td><\/tr><tr><td>EF — Earliest Finish<\/td><td>最早完成时点，EF = ES + Duration<\/td><\/tr><tr><td>LS — Latest Start<\/td><td>不延迟项目完工的最迟开始时点<\/td><\/tr><tr><td>LF — Latest Finish<\/td><td>不延迟项目完工的最迟完成时点<\/td><\/tr><tr><td>SL — Total Slack<\/td><td>不延迟项目完工的余量，SL = LS − ES = LF − EF<\/td><\/tr><\/tbody><\/table><\/div><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">ES and EF are the earliest start and finish times. LS and LF are the latest start and finish times that do not delay project completion. Total slack is LS minus ES, or LF minus EF.<\/p><\/div><\/section><p class=\"bridge\">先求“最早能排到什么时候”。每项活动按已知工期向后安排，一直算到最后一次汇报，就得到项目最早能完成的时间。<\/p><section class=\"concept\"><h2>正推：计算最早开始与完成<\/h2><p class=\"term\">Forward pass<\/p><div class=\"formula\">ES = max（所有紧前活动的 EF）<br/>EF = ES + DUR<\/div><p>没有紧前活动的 A 从 0 开始。D 开展调查既需要问卷，也需要目标市场信息：B 在第 10 周完成，C 在第 11 周完成，D 要等到第 11 周。<strong>所有前提都满足才能开始，所以正推在汇合处取最大值。<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">活动<\/th><th scope=\"col\">ES 的依据<\/th><th scope=\"col\">EF 的计算<\/th><\/tr><\/thead><tbody><tr><td>A 签订合同<\/td><td>没有前项，ES=0<\/td><td>0+5=5<\/td><\/tr><tr><td>B 设计问卷<\/td><td>等待 A，ES=5<\/td><td>5+5=10<\/td><\/tr><tr><td>C 确定目标市场<\/td><td>等待 A，ES=5<\/td><td>5+6=11<\/td><\/tr><tr><td>D 开展调查<\/td><td>等待 B、C，ES=max(10,11)=11<\/td><td>11+13=24<\/td><\/tr><tr><td>E 制作汇报材料<\/td><td>等待 B，ES=10<\/td><td>10+6=16<\/td><\/tr><tr><td>F 分析调查结果<\/td><td>等待 D，ES=24<\/td><td>24+4=28<\/td><\/tr><tr><td>G 分析人口特征<\/td><td>等待 C，ES=11<\/td><td>11+9=20<\/td><\/tr><tr><td>H 向客户汇报<\/td><td>等待 E、F、G，ES=max(16,28,20)=28<\/td><td>28+2=30<\/td><\/tr><\/tbody><\/table><\/div><\/section><p class=\"bridge\">正推已经算出第 30 周可以完成。现在保持这个完工目标，反过来问：每项工作最迟什么时候必须做，项目才不会超过 30 周？这就是逆推要解决的问题。<\/p><section class=\"concept\"><h2>逆推：计算最迟开始与完成<\/h2><p class=\"term\">Backward pass<\/p><div class=\"formula\">LF = min（所有紧后活动的 LS）<br/>LS = LF − DUR<\/div><p>项目最早在第 30 周完成，以此作为本题逆推的完工目标。H 汇报需要 2 周，因此最迟第 28 周开始。再往前推，B 同时影响 D 和 E：D 最迟第 11 周开始，E 最迟第 22 周开始。B 必须在第 11 周前完成，否则 D 就来不及。<strong>必须同时满足所有后续限制，所以逆推在分叉处取最小值。<\/strong><\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">活动<\/th><th scope=\"col\">LF 的依据<\/th><th scope=\"col\">LS 的计算<\/th><\/tr><\/thead><tbody><tr><td>H 向客户汇报<\/td><td>项目完工时点 30<\/td><td>30−2=28<\/td><\/tr><tr><td>F 分析调查结果<\/td><td>H 的 LS=28<\/td><td>28−4=24<\/td><\/tr><tr><td>E 制作汇报材料<\/td><td>H 的 LS=28<\/td><td>28−6=22<\/td><\/tr><tr><td>G 分析人口特征<\/td><td>H 的 LS=28<\/td><td>28−9=19<\/td><\/tr><tr><td>D 开展调查<\/td><td>F 的 LS=24<\/td><td>24−13=11<\/td><\/tr><tr><td>B 设计问卷<\/td><td>D、E 的 LS 为 11、22，取 11<\/td><td>11−5=6<\/td><\/tr><tr><td>C 确定目标市场<\/td><td>D、G 的 LS 为 11、19，取 11<\/td><td>11−6=5<\/td><\/tr><tr><td>A 签订合同<\/td><td>B、C 的 LS 为 6、5，取 5<\/td><td>5−5=0<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\">正推在汇合处取最大，逆推在分叉处取最小。若有多个最终活动，逆推时都以同一个项目完工目标作为终点 LF。<\/div><\/section>"},{"key":"L4/paths","title":"完整九宫格与所有路径","html":"<p class=\"page-label\">L4 · Q1 AON，30 分<\/p><h1>完整九宫格与所有路径<\/h1><p class=\"intro\">正推得出最早完工时间，逆推得出最迟时间，再计算总时差并枚举路径。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · Q1，30 分<\/p><p><strong>枚举所有起点到终点的路径，写出各路径工期，标出 Critical Path 关键路径。<\/strong>本题逆推的完工目标取最早完工时间，因此关键活动的 SL=0。<\/p><\/div><section class=\"concept\"><h2>完整九宫格<\/h2><div class=\"formula\">SL = LS − ES = LF − EF<\/div><p>例如 B 设计问卷：SL=6−5=1 周。E 制作汇报材料：SL=22−10=12 周。<\/p><div class=\"screen-only\"><figure><div class=\"diagram\"><svg aria-label=\"Delta 的八活动 AON 九宫格计算结果\" class=\"network\" role=\"img\" viewbox=\"0 0 860 550\" width=\"860\"><defs><marker id=\"delta-arrow-True\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto\" refx=\"6\" refy=\"3.5\"><path d=\"M0 0 L7 3.5 L0 7Z\" fill=\"#305e80\"><\/path><\/marker><\/defs><path d=\"M154,267.0 H167.0 V97.0 H180\" fill=\"none\" marker-end=\"url(#delta-arrow-True)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M154,267.0 H167.0 V432.0 H180\" fill=\"none\" marker-end=\"url(#delta-arrow-True)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M324,97.0 L350,267.0\" fill=\"none\" marker-end=\"url(#delta-arrow-True)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M324,432.0 L350,267.0\" fill=\"none\" marker-end=\"url(#delta-arrow-True)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M324,97.0 L350,57.0\" fill=\"none\" marker-end=\"url(#delta-arrow-True)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M494,267.0 H507.0 V267.0 H520\" fill=\"none\" marker-end=\"url(#delta-arrow-True)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M324,432.0 H422.0 V462.0 H520\" fill=\"none\" marker-end=\"url(#delta-arrow-True)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M494,57.0 H690 V267.0 H700\" fill=\"none\" marker-end=\"url(#delta-arrow-True)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M664,267.0 H682.0 V267.0 H700\" fill=\"none\" marker-end=\"url(#delta-arrow-True)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><path d=\"M664,462.0 H690 V267.0 H700\" fill=\"none\" marker-end=\"url(#delta-arrow-True)\" stroke=\"#305e80\" stroke-width=\"1.7\"><\/path><rect fill=\"#eef5fa\" height=\"114\" stroke=\"#365e7d\" stroke-width=\"1.4\" width=\"144\" x=\"10\" y=\"210\"><\/rect><path d=\"M10,248 H154 M10,286 H154 M58,210 V324 M106,210 V248 M106,286 V324\" fill=\"none\" stroke=\"#62839b\"><\/path><text fill=\"#193e5c\" font-size=\"10\" text-anchor=\"middle\" x=\"34\" y=\"223\">ES<\/text><text fill=\"#193e5c\" font-size=\"17\" text-anchor=\"middle\" x=\"34\" y=\"241\">0<\/text><text fill=\"#193e5c\" font-size=\"10\" text-anchor=\"middle\" x=\"82\" y=\"223\  周<\/th><\/tr><\/thead><tbody><tr><td>A → B → D → F → H<\/td><td>5 + 5 + 13 + 4 + 2<\/td><td>29<\/td><\/tr><tr><td>A → B → E → H<\/td><td>5 + 5 + 6 + 2<\/td><td>18<\/td><\/tr><tr><td>A → C → D → F → H<\/td><td>5 + 6 + 13 + 4 + 2<\/td><td>30<\/td><\/tr><tr><td>A → C → G → H<\/td><td>5 + 6 + 9 + 2<\/td><td>22<\/td><\/tr><\/tbody><\/table><\/div><p><strong>最长路径为 A→C→D→F→H，合计 30 周。<\/strong>即使其他路径先做完，项目仍要等这条路径完成。沿每条分支走到终点，把经过的活动工期相加，就能检查是否列全。按本题完工目标逆推，关键活动总时差为 0；若多条路径同为最长，就有多条关键路径。<\/p><div class=\"english\"><span class=\"eyebrow\">英文参考表达<\/span><p lang=\"en\">The critical path is A–C–D–F–H. Its duration is 5 + 6 + 13 + 4 + 2 = 30 weeks, so the expected project duration is 30 weeks.<\/p><\/div><details><summary>保持关系不变，改变工期后的结果<\/summary><p>把 A 改为 6 周、D 改为 12 周、E 改为 8 周、F 改为 7 周、H 改为 3 周；B、C、G 保持原值。重新计算如下。<\/p><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">活动<\/th><th scope=\"col\">具体工作<\/th><th scope=\"col\">工期 / 周<\/th><th scope=\"col\">紧前活动<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>签订合同<br/><span lang=\"en\">Contract signing<\/span><\/td><td>6<\/td><td>无<\/td><\/tr><tr><td>B<\/td><td>设计问卷<br/><span lang=\"en\">Questionnaire design<\/span><\/td><td>5<\/td><td>A<\/td><\/tr><tr><td>C<\/td><td>确定目标市场<br/><span lang=\"en\">Target market identification<\/span><\/td><td>6<\/td><td>A<\/td><\/tr><tr><td>D<\/td><td>开展抽样调查<br/><span lang=\"en\">Survey sample<\/span><\/td><td>12<\/td><td>B、C<\/td><\/tr><tr><td>E<\/td><td>制作汇报材料<br/><span lang=\"en\">Develop presentation<\/span><\/td><td>8<\/td><td>B<\/td><\/tr><tr><td>F<\/td><td>分析调查结果<br/><span lang=\"en\">Analyze results<\/span><\/td><td>7<\/td><td>D<\/td><\/tr><tr><td>G<\/td><td>分析人口特征<br/><span lang=\"en\">Demographic analysis<\/span><\/td><td>9<\/td><td>C<\/td><\/tr><tr><td>H<\/td><td>向客户汇报<br/><span lang=\"en\">Presentation to client<\/span><\/td><td>3<\/td><td>E、F、G<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table class=\"wide-table\"><thead><tr><th scope=\"col\">活动<\/th><th scope=\"col\">ES<\/th><th scope=\"col\">EF<\/th><th scope=\"col\">LS<\/th><th scope=\"col\">LF<\/th><th scope=\"col\">SL<\/th><\/tr><\/thead><tbody><tr><td>A 签订合同<\/td><td>0<\/td><td>6<\/td><td>0<\/td><td>6<\/td><td>0<\/td><\/tr><tr><td>B 设计问卷<\/td><td>6<\/td><td>11<\/td><td>7<\/td><td>12<\/td><td>1<\/td><\/tr><tr><td>C 确定目标市场<\/td><td>6<\/td><td>12<\/td><td>6<\/td><td>12<\/td><td>0<\/td><\/tr><tr><td>D 开展抽样调查<\/td><td>12<\/td><td>24<\/td><td>12<\/td><td>24<\/td><td>0<\/td><\/tr><tr><td>E 制作汇报材料<\/td><td>11<\/td><td>19<\/td><td>23<\/td><td>31<\/td><td>12<\/td><\/tr><tr><td>F 分析调查结果<\/td><td>24<\/td><td>31<\/td><td>24<\/td><td>31<\/td><td>0<\/td><\/tr><tr><td>G 分析人口特征<\/td><td>12<\/td><td>21<\/td><td>22<\/td><td>31<\/td><td>10<\/td><\/tr><tr><td>H 向客户汇报<\/td><td>31<\/td><td>34<\/td><td>31<\/td><td>34<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">路径<\/th><th scope=\"col\">工期 / 周<\/th><\/tr><\/thead><tbody><tr><td>A → B → D → F → H<\/td><td>33<\/td><\/tr><tr><td>A → B → E → H<\/td><td>22<\/td><\/tr><tr><td>A → C → D → F → H<\/td><td>34<\/td><\/tr><tr><td>A → C → G → H<\/td><td>24<\/td><\/tr><\/tbody><\/table><\/div><p>关键路径仍为 A→C→D→F→H，总工期改为 34 周。下页的延误例子以及 Z-score 例子仍采用原题的 30 周。<\/p><\/details><\/section>"},{"key":"L4/slack","title":"总时差、自由时差与延误影响","html":"<p class=\"page-label\">L4 · 延误判断<\/p><h1>总时差、自由时差与延误影响<\/h1><p class=\"intro\">活动推迟后，需要分别判断紧后活动的最早开始是否变化，以及项目完工是否变化。<\/p><div class=\"exam-focus\"><p class=\"focus-label\">必考范围 · 延误影响<\/p><p><strong>Total Slack 总时差看项目完工；Free Slack 自由时差看紧后活动的最早开始。<\/strong>Free Slack 保留理解与影响判断，不单独要求计算；九宫格中的 SL 仍须填写。<\/p><\/div><section class=\"concept\"><h2>推迟活动，会影响项目完工还是后续安排？<\/h2><p class=\"term\">Total Slack 总时差 · Free Slack 自由时差<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">名称<\/th><th scope=\"col\">含义<\/th><th scope=\"col\">原题中的例子<\/th><\/tr><\/thead><tbody><tr><td>Total Slack，TS 或 TF<br/>总时差<\/td><td>活动可以延迟多少而不推迟项目完工。九宫格内写 SL。<\/td><td
