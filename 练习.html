concept":"maturity"},{"id":"match-professional-names","topic":"L2/pmi-pmo","type":"match","stem":"组织、认证与知识体系","context":"按名称的实际含义配对。","choices":["专业组织","专业认证","知识体系"],"rows":[{"text":"PMI — Project Management Institute","answer":0,"why":"PMI 是项目管理协会，成立于 1969 年。"},{"text":"PMP — Project Management Professional","answer":1,"why":"PMP 是项目管理专业人士认证。"},{"text":"PMBOK — Project Management Body of Knowledge","answer":2,"why":"PMBOK 指项目管理知识体系。"}],"concept":"pmi"},{"id":"match-talent-skills","topic":"L2/pmi-pmo","type":"match","stem":"从行动判断专业技能","context":"选择当前行动最直接体现的技能。","choices":["Ways of Working","Power Skills","Business Acumen"],"rows":[{"text":"根据需求变化程度，选择合适的迭代或计划方法","answer":0,"why":"工作方式涉及项目方法的选择与使用。"},{"text":"沟通分歧、协调团队并带领人员合作","answer":1,"why":"Power Skills 强调人际与领导能力。"},{"text":"判断项目成果如何支持组织战略与业务收益","answer":2,"why":"Business Acumen 关注业务背景和价值。"}],"concept":"pmi"},{"id":"match-stakeholder-members","topic":"L2/stakeholders","type":"match","stem":"内部与外部干系人","context":"以开展项目的组织为边界，按以下角色所在位置分类。","choices":["Internal 内部","External 外部"],"rows":[{"text":"本组织高层管理者 Top management","answer":0,"why":"位于组织内部，可能批准项目或资源。"},{"text":"本组织会计人员 Accountant","answer":0,"why":"组织内部的财务参与者。"},{"text":"本组织职能经理 Functional managers","answer":0,"why":"组织内部的专业部门管理者。"},{"text":"本组织项目团队成员 Project team members","answer":0,"why":"在组织内部执行项目工作。"},{"text":"购买项目成果的外部客户 Clients","answer":1,"why":"外部客户会受到成果影响。"},{"text":"竞争组织 Competitors","answer":1,"why":"位于组织外部，也可能影响项目。"},{"text":"外部供应商 Suppliers","answer":1,"why":"从组织外部提供产品或服务。"},{"text":"外部环保、政治或消费者团体","answer":1,"why":"可能受影响或影响项目的外部相关群体。"}],"concept":"stakeholder"},{"id":"match-structure-cases","topic":"L2/structures","type":"match","stem":"从汇报和资源安排判断结构","context":"每段只描述一种主要组织安排。","choices":["Functional 职能型","Projectized 项目型","Matrix 矩阵型"],"rows":[{"text":"专业人员留在职能部门，由部门经理安排工作；项目协调依靠部门之间协商","answer":0,"why":"主要权力和人员归属在职能部门。"},{"text":"专门为项目组建团队，项目经理直接管理团队工作","answer":1,"why":"人员围绕项目组织。"},{"text":"工程师保留部门归属，同时向职能经理和项目经理汇报","answer":2,"why":"存在职能与项目双重管理。"}],"concept":"structure"},{"id":"match-matrix-strength","topic":"L2/structures","type":"match","stem":"同样是矩阵，谁有决定权","context":"按题目明确给出的相对权力判断。","choices":["Weak 弱矩阵","Balanced 平衡矩阵","Strong 强矩阵"],"rows":[{"text":"职能经理控制主要资源，项目协调者权力有限","answer":0,"why":"职能经理相对更强。"},{"text":"项目经理与职能经理共享主要决策权","answer":1,"why":"两者共享权力。"},{"text":"项目经理在项目决策与资源安排上明显更强","answer":2,"why":"项目经理相对更强。"}],"concept":"structure"},{"id":"match-pmo-forms","topic":"L2/pmi-pmo","type":"match","stem":"从 PMO 的实际行动判断形式","context":"选择对应的控制形式。","choices":["Supportive 支持型","Controlling 控制型","Directive 指令型"],"rows":[{"text":"提供可选模板、咨询和培训","answer":0,"why":"低控制，以支持为主。"},{"text":"要求各项目采用规定流程并接受合规检查","answer":1,"why":"中等控制，要求遵守标准。"},{"text":"直接管理项目并负责项目执行","answer":2,"why":"高控制，直接管理。"}],"concept":"pmo"},{"id":"match-culture-methods","topic":"L2/culture","type":"match","stem":"识别文化特征的四种方法","context":"观察方法与文化形成因素是不同问题。","choices":["Study physical characteristics","Read about the organization","Observe interactions","Interpret stories and folklore"],"rows":[{"text":"观察办公室布局、公共空间与身份标志","answer":0,"why":"从实体环境寻找组织重视的内容。"},{"text":"阅读规章、宣传资料与内部刊物","answer":1,"why":"从文字资料了解组织如何描述自己的要求。"},{"text":"观察员工如何提问、汇报及讨论分歧","answer":2,"why":"从交往行为了解实际规范。"},{"text":"了解组织中反复讲述、表扬或批评的故事","answer":3,"why":"故事反映被赞赏或否定的行为。"}],"concept":"culture-identify"},{"id":"match-culture-seven","topic":"L2/culture","type":"match","stem":"影响文化形成的七项因素","context":"每段强调一个具体因素。","choices":["Technology","Environment","Geographical location","Reward systems","Rules and procedures","Key organizational members","Critical incidents"],"rows":[{"text":"采用新协作工具，改变了员工共享信息的方式","answer":0,"why":"技术改变工作和协作方式。"},{"text":"外部竞争加剧，组织更重视快速回应客户","answer":1,"why":"组织所处环境影响行为选择。"},{"text":"当地交往习惯影响团队沟通方式","answer":2,"why":"地理位置关联当地社会和文化条件。"},{"text":"奖金开始奖励团队结果，而非只奖励个人产出","answer":3,"why":"奖励制度改变受到鼓励的行为。"},{"text":"审批流程规定所有变更都要记录","answer":4,"why":"规则与流程引导日常工作。"},{"text":"创始人持续示范坦诚报告问题","answer":5,"why":"关键人物的行为会影响组织习惯。"},{"text":"一次重大事故促使组织重新重视安全报告","answer":6,"why":"重大事件可能改变共同价值和做法。"}],"concept":"culture-factors"},{"id":"match-scope-fields","topic":"L3/statement","type":"match","stem":"范围说明中的六项内容","context":"医院准备交付预约系统，把每条信息放入对应字段。","choices":["Product scope description","Acceptance criteria","Deliverables","Exclusions","Constraints","Assumptions"],"rows":[{"text":"系统允许查询门诊时段、预约和取消预约","answer":0,"why":"描述产品功能。"},{"text":"指定测试中，预约和取消结果须正确保存","answer":1,"why":"说明按什么条件接受成果。"},{"text":"交付可用系统、用户手册和培训材料","answer":2,"why":"列明实际交付结果。"},{"text":"本期不提供网上付款","answer":3,"why":"明确不包含的内容。"},{"text":"不得超过批准的预算上限","answer":4,"why":"必须遵守的限制。"},{"text":"计划时假设医院按时提供合格测试数据","answer":5,"why":"暂按成立处理的条件。"}],"concept":"scope-statement"},{"id":"match-network-terms","topic":"L4/aon","type":"match","stem":"活动之间的不同关系","context":"按每句话强调的结构特征分类。","choices":["Concurrent 并行","Serial 串行","Merge 汇合","Burst 分支"],"rows":[{"text":"B 和 C 在条件满足后可以同时开展，彼此不用等待","answer":0,"why":"没有相互依赖，可以并行安排。"},{"text":"先完成 A，再开展 B，之后开展 D","answer":1,"why":"活动按先后顺序开展。"},{"text":"F 直接等待 D 和 E 两项活动","answer":2,"why":"F 有多个紧前活动，是汇合。"},{"text":"A 完成后，B 和 C 两项活动都可以继续","answer":3,"why":"A 有多个紧后活动，是分支。"}],"concept":"activity-table"},{"id":"match-cost-pairs","topic":"L5/costs","type":"match","stem":"按指定角度判断成本","context":"每行已明确比较角度，避免把不同分类混为一组。","choices":["Direct 直接","Indirect 间接","Recurring 经常性","Nonrecurring 一次性","Fixed 固定","Variable 可变","Normal 正常","Expedited 加速"],"rows":[{"text":"按归属判断：材料只用于本项目这项安装工作","answer":0,"why":"可直接追溯到该项目工作。"},{"text":"按归属判断：多个项目共用的行政开支","answer":1,"why":"支持多项工作，属于间接开支。"},{"text":"按发生频率判断：项目各周反复发生的人工费用","answer":2,"why":"费用在项目期间持续重复发生。"},{"text":"按发生频率判断：项目启动时仅做一次的市场分析","answer":3,"why":"一次性发生。"},{"text":"按使用量判断：约定租期内金额不变的设备租金","answer":4,"why":"不随该范围内的使用量变化。"},{"text":"按使用量判断：每增加一件产品，就增加一份材料费","answer":5,"why":"费用随使用量增加。"},{"text":"按速度方案判断：常规安排下预计的运输费","answer":6,"why":"对应正常实施方案。"},{"text":"按速度方案判断：为提前到货而另付的加急费","answer":7,"why":"为加快完成而增加费用。"}],"concept":"cost-categories"},{"id":"match-risk-types","topic":"L6/rbs","type":"match","stem":"按来源整理风险","context":"每项选择题目强调的主要来源。","choices":["Financial","Technical","Commercial","Execution","Contractual or legal"],"rows":[{"text":"项目可能无法按计划获得资金","answer":0,"why":"资金来源属于财务风险。"},{"text":"新旧系统接口可能不兼容","answer":1,"why":"技术方案可行性风险。"},{"text":"竞争服务可能减少市场需求","answer":2,"why":"市场与竞争属于商业风险。"},{"text":"关键人员可能缺勤或被调走","answer":3,"why":"人员可用性影响执行。"},{"text":"合同条款可能产生责任争议","answer":4,"why":"合同解释和责任属于合同或法律风险。"}],"concept":"rbs"},{"id":"match-risk-methods","topic":"L6/rbs","type":"match","stem":"风险识别的方法","context":"按团队实际使用的信息与过程分类。","choices":["Brainstorming","Expert opinion","Past history","Team-based assessments"],"rows":[{"text":"召集成员自由提出可能出问题的情景","answer":0,"why":"头脑风暴用于广泛提出风险。"},{"text":"请有相关经验的专业人员判断风险来源","answer":1,"why":"利用专家意见。"},{"text":"查阅同类项目的事故与延期记录","answer":2,"why":"利用历史资料。"},{"text":"由多个成员分别评估后共同讨论","answer":3,"why":"多人或团队评估。"}],"concept":"rbs"},{"id":"match-response-measures","topic":"L6/responses","type":"match","stem":"措施怎样作用于风险","context":"选择措施在该情景中的主要作用。","choices":["Transfer 转移","Contingency reserve 应急储备","Workaround 临时应对","Minimize 降低"],"rows":[{"text":"通过保险把约定的财务损失交由保险方承担","answer":0,"why":"保险转移指定财务后果，不保证事件不发生。"},{"text":"预留资金，以便已识别风险发生后使用","answer":1,"why":"储备用于承担后果，不等于消除风险。"},{"text":"事件发生后，团队临时找到替代操作方法","answer":2,"why":"这是事发后采取的临时应对。"},{"text":"指导新员工，并让备用人员交叉学习关键工作","answer":3,"why":"培训与备用技能降低人员风险的影响。"}],"concept":"responses"},{"id":"match-risk-boundaries","topic":"L6/risk-score","type":"match","stem":"风险等级的边界","context":"按 RF 数值分类：低于 0.30；0.30 至 0.70（含两端）；高于 0.70。","choices":["Low risk","Medium risk","High risk"],"rows":[{"text":"RF = 0.29","answer":0,"why":"0.29 小于 0.30。"},{"text":"RF = 0.30","answer":1,"why":"下边界包含在中风险。"},{"text":"RF = 0.70","answer":1,"why":"上边界仍属于中风险。"},{"text":"RF = 0.71","answer":2,"why":"0.71 严格大于 0.70。"}],"concept":"rf"},{"id":"new-114","topic":"L1/project","type":"mc","stem":"医院每年都举办健康讲座。今年单独组队策划一次新主题讲座，活动结束后解散。怎样判断今年的策划工作？","context":"","options":[{"zh":"只有使用新技术才属于 Project。","en":"","why":"独特性不要求技术必须创新。"},{"zh":"只有活动持续不到一年才属于 Project。","en":"","why":"临时性表示有起止，不等于短期。"},{"zh":"属于 Project 项目，重复举办不消除本次任务的独特目标与结束条件。","en":"","why":"判断整体任务。这次有特定主题、成果和结束条件。"},{"zh":"属于 Operations 运营，因为每年都举办。","en":"","why":"周期性出现类似项目，不等于每次策划都属于持续运营。"}],"answer":[2]},{"id":"new-115","topic":"L1/project","type":"multi","stem":"项目完成后进入持续运营。以下哪些描述正确？","context":"","options":[{"zh":"项目内部可以包含重复工作。","en":"","why":"例如反复测试；这不改变整体任务的临时性与独特性。"},{"zh":"持续制造同一型号产品，每生产一件都自动成为一个项目。","en":"","why":"持续重复提供同类产品通常属于运营，不能只凭产品编号不同判断。"},{"zh":"Temporary 表示项目不能持续多年。","en":"","why":"多年项目也可以有明确结束条件。"},{"zh":"项目的结束与成果停止使用，是不同的时点。","en":"","why":"项目可以在验收交付后结束，系统随后继续用于运营。"}],"answer":[0,3]},{"id":"new-116","topic":"L1/value","type":"mc","stem":"题目问 Intangible Values。哪种英文作答包含定义和适当例子？","context":"","options":[{"zh":"Non-physical benefits, such as goodwill and reputation.","en":"","why":"同时说明非实物收益，并给出商誉、声誉两个例子。"},{"zh":"Benefits that cannot affect organizational performance.","en":"","why":"无形价值仍可能影响组织绩效。"},{"zh":"Physical assets that are difficult to price.","en":"","why":"难以定价不等于无形；实物资产仍是有形要素。"},{"zh":"Future benefits that have not yet been obtained.","en":"","why":"是否已经取得与有形、无形的分类不同。"}],"answer":[0]},{"id":"new-117","topic":"L1/value","type":"mc","stem":"按本课的价值分类，哪项组合正确？","context":"","options":[{"zh":"Tangible：所有内部收益；Intangible：所有外部收益。","en":"","why":"内外部受益者与收益形式是不同维度。"},{"zh":"Tangible：设备、货币资产；Intangible：商誉、品牌认知。","en":"","why":"按教材给出的分类辨认要素。"},{"zh":"Tangible：商誉、声誉；Intangible：设备、货币资产。","en":"","why":"把两组类别反过来了。"},{"zh":"Tangible：只包括盈利；Intangible：只包括亏损。","en":"","why":"这不是收益正负的分类。"}],"answer":[1]},{"id":"new-118","topic":"L1/constraints","type":"mc","stem":"新增一个预约功能，交付日期不变。团队提出增加人手。这个情景中，哪种关系最准确？","context":"","options":[{"zh":"增加人手只影响 Quality，不影响 Cost。","en":"","why":"人工资源通常直接涉及成本。"},{"zh":"Scope 与 Cost 必须按相同百分比增加。","en":"","why":"没有这种固定比例规则。"},{"zh":"范围增加可能增加工作量，增加资源可能增加成本；还要评估时间与质量。","en":"","why":"说明约束之间的联系，没有假定增加人手必然解决所有问题。"},{"zh":"日期不变，Time 就完全不受影响。","en":"","why":"仍需评估能否按原日期完成。"}],"answer":[2]},{"id":"new-119","topic":"L1/constraints","type":"multi","stem":"三重约束图中，Scope、Time、Cost 位于三个顶点，Quality 位于中央。哪些解释成立？","context":"","options":[{"zh":"保持质量可能限制可接受的赶工方案。","en":"","why":"加快进度仍需满足质量要求。"},{"zh":"Quality 在中央，所以可以直接从计划中删去。","en":"","why":"图中央强调关联，不表示可省略。"},{"zh":"三项约束可以分别独立承诺，无需协调。","en":"","why":"独立承诺容易造成无法同时满足的计划。"},{"zh":"改变范围时，应同时评估工期与成本安排。","en":"","why":"三项约束相互关联。"}],"answer":[0,3]},{"id":"new-120","topic":"L1/process-life","type":"mc","stem":"系统仍在安装，项目经理同时比较实际与计划，并重新安排下一周。应怎样理解？","context":"","options":[{"zh":"执行阶段可以同时包含 Executing、Monitoring and Controlling 等管理工作。","en":"","why":"生命周期描述阶段，过程组按管理目的分类，两者不一一对应。"},{"zh":"出现监控，就表示执行阶段已经结束。","en":"","why":"监控可以贯穿执行。"},{"zh":"重新安排下周，必须把项目重新归为启动阶段。","en":"","why":"调整规划不等于重新启动整个项目。"},{"zh":"五个过程组必须在时间上完全互斥。","en":"","why":"过程组可以在项目中交叠和反复发生。"}],"answer":[0]},{"id":"new-121","topic":"L1/process-life","type":"mc","stem":"下列工作中，哪项最符合 Closing 收尾？","context":"","options":[{"zh":"确定后续安装工作的预算与人员。","en":"","why":"属于 Planning 规划。"},{"zh":"移交成果、释放项目资源并记录经验。","en":"","why":"这是结束项目或阶段的工作。"},{"zh":"取得开始项目的授权。","en":"","why":"属于 Initiating 启动。"},{"zh":"比较本周实际工作量与进度基准。","en":"","why":"属于 Monitoring and Controlling 监控。"}],"answer":[1]},{"id":"new-122","topic":"L1/methods","type":"multi","stem":"第一轮上线门诊查询，第二轮增加预约功能，第三轮依据反馈修改查询界面。哪些判断正确？","context":"","options":[{"zh":"增量意味着前面交付的部分以后不能修改。","en":"","why":"增量与迭代可以同时使用。"},{"zh":"迭代只指重复开会，不需要实际进展。","en":"","why":"每轮应取得能够检查的实际进展。"},{"zh":"第二轮增加功能体现 Incremental 增量。","en":"","why":"增量强调逐步增加成果或功能。"},{"zh":"第三轮改进已有界面体现 Iterative 迭代。","en":"","why":"迭代强调在反馈中反复完善。"}],"answer":[2,3]},{"id":"new-123","topic":"L1/methods","type":"mc","stem":"经理的进度计算正确，但两个部门争用同一台设备，计划仍无法执行。Social/Sociocultural 方面主要需要处理什么？","context":"","options":[{"zh":"重新背诵 ES 与 EF 的公式即可。","en":"","why":"公式不能单独解决部门间的冲突。"},{"zh":"只更换进度软件。","en":"","why":"工具变化未必解决资源协调。"},{"zh":"把项目的整体责任分散给软件。","en":"","why":"项目经理仍承担协调与整体绩效责任。"},{"zh":"协调部门需求与资源优先级。","en":"","why":"人的合作、谈判和组织关系属于社会文化方面。"}],"answer":[3]},{"id":"new-124","topic":"L1/maturity","type":"mc","stem":"一家组织有统一模板，但项目人员从不使用，也没有培训或复盘。能否仅凭模板数量认定成熟度高？","context":"","options":[{"zh":"不能，需要看方法是否持续应用并得到改进。","en":"","why":"成熟度关注实际管理实践，文件数量本身不够。"},{"zh":"能，成熟度就是已保存文件的数量。","en":"","why":"把产物数量误当成实践能力。"},{"zh":"能，只要模板使用英文。","en":"","why":"文件语言不是成熟度依据。"},{"zh":"不能，因为研究项目都不允许使用统一方法。","en":"","why":"没有“研究项目必定无法标准化”的规则。"}],"answer":[0]},{"id":"new-125","topic":"L1/maturity","type":"mc","stem":"客户要求更具体、产品更新更快、多个小项目同时开展。这些条件为何增加项目管理需求？","context":"","options":[{"zh":"产品更新越快，跨部门协调的需要越少。","en":"","why":"更新更快通常增加交付时限和协调压力。"},{"zh":"团队更需要协调目标、资源与相互影响。","en":"","why":"这些是项目管理需求增长的具体原因。"},{"zh":"它们说明每个项目都应该取消范围边界。","en":"","why":"要求复杂时更需要明确范围。"},{"zh":"它们说明只要控制费用就足够。","en":"","why":"范围、时间、人员等也需要协调。"}],"answer":[1]},{"id":"new-126","topic":"L1/areas","type":"mc","stem":"采购设备、分配岗位、跟踪延期，分别最直接对应哪些知识领域？","context":"","options":[{"zh":"Stakeholder、Communications、Procurement Management。","en":"","why":"这组没有正确对应采购、岗位和延期。"},{"zh":"三个都只属于 Integration Management。","en":"","why":"整合协调跨领域关系，不取代各领域的具体职责。"},{"zh":"Procurement、Human Resource、Time Management。","en":"","why":"分别管理采购、人员与进度。"},{"zh":"Cost、Scope、Quality Management。","en":"","why":"费用、范围、质量有关联，但不是这三个动作最直接的管理对象。"}],"answer":[2]},{"id":"new-127","topic":"L1/areas","type":"multi","stem":"项目新增网上付款，经理同时评估时间、费用和风险。哪些领域与情景直接对应？","context":"","options":[{"zh":"Integration Management：协调多个领域受到的影响。","en":"","why":"整合关注整体协调。"},{"zh":"Closing：只要改功能就表示项目结束。","en":"","why":"这里是变更评估，并非收尾。"},{"zh":"Operations：只要功能涉及付款，就必然是运营。","en":"","why":"创建新功能仍可属于项目。"},{"zh":"Scope Management：新增功能改变范围。","en":"","why":"功能纳入项目，范围发生变化。"}],"answer":[0,3]},{"id":"new-128","topic":"L2/sites","type":"mc","stem":"医院购入一套全新的系统，但安装地点是现有门诊楼，并需兼容旧管线。按 Project Site 分类应选什么？","context":"","options":[{"zh":"Brownfield 既有场地。","en":"","why":"判断场地原有设施与约束，系统是否全新不改变这一点。"},{"zh":"Greenfield 全新场地。","en":"","why":"把新产品与全新场地混淆了。"},{"zh":"两类都不适用，因为它是软件项目。","en":"","why":"题目问安装地点，已有设施仍可以形成场地约束。"},{"zh":"只凭系统价格无法判断。","en":"","why":"题目已给出足够的场地条件，无需价格。"}],"answer":[0]},{"id":"new-129","topic":"L2/sites","type":"mc","stem":"空地新建诊所属于 Greenfield。这个判断排除了哪一类约束？","context":"","options":[{"zh":"全部进度限制。","en":"","why":"项目仍有时间要求。"},{"zh":"已有工程和设施形成的场地约束。","en":"","why":"Greenfield 的区别在于没有先前开发的设施需要兼容。"},{"zh":"新项目不再需要考虑既有公共管网的连接。","en":"","why":"空地新建仍可能要接入公共管网。"},{"zh":"新项目不再需要评估场地的地质条件。","en":"","why":"Greenfield 仍有场地本身的地质条件。"}],"answer":[1]},{"id":"new-130","topic":"L2/tows","type":"mc","stem":"医院团队缺少开发经验，同时出现政府培训资助。哪项行动同时回应 W 和 O？","context":"","options":[{"zh":"只记录“缺少经验”，不提出行动。","en":"","why":"识别 W 不等于形成 WO 策略。"},{"zh":"把外部资助归类为内部优势。","en":"","why":"资助来自外部，属于机会。"},{"zh":"利用资助培训开发人员，补足经验。","en":"","why":"W 是内部能力不足，O 是外部资助机会，两者都进入行动。"},{"zh":"强调医院现有临床经验以应对竞争。","en":"","why":"这是 S 与 T 的组合。"}],"answer":[2]},{"id":"new-131","topic":"L2/tows","type":"mc","stem":"竞争加剧，团队英文写作较弱。应怎样构建 WT 格中的行动？","context":"","options":[{"zh":"只写“努力学习”。","en":"","why":"没有说明回应哪项弱点、如何应对竞争。"},{"zh":"把竞争加剧列为 Strength。","en":"","why":"竞争加剧是外部不利条件 T。"},{"zh":"只列出有利的奖学金机会。","en":"","why":"这描述 O，未回应题目的 W 与 T。"},{"zh":"针对写作不足改进申请材料，并准备多个合适的申请选项，以降低落选风险。","en":"","why":"同时回应内部劣势与外部威胁。"}],"answer":[3]},{"id":"new-132","topic":"L2/stakeholders","type":"mc","stem":"同一组织的财务负责人很少参加项目会议，却有权否决资源申请。为什么不能把他直接放入“低权力”一格？","context":"","options":[{"zh":"关注程度低与影响决策的能力低，是两个不同判断。","en":"","why":"Interest 低不推出 Power 低；资源审批体现权力。"},{"zh":"内部干系人的权力必定都高。","en":"","why":"内部身份本身不能确定权力。"},{"zh":"不参加会议的人自动属于外部干系人。","en":"","why":"内外分类以组织边界为依据。"},{"zh":"Power 指参加会议的次数。","en":"","why":"Power 指影响决策或资源的能力。"}],"answer":[0]},{"id":"new-133","topic":"L2/stakeholders","type":"mc","stem":"护士代表一直高度关注系统。她后来获得关键功能批准权，应怎样调整 Power/Interest 定位？","context":"","options":[{"zh":"移到低权力、低关注，采用 Monitor。","en":"","why":"与新增批准权及持续高关注都不符。"},{"zh":"由低权力、高关注移到高权力、高关注，采用 Manage Closely。","en":"","why":"改变的是权限，关注程度保持高。"},{"zh":"移到高权力、低关注，采用 Keep Satisfied。","en":"","why":"题目没有说关注程度降低。"},{"zh":"维持低权力，因为她仍是护士。","en":"","why":"应依据实际权限，而非职位刻板印象。"}],"answer":[1]},{"id":"new-134","topic":"L2/cooperation","type":"mc","stem":"某关键供应商愿意合作，也能因停供使项目中断。后来它不再配合排期，供货能力不变。矩阵位置怎样变化？","context":"","options":[{"zh":"仍属 Supportive，因为曾经配合过。","en":"","why":"应按当前条件判断，原本也有高威胁。"},{"zh":"只能按 Power/Interest 的四种策略回答。","en":"","why":"两套矩阵的维度和策略不同。"},{"zh":"从高合作、高威胁移到低合作、高威胁。","en":"","why":"合作潜力下降，造成损害的能力仍高。"},{"zh":"从高合作、高威胁移到高合作、低威胁。","en":"","why":"题目改变的是合作，未降低威胁能力。"}],"answer":[2]},{"id":"new-135","topic":"L2/cooperation","type":"multi","stem":"哪些条件能够同时成立？","context":"","options":[{"zh":"干系人不太参与，也难以影响项目。","en":"","why":"这对应低合作、低威胁。"},{"zh":"只要愿意合作，就必然没有威胁。","en":"","why":"合作与威胁两轴独立。"},{"zh":"只要威胁高，就必然属于 Non-Supportive。","en":"","why":"高合作、高威胁属于 Mixed Blessing。"},{"zh":"干系人愿意帮忙，同时有能力阻止项目。","en":"","why":"高合作与高威胁可以同时存在。"}],"answer":[0,3]},{"id":"new-136","topic":"L2/structures","type":"mc","stem":"工程师保留 IT 部门归属，同时接受项目经理安排；重大资源冲突主要由职能经理决定。最符合什么结构？","context":"","options":[{"zh":"Weak Matrix 弱矩阵。","en":"","why":"存在双重汇报，且职能经理的相对权力更大。"},{"zh":"Strong Matrix 强矩阵。","en":"","why":"强矩阵通常由项目经理掌握较大项目权力。"},{"zh":"Projectized 项目型。","en":"","why":"题目明确保留职能归属和双重管理。"},{"zh":"Balanced Matrix 平衡矩阵。","en":"","why":"题目给出了职能经理主导，未描述共享权力。"}],"answer":[0]},{"id":"new-137","topic":"L2/structures","type":"mc","stem":"Strong、Balanced、Weak 主要比较什么？","context":"","options":[{"zh":"项目团队成员的人数。","en":"","why":"人数不是矩阵强弱的定义。"},{"zh":"项目经理与职能经理的相对权力。","en":"","why":"这是矩阵强弱的判断对象。"},{"zh":"项目预算的绝对金额。","en":"","why":"预算大不自动意味着强矩阵。"},{"zh":"员工的专业能力强弱。","en":"","why":"专业能力不决定矩阵类别。"}],"answer":[1]},{"id":"new-138","topic":"L2/pmi-pmo","type":"mc","stem":"PMI、PMP 与 PMO 应怎样对应？","context":"","options":[{"zh":"三个都是公司内部部门。","en":"","why":"PMI 与 PMP 不是公司内部部门。"},{"zh":"三个都是项目生命周期阶段。","en":"","why":"它们与阶段分类无关。"},{"zh":"专业组织、个人专业认证、组织内部的项目管理办公室。","en":"","why":"三者分别是机构、认证与组织单位。"},{"zh":"个人认证、组织内部单位、专业组织。","en":"","why":"三个缩写的对应颠倒。"}],"answer":[2]},{"id":"new-139","topic":"L2/pmi-pmo","type":"mc","stem":"PMO 要求所有项目按统一流程报告，但项目经理仍负责日常执行。最符合哪种形式？","context":"","options":[{"zh":"Supportive 支持型。","en":"","why":"仅提供建议、培训与模板不足以描述强制要求。"},{"zh":"Directive 指令型。","en":"","why":"题目未体现 PMO 直接管理项目执行。"},{"zh":"Balanced Matrix 平衡矩阵。","en":"","why":"这是组织结构分类，不是 PMO 的形式。"},{"zh":"Controlling 控制型。","en":"","why":"体现对流程遵从的要求。"}],"answer":[3]},{"id":"new-140","topic":"L2/culture","type":"mc","stem":"“阅读员工手册”和“奖励团队成果”分别属于哪两类内容？","context":"","options":[{"zh":"识别文化的方法；影响文化形成的因素。","en":"","why":"前者获取文化线索，后者通过奖惩影响行为。"},{"zh":"文化形成因素；识别文化的方法。","en":"","why":"把观察方法与形成原因颠倒了。"},{"zh":"两个都是文化识别的同一种方法。","en":"","why":"奖励制度是文化成因之一。"},{"zh":"两个都是解决冲突的 Competition。","en":"","why":"这两个描述没有直接给出竞争式处理冲突。"}],"answer":[0]},{"id":"new-141","topic":"L2/culture","type":"mc","stem":"两组各退让一部分资源，与两组共同重新排程满足双方主要需要，分别对应什么？","context":"","options":[{"zh":"Accommodation 迁就；Avoidance 回避。","en":"","why":"迁就是优先满足对方，回避是暂不处理，不符合情景。"},{"zh":"Compromise 妥协；Collaboration 合作。","en":"","why":"前者相互让步，后者共同解决主要需要。"},{"zh":"Collaboration 合作；Compromise 妥协。","en":"","why":"两种行为的核心特征反了。"},{"zh":"Avoidance 回避；Competition 竞争。","en":"","why":"两组都在处理问题，没有搁置，也没有单方压制。"}],"answer":[1]},{"id":"new-142","topic":"L3/scope","type":"mc","stem":"“患者可取消预约”和“开发、测试并交付取消功能”，分别描述什么？","context":"","options":[{"zh":"两者都只描述项目成本。","en":"","why":"题目没有给费用，而是在界定功能和工作。"},{"zh":"两者都只是验收结果。","en":"","why":"题目还没有描述正式接受成果。"},{"zh":"Product Scope 产品范围；Project Scope 项目范围。","en":"","why":"前者描述成果功能，后者描述交付成果所需工作。"},{"zh":"Project Scope；Product Scope。","en":"","why":"把成果具有什么功能与团队做什么工作颠倒了。"}],"answer":[2]},{"id":"new-143","topic":"L3/scope","type":"mc","stem":"为什么要先确定项目范围，再分解工作、估算时间与费用？","context":"","options":[{"zh":"因为确定范围后，任何需求都不能再调整。","en":"","why":"范围明确不等于永远不允许变更。"},{"zh":"因为范围只决定人员姓名。","en":"","why":"具体人员责任主要在后续责任分配中确定。"},{"zh":"因为范围与验收要求没有联系。","en":"","why":"验收条件是范围说明的重要内容。"},{"zh":"要先知道需要交付什么和完成哪些工作，才能估算。","en":"","why":"工作量是分解和估算的依据。"}],"answer":[3]},{"id":"new-144","topic":"L3/requirements","type":"mc","stem":"医院的业务目标是减少等待；护士提出需要快速找到当天的预约。这两项需求分别属于什么？","context":"","options":[{"zh":"Business Requirements；Stakeholder Requirements。","en":"","why":"前者说明项目为什么做，后者说明特定干系人的需要。"},{"zh":"两项都属于 Transition and Readiness Requirements。","en":"","why":"切换准备是迁移、培训等为进入新状态所需的工作。"},{"zh":"Quality Requirements；Project Requirements。","en":"","why":"题目没有描述质量判据或项目执行条件。"},{"zh":"Functional；Nonfunctional，且它们就是全部需求类型。","en":"","why":"功能与非功能是解决方案需求的下分，不代表六类需求的全部。"}],"answer":[0]},{"id":"new-145","topic":"L3/requirements","type":"mc","stem":"问 Types of Requirements 时，只写 Functional 和 Nonfunctional 为什么不够？","context":"","options":[{"zh":"因为这两个词分别指内部干系人和外部干系人的需求。","en":"","why":"Functional 与 Nonfunctional 讨论功能和质量属性，不按干系人所在位置划分。"},{"zh":"这两类是 Solution Requirements 的下分，还需说明其他五类需求。","en":"","why":"六大类包括业务、干系人、解决方案、过渡与就绪、项目、质量需求。"},{"zh":"因为这两个词都与需求无关。","en":"","why":"它们确实是解决方案需求中的两类。"},{"zh":"因为只应回答 WBS 和 OBS。","en":"","why":"WBS、OBS 是分解结构，不是需求类型。"}],"answer":[1]},{"id":"new-146","topic":"L3/statement","type":"mc","stem":"“本次不提供网上付款”“假定医院能按时提供测试数据”，应分别放在哪一项？","context":"","options":[{"zh":"Constraints；Product Scope Description。","en":"","why":"不做的功能是排除项；暂按成立的条件是计划假设。"},{"zh":"Assumptions；Exclusions。","en":"","why":"两项对应反了。"},{"zh":"Exclusions 排除项；Assumptions 假设。","en":"","why":"前者明确不做什么，后者说明计划时暂按成立处理的条件。"},{"zh":"Deliverables；Acceptance Criteria。","en":"","why":"这两句没有描述需要交付的成果或接受成果的判据。"}],"answer":[2]},{"id":"new-147","topic":"L3/statement","type":"multi","stem":"客户正式接受已完成的系统，测试人员记录功能检查结果。下列哪些判断正确？","context":"","options":[{"zh":"检查是否符合质量要求属于 Control Quality。","en":"","why":"控制质量关注检查结果与要求是否一致。"},{"zh":"Validate Scope 只接受一份需求定义，不涉及已完成成果。","en":"","why":"它针对已完成的可交付成果。"},{"zh":"通过一次内部测试就等于客户已正式接受。","en":"","why":"内部检查与客户正式接受是不同动作。"},{"zh":"正式接受已完成成果属于 Validate Scope。","en":"","why":"确认范围关注正式接受。"}],"answer":[0,3]},{"id":"new-148","topic":"L3/wbs","type":"mc","stem":"WBS 中编号 2.3 位于 2 之下。这个编号能说明什么？","context":"","options":[{"zh":"2.3 是 2 的下级组成部分。","en":"","why":"编号表达层级归属。"},{"zh":"2.3 必须在 2.2 完成后开始。","en":"","why":"WBS 编号不表示活动依赖顺序。"},{"zh":"2.3 的工期是 2.3 天。","en":"","why":"编号不是持续时间。"},{"zh":"2.3 必须由两名员工执行三天。","en":"","why":"编号不编码这种人员和工期关系。"}],"answer":[0]},{"id":"new-149","topic":"L3/wbs","type":"mc","stem":"一个工作包还无法估算费用、分配责任或判断完成情况。应怎样处理？","context":"","options":[{"zh":"改用 AON 后就不需要说明工作范围。","en":"","why":"网络图需要明确活动，不能解决未定义的范围。"},{"zh":"检查是否需要继续分解，使工作范围足够清楚。","en":"","why":"工作包的粒度应支持估算、分工与控制。"},{"zh":"把整个工作包直接分给一个部门，就可以不再细分。","en":"","why":"指定部门不能解决工作过大、无法估算或判断完成的问题。"},{"zh":"强行要求只由一人一天完成。","en":"","why":"没有“一人一天”的统一工作包规则。"}],"answer":[1]},{"id":"new-150","topic":"L3/responsibility","type":"mc","stem":"WBS 已有“完成预约功能”，现在要先分给软件部，再写明工程师负责、经理批准。分别使用什么？","context":"","options":[{"zh":"Gantt 确定部门名称；TOWS 分配个人责任。","en":"","why":"甘特图表示时间，TOWS 制定策略。"},{"zh":"先用 RAM 把工作分解，再用 OBS 编制活动顺序。","en":"","why":"RAM 表示职责关系，OBS 按组织划分，两者都不负责这两项任务。"},{"zh":"OBS 对应负责组织；RAM 对应个人与责任类型。","en":"","why":"两层分别回答哪个单位承担、每个人承担什么角色。"},{"zh":"RAM 只表示部门层级；OBS 只表示个人审批。","en":"","why":"两者用途颠倒。"}],"answer":[2]},{"id":"new-151","topic":"L3/responsibility","type":"mc","stem":"本课 RAM 图例为 ○负责、☆支持、■通知、□批准。某人一行标有 ■，能据此断定什么？","context":"","options":[{"zh":"他是执行该任务的唯一负责人。","en":"","why":"负责的符号是 ○。"},{"zh":"他有批准这项工作的职责。","en":"","why":"批准的符号是 □。"},{"zh":"他必须给出技术支持。","en":"","why":"支持的符号是 ☆。"},{"zh":"他需要获知这项工作的相关信息。","en":"","why":"■ 表示 Notification 通知。"}],"answer":[3]},{"id":"new-152","topic":"L4/activities","type":"mc","stem":"活动 A 是“确定位置”，B 是“设计指路牌”，D 是“安装指路牌”。条件为 A→B→D。D 的紧前活动是哪项？","context":"","options":[{"zh":"B；A 是通过 B 相连的更早前置活动。","en":"","why":"Immediate Predecessor 是直接等待的前项。"},{"zh":"A，因为 A 最早开始。","en":"","why":"最早开始不等于直接位于 D 之前。"},{"zh":"A 和 B 都必须作为直接紧前项列出。","en":"","why":"A 已通过 B 表达，不能把所有祖先都当成直接紧前项。"},{"zh":"没有，因为 D 有自己的活动名称。","en":"","why":"名称与依赖关系是不同信息。"}],"answer":[0]},{"id":"new-153","topic":"L4/activities","type":"multi","stem":"活动表中 D 的 Duration=4、Immediate Predecessors=B,C。哪些解释正确？","context":"","options":[{"zh":"D 一定在第 4 天结束。","en":"","why":"结束时点还取决于何时能够开始。"},{"zh":"D 自身需要 4 个时间单位。","en":"","why":"Duration 描述持续多久。"},{"zh":"D 必须等 B 和 C 都完成后才可开始。","en":"","why":"本题采用 FS 零滞后，逗号列出多个共同前提。"},{"zh":"B 完成或 C 完成其中一个就足够。","en":"","why":"紧前列表在这里表示同时满足。"}],"answer":[1,2]},{"id":"new-154","topic":"L4/aon","type":"mc","stem":"B、C 都等 A；D 等 B、C。画图时把 B 和 C 串成 A→B→C→D，会造成什么？","context":"","options":[{"zh":"只要画得从左到右就一定正确。","en":"","why":"图形方向和位置不能代替依赖核对。"},{"zh":"正确，因为任何项目活动都必须依次开展。","en":"","why":"项目中可以存在并行活动。"},{"zh":"多加了 B→C 的等待，失去了原来的并行关系。","en":"","why":"活动表只要求 B、C 各自等待 A。"},{"zh":"D 的等待条件正确，因此整张图仍与原表等价。","en":"","why":"虽然 D 仍间接等待 B、C，但图中新增了 B→C 限制。"}],"answer":[2]},{"id":"new-155","topic":"L4/aon","type":"multi","stem":"关于 Merge 汇合与 Burst 分叉，哪些描述正确？","context":"","options":[{"zh":"A 完成后 B、C 可分别开始，是分叉。","en":"","why":"一项活动有多项后续活动。"},{"zh":"汇合处只需等待工期较短的前项。","en":"","why":"比较的是各前项完成时点，必须等最晚者。"},{"zh":"分叉表示各后续活动必须互相等待。","en":"","why":"它只说明共同前项，未自动增加后续间的关系。"},{"zh":"D 等待 B 和 C，是汇合；D 要等两者都完成。","en":"","why":"汇合有多个紧前条件。"}],"answer":[0,3]},{"id":"new-156","topic":"L4/times","type":"mc","stem":"A 工期 4 天。它的两个紧后活动 LS 分别为 12 和 9。逆推时 A 的 LF 应取哪个值？","context":"","options":[{"zh":"9，才能同时满足两项后续的最迟开始限制。","en":"","why":"取最小值，较早的后续开始要求更严格。"},{"zh":"12，因为要尽量晚完成。","en":"","why":"这样会错过另一项活动在 9 开始的要求。"},{"zh":"21，把两个 LS 相加。","en":"","why":"并行后续的限制不能相加。"},{"zh":"4，因为 LF 就是活动工期。","en":"","why":"LF 是完成时点，不是时长。"}],"answer":[0]},{"id":"new-157","topic":"L4/times","type":"mc","stem":"九宫格中 ES=6、EF=10、LS=9、LF=13。工期和总时差分别是多少？","context":"","options":[{"zh":"工期 7，总时差 0。","en":"","why":"13−6 把最迟完成与最早开始混算，不能作为活动工期。"},{"zh":"工期 4，总时差 3。","en":"","why":"DUR=10−6=4；SL=9−6=13−10=3。"},{"zh":"工期 10，总时差 13。","en":"","why":"把完成时点当成了时长。"},{"zh":"工期 3，总时差 4。","en":"","why":"把工期和时差互换了。"}],"answer":[1]},{"id":"new-158","topic":"L4/paths","type":"mc","stem":"项目有两条 20 天的关键路径，另有一条 16 天路径。只把其中一条关键路径缩短 1 天，其他活动不变，项目会怎样？","context":"","options":[{"zh":"变为 16 天，因为短路径成为关键路径。","en":"","why":"没有条件让剩余 20 天路径消失。"},{"zh":"变为 39 天，两条关键路径工期相加。","en":"","why":"并行路径不能相加作为项目工期。"},{"zh":"仍为 20 天，因为另一条关键路径仍决定完工。","en":"","why":"多条关键路径都需要考虑。"},{"zh":"变为 19 天，因为已缩短一条关键路径。","en":"","why":"另一条 20 天路径仍然存在。"}],"answer":[2]},{"id":"new-159","topic":"L4/paths","type":"mc","stem":"一条路线从项目起点走到中间活动就停止，能否作为完整路径参与“所有路径”的枚举？","context":"","options":[{"zh":"能，只要经过了关键活动。","en":"","why":"经过关键活动也不代表路线完整。"},{"zh":"能，只要工期比其他路线长。","en":"","why":"首先要是可行完整路径，才能比较时长。"},{"zh":"不能，因为路径不允许经过汇合点。","en":"","why":"路径可以经过汇合点，每条分支按连线继续枚举。"},{"zh":"不能，还要沿依赖走到终点。","en":"","why":"完整路径必须连接项目开始与结束。"}],"answer":[3]},{"id":"new-160","topic":"L4/slack","type":"mc","stem":"活动总时差 5 天、自由时差 2 天。仅该活动延迟 3 天，其他条件不变，哪项判断正确？","context":"","options":[{"zh":"项目完工可保持，至少一项紧后活动的最早开始会改变。","en":"","why":"3 未超过总时差 5，却超过自由时差 2。"},{"zh":"项目一定延迟 3 天。","en":"","why":"先使用总时差，不能直接把活动延迟当项目延迟。"},{"zh":"紧后活动肯定完全不受影响。","en":"","why":"延迟已超过自由时差。"},{"zh":"总时差和自由时差都变成 3 天。","en":"","why":"3 是本次延迟，并非两种原有余量。"}],"answer":[0]},{"id":"new-161","topic":"L4/slack","type":"mc","stem":"同一条非关键路径原有 4 天余量，路径上两项活动各延长 3 天。为什么不能分别说“各自没有超过 4 天，所以没影响”？","context":"","options":[{"zh":"关键路径只能按活动数量判断。","en":"","why":"关键路径按总工期判断。"},{"zh":"它们共用同一条路径的余量，需要把累计增加的 6 天计入路径。","en":"","why":"6 超过原有余量 4，项目可能被该路径推迟 2 天。"},{"zh":"总时差永远不能用于判断延迟。","en":"","why":"单项变化可以用总时差判断；多项变化需重算网络。"},{"zh":"两项延长会相互抵消。","en":"","why":"都是延长，不会互相抵消。"}],"answer":[1]},{"id":"new-162","topic":"L4/pert","type":"mc","stem":"a=2、m=5、b=8 天。哪种计算同时符合 PERT 的期望工期和标准差？","context":"","options":[{"zh":"TE=(2+5+4×8)/6=6.5；σ=1。","en":"","why":"把四倍权重错误给了悲观值。"},{"zh":"TE=5；σ=TE/6。","en":"","why":"标准差公式使用 b−a，不使用 TE。"},{"zh":"TE=(2+4×5+8)/6=5；σ=(8−2)/6=1。","en":"","why":"最可能值 m 取四倍权重，标准差用极差除以 6。"},{"zh":"TE=(2+5+8)/3=5；σ=8−2=6。","en":"","why":"平均值这次碰巧相同，但标准差算法错误；一般也不能用简单平均代替 PERT。"}],"answer":[2]},{"id":"new-163","topic":"L4/pert","type":"mc","stem":"两个活动的 TE 都是 5 天，标准差分别为 0.5 和 1.5 天。能确定什么？","context":"","options":[{"zh":"第二个活动的期望完成时间应改为 6 天。","en":"","why":"标准差之差不能直接加到期望工期上。"},{"zh":"第一个活动完成概率就是 50%。","en":"","why":"0.5 天是标准差，不是概率。"},{"zh":"相同 TE 表示两个活动在所有给定期限下都有相同的完成概率。","en":"","why":"离期望值相同距离时，不同标准差会产生不同 Z 值。"},{"zh":"两者期望工期相同，第二个活动的工期波动更大。","en":"","why":"均值描述中心，标准差描述波动。"}],"answer":[3]},{"id":"new-164","topic":"L4/z","type":"mc","stem":"在正态近似下，期限恰好等于期望完工时间。Z 和按时完成概率如何理解？","context":"","options":[{"zh":"Z=0，期限左侧面积约为 50%。","en":"","why":"期限与均值没有距离，正态分布在均值两侧各占一半。"},{"zh":"Z=0，所以按时完成概率为 0%。","en":"","why":"Z 是标准化距离，不能直接当百分比。"},{"zh":"Z=1，所以按时完成概率为 100%。","en":"","why":"期限等于均值时，分子为 0。"},{"zh":"Z=1，表示期限就是一个完整的期望工期。","en":"","why":"Z 用“期限减期望值”的差除以标准差，差为 0 时 Z=0。"}],"answer":[0]},{"id":"new-165","topic":"L4/z","type":"multi","stem":"期望工期都为 30 周，期限都为 32 周。项目甲 σ=1 周，乙 σ=4 周。哪些判断正确？","context":"","options":[{"zh":"乙的 Z=8，因为应该用 2×4。","en":"","why":"求 Z 应相除；给 Z 求额外时间才相乘。"},{"zh":"甲的 Z=2，乙的 Z=0.5。","en":"","why":"分别把额外的 2 周除以项目标准差。"},{"zh":"在同样的正态近似下，甲按时完成的把握更大。","en":"","why":"相对自身波动，甲留出的时间更充裕。"},{"zh":"两个项目期限相同，所以按时概率必定相同。","en":"","why":"标准差不同会改变 Z。"}],"answer":[1,2]},{"id":"calc-166","topic":"L4/times","type":"numeric","stem":"活动 D 等待 B、C。B 最早第 8 天完成，C 最早第 11 天完成，D 工期 4 天。按步骤填写。","context":"","fields":[{"label":"D 的 ES","answer":11,"why":"D 必须等两项工作都完成，所以 ES=max(8,11)=11。","unit":"天","tolerance":0.005},{"label":"D 的 EF","answer":15,"why":"EF=ES+DUR=11+4=15。","unit":"天","tolerance":0.005}]},{"id":"calc-167","topic":"L4/times","type":"numeric","stem":"活动 A 工期 4 天，紧后活动 B、C 的 LS 分别为 12、9。","context":"","fields":[{"label":"A 的 LF","answer":9,"why":"LF=min(12,9)=9。","unit":"天","tolerance":0.005},{"label":"A 的 LS","answer":5,"why":"LS=LF−DUR=9−4=5。","unit":"天","tolerance":0.005}]},{"id":"calc-168","topic":"L4/pert","type":"numeric","stem":"PERT 给出 a=3、m=4、b=8 天。","context":"","fields":[{"label":"期望工期 TE","answer":4.5,"why":"TE=(3+4×4+8)/6=27/6=4.5。","unit":"天","tolerance":0.005},{"label":"活动标准差 σ","answer":0.8333333333333334,"why":"σ=(8−3)/6=0.8333…；接受保留三位小数。","unit":"天","tolerance":0.001}]},{"id":"calc-169","topic":"L4/pert","type":"numeric","stem":"已知 TE=7 天、a=3 天、b=11 天，反求最可能工期 m。","context":"","fields":[{"label":"6TE","answer":42,"why":"先乘以 6，得到 a+4m+b=42。","unit":"天","tolerance":0.005},{"label":"4m","answer":28,"why":"4m=42−3−11=28。","unit":"天","tolerance":0.005},{"label":"m","answer":7,"why":"m=28/4=7。","unit":"天","tolerance":0.005}]},{"id":"calc-170","topic":"L4/z","type":"numeric","stem":"期望工期 30 周，项目标准差 2.78 周，期限 32 周；给定 Z=0.72 对应累计概率 0.7642。","context":"","fields":[{"label":"期限比期望多出的时间","answer":2,"why":"32−30=2 周。","unit":"周","tolerance":0.005},{"label":"Z","answer":0.7194244604316548,"why":"Z=2/2.78≈0.72，无单位。","unit":"","tolerance":0.005},{"label":"按时完成概率","answer":76.42,"why":"用题给累计概率 0.7642，换成百分比为 76.42%。","unit":"%","tolerance":0.01}]},{"id":"calc-171","topic":"L4/z","type":"numeric","stem":"期望工期 30 周，项目标准差 2.78 周；题目给出约 95% 的目标对应 Z=1.65。","context":"","fields":[{"label":"额外时间","answer":4.587,"why":"1.65×2.78=4.587 周。","unit":"周","tolerance":0.005},{"label":"完工期限 Due date","answer":34.587,"why":"30+4.587=34.587≈34.59 周。","unit":"周","tolerance":0.005}]},{"id":"new-172","topic":"L5/gantt","type":"mc","stem":"甘特图中，活动 R 的横条从第 5 天到第 8 天，进入 R 的依赖箭头来自 Q。能读出什么？","context":"","options":[{"zh":"R 工期 3 天，Q 是 R 的紧前活动。","en":"","why":"时间差给工期，箭头给依赖。"},{"zh":"R 工期 8 天，Q 只是同一部门。","en":"","why":"8 是完成时点，箭头在这里表示依赖。"},{"zh":"R 工期 5 天，R 必须先于 Q。","en":"","why":"5 是开始时点，依赖方向也反了。"},{"zh":"R 工期 13 天，因为应把开始与完成相加。","en":"","why":"工期等于完成减开始。"}],"answer":[0]},{"id":"new-173","topic":"L5/gantt","type":"mc","stem":"U 的横条紧接 T，但图中还有 S→U 的箭头。转成 AON 时应怎样画？","context":"","options":[{"zh":"只保留 S→U，因为 T 的横条已经画在 U 前面。","en":"","why":"T 的工作时段画在前面不能替代需要保留的 T→U 依赖。"},{"zh":"保留 T→U 与 S→U 两项直接依赖。","en":"","why":"U 要等两项工作，不能只保留看起来紧接的那条。"},{"zh":"只画 T→U，因为横条最靠近。","en":"","why":"依赖由箭头或条件决定，不能按条形距离判断。"},{"zh":"把 S→U 改成 U→S。","en":"","why":"这会倒转等待条件。"}],"answer":[1]},{"id":"new-174","topic":"L5/relationships","type":"mc","stem":"Testing cannot finish until prototype development has finished. 应怎样取出关系名称？","context":"","options":[{"zh":"测试与开发必须同一天开始，所以是 SS。","en":"","why":"句子没有规定两者的开始时点。"},{"zh":"旧任务结束、新任务开始，所以是 SF。","en":"","why":"本句限制的是两项活动的完成关系。"},{"zh":"前项开发的 Finish，后项测试的 Finish，得到 FF。","en":"","why":"关系名按前项、后项排序，不能照英文句子出现顺序随意取词。"},{"zh":"开发完成后测试才能开始，所以是 FS。","en":"","why":"句子限制测试 finish，不是 start。"}],"answer":[2]},{"id":"new-175","topic":"L5/relationships","type":"multi","stem":"A 在第 10 天完成；B 工期 2 天，关系为 FS+4 天。以下哪些说法正确？","context":"","options":[{"zh":"B 最早第 16 天完成，横条长度仍为 2 天。","en":"","why":"等待时间没有改变 B 自身工期。"},{"zh":"B 工期应改为 6 天。","en":"","why":"把 Lag 与活动工期混在一起了。"},{"zh":"B 必须恰好第 14 天开始，其他限制不能使它更晚。","en":"","why":"关系给出最早边界，其他条件可能继续推迟。"},{"zh":"B 最早第 14 天开始。","en":"","why":"从 A 完成时点 10 加 4 天滞后。"}],"answer":[0,3]},{"id":"new-176","topic":"L5/costs","type":"mc","stem":"项目每周使用专用耗材，用得越多费用越高。按归属、频率和用量分别怎样分类？","context":"","options":[{"zh":"Direct、Recurring、Variable。","en":"","why":"能归到项目、反复发生、随用量变化。"},{"zh":"Indirect、Nonrecurring、Fixed。","en":"","why":"三项都与题给条件相反。"},{"zh":"只能选一类，三类不能同时成立。","en":"","why":"它们属于不同分类维度。"},{"zh":"只要每周支付，就是 Expedited。","en":"","why":"加速成本来自加快工作的安排，与每周支付无必然关系。"}],"answer":[0]},{"id":"new-177","topic":"L5/costs","type":"mc","stem":"公司为多个项目共用办公室支付租金；题目未要求按使用量追加租金。哪项最合理？","context":"","options":[{"zh":"只要是固定成本，就不应列入任何预算。","en":"","why":"固定成本仍需预算安排。"},{"zh":"按项目归属看更接近 Indirect；在约定租期与范围内可属于 Fixed。","en":"","why":"成本归属与是否随用量变化是两个维度。"},{"zh":"必定是本项目的 Direct，且只能是 Variable。","en":"","why":"题目给出多个项目共用、租金约定不变。"},{"zh":"只要是租金，就必定 Nonrecurring。","en":"","why":"租金可能按期持续发生。"}],"answer":[1]},{"id":"new-178","topic":"L5/loaded-rate","type":"mc","stem":"基本时薪 $40，Overhead Rate=50%。哪项是 Fully Loaded Rate？","context":"","options":[{"zh":"$90/小时。","en":"","why":"不能把 50% 直接当作 $50 加入。"},{"zh":"$60，没有任何时间单位。","en":"","why":"题目问 rate，应写金额/小时。"},{"zh":"$60/小时。","en":"","why":"40×(1+0.50)=60，包含基本工资和附加部分。"},{"zh":"$20/小时。","en":"","why":"40×0.50 只算附加部分。"}],"answer":[2]},{"id":"new-179","topic":"L5/loaded-rate","type":"mc","stem":"已算出综合人工费率 $61.875/小时，预计工作 80 小时。哪种处理避免中间舍入带来的误差？","context":"","options":[{"zh":"先把费率取整为 62，再把结果称为精确总费用。","en":"","why":"这会得到 4,960，与未舍入计算不同。"},{"zh":"用 61.875÷80 求总人工成本。","en":"","why":"总费用是费率乘工时。"},{"zh":"费率已经包括附加成本，所以无需乘工时。","en":"","why":"费率仍然只是每小时的成本。"},{"zh":"先用 61.875×80，再按题目要求处理最终金额。","en":"","why":"保持中间精度，得到 4,950。"}],"answer":[3]},{"id":"new-180","topic":"L5/budget","type":"multi","stem":"表中第一、二、三周的计划支出分别为 $400、$800、$800。哪些读数正确？","context":"","options":[{"zh":"第 2 周当周支出是 $800。","en":"","why":"读取单期列。"},{"zh":"截至第 2 周累计支出是 $1,200。","en":"","why":"累计包括第 1 周与第 2 周。"},{"zh":"截至第 2 周累计支出是 $800。","en":"","why":"把单期支出当成累计支出。"},{"zh":"全部三周的预算是 $1,200。","en":"","why":"三周合计为 2,000。"}],"answer":[0,1]},{"id":"new-181","topic":"L5/budget","type":"mc","stem":"Time-phased Budget 时间分段预算主要把什么对应起来？","context":"","options":[{"zh":"只列总金额，且不能出现时间列。","en":"","why":"题目术语明确包含时间安排。"},{"zh":"费用与预计发生的时段。","en":"","why":"可据此读取各期和累计计划支出。"},{"zh":"只把员工姓名按字母排序。","en":"","why":"人员名单不是预算的主要对象。"},{"zh":"把各项活动的实际花费按从高到低排序。","en":"","why":"Time-phased budget 按时间安排计划成本，不是实际成本排名。"}],"answer":[1]},{"id":"new-182","topic":"L5/crashing","type":"mc","stem":"项目经理增加关键活动的安装人员；另一方案让可先做的测试与后期开发重叠。两种做法分别是什么？","context":"","options":[{"zh":"两种都只是增加 Lag。","en":"","why":"Lag 是关系中的额外间隔。"},{"zh":"第一种是 Resource Leveling；第二种是 Crashing。","en":"","why":"增加关键活动资源以缩短工期属于 Crashing；让活动重叠属于 Fast Tracking。"},{"zh":"Crashing 赶工；Fast-tracking 快速跟进。","en":"","why":"前者增加资源压缩工期，后者改变重叠安排。"},{"zh":"Fast-tracking；Crashing。","en":"","why":"两种压缩进度的机制颠倒了。"}],"answer":[2]},{"id":"new-183","topic":"L5/crashing","type":"mc","stem":"A 的赶工斜率较低，但 A 不在任何关键路径上；B 在唯一关键路径上。为了提前项目，首先应判断什么？","context":"","options":[{"zh":"直接选择 A，斜率低就一定有效。","en":"","why":"非关键活动可能只增加已有余量。"},{"zh":"只比较两项活动的正常成本，优先压缩正常成本较高的一项。","en":"","why":"正常成本本身不能判断压缩后的项目工期收益或每单位时间的增量费用。"},{"zh":"用总赶工费用除以正常工期，替代斜率。","en":"","why":"斜率应使用费用增量除以时间缩短量。"},{"zh":"压缩哪项活动能缩短决定完工的路径，再比较可行方案的费用。","en":"","why":"低斜率不代表一定能使整个项目提前。"}],"answer":[3]},{"id":"new-184","topic":"L5/aoa","type":"mc","stem":"AOA 箭头“安装电脑，2 天”从事件 1 到事件 2。圆圈中的 2 表示什么？","context":"","options":[{"zh":"事件编号；在这个例子中标记电脑安装完成。","en":"","why":"事件是一个时点标记，编号不是时间值。"},{"zh":"这项活动必定在第 2 天结束。","en":"","why":"结束时间取决于开始时间，不能按事件编号判断。"},{"zh":"还有一项需要做两天的活动。","en":"","why":"AOA 的活动在箭头上，圆圈不是额外工作。"},{"zh":"活动需要两名员工。","en":"","why":"编号不表示资源数量。"}],"answer":[0]},{"id":"new-185","topic":"L5/aoa","type":"multi","stem":"关于 Dummy Activity 虚拟活动，哪些说法正确？","context":"","options":[{"zh":"虚线表示工期暂时未知，考试时应估算。","en":"","why":"Dummy 的工期按定义就是 0。"},{"zh":"工期为 0，但可以表达必须保留的依赖。","en":"","why":"零工期不等于零作用。"},{"zh":"沿路径经过虚线时，需要保留它的逻辑关系，工期加 0。","en":"","why":"虚线可以出现在网络路径中。"},{"zh":"因为不耗时，所以任何虚线都可直接删除。","en":"","why":"删除可能使后续活动过早开始。"}],"answer":[1,2]},{"id":"new-186","topic":"L5/dummy-1015","type":"mc","stem":"D 等 B、C；E 只等 B；G 只等 C。为什么不能直接合并 B、C 的完成事件，再让 D、E、G 都从那里出发？","context":"","options":[{"zh":"因为 AOA 绝不能出现汇合。","en":"","why":"AOA 可以汇合，关键是不能加入题目没有的前提。"},{"zh":"因为每个事件只能接一条箭头。","en":"","why":"多个箭头可以进入或离开同一事件。"},{"zh":"E 会额外等待 C，G 会额外等待 B。","en":"","why":"合并后的事件要求两项都完成，改变了 E、G 的条件。"},{"zh":"只会改变画图位置，不会改变等待关系。","en":"","why":"事件是否发生决定出发活动能否开始。"}],"answer":[2]},{"id":"new-187","topic":"L5/dummy-1015","type":"mc","stem":"B、C 分别结束于事件 3、4；从 3、4 各画一条虚线到事件 5，D 从 5 开始。若删去 3→5 的虚线，会丢失什么条件？","context":"","options":[{"zh":"D 等待 C 的条件。","en":"","why":"C 仍由 4→5 表达。"},{"zh":"B 等待 D 的条件。","en":"","why":"原图没有 B 等待 D，方向相反。"},{"zh":"不会丢失条件，因为被删线的工期为 0。","en":"","why":"工期为 0 仍可表达必要依赖。"},{"zh":"D 等待 B 的条件。","en":"","why":"事件 5 将只通过另一条虚线等待 C。"}],"answer":[3]},{"id":"new-188","topic":"L5/dummy-1015","type":"mc","stem":"G 只应等待 C。某图却让 G 等 B 和 C；原数据中 B 第 8 天、C 第 10 天完成，G 仍从 10 开始。能据此认为图正确吗？","context":"","options":[{"zh":"不能。若 B 改为第 12 天完成，错误图就会无依据地把 G 推到 12。","en":"","why":"一次算出的时间相同，不能证明逻辑依赖相同。"},{"zh":"能，只要最终项目工期相同就足够。","en":"","why":"错误依赖可能被当前数值掩盖。"},{"zh":"能，因为较短活动的箭头永远无意义。","en":"","why":"活动工期会改变，依赖由工作条件决定。"},{"zh":"不能，因为任何项目都不允许并行活动。","en":"","why":"问题是多加等待，而非并行本身。"}],"answer":[0]},{"id":"new-189","topic":"L6/risk-process","type":"mc","stem":"团队先列出潜在问题，再估计概率和后果，然后决定措施，之后跟踪并记录。顺序对应什么？","context":"","options":[{"zh":"Risk Identification → Risk Response Development → Risk Assessment → Risk Response Control。","en":"","why":"应先评估风险再据此选择应对，不能把评估和制定措施颠倒。"},{"zh":"Identification → Analysis → Mitigation strategies → Control and documentation。","en":"","why":"四阶段按发现、评估、应对、跟踪展开。"},{"zh":"Mitigation → Identification → Closing → Budgeting。","en":"","why":"把措施放到识别之前，并混入不对应的阶段名称。"},{"zh":"Control Quality → Validate Scope → Planning → Closing。","en":"","why":"这是其他管理概念，不是四阶段风险过程。"}],"answer":[1]},{"id":"new-190","topic":"L6/risk-process","type":"mc","stem":"团队已经发现供应商可能迟交，正在比较不同延期概率与后果。当前最直接处于哪个阶段？","context":"","options":[{"zh":"Risk Transfer。","en":"","why":"题目没有约定把风险转给另一方。"},{"zh":"Project Closing。","en":"","why":"没有结束项目。"},{"zh":"Analysis of Probability and Consequences。","en":"","why":"正在分析发生可能性及其影响。"},{"zh":"Risk Identification。","en":"","why":"识别已经发生，这里进一步评估。"}],"answer":[2]},{"id":"new-191","topic":"L6/rbs","type":"mc","stem":"“完成系统接口”与“系统接口可能不兼容”，应分别怎样整理？","context":"","options":[{"zh":"两者都只是风险后果评分。","en":"","why":"题目没有给评分，且第一项是工作。"},{"zh":"前者属于 RBS，后者属于 WBS。","en":"","why":"把工作与风险分解对象颠倒了。"},{"zh":"只要都能画成树状图，两者含义相同。","en":"","why":"图形相似不代表分解对象相同。"},{"zh":"前者是 WBS 中的工作；后者可列入 RBS 的技术风险。","en":"","why":"一个是要完成的任务，一个是不确定问题。"}],"answer":[3]},{"id":"new-192","topic":"L6/rbs","type":"mc","stem":"项目资金可能不到位、关键人员可能缺勤、合同责任可能有争议。分别最直接属于什么风险来源？","context":"","options":[{"zh":"Financial、Execution、Contractual or Legal。","en":"","why":"分别涉及资金、执行人员、合同法律责任。"},{"zh":"Technical、Commercial、Financial。","en":"","why":"这些分类未对应题目强调的主要来源。"},{"zh":"全部是 Technical。","en":"","why":"技术风险不能概括所有资金、人员与合同问题。"},{"zh":"全部是 WBS 工作包名称。","en":"","why":"题目描述的是可能发生的不利事件。"}],"answer":[0]},{"id":"new-193","topic":"L6/impact-matrix","type":"mc","stem":"风险 A 和 B 的后果都为 High，可能性分别为 Low、Medium。B 相对 A 应放在哪里？","context":"","options":[{"zh":"直接把 B 写为 RF=0.70。","en":"","why":"定性档位不足以推出具体数值 RF。"},{"zh":"同一后果列，可能性更高的一行。","en":"","why":"只改变 Likelihood 坐标。"},{"zh":"同一可能性行，后果更高的一列。","en":"","why":"题目说明后果不变。"},{"zh":"两项风险必须放在同一格。","en":"","why":"可能性不同，交叉格不同。"}],"answer":[1]},{"id":"new-194","topic":"L6/impact-matrix","type":"multi","stem":"Risk Impact Matrix 与后面的 RF 评分计算，哪些关系正确？","context":"","options":[{"zh":"矩阵的 High 单元格必定等于一个固定 RF 数值。","en":"","why":"没有题给评分就不能反推出具体 RF。"},{"zh":"先按可能性排完所有风险，再用后果只处理并列项。","en":"","why":"矩阵同时考虑两个维度，不规定可能性一律优先。"},{"zh":"都涉及可能性与后果。","en":"","why":"这是共同的分析维度。"},{"zh":"定性矩阵按给定档位定位，RF 题按评分公式计算。","en":"","why":"不能把两种表示方法直接混用。"}],"answer":[2,3]},{"id":"new-195","topic":"L6/risk-score","type":"mc","stem":"本课 Risk Factor 的正确计算式是哪项？","context":"","options":[{"zh":"RF=Pf×Cf。","en":"","why":"这不是本课给定的 RF 公式。"},{"zh":"RF=(所有概率和后果评分的总和)/总项数。","en":"","why":"把两组混在一起，丢失了公式中的组合关系。"},{"zh":"RF=Pf+Cf+Pf×Cf。","en":"","why":"乘积项应减去，写成加号改变了公式。"},{"zh":"RF=Pf+Cf−Pf×Cf。","en":"","why":"分别求概率组和后果组的平均后，代入这一式。"}],"answer":[3]},{"id":"new-196","topic":"L6/risk-score","type":"mc","stem":"计算得 RF=0.704，若金额式习惯先保留两位小数得到 0.70，会产生什么问题？","context":"","options":[{"zh":"可能把 High 错判为 Medium；应先按未舍入值判断。","en":"","why":"0.704 严格大于 0.70。"},{"zh":"没有影响，风险等级只由显示位数决定。","en":"","why":"等级依据真实计算值。"},{"zh":"应直接按 70.4% 的失败概率解释。","en":"","why":"RF 在这里是风险评分，不等同于项目失败概率。"},{"zh":"应把阈值改为 0.71。","en":"","why":"题给高风险条件是 RF>0.70，不能修改。"}],"answer":[0]},{"id":"new-197","topic":"L6/worked-risk","type":"mc","stem":"概率组有 5 个数，后果组有 4 个数。某人仍把概率总和除以 3。他错在哪里？","context":"","options":[{"zh":"概率组有五项，所以后果组也应统一除以五。","en":"","why":"两组各按本组项数平均，分母不必相同。"},{"zh":"照搬了另一道题的指标数量。","en":"","why":"平均值的分母应等于当前这一组的有效指标数。"},{"zh":"只有除以 9 才能同时得到 Pf 与 Cf。","en":"","why":"两组需要分别平均。"},{"zh":"把概率组中最高的三项作为分母的依据。","en":"","why":"当前题目要求全组平均，没有授权只选最高三项。"}],"answer":[1]},{"id":"new-198","topic":"L6/worked-risk","type":"mc","stem":"Pf=0.50、Cf=0.40，RF=0.70。为什么判 Medium 而不是 High？","context":"","options":[{"zh":"因为 Pf 小于 Cf。","en":"","why":"本题 Pf 实际大于 Cf，等级也不由二者大小关系直接决定。"},{"zh":"因为判级只看 Pf，0.50 属于中间水平。","en":"","why":"判级依据 RF，不直接用 Pf 代替。"},{"zh":"Medium 包含 0.30 和 0.70 两个边界；High 要严格大于 0.70。","en":"","why":"注意不等号是否包含等号。"},{"zh":"因为先把 RF 舍去一位小数，按 0.7 的下界归类。","en":"","why":"等级定义已经明确包含 0.70，无需通过舍入改变数值。"}],"answer":[2]},{"id":"new-199","topic":"L6/responses","type":"mc","stem":"企业经验不足，与另一家公司共同投入并承担开发风险；另一个项目向保险方转移约定损失。分别属于什么？","context":"","options":[{"zh":"Transfer；Share。","en":"","why":"两个机制对应反了。"},{"zh":"Accept；Accept。","en":"","why":"两者都安排了其他主体承担风险，并非只是自行接受。"},{"zh":"Risk Identification；Control Quality。","en":"","why":"这些情景已经在采取风险应对。"},{"zh":"Share 分担；Transfer 转移。","en":"","why":"共同承担与把指定后果交给另一方不同。"}],"answer":[3]},{"id":"new-200","topic":"L6/responses","type":"mc","stem":"劳资协议未谈妥，经理知道这一不确定性，但预计会达成协议，决定继续排资源。为什么对应 Accept？","context":"","options":[{"zh":"他知晓风险并选择在这一条件下继续承担。","en":"","why":"接受是有意识的选择，不等于没有识别风险。"},{"zh":"因为他已经通过合同把风险全部转给工会。","en":"","why":"题目没有这种转移安排。"},{"zh":"因为预计能达成协议，已经把风险的发生概率降为零。","en":"","why":"预计能够达成协议不等于风险已消除。"},{"zh":"因为继续排资源已经把后果转移给排程人员。","en":"","why":"安排工作没有把风险后果通过合同等方式转给第三方。"}],"answer":[0]},{"id":"calc-201","topic":"L5/loaded-rate","type":"numeric","stem":"基本时薪 $40，附加成本为基本工资的 50%，工作 60 小时。","context":"","fields":[{"label":"附加成本率对应的乘数","answer":1.5,"why":"包含原来的 100%，所以 1+0.50=1.50。","unit":"","tolerance":0.005},{"label":"Fully Loaded Rate","answer":60,"why":"40×1.50=60。","unit":"$/小时","tolerance":0.005},{"label":"Total Labor Cost","answer":3600,"why":"60×60=3,600。","unit":"$","tolerance":0.005}]},{"id":"calc-202","topic":"L5/crashing","type":"numeric","stem":"正常工期 8 天、成本 $6,000；赶工工期 5 天、成本 $9,600。假设该区间采用线性斜率。","context":"","fields":[{"label":"可缩短的时间","answer":3,"why":"8−5=3 天。","unit":"天","tolerance":0.005},{"label":"费用增量","answer":3600,"why":"9,600−6,000=3,600。","unit":"$","tolerance":0.005},{"label":"Crash Cost Slope","answer":1200,"why":"3,600/3=1,200。","unit":"$/天","tolerance":0.005},{"label":"压缩 2 天的额外费用","answer":2400,"why":"2×1,200=2,400，在可压缩 3 天的范围内。","unit":"$","tolerance":0.005}]},{"id":"calc-203","topic":"L5/relationships","type":"numeric","stem":"原型第 10 天完成，测试工期 2 天，关系为 FS+4。","context":"","fields":[{"label":"测试最早开始","answer":14,"why":"FS 限制开始：10+4=14。","unit":"天","tolerance":0.005},{"label":"测试最早完成","answer":16,"why":"14+2=16，Lag 没有改变测试工期。","unit":"天","tolerance":0.005}]},{"id":"calc-204","topic":"L6/worked-risk","type":"numeric","stem":"概率指标为 0.1、0.5、0.9；后果指标为 0.7、0.5、0.3、0.1。","context":"","fields":[{"label":"Pf","answer":0.5,"why":"(0.1+0.5+0.9)/3=0.50。","unit":"","tolerance":0.005},{"label":"Cf","answer":0.4,"why":"(0.7+0.5+0.3+0.1)/4=0.40。","unit":"","tolerance":0.005},{"label":"RF","answer":0.7,"why":"0.5+0.4−0.5×0.4=0.70。","unit":"","tolerance":0.005},{"label":"风险等级","options":["Low risk","Medium risk","High risk"],"answer":1,"why":"0.70 包含在中风险区间内。"}]},{"id":"write-205","topic":"L1/project","type":"written","stem":"用英文解释 Project 项目。","reference":"A project is a temporary endeavor undertaken to create a unique product, service, or result.","rubric":["Temporary：有明确的开始和结束。","Unique：产出独特的产品、服务或成果。"]},{"id":"write-206","topic":"L1/value","type":"written","stem":"用英文解释 Intangible Values 无形价值。","reference":"Intangible values are non-physical benefits that a project creates for its stakeholders, such as goodwill, brand recognition, reputation, and public benefit.","rubric":["项目为干系人创造的非实物形式的收益。","给出 Goodwill 商誉、Brand recognition 品牌认知、Reputation 声誉或 Public benefit 公共利益等例子。"]},{"id":"write-207","topic":"L1/constraints","type":"written","stem":"用英文解释 Triple Constraint 三重约束。","reference":"The triple constraint comprises scope, time, and cost. Project managers balance these interdependent constraints while meeting quality requirements.","rubric":["准确列出 Scope、Time、Cost。","说明三者相互影响，需要协调以满足质量要求。"]},{"id":"write-208","topic":"L1/process-life","type":"written","stem":"用英文解释 Project Life Cycle 项目生命周期。","reference":"The project life cycle is the series of phases through which a project passes from its beginning to its completion. A typical sequence is defining, planning, executing, and closing.","rubric":["从开始到完成的一系列阶段。","例示 defining、planning、executing、closing；没有把五个过程组写成四个生命周期阶段。"]},{"id":"write-209","topic":"L1/methods","type":"written","stem":"用英文解释 Project Management 项目管理。","reference":"Project management is the application of knowledge, skills, tools, and techniques to project activities to meet project requirements.","rubric":["知识、技能、工具和技术用于项目活动。","目的是满足项目要求。"]},{"id":"write-210","topic":"L1/methods","type":"written","stem":"用英文解释 Agile 敏捷。","reference":"Agile is an iterative and incremental approach in which teams deliver work in short cycles and use feedback to adapt to changing requirements.","rubric":["Iterative and incremental：迭代与增量。","短周期交付，并根据反馈调整。"]},{"id":"write-211","topic":"L1/maturity","type":"written","stem":"用英文解释 Project Management Maturity 项目管理成熟度。","reference":"Project management maturity describes how consistently and systematically an organization applies and improves its project management practices.","rubric":["组织层面的实践能力。","关注方法的系统性、一致性和持续改进，不是项目持续时间。"]},{"id":"write-212","topic":"L2/sites","type":"written","stem":"用英文解释 SITES 项目环境分析。","reference":"SITES examines social, information, technology, economic, and sustainability factors that can influence a project.","rubric":["完整列出 Social、Information、Technology、Economic、Sustainability。","说明这些是影响项目的环境因素。"]},{"id":"write-213","topic":"L2/tows","type":"written","stem":"用英文解释 TOWS Matrix TOWS 矩阵。","reference":"A TOWS matrix matches internal strengths and weaknesses with external opportunities and threats to develop SO, ST, WO, and WT strategies.","rubric":["内部 S/W 与外部 O/T。","通过组合形成 SO、ST、WO、WT 策略，不能只罗列 SWOT 四词。"]},{"id":"write-214","topic":"L2/stakeholders","type":"written","stem":"用英文解释 Stakeholder 干系人。","reference":"A stakeholder is an individual, group, or organization that can affect, be affected by, or perceive itself to be affected by a project decision, activity, or outcome.","rubric":["个人、群体或组织。","能影响项目、受项目影响，或认为自己受影响。"]},{"id":"write-215","topic":"L2/stakeholders","type":"written","stem":"用英文解释 Power–Interest Matrix 权力—关注程度矩阵。","reference":"A power–interest matrix classifies stakeholders by their power and interest to select suitable management strategies. High-power, high-interest stakeholders should be managed closely.","rubric":["两个轴是 Power 和 Interest。","分类用于选择管理策略；高权力高关注对应 Manage Closely。"]},{"id":"write-216","topic":"L2/cooperation","type":"written","stem":"用英文解释 Cooperation–Threat Matrix 合作潜力—威胁潜力矩阵。","reference":"This matrix classifies stakeholders by their potential for cooperation and threat. It supports the strategies of involve, collaborate, defend, and monitor.","rubric":["轴为合作潜力与威胁潜力。","四类策略为 Involve、Collaborate、Defend、Monitor，能够按坐标对应。"]},{"id":"write-217","topic":"L2/structures","type":"written","stem":"用英文解释 Matrix Organization 矩阵型组织。","reference":"A matrix organization combines functional and project structures. Authority is shared between functional and project managers, and team members may report to both.","rubric":["兼有职能与项目结构。","职能经理与项目经理共享权力，可能存在双重汇报。"]},{"id":"write-218","topic":"L2/pmi-pmo","type":"written","stem":"用英文解释 Project Management Office 项目管理办公室。","reference":"A project management office is an organizational unit that supports, standardizes, or coordinates project management across projects.","rubric":["组织内部的单位。","支持、规范或协调项目管理；不是专业协会 PMI。"]},{"id":"write-219","topic":"L2/culture","type":"written","stem":"用英文解释 Organizational Culture 组织文化。","reference":"Organizational culture is a system of shared values, beliefs, and norms that influences how members of an organization behave and work together.","rubric":["共同的价值观、信念与行为规范。","这些共同认识影响成员的行为与协作。"]},{"id":"write-220","topic":"L3/scope","type":"written","stem":"用英文解释 Project Scope 项目范围。","reference":"Project scope is the work required to deliver a product, service, or result with the specified features and functions.","rubric":["交付规定特征与功能所需的工作。","没有只把产品特征本身当成项目范围。"]},{"id":"write-221","topic":"L3/requirements","type":"written","stem":"用英文解释 Requirement 需求。","reference":"A requirement is a condition or capability that a product, service, or result must satisfy to meet a business need or other obligation.","rubric":["需要满足的条件或能力。","来自业务需要或其他义务；能区分功能与非功能要求。"]},{"id":"write-222","topic":"L3/statement","type":"written","stem":"用英文解释 Scope Statement 范围说明书。","reference":"A scope statement describes the project scope, major deliverables, acceptance criteria, and boundaries, including exclusions, constraints, and assumptions.","rubric":["交付范围、主要可交付成果及验收标准。","说明边界，能举出排除项、约束或假设。"]},{"id":"write-223","topic":"L3/statement","type":"written","stem":"用英文解释 Acceptance Criteria 验收标准。","reference":"Acceptance criteria are the conditions that a deliverable must satisfy before it is accepted by the authorized customer or stakeholder.","rubric":["可交付成果必须满足的条件。","用于判断是否接受成果；不是团队做过哪些活动的清单。"]},{"id":"write-224","topic":"L3/wbs","type":"written","stem":"用英文解释 Work Breakdown Structure 工作分解结构。","reference":"A WBS is a hierarchical decomposition of the total project scope into smaller, manageable components, with work packages at the lowest level.","rubric":["对项目总范围作层级分解。","分成便于管理的部分，最低层为 Work Package。"]},{"id":"write-225","topic":"L3/wbs","type":"written","stem":"用英文解释 Work Package 工作包。","reference":"A work package is the lowest-level component of a WBS for which work can be estimated, assigned, scheduled, and monitored.","rubric":["WBS 最低层的组成部分。","能够估算、分配、排程和跟踪。"]},{"id":"write-226","topic":"L3/responsibility","type":"written","stem":"用英文解释 Organizational Breakdown Structure 组织分解结构。","reference":"An OBS is a hierarchical representation of the organization that identifies the units responsible for project work.","rubric":["按组织单位作层级划分。","用于明确负责项目工作的组织；WBS 按工作分。"]},{"id":"write-227","topic":"L3/responsibility","type":"written","stem":"用英文解释 Responsibility Assignment Matrix 责任分配矩阵。","reference":"A RAM links project work to the people or organizational units responsible for it. Each cell indicates a role such as responsibility, support, notification, or approval.","rubric":["把工作与人员或组织单位对应。","交叉格表示负责、支持、通知或批准等角色。"]},{"id":"write-228","topic":"L4/activities","type":"written","stem":"用英文解释 Activity 活动。","reference":"An activity is a distinct, scheduled piece of work performed as part of a project, such as installing computers at a hospital service desk.","rubric":["项目中一项具体的、需要执行的工作。","给出顾名思义的工作例子，未把工期数值当成活动。"]},{"id":"write-229","topic":"L4/aon","type":"written","stem":"用英文解释 Immediate Predecessor 紧前活动。","reference":"An immediate predecessor is an activity that directly precedes another activity in the dependency network. With a zero-lag finish-to-start relationship, it must finish before the successor can start.","rubric":["强调直接在前，区别于更早的间接前置。","在 FS 零滞后条件下，前项完成后后项才能开始。"]},{"id":"write-230","topic":"L4/aon","type":"written","stem":"用英文解释 Activity-on-Node 单代号网络图。","reference":"AON is a network representation in which nodes represent activities and arrows represent dependencies between them.","rubric":["节点表示活动。","箭头表示活动之间的依赖关系。"]},{"id":"write-231","topic":"L4/paths","type":"written","stem":"用英文解释 Critical Path 关键路径。","reference":"The critical path is the longest-duration path through a project network. It determines the minimum project duration under the given dependencies and durations. More than one critical path may exist.","rubric":["按工期求和后最长的路径。","决定给定条件下的项目工期，可能不止一条。"]},{"id":"write-232","topic":"L4/slack","type":"written","stem":"用英文解释 Total Slack 总时差。","reference":"Total slack is the amount of time an activity can be delayed without delaying the project completion date. It equals LS minus ES, or LF minus EF.","rubric":["不推迟项目完工日期的可延迟时间。","SL=LS−ES=LF−EF。"]},{"id":"write-233","topic":"L4/slack","type":"written","stem":"用英文解释 Free Slack 自由时差。","reference":"Free slack is the amount of time an activity can be delayed without delaying the earliest start of any immediately following activity.","rubric":["不影响紧后活动的最早开始。","区别于只关注项目完工日期的 Total Slack。"]},{"id":"write-234","topic":"L4/pert","type":"written","stem":"用英文解释 PERT 三点估算。","reference":"The Program Evaluation and Review Technique (PERT) uses optimistic, most likely, and pessimistic duration estimates to calculate an expected activity duration: TE=(a+4m+b)/6.","rubric":["a 乐观、m 最可能、b 悲观。","TE=(a+4m+b)/6，m 的权重为 4。"]},{"id":"write-235","topic":"L4/z","type":"written","stem":"用英文解释 Z-score 标准分数。","reference":"A Z-score expresses how far a target completion time is from the expected project duration, in units of the standard deviation: Z=(D−TE)/σ.","rubric":["目标日期与期望工期的差，再除以标准差。","解释正负号；Z 本身不是概率。"]},{"id":"write-236","topic":"L5/gantt","type":"written","stem":"用英文解释 Gantt Chart 甘特图。","reference":"A Gantt chart is a time-based bar chart showing the planned start, finish, and duration of project activities. Dependencies can be shown by linking arrows.","rubric":["横轴是时间，横条表示活动的工作时段。","可以读开始、完成与工期；依赖要看箭头或明确条件。"]},{"id":"write-237","topic":"L5/relationships","type":"written","stem":"用英文解释 Lag 滞后时间。","reference":"A lag is a specified waiting time between linked activity events, such as waiting two days after one activity finishes before another can start.","rubric":["活动关系中规定的等待时间。","能用一个有时间数值的例子说明；没有把 Lag 加到活动自身工期里。"]},{"id":"write-238","topic":"L5/costs","type":"written","stem":"用英文解释 Direct Cost 直接成本。","reference":"A direct cost can be traced to a specific project activity or work package, such as the labor or materials used for that work.","rubric":["可以直接归属某项工作。","劳动或材料等例子与定义相符。"]},{"id":"write-239","topic":"L5/loaded-rate","type":"written","stem":"用英文解释 Fully Loaded Labor Rate 全负担人工费率。","reference":"The fully loaded labor rate includes the base wage plus the additional employment costs represented by the burden rate. It equals the base hourly rate multiplied by the loading factor.","rubric":["基本工资加相关附加用工成本。","区分附加百分比和已含基本工资的乘数。"]},{"id":"write-240","topic":"L5/budget","type":"written","stem":"用英文解释 Time-phased Budget 时间分段预算。","reference":"A time-phased budget allocates the planned project costs to the periods in which they are expected to occur. It shows the funding required over time.","rubric":["把计划费用分配到对应时间段。","用于读出各期或累计所需资金。"]},{"id":"write-241","topic":"L5/crashing","type":"written","stem":"用英文解释 Crashing 赶工。","reference":"Crashing shortens the project duration by adding resources or cost to shorten selected activities. An activity must affect the critical path to reduce the project duration.","rubric":["通过增加资源或成本缩短活动工期。","只有影响关键路径才可能缩短项目工期，还要关注其他路径。"]},{"id":"write-242","topic":"L5/aoa","type":"written","stem":"用英文解释 Activity-on-Arrow 双代号网络图。","reference":"AOA is a network representation in which arrows represent activities and nodes represent events marking activity starts or finishes.","rubric":["箭头表示活动。","节点表示开始或完成事件。"]},{"id":"write-243","topic":"L5/dummy-1015","type":"written","stem":"用英文解释 Dummy Activity 虚活动。","reference":"A dummy activity is a zero-duration activity used in an AOA network to preserve the correct dependency logic. It consumes no resources and is normally shown as a dashed arrow.","rubric":["AOA 中表达依赖逻辑。","工期为 0、不消耗资源，通常用虚线箭头。"]},{"id":"write-244","topic":"L6/risk-process","type":"written","stem":"用英文解释 Project Risk 项目风险。","reference":"A project risk is an uncertain event or condition that, if it occurs, has a positive or negative effect on one or more project objectives.","rubric":["尚不确定的事件或条件。","发生后影响项目目标，影响可以为正或负。"]},{"id":"write-245","topic":"L6/rbs","type":"written","stem":"用英文解释 Risk Breakdown Structure 风险分解结构。","reference":"An RBS is a hierarchical grouping of potential sources of project risk. It helps the team identify risks systematically across different categories.","rubric":["按风险来源作层级分类。","用于系统识别风险，而不是排活动工期。"]},{"id":"write-246","topic":"L6/impact-matrix","type":"written","stem":"用英文解释 Risk Impact Matrix 风险影响矩阵。","reference":"A risk impact matrix places risks according to their likelihood and consequences so that the team can compare priorities and select responses.","rubric":["轴是 Likelihood 与 Consequence。","定位后用于比较优先级及考虑应对。"]},{"id":"write-247","topic":"L6/risk-score","type":"written","stem":"用英文解释 Risk Factor 风险因子。","reference":"The risk factor combines the average probability score Pf and the average consequence score Cf: RF=Pf+Cf−PfCf. In this method it is a risk score, not a direct probability of project failure.","rubric":["两组分别平均得到 Pf、Cf。","RF=Pf+Cf−PfCf，不直接解释为失败百分比。"]},{"id":"write-248","topic":"L6/responses","type":"written","stem":"用英文解释 Risk Acceptance 风险接受。","reference":"Risk acceptance means consciously acknowledging a risk and deciding to retain it, with or without a contingency plan. It does not mean failing to identify the risk.","rubric":["已知风险后有意识地接受。","风险仍然存在，不能把接受写成没有识别。"]},{"id":"write-249","topic":"L6/responses","type":"written","stem":"用英文解释 Risk Transfer 风险转移。","reference":"Risk transfer shifts responsibility for specified consequences of a risk to a third party, for example through insurance or contractual arrangements.","rubric":["把指定风险后果的承担责任交给第三方。","保险或合同是合理例子，风险未必消失。"]},{"id":"write-250","topic":"L1/areas","type":"written","stem":"区分 Knowledge Area 知识领域与 Process Group 过程组，并各举两例。","reference":"Knowledge areas describe what is managed, for example scope and risk. Process groups organize management processes, for example planning and monitoring and controlling.","rubric":["知识领域回答管理什么。","过程组组织管理过程。","两边例子没有混淆。"]},{"id":"write-251","topic":"L4/times","type":"written","stem":"在汇合处怎样求 ES，在分支处怎样求 LF？解释为什么。","reference":"At a merge, ES is the maximum EF of the immediate predecessors because all must be complete. In the backward pass, LF is the minimum LS of the immediate successors because every successor must be able to start on time.","rubric":["正推取紧前 EF 最大值。","逆推取紧后 LS 最小值。","分别说明要等全部前项、要满足全部后项。"]},{"id":"write-252","topic":"L6/worked-risk","type":"written","stem":"风险题分别给了 3 个概率评分和 4 个后果评分。写出完整答题顺序及分母。","reference":"First calculate Pf by dividing the sum of the three probability scores by 3. Calculate Cf by dividing the sum of the four consequence scores by 4. Then calculate RF=Pf+Cf−PfCf and classify the result using the given thresholds.","rubric":["先辨认两组，各自求和。","分别除以 3 和 4；不把七项混在一起。","代入 RF，按未舍入结果判级并写结论。"]}],"gantt":[{"id":"g1","title":"Q2–1 · 从横条到路径","focus":"六项活动，识别时点、工期和汇合条件。","rows":[{"id":"P","desc":"准备数据","d":2,"pred":[]},{"id":"Q","desc":"配置系统","d":3,"pred":["P"]},{"id":"R","desc":"测试预约","d":3,"pred":["Q"]},{"id":"S","desc":"编写手册","d":2,"pred":["Q"]},{"id":"T","desc":"修正预约问题","d":2,"pred":["R"]},{"id":"U","desc":"上线","d":1,"pred":["T","S"]}],"read":"S","merge":"U","delay":"S","amount":4},{"id":"g2","title":"Q2–2 · 同时开始不代表有依赖","focus":"从共同前项开始的两项工作，分别通往后续活动。","rows":[{"id":"A","desc":"确认方案","d":2,"pred":[]},{"id":"B","desc":"订购设备","d":5,"pred":["A"]},{"id":"C","desc":"编制培训材料","d":3,"pred":["A"]},{"id":"D","desc":"安装设备","d":2,"pred":["B"]},{"id":"E","desc":"开展培训","d":2,"pred":["C"]},{"id":"F","desc":"验收","d":1,"pred":["D","E"]}],"read":"C","merge":"F","delay":"C","amount":2},{"id":"g3","title":"Q2–3 · 两项工作都做完才能继续","focus":"同一汇合点有两条前置路径，先完成的一支需要等待。","rows":[{"id":"A","desc":"检查现场","d":2,"pred":[]},{"id":"B","desc":"安装线路","d":4,"pred":["A"]},{"id":"C","desc":"配置软件","d":3,"pred":["A"]},{"id":"D","desc":"联调","d":3,"pred":["B","C"]},{"id":"E","desc":"编写说明","d":4,"pred":["C"]},{"id":"F","desc":"试运行","d":2,"pred":["D","E"]},{"id":"G","desc":"移交","d":1,"pred":["F"]}],"read":"E","merge":"D","delay":"C","amount":2},{"id":"g4","title":"Q2–4 · 三项工作汇合","focus":"末项需要三项工作完成；不能只选最晚完成的一项。","rows":[{"id":"A","desc":"确定配置","d":2,"pred":[]},{"id":"B","desc":"安装设备","d":5,"pred":["A"]},{"id":"C","desc":"整理资料","d":4,"pred":["A"]},{"id":"D","desc":"制作标牌","d":3,"pred":["A"]},{"id":"E","desc":"测试设备","d":2,"pred":["B"]},{"id":"F","desc":"开放服务","d":1,"pred":["E","C","D"]}],"read":"D","merge":"F","delay":"D","amount":4},{"id":"g5","title":"Q2–5 · 两条关键路径","focus":"两条路径同时最长，必须完整列出。","rows":[{"id":"A","desc":"准备场地","d":2,"pred":[]},{"id":"B","desc":"安装设备","d":4,"pred":["A"]},{"id":"C","desc":"部署软件","d":3,"pred":["A"]},{"id":"D","desc":"测试设备","d":2,"pred":["B"]},{"id":"E","desc":"测试软件","d":3,"pred":["C"]},{"id":"F","desc":"验收","d":1,"pred":["D","E"]}],"read":"E","merge":"F","delay":"B","amount":1},{"id":"g6","title":"Q2–6 · 跨支路依赖","focus":"一项活动除等待本支工作，还要等待另一支提供输入。","rows":[{"id":"A","desc":"确认需求","d":2,"pred":[]},{"id":"B","desc":"设计接口","d":3,"pred":["A"]},{"id":"C","desc":"准备数据","d":4,"pred":["A"]},{"id":"D","desc":"开发功能","d":4,"pred":["B"]},{"id":"E","desc":"导入数据","d":2,"pred":["B","C"]},{"id":"F","desc":"集成测试","d":2,"pred":["D","E"]},{"id":"G","desc":"上线","d":1,"pred":["F"]}],"read":"E","merge":"E","delay":"C","amount":2},{"id":"g7","title":"Q2–7 · 多个起点","focus":"两项工作从时点 0 开始，后续才发生汇合。","rows":[{"id":"A","desc":"采购设备","d":5,"pred":[]},{"id":"B","desc":"整理场地","d":3,"pred":[]},{"id":"C","desc":"安装设备","d":2,"pred":["A","B"]},{"id":"D","desc":"制定操作流程","d":4,"pred":["B"]},{"id":"E","desc":"人员培训","d":2,"pred":["D"]},{"id":"F","desc":"试运行","d":2,"pred":["C","E"]}],"read":"C","merge":"C","delay":"A","amount":3},{"id":"g8","title":"Q2–8 · 多个终点","focus":"项目要等所有末项完成，不能只看图中最后一行。","rows":[{"id":"A","desc":"确认需求","d":2,"pred":[]},{"id":"B","desc":"配置系统","d":4,"pred":["A"]},{"id":"C","desc":"制作材料","d":3,"pred":["A"]},{"id":"D","desc":"系统测试","d":3,"pred":["B"]},{"id":"E","desc":"开展培训","d":2,"pred":["C"]},{"id":"F","desc":"交付系统","d":2,"pred":["D"]},{"id":"G","desc":"归档材料","d":1,"pred":["E"]}],"read":"G","merge":"D","delay":"G","amount":4},{"id":"g9","title":"Q2–9 · 延迟后关键路径改变","focus":"原来较短的路径延长后，重新比较所有路径。","rows":[{"id":"A","desc":"确认方案","d":2,"pred":[]},{"id":"B","desc":"开发预约","d":4,"pred":["A"]},{"id":"C","desc":"开发查询","d":3,"pred":["A"]},{"id":"D","desc":"测试预约","d":3,"pred":["B"]},{"id":"E","desc":"测试查询","d":2,"pred":["C"]},{"id":"F","desc":"培训人员","d":1,"pred":["A"]},{"id":"G","desc":"试运行","d":2,"pred":["D","E","F"]},{"id":"H","desc":"正式启用","d":1,"pred":["G"]}],"read":"E","merge":"G","delay":"E","amount":3}],"risk":[{"id":"r1","title":"Q3–1 · 三项概率、四项后果","focus":"分别求平均，并识别 RF=0.70 的边界。","p":[0.1,0.5,0.9],"c":[0.7,0.5,0.3,0.1]},{"id":"r2","title":"Q3–2 · 五项概率指标","focus":"概率组分母变为 5，不能沿用上一题的 3。","p":[0.7,0.7,0.5,0.5,0.3],"c":[0.9,0.7,0.3,0.5]},{"id":"r3","title":"Q3–3 · 中风险的下界","focus":"RF 恰好为 0.30，判断是否包含等号。","p":[0.1,0.1,0.1],"c":[0.2222222222222222,0.2222222222222222,0.2222222222222222,0.2222222222222222],"exact":"后果评分各为 2/9；计算时保留分数或完整精度。"},{"id":"r4","title":"Q3–4 · 低风险与风险接受","focus":"低于 0.30 的结果，结合应对情景作判断。","p":[0.1,0.1,0.1],"c":[0.1,0.1,0.1,0.1],"response":"团队知道短时供货波动的风险，预计影响很小，决定承担并继续原计划。","strategy":"Accept 接受"},{"id":"r5","title":"Q3–5 · 舍入会改变等级","focus":"RF=0.704，先判断等级，再按要求写小数。","p":[0.2,0.2,0.2],"c":[0.6,0.6,0.7,0.62]},{"id":"r6","title":"Q3–6 · 指标交错排列","focus":"先按指标性质分组，不能按表格前后位置分组。","p":[0.2,0.4,0.6],"c":[0.3,0.5,0.7,0.5],"mixed":true},{"id":"r7","title":"Q3–7 · 审核一份错误解答","focus":"有人把 RF 写成 Pf×Cf；定位错误并重算。","p":[0.2,0.4,0.6],"c":[0.1,0.3,0.5,0.7],"error":"某同学算出 Pf=0.40、Cf=0.40，随后写 RF=0.40×0.40=0.16，判为 Low。"},{"id":"r8","title":"Q3–8 · 措施实施前后","focus":"后果评分不变，概率评分降低后，比较新旧 RF。","p":[0.6,0.6,0.6],"c":[0.5,0.5,0.5,0.5],"changed":[0.2,0.2,0.2],"response":"团队增加预防性检查，降低设备故障发生的可能性。","strategy":"Mitigate 减轻"},{"id":"r9","title":"Q3–9 · 比较两种方案","focus":"分别计算，两组中某一个平均值较低不代表总体 RF 更低。","p":[0.2,0.2,0.2],"c":[0.8,0.8,0.8,0.8],"second":{"p":[0.5,0.5,0.5],"c":[0.4,0.4,0.4,0.4]}}],"q4":[{"id":"d1","title":"Q4–1 · 三个名词解释","terms":[{"topic":"L1/value","term":"Intangible Values 无形价值","reference":"Intangible values are non-physical benefits that a project creates for its stakeholders, such as goodwill, brand recognition, reputation, and public benefit.","rubric":["项目为干系人创造的非实物形式的收益。","给出 Goodwill 商誉、Brand recognition 品牌认知、Reputation 声誉或 Public benefit 公共利益等例子。"]},{"topic":"L4/paths","term":"Critical Path 关键路径","reference":"The critical path is the longest-duration path through a project network. It determines the minimum project duration under the given dependencies and durations. More than one critical path may exist.","rubric":["按工期求和后最长的路径。","决定给定条件下的项目工期，可能不止一条。"]},{"topic":"L5/dummy-1015","term":"Dummy Activity 虚活动","reference":"A dummy activity is a zero-duration activity used in an AOA network to preserve the correct dependency logic. It consumes no resources and is normally shown as a dashed arrow.","rubric":["AOA 中表达依赖逻辑。","工期为 0、不消耗资源，通常用虚线箭头。"]}]},{"id":"d2","title":"Q4–2 · 三个名词解释","terms":[{"topic":"L1/project","term":"Project 项目","reference":"A project is a temporary endeavor undertaken to create a unique product, service, or result.","rubric":["Temporary：有明确的开始和结束。","Unique：产出独特的产品、服务或成果。"]},{"topic":"L3/wbs","term":"Work Breakdown Structure 工作分解结构","reference":"A WBS is a hierarchical decomposition of the total project scope into smaller, manageable components, with work packages at the lowest level.","rubric":["对项目总范围作层级分解。","分成便于管理的部分，最低层为 Work Package。"]},{"topic":"L6/risk-process","term":"Project Risk 项目风险","reference":"A project risk is an uncertain event or condition that, if it occurs, has a positive or negative effect on one or more project objectives.","rubric":["尚不确定的事件或条件。","发生后影响项目目标，影响可以为正或负。"]}]},{"id":"d3","title":"Q4–3 · 三个名词解释","terms":[{"topic":"L2/tows","term":"TOWS Matrix TOWS 矩阵","reference":"A TOWS matrix matches internal strengths and weaknesses with external opportunities and threats to develop SO, ST, WO, and WT strategies.","rubric":["内部 S/W 与外部 O/T。","通过组合形成 SO、ST、WO、WT 策略，不能只罗列 SWOT 四词。"]},{"topic":"L3/responsibility","term":"Responsibility Assignment Matrix 责任分配矩阵","reference":"A RAM links project work to the people or organizational units responsible for it. Each cell indicates a role such as responsibility, support, notification, or approval.","rubric":["把工作与人员或组织单位对应。","交叉格表示负责、支持、通知或批准等角色。"]},{"topic":"L4/pert","term":"PERT 三点估算","reference":"The Program Evaluation and Review Technique (PERT) uses optimistic, most likely, and pessimistic duration estimates to calculate an expected activity duration: TE=(a+4m+b)/6.","rubric":["a 乐观、m 最可能、b 悲观。","TE=(a+4m+b)/6，m 的权重为 4。"]}]},{"id":"d4","title":"Q4–4 · 三个名词解释","terms":[{"topic":"L2/stakeholders","term":"Stakeholder 干系人","reference":"A stakeholder is an individual, group, or organization that can affect, be affected by, or perceive itself to be affected by a project decision, activity, or outcome.","rubric":["个人、群体或组织。","能影响项目、受项目影响，或认为自己受影响。"]},{"topic":"L4/slack","term":"Total Slack 总时差","reference":"Total slack is the amount of time an activity can be delayed without delaying the project completion date. It equals LS minus ES, or LF minus EF.","rubric":["不推迟项目完工日期的可延迟时间。","SL=LS−ES=LF−EF。"]},{"topic":"L5/gantt","term":"Gantt Chart 甘特图","reference":"A Gantt chart is a time-based bar chart showing the planned start, finish, and duration of project activities. Dependencies can be shown by linking arrows.","rubric":["横轴是时间，横条表示活动的工作时段。","可以读开始、完成与工期；依赖要看箭头或明确条件。"]}]},{"id":"d5","title":"Q4–5 · 三个名词解释","terms":[{"topic":"L2/culture","term":"Organizational Culture 组织文化","reference":"Organizational culture is a system of shared values, beliefs, and norms that influences how members of an organization behave and work together.","rubric":["共同的价值观、信念与行为规范。","这些共同认识影响成员的行为与协作。"]},{"topic":"L3/wbs","term":"Work Package 工作包","reference":"A work package is the lowest-level component of a WBS for which work can be estimated, assigned, scheduled, and monitored.","rubric":["WBS 最低层的组成部分。","能够估算、分配、排程和跟踪。"]},{"topic":"L4/slack","term":"Free Slack 自由时差","reference":"Free slack is the amount of time an activity can be delayed without delaying the earliest start of any immediately following activity.","rubric":["不影响紧后活动的最早开始。","区别于只关注项目完工日期的 Total Slack。"]}]},{"id":"d6","title":"Q4–6 · 三个名词解释","terms":[{"topic":"L2/structures","term":"Matrix Organization 矩阵型组织","reference":"A matrix organization combines functional and project structures. Authority is shared between functional and project managers, and team members may report to both.","rubric":["兼有职能与项目结构。","职能经理与项目经理共享权力，可能存在双重汇报。"]},{"topic":"L2/pmi-pmo","term":"Project Management Office 项目管理办公室","reference":"A project management office is an organizational unit that supports, standardizes, or coordinates project management across projects.","rubric":["组织内部的单位。","支持、规范或协调项目管理；不是专业协会 PMI。"]},{"topic":"L6/rbs","term":"Risk Breakdown Structure 风险分解结构","reference":"An RBS is a hierarchical grouping of potential sources of project risk. It helps the team identify risks systematically across different categories.","rubric":["按风险来源作层级分类。","用于系统识别风险，而不是排活动工期。"]}]},{"id":"d7","title":"Q4–7 · 三个名词解释","terms":[{"topic":"L1/constraints","term":"Triple Constraint 三重约束","reference":"The triple constraint comprises scope, time, and cost. Project managers balance these interdependent constraints while meeting quality requirements.","rubric":["准确列出 Scope、Time、Cost。","说明三者相互影响，需要协调以满足质量要求。"]},{"topic":"L4/aon","term":"Activity-on-Node 单代号网络图","reference":"AON is a network representation in which nodes represent activities and arrows represent dependencies between them.","rubric":["节点表示活动。","箭头表示活动之间的依赖关系。"]},{"topic":"L5/crashing","term":"Crashing 赶工","reference":"Crashing shortens the project duration by adding resources or cost to shorten selected activities. An activity must affect the critical path to reduce the project duration.","rubric":["通过增加资源或成本缩短活动工期。","只有影响关键路径才可能缩短项目工期，还要关注其他路径。"]}]},{"id":"d8","title":"Q4–8 · 三个名词解释","terms":[{"topic":"L3/requirements","term":"Requirement 需求","reference":"A requirement is a condition or capability that a product, service, or result must satisfy to meet a business need or other obligation.","rubric":["需要满足的条件或能力。","来自业务需要或其他义务；能区分功能与非功能要求。"]},{"topic":"L3/statement","term":"Acceptance Criteria 验收标准","reference":"Acceptance criteria are the conditions that a deliverable must satisfy before it is accepted by the authorized customer or stakeholder.","rubric":["可交付成果必须满足的条件。","用于判断是否接受成果；不是团队做过哪些活动的清单。"]},{"topic":"L5/loaded-rate","term":"Fully Loaded Labor Rate 全负担人工费率","reference":"The fully loaded labor rate includes the base wage plus the additional employment costs represented by the burden rate. It equals the base hourly rate multiplied by the loading factor.","rubric":["基本工资加相关附加用工成本。","区分附加百分比和已含基本工资的乘数。"]}]},{"id":"d9","title":"Q4–9 · 三个名词解释","terms":[{"topic":"L2/sites","term":"SITES 项目环境分析","reference":"SITES examines social, information, technology, economic, and sustainability factors that can influence a project.","rubric":["完整列出 Social、Information、Technology、Economic、Sustainability。","说明这些是影响项目的环境因素。"]},{"topic":"L4/z","term":"Z-score 标准分数","reference":"A Z-score expresses how far a target completion time is from the expected p 到对应策略格。","rowTitle":"内部条件","colTitle":"外部条件","rows":["S 优势：临床经验","W 劣势：开发经验不足"],"cols":["O 机会：资助","T 威胁：竞争"],"conditions":[["已有临床团队","S","内部的有利条件。"],["缺少开发经验","W","内部的不足。"],["可申请数字服务资助","O","外部有利机会。"],["其他服务商竞争","T","外部威胁。"]],"tokens":[{"id":"SO","name":"临床团队提出服务方案，申请资助开发","evidence":"使用临床经验与资助机会。","cell":"0,0","why":"S 与 O 组合：利用已有优势把握外部机会。","action":"SO"},{"id":"ST","name":"用临床经验设计更贴合患者需要的服务","evidence":"用专业优势应对同类服务竞争。","cell":"0,1","why":"S 与 T 组合：利用优势应对威胁。","action":"ST"},{"id":"WO","name":"用资助聘请开发人员，补足技术能力","evidence":"借助外部机会改善内部不足。","cell":"1,0","why":"W 与 O 组合：借机会弥补劣势。","action":"WO"},{"id":"WT","name":"先限定功能范围，与成熟供应商合作","evidence":"同时减少开发不足和竞争压力的影响。","cell":"1,1","why":"W 与 T 组合：减少劣势并应对威胁。","action":"WT"}],"free":true},{"id":"power-grid","concept":"power","title":"权力与关注程度：定位并选择策略","intro":"下面四人的位置由给出的权限和关注情况决定。选择一人，再点矩阵中的格子，之后选择合适的沟通策略。","rowTitle":"Power 权力：高在上","colTitle":"Interest 关注程度：高在右","rows":["High power 高权力","Low power 低权力"],"cols":["Low interest 低关注","High interest 高关注"],"actions":["Manage Closely 密切管理","Keep Satisfied 保持满意","Keep Informed 及时告知","Monitor 关注动态"],"tokens":[{"id":"P1","name":"项目赞助人","evidence":"批准预算，并每周参与功能决策。","cell":"0,1","action":0,"why":"既能影响关键决策，又持续关注细节，需要密切管理。"},{"id":"P2","name":"财务主管","evidence":"有权批准额外支出，平时只关心重大超支。","cell":"0,0","action":1,"why":"权力高、日常关注低，提供决策所需信息并保持满意。"},{"id":"P3","name":"护士试用代表","evidence":"每天试用并反馈，不能决定预算和项目方向。","cell":"1,1","action":2,"why":"关注高、决策权低，应及时告知并收集反馈。"},{"id":"P4","name":"未受影响的后勤小组","evidence":"无决策权，目前只需知道系统上线日期。","cell":"1,0","action":3,"why":"两项都低，保持必要的信息关注即可。"}],"variation":{"title":"财务主管开始每天参与","intro":"现在财务主管每天参与功能取舍和费用评审，批准额外支出的权力保持不变。请重新放置财务主管并选择策略。其他三人的条件不变。","token":{"id":"P2","evidence":"有权批准额外支出，现在每天参与功能取舍和费用评审。","cell":"0,1","action":0,"why":"权力仍高，关注程度已由低变高，移到高权力、高关注格，采用 Manage Closely。"}}},{"id":"cooperation-grid","concept":"cooperation","title":"合作潜力与威胁潜力","intro":"一个人或组织可能愿意合作，也有能力使项目受到影响。这两项要分别判断。","rowTitle":"Cooperation 合作：低在上，高在下","colTitle":"Threat 威胁：高在右","rows":["Low cooperation 低合作","High cooperation 高合作"],"cols":["Low threat 低威胁","High threat 高威胁"],"actions":["Monitor 关注动态","Defend 防范威胁","Involve 邀请参与","Collaborate 深入合作"],"tokens":[{"id":"C1","name":"附近未参与项目的机构","evidence":"很少提供协助，也没有影响项目的关键资源。","cell":"0,0","action":0,"why":"Marginal：低合作、低威胁，Monitor。"},{"id":"C2","name":"反对新系统的关键接口方","evidence":"不愿合作，拒绝开放接口会使接入停顿。","cell":"0,1","action":1,"why":"Non-Supportive：低合作、高威胁，Defend。"},{"id":"C3","name":"自愿提供试用反馈的患者代表","evidence":"愿意协助，没有控制资金、接口或审批的能力。","cell":"1,0","action":2,"why":"Supportive：高合作、低威胁，Involve。"},{"id":"C4","name":"关键设备供应商","evidence":"愿意共同调试，同时中断供货会使项目停工。","cell":"1,1","action":3,"why":"Mixed Blessing：高合作、高威胁，Collaborate。"}]},{"id":"risk-grid","concept":"risk-matrix","title":"把风险放入影响矩阵","intro":"按每项风险给定的可能性和后果定位。矩阵颜色不提供 RF 数值，风险评分在下一专题另算。","rowTitle":"Likelihood 可能性：高在上","colTitle":"Consequences 后果：高在右","rows":["High 高","Medium 中","Low 低"],"cols":["Low 低","Medium 中","High 高"],"tokens":[{"id":"A","name":"A：核心设备严重故障","evidence":"发生可能性低，后果高。","cell":"2,2","why":"A 位于低可能性、高后果的交叉格。"},{"id":"B","name":"B：关键人员短期无法到岗","evidence":"发生可能性中，后果高。","cell":"1,2","why":"与 A 相比，后果相同，但可能性更高。"},{"id":"C","name":"C：指路牌需要返工","evidence":"发生可能性低，后果中。","cell":"2,1","why":"与 A 相比，可能性相同，但后果较低。"},{"id":"D","name":"D：关键供应商无法按期交货","evidence":"发生可能性高，后果高。","cell":"0,2","why":"D 同时具有高可能性和高后果，位于右上格。"}],"comparison":{"prompt":"比较 B 与 A，哪项依据正确？","options":["B 的可能性更高，后果等级相同。","A 的后果一定比 B 更严重。","只凭两个位置就能算出各自 RF。"],"answer":0,"why":"B 是中可能性/高后果，A 是低可能性/高后果。矩阵没有给出计算 RF 所需的各项指标。"},"variation":{"title":"设备故障的可能性变化","intro":"新检查结果表明，A 核心设备严重故障的可能性由低升为中，后果仍为高。请重新放置 A，再比较 A 与 B。其他风险不变。","token":{"id":"A","evidence":"发生可能性中，后果高。","cell":"1,2","why":"A 只改变可能性这一维：从低行移至中行，后果仍在高列。"},"comparison":{"prompt":"变化后，A 与 B 在矩阵中的等级有什么关系？","options":["A 的后果变高，所以高于 B。","A 与 B 的可能性和后果等级相同，位于同一格。","A 的可能性变低，所以低于 B。"],"answer":1,"why":"A 与 B 现在都是中可能性、高后果，位于同一格。仅凭该矩阵不能继续细分两者。"}}}],"ram":{"id":"ram-grid","concept":"ram","title":"按分工填写责任矩阵","intro":"三项工作分别由陈工程师、林护士、王经理及行政人员参与。请把每段分工 :"按期完成概率","unit":"%","answer":15.9,"why":"使用题给关系，累计概率约 15.9%。"}],"conclusion":"The probability of completion within 18 days is about 15.9%."}]},{"id":"loaded-calc","concept":"loaded","title":"从小时费率到总人工成本","cases":[{"prompt":"基本时薪为 $37.50，附加比例为 65%，安排 80 小时工作。中间计算保留精度，最终总额保留两位小数。","fields":[{"id":"rate","label":"Fully loaded rate","unit":"美元/小时","answer":61.875,"tolerance":0.006,"why":"37.50×(1+0.65)=61.875 美元/小时。"},{"id":"total","label":"Total labor cost","unit":"美元","answer":4950,"why":"61.875×80=4,950 美元。不要先把费率四舍五入后再放大误差。"}],"conclusion":"The fully loaded rate is $61.875 per hour and total labor cost is $4,950."},{"prompt":"基本时薪为 $40，附加比例为 25%，安排 60 小时工作。求费率与总额。","fields":[{"id":"rate","label":"Fully loaded rate","unit":"美元/小时","answer":50,"why":"40×1.25=50 美元/小时。"},{"id":"total","label":"Total labor cost","unit":"美元","answer":3000,"why":"50×60=3,000 美元。"}],"conclusion":"The fully loaded rate is $50 per hour and total labor cost is $3,000."}]},{"id":"crash-calc","concept":"crash","title":"赶工成本斜率","cases":[{"prompt":"正常工期 5 周、正常成本 $12,000；最短工期 3 周、赶工成本 $32,000。求最多缩短时间、增加成本和成本斜率。","fields":[{"id":"time","label":"最多缩短时间","unit":"周","answer":2,"why":"5−3=2 周。"},{"id":"extra","label":"增加成本","unit":"美元","answer":20000,"why":"32,000−12,000=20,000 美元。"},{"id":"slope","label":"Cost slope","unit":"美元/周","answer":10000,"why":"20,000/2=10,000 美元/周。"}],"conclusion":"The crash cost slope is $10,000 per week, with a maximum reduction of 2 weeks."},{"prompt":"正常工期 6 天、成本 $2,000；最短工期 4 天、成本 $2,600。求赶工斜率。","fields":[{"id":"slope","label":"Cost slope","unit":"美元/天","answer":300,"why":"(2,600−2,000)/(6−4)=300 美元/天。"}],"conclusion":"The crash cost slope is $300 per day."}]},{"id":"rf-calc","concept":"rf-example","title":"风险计算：均值、RF 与等级","cases":[{"prompt":"概率指标：0.7、0.7、0.5、0.5、0.3。后果指标：0.9、0.7、0.3、0.5。分别计算均值和 RF，按未舍入值判级。","fields":[{"id":"np","label":"概率指标数","unit":"项","answer":5,"why":"概率组有 5 项，分母是 5。"},{"id":"nc","label":"后果指标数","unit":"项","answer":4,"why":"后果组有 4 项，分母是 4。"},{"id":" function edgeRoute(rects,from,to,index=0){
 const a=rects[from],b=rects[to],right=b.x>a.x+8,same=Math.abs(a.x-b.x)<=8,gap=10+(index%3)*3;

 const s={x:source.x+(right||same?gap:-gap),y:source.y},t={x:target.x+(right?-gap:gap),y:target.y};
 const boxes=Object.values(rects),clear=(p,q)=>boxes.every(r=>p.x===q.x?!(p.x>r.x-3&&p.x<r.x+r.w+3&&Math.max(p.y,q.y)>r.y-3&&Math.min(p.y,q.y)<r.y+r.h+3):!(p.y>r.y-3&&p.y<r.y+r.h+3&&Math.max(p.x,q.x)>r.x-3&&Math.min(p.x,q.x)<r.x+r.w+3));
 const xs=[s.x,t.x,...boxes.flatMap(r=>[Math.max(5,r.x-gap),r.x+r.w+gap])],ys=[s.y,t.y,...boxes.flatMap(r=>[Math.max(5,r.y-gap),r.y+r.h+gap])],paths=[];
 for(const x of xs)paths.push([s,{x,y:s.y},{x,y:t.y},t]);
 for(const y of ys)paths.push([s,{x:s.x,y},{x:t.x,y},t]);
 const valid=paths.filter(p=>p.every((v,i)=>!i||clear(p[i-1],v))).sort((p,q)=>length(p)-length(q));
 function length(p){return p.reduce((n,v,i)=>n+(i?Math.abs(v.x-p[i-1].x)+Math.abs(v.y-p[i-1].y):0),0);}

}
